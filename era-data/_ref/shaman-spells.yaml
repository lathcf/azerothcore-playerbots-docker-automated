  tidal_mastery:
    survives: true
    stock_ids: [16194, 16218, 16219, 16220, 16221]   # [talent][passive], 5 ranks
    form: "aura107 ADD_FLAT_MODIFIER misc7 CRITICAL_CHANCE +1/2/3/4/5% (basePoints 0/1/2/3/4) on the LB/CL/HW/LHW/CH/Lightning-Shield set (maskA 1475). EXACT Vanilla (1-5% crit of healing+lightning)."
    disposition: grant   # fully faithful.
  windfury_weapon:
    survives: true       # base spell — not itself a divergence, recorded because Elemental Weapons targets it.
    stock_ids: [8232, 8235, 10486, 16362, 25505]   # ranks 1-5 (58801/58803/58804 = WotLK ranks 6-8, ignore for Vanilla)
    form: "Effect_1=54 ENCHANT_ITEM_TEMPORARY (nature), family=11 word-B bit11 (SHARED with FT/FB Weapon). The imbue's extra-attack AP scales off the enchant, boosted by Elemental Weapons — see below."
    disposition: n/a     # base spell; the talent is Elemental Weapons.
  elemental_weapons:
    survives: false      # WotLK rework — scope + per-weapon %s differ.
    stock_ids: [16266, 29079, 29080]   # [talent][passive], 3 ranks
    form: >
      WotLK 16266 (r1) = three aura108 ADD_PCT_MODIFIER effects. REAL masks (dumped 2026-08-21):
      Effect_1 misc12 (SPELLMOD_EFFECT2), maskB 2097152 (word-B bit21) + maskC 8388608 (word-C bit23);
      Effect_2 misc12, maskA 1048576 (word-A bit20); Effect_3 misc0, ALL masks 0. CORRECTION: these do
      NOT resolve to the weapon-imbue identities — the imbues are Flametongue/Frostbrand/Windfury Weapon
      = word-B bit11 (2048) and Rockbiter = word-A bit22 (4194304), NONE of which appears in 16266's
      masks. Word-B bit21 (2097152) is the Windfury TOTEM pulse's bit (8515), NOT a weapon; and word-C
      bit23 (8388608) matches ZERO spells anywhere in Spell.dbc as an identity bit (swept — 0 hits), so
      it resolves to no known imbue. The WotLK spell is opaquely reworked and does not map onto the
      Vanilla scope. Vanilla (skeleton) = DISTINCT per-weapon %s: Rockbiter AP +7/14/20%, Windfury
      Weapon effect +13/27/40%, Flametongue+Frostbrand Weapon damage +5/10/15%.
    disposition: clone   # NOT expressible as a grant (the Vanilla per-weapon %s differ, and FT/FB/WF
                         # Weapon SHARE word-B bit11 so one spellmod can't give them different %s from
                         # each other). Task 7 needs per-weapon effects: Rockbiter (unique wordA bit22)
                         # gets its own +7/14/20% AP mod; Windfury Weapon its +13/27/40% (bind the WF
                         # imbue's effect, not the shared bit11 alone); FT+FB share bit11 at +5/10/15%
                         # (a single mod is CORRECT for those two since they take the same %). FLAG as
                         # a multi-effect reconstruction; helper ids in 9324xx if a clone is chosen.
    redesign_2026_08_23: >
      Task-10-blocking review found the Task-6 authoring above (bind Rockbiter's own bit22 + the FT/FB
      imbue-passive shared bit11) does NOT reach any of the three magnitudes at runtime — traced against
      Player::UpdateDamageDoneMods/CastItemCombatSpell (Player.cpp/PlayerStorage.cpp),
      spell_sha_flametongue_weapon/spell_sha_windfury_weapon (spell_shaman.cpp), and
      SpellEffectInfo::CalcValue/Unit::ApplyEffectModifiers (SpellInfo.cpp/Unit.cpp):
        - Rockbiter (8017): AP is a FLAT SpellItemEnchantment.dbc value consumed by
          `UpdateDamageDoneMods`'s `case ITEM_ENCHANTMENT_TYPE_DAMAGE: amount += enchantmentEntry->
          amount[i]` — no spell cast, no CalcValue, ZERO spellmod path. A bind here is CODE-VERIFIED
          INERT (not just unobserved). ACCEPTED GAP, core-patch-flagged (not written); no effect
          authored.
        - Windfury: `spell_sha_windfury_weapon::HandleProc` computes the bonus via
          `sSpellMgr->GetSpellInfo(8232)->Effects[EFFECT_1].CalcValue(player)` — caster IS passed, so
          this resolves against **Windfury WEAPON 8232's own identity (word-B bit11)**, the SAME bit
          Flametongue/Frostbrand Weapon carry. The old FT/FB bit11 mod (+5/10/15%) therefore ALSO hit
          this call, stacking onto Windfury's own +13/27/40% mod on Windfury Attack (25504/33750, word-A
          bit23, UNIQUE) — measured 5+13=18%, 10+27=37%, 15+40=55% (r1/r2/r3), matching the reported
          leak exactly. Windfury Attack's bit23 bind was already correct and is unchanged; the fix is to
          stop binding bit11 at all.
        - Flametongue: the hidden passive DUMMY aura (10400, `spell_script_names` row "-10400") computes
          its raw magnitude via `GetSpellInfo()->Effects[EFFECT_0].CalcValue()` — ZERO ARGUMENTS,
          caster=nullptr, so `SpellEffectInfo::CalcValue`'s `if (caster) {...ApplyEffectModifiers...}`
          never runs — INERT regardless of bound bit. The script's result is re-cast via
          `CastCustomSpell(10444 Flametongue Attack, SPELLVALUE_BASE_POINT0, totalDamage, ...)`, a
          normal cast WITH caster=player, so CalcValue DOES run ApplyEffectModifiers there — against
          **Flametongue Attack 10444's own identity (word-A bit21, UNIQUE among real family=11 spells —
          dbc sweep 2026-08-23 clean except 10400 itself, unreachable via caster, and an orphaned unused
          "Flametongue Weapon Proc" 8026 with no live caller)**.
        - Frostbrand: has NO custom AuraScript; its attack (8034, word-A bit24, UNIQUE) is cast directly
          by `Player::CastItemCombatSpell`'s generic `ITEM_ENCHANTMENT_TYPE_COMBAT_SPELL` loop with a
          normal player caster throughout, so its own identity resolves spellmods normally.
      FIX (shipped in node 18827): bind ONLY Windfury Attack (bit23, unchanged) + Flametongue Attack
      (10444, bit21) + Frostbrand Attack (8034, bit24) in one `op:allEffects` effect for the FT/FB pair.
      Rockbiter authors no effect — documented gap, per-case core-patch decision flagged to the user,
      none written.

