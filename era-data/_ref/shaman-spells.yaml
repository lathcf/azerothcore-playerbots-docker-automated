# Stock Shaman spell reference — live-verified from Spell.dbc (SpellClassSet=11,
# SPELLFAMILY_SHAMAN) + `lookup spell`/`lookup skill` on the dev-box worldserver console
# (2026-08-21) + this fork's OWN headers (never from memory). See druid-spells.yaml /
# paladin-spells.yaml for the shape this mirrors and the general verification method.
#
# CLASS/FAMILY INVERSION WARNING (framework §Adding a class): Shaman = **class id 7, spell
# family 11** — the MIRROR of Druid (class id 11, spell family 7). A bare `7` means Shaman as a
# class token but Druid's family in a family-mask sweep, and a bare `11` inverts it. Every
# player-cast spell below dumped SpellClassSet=11; the datasets author `class: 7`.
#
# Verification method (Phase 10 Task 3):
#   - Spell.dbc / SkillLine.dbc / SkillLineAbility.dbc pulled live out of the running container:
#       docker exec ac-worldserver cat /azerothcore/env/dist/data/dbc/Spell.dbc > .../Spell.dbc
#     (the running worldserver was built BEFORE shaman content exists — irrelevant: Task 3 reads
#      only STOCK, era-independent spells/DBC.)
#   - spells: flagsA/flagsB/flagsC = SpellClassMask_1/_2/_3 (the spell's OWN identity mask — what
#     a SPELLMOD's EffectSpellClassMask must intersect to bind it), read straight from that DBC via
#       python3 tools/dump_spell_family.py <Spell.dbc> tools/spell_dbc_columns.txt --names "..."
#     (EXACT Name_Lang_enUS, comma-separated; matches EXACT strings case-insensitively, NOT
#      substrings). Every homonym returned was inspected; the recorded mask is the SHARED mask
#      across the real player-cast ranks. family=0 / other-family homonyms are noise (creature and
#      cross-class spells) and are NOT recorded unless they collide on a bit.
#   - Effect-level detail (Effect_N / EffectAura_N / EffectBasePoints_N / EffectMiscValue_N /
#     EffectTriggerSpell_N / EffectSpellClassMaskA/B/C_N / ProcChance / ProcTypeMask / RecoveryTime
#     / Category / CategoryRecoveryTime / DurationIndex / ManaCost / ManaCostPct / ProcCharges) via
#       python3 tools/dump_spell_effects.py <Spell.dbc> tools/spell_dbc_columns.txt --ids <id> --cols ...
#     Aura/effect/spellmod numbers resolved against the fork's OWN headers, never memory:
#       SPELL_AURA_*   -> azerothcore-wotlk/src/server/game/Spells/Auras/SpellAuraDefines.h
#       SPELL_EFFECT_* -> azerothcore-wotlk/src/server/shared/SharedDefines.h
#       SPELLMOD_*     -> azerothcore-wotlk/src/server/game/Spells/SpellDefines.h
#         (0 DAMAGE, 7 CRITICAL_CHANCE, 8 ALL_EFFECTS, 10 CASTING_TIME, 12 EFFECT2, 14 COST,
#          15 CRIT_DAMAGE_BONUS)
#       SPELLFAMILY_SHAMAN = 11 (SharedDefines.h)
#   - grants:/triggers: stock ids + survival: verdicts resolved on the LIVE dev-box worldserver via
#       python3 tools/wgconsole.py <out> "lookup spell <name>" "wait:N" ...   (FIRST arg = OUTFILE)
#     Raw output kept at /tmp/claude-1000/sham_family.out, sham_lookup.out.
#   - skillLines: SkillLineAbility.dbc (spell->skillLine) + SkillLine.dbc (skillLine->name) parsed
#     with a short inline WDBC reader (same layout as dump_spell_family.py).
#   - Vanilla behaviour/magnitudes cross-checked against the imported skeleton tooltips
#     (era-data/_skeletons/vanilla-shaman.skeleton.yaml) — the project's canonical 1.12 source for
#     this pass — plus wowhead/warcraft.wiki Classic where the skeleton was silent.
#
# NB DBC value convention: a stock aura/effect stores value-1 with DieSides=1 (roll adds 1..1), so
# the effective magnitude = EffectBasePoints_N + 1 (confirmed against druid Sharpened Claws
# basePoints 1/3/5 -> +2/4/6%). Recorded magnitudes below already apply the +1.
# ProcChance == 101 is the DBC "not a proc-chance spell" sentinel (>100), not a real 101% chance.
#
# ID-SPACE LEGEND (two conventions used throughout this file):
#   - A bare id after a SPELL name (e.g. "Stormstrike 17364", `id: 403`) = a live Spell.dbc spell id.
#   - A parenthetical id after a TALENT name (e.g. "Restorative Totems (18840)", "node 18800") = the
#     imported skeleton's TALENT-NODE id (the 18800-18845 band, from vanilla-shaman.skeleton.yaml),
#     NOT a Spell.dbc id. These never appear in a `lookup spell`. When both matter for one ability,
#     the text says "spell NNNNN" vs "node NNNNN" explicitly.
#
# HELPER-ID CHECK (Task 3 Step 1) — run 2026-08-21, result ALL FREE:
#   grep -rn "9324[0-9][0-9]" era-data/ modules/mod-era-talents/data/sql/
#     client-addons-src/EraTalents/data/  -> no hits. (Shaman's reserved helper band is
#   932400-932499 per the framework registry; the 9324xx range is clear for Tasks 6-9.)

