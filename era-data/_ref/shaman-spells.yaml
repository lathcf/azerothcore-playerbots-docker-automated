baselineLeakCandidates: >
  NONE positively identified. Per the framework §"Vanilla-talent-that-became-baseline", a leak is a
  spell that was a Vanilla TALENT but a WotLK trainer/level BASELINE (obtainable without the talent).
  All four ACTIVE shaman talents — Stormstrike (spell 17364), Elemental Mastery (spell 16166),
  Nature's Swiftness (spell 16188), Mana Tide Totem (spell 16190) — remained TALENT-gated in WotLK
  (each `lookup` shows the ability as [talent], with only glyphs/set-bonuses/higher-internal-ranks
  alongside), so none leaks via a trainer. (Their skeleton talent-node ids are 18830/18814/18843/18845
  respectively — do not confuse the two id-spaces; see the header legend.) The remaining nodes are passives (spellmods/stats/procs) whose talent spell is never
  trainable. The base spells the spellmods target (Lightning Bolt, shocks, heals, totems, weapon
  imbues) are baseline shaman abilities in BOTH eras — correct to be freely available, not leaks.
  ACTION for Tasks 6-9: none required, BUT verify at authoring time that Stormstrike (17364) and
  Mana Tide Totem (16190) have no ungated `trainer_spell` row for a Vanilla shaman (the checked
  precedent — warrior Shield Slam / mage Ice Block were trainer-baseline leaks). If a clone replaces
  the stock active (EM/NS/Stormstrike/Mana-Tide all clone), apply the standard version-swap gate
  (strip the stock id in Vanilla, grant the clone) per the framework's CUSTOM-rank discipline.

