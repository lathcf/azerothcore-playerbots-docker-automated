totemOverBind:           # THE recorded resolution of the Task-3 totem-family-bit question.
  sharedBit29:
    value: 536870912     # word A bit29 (0x20000000) = the shared "totem" family bit.
    carriedBy: ["Strength of Earth Totem", "Windfury Totem", "Flametongue Totem", "Mana Tide Totem",
                "Grounding Totem", "Earthbind Totem", "Stoneskin Totem", "Nature Resistance Totem",
                "Fire Nova Totem (bit29|bit27)"]
    consequence: >
      A spellmod binding word-A bit29 by full identity OVER-BINDS onto EVERY totem above (core
      SpellInfo::IsAffected ANDs the flag words, so a shared bit matches all carriers — the
      paladin-aura precedent). Any talent that must hit a SUBSET of these totems can NOT be scoped
      by the summon's family mask alone (there is no unique word-A/B/C bit for SoE, Stoneskin, or
      Grounding at the SUMMON level). Tasks 6-8 MUST use `affectsMask` on the totem's UNIQUE PULSE
      spell, or a non-spellmod mechanism, for: Enhancing Totems (SoE + the absent GoA), Guardian
      Totems (Stoneskin + Grounding + the absent Windwall), Improved Weapon Totems (WF + FT totems
      — their pulses 8515 wordB bit21 / 52109 wordA bit25 ARE unique, so bind those), Improved Fire
      Totems / Call of Flame (Fire Nova shares bit29; Searing bit4 + Magma bit12 are unique).
  cleanBit19:
    value: 524288        # word A bit19.
    carriedBy: ["Mana Spring Totem (summon)", "Healing Stream Totem (summon)"]
    alsoCarriedByNpcOnly: ["Corrupted Healing Stream Totem (23422/32135)", "Corrupted Air Totem (32137)", "Rejuvinating Totem (62699)"]
    consequence: >
      CORRECTED 2026-08-21 (full family=11 sweep): bit19 is NOT exclusive to the two player totems —
      three NPC-only spells also carry mask (524288,0,0): Corrupted Healing Stream Totem (23422/32135),
      Corrupted Air Totem (32137), Rejuvinating Totem (62699). BUT the only PLAYER-CASTABLE spells that
      carry bit19 are Mana Spring + Healing Stream Totem, so Restorative Totems (18840, "Mana Spring +
      Healing Stream effect") binding bit19 is still SAFE — the NPC totems are never player-reachable,
      so the over-bind is inert in practice. It boosts the EFFECT (mana/health restored) which lives on the PULSE
      spells (52031 / 52041), whose shared bit is A bit26 (67108864) — but bit26 is ALSO on the Mana
      Tide pulse (39610), so binding the pulses by bit26 would leak onto Mana Tide. Prefer the
      unique per-pulse bits (Mana Spring pulse A bit14 16384 / Healing Stream pulse A bit13 8192) or
      the clean summon bit19. Recorded so Task 9 does not re-investigate.
  allTotemsCostMod: >
    Totemic Focus (18835, -mana of ALL totems) and Totemic Mastery (18838, +radius of friendly
    totems) WANT every totem, so over-binding among totems is harmless — author them with a broad
    `affects:` totem list (SPELLMOD_COST / radius). There is no single mask covering every totem
    (summon bits are diverse: bit4/bit12/bit29/bit19/bit3), so the emitted EffectSpellClassMask is
