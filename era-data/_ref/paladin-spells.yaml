  reckoning:         { 1: 20177 }   # "20177 - Reckoning, rank 1 [talent] [passive]"; aura42 PROC_TRIGGER_SPELL (extra attack on being hit). chain 20177/20179/20181/20182/20180 (5 ranks). Vanilla-faithful.
  redoubt:           { 1: 20127 }   # "20127 - Redoubt, rank 1 [talent] [passive]"; aura42 PROC_TRIGGER_SPELL + aura150 MOD_SHIELD_BLOCKVALUE_PCT. chain 20127/20130/20135 (3 ranks). Vanilla-faithful shape.
  eye_for_an_eye:    { 1: 9799 }    # "9799 - Eye for an Eye, rank 1 [talent] [passive]"; Effect6 aura4 DUMMY +4 (reflect % of spell crit dmg). chain 9799/25988 (2 ranks). Vanilla-faithful.
  illumination:      { 1: 20210 }   # "20210 - Illumination, rank 1 [talent] [passive]"; mana refund on Holy crit. chain 20210/20212/20213/20214/20215 (5 ranks). Vanilla-faithful.
  # -- Vanilla talent-only actives that became TRAINER-BASELINE in WotLK (grant the trainer spell) --
  consecration:      { 1: 26573 }   # "26573 - Consecration, rank 1" (NOT [talent] — trainer-baseline in WotLK). Effect27 PERSISTENT_AREA_AURA aura3 PERIODIC_DAMAGE. Vanilla = Holy talent → grant 26573 as the talent active.
  blessing_of_kings: { 1: 20217 }   # "20217 - Blessing of Kings, rank 1" (NOT [talent] — trainer-baseline in WotLK). aura137 MOD_TOTAL_STAT_PERCENTAGE +10 + aura166 MOD_ATTACK_POWER_PCT. Vanilla = Prot talent → grant 20217.

