                         # disposition (grant | spellmod | clone | reconstruct). Confirmed empirically
                         # (pids.out), NOT assumed.
  seal_of_the_crusader:
    survives: false      # the player-castable SEAL is GONE (folded into Seal of Vengeance/Corruption in TBC).
    stock_ids: [23300, 28852, 33557]  # only LEFTOVER passives remain: 23300 "Seal of the Crusader Judgement Increase" [passive], 28852/33557 "Improved Seal of the Crusader" [passive]. NO castable seal.
    form: "active seal ABSENT; only orphan passive bonuses survive"
    disposition: reconstruct  # if Vanilla Ret/Holy needs the +holy-damage/haste seal, author it as a CUSTOM spell in [920000,933000).
  judgement_of_the_crusader:
    survives: false      # `lookup spell Judgement of the Crusader` -> "No spells found!"
    stock_ids: []
    form: ABSENT
    disposition: reconstruct  # the Seal-of-the-Crusader judgement debuff (holy-dmg-taken increase) must be authored if needed.
  seal_of_command:
    survives: true
    stock_ids: [20375]   # "20375 - Seal of Command, rank 1 [talent]"
    form: "Ret [talent], aura42 PROC_TRIGGER_SPELL(20424); same shape as Vanilla, damage magnitude retuned"
    trainer_baseline_wotlk: false   # it is a TALENT in WotLK (and in Vanilla) — never trainer-taught.
