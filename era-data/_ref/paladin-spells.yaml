# Stock Paladin spell reference — live-verified from Spell.dbc (SpellClassSet=10, SPELLFAMILY_PALADIN) +
# `lookup spell` on the dev-box worldserver console (2026-08-18). DO NOT guess ids/flags; see
# warrior-spells.yaml / rogue-spells.yaml for the shape this mirrors and the general verification method.
#
# Verification method (Phase 8 Task 3):
#   - Spell.dbc pulled live out of the running container:
#       docker exec ac-worldserver cat /azerothcore/env/dist/data/dbc/Spell.dbc > /tmp/claude-1000/dbc/Spell.dbc
#     (kept in place — Tasks 6-8 reuse it for dump_spell_effects.py)
#   - spells: flagsA/flagsB/flagsC = SpellClassMask_1/_2/_3 (the spell's OWN identity mask — what a
#     SPELLMOD's EffectSpellClassMask must intersect to bind it), read straight from that DBC via
#       python3 tools/dump_spell_family.py <Spell.dbc> tools/spell_dbc_columns.txt --names "..."
#     Every rank/homonym returned was inspected; the recorded mask is the SHARED mask across the
#     player-cast ranks, and NPC/decoy ids sharing the NAME but a different family (or family=10 with
#     an EMPTY mask) are called out explicitly. flagsA bit31 dumps as the SIGNED int -2147483648; it is
#     recorded here as the UNSIGNED uint32 (2147483648 = 0x80000000) because that is how the DB stores
#     a SPELLMOD EffectSpellClassMask.
#   - Effect-level detail (Effect_N / EffectAura_N / EffectBasePoints_N / DurationIndex) came from
#       python3 tools/dump_spell_effects.py <Spell.dbc> tools/spell_dbc_columns.txt --ids <id> --cols ...
#     Aura/effect numbers resolved against the fork's OWN headers, never from memory:
#       SPELL_AURA_* -> azerothcore-wotlk/src/server/game/Spells/Auras/SpellAuraDefines.h
#       SPELL_EFFECT_* -> azerothcore-wotlk/src/server/shared/SharedDefines.h
#   - grants:/triggers: stock ids + the survival: verdicts resolved on the LIVE dev-box worldserver via
#       python3 tools/wgconsole.py <out> "lookup spell <name>" "wait:N" ...
#     Raw output kept at /tmp/claude-1000/pids.out + skill.out.
#
# HELPER-ID CHECK (Task 3 Step 1) — run 2026-08-18, result ALL FREE:
#   grep -rn "9326[0-9][0-9]" era-data/ modules/mod-era-talents/data/sql/
#     client-addons-src/EraTalents/data/  -> no hits (paladin reserves the 9326xx hand-assigned helper
#   block for any authored/reconstructed custom spell in Tasks 6-8).

familyName: 10           # PALADIN (confirmed: every player-cast spell below dumped SpellClassSet=10)

skillLines:              # live-confirmed via `lookup skill` (skill.out). Paladin tree spellbook tabs;
                         # a wrong skillLine just misplaces a reconstruction's spellbook tab.
  holy: 594              # "594 - Holy"        (NOTE 56 = Priest Holy, 772 = DK Unholy — different classes)
  protection: 267        # "267 - Protection"  (NOTE 257 = Warrior Protection — different class)
  retribution: 184       # "184 - Retribution" (paladin-only, no homonym)

spells:                  # SpellClassMask_1..3 identity of each stock base spell a SPELLMOD `affects:`
                         # would bind by family mask (rank-1 id). Bit position noted in the comment.
                         # (family=10 unless noted.)
  # --- Holy tree casters / SPELLMOD targets --------------------------------------------------------
  "Holy Light":          { id: 635,   flagsA: 2147483648, flagsB: 0,         flagsC: 0 }  # A bit31 (0x80000000; dbc-signed -2147483648). ranks 635/639/647/1026/1042/3472/10328/10329/25292/27135/27136/48781/48782. (many family=0 "Holy Light" decoys — heals on items/NPCs)
  "Flash of Light":      { id: 19750, flagsA: 1073741824, flagsB: 0,         flagsC: 0 }  # A bit30. ranks 19750/19939-19943/27137/48784/48785. (33641/57766/59997/71930 are family=6 DRUID = different class; several family=0 decoys)
  "Holy Shock":          { id: 20473, flagsA: 2097152,    flagsB: 0,         flagsC: 0 }  # A bit21 (heal form). [talent]. WotLK chain r1-r7 (20473/20929/20930/27174/33072/48824/48825). The DAMAGE-form ids (25903/25913/25914/33074/48820/48821) carry mask (0,65536,0) = B bit16 instead — bind BOTH if a spellmod must reach damage+heal.
  "Lay on Hands":        { id: 633,   flagsA: 32768,      flagsB: 0,         flagsC: 0 }  # A bit15. ranks 633/2800/10310/27154/48788. (Greater variants 20233/20236 carry B mask; 9257/17233/53778 family=0 decoys)
  "Consecration":        { id: 26573, flagsA: 32,         flagsB: 0,         flagsC: 0 }  # A bit5. rank-1 = 26573 (NOT [talent] in WotLK — trainer-baseline; see survival). chain 26573/20116/20922/20923/20924/27173/48818/48819. (43429/69930/71122 family=0 decoys)
  "Exorcism":            { id: 879,   flagsA: 0,          flagsB: 2,         flagsC: 0 }  # B bit1. ranks 879/5614/5615/10312/10313/10314/27138/48800/48801. (17147/17149/33632/52445/58822 family=0)
  "Holy Wrath":          { id: 2812,  flagsA: 0,          flagsB: 2097152,   flagsC: 0 }  # B bit21. ranks 2812/10318/27139/48816/48817. (23979/32445/53638 are family=6 DRUID; several family=0)
  "Hammer of Wrath":     { id: 24239, flagsA: 0,          flagsB: 128,       flagsC: 0 }  # B bit7. ranks 24239/24274/24275/27180/48805/48806. (32772/37251/37255/37259 family=10 EMPTY-mask NPC decoys; 51384 family=0)
  "Divine Favor":        { id: 20216, flagsA: 0,          flagsB: 256,       flagsC: 0 }  # B bit8. single rank [talent]. (see grants.divine_favor)
  # --- Seals (identity masks; the seal AURA carries the mask, the judgement proc often a separate one) --
  "Seal of Righteousness": { id: 20154, flagsA: 134217728, flagsB: 536870912, flagsC: 0 } # A bit27 + B bit29. ranks 20154/21084 share it; 25742 (the Judgement-of-Righteousness proc) = (0,536870912,0) B bit29 only. Improved SoR spellmod must intersect BOTH.
  "Seal of Command":     { id: 20375, flagsA: 33554432,   flagsB: 0,         flagsC: 0 }  # A bit25. [talent] (Ret). ranks 20375/20424/33127/42058/57770/69403 share it; the 29385/41469/57769/66004/68020-68022 "Seal of Command" ids are family=10 EMPTY-mask or family=0 (proc payloads/NPC).
  "Seal of Justice":     { id: 20164, flagsA: 134217728,  flagsB: 0,         flagsC: 0 }  # A bit27 (SHARES bit27 with Seal of Righteousness — a bit27-only spellmod hits BOTH seals; SoR additionally owns B bit29).
  "Seal of Light":       { id: 20165, flagsA: 0,          flagsB: 33554432,  flagsC: 0 }  # B bit25 (seal aura). 20167 = (262144,0,0) A bit18 = the on-hit heal proc.
  "Seal of Wisdom":      { id: 20166, flagsA: 0,          flagsB: 67108864,  flagsC: 0 }  # B bit26 (seal aura). 20168 = (262144,0,0) A bit18 = the on-hit mana proc (SHARES A bit18 with Seal of Light's proc).
  "Judgement":           { id: 20271, flagsA: 8388608,    flagsB: 0,         flagsC: 0 }  # A bit23 = the Judgement ACTIVE identity. NB: in THIS 3.3.5a DBC 20271 is NAMED "Judgement of Light" (WotLK split Judgement into 3 abilities). Improved-Judgement (cooldown) spellmod binds A bit23 (41467/53407/53408/54158 all carry bit23). The 23591 "Judgement" is family=10 EMPTY-mask.
  "Judgement of Light":  { id: 20185, flagsA: 524288,     flagsB: 0,         flagsC: 0 }  # A bit19 (the seal-of-light judgement debuff line). 20267 = (0,1,0) B bit0 (the heal-on-attack proc it applies).
  "Judgement of Wisdom": { id: 20186, flagsA: 524288,     flagsB: 0,         flagsC: 0 }  # A bit19 (SHARES with Judgement of Light).
  "Judgement of Justice": { id: 20184, flagsA: 1048576,   flagsB: 0,         flagsC: 0 }  # A bit20.
  # --- Reconstructed Vanilla-only spells (custom band, NOT stock 3.3.5a ids) ------------------------
  # Seal of the Crusader (the player-castable SEAL) and Judgement of the Crusader (its judge debuff) are
  # ABSENT from 3.3.5a (survival: reconstruct). Authored as custom helpers 932634-639 (seal r1-6, cloned
  # off 20375 so they inherit word-A bit25 -> SPELL_SPECIFIC_SEAL) + 932640-645 (JotC r1-6). Both carry a
  # FREE family-10 word-C bit9 (flagsC 512) — every word-A bit is already taken by a stock paladin spell —
  # so Improved Seal of the Crusader (node 18633) can bind BOTH via a single `affectsMask: {c: 512}` +
  # op effect1 spellmod without over-binding any stock seal. These entries exist so the `affects:` lint
  # + addon name-map resolve; the DBC bind is the affectsMask override, not this identity.
  "Seal of the Crusader":       { id: 932634, flagsA: 0, flagsB: 0, flagsC: 512 }  # C bit9 (custom); seal r1 932634, chain 932634-639.
  "Judgement of the Crusader":  { id: 932640, flagsA: 0, flagsB: 0, flagsC: 512 }  # C bit9 (custom); JotC r1 932640, chain 932640-645.
  # --- Blessings -----------------------------------------------------------------------------------
  "Blessing of Might":   { id: 19740, flagsA: 2,          flagsB: 0,         flagsC: 0 }  # A bit1. ranks 19740/19834-19838/25291/27140/48931/48932. (56520 = (268435458,0,0) = the Greater/Glyph variant, adds bit28)
  "Blessing of Wisdom":  { id: 19742, flagsA: 65536,      flagsB: 0,         flagsC: 0 }  # A bit16. ranks 19742/19850/19852-19854/25290/27142/48935/48936. Improved BoW spellmod binds A bit16. (56521 = Greater/Glyph variant adds bits)
  "Blessing of Kings":   { id: 20217, flagsA: 16777216,   flagsB: 0,         flagsC: 0 }  # A bit24. single rank, NOT [talent] in WotLK (trainer-baseline; see survival). (56525/58054 Greater variants = (285212672,0,0))
  "Blessing of Sanctuary": { id: 20911, flagsA: 268435456, flagsB: 0,        flagsC: 0 }  # A bit28. [talent]. The triggered mana-return/stat sub-effects 57319/57320/57321/67480 are family=0 (see survival — WotLK rework).
  "Blessing of Protection": { id: 41450, flagsA: 268435584, flagsB: 0,       flagsC: 0 }  # A bits(7,28). NB: 41450 is an NPC-cast variant; the PLAYER 3.3.5a spell was RENAMED "Hand of Protection" (1022). "Blessing of Protection" as a player name does NOT resolve — see survival.renamed.
  "Hand of Protection":  { id: 1022,  flagsA: 128,        flagsB: 0,         flagsC: 0 }  # A bit7. the PLAYER 3.3.5a "Blessing of Protection" (ranks 1022/5599/10278). Guardian's Favor (18618) cooldown spellmod binds this. (dumped 2026-08-18)
  "Hand of Freedom":     { id: 1044,  flagsA: 16,         flagsB: 0,         flagsC: 0 }  # A bit4. the PLAYER 3.3.5a "Blessing of Freedom". Guardian's Favor (18618) duration spellmod binds this. (dumped 2026-08-18)
  # --- Auras (all carry C bit5 = 32, the shared "paladin aura" identity bit) ------------------------
  "Devotion Aura":       { id: 465,   flagsA: 64,         flagsB: 0,         flagsC: 32 } # A bit6 + C bit5. ranks 465/643/1032/10290-10293/27149/48941/48942. (8258/17232/41452/52442/57740/58944 family=0 decoys)
  "Retribution Aura":    { id: 7294,  flagsA: 8,          flagsB: 0,         flagsC: 32 } # A bit3 + C bit5. ranks 7294/10298-10301/27150/54043. (8990/13008 family=0)
  "Concentration Aura":  { id: 19746, flagsA: 131072,     flagsB: 0,         flagsC: 32 } # A bit17 + C bit5. single rank.
  # --- Misc actives / self-buffs -------------------------------------------------------------------
  "Righteous Fury":      { id: 25780, flagsA: 1,          flagsB: 0,         flagsC: 0 }  # A bit0. (25781 = the threat sub-effect, family=10 EMPTY mask)
  "Hammer of Justice":   { id: 853,   flagsA: 2048,       flagsB: 0,         flagsC: 0 }  # A bit11. ranks 853/5588/5589/10308. (13005/32416/37369/39077/41468/6600x family=0 decoys)
  "Repentance":          { id: 20066, flagsA: 4,          flagsB: 0,         flagsC: 0 }  # A bit2. [talent]. (29511/32779/66008 family=10 EMPTY-mask or family=0 NPC variants)
  "Holy Shield":         { id: 20925, flagsA: 0,          flagsB: 64,        flagsC: 0 }  # B bit6. [talent]. ranks 20925/20927/20928/27179/48951/48952. (9800/31904/32777 family=0 or EMPTY-mask decoys)

  # --- family=10 but EMPTY mask, or family=0 (carry NO identity bit — NOT a SPELLMOD `affects:` target) --
  # These are the talent PASSIVES / proc carriers themselves (the SPELLMOD carriers / granted auras,
  # not targets). A family-10 "boost all paladin X" spellmod will NOT reach them — handle by direct id.
  "Redoubt (passive)":   { id: 20127, flagsA: 0, flagsB: 0, flagsC: 0 }  # family=0. talent proc passive 20127/20130/20135 (see grants.redoubt)
  "Reckoning (passive)": { id: 20177, flagsA: 0, flagsB: 0, flagsC: 0 }  # family=0. talent proc passive 20177/20179/20181/20182/20180 (see grants.reckoning)
  "Vengeance (passive)": { id: 20049, flagsA: 0, flagsB: 0, flagsC: 0 }  # family=0. Ret talent proc passive 20049/20056/20057 (see grants.vengeance). NB: heavy name collision — 16909-16913 are SHAMAN (family=7); 31801/42463 Seal of Vengeance; dozens of zone/item "Vengeance".
  "Vindication (passive)": { id: 9452, flagsA: 0, flagsB: 0, flagsC: 0 } # family=0. talent proc passive 9452/26016 → triggers 67/26017 (the debuff, family=10 mask (0,16384,0) B bit14). (see grants.vindication)
  "Eye for an Eye (passive)": { id: 9799, flagsA: 0, flagsB: 0, flagsC: 0 } # family=0. talent proc passive 9799/25988 → reflects via 25997 (family=10 EMPTY mask). (see grants.eye_for_an_eye)
  "Illumination (passive)": { id: 20210, flagsA: 0, flagsB: 0, flagsC: 0 } # family=10 EMPTY mask. talent proc passive 20210/20212-20215 (mana refund on Holy crit). NB: 31842 "Divine Illumination" is a DIFFERENT WotLK talent — do not confuse.

