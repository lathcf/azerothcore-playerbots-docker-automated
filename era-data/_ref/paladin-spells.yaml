  holy_shock:        { 1: 20473 }   # "20473 - Holy Shock, rank 1 [talent]"; Effect3 DUMMY (heal-or-damage branch). Vanilla-faithful shape. WotLK chain r1-r7 (Vanilla had 3 ranks — rank divergence for the owning tab).
