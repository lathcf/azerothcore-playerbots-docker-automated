    stock_ids: [17003, 17004, 17005, 17006, 24894]   # [talent][passive], 5 ranks — RANK COUNT MATCHES Vanilla exactly
    form: "Effect_1=6 aura137 MOD_TOTAL_STAT_PERCENTAGE misc3(=STAT_INTELLECT) +4/8/12/16/20% (basepoints 3/7/...) + Effect_2=3 SPELL_EFFECT_DUMMY (per-form Stamina-in-Bear / Strength-in-Cat split — NO druid AuraScript found in spell_druid.cpp for this id, so the per-form branch is core-generic/hardcoded elsewhere, not confirmed in this pass). Values (4/8/12/16/20% Int, matching skeleton) appear Vanilla-faithful on the Intellect component; the per-form stat component's exact mechanism was not traced to source in this task."
