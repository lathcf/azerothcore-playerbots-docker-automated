                         # 6-9 disposition (grant | clone | script). Confirmed empirically against the
                         # DBC + core scripts, NOT assumed. Uncertain calls marked `disposition: X?`.
  moonkin_form:
    survives: true
    stock_ids: [24858]   # [talent], single rank
    form: "Effect_1=6 aura36 MOD_SHAPESHIFT (misc31=FORM_MOONKIN) + Effect_2=6 aura77 MECHANIC_IMMUNITY (misc17, polymorph+movement-impair — matches skeleton tooltip verbatim) + Effect_3=64 TRIGGER_SPELL -> 24907 Moonkin Aura. ManaCostPct 22%. The FORM ITSELF (armor+immunity+DPS-caster-lock) is Vanilla-faithful."
    disposition: grant   # grant 24858 for the form; the AURA it triggers is a separate divergence (below).
  moonkin_aura:
    survives: true
    stock_ids: [24907]   # triggered automatically by 24858, not separately talent-learned
    form: "Effect_1=65 AREA_AURA_RAID aura57 MOD_SPELL_CRIT_CHANCE +5% (basepoints4) + Effect_2=65 aura189 MOD_RATING. REWORKED vs Vanilla: Vanilla Moonkin Aura = +3% PARTY spell crit only (+the form's own armor bonus, which is a separate SpellShapeshiftForm.dbc field, unaffected); WotLK = +5% RAID-wide spell crit (broader radius/scope + higher %, per the design doc's expectation)."
    disposition: clone?   # confirm in the Task 6 authoring loop — clone 24907 down to Vanilla's 3%/party-range shape, or accept the stronger WotLK aura as a minor buff (owner call).
  natures_grace:
    survives: true
    stock_ids: [16880, 61345, 61346]   # [talent][passive], 3 ranks (WotLK expanded from Vanilla's 1 rank)
    form: "aura42 PROC_TRIGGER_SPELL at 33/66/100% chance (ProcTypeMask 87376) -> 16886 (aura65 MOD_CASTING_SPEED_NOT_STACK, a %-cast-time-reduction buff SCOPED to a specific Nature-school spell set via EffectSpellClassMask, NOT all spells). REWORKED vs Vanilla: Vanilla = ANY spell critical (not Nature-restricted) triggers a flat -0.5s cast-time reduction on the caster's NEXT spell, single rank, no chance gate (100% on any crit). WotLK = Nature-spell-crit only, %-based reduction, 3 ranks with a chance gate."
    disposition: clone   # Vanilla's flat -0.5s/any-spell/always-proc shape cannot be expressed by a straight grant of 16880's chain; clone required for fidelity.
  leader_of_the_pack:
    survives: true
    stock_ids: [17007, 24932]   # 17007 = the [talent][passive] spellbook entry (EMPTY mask, ShapeshiftMask 0, inert on its own per the DBC); 24932 = the REAL applied/scripted spell (ShapeshiftMask 145 = Cat|Bear|DireBear), script-bound via spell_dru_leader_of_the_pack (spell_druid.cpp:1400)
    form: "24932: Effect_1=65 AREA_AURA_RAID aura52 MOD_WEAPON_CRIT_PERCENT +5% (basepoints4) + Effect_2=65 aura4 DUMMY (script-bound proc, ProcTypeMask 4436/ProcChance100) -> casts 34299 (heal, 6s internal cd) and, if self-cast, 68285 (mana). REWORKED vs Vanilla: Vanilla Leader of the Pack = +3% PARTY crit chance ONLY, no heal, no mana, in Cat/Bear/Dire Bear form. WotLK ADDED the on-crit self-heal (% of max HP) + mana-return branch, and widened scope from party to raid-area-aura."
    disposition: clone   # clone the aura down to Vanilla's crit%-only shape (drop the heal/mana proc) if strict fidelity wanted; else grant 17007/24932 as-is for a stronger WotLK-flavored talent (owner call, matches paladin-ref's holy_shield/blessing_of_sanctuary precedent of "clone or accept the buff").
