# Stock Druid spell reference — live-verified from Spell.dbc (SpellClassSet=7, SPELLFAMILY_DRUID) +
# `lookup spell`/`lookup skill` on the dev-box worldserver console (2026-08-20) + this fork's OWN
# scripts/headers (never from memory). See warrior-spells.yaml / paladin-spells.yaml for the shape
# this mirrors and the general verification method.
#
# Verification method (Phase 9 Task 3):
#   - Spell.dbc pulled live out of the running container:
#       docker exec ac-worldserver cat /azerothcore/env/dist/data/dbc/Spell.dbc > /tmp/claude-1000/dbc/Spell.dbc
#   - spells: flagsA/flagsB/flagsC = SpellClassMask_1/_2/_3 (the spell's OWN identity mask — what a
#     SPELLMOD's EffectSpellClassMask must intersect to bind it), read straight from that DBC via
#       python3 tools/dump_spell_family.py <Spell.dbc> tools/spell_dbc_columns.txt --names "..."
#         (exact Name_Lang_enUS, comma-separated; the tool matches EXACT strings case-insensitively,
#          NOT substrings — "Swipe" does NOT match "Swipe (Bear)"; this bit multiple searches below,
#          see the nameCollisions section)
#     Every homonym returned was inspected; the recorded mask is the SHARED mask across the real
#     player-cast ranks, and every NPC/pet/other-class id sharing the NAME but a different family (or
#     family=7 with an unrelated mask) is called out explicitly — druid, like warrior/rogue, is a very
#     old class with heavy name reuse, made WORSE by hunter PET abilities (Claw/Cower/Prowl/Swipe) that
#     legitimately share several Feral ability names.
#   - Effect-level detail (Effect_N / EffectAura_N / EffectBasePoints_N / EffectMiscValue_N /
#     EffectTriggerSpell_N / EffectSpellClassMaskA/B/C_N / ShapeshiftMask / ProcChance / ProcTypeMask /
#     ManaCostPct / RecoveryTime / DurationIndex) came from
#       python3 tools/dump_spell_effects.py <Spell.dbc> tools/spell_dbc_columns.txt --ids <id> --cols ...
#     NOTE: dump_spell_effects.py does NOT resolve Name_Lang_enUS to text (prints the raw string-block
#     offset int) — only dump_spell_family.py resolves names. Cross-reference by id.
#     Aura/effect numbers resolved against the fork's OWN headers, never from memory:
#       SPELL_AURA_*   -> azerothcore-wotlk/src/server/game/Spells/Auras/SpellAuraDefines.h
#       SPELL_EFFECT_* -> azerothcore-wotlk/src/server/shared/SharedDefines.h
#       SPELLFAMILY_*  -> azerothcore-wotlk/src/server/shared/SharedDefines.h:3784-3801 (GENERIC=0,
#                         MAGE=3, WARRIOR=4, WARLOCK=5, PRIEST=6, DRUID=7, ROGUE=8, HUNTER=9,
#                         PALADIN=10, SHAMAN=11, POTION=13, DEATHKNIGHT=15, PET=17)
#   - Core script bindings (which stock ids carry a druid-specific AuraScript vs. a core-generic
#     handler) confirmed by grepping
#       azerothcore-wotlk/src/server/scripts/Spells/spell_druid.cpp
#     directly — e.g. spell_dru_leader_of_the_pack is bound to 24932 (NOT the talent 17007),
#     spell_dru_predatory_strikes just calls target->UpdateAttackPowerAndDamage() (the level/AP
#     scaling itself lives in core Unit.cpp, not a druid script), and NO script exists for Heart of
#     the Wild's per-form stat split or Furor (core-generic/DBC-only handling).
#   - grants:/triggers: stock ids + the survival: verdicts resolved on the LIVE dev-box worldserver via
#       python3 tools/wgconsole.py <out> "lookup spell <name>" "wait:N" ...
#     Raw output kept at /tmp/claude-1000/druid_family1.out, druid_lookup1.out, druid_effects1.out.
#   - skillLines: resolved by reading SkillLineAbility.dbc + SkillLine.dbc directly (no dump tool
#     exists for these two DBCs; a short inline WDBC-header parser was used, same record layout as
#     dump_spell_family.py's own reader) — `lookup skill Restoration` alone is AMBIGUOUS (see below).
#
# HELPER-ID CHECK (Task 3 Step 1) — run 2026-08-20, result ALL FREE:
#   grep -rn "9325[0-9][0-9]" era-data/ modules/mod-era-talents/data/sql/
#     client-addons-src/EraTalents/data/  -> no hits. The 9325xx hand-assigned helper block is
#   reserved and untouched for Druid Tasks 6-9 (Balance/Feral/Restoration).
#   2026-09-07 (final review deferred-gaps round): 932514-932518 CLAIMED — Insect Swarm r1-r5
#   Vanilla clones (node 18738). Next free in the druid slice: 932519.

