triggers:                # stock ids a data-proc/trigger node casts (live-verified against the DBC).
  # ---- Deep Wounds proc + bleed chain (Task-3 Step 3 ask; owning tab = ARMS, node feeds Task 6) --
  deep_wounds_proc:  { 1: 12834, 2: 12849, 3: 12867 }
  # ^ the TALENT proc passives (family=4, EMPTY mask). Each = Effect_1=6/aura42 PROC_TRIGGER_SPELL,
  #   EffectTriggerSpell_1=12162, ProcChance=100, ProcTypeMask=69972 (melee/crit hit). It does NOT
  #   trigger the bleed directly — it triggers 12162 (below), which carries the bleed damage.
  deep_wounds_intermediate: 12162   # family=0; the spell 12834's proc actually casts (the % -> bleed math lives here in WotLK)
  deep_wounds_bleed: 12721          # family=4 word2 bit4 (see spells:"Deep Wounds"); Effect_1=6/aura3 PERIODIC_DAMAGE, DurationIndex 32 = the applied bleed DoT
  # ---- Flurry haste buff (owning tab = FURY) ---------------------------------------------------
  flurry_buff:       { 1: 12966, 2: 12967, 3: 12968, 4: 12969, 5: 12970 }
  # ^ family=4 EMPTY mask; Effect_1=6/aura138 MOD_MELEE_HASTE, EffectBasePoints scales, DurationIndex 8,
  #   ProcTypeMask 4 (charge-consuming on melee). This is the BUFF applied on crit.
  flurry_talent:     { 1: 12319, 2: 12971, 3: 12972, 4: 12973, 5: 12974 }
  # ^ family=0; the passive that watches for crits and applies flurry_buff. (Separate from the buff.)
  # ---- Weapon-spec extra-attack trigger (reusable for Sword/Mace spec proc) ---------------------
  extra_attack_1:    16459          # "16459 - Sword Specialization, rank 1" (no tag; the TRIGGERED payload).
  # ^ family=0 (shared, class-agnostic); Effect_1=19 SPELL_EFFECT_ADD_EXTRA_ATTACKS,
  #   EffectBasePoints_1=0 -> 1 extra attack. The reusable "chance of an extra attack" payload for a
  #   Sword-Specialization-style proc (identical to the id rogue-spells.yaml recorded for Rogue Sword Spec).
  # ---- Mace 3s-stun trigger: DOES NOT EXIST as a stock spell in this 3.3.5a DBC -----------------
  # RESOLVED: `lookup spell Mace Stun` -> "No spells found!". The historical Vanilla "Mace
  # Specialization: chance to stun 3s" was reworked in WotLK. In THIS DBC:
  #   * 5530 "Mace Specialization" (untalented base) = Effect_1=30 ENERGIZE (base 99), NOT a stun.
  #   * The TALENT ranks 12284/12701-12704 (and the 13709 chain) = Effect_1=6/aura280
  #     MOD_ARMOR_PENETRATION_PCT (2/4/6/8/10%) — flat armor-pen passive, NO proc/trigger/stun.
  #   * Passives 20864/59224 = aura240 MOD_EXPERTISE (further TBC/WotLK revision), also stun-free.
  # => A Vanilla "Mace Spec: chance to stun 3s" analog has ZERO stock support and must be AUTHORED as
  #    a custom proc (Task 7/owning-tab call). The only stock warrior STUN active is Concussion Blow
  #    12809 (grants.concussion_blow), a 5s targeted stun+damage — not a bare 3s on-hit proc trigger.

weaponSubclassMasks:     # equipSubclass bitmasks for the weapon-spec talents (Task 6-8 consumers).
                         # SOURCE: azerothcore-wotlk/src/server/game/Entities/Item/ItemTemplate.h
                         # enum ItemSubclassWeapon (verified directly), CROSS-CHECKED against the
                         # stock talents' own EquippedItemSubclass field dumped from Spell.dbc.
  equipClass: 2          # ITEM_CLASS_WEAPON (ItemTemplate.h:293)
  # Real enum bit order (ItemTemplate.h:344-364):
  #   AXE=0, AXE2=1, BOW=2, GUN=3, MACE=4, MACE2=5, POLEARM=6, SWORD=7, SWORD2=8, (obsolete=9),
  #   STAFF=10, EXOTIC=11, EXOTIC2=12, FIST=13, MISC=14, DAGGER=15, THROWN=16, SPEAR=17,
  #   CROSSBOW=18, WAND=19, FISHING_POLE=20.
  axe1h: 1        # 1 << 0  (ITEM_SUBCLASS_WEAPON_AXE)
  axe2h: 2        # 1 << 1  (ITEM_SUBCLASS_WEAPON_AXE2)
  axeSpecMask: 3       # axe1h | axe2h — matches the task prompt (3). NB: stock WotLK MERGED axe+polearm
                       # into "Poleaxe Specialization" 12700 (EquippedItemSubclass=67=axe|axe2|polearm);
                       # for VANILLA we split them, so Axe Spec = 3 (axes only). (The racial Axe Spec
                       # 20574 = 8195 = axe|axe2|fist — also not what a warrior Axe Spec talent wants.)
  mace1h: 16      # 1 << 4  (ITEM_SUBCLASS_WEAPON_MACE)
  mace2h: 32      # 1 << 5  (ITEM_SUBCLASS_WEAPON_MACE2)
  maceSpecMask: 48     # mace1h | mace2h — matches the prompt (48); CONFIRMED by stock Mace Spec 12284 (EquippedItemSubclass=48).
  sword1h: 128    # 1 << 7  (ITEM_SUBCLASS_WEAPON_SWORD)  — prompt said "1<<2 = 4"; WRONG, corrected
  sword2h: 256    # 1 << 8  (ITEM_SUBCLASS_WEAPON_SWORD2) — prompt said "1<<7 = 128"; WRONG, corrected
  swordSpecMask: 384   # sword1h | sword2h — prompt's "Sword Spec mask 132" is WRONG; real value 384, CONFIRMED by stock Sword Spec 12281 (EquippedItemSubclass=384).
  polearm: 64     # 1 << 6  (ITEM_SUBCLASS_WEAPON_POLEARM)
  polearmSpecMask: 64  # polearm only — matches the prompt (64). Polearm Spec IS a separate Vanilla Arms talent (node 18516); split out from the WotLK Poleaxe merge (12700=67).
  # Two-Handed / One-Handed Weapon Specialization — authoritative masks taken from the STOCK talents'
  # own EquippedItemSubclass (dumped), not assembled by hand:
  twoHandSpecMask: 354   # stock Two-Handed Weapon Spec 12163 EquippedItemSubclass=354 = axe2(2)|mace2(32)|polearm(64)|sword2(256). NOTE: does NOT include staff(1024). This is the exact stock set.
  oneHandSpecMask: 41105 # stock One-Handed Weapon Spec 16538 EquippedItemSubclass=41105 = axe(1)|mace(16)|sword(128)|fist(8192)|dagger(32768). Exact stock set.

