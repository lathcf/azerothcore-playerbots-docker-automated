# Stock Warrior spell reference — live-verified from Spell.dbc (SpellClassSet=4, SPELLFAMILY_WARRIOR) +
# `lookup spell` on the dev-box worldserver console (2026-08-18). DO NOT guess ids/flags; see
# rogue-spells.yaml / hunter-spells.yaml / warlock-spells.yaml for the shape this mirrors and the
# general verification method.
#
# Verification method (Phase 7 Task 3):
#   - Spell.dbc pulled live out of the running container:
#       docker exec ac-worldserver cat /azerothcore/env/dist/data/dbc/Spell.dbc > /tmp/.../Spell.dbc
#   - spells: flagsA/flagsB/flagsC = SpellClassMask_1/_2/_3 (the spell's OWN identity mask — what a
#     SPELLMOD's EffectSpellClassMask must intersect to bind it) read straight from that DBC via
#       python3 tools/dump_spell_family.py <Spell.dbc> tools/spell_dbc_columns.txt --names "..."
#         (comma-separated, exact Name_Lang_enUS)
#     Every rank of every multi-rank line below was dumped; the recorded mask is the SHARED mask
#     across the player-cast ranks, and every NPC/decoy id sharing the same NAME but a different
#     family/mask (or family=4 with an EMPTY mask) is called out explicitly (warrior, like rogue, is
#     an old class — many ability names were reused for boss/mob/other-class spells).
#   - Effect-level detail (Effect_N / EffectAura_N / EffectTriggerSpell_N / EquippedItemSubclass /
#     DurationIndex) came from
#       python3 tools/dump_spell_effects.py <Spell.dbc> tools/spell_dbc_columns.txt --ids ... --cols ...
#     Aura/effect numbers resolved against the fork's OWN headers, never from memory:
#       SPELL_AURA_* -> azerothcore-wotlk/src/server/game/Spells/Auras/SpellAuraDefines.h
#       SPELL_EFFECT_* -> azerothcore-wotlk/src/server/shared/SharedDefines.h
#       ITEM_SUBCLASS_WEAPON_* -> azerothcore-wotlk/src/server/game/Entities/Item/ItemTemplate.h
#   - grants:/triggers: stock ids resolved on the LIVE dev-box worldserver via
#       python3 tools/wgconsole.py <out> "lookup spell <name>" "wait:N" ...
#     taking the rank-1 [talent] entry. Raw output kept at /tmp/claude-1000/wrids.out + wrids2.out.
#
# HELPER-ID CHECK (Task 3 Step 1) — run 2026-08-18, result ALL FREE:
#   grep -rn "9328[0-9][0-9]" era-data/ modules/mod-era-talents/data/sql/
#     client-addons-src/EraTalents/data/  -> no hits (warrior reserves the 9328xx hand-assigned
#   helper block). NOTE: the DBC already contains pre-existing era warrior custom ids from the Task-2
#   skeleton import (923424-923428 Mace Spec, 923440-923444 Sword Spec, 932988 Mace Specialization) —
#   all OUTSIDE the 9328xx helper band, so no collision; recorded here only so a later reader isn't
#   surprised to see them in `lookup spell` output.

