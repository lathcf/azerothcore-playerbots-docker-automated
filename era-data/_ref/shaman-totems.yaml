# =============================================================================================
# KNOWN DEFECTS in the SHIPPED Vanilla totem substrate — recorded 2026-09-01 by the TBC Phase 3
# totem work. Mirrored here because the TBC reference that found them
# (era-data/_ref/tbc/shaman-totems-tbc.yaml) stops being opened once TBC shaman closes out, and
# this is the file a Vanilla maintainer actually reads. The clone blocks themselves carry a
# matching `!!! KNOWN DEFECT` banner in era-data/vanilla/shaman.yaml.
# =============================================================================================
known_defects_shipped:
  why_it_breaks: >-
    `Totem::InitSummon` (Totem.cpp:88-105) casts `m_spells[0]` EXACTLY ONCE and `TotemAI::UpdateAI`
    (TotemAI.cpp:63-66) returns immediately for a non-TOTEM_ACTIVE totem. A pulse that is neither an
    APPLY_AREA_AURA nor self-periodic therefore fires once and never again.
  scope: >-
    EXACTLY the two below. The one-shot-pulse sweep (2026-09-01) checked all 69 era totem creatures
    and cleared every other family: Healing Stream and Mana Tide are self-ticking periodic auras,
    Searing and Fire Nova fire discretely by design (driven by TotemAI / npc_era_fire_nova_totem),
    and the resistance and stat pulses are APPLY_AREA_AURA. Do NOT add drivers to any of those --
    a redundant driver on Healing Stream would double-tick the heal.
  fix: >-
    Give each era creature a DRIVER as its Index-0 spell -- a clone of the stock driver, aura 23
    PERIODIC_TRIGGER_SPELL -- and let the driver trigger the existing payload clone. The TBC side
    already ships exactly this shape (947001 for Earthbind; batch 2's minted Magma drivers), so copy
    it. Fix both together; they are one defect class. Needs its own regression pass and a fresh
