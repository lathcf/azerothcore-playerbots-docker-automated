  dbc: "era-wow/tools/vanilla-extract/Spell.dbc (WDBC, 16332 records, 162 fields, 648 B/rec)"
  extracted: "2026-08-23"
  plusOneConventionApplied: true    # every `mag` below is already EffectBasePoints_N + 1

