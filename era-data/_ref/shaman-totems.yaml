# Canonical 1.12 (patch 1.12.1) Shaman BASELINE TOTEM numbers — the "numbers of record"
# for the future Vanilla-era totem-override work (mirrors the paladin baseline-seal
# reconstruction model). See era-data/_ref/shaman-spells.yaml for the sibling stock-spell
# reference this file's shape/rigor mirrors, and
# docs/superpowers/specs/2026-08-23-vanilla-totems-research-report.md for the per-totem
# gap/diff narrative + WotLK stock ids. This is a REFERENCE/data artifact only — it changes
# NO game data.
#
# ============================================================================================
# STRICT PROVENANCE: every 1.12 number below was read DIRECTLY from the 1.12.1 client Spell.dbc
#   /home/lewist/Projects/era-wow/tools/vanilla-extract/Spell.dbc
# NEVER from wiki tooltips (wikis silently mix in patch-1.15 Classic-Era rebalanced values).
# Where the DBC could not supply a value (duration/radius index tables, held-item enchant
# magnitudes, dispel pulse intervals — all in DBCs NOT present in the extract), the value is
# left as the raw DBC index and the gap is flagged, never invented.
# ============================================================================================
#
# VERIFICATION METHOD
#   - The 1.12.1 Spell.dbc is a DIFFERENT binary layout from 3.3.5a: 162 fields / 648 bytes per
#     record (vs WotLK's 234 / 936). The project's WotLK reader tools/dump_spell_effects.py +
#     tools/spell_dbc_columns.txt (234-col) therefore MISREAD it — the task's prescribed command
#     produces misaligned garbage against this DBC (confirmed: Searing Totem dumped ManaCost=0,
#     DurationIndex=0). The correct 1.12 field offsets were derived empirically here and are
#     recorded below so this file is reproducible. (era-wow/tools/spell_dbc_112.py is the sibling
#     1.12 reader; it exposes only id/school/cast/mana/basepoints/name — not effect type / aura /
#     misc / radius — so the per-effect offsets below extend it.)
#   - 1.12 Spell.dbc field offsets (0-indexed ints), VERIFIED against Strength of Earth (8075/8076),
#     Grace of Air (8836), Healing Stream (5672), Mana Spring (5677), the resistance totems, and
#     the summon-slot effects:
#         ID=0  School=1(index; mask=1<<School)  CastingTimeIndex=14  DurationIndex=26
#         ManaCost=28  RangeIndex=32  baseLevel=24  spellLevel=25
#         per-effect arrays (index = field of Effect_1; +1 = Effect_2, +2 = Effect_3):
#           Effect=56  EffectDieSides=59  EffectBasePoints=71  EffectImplicitTargetA=74
#           EffectRadiusIndex=80  EffectApplyAuraName=83  EffectAmplitude(ms)=86
#           EffectMiscValue=98  EffectTriggerSpell=101
#         Name=112  Rank=121  (string-block offsets)
#   - Effect enum (1.12 == 3.3.5a for these, resolved vs the fork's
#     azerothcore-wotlk/src/server/shared/SharedDefines.h):
#         2  = SPELL_EFFECT_SCHOOL_DAMAGE      6  = SPELL_EFFECT_APPLY_AURA
#         35 = SPELL_EFFECT_APPLY_AREA_AURA_PARTY (the party pulse/buff a totem casts)
#         36 = SPELL_EFFECT_LEARN_SPELL        92 = SPELL_EFFECT_ENCHANT_HELD_ITEM
#         87/88/89/90 = SPELL_EFFECT_SUMMON_TOTEM_SLOT1..4 = FIRE / EARTH / WATER / AIR slot.
#           (This slot number is the DBC-authoritative element assignment — it CONFIRMS the report's
#            resistance-element gotcha: Frost Resistance summon 8181 = slot 87 FIRE; Fire Resistance
#            8184 = slot 89 WATER; Nature Resistance 10595 = slot 90 AIR.)
#   - Aura enum (resolved vs SpellAuraDefines.h):
#         8  = PERIODIC_HEAL      24 = PERIODIC_ENERGIZE   29 = MOD_STAT (misc = stat index:
#              0 STR / 1 AGI)     33 = MOD_DECREASE_SPEED  113 = MOD_RANGED_DAMAGE_TAKEN
#         125 = MOD_MELEE_DAMAGE_TAKEN   143 = MOD_RESISTANCE_EXCLUSIVE (misc = school index:
#              2 FIRE / 3 NATURE / 4 FROST).
#   - DBC VALUE CONVENTION (identical to shaman-spells.yaml): a stock effect stores value-1 with
#     EffectDieSides=1 (roll adds exactly 1), so effective magnitude = EffectBasePoints_N + 1.
#     Every `mag`/magnitude below ALREADY applies the +1. Damage attacks with DieSides>1 are
#     recorded as a `min..max` roll range (min = basePoints+1, max = basePoints+dieSides).
#   - On a summon spell, EffectBasePoints_1 (+1) is the TOTEM CREATURE'S HEALTH and
#     EffectMiscValue_1 is the summoned creature entry; ManaCost is carried by the SUMMON, the
#     magnitude by the PULSE. (Recorded below only where notable, e.g. Stoneclaw's high health.)
#
# UNRESOLVED-BY-EXTRACT (raw DBC index kept; NOT converted — the index-table DBCs are absent):
#   - durationIndex  -> SpellDuration.dbc (not in the extract). Human seconds in a totem's `note:`
#     are the research report's figure, flagged (report), NOT DBC-verified.
#   - radiusIndex    -> SpellRadius.dbc (not in the extract). RangeIndex IS decodable via the bundled
#     SpellRange.dbc: index 1 = 0yd (self-cast — every totem summon), index 3 = 0..8yd, index 6 =
#     0..100yd. Party pulses use radiusIndex 9 (uniform across all party-buff totems).
#   - Flametongue held-item enchant magnitude -> SpellItemEnchantment.dbc (not in the extract);
#     only the enchant id is recorded.
#   - dispel/reflect totems (Tremor / Poison & Disease Cleansing / Grounding) carry ONLY the summon
#     effect in Spell.dbc; the periodic dispel / spell-absorb the totem performs is a creature-cast
#     behaviour (creature_template_spell + AI), not a player-named pulse spell — so no pulse magnitude
#     or interval exists to read from Spell.dbc. Recorded as pulse: creature-cast.
#
# ID-COLLISION WARNING (spells are global; Blizzard REUSED ids across eras via rename/merge):
#   - 8170 = "Disease Cleansing Totem" in 1.12, but "Cleansing Totem" in 3.3.5a (WotLK 3.1.0 merged
#     poison+disease into 8170 and renamed it). A Disease-Cleansing reconstruction CANNOT reuse 8170.
#   - 1535 = "Fire Nova Totem" in 1.12, but "Fire Nova" (the instant spell) in 3.3.5a (patch 3.3.0
#     replaced the totem with the spell on the same id).
#   These are why the HIDE dispositions strip the 3.3.5a meaning and a Vanilla clone must take a
#   fresh id in the reserved band [920000, 933000).
#
# ============================================================================================
# TIER-3 ADDENDUM (sub-project 2, 2026-08-23): three more enum values used below, resolved the same
# way (grep against azerothcore-wotlk/src/server/shared/SharedDefines.h /
# .../Spells/Auras/SpellAuraDefines.h) but not needed by Tier 0-2 above:
#   Effect enum:  19 = SPELL_EFFECT_ADD_EXTRA_ATTACKS   63 = SPELL_EFFECT_THREAT
#   Aura enum:    99 = SPELL_AURA_MOD_ATTACK_POWER
#   Target enum (EffectImplicitTargetA, confirms slot/AoE geometry, not previously needed):
#     1 = TARGET_UNIT_CASTER   20 = TARGET_UNIT_CASTER_AREA_PARTY   22 = TARGET_SRC_CASTER (AoE
#     originates AT the caster, i.e. the totem)   41/42/43/44 = TARGET_DEST_CASTER_{FRONT_RIGHT,
#     BACK_RIGHT,BACK_LEFT,FRONT_LEFT} (the 4 ground totem slots; used here only as a decode sanity
#     check — SUMMON_TOTEM_SLOT1..4 87/88/89/90 map onto implicitA 44/41/42/43 respectively, which
#     is internally consistent across every totem in this file and corroborates the field offsets).
# All three totems below were decoded with the SAME validated offsets from the header above (no new
# offsets needed) — spot-checked against known-good rows before trusting: Strength of Earth 8075
# (mana 30, buff 8076 basePoints 9 -> mag 10 matches its existing Tier-0-2 record above) and Searing
# Totem 3599/3606 (mana 30, bolt 7..9 matches its existing record above) both re-decoded byte-for-byte
# identical through this addendum's script before any Tier-3 id was read.
# ============================================================================================

meta:
