      MINTED 8 (+4 creatures) / REUSED 4 pulses (Task 2 batch 2, 2026-09-01).
      **THIS FAMILY HAS A THIRD ROLE THIS FILE'S `per_role: {pulse, summon}` SCHEMA DOES NOT MODEL —
      a DRIVER — and the shipped Vanilla substrate is BROKEN for the same reason Earthbind was.**
      `creature_template_spell (5929, 0, 8188)`: the STOCK creature casts **8188 "Magma Totem
      Passive"** (Attributes 0x1c0 PASSIVE, aura 23 PERIODIC_TRIGGER_SPELL, period 2000 ms,
      DurationIndex 21), which re-triggers the damage 8187 every 2 s. wago 2.5.4 and the live DBC
      agree on 8188 field-for-field, so the driver is TBC's own arrangement, not a WotLK addition.
      The Vanilla substrate models no driver: creature 920160 casts the 8187-clone 931130 DIRECTLY,
      and `Totem::InitSummon` (Totem.cpp:88-105) casts `m_spells[0]` exactly ONCE for a passive
      totem while `TotemAI::UpdateAI` (TotemAI.cpp:63-66) returns immediately for a non-ACTIVE one —
      so a 21 s Vanilla Magma Totem deals ONE tick of its ten. See `open_questions` id 8; the
      VANILLA half is shipped, merged, real-client-verified content and is NOT fixed from inside
      this phase.
      TBC gets the batch-1 Earthbind treatment: drivers **947110-947113** minted (each templating
      its OWN rank's stock driver 8188/10582/10583/10584 to inherit Attributes 0x1c0 and the
      permanent-passive shape) with `trigger:` re-pointed at the REUSED Vanilla damage clone —
      pointing at the stock damage id instead would hand a TBC shaman live's buffed 38/64/94/131
      (noise filter N3 in its exact intended form). `amplitude: 2000` is authored, not inherited:
      the generator writes the period only when the key is present, and an unset EffectAuraPeriod
      trips the core's broken-DBC guard to 1000 ms, doubling the tick rate.
      **PULSES REUSED (931130-931133)** — wago 8187/10579/10580/10581 and the shipped clones agree at
      EFFECTIVE 22/37/54/75 fire per tick, radius index 14 (8 yd), targetA 22 / targetB 15. Granting
      stock is not an option (live buffed the same four ids), so this is the rare case where reusing
      the Vanilla clone is MORE TBC-accurate than the stock spell.
      **CREATURES FRESH (920370-920373)** — the Vanilla entries 920160-920163 cannot be reused even
      though their pulse can, because their Index-0 spell IS the defect.
      **SUMMONS MINTED (947115-947118)** — r2-r4 measure TBC == live outright and r1 differs only on
      ManaCostPct, but all four are minted regardless to retarget EffectMiscValue at our own creature
      (noise filter N2), the same reason batch 1 cloned Stoneclaw. `manaCostPct: 0` is LOAD-BEARING
      on rank 1: live 8190 carries ManaCost 230 **and** ManaCostPct 35, so an un-neutralised clone
      double-charges. It is authored on r2-r4 too, where it is a no-op, so the four rows read the
      same and a later edit cannot silently reintroduce the trap.
      **ID SHORTFALL — REPORTED, NOT WORKED AROUND.** `id_allocation` sizes Magma at `need: 10` from
      the two-role schema. With the driver role it is **11** (5 drivers + 5 summons + a fresh r5
      damage clone, since TBC 25550 is EFFECTIVE 97 against live's 180 and there is no Vanilla r5 to
      reuse) against a 10-id block. Task 2 uses 8 and reserves 947114 (r5 driver) + 947119 (r5
      summon) + creature 920374; **Task 3 must source ONE further id from outside 947110-947119** —
      REVISED DONOR (2026-09-01, batch 2 quality review): prefer **947109**, the last id of the
