      two counts, corrected in place rather than beside.**
      (1) "one wrong number" understates it: the divergence is TWO fields, not one. wago 6495
      `SpellPower` ManaCost **65** / PowerCostPct **0** against live's ManaCost **0** /
      ManaCostPct **2**, AND wago `SpellMisc.SchoolMask` **8** (Nature) against live's **1**
      (Physical). Both raw values measured this batch.
      (2) "costs an id, a creature entry and a scriptBindings row" overstates the cost: NO creature
