      summon's own basePoints+1, unchanged 1.12 -> TBC; DurationIndex 8 and the 30 s
      CategoryRecoveryTime are inherited from the template (both verified equal in wago and live).
      **TASK 3 BATCH A (2026-09-01) COMPLETED THE FAMILY: r7 MINTED (+1 summon, +1 passive,
      +1 EFFECT, +1 creature), REUSED 0.** All four reserved ids were needed. The two arguments a
      reader will want in full — *why the effect clone 947061 is real rather than a spare id spent*,
      and *why `school:` goes on the SUMMON 25525 and not the effect* — are written out ONCE, in the
      Stoneclaw block comment in `era-data/tbc/shaman.yaml`, next to the data they justify. Do not
      re-copy them here; after batch A each stood in three places, and a triplicated argument is one
      a correction can land in and still leave two stale copies (this file has been bitten by exactly
      that: `accepted_gaps` id 7's ORIGIN-copy note). One-line summaries, plus the r7-only facts that
      live here rather than there:
        * Effect clone: live 25512 adds `SPELL_ATTR0_NO_IMMUNITIES` to a taunt; Attributes word 0 is
          NOT_FILTERED, so it discriminates. **CORRECTION 2026-09-01 to this entry's own evidence:**
          an earlier draft justified r1-r6 granting stock with "wago == live there byte-for-byte
          (Attributes 256 / AttributesEx 136 on both sides of all six)". **Both halves are wrong,
          and the DECISION they support is nevertheless right.** (a) All six stock effects
          5729/6393/6394/6395/10423/10424 carry wago `AttributesEx3` **0** against live **131072** —
          they are identical only AFTER the filters, not byte-for-byte (and note 25512 carries the
          SAME Ex3 delta, so Ex3 is not what separates r7 from r1-r6). (b) `AttributesEx` is **128**
          on 25512, not 136 — 5729 and 10424 are 136 — so word 0 was never the only shape difference
          in the family either. What actually holds up the decision is the narrower true statement:
          the six are identical on every field the filters leave discriminating, and 25512 is not.
          The Ex3 delta is N5-filtered no longer — see the narrowed `N5` and `open_questions` id 17,
          which is the behavioural question it opens.
        * `school: 8` on the SUMMON: open_questions id 12 lists 25525, and 25525 IS the summon
          (wago SpellName "Stoneclaw Totem", `Effect 28` -> creature 15478); the passive is 25513 and
          the effect is 25512. There is no 25524 anywhere in this family's wago roster.
        * **`manaCostPct: 0` and `maxLevel: 71` on the summon, neither of which r1-r6 needs.** Live
          25525 is 0 flat + 6% of base where r1-r6 are FLAT on both sides. And r7 is the one place
          noise filter **N7 does not apply**: N7 requires `EffectRealPointsPerLevel == 0` on BOTH
          sides, and every Stoneclaw summon carries **ppl 3** (health +3/level), so wago's MaxLevel
          71 against live's 0 is a live field, not an inert one. Inert below level 71 in practice;
          authored for fidelity because `SpellEffectInfo::CalcValue` genuinely reads it. **Source for
          the 71**: wago `SpellLevels-254.csv`, row ID 118138 — `SpellID 25525, BaseLevel 67,
          MaxLevel 71`; live 25525 reads MaxLevel 0. It is now carried on the r7 `summon:` row below
          so the authored value has an in-repo anchor (the `ranks:` schema had no `maxLevel` field
          before batch A, which is why it did not).
        * **The r7 PASSIVE's second effect is NOT the shape its Vanilla siblings have, and that is
          source-faithful.** wago `SpellEffect-254.csv`: 25513 EFFECT_1 is `bp -1 / DieSides 1`,
          where 5728 / 6397 / 10426 EFFECT_1 are all `bp 0 / DieSides 0`. Both encodings compute to
