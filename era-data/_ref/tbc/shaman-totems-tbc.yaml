accepted_gaps:

  - id: 1
    title: "Windfury Weapon's attack-power slot is not knowable from wago"
    detail: >-
      `spell_shaman.cpp:2158` reads `Effects[EFFECT_1]` (0-based core enum = DBC slot 2) of
      8232/8235/10486/16362/25505 as the AP bonus, and that slot has `Effect 0` in the live DBC.
      wago 2.5.4's SpellEffect table stores exactly ONE row with `Effect == 0` in the entire
      table, so TBC's value for that slot is genuinely absent from the source — the absence of a
      row is not evidence of a zero. Inherited verbatim from Plan 3a's `unverified_slots`.
    what_would_settle_it: "A 2.4.3 client Spell.dbc extract, which this project does not have.
                           Wowhead-TBC tooltips give the AP number in prose and are already cached
                           under era-data/_ref/tbc/tooltips/ — usable as a cross-check, never as a
                           DBC value."

  - id: 2
    title: "Pulse scope and radius: party/20 yd (both eras' stock) vs raid/30 yd (shipped clones)"
    detail: "See substrate_divergences.pulse_scope_and_radius. Not decided here."

  - id: 3
    title: "Sentry Totem's cost"
    status: >-
