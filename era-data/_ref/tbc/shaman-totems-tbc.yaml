    tbc_authoring_note: >-
      MINTED 6 / REUSED 12 (6 passives + 6 creatures). Passives 931070-931075 reused: wago
      5728/6397/6398/6399/10425/10426 are byte-identical to LIVE and to the shipped clones once N6
      is applied, keeping the two-effect 1.12/TBC shape (e1 aura 23 every 2000 ms -> the stock threat
      effect 5729-chain, e2 aura 42 -> 39796 Stoneclaw Stun). Creatures 920130-920135 reused with them.
      **THE B.2 SUBTLETY WORTH RECORDING: the SUMMONS are TBC == LIVE on every compared field**
      (mana 15/30/55/75/105/140 flat, DurationIndex 8 = 15 s, CategoryRecoveryTime 30000 — the
      `clone_vs_tbc_divergences` list below is CLONE-vs-TBC, and the shipped clone's 1.12 mana
      20/40/65/95/130/170 is the outlier, exactly as Searing is). So B.2's "grant the stock spell"
      branch fires on the data — **and must still be refused.** Granting stock 5730 summons the STOCK
      creature 3579, whose `creature_template_spell` Index 1 is 55328 (the
      `spell_sha_stoneclaw_totem` WotLK absorb-shield chain, verified in acore_world), which a TBC
      shaman must not get. The clones 947050-947055 therefore exist ONLY to redirect EffectMiscValue
      at the era creature (noise filter N2) — the mana override happens to be a no-op against live and
      a real change against the Vanilla clone. **Generalisable: for a totem SUMMON, "TBC == live" is
      never sufficient on its own; the stock CREATURE's spell list is part of the comparison and is
      not in spell data.**
