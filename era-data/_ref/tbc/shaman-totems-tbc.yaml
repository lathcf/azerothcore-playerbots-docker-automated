      **AUTHORED 2026-09-01 (Task 2 batch 4b), ranks 1-3 only; ranks 4/5 (25585 L61 / 25587 L70) are
      Task 3's.** Ids: summons 947330/947331/947332, passives 947335/947336/947337, FRESH creatures
      920560/920561/920562. Task 3 reservations: summons 947333/947334, passives 947338/947339,
      creatures 920563/920564 -- which fills the 10-id block EXACTLY, with no overflow and nothing
      borrowed from another family's block.
      THE LITERAL TBC ENCODING IS DELIBERATELY NOT AUTHORED, and this is the one family where that is
      forced rather than chosen. Measured id by id against `azerothcore-wotlk/ip-dbc/Spell.dbc`
      (50 011 rows): of TBC's four-layer chain only the r1 summon **8512** and the r1 passive **8515**
      exist; the ENTIRE `Effect` series (8514 / 10607 / 10611 / 25579 / 25580, `Effect 92
      ENCHANT_HELD_ITEM`) and the ENTIRE payload series (8516 / 10608 / 10610 / 25583 / 25584,
      `aura 99 MOD_ATTACK_POWER` + `Effect 19 ADD_EXTRA_ATTACKS` = ONE extra attack) are ABSENT, as
      are ranks 2-5 of both the summon and the passive.
      NEW EVIDENCE, from a table nobody in this phase had read: the five `SpellItemEnchantment.dbc`
      rows the Effect series points at DO survive in `azerothcore-wotlk/ip-dbc/
      SpellItemEnchantment.dbc` -- **1783 / 563 / 564 / 2638 / 2639, named "Windfury Totem 1".."5"**,
      each `type[0] = 1` ITEM_ENCHANTMENT_TYPE_COMBAT_SPELL with `EffectPointsMin/Max = 20` and
      `spellid[0]` = the ABSENT payload. So a literal clone would apply a weapon enchant that procs
      NOTHING, log one `Player::CastItemCombatSpell` "unknown spell ... ignoring" line per qualifying
      swing per imbued raid member (the error precedes the chance roll).
      **RETRACTED 2026-09-01 (batch 4b spec review) -- the "added harm" DOES NOT EXIST.** This entry
      claimed a dead enchant would occupy `TEMP_ENCHANTMENT_SLOT` and make
      `Spell::EffectEnchantHeldItem` REFUSE every real temp imbue for the whole party, and used that
      to argue Windfury is worse than the Flametongue wall. The causal direction is inverted: that
      refusal (SpellEffects.cpp:4469) is inside the TOTEM's OWN handler, while every named imbue
      (Windfury Weapon 8232, Flametongue Weapon 8024, poisons) is `Effect 54` ->
      `EffectEnchantItemTmp` (:126), which OVERWRITES unconditionally (:3128-3134). A squatting
      totem enchant is silently replaced. The refusal blocks the TOTEM's imbue when a self-imbue is
      present -- the asymmetry `IsWindfuryWeaponEnchant` is built on. So this is EXACTLY the
      Flametongue wall, no more: the rejection stands on the unthrottled per-swing LOG_ERROR alone.
      **Also retracted: "re-pointing the enchant is impossible from this pipeline".**
      `DBCStores.cpp:377` overlays `SpellItemEnchantment` from the `spellitemenchantment_dbc` table
      via the same `LoadFromDB` path `spell_dbc` rides, and that table ships in the fork base. The
      CLIENT half is real (`merge-into-patch.sh` patches only Spell.dbc + SkillLineAbility.dbc, so a
      minted enchant id has no client-side visual) and the machinery cost is real -- rest the
      decision on those, not on an impossibility a single grep falsifies.
      WHAT IS AUTHORED is this file's own prescription at `script_bindings[931366/931367/931368]`:
      the shipped Vanilla RECONSTRUCTION (permanent RAID DUMMY area aura -- `effect: 65` is
      APPLY_AREA_AURA_RAID; 35 is PARTY, and B.8 chose 65 deliberately -- plus a `spell_proc` row +
