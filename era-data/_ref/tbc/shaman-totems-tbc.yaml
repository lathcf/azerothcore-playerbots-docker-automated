  - id: 10
    q: "RETRACTED -- Fire Resistance Totem's SkillLine: does wago disagree with live?"
    status: >-
      **RETRACTED 2026-09-01 by the batch 3 spec review. THE DISAGREEMENT DOES NOT EXIST.** This
      entry claimed wago 2.5.4 puts 8184 / 10537 / 10538 / 25563 on SkillLine 374 against live's 373.
      Re-measured directly in `/tmp/claude-1000/tbc-shaman/SkillLineAbility-254.csv`: wago rows
      8778 / 8779 / 8780 / 13312 all read SkillLine **373** -- the SAME rows and the SAME value as
      `ip-dbc/SkillLineAbility.dbc`. There is one number in evidence and it is 373. (Both sources
      likewise agree on 374 for Healing Stream 5394, Mana Spring 5675 and the Cleansing pair
      8166/8170, and on 373 for Frost Resistance 8181 -- so the read is not skewed.)
    shipped_value_is_correct: >-
      `skillLine: 373` as shipped matches wago, live, and the Vanilla clone. **No data change is
      needed and none was made.** The defect was entirely documentary.
    why_it_mattered: >-
      Two harms, both to the record rather than to players. It left a permanent open question whose
      `settled_by` asked for a 2.4.3 client DBC that nothing actually needs; and -- worse -- it
      established a FALSE PRECEDENT: a recorded, apparently-blessed instance of "we departed from
      wago because era-to-era consistency beats fidelity", which a later author could cite for a
      case where the departure IS real. A fabricated departure is more dangerous than a wrong value,
      because it is quotable.
    lesson: >-
      The claim was reported as "the one call most worth a second opinion", and the second opinion
      checked only the LIVE half -- which was true -- and accepted the wago half on trust. **When a
      finding asserts that two sources disagree, verify BOTH sources.** Confirming the half you
      expected to be true is not verification of the disagreement.

  - id: 11
    q: "How many era clones silently lose a by-id `SpellInfoCorrections` fix, and does any of them matter?"
    found_by: "Plan 3b Task 2 batch 4a, 2026-09-01, after Sentry's clone turned out to need one."
    evidence: >-
      `SpellInfoCorrections.cpp` patches stock SpellInfo records BY ID at load. A `spell_dbc` clone is
      a different id, so it receives NOTHING. Swept every `ApplySpellFix({...})` id set against every
      `template:` id used by `era-data/vanilla/shaman.yaml` + `era-data/tbc/shaman.yaml` (135 distinct
      templates). **COUNT AND SCOPE BOTH CORRECTED 2026-09-01.** This originally read "NINE templates
      match, covering 22 clones". The correct figures for the SHAMAN pair are **7 ApplySpellFix
      id-SETS across 12 templates, covering 22 clones** -- the "9" counted bullets below, not sets.
      And the sweep was only ever SHAMAN-scoped: repo-wide there are 15 sets hitting ~49 clones in 7
      datasets, which a manual sweep would keep missing. **That is why this is now an automated audit
      check** (`era_audit.py::check_spellfix_inheritance`) rather than a list: the list goes stale the
      moment another class clones a corrected template. Bullets below are the shaman slice only:
        * **6495 -> 947260 (batch 4a).** `Effects[EFFECT_0].RadiusEntry = LookupEntry(0)`.
          **MATTERS A LOT** - `Spell::SelectImplicitCasterDestTargets` (Spell.cpp:1683-1701) uses the
          effect radius as the DROP DISTANCE for totem-slot targets 41-44, and stock index 12 is
          100 yd. FIXED IN DATA: `radius: 0` authored.
        * **2895 -> 947301 (batch 4a).** `Effects[EFFECT_0].TargetA = TARGET_UNIT_CASTER`,
          `TargetB = 0` (stock 18 / 33). FIXED IN DATA: authored on both effects.
        * **6474 -> 947001 (batch 1, Earthbind driver).** Adds `SPELL_ATTR5_EXTRA_INITIAL_PERIOD`, so
          the stock driver fires its first trigger IMMEDIATELY. The clone does not, i.e. the slow
          field first lands ~3 s after the totem drops. **FIXED 2026-09-01 in commit aaa4086** --
          the generator gained `attributesEx2/3/5` keys and 947001 authors `attributesEx5: 512`.
          (Was recorded as: NOT authorable, `AttributesEx5` has no
          generator key - noise filter N5). Partially undermines the very defect batch 1 minted the
          driver to fix.
        * **8145 -> 931090 (shipped Vanilla Tremor passive, REUSED by batch 1).** Same attribute,
          same consequence: first dispel pulse ~3 s late.
        * **8171 -> 947212 / 947222 (batch 3, the Cleansing effect clones).** Adds
          `SPELL_ATTR2_IGNORE_LINE_OF_SIGHT`; the clones require LoS to dispel.
          **FIXED 2026-09-01 (aaa4086): 947212/947222 author `attributesEx2: 4`.**
        * **52041 -> 931148-931151 (Vanilla) + 947130-947133 (batch 2 Flametongue effects).** Same
          attribute, same shape. **FIXED 2026-09-01 (aaa4086): 947130-947133 author
          `attributesEx2: 268435460` -- the LoS bit ORed onto the inherited NOT_AN_ACTION bit, not
          overwriting it. The shipped VANILLA clones 931148-151 keep the gap (substrate rule).**
        * **17364 -> 932405 (Vanilla) + 946520 (Plan 3a Stormstrike).** Adds
          **931090 Tremor FIXED 2026-09-01 (user decision) -- THE ONE DELIBERATE EDIT TO MERGED
          VANILLA SUBSTRATE IN THIS PHASE.** The substrate rule was overridden because the gap was
          not confined to merged content: `era-data/tbc/shaman.yaml` REUSES 931090 (its Tremor summon
          points at creature 920140, which casts it), so leaving it shipped the defect into the
          UNMERGED TBC era too. Tremor's whole value is responsiveness and its first dispel pulse was
          waiting a full 3000 ms. `attributesEx5: 512`; blast radius verified as exactly one column
          on one row. NEEDS a Vanilla-side regression pass + a fresh patch-V.mpq for Vanilla players.
          `SPELL_ATTR3_DOT_STACKING_RULE`. **946520 FIXED 2026-09-01** (`attributesEx3: 67108994`
          = live 17364's 67108866 | 0x80) after the batch 4a spec review caught that aaa4086 added
          the `attributesEx3` key CITING Stormstrike, then mislabelled 946520 as a shipped-Vanilla
          clone -- it is TBC/Plan 3a, unmerged and freely editable -- and left it unfixed. The
          genuinely shipped-Vanilla 932405 keeps the gap.**
        * **8076 / 8162 / 8163 / 10441 -> 931050-931053 (Strength of Earth pulses).** MOOT: the fix
          copies EFFECT_0's radius onto slots 2 and 3, and the era clones author only slot 1.
        * **16166 -> 932413 / 946513 (Elemental Mastery).** MOOT: the fix rewrites
          `Effects[EFFECT_0].SpellClassMask`, and both clones author their own per-effect masks.
      **TALLY REVISED 2026-09-01.** Originally: "2 mattered and are fixed in data, 5 matter and are
      NOT authorable, 2 are moot". The "NOT authorable" verdict was overtaken the same day -- commit
      aaa4086 added the `attributesEx2/3/5` generator keys, so **all five became authorable and are
      now authored** (947001, 947130-133, 947212, 947222, 946520). Only shipped-VANILLA clones keep
