      SpellItemEnchantment.dbc is not one of the two DBCs `era-regen` patches, and the SERVER reads
      it from `env/dist/data/dbc`.
    what_would_settle_it: "the same spec call open_questions id 7 is waiting on; the measurement
                           itself is closed."

  - id: 14
    title: "TBC totem SUMMONS are silenceable and live ones are not: `SpellCategories.PreventionType`
            1 -> 0, project-wide, and never in the swept column list"
    status: "**CLOSED 2026-09-02 (tooltip-honesty fix round, user call): the `preventionType`
             _HELPER_SCALARS key was added (tools/gen_era_talents.py, test
             test_helper_prevention_type_scalar) and `preventionType: 1` authored on every real totem
             summon clone in BOTH eras (85 TBC + 69 Vanilla rows; Sentry 947260 excluded — 0 on both
             sides). The Vanilla behavior change ships in the same bundled prod push as the rest of
             this round.**"
    found_by: "Plan 3b Task 3 batch A review, 2026-09-01."
    detail: >-
      **Measured across the whole 214-row `ranks:` roster** (wago `SpellCategories-254.csv`
      `PreventionType` against `azerothcore-wotlk/ip-dbc/Spell.dbc` column 214; 156 role-rows carry
      the field in both stores). **72 rows diverge, and every single one is a totem SUMMON: wago 1,
      live 0.** Nothing else in the roster diverges on this field — no pulse, no passive, no effect,
      no attack. Of the 81 comparable `summon:` rows only 9 agree, and none of those 9 is a real
      totem summon: the seven FireNovaTotem "summons" are the Fire Nova CAST spells
      (1535/8498/8499/11314/11315/25546/25547, PreventionType 1 on BOTH sides) and Sentry's 6495 is
      0 on both. Batch A's five 61-70 summons (25508, 25509, 25361, 25528, 25525) are simply five
      members of that 72; so are 8071/8154/8155/10406/10407/10408 (Stoneskin r1-r6),
      8075/8160/8161/10442 (Strength of Earth r1-r4) and 5730/6390/6391/6392/10427/10428
      (Stoneclaw r1-r6), spot-checked individually.
      **Behaviour.** `PreventionType == SPELL_PREVENTION_TYPE_SILENCE` is what makes a cast fail
      under silence / school lockout — `Spell.cpp:6948`
      (`unitflag & UNIT_FLAG_SILENCED && m_spellInfo->PreventionType == SPELL_PREVENTION_TYPE_SILENCE`),
      `Spell.cpp:7007`, `SpellAuraEffects.cpp:3170-3173` and `Player.cpp:10734`. So in TBC a silenced
      or Nature-locked shaman could not drop a totem, and on this build he can. Era-unfaithful, and
      in the shaman's favour.
      **This is a PROJECT-WIDE property of the substrate, not a batch-A regression.** Every totem
      summon clone this plan has shipped — Vanilla and TBC, every batch — inherits live's 0 from its
      template, because a clone inherits every field it does not author.
    why_not_fixed_here: >-
      There is no generator key: `grep -c PreventionType tools/gen_era_talents.py` = **0**, so the
      field is genuinely unauthorable today and fails `method.conventions.discrimination_test` — a
      fresh clone lands exactly where a reused one does. Adding a `_HELPER_SCALARS` entry is a
      one-line generator change, but it would then have to be authored on ~72 rows across BOTH eras
      and would change shipped, merged, real-client-verified Vanilla behaviour, which is a spec call
      of the same class as `open_questions` ids 1 / 5 / 8 / 13's Vanilla halves.
      **Recorded here mainly because it should have been recorded in Task 1 and was not.** It is not
      in `method.noise_filters`, and `NOT_FILTERED` says "Nothing else" — so by this file's own rule
      an unfiltered field is discriminating and must appear in a divergence list. It appears in none.
      The actual cause is narrower and worth naming: the Task-1 sweep's COLUMN LIST omitted
      `SpellCategories.PreventionType` altogether, so no comparison was ever made and no filter was
      ever needed. Same failure mode as memory `tbc-survival-sweep-five-field-families`: when a sweep
      reports everything matching, suspect the column list before believing the verdict.
    what_would_settle_it: "a spec call on adding a `preventionType` generator key and back-authoring
                           it across both eras; the measurement itself is closed."

