# Id budget — a hard finding for Task 2.
# =============================================================================================
id_budget:
  reserved_by_the_plan: "947000-947439 (440 ids) for totem summon/pulse clones on a stride-20
                         scheme (`summonBase = 947000 + i*20`, `pulseBase = summonBase + 10`),
                         and 947440-947511 for Windfury Weapon + the 'Era: TBC Totems' marker."
  marker_receipt: "947440 = 'Era: TBC Totems' AUTHORED by Task 5 (2026-09-01), the 932416/932417
                   shape with a client row (it is a trainer ReqAbility1). 947441 = Windfury WEAPON
                   r5 clone, AUTHORED by Task 7 (2026-09-01) -- the family measured GRANT-STOCK at
                   r1-r4, so one clone instead of five. 947442-947511 stay free."
  fixround_receipt: "2026-09-02 tooltip-honesty round: 947442 Flametongue Attack vehicle (family-
                    zeroed 10444 clone), 947443 Nature's Guardian heal vehicle, 947444 Elemental
                    Focus clone, 947445 Clearcasting clone -- 947446-947511 stay free. In-family:
                    947135-947139 = the restored Flametongue proc role (the FT decade's own free
                    tail), 947062-947067 = Stoneclaw effect clones (OQ 17's own reservation;
                    947057-947059 + 947068/947069 stay free). VANILLA band: 931390 = Sentry
                    Totem Vanilla clone (Sentry trainer-row fix, 2026-09-02; 931374-931389 +
                    931391-931399 stay free)."
  measured_requirement:
    raw_ids_needed: 191
    note: "Sum of `fresh_ids_needed:` across all families, counting only the roles the Vanilla
           substrate actually modelled. 191 < 440, so the BAND is large enough."
  the_problem: >-
    **The STRIDE is not.** 26 families need a slot (28 roster families minus FireNovaSpell and
    CleansingTotem, which are hide-only pseudo-families, minus Sentry if it stays stock; plus
    Totem of Wrath, which Task 4 owns). 26 x 20 = **520 ids**, which runs from 947000 to 947519 —
    past the 947439 boundary and straight through the 947440-947511 Windfury Weapon / marker
    sub-range. The stride-20 scheme as written in the plan and the framework registry OVERFLOWS.
  options_for_task_2:
    - "Pack per-family instead of striding: 191 ids fit inside 947000-947439 with 249 to spare,
       and the ledger below gives the exact per-family count."
    - "Keep the stride and extend into 947512-947999 (the framework registry shows 947512-949999
       as unclaimed, so the shaman slice would grow past its stated 946512-947511 end and the
       registry row must be amended)."
    - "Keep the stride, reuse the five IDENTICAL roles in place, and shrink the slot count — this
       saves only Earthbind, Magma, Tremor, Stoneclaw and Grounding pulses/passives, i.e. ~5 ids,
       and no whole family, so it does NOT solve the overflow on its own."
  per_family_roles_over_10: >-
    Under a strict 10-summon + 10-pulse split, only Flametongue is tight (5 summon + 5 passive +
    5 effect = the pulse half exactly fills), and Grounding / Poison Cleansing / Disease Cleansing
    each need three roles at 1 rank apiece (trivially packs). Stoneclaw needs 7 + 7. No family
    exceeds 10 in either half.
  tooling_change_task2_batch1: >-
    Cross-era creature/pulse REUSE needed one additive change to `tools/era_audit.py`.
    `check_totem_summons` resolved the summon -> creature -> pulse chain PER DATASET, so a TBC summon
    pointing at a Vanilla creature entry reported "references totem creature 920100 with no totems:
    entry", and a `totems:` row naming a Vanilla pulse would have reported "not an emitted custom
    spell id". Both are the reuse the plan's Key facts prescribe, not defects. The check now resolves
    against the UNION of every dataset on the run (a single-dataset run behaves exactly as before —
    the two existing audit tests are unchanged and still pass) and gained one new finding:
    two datasets DECLARING the same creature entry, which would emit two `creature_template` rows for
    one entry from two generated SQL files. Reuse means REFERENCING, never redeclaring.
    Covered by `test_audit_totem_reuse_across_datasets` and
    `test_audit_flags_duplicate_totem_creature_across_datasets`.
  creature_entries:
    reserved: "920300 + i*10 inside [920000, 921000); 920291-920999 are free (69 creature_template
               rows currently exist in the band, 920100-920290)."
    measured_requirement: >-
      One creature per SUMMON rank that gets a fresh clone = **92** entries under the all-fresh
      ledger (94 TBC summon ranks across the 29 families, minus the two hide-only pseudo-families
      FireNovaSpell and CleansingTotem, which mint nothing). `920300 + i*10` gives 10 per family x 26 = 260 entries ending at 920559 — that fits
      [920000,921000) comfortably, so the creature band has no overflow. Note Stoneskin needs 8
      and Fire Nova Totem needs 7, both inside the 10-wide stride.

