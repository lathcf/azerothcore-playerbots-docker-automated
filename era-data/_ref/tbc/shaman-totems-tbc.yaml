  - id: 14
    q: "Should the TBC Windfury Totem reconstruction proc off the OFF hand, when TBC's own enchant
        could only ever reach the MAIN hand?"
    found_by: "Plan 3b Task 2 batch 4b, 2026-09-01."
    evidence: >-
      TBC delivers Windfury Totem as a weapon ENCHANT: passive (aura 23 @5000 ms) -> effect
      (`Effect 92 ENCHANT_HELD_ITEM`, enchant 1783/563/564/2638/2639) -> payload. On this build
      `Spell::EffectEnchantHeldItem` (SpellEffects.cpp:4441-4444) reads
      `GetItemByPos(INVENTORY_SLOT_BAG_0, EQUIPMENT_SLOT_MAINHAND)` and NOTHING ELSE, so an imbue
      delivered that way can only ever proc off MAIN-hand swings. The era reconstruction is not an
      enchant at all -- it is a `spell_proc` row -- and both the shipped Vanilla clones 931366-931368
      and the new TBC clones 947335-947337 carry `ProcFlags 12582912` =
      DONE_MAINHAND_ATTACK|DONE_OFFHAND_ATTACK, which roughly DOUBLES the proc rate for a
      dual-wielding enhancement shaman.
      KEPT DELIBERATELY, for Amendment B.8's reason rather than by oversight: 1.12 used the same
      enchant mechanic, so the shipped Vanilla reconstruction carries the identical artifact, and
      narrowing TBC alone would show a visible downgrade at an era ADVANCE. **Not measured, and
      deliberately not asserted:** whether the 2.4.3 SERVER's own ENCHANT_HELD_ITEM was main-hand
      only. The 3.3.5a implementation is; TBC's is not readable from anything in this project. The
      inference from the effect's name and single-target shape is strong but it is an inference.
    settled_by: >-
      A design call, wanted ONCE for both eras (Vanilla has the same artifact, and it is shipped,
      merged, real-client-verified content -- same handling as open questions 1, 5, 8 and 13). The
      fix, if wanted, is one key on each of six helpers: `proc.flags: 4194304`
      (PROC_FLAG_DONE_MAINHAND_ATTACK = 0x00400000 alone -- SpellMgr.h:143. NB 8388608 = 0x00800000
      is the OFF-hand bit; 12582912 is the two ORed). No script change: `spell_era_windfury_totem::HandleProc` already
      branches on the mainHand/offHand type mask and would simply stop seeing off-hand events.

  - id: 16
    q: "947300 and 947301 share the name 'Wrath of Air Totem'. The bot AI's same-name tie-break picks
        the HIGHEST id -- which is the pulse, an uncastable passive. Does that ever activate?"
    found_by: "Plan 3b batch 4a quality review, 2026-09-01."
    evidence: >-
      `EraTalentBots_ResolveSpellId` (`modules/mod-era-talents/src/EraTalentBots.cpp:481-482`) breaks
      same-name ties with `if (spellId > resolved) resolved = spellId;`, on the assumption that ids
      ascend with RANK within an era chain. Both helpers emit
      `Name_Lang_enUS = 'Wrath of Air Totem'` -- source-faithful, since live 3738 and 2895 are both
      named that. Its three sibling families in the same batch do NOT collide
      ('Grace of Air Totem'/'Grace of Air', 'Windwall Totem'/'Windwall',
      'Tranquil Air Totem'/'Tranquil Air'), so this is a within-batch inconsistency rather than a
      convention.
    status: >-
      **SETTLED 2026-09-01 (Plan 3b Task 3), by RENAME.** Helper 947301's `name:` and `client.name`
      are now `Wrath of Air` (was `Wrath of Air Totem`), so the summon 947300 holds the name
      `Wrath of Air Totem` uniquely and the tie-break has nothing to break. Settled BEFORE Task 3's
      own wiring, because Task 3/5 wiring is exactly what would have activated it. No C++ changed.
      Previously: **LATENT, not live** -- no batch-4a pulse was granted, trainer-wired or in
      `spell_ranks`, so no pulse was in a bot's `GetSpellMap()` and the scan could not reach one.
    why_it_matters: >-
      In EVERY batch-4a family the pulse id sorts ABOVE the summon (947270-271/947275-276,
      947280-282/947285-287, 947290/947291, 947300/947301), so if the collision ever activates the
      tie-break fails in the worst direction UNIFORMLY: the AI would resolve a castable totem to an
      uncastable passive. The blast radius is not one family.
    settled_by: >-
      Either rename the pulse (the sibling families' convention -- drop 'Totem' from the pulse, which
      is what live's own naming does for every other air totem), or make the tie-break rank-aware
      instead of id-aware. Renaming is the cheaper of the two and needs no C++.

  - id: 15
    q: "Every TEMPLATED totem SUMMON clone ships its donor's WotLK `AuraDescription` on the CLIENT
        row. Is that really dead data?"
    found_by: "Plan 3b Task 2 batch 4b, 2026-09-01 -- while verifying that the batch's own client
               rows carried the authored prose."
    evidence: >-
      `tools/build_client_dbc.py:110-126` requires an authored `client.auraDescription` ONLY when the
      helper applies an aura (`effect: 6`); a SUMMON (`effect: 28`) applies none, so the guard is
      skipped and the template's text is inherited verbatim. Measured on the batch-4b rows extracted
      from the built `client-patch/out/patch-V.mpq`: 947330-947332 carry
      **"Increases melee haste by $8515s1%."** -- WotLK's Windfury Totem rework, hyperlinked to live
      8515, i.e. the exact prose gap 8 exists to get away from. Their authored `Description` is
      correct; only the aura slot leaks.
      **RESOLVED 2026-09-01 -- and the generalization above was FALSE.** The mechanism is right; the
      scope was measured wrong and all three cross-batch spot-checks were incorrect. Raw values, read
      from `ip-dbc/Spell.dbc`:
        * 947300 Wrath of Air templates **3738, not 2895** (2895 is 947301's, which authors its own
          `client.auraDescription` and never leaked); donor 3738's `AuraDescription` is **''**.
        * 947270 Grace of Air (template 10595) -> **''**. 947120 Flametongue (template 8227) -> **''**.
      So none of the three named helpers leaked anything. A sweep of the templated non-aura helpers
      in `era-data/tbc/shaman.yaml` gives the ACTUAL leak set -- not "every", and not a fixed number
      either, since the dataset grows batch by batch.
      **THIS ENTRY IS THE SINGLE MAINTAINED HOME OF THAT COUNT.** It used to be re-transcribed into
      every affected helper's inline comment, where the copies drifted out of step with each other
      and with reality (batch A found nine comments claiming "9 of 64" beside a tenth helper worded
      differently again). The per-helper comments are now short pointers back here; update the
      numbers HERE and nowhere else.
      **Re-measured 2026-09-01, after Task 3 batch A** (`build_client_dbc.py:110-126` semantics: a
      helper is leak-capable when it has a `template:` and NO authored `effect: 6`, so the raise-guard
      is skipped):
        * **91** templated non-aura helpers in the dataset (was 64 when this entry was written).
        * **25** of them have a donor carrying a non-empty `AuraDescription` -- i.e. 25 would leak
          WotLK aura prose without an authored key.
        * Of those 25, **15 author era-correct replacement text** (the Stoneskin pulses 947010-947017,
          Strength of Earth 947040/947041, Mana Spring 947195-947198, Wrath of Air 947301) and
          **10 author `auraDescription: ""` as pure suppression**: 947050-947055 + **947056** Stoneclaw
          (donors 5730/6390/6391/6392/10427/10428/**25525**, "Taunting creatures.") and 947330-947332
          Windfury Totem (donor 8512, "Increases melee haste by $8515s1%."). **947056 is the tenth,
          added by batch A** -- the count in the old per-helper comments said nine and was already
          one short the moment batch A landed.
        * The remaining 66 donors carry an empty string.
      Batch A's four other new summons were swept too and correctly need no key: donors **25508 /
      25509 / 25361 / 25528** all read `''`, as does the effect donor **25512**.
      **The leak set is empty at the authored level.** The fix was ten keys, not a 91-helper sweep --
      and "it is everywhere, so it is nobody's" was the stated reason for deferring it for one family.
      Lesson: a scope claim used to justify a deferral has to be measured with the same rigour as a
      value; and a count worth maintaining belongs in exactly one place.

  - id: 17
    q: "DECISION OWED, not a measurement gap: TBC's Stoneclaw taunt pulls an UNENGAGED mob and this
        server's does not. Do we make the family era-faithful, and if so how far down the chain?"
    status: "**STONECLAW HALF DECIDED + CLOSED 2026-09-02 (user call, option (b)): effects r1-r6
             cloned into 947062-947067 with `attributesEx3: 0` (everything else byte-inherited;
             measured — ex3 is the chain's only divergence), the shared Vanilla passives 931070-75
             re-pointed onto them (fixes BOTH eras), and the minted r7 947061 authored ex3: 0. The
             FIRENOVATOTEM half stays OPEN exactly as `the_same_question_is_worse_for_firenovatotem`
             frames it — different bits (Ex3 NO_AVOIDANCE + Ex5 AOE_LOS), different consequence, and
             it was not part of this decision.**"
    found_by: "Plan 3b Task 3 batch A review, 2026-09-01 — surfaced by narrowing noise filter N5."
    evidence: >-
      Narrowing `N5` to Ex4/Ex6/Ex7 (the generator gained `attributesEx3`, so Ex3 is authorable now)
      un-filters a real behavioural difference on the Stoneclaw EFFECT chain. wago
      `AttributesEx3` is **0** on all seven effects 5729/6393/6394/6395/10423/10424/25512; live is
      **131072** on all seven = `SPELL_ATTR3_SUPPRESS_TARGET_PROCS`, whose in-tree TITLE comment
      (`SharedDefines.h:498`) is "No initial aggro".
      That bit is read at `azerothcore-wotlk/src/server/game/Combat/ThreatManager.cpp:399`:
      `if (!_owner->IsEngaged() && spell->HasAttribute(SPELL_ATTR3_SUPPRESS_TARGET_PROCS)) return;`.
      `Spell::EffectThreat` (`SpellEffects.cpp:3710`, effect 63 — which is exactly what these seven
      spells are) routes into `AddThreat`, and the Stoneclaw effect hits every enemy in the area
      (`ImplicitTarget_0 22` TARGET_SRC_CASTER / `ImplicitTarget_1 15` TARGET_UNIT_SRC_AREA_ENEMY).
      **So on LIVE the totem's taunt adds ZERO threat to a mob that is not yet engaged; in TBC (bit
      clear) it would pull it.** That is the whole point of a taunt totem, so the divergence is not
      cosmetic.
    why_not_fixed_in_batch_a: >-
      Because a correct fix is bigger than the batch. Stoneclaw r1-r6 **grant the stock effects**
      (5729-chain) and only r7 is minted, so authoring `attributesEx3: 0` on 947061 alone would make
      the TOP rank behave differently from every rank below it — strictly worse than the uniform
      divergence it replaces. Era-faithfulness here means cloning the r1-r6 effects too, which
      REVERSES a Task 2 disposition ("r1-r6 grant stock; wago == live there") and is a spec-level
      call, not a batch fix. The ids exist if the answer is yes: Stoneclaw's block has headroom at
      **947057-947059 and 947062-947069**.
    the_same_question_is_worse_for_firenovatotem: >-
      FireNovaTotem's seven `blast` rows carry the identical class of Ex3 divergence (wago **64**
      `SPELL_ATTR3_NO_AVOIDANCE` vs live **1073741824** `SPELL_ATTR3_DO_NOT_DISPLAY_RANGE`, the
      latter client-only), plus an `AttributesEx5` one (wago 0 vs live **67108864**
      `SPELL_ATTR5_ALWAYS_AOE_LINE_OF_SIGHT`). But its r1-r5 blasts are **REUSED shipped Vanilla
      clones 931358-931362, already merged to master** — so an era-faithful fix there would touch
      merged substrate, the same class of decision as the Tremor 931090 case, and it is NOT enough to
      decide Stoneclaw and assume the answer carries.
    do_not_decide_this_in_batch_b: >-
      **Batch B must NOT settle this unilaterally.** It reverses a shipped Task 2 disposition and, in
      FireNovaTotem's half, reaches merged Vanilla content. The orchestrator is putting it to the
      user; until there is an answer, leave `attributesEx3` unauthored everywhere in this roster so
      the divergence stays uniform rather than half-corrected.
    settled_by: "a user/spec call on (a) leave as-is and record, (b) clone Stoneclaw r1-r6 effects
                 into 947057-947059/947062-947069 and author `attributesEx3: 0` on all seven, or
                 (c) (b) plus the FireNovaTotem blasts, which reaches merged Vanilla data."

