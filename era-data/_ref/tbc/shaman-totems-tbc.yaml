# TBC (2.4.3) shaman TOTEM reference — the LIVE-MEASURED reuse ledger, per-family TBC values,
# script-binding census and rank map for Plan 3b (totem roster + Windfury Weapon).
#
# Era-scoped. The era-less `era-data/_ref/shaman-totems.yaml` is the 1.12.1 record and MUST NOT be
# inherited as TBC values; the era-less `era-data/_ref/shaman-spells.yaml` and the TBC sibling
# `era-data/_ref/tbc/shaman-spells.yaml` (Plan 3a) cover the TREE, not the roster. Class 7, spell
# family 11 — the mirror of druid's class 11 / family 7. Do not transpose them.
#
# Produced by Plan 3b Task 1, 2026-09-01. Authority chain: **wago 2.5.4.44833 for TBC values**
# (project convention, memory `tbc-era-value-basis-wago-2540`), the LIVE 3.3.5a store for what this
# server actually has, `acore_world.spell_dbc` for what the SHIPPED Vanilla clones actually are.
#
# ===========================================================================================
# WHERE THIS FILE AND THE SPEC'S §6.3 LEDGER DISAGREE, **THIS FILE WINS** — see
# `spec_ledger_contradictions:`. §6.3 was a headless 1.12-vs-2.4.3 effect diff; it never compared
# mana, duration, attributes or class masks, and it compared TBC RAW base points against 1.12
# EFFECTIVE ones. Its verdict was 19 value-identical / 5 retuned / 3 encoding-read-owed / 1
# from-scratch. The measured verdict is **0 identical / 21 retuned / 8 from-scratch.**
# ===========================================================================================

era: 1
class: 7
family: 11
familyName: 11

skillLines:            # live-confirmed, era-neutral (a SkillLine is a property of the 3.3.5a store)
  elemental: 375
  enhancement: 373
  restoration: 374     # SHAMAN Restoration. NEVER 573 — that is the DRUID line.

method:

  # =========================================================================================
  # READ THESE CONVENTIONS BEFORE USING ANY NUMBER IN THIS FILE.
  # =========================================================================================
  conventions:

    what_reuse_actually_compares: >-
      The spec's §6.3 ledger compares 1.12 against 2.4.3. That is a PROXY. The thing a TBC shaman
      would actually be granted is the SHIPPED VANILLA CLONE — a 931xxx row in
      acore_world.spell_dbc that was authored from 1.12 values ON TOP OF a live 3.3.5a template,
      so it carries live's attributes, live's DurationIndex, live's radius index and live's
      area-aura scope wherever the Vanilla author did not override them. The reuse question is
      therefore **CLONE vs TBC**, not 1.12 vs TBC, and this file measures that directly (the
      `clone_vs_tbc_divergences:` key on every family). 1.12-vs-TBC is recorded too, because it is
      what the spec asserted and what a reader will want to check against — but it is never the
      deciding comparison. This is the totem-side restatement of Amendment A.9's Flurry lesson:
      "the reused id's template IS the WotLK spell".

    magnitudes_are_effective: >-
      EVERY magnitude in this file is the EFFECTIVE value the server computes.
      `SpellEffectInfo::CalcValue` adds `irand(1, DieSides)` when DieSides > 1, `+1` when
      DieSides == 1, and nothing when DieSides == 0 — so effective MIN = basePoints + 1 whenever
      DieSides >= 1. Each `ranks:` entry carries `value:` (effective min), plus `raw:`/`die:` and,
      for rolled damage, `max:` (= raw + die), so the reader can re-derive without trusting the
      normalisation. Where prose quotes a number it is effective unless it says "raw".
      **This is the single most important convention in this file**: the spec's §6.3 retune column
      quotes TBC RAW against 1.12 EFFECTIVE, which makes several of its numbers one low and could
      have masked a genuine one-unit difference in the other direction (Amendment A.1's warning,
      landing exactly as predicted — see spec_ledger_contradictions id 4).

    verdict_vocabulary: >-
      IDENTICAL = every DISCRIMINATING field of the shipped Vanilla clone equals TBC's, so a TBC
      shaman can simply be granted the existing 931xxx id. RETUNED = at least one discriminating
      field differs, so the family needs a fresh 947xxx clone (the §1.3 all-or-nothing rule).
      ABSENT_BOTH = there is no shipped Vanilla clone at all (either the family is TBC-new, or the
      Vanilla phase granted stock / hid it), so the family is from-scratch for TBC.
      Verdicts are given per FAMILY (`reuse:`) and per ROLE (`per_role:`) — the role granularity
      matters because five roles are IDENTICAL inside families whose summon is RETUNED.

    discrimination_test: >-
      Inherited verbatim from Amendment A.9 and applied to every field before it is allowed to
      decide a verdict: a field decides reuse-vs-fresh ONLY if a FRESH clone would land differently
      from the REUSED one. `tools/gen_era_talents.py` `_HELPER_SCALARS` exposes `attributes`,
      `attributesEx`, `castTimeIndex`, `rangeIndex`, `cooldown`, `powerCost`, `manaCostPct`,
      `category`, `categoryCooldown`, `spellVisual`, `durationIndex`, `mechanic`, `family`,
      `mask`/`maskB`/`maskC`, `school`, `stackAmount`, `procChance`, `procCharges`, `procTypeMask`,
      `spellLevel`/`baseLevel`/`maxLevel`, and per-effect `effect`/`aura`/`basePoints`/`dieSides`/
      `misc`/`miscB`/`trigger`/`targetA`/`radius`/`amplitude`. **CORRECTED 2026-09-01 (Task 3 batch A
      review):** this sentence used to end "It exposes nothing for AttributesEx2..7
      (`grep -c AttributesEx3 tools/gen_era_talents.py` = 0)". That grep now returns **2** — the
      generator gained `attributesEx2`/`attributesEx3`/`attributesEx5` keys. Only **Ex4/Ex6/Ex7** are
      unauthorable now, and filter `N5` was narrowed to match. So every field this file counts as
      discriminating IS authorable; Ex4/Ex6/Ex7 are not, and are filtered.
      **AND THE COLUMN LIST ABOVE IS NOT THE WHOLE DBC.** It is the set Task 1 chose to sweep, not a
      proof that everything else is equal — `SpellCategories.PreventionType` was omitted from it and
      turns out to diverge on 72 of the roster's 81 comparable totem SUMMONS. See `accepted_gaps`
      id 14; the memory `tbc-survival-sweep-five-field-families` is the same lesson.

    element_is_the_dbc_slot: >-
      A totem's ELEMENT is the summon's DBC slot, not its name. In 1.12 that was
      `SPELL_EFFECT_SUMMON_TOTEM_SLOT1..4` (87 fire / 88 earth / 89 water / 90 air); TBC and 3.3.5a
      both encode it as `Effect 28 SUMMON` with the slot in `EffectMiscValueB` (SummonProperties
      81/82/83/84). The 1.12 record's element-swap gotcha therefore still holds in TBC: Frost
      Resistance is a FIRE-slot totem, Fire Resistance is a WATER-slot totem, Nature Resistance is
      an AIR-slot totem. The `element:` key on each family below is the 1.12 `_ref` value and was
      not re-derived; Task 2 must read `EffectMiscValueB` off the TBC summon, not this key.

  sources:
    tbc: >-
      wago 2.5.4.44833 — SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellLevels,
      SpellCooldowns, SpellName, Spell (NameSubtext), SpellClassOptions, SpellDuration, SpellRadius,
      SkillLineAbility. Cached under /tmp/claude-1000/tbc-shaman/*-254.csv.
    live_dbc: >-
      /tmp/claude-1000/tbc-shaman/Spell.dbc — a copy of this server's
      /azerothcore/env/dist/data/dbc/Spell.dbc (md5 49c9c5f53e8974c27d67635384725f46, the md5 Plan
      3a recorded), read through tools/spell_dbc_columns.txt.
    shipped_clones: >-
      acore_world.spell_dbc, 145 rows read (144 in [931000,932000) + 932407 Mana Tide r1, which is
      a NODE-granted helper in the 932xxx band, not the 931xxx totem band — do not miss it).
    v112: >-
      /home/lewist/Projects/era-wow/tools/vanilla-extract/Spell.dbc, read with the field offsets
      documented in era-data/_ref/shaman-totems.yaml's header (162 fields / 648 B per record —
      tools/dump_spell_effects.py MISREADS this DBC).
    roster_enumeration: >-
      The family/rank map was NOT taken from the plan's hardcoded Step-1 id list. It was enumerated
      from wago SkillLineAbility rows on SkillLine 373/374/375 joined to SpellName + Spell
      (NameSubtext) + SpellLevels, which is the authoritative "what a TBC shaman can learn" set.
      See `id_set_corrections:`.

  # Applied before a difference is allowed to count. Everything NOT listed here counts.
  noise_filters:
    N1_proc_default: >-
      ProcChance / ProcCharges / ProcTypeMask / CumulativeAura where TBC has NO SpellAuraOptions
      row at all AND the clone carries the DBC "not a proc" default (101/0/0/0 or 0/0/0/0). Same
      filter Plan 3a defined, and the same INVERSION trap: when TBC has no row and the clone IS a
      real proc, that is a genuine difference and is NOT filtered.
    N2_custom_creature: >-
      A summon's `EffectMiscValue_1` pointing at an era creature entry in [920000,921000) instead
      of the stock totem creature. By design — the whole substrate exists to summon our own
      creature so it can cast our own pulse.
    N3_clone_chain_trigger: >-
      An `EffectTriggerSpell` pointing at another era clone in [920000,950000) instead of the stock
      chain link. By design, same reason.
    N4_permanent_duration: >-
      DurationIndex disagreement confined to {0, 21} on a pulse/passive — index 21 is -1 (infinite)
      and index 0 is "no DurationEntry"; both are permanent for an area aura the totem owns.
    N5_unauthorable_attributes: >-
      **AttributesEx4, AttributesEx6, AttributesEx7 — NARROWED 2026-09-01 (Task 3 batch A review).
      This filter used to read "AttributesEx2..AttributesEx7", on the premise that "the generator has
      no key for them". THAT PREMISE IS STALE.** `tools/gen_era_talents.py` `_HELPER_SCALARS` now
      carries `attributesEx2`, `attributesEx3` and `attributesEx5` keys (see the comment block around
      `:1203-1230`, added so a clone can reproduce a `SpellInfoCorrections.cpp` by-id fix that its own
      id never receives). Those three arms are therefore AUTHORABLE and pass the discrimination test;
      only Ex4/Ex6/Ex7 remain genuinely unauthorable, and only they stay filtered. For the still-
      filtered arms the reasoning is unchanged: a fresh clone inherits whatever its template carries
      exactly as a reused clone does. Attributes (word 0) and AttributesEx (word 1) ARE authorable and
      have never been filtered.
      **Measured blast radius of the narrowing** — the whole 214-row `ranks:` roster below, wago
      `SpellMisc-254.csv` `Attributes_N` against `azerothcore-wotlk/ip-dbc/Spell.dbc` (162 of the 214
      role-rows exist in both stores -- exactly the 162 this file already flags `live: yes`, verified
      row-by-row with 0 mismatches; the other 52 are WotLK-removed spells with no live row):
        * `AttributesEx2`: **0 divergent.** The Ex2 arm was moot either way.
        * `AttributesEx3`: **14 divergent, in exactly two families.** Stoneclaw `effect` r1-r7
          (5729/6393/6394/6395/10423/10424/25512) — wago **0** vs live **131072**
          `SPELL_ATTR3_SUPPRESS_TARGET_PROCS`, whose in-tree TITLE comment
          (`SharedDefines.h:498`) is "No initial aggro". And FireNovaTotem `blast` r1-r7
          (8349/8502/8503/11306/11307/25535/25537) — wago **64** `SPELL_ATTR3_NO_AVOIDANCE` vs live
          **1073741824** `SPELL_ATTR3_DO_NOT_DISPLAY_RANGE` (client-only).
        * `AttributesEx5`: **7 divergent**, all FireNovaTotem `blast` r1-r7 — wago **0** vs live
          **67108864** `SPELL_ATTR5_ALWAYS_AOE_LINE_OF_SIGHT`.
        * Ex4 / Ex6 / Ex7: **2 / 44 / 73 divergent**, all still unauthorable, all still filtered.
      So the narrowing un-filters 21 rows across two families and nothing else. The BEHAVIOURAL
      consequence of the Stoneclaw half is `open_questions` id 17 — a decision owed, not a
      measurement gap. The most frequent finding in the still-filtered set is unchanged: again
      `AttributesEx6` bit 26 (AzerothCore's own "Unknown attribute 26@Attr6"), TBC 0 -> live set, on
      37 of the 145 clones — identical in shape to Plan 3a's finding.
    N6_inert_diesides: >-
      A `DieSides` 1-vs-0 delta on `basePoints -1` for an aura whose amount is unused —
      aura 23 SPELL_AURA_PERIODIC_TRIGGER_SPELL and aura 96 SPELL_AURA_SPELL_MAGNET. Affects
      9 clone rows (Stoneclaw passive r1/r2/r4/r5/r6, Tremor passive, Grounding effect + passive,
      Poison Cleansing passive). The delta is real in the DBC and IS authorable, but the value is
      never read for those two aura types, so it does not discriminate BEHAVIOUR. Filtering it is
      what makes five roles come out IDENTICAL instead of a meaningless RETUNED.
      **If a reviewer disagrees with this one filter, five per-role verdicts flip and no FAMILY
      verdict changes** — every affected family is RETUNED on its summon regardless.
    N7_inert_maxlevel: >-
      **ADDED 2026-09-01 by Task 2 batch 2.** A `MaxLevel` disagreement on a role whose
      `EffectRealPointsPerLevel` is 0 on BOTH sides. `SpellEffectInfo::CalcValue` (SpellInfo.cpp:
      410-429) reads `_spellInfo->MaxLevel` ONLY inside `if (caster && basePointsPerLevel != 0.0f)`,
      and a grep of the whole spell/aura layer finds no other consumer — so with no per-level growth
      the field is authorable but cannot make a fresh clone land differently from a reused one, which
      is exactly what `discrimination_test` says must decide. This is NOT a small filter: MaxLevel is
      the ONLY field separating TBC from live on all six Searing bolts (TBC 0 vs live 19..68) and on
      Earth Elemental Totem (TBC 70 vs live 0). Filtering it is what makes Searing a grant-stock
      family instead of a 12-clone rebuild. It does NOT apply where growth exists — the Fire Nova
      blasts carry RealPointsPerLevel 1.1..3.9, and there TBC and live agree on MaxLevel anyway.
    NOT_FILTERED: >-
      Nothing else — with one honest caveat added 2026-09-01: "nothing else is FILTERED" was never
      the same claim as "everything else was COMPARED". `SpellCategories.PreventionType` was never in
      the swept column list and is unauthorable today; it is recorded as `accepted_gaps` id 14 rather
      than quietly left out. In particular ManaCost / ManaCostPct, DurationIndex outside {0,21},
      EffectRadiusIndex, the pulse's APPLY_AREA_AURA scope, SchoolMask, RangeIndex,
      CastingTimeIndex, RecoveryTime, CategoryRecoveryTime, SpellClassSet, SpellClassMask word 0
      (per Amendment A.12) and Attributes/AttributesEx are all compared verbatim.

  ids_swept: 214            # TBC rank-roles across 29 families; 145 shipped clones; 191 live rows
  verdict_counts:
    families: { IDENTICAL: 0, RETUNED: 21, ABSENT_BOTH: 8 }        # 29 incl. TotemOfWrath
    roles:    { IDENTICAL: 5, RETUNED: 41, ABSENT_BOTH: 16 }
  identical_roles:          # the ONLY five things in the whole roster that can be reused as-is
    - "Earthbind.pulse (931010 == TBC 3600)"
    - "Stoneclaw.passive r1-r6 (931070-931075 == TBC 5728/6397/6398/6399/10425/10426, after N6)"
    - "Tremor.passive (931090 == TBC 8145, after N6)"
    - "Magma.pulse r1-r4 (931130-931133 == TBC 8187/10579/10580/10581)"
    - "Grounding.passive (931291 == TBC 8179, after N6)"
  reuse_is_still_all_fresh: >-
    Every one of those five sits inside a family whose SUMMON is RETUNED, and §1.3 is
    all-or-nothing per SPELL, not per family — so a Task-2 author MAY reuse those five ids while
    minting fresh summons, but MUST NOT read "5 identical roles" as "5 reusable families".
    The honest headline is the same as Plan 3a Amendment A.9's: **the ledger is all-FRESH at the
    family level, and that is the rule working, not swallowing itself** — each entry below names
    the shipped id to template off and exactly which fields to change.

  id_set_corrections: >-
    The plan's Step-1 script seeds the TBC 61-70 block with 17 hardcoded ids
    {25361, 25508, 25509, 25525, 25528, 25533, 25552, 25557, 25560, 25563, 25567, 25570, 25574,
    27621, 27623, 30706, 30708}. Measured against wago SkillLineAbility that list is both
    INCOMPLETE and WRONG:
      * MISSING player-learnable TBC ranks: **25546 / 25547** (Fire Nova Totem r6 L61 / r7 L70),
        **25359** (Grace of Air Totem r3 L60), **25577** (Windwall Totem r4 L65),
        **25585 / 25587** (Windfury Totem r4 L61 / r5 L70), and **36936** (Totemic Call, L30 in TBC).
      * MISSING every 61-70 PULSE/effect id, which is where the magnitude lives and which the
        summon does not reference: 25506/25507 (Stoneskin), 25527 (Strength of Earth), 25513/25512
        (Stoneclaw passive/effect), 25530 (Searing "Attack"), 25550 (Magma), 25554/25555/25556
        (Flametongue effect/proc/passive), 25559 (Frost Res), 25562 (Fire Res), 25566 (Healing
        Stream), 25569 (Mana Spring), 25573 (Nature Res), 25360 (Grace of Air), 25576 (Windwall),
        25535/25537 (Fire Nova blast), 25579/25580 (WF Totem Effect), 25581/25582 (WF Totem
        Passive), 25583/25584 (Windfury Attack).
      * WRONG: **27621 and 27623 are NOT TBC player ranks.** wago names them "Windfury Totem
        Rank 3" and "Fire Nova Totem Rank 5", but NEITHER has a SkillLineAbility row on 373/374/375
        — the player's r3/r5 are 10614 and 11315. They are duplicate/NPC-side ids that survived
        into 3.3.5a (27623 is what era-data/vanilla/shaman.yaml's `_ref.totemSpells` records as the
        "Fire Nova Totem" identity, correctly, because in 3.3.5a it is the only id still NAMED that).
        Do not clone them and do not chain a trainer row to them.
    Trigger closure was then run over the whole set on BOTH sides until it returned nothing new;
    it added only 7922 (Charge Stun, reached from 39796 Stoneclaw Stun) and 35009 (live-only, not
    in TBC). The enumeration is closed.

# =============================================================================================
# spec §6.1's systematic 2.4.3 -> 3.3.5a churn, RE-MEASURED. One of the four is inverted.
# =============================================================================================
systematic_churn:
  pulse_scope:
    tbc: 35            # SPELL_EFFECT_APPLY_AREA_AURA_PARTY
    live: 65           # SPELL_EFFECT_APPLY_AREA_AURA_RAID
    clone: 65
    verdict: CONFIRMED
    note: >-
      The shipped Vanilla clones carry 65, i.e. the WotLK raid-wide scope, NOT 1.12's or TBC's
      party scope. So the clone is era-inaccurate here for BOTH eras. See
      substrate_divergences.pulse_scope_and_radius — this is a Task-2 decision, not a measurement
      question.
  pulse_radius:
    tbc: 9             # SpellRadius 9 = 20 yd
    live: 10           # SpellRadius 10 = 30 yd
    clone: 10
    verdict: CONFIRMED
  summon_duration:
    tbc: 4             # SpellDuration 4 = 120000 ms (2 min)
    live: 5            # SpellDuration 5 = 300000 ms (5 min)
    clone: 5
    verdict: >-
      **INVERTED IN THE SPEC AND IN THE PLAN'S STEP-5 TEMPLATE**, which both say
      `{ tbc: 5, live: 4 }`. Measured on the live DBC (not the clone): every shared totem summon
      reads DurationIndex 4 in wago and 5 in Spell.dbc. Decoded against wago SpellDuration (which
      Plan 3a verified matches every 3.3.5a index anchor this project has recorded), index 4 is
      120 s and index 5 is 300 s. So TBC totems last **2 minutes** and the shipped Vanilla clone
      would give a TBC shaman **5-minute** totems. Correct the spec and the plan template.
    exceptions:
      - "Tremor / Poison Cleansing / Disease Cleansing clones carry DurationIndex 23 (90 s), the
         1.12 value, not 5 — still != TBC's 4."
      - "Fire Nova Totem: TBC DurationIndex 28 (5 s, the detonation window) vs clone 9 (30 s)."
      - "Sentry: DurationIndex 5 in BOTH eras — the one summon where 5 is correct."
      - "Earthbind: TBC DurationIndex 22 (45 s), not 4."
      - "Mana Tide: TBC DurationIndex 564 (13 s) vs 1.12's 29 (12 s)."
  mana:
    verdict: >-
      **ONLY PARTLY A WotLK CHURN, and the half the spec missed is the single most consequential
      finding in this file.** Two separate things happened:
      (a) TBC CUT the flat mana cost of essentially every totem, by 15-37%, versus 1.12. Measured
          examples (1.12 -> TBC): Stoneskin r1 35 -> 30 and r6 260 -> 210; Searing r1 30 -> 25 and
          r6 265 -> 170; Mana Spring r1 120 -> 40 and r4 205 -> 100; Healing Stream r1 65 -> 40;
          Magma r1 285 -> 230; Flametongue r1 110 -> 90; Windfury Totem r1 115 -> 95; Fire Nova
          Totem r1 115 -> 95; Grace of Air r1 190 -> 155; Windwall r1 140 -> 115; Sentry 80 -> 65.
          The shipped Vanilla clones all carry the 1.12 figure. **Mana lives in wago SpellPower,
          not SpellEffect, so an effect-only diff cannot see it** — which is exactly why §6.3 calls
          19 families "value-identical".
      (b) TBC had ALREADY converted five utility totems to percent-of-base cost, before WotLK:
          Earthbind 5%, Grounding 5%, Poison Cleansing 8%, Disease Cleansing 8%, Mana Tide 3%
          (each with ManaCost 0). WotLK then converted the REST (e.g. live Stoneskin r1 is 13%).
          So "flat ManaCost -> percent-of-base" is not a single era boundary.
    generator_note: >-
      Both halves are authorable: `powerCost` sets ManaCost and `manaCostPct` sets ManaCostPct.
      A templated clone of a live totem inherits live's PCT, so a fresh TBC flat-cost clone must
      author `manaCostPct: 0` explicitly (the Earth Shield 946537-539 precedent from Plan 3a).
  spell_power_rows:
    swept: true
    finding: >-
      Every TBC totem SUMMON has a SpellPower row. There is no TBC totem analogue of Plan 3a's
      Nature's Grasp finding (a rank chain with no SpellPower row at all, i.e. free to cast).

# =============================================================================================
# The section the plan asked for by name: every place measurement contradicts spec §6.3 / §6.1.
# =============================================================================================
spec_ledger_contradictions:

  - id: 1
    claim: "§6.3 — 19 families are value-identical, so reuse the shipped Vanilla clone."
    measured: "ZERO families are identical. 21 are RETUNED, 8 are ABSENT_BOTH."
    why_the_sweep_missed_it: >-
      §6.3 compared SpellEffect rows only. It never read SpellPower (mana), SpellMisc
      (DurationIndex / SchoolMask / RangeIndex / the eight attribute words), SpellCooldowns, or
      SpellClassOptions — and it compared 1.12 stock against 2.4.3 stock rather than the SHIPPED
      CLONE against 2.4.3. Any one of mana, duration or the clone's inherited live fields is enough
      to flip a family on its own; most families are flipped by all three.

  - id: 2
    claim: "§6.1 — summon DurationIndex churn is TBC 5 -> live 4."
    measured: "TBC 4 (120 s) -> live 5 (300 s). The direction is inverted."
    consequence: >-
      Reusing a Vanilla clone gives a TBC shaman 5-minute totems where TBC gave 2-minute ones —
      a substantial and very visible behavioural difference, and one that biases the whole
      drop-and-forget rhythm of the class. Correct spec §6.1 and the plan's Step-5 template.

  - id: 3
    claim: "§6.3 — 'Searing (one rank, 7 -> 8)' is the whole Searing retune."
    measured: >-
      ALL SEVEN Searing bolt ranks were retuned in TBC. Effective min..max, 1.12 -> TBC:
      7-9 -> 9-11, 10-14 -> 13-17, 14-20 -> 19-25, 20-28 -> 26-34, 25-37 -> 33-45,
      32-46 -> 40-54, and a new r7 at 50-66 (25530, L69). "7 -> 8" is rank 1's raw base points.
    extra: >-
      TBC r1-r6 are BYTE-IDENTICAL to live 3.3.5a — the bolt was buffed in TBC and never touched
      again. Only r7 differs (TBC 50-66 vs live 56-74). So for the Searing ATTACK specifically the
      TBC-accurate value is the STOCK one and the shipped Vanilla clone is the outlier. This
      inverts the usual assumption and is worth stating plainly for Task 2.

  - id: 4
    claim: >-
      §6.3's retune column: Mana Spring 4/6/8/10 -> 5/8/12/16; Stoneskin 3/6/10/14/20/27 ->
      5/8/12/17/23/31; Windwall 17/26/33 -> 33/51/65.
    measured: >-
      Those TBC figures are RAW base points; the 1.12 figures beside them are EFFECTIVE. Compared
      like-for-like (effective on both sides): Mana Spring 4/6/8/10 -> **6/9/13/17** (+r5 20);
      Stoneskin 3/6/10/14/20/27 -> **4/7/11/16/22/30** (+r7 36, r8 43); Windwall 16/25/32 ->
      **32/50/64** (+r4 102). The retunes are real, the magnitudes as printed are not.
      Amendment A.1's warning landing exactly as written.

  - id: 5
    claim: "§6.3 — Earth Elemental, Fire Elemental and Wrath of Air need an 'encoding read'
            because their 1.12 records use the old summon / LEARN_SPELL-wrapper encoding."
    measured: >-
      **RESOLVED, and the premise was a false lead.** The 1.12.1 rows at those ids are Blizzard
      RECYCLED-ID PLACEHOLDERS, not the totems: 2062 = 'zzOLDSpell - Reuse' (Effect 10),
      2894 = 'zzOLDSpell - Reuse' (Effect 3), 2895 = 'zzOLDSpell - Reuse' (Effect 3),
      3738 = 'zzOLDCure Poison' (Effect 36 LEARN_SPELL — i.e. the "LEARN_SPELL wrapper" §6.3 saw
      is an unrelated dead Cure Poison teaching row that happened to occupy the id). A name search
      of the 1.12.1 extract for "Earth Elemental Totem", "Fire Elemental Totem" and "Wrath of Air"
      returns NO MATCH. All three are TBC-new families with no Vanilla counterpart and no Vanilla
      clone.
    verdict: "ABSENT_BOTH / from-scratch — the same class as Tranquil Air. FOUR TBC-new families,
              not three encoding reads plus one from-scratch."

  - id: 6
    claim: "§6.3 — Grace of Air is value-identical."
    measured: >-
      Its PULSE magnitudes are indeed identical (agility 43 / 67, aura 29 MOD_STAT misc 1) — the
      only §6.3 'identical' claim that survives at the magnitude level. Everything around them
      does not: summon mana 190 -> 155 and 310 -> 250, summon DurationIndex 4 vs clone 5, and the
      Vanilla pulse clones 931330/931331 carry SchoolMask 0 and SpellClassMask word-0 0 where TBC
      carries 8 and 131072 (word-A bit 17). **TBC also adds rank 3** (summon 25359 / pulse 25360
      at L60), which §6.3 does not mention at all.

  - id: 7
    claim: "§6.3 — Windfury Totem is value-identical."
    measured: >-
      Nothing about it is. TBC has FIVE ranks (8512 / 10613 / 10614 / 25585 / 25587) against the
      1.12.1 extract's three; the mana differs at every shared rank (115/175/250 -> 95/140/200);
      and the shipped Vanilla clone is not a copy of the mechanic at all — 931366-368 are a
      from-scratch DUMMY party aura + `spell_proc` row + the `spell_era_windfury_totem` AuraScript,
      whereas TBC 8515/10609/10612 are `aura 23 PERIODIC_TRIGGER_SPELL` at 5000 ms firing the
      enchant chain 8514/10607/10611 -> payload 8516/10608/10610. The era reconstruction is
      functionally equivalent and may well be the right shape for TBC too, but it is not a reuse.

  - id: 8
    claim: "§6.3 — Poison Cleansing and Disease Cleansing are value-identical."
    measured: >-
      TBC's dispel passive fires every **5000 ms**; the shipped Vanilla clones 931250 / 931270
      fire every **3000 ms** — a 67% throughput difference on the totem's whole reason to exist.
      Also: TBC cost is 8% of base mana (ManaCost 0) vs the clones' flat 75; TBC DurationIndex 4
      (120 s) vs the clones' 23 (90 s); the effect clones' radius index is 10 (30 yd) vs TBC's
      9 (20 yd) and their Attributes are 0x900 vs TBC's 0x10180.
    id_collision_note: >-
      In 3.3.5a, 8166/8167/8168 are ABSENT and 8170/8171/8172 are the MERGED "Cleansing Totem" /
      "Cleansing Totem Pulse" / "Cleansing Totem Passive". In TBC 8170/8171/8172 are
      Disease-Cleansing-only and 8166/8167/8168 are Poison-Cleansing-only. So the Vanilla-era
      collision warning applies verbatim to TBC: a TBC shaman must NOT be granted stock 8170.

  - id: 9
    claim: "§6.3 — Sentry is value-identical (era-less _ref calls it `disposition: no-op`)."
    measured: >-
      Everything matches EXCEPT the cost: TBC 6495 is 65 mana flat, live 6495 is 2% of base
      (1.12 was 80 flat). There is no Vanilla clone (the Vanilla phase granted stock), so this is
      not a reuse question but a grant-stock question, and granting stock is wrong on exactly one
      field. Task 2 decides: a one-field fresh clone, or an accepted gap.

  - id: 10
    claim: "§6.3 — Flametongue is value-identical."
    measured: >-
      The magnitudes are (the enchant ids are unchanged), but the shipped clones diverge on four
      authorable fields: passive 931144-147 carry SchoolMask 8 (nature) vs TBC's 4 (fire) and
      SpellClassSet 11 vs TBC's 0; effect 931148-151 carry SchoolMask **32 (shadow)** vs TBC's 4,
      RangeIndex 4 vs TBC's 1, radius index 10 vs TBC's 9, Attributes 0x8000180 vs TBC's 0x100,
      and **SpellClassMask word 0 = 33554432 (A bit25) vs TBC's 67108864 (A bit26)**.
      The mask difference is load-bearing: node 20222 Improved Weapon Totems binds the Flametongue
      Totem pulse by its identity bit, so a reused clone binds the wrong bit. (The clone's
      SchoolMask 32 also looks like a straight Vanilla-phase defect — it templated 52041, a
      Healing Stream pulse — but that is shipped Vanilla content and NOT this phase's to fix;
      logged under open_questions.)

  - id: 11
    claim: "§6.3 — Fire Nova Totem and Fire Nova (spell) are value-identical."
    measured: >-
      TBC's summon carries a **15 000 ms CategoryRecoveryTime** and DurationIndex 28 (5 s); the
      shipped clones 931353-357 carry no category cooldown and DurationIndex 9 (30 s), because the
      Vanilla reconstruction runs the detonation from `npc_era_fire_nova_totem` on a 30 s stage
      instead. Mana differs at every rank (115/210/345/490/640 -> 95/170/280/395/520). The summon's
      SpellClassMask word 0 is TBC 671088640 (A bits 27+29) vs the clone's 16 (A bit 4 — inherited
      from its `template: 3599` Searing Totem). TBC adds r6 25546 (L61) and r7 25547 (L70).
      "Fire Nova (spell)" is not a family at all: in TBC 1535 IS Fire Nova Totem rank 1, and in
      3.3.5a 1535 is the instant "Fire Nova" spell with a bound script (`spell_sha_fire_nova`,
      spell_id -1535) — a live/TBC id collision that must be hidden for TBC exactly as for Vanilla.

  - id: 12
    claim: "§6.2 — Mana Tide: 1.12 flat 140/pulse -> TBC 6% of max mana."
    measured: >-
      CONFIRMED, and the shape is more specific than §6.2 states. TBC 16191 is
      `Effect 6 APPLY_AURA / aura 23 PERIODIC_TRIGGER_SPELL`, effective value 6, period 3000 ms,
      **EffectTriggerSpell 39610** — i.e. TBC already used the same %-of-max-mana trigger id that
      3.3.5a still uses, and both 16191 and 39610 carry bound core scripts (`spell_sha_mana_tide`,
      `spell_sha_mana_tide_totem`). Additionally TBC has only ONE rank: 17354 / 17355 / 17359 /
      17360 (1.12's r2 and r3) are ABSENT from wago 2.5.4 entirely. TBC's summon is 3% of base
      mana, DurationIndex 564 (13 s). The shipped Vanilla substrate is a three-rank flat-energize
      rebuild (932407 / 931369 / 931370 + 931371-373) and matches none of that.

  - id: 13
    claim: "§6.3 — Tranquil Air is from-scratch with no Vanilla substrate."
    measured: "CONFIRMED exactly as the plan predicted. 25908 (summon, L50) and 25909 (pulse,
               'Tranquil Air' Rank 1) are both ABSENT from the 1.12.1 extract and ABSENT from
               3.3.5a. A 1.12 name search for 'Tranquil Air' returns NO MATCH."

  - id: 14
    claim: "§6.3 — Earthbind / Fire Resistance / Frost Resistance / Nature Resistance are
            'encoding-only differences, same behaviour'."
    measured: >-
      The ENCODING claims are confirmed: the three resistance pulses moved school INDEX -> school
      MASK in EffectMiscValue (fire 2 -> 4, nature 3 -> 8, frost 4 -> 16) with identical
      magnitudes (30/45/60), and Earthbind's slow flipped sign (1.12 +50 -> TBC -50) with the
      same -50% result. But "encoding-only" was asserted of 1.12-vs-2.4.3 and then used to
      conclude REUSE, which does not follow: all four summons still diverge from their shipped
      clones on mana (Earthbind flat 40 -> 5% of base; the three resistance totems 90/150/225 ->
      75/120/180), all four clones carry SchoolMask or DurationIndex from the live template, and
      TBC adds a 4th rank to each resistance totem (25560/25559 L67, 25563/25562 L68,
      25574/25573 L69) that §6.3 does not mention.

# =============================================================================================
substrate_divergences:
  # Places where the SHIPPED VANILLA CLONE matches NEITHER era's stock data. These are inherited
  # conventions, not measurement questions — but they are the reason several families read
  # RETUNED, so Task 2 must decide them consciously rather than copy the Vanilla shape by reflex.
  pulse_scope_and_radius:
    what: >-
      Every buff-pulse clone uses `Effect 65 APPLY_AREA_AURA_RAID` at radius index 10 (30 yd).
      1.12 and TBC both use `Effect 35 APPLY_AREA_AURA_PARTY` at radius index 9 (20 yd).
    status: >-
      Shipped, merged and real-client-verified for the Vanilla era, so it is an accepted Vanilla
      divergence by precedent. It DOES pass the discrimination test (a fresh clone can author
      `effect: 35` and `radius: 9`), so under §1.3 it forces FRESH — but whether Plan 3b should
      NARROW TBC totems to party-only/20 yd while Vanilla totems stay raid-wide/30 yd is a
      design call with a consistency cost. **DECIDED 2026-09-01 (user; spec Amendment B.8): KEEP
      `effect: 65` / radius index 10 for TBC**, matching the shipped Vanilla clones. Narrowing
      would show a visible downgrade at an era ADVANCE and would leave TBC totems weaker than the
      Vanilla ones they replace in 40-bot raids.
      **THE DECISION STANDS; HALF ITS RATIONALE NO LONGER DOES (annotated 2026-09-06).** "matching
      the shipped Vanilla clones" was true when B.8 was taken and is now FALSE: the 2026-09-06 fix
      round authored `radius: 9` (20 yd) on every Vanilla friendly pulse, which is 1.12's real
      value (see `open_questions` id 6). So TBC at index 10 no longer MATCHES Vanilla — it is
      deliberately WIDER, and that is exactly the surviving half of the rationale (no visible
      downgrade at an era advance; a raid-wide 30 yd where Vanilla is party-scale 20 yd). The
      `effect: 65` half is untouched by any of this. Anyone re-reading B.8 should take the
      no-downgrade argument as the whole of it and ignore the parity claim. This licenses carrying forward the Vanilla shape
      for SCOPE and RADIUS ONLY -- every other retuned field is still authored to TBC. Task 8 must
      state it in the verification record.
  duration_index_zero:
    what: "Pulse clones carry DurationIndex 0 where TBC carries 21 (-1, infinite)."
    status: "Filtered as N4. Both are permanent for a totem-owned area aura, and the Vanilla
             generator's from-scratch passives require `attributes: 320` + DurationIndex 0 to
             survive SpellAuras.cpp:804. Not a divergence."


