    tbc_authoring_note: >-
      MINTED 12 (+4 creatures) / REUSED 0 (Task 2 batch 2, 2026-09-01). The only wholly-fresh family
      in batch 2, because TBC's Flametongue Totem is a WEAPON-ENCHANT chain (summon -> PASSIVE aura
      23 every 5000 ms -> EFFECT 92 ENCHANT_HELD_ITEM on a party area) while live 3.3.5a replaced the
      whole mechanic with the flat spell-damage buff 52109. Confirmed 2026-09-01:
      `creature_template_spell` for 5950/6012/7423/10557/15485 is (entry, 0, 52109..52113), i.e. the
      stock creatures cast the WotLK buff, so neither stock spells nor stock creatures are usable;
      and 8229/8230, 8251/8250, 10524/10521, 16388/15036 are ALL ABSENT from ip-dbc/Spell.dbc, so
      there is no same-identity donor to template either.
      SUMMONS 947120-947123: TBC vs live diverges on DurationIndex ALONE (4 = 120 s vs 5 = 300 s);
      mana is 90/140/200/275 flat with ManaCostPct 0 on BOTH sides, so no neutralisation is needed,
      but `powerCost:` is stated so the TBC figure reads next to the clones' 1.12 110/170/250/340.
      PASSIVES 947125-947128 and EFFECTS 947130-947133 template 5672 / 52041 (stock Healing Stream's
      own self-buff + party-area sub-spell) as SHAPE donors — the same donors the Vanilla substrate
      uses, and they work because 5672/52041 are the identical two-hop mechanism. Overridden to TBC
      on every field this file's `clone_vs_tbc_divergences` lists: passive `attributes: 320` (TBC
      0x140; donor 0x40), `school: 4` (donor 8), `family: 0` + zeroed masks (TBC SpellClassSet is 0;
      the Vanilla clones took the donor's 11, and the donor's own word-A bit13 must not leak onto a
      Healing Stream spellmod bind); effect `attributes: 256` (TBC 0x100; donor 0x8000180),
      `school: 4` (donor 32 — the source of `open_questions` id 1's shipped-Vanilla Shadow defect,
      NOT reproduced here) and `rangeIndex: 1` (donor 4).
      **ACCEPTED GAP ID 4 IS CLOSED: the TBC clones take TBC'S OWN word-A bit26 (67108864), not the
      Vanilla clones' bit25.** The mask is AUTHORED rather than inherited because there is no
      same-identity donor to inherit from — the one situation the framework's "inherit, never author
      a mask" rule cannot cover. Bit26 is safe: it is what TBC ships, it is SHARED with the
      Frost/Fire/Nature Resistance pulses in stock 3.3.5a as well as in TBC, and node 20248 Totemic
      Mastery's `affectsMask {a: 100786176}` already contains BOTH bit25 and bit26 — so the +10 yd
      radius mod reaches these clones with no re-point (verified on the emitted row).
      `radius: 10` follows Amendment B.8's RADIUS half only (the scope half does not apply — Effect
      92 is unchanged across all three eras); TBC's literal index is 9 (20 yd), and narrowing would
      shrink the imbue's reach at an era ADVANCE, the exact downgrade B.8 exists to prevent.
      Temp-enchant duration is left to the core fallback as in Vanilla: `basePoints: -1` +
      `dieSides: 1` is TBC's literal encoding and computes to 0, so `EffectEnchantHeldItem`
      (SpellEffects.cpp:4452-4456) falls GetDuration()=0 -> damage*1000=0 -> a flat 10 s, bridging
      the 5 s re-trigger.
      **PROC ROLE NOT AUTHORED — AND THE IMBUE DEALS NO DAMAGE ON THIS BUILD, IN EITHER ERA.** See
      `accepted_gaps` id 7 and `open_questions` id 7. Not a TBC regression: the shipped Vanilla chain
      hits the identical wall.
      **NODE 20231 (Improved Weapon Totems), FLAMETONGUE HALF — SAID, NOT SILENTLY RE-POINTED.** The
      node binds `Flametongue Totem Buff` 52109 at word-A bit25 with `op: allEffects, kind: pct`. A
      TBC shaman's totem never casts 52109 (that is the WotLK mechanic), and the bit26 effect clones
      carry basePoints -1, which computes to 0 — a percentage of 0 is 0. So the half is INERT for TBC
      whether or not the mask is re-pointed; re-pointing bit25 -> bit26 would change nothing except
      make the inert bind harder to see, so it was left alone. It becomes reachable only if the
      8253-series proc is ever restored, at which point the bind belongs on THAT spell, not on the
      enchant applier.
