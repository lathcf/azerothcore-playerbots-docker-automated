# Task 2 id allocation, assigned 2026-09-01 BEFORE any authoring so parallel batches cannot collide.
# Per Amendment B.5 the layout is PACKED per family, not the Vanilla stride-20 scheme. Each family
# gets a decade-aligned block sized to the next multiple of 10 at or above its `fresh_ids_needed`,
# which leaves slack for a miscount without shifting any other family. Assign per-ROLE bases INSIDE
# your family's block and record them in that family's `tbc_clone_base:`.
#
# Budget: spells 947000-947439 (this table's high-water is 947359, 80 spare); creature entries
# 920300-920999 (high-water 920589, 410 spare). 947440-947511 stays reserved for Windfury Weapon
# and the 'Era: TBC Totems' marker -- do NOT allocate into it.
#
# NB `fresh_ids_needed` is a CEILING (roles x ranks). Amendment B.2's rule still applies per role:
# where wago TBC equals live 3.3.5a, GRANT THE STOCK SPELL and clone nothing -- a fresh creature can
# cast a stock pulse. Expect to use fewer ids than the block reserves. Never exceed your block.
# =============================================================================================
# `spells:`/`creatures:` are the RESERVED block per family. `used:`/`creatures_used:` record what a
# task actually consumed — the blocks are a claim, not a mandate to fill. Where a role measured
# reusable, the shipped Vanilla clone AND its creature entry are referenced instead, so several
# families consume far less than `need:` predicted (that column was computed before Amendment B.8.1
# retired scope/radius as divergences).
id_allocation:
  # ==========================================================================================
  # LEDGER CONVENTIONS -- read these before trusting or adding a row. This block is what keeps
  # batches B/C/D from colliding on an id, so the notation has to be uniform across every row.
  #   * `spells:` / `creatures:` are the family's RESERVED BLOCK, written as [lo, hi] INCLUSIVE.
  #     **They are the only two keys that use range notation.**
  #   * `used:` / `creatures_used:` ENUMERATE every id actually consumed, one by one, explicitly
  #     -- never a lo/hi pair. Corrected 2026-09-01 (Task 3 batch A review): the three EARTH rows
  #     below had drifted into a range-like notation used nowhere else in the ledger, and under the
  #     file's dominant convention they understated consumption badly (Stoneskin read as 4 ids
  #     where it consumes 16). Enumerate, or a later batch reads a consumed id as free.
  #   * `need:` counts SPELL ids only; creature entries are counted by `creatures_used:`. Where a
  #     measurement changed it, the row carries `note: "need CORRECTED X -> Y"` and leaves the OLD
  #     number visible inside that string.
  #   * **`reserved_for_task3:` vs `task3:` -- the KEY NAME carries the state.** `reserved_for_task3:`
  #     = ids set aside and NOT yet spent (a promise). `task3:` = Task 3 has AUTHORED them (a
  #     receipt), and every id named in it also appears in `used:`/`creatures_used:`. Renaming the
  #     key is how a family records that its 61-70 ranks shipped. Convention introduced by Task 3
  #     batch A, 2026-09-01; stated here because an undeclared convention is not one.
  #   * `reused:` names shipped 931xxx/920xxx ids the family REFERENCES instead of minting. They are
  #     NOT in `used:` (the Vanilla phase consumed them), and the slots they displace inside this
  #     family's own reserved block stay FREE -- always annotated "(never minted -- reused)" in the
  #     free-list notes so no one reads the gap as a spent id.
