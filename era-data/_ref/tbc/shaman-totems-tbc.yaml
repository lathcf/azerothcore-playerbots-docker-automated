      95/140/200 (clone 115/175/250), `durationIndex: 4` (clone 5 = live's 300 s), summon
      `school: 8` (live 8512 is 1 Physical -- open question 12's list), passive `school: 8` (clone 0).
      The AP magnitudes 122/229/315 are IDENTICAL 1.12 <-> TBC and are carried unchanged.
      `effect: 65` / `radius: 10` per Amendment B.8.
      THE PROC CHANCE IS NO LONGER A PLACEHOLDER. The era-less `_ref` records 20% as
      "UNRESOLVED-BY-EXTRACT (SpellItemEnchantment.dbc absent)" -- absent from the 1.12 extract, but
      present in this repo, and its five Windfury Totem rows read `EffectPointsMin/Max = 20`, which
      `Player::CastItemCombatSpell` uses verbatim as the percent chance (`chance = pEnchant->
      amount[s]`). 20 is TBC's real number; the Vanilla placeholder was right.
      THE FAMILY IDENTITY IS MINTED, NOT INHERITED, and it is the only field here with no TBC value:
      wago has NO `SpellClassOptions` row for 8515 / 10609 / 10612 / 25581 / 25582 (SpellClassSet 0,
