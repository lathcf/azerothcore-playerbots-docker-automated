  - id: 7
    title: "The Flametongue Totem weapon imbue deals NO damage on this build, in EITHER era"
    status: "**CLOSED 2026-09-02 (tooltip-honesty fix round, user call).** The fix is the option-set's
             missing FOURTH shape: keep the literal enchant chain and re-point the enchants' combat
             spell SERVER-SIDE via the spellitemenchantment_dbc overlay (module SQL
             2026_09_02_00_era_flametongue_enchant_procs.sql) onto band proc DUMMYs 947135-947139
             (wago 2.5.4 magnitudes), each bound to `era_sha_flametongue_totem_proc` — weapon-speed
             normalization (bp/100*speed clipped [bp/77, bp/25], the core FT-Weapon math) dealt as
             fire via vehicle 947442. Client enchant rows untouched (glow + tooltip intact); a full
             live-Spell.dbc sweep found zero stock spells reaching enchants 124/285/543/1683/2637,
             so the override is era-only in effect. FIXES BOTH ERAS (the shipped-Vanilla half too);
             1.12 proc magnitudes exist in no source this repo holds, so the TBC values serve both —
             the accepted approximation, and neither era's tooltip states a number."
    found_by: "Plan 3b Task 2 batch 2, 2026-09-01."
    detail: >-
      The enchant half of the chain is sound — `SpellItemEnchantment.dbc` rows 124 / 285 / 543 /
      1683 / 2637 ("Flametongue Totem 1..5") are all present in ip-dbc, type 1
      ITEM_ENCHANTMENT_TYPE_COMBAT_SPELL at chance 100 — but each row's combat spell is the 1.12/TBC
      "Flametongue Totem Proc" id **8253 / 8248 / 10523 / 16389 / 25555**, and ALL FIVE are ABSENT
      from ip-dbc/Spell.dbc (and from acore_world.spell_dbc). `Player::CastItemCombatSpell`
      (Player.cpp:7526-7532) logs "unknown spell {} is casted, ignoring..." and `continue`s, so the
      imbue applies (glow + tooltip) and procs nothing, once per swing per party member.
      **This is a SHIPPED-VANILLA finding as much as a TBC one.** The Vanilla block comment claims
      the enchant applies "with the correct authentic magnitude with zero guessing on our part"; it
      read the enchant row's back-reference to 8253 as proof the spell exists, which it is not.
      Batch 2 authors the TBC chain faithfully anyway (the summon/duration/mana/school/mask fidelity
      is real) and does NOT author the proc role.
      CORRECTION 2026-09-01 (batch 2 spec review): an earlier draft said "the chain works the instant
      a proc exists". It does not. wago's 8253/8248/10523/16389/25555 are `Effect 3 SPELL_EFFECT_DUMMY`
      (basePoints 488/696/946/1216/1491, ImplicitTarget_0 6) -- NOT a damage effect. Restoring those
      rows at their stock ids, candidate fix (a), would still deal no damage without a handler, so (a)
      is NOT sufficient on its own. A THIRD option the earlier option set missed, and the only one
      fully in-band and data-only: drop the literal `Effect 92 ENCHANT_HELD_ITEM` encoding and have
      the effect clone apply a band-id PROC AURA on the party that deals the fire damage on melee hit
      -- a `spell_proc` row plus `procTypeMask`, the shape Flurry and Ancestral Healing already use in
      this dataset. That trades mechanical literalness for a working imbue, which is what the spec
      decision is actually about. Also note the severity: `Player::CastItemCombatSpell`
      (Player.cpp:7526-7532) emits a LOG_ERROR BEFORE the chance roll and the enchant is chance 100 --
      so this is one error line per qualifying melee swing per imbued raid member, i.e. real log spam
      in a 40-bot raid, not a silent no-op.
    why_not_fixed_here: >-
      Neither available fix is inside Task 2. (a) Restoring the 8253 series would mean authoring
      spell rows at their STOCK ids — OUTSIDE the reserved [920000,933000) band the framework
      requires, and globally visible, so it wants a spec decision even though no WotLK character can
      reach enchant 124. (b) An era AuraScript on the effect clone is C++ this task does not own.
      Re-pointing the enchant is HARDER than (a) or (b), but NOT impossible -- **this sentence
      originally said "impossible from this pipeline: ... the SERVER reads it from
      env/dist/data/dbc", and that is wrong. RETRACTED 2026-09-01.** `DBCStores.cpp:377` loads
      SpellItemEnchantment.dbc with the DB-overlay table `spellitemenchantment_dbc`, through the same
      `LoadFromDB` path (`:253-254`) that `spell_dbc` itself rides, and that table ships in the fork
      base -- so the server side is reachable and can even ADD ids. What is genuinely unreachable is
      the CLIENT side: `client-patch/merge-into-patch.sh` patches only Spell.dbc and
      SkillLineAbility.dbc, so a minted enchant id would have no client-side visual. Rest the
      decision on that plus the per-rank machinery cost, never on impossibility.
      **This was the ORIGIN copy** (batch 2, commit 25dd754), re-copied into three places by batch 4b
      and corrected there first; a fingerprint sweep found this one still standing afterwards. It is
      the retraction rule's own lesson: sweep for the claim, not for the commit that repeated it.
    what_would_settle_it: "a spec call on (a) vs (b); the measurement itself is closed."

  - id: 12
    title: "Sentry Totem's owner buff is not cleared on an EARLY unsummon, because Totem::UnSummon hardcodes 6495"
    status: "**CLOSED 2026-09-02 (tooltip-honesty fix round, user call): core patch 0024
             (patches/0024-core-sentry-era-unsummon.patch, regen tools/regen-sentry-unsummon-patch.sh)
             adds owner->RemoveAurasDueToSpell(947260) inside the same SENTRY_TOTEM_ENTRY-gated block.
             Inert for any non-era character (the aura is simply absent).**"
    found_by: "Plan 3b Task 2 batch 4a, 2026-09-01."
    detail: >-
      `Totem::UnSummon` (Totem.cpp:154-157) clears the Sentry buff with
      `if (GetEntry() == SENTRY_TOTEM_ENTRY) owner->RemoveAurasDueToSpell(TotemSpellIds::
      SentryTotemSpell)` -- a HARDCODED **6495**. The era clone 947260 applies its own slot-2 DUMMY,
      which that call does not name, so on an EARLY unsummon (totem killed, replaced, Totemic Recall)
      the buff lingers until its own 5-minute duration instead of dropping on the spot, and
      `spell_sha_sentry_totem`'s `AfterEffectRemove` -> `StopCastingBindSight` fires late rather than
      immediately. The line just above it, `owner->RemoveAurasDueToSpell(GetSpell(), GetGUID())`, does
      not help: creature 3968 has no `creature_template_spell` row, so `GetSpell()` is 0.
      NOT a total loss - the camera SWAP itself is entry-keyed and works (`Totem::InitSummon` casts
      6277 off entry 3968), and the natural-expiry path is unaffected because both the summon and the
      buff run 300 s.
    why_not_fixed_here: >-
      It is core C++ in an enum, not data: no generator key can express "also remove this id". A fix
      would be a core patch widening the check to the era band, which wants a spec decision for a
      level-34 utility totem. Recorded rather than silently accepted.
    what_would_settle_it: "a spec call on a core patch; the measurement itself is closed."

  - id: 13
    title: "TBC's Windfury Totem enchant chain is not reconstructed literally; the era DUMMY+proc
            reconstruction is shipped instead"
    found_by: "Plan 3b Task 2 batch 4b, 2026-09-01."
    detail: >-
      TBC's chain is summon -> passive (aura 23 @5000 ms) -> effect (`Effect 92 ENCHANT_HELD_ITEM`)
      -> payload (`aura 99 MOD_ATTACK_POWER` + `Effect 19 ADD_EXTRA_ATTACKS` 1). Of its 20 ids only
      **8512** and **8515** exist in `ip-dbc/Spell.dbc`; the whole Effect series (8514 / 10607 /
      10611 / 25579 / 25580) and the whole payload series (8516 / 10608 / 10610 / 25583 / 25584) are
      ABSENT. The five `SpellItemEnchantment.dbc` rows DO survive (1783 / 563 / 564 / 2638 / 2639,
      type 1 COMBAT_SPELL, amount 20) but each points at an absent payload, so a literal clone would
      apply an enchant that procs nothing, emit a `Player::CastItemCombatSpell` "unknown spell ...
      ignoring" line per qualifying swing per imbued raid member, AND occupy `TEMP_ENCHANTMENT_SLOT`
      -- which `Spell::EffectEnchantHeldItem` then uses to refuse every real temp imbue for the whole
      party. Strictly worse than not shipping it.
      Batch 4b therefore ships the shipped-Vanilla RECONSTRUCTION re-minted at TBC's values, which is
      what `script_bindings[931366/931367/931368].action` already prescribed. Faithful in magnitude
      (AP 122/229/315, ONE extra attack, 20% chance), mana, duration, school and rank count;
      unfaithful in ENCODING. The one behavioural consequence is off-hand procs -- open question 14.
    why_not_fixed_here: >-
      Restoring the payload series would mean authoring rows at their STOCK ids, outside the reserved
      [920000,950000) band -- the same spec question `accepted_gaps` id 7 / `open_questions` id 7
