  evidence: TBC 24907 EFFECT_0 = (35, aura 57 MOD_SPELL_CRIT_CHANCE, basePoints 4 = +5%) vs LIVE (65, aura 57, basePoints
    4 = +5%). Scope only; the +5% is already right.
  why_accepted: 'Core hardcast at SpellAuraEffects.cpp:1577, keyed on FORM_MOONKIN. Precedented by the Vanilla phase
    (which accepted a larger miss: +3% party vs +5% raid). Rewrite the node 20117 tooltip to describe what ships.'
