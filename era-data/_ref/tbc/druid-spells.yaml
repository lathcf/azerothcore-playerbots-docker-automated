  measurement: 'acore_world creature_template entry 1964 (Treant) is the TBC-flagged row: exp=1 (EXPANSION_THE_BURNING_CRUSADE), minlevel 60 / maxlevel 60, unit_class 1, HealthModifier 1.0, ManaModifier 1.0, ArmorModifier 1.0, DamageModifier 1.01652, BaseAttackTime 1574, RangeAttackTime 2000, empty AIName and ScriptName, no creature_template_addon row. The summon is a Guardian, so Guardian::InitStats calls InitStatsForLevel(owner->GetLevel()) (TemporarySummon.cpp:440) and the treants take the DRUID''s level, reading creature_classlevelstats class 1 via the exp-1 columns: level 60 = 4979 HP / 3750 armor / 252 AP / 53.48 base damage; level 70 = 6986 HP / 6719 armor / 304 AP / 104.53 base damage (times DamageModifier 1.01652). VERDICT: no divergence is introduced by this project -- the row carries no WotLK retune and a stock WotLK druid on this core summons identical treants. CAVEAT: absolute parity with Blizzard''s own 2.4.3 tuning is NOT verifiable here (the cached wago 2.5.4 export is SPELL tables only and this repo holds no TBC world-DB snapshot), so the gap is closed as "no measurable era divergence", not as "proven identical to retail TBC".'
  evidence: The SUMMON spell 33831 is confirmed byte-identical (LIVE_MATCH; SpellPower 12% base mana, 3 min cd,
    TBC tooltip 'Summons 3 treants ... for 30 sec'). The creature side was out of scope here — it is a creature_template
    question, not a spell-DBC one. The plan still owes this measurement before accepting.
