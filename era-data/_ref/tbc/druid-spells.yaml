- id: natural_perfection_periodic_bit
  spec_ref: NEW (Task 8)
  gap: 'Node 20159 grants the stock chain 33881/33882/33883, whose ProcTypeMask is 664232 where TBC''s is 139944 --
    one bit, 0x00080000 PROC_FLAG_TAKEN_PERIODIC. WotLK also arms the Natural Perfection absorb off periodic damage
    taken; TBC arms it only off direct crits.'
  evidence: _ref.non_effect_divergences 33881 (severity COSMETIC). All three talent ranks and all three absorb
    spells (45281/45282/45283) are byte-identical between the eras.
  why_accepted: 'A one-bit beneficial widening on a talent that is otherwise byte-identical. Spending three fresh
    clone ids to remove a proc trigger is disproportionate, and _ref itself graded it COSMETIC and reclassified
    the node into the "clean, plain grants" bucket (Amendment A.1).'
- id: furor_wotlk_extra_effect
  spec_ref: NEW (Task 8)
  gap: 'Node 20143 grants the stock Furor chain 17056/17058-17061 (whose EFFECT_0, the icon-238 DUMMY the core
    reads, is byte-identical to TBC). Live adds an EFFECT_1 TBC does not have -- aura 107 ADD_FLAT_MODIFIER, misc
    12 SPELLMOD_EFFECT2, +1/3/5/7/9, with an all-zero effect class mask -- so a stock grant ships it.'
  evidence: 'survival_map 17056-17061: "!e2 TBC(0,0,0,0,0)->LIVE(6, 107, 1..9, 12, 0)".'
  why_accepted: 'INHERITED, not introduced: the shipped Vanilla node 18733 grants the same five ids and has the
    same extra effect. Keeping the two managed eras'' grant manifests identical is load-bearing for
    EraBandClassifier::Sweep across an era transition (see node 20109''s comment), so diverging here would cost more
    than the effect is worth. Same reasoning as the Vanilla phase''s accepted cat-branch divergence on this node.'
- id: improved_faerie_fire_substrate
  spec_ref: NEW (Task 6)
  gap: 'Improved Faerie Fire (node 20118): against the STOCK baseline Faerie Fire the melee-hit half of the talent is inert and the second half lands on spell-hit instead of ranged-hit.'
  evidence: 'TBC 33600/33601/33602 = aura107 misc12 SPELLMOD_EFFECT2 flat +1/2/3 AND aura107 misc23 SPELLMOD_EFFECT3 flat +1/2/3, both masked to Faerie Fire (A=1024). TBC Faerie Fire 770 and Faerie Fire (Feral) 16857 carry EFFECT_2 = aura184 MOD_ATTACKER_MELEE_HIT_CHANCE and EFFECT_3 = aura185 MOD_ATTACKER_RANGED_HIT_CHANCE, both at base 0, so the talent is what switches them on. Stock 3.3.5a 770/16857 have NO Effect_2 at all and their Effect_3 is aura186 MOD_ATTACKER_SPELL_HIT_CHANCE (base 0). SPELLMOD_EFFECT2 therefore has nothing to modify, and SPELLMOD_EFFECT3 raises attacker SPELL hit chance rather than ranged hit chance.'
  why_accepted: 'The node is authored to the TBC letter (multi: effect2 + effect3 spellmods) rather than granting the WotLK stock chain, whose DUMMY does something else entirely (+spell crit against a Faerie-Fire''d target, Unit.cpp:9304). The FERAL half self-closes once Task 7''s node-20133 clone of 16857 is authored with TBC''s aura184/aura185 effect layout; only baseline Faerie Fire 770 -- not a talent, and out of scope for this tree -- keeps the substrate gap.'

