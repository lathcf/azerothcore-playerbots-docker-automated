spec_bucket_contradictions:
- node: 20159
  name: Natural Perfection
  spec_bucket: diverged
  live_bucket: clean
  evidence: 'All three rank spells 33881/33882/33883 are byte-identical on every used effect slot (e1 aura 42 PROC_TRIGGER
    -> 45281/45282/45283 with mask A word-A 32; e2 aura 57 MOD_SPELL_CRIT_CHANCE basePoints 0/1/2 misc 127), and
    so are the three absorb spells 45281-45283 (e1 aura 87 MOD_DAMAGE_PERCENT_TAKEN basePoints -3 misc 127). The
    only raw diffs were unused-slot padding. Sole real delta is one ProcTypeMask bit (see non_effect_divergences).
    DISPOSITION: grant the stock chain; no clone.

    '
- nodes:
  - 20114
  - 20140
  - 20142
  - 20145
  - 20148
  names:
  - Moonfury
  - Predatory Instincts
  - Improved Mark of the Wild
  - Nature's Focus
  - Subtlety
  spec_bucket: missing ranks (implied otherwise clean)
  live_bucket: diverged AND missing ranks
  evidence: '§2 presents its three buckets as mutually exclusive, so a node in ''Missing ranks'' reads as ''the
    surviving ranks are fine''. They are not: every one of these five is ALSO value-retuned on its surviving ranks
    — e.g. Moonfury r1-r3 TBC +2/4/6% (bp 1/3/5) vs WotLK +3/6/10% (bp 2/5/9); Improved MotW r1-r2 TBC +7/14% (bp
    6/13) vs WotLK +20/40% (bp 19/39); Nature''s Focus r1-r3 TBC -14/28/42% (bp 13/27/41) vs WotLK -23/46/70%; Subtlety
    r1-r3 TBC -4/-8/-12% threat vs -10/-20/-30%; Predatory Instincts r1-r3 TBC crit-damage +2/4/6% + AoE-avoidance
    vs WotLK +3/7/10% + a different aura (229 MOD_AOE_DAMAGE_AVOIDANCE). DISPOSITION: no change in mechanism — all
    five are passives the auto-passive band covers for free at TBC values. Recorded so Task 6/7 authors the retuned
    numbers rather than granting stock.

    '
- node: 20112
  name: Nature's Grace
  spec_bucket: clean
  live_bucket: clean on EFFECTS, DIVERGED on ProcChance
  evidence: 'See non_effect_divergences 16880 — TBC 100% vs live 33%. The §2 diff was effect-only and could not
    see it. This is the one place where ''Clean'' would have shipped a wrong number.

    '
reuse_ledger:
  932504:
    what: Nature's Grace -0.5s next-cast buff (clone of 16886)
    node: 20112
    verdict: REUSE_WITH_GAP
    evidence: 'TBC 16886 EFFECT_0 = (Effect 6 APPLY_AURA, aura 107 ADD_FLAT_MODIFIER, basePoints -501, misc 10 SPELLMOD_CASTING_TIME)
      = a flat -500ms. Live/WotLK 16886 = (6, aura 65 MOD_CASTING_SPEED_NOT_STACK, basePoints 19 = +20% haste, misc
      10) — a different mechanic. 932504 was built as exactly the TBC shape (aura 107, misc 10, basePoints -500,
      procCharges 1), so the MAGNITUDE and MECHANIC reuse cleanly.

      '
    gap: 'DURATION. TBC 16886 DurationIndex 8 = 15000ms; 932504 uses DurationIndex 21 (-1, persists until consumed).
      A TBC druid can bank the buff indefinitely instead of losing it after 15s. Cheap to close: one fresh 946-band
      clone identical to 932504 with durationIndex 8.

      '
    blocker: 'The TALENT is the problem, not the buff — stock 16880 procs at 33% on this core vs TBC''s 100% (non_effect_divergences).
      Whatever Task 6 does about the buff, node 20112 needs a 100%-proc talent carrier, i.e. a fresh clone of 16880
      that triggers the chosen buff id.

      '
  932505:
    what: Nature's Grasp r1 (35% / 1 charge / outdoor-only, clone of 16689)
    node: 20101
    verdict: REUSE_WITH_GAP
    evidence: 'TBC 16689 SpellAuraOptions: ProcChance 35, ProcCharges 1, ProcTypeMask 40. Live 16689: ProcChance
      100, ProcCharges 3. TBC SpellMisc Attributes_0 = 98304 (0x18000, i.e. +SPELL_ATTR0_ONLY_OUTDOORS 0x8000);
      live Attributes = 65536 (0x10000, no outdoor restriction). TBC DurationIndex 22 = 45000ms; effect = aura 42
      PROC_TRIGGER_SPELL -> Entangling Roots 19975. 932505 overrides EXACTLY procChance 35 / procCharges 1 / attributes
      98304 and inherits the 45s duration + the 19975 trigger. Every proc field matches TBC bit for bit.

      '
    gap: 'MANA. TBC Nature''s Grasp has NO SpellPower row (all six ranks) and the Wowhead TBC tooltip shows no mana
      line -> FREE. 932505 charges 50. Spec §3 asserted the mana cost matched; it does not.

      '
  932507932511:
    what: Nature's Grasp r2-r6 (clones of 16810/16811/16812/16813/17329)
    node: 20101
    verdict: REUSE_WITH_GAP
    evidence: 'TBC SpellAuraOptions for all five: ProcChance 35, ProcCharges 1, ProcTypeMask 40 — identical to r1
      and to the Vanilla clones. TBC SpellMisc Attributes_0 98304 and DurationIndex 22 on every rank. The per-rank
      Entangling Roots triggers (19974/19973/19972/19971/19970) are inherited from the stock templates and are era-invariant.

      '
    gap: Same free-vs-paid mana gap as r1 (clones charge 65/80/95/110/125).
    note: 'The whole stock chain''s trainer rows were ALREADY DELETED GLOBALLY by the Vanilla phase (pristine trainer_spell.sql
      has rows for 16689/16810-16813/17329 at TrainerId 33; the live table has none). So TBC gets nothing for free
      here — the existing Vanilla clone trainer chain must have its era gate widened (spec §8), or a TBC druid has
      rank 1 only.

      '
  932500932502:
    what: Predatory Strikes r1-r3 (clones of 16972/16974/16975)
    node: 20130
    verdict: REUSE
    evidence: 'TBC 16972/16974/16975 EFFECT_0 = (6, aura 4 DUMMY, basePoints 49/99/149 = 50/100/150% of level, misc
      0) — byte-identical to live EFFECT_0. TBC has NO effect 1 and NO effect 2; live added EFFECT_1 (aura 4 DUMMY
      6/13/19 = the weapon-AP% bonus) and EFFECT_2 (aura 109 ADD_TARGET_TRIGGER -> 69369, the WotLK Ravage proc).
      The Vanilla clones author EFFECT_0 only and 0-fill the rest — exactly the TBC shape. Clean reuse, no gap.

      '
    note: 'The core reads the icon-1563 DUMMY only inside `if (IsInFeralForm())` (StatSystem.cpp:408), and IsInFeralForm()
      is Cat/Bear/DireBear (+shaman Ghost Wolf) — NOT Moonkin. The TBC tooltip says "Cat, Bear, Dire Bear and Moonkin
      Forms". This is NOT an era divergence: the WotLK tooltip says the same and the core behaves the same for a
      stock WotLK druid. Recorded so it is not mistaken for one.

      '
  932512:
    what: castable Omen of Clarity (clone of 16864)
    node: 20149
    verdict: REUSE_WITH_GAPS
    evidence: 'The CASTABILITY claim holds: TBC 16864 Attributes_0 = 327680 (0x50000) carries neither SPELL_ATTR0_PASSIVE
      (0x40) nor SPELL_ATTR0_DO_NOT_DISPLAY (0x80), CastingTimeIndex 1 (instant), SpellPower ManaCost 120; live
      16864 Attributes = 192 (PASSIVE|DO_NOT_DISPLAY), DurationIndex 0. Effects match (aura 42 PROC_TRIGGER -> Clearcasting
      16870). 932512 = Attributes 0, castTimeIndex 1, powerCost 120 -> castable at the right cost.

      '
    gaps:
    - 'DURATION: TBC DurationIndex 30 = 1800000ms (30 min; tooltip ''Lasts 30 min''). 932512 uses durationIndex
      6 = 600000ms (10 min). Spec §3 called TBC ''the castable 10-minute buff'' — wrong.'
    - 'PROC MASK: TBC ProcTypeMask 20 = DONE_MELEE_AUTO_ATTACK(0x4) | DONE_SPELL_MELEE_DMG_CLASS(0x10), i.e. melee
      only, matching the tooltip''s ''Each of the Druid''s melee attacks''. 932512 inherits stock 81924 = 0x4 |
      DONE_SPELL_MAGIC_DMG_CLASS_POS(0x4000) | ..._NEG(0x10000), so it also procs off spellcasts.'
    - 'PROC ICD: TBC SpellAuraOptions.ProcCategoryRecovery 10000 (tooltip ''(10s cooldown)''). 932512 has none.'
    recommendation: 'Task 6 should author a FRESH TBC clone (byte-copy of 932512 with durationIndex 30, procTypeMask
      20, and a 10s proc ICD) rather than reuse. Cost is one id out of a 256-wide free slice; the reuse otherwise
      ships a 10-minute, spell-proccing, ICD-less Omen.

      '
  932513:
    what: Enrage (clone of 5229)
    node: null
    verdict: REUSE
    evidence: 'TBC 5229 EFFECT_0 = (6, aura 24 PERIODIC_ENERGIZE, basePoints 19 -> 20 rage, misc 1 POWER_RAGE) over
      DurationIndex 1 = 10000ms. Live 5229 = EFFECT_0 basePoints 9 (10 rage over 10s) PLUS EFFECT_1 (Effect 30 ENERGIZE,
      basePoints 199 -> 20 rage instant) PLUS EFFECT_2 (aura 94). 932513 authors exactly the TBC shape: 20 rage
      over 10s + a 0-base ENERGIZE slot kept only so Improved Enrage''s SPELLMOD_EFFECT2 has somewhere to land,
      effect 3 dropped. Magnitudes match TBC exactly.

      '
    gap: 'TBC 5229 also carries EFFECT_1 = (Effect 3 DUMMY, basePoints -76) — the armor-reduction drawback. The
      Vanilla clone deliberately omitted it (the 1.12 aura-101 encoding was not confidently decodable) and the reuse
      inherits that omission. Beneficial divergence; spec §6.3.

      '
    note: 'Stock 5229''s trainer row (TrainerId 33, pristine SQL) was DELETED GLOBALLY by the Vanilla phase and
      the live table confirms it is gone, so the TBC arm must widen the existing version-swap gate (spec §8) or
      a TBC druid gets no Enrage at all.

      '
