tree_of_life:
  disposition: data_only
  mechanism: 'Route B (DECIDED 2026-08-30, supersedes the A/B options recorded here): bind an era-guarded DoEffectCalcAmount
    AuraScript to STOCK 34123 that returns 0 for an era-managed TBC druid, and deliver the real TBC effect via the
    946265/946266 form-passive -> party-aura pair. NO core patch.'
  confidence: HIGH_ON_MECHANISM / UNVERIFIED_AT_RUNTIME
  what_the_core_does: 'AuraEffect::HandleShapeshiftBoosts (SpellAuraEffects.cpp:1352-1360) switches on GetMiscValue()
    — the FORM, not the spell and not a talent — and for FORM_TREE sets spellId = 34123, then unconditionally `target->CastSpell(target,
    34123, true, ...)`. Grepping the whole fork, line 1359 is the ONLY occurrence of 34123 anywhere in src/server:
    no script, no spell_script_names row, no other caller. UNLIKE Leader of the Pack (line 1496, `if (player->HasTalent(17007,
    ...))`) the Tree cast is NOT talent-gated, so an era druid in Tree form DOES get it. There is no script bound
    to form 33891 in spell_druid.cpp either (only PlayerUpdates.cpp:990''s weapon-skill early-out and SpellInfoCorrections.cpp:323''s
    Stances fix for the unrelated Master-Shapeshifter spell 48422).

    '
  what_the_tbc_talent_did: 'Wowhead TBC 33891 (cached, era-data/_ref/tbc/tooltips/33891.json): "While in this form
    you increase healing received by 25% of your total Spirit for all party members within 45 yards". The DBC agrees
    on the SHAPE and is silent on the AMOUNT: TBC 34123 EFFECT_0 = (Effect 35 APPLY_AREA_AURA_PARTY, aura 115 SPELL_AURA_MOD_HEALING,
    basePoints 0, misc 127 = all schools, radiusIndex 11 = 45yd). basePoints 0 is not a magnitude — the amount was
    computed server-side from the druid''s Spirit, which is why the spec could not read it out of the data. Live/WotLK
    34123 = (Effect 65 APPLY_AREA_AURA_RAID, aura 118 MOD_HEALING_PCT, basePoints 5 = +6%, misc 127) — different
    scope AND different mechanic, confirming spec §5. wowsims/tbc sim/druid/talents.go was fetched and does NOT
    model Tree of Life or Restoration at all (zero hits for "tree"/"34123"); it is not a usable reference here.

    '
  why_data_only_is_reachable:
  - 'aura 115 IS implemented in this core as a flat healing-TAKEN bonus: Unit.cpp:9747 `GetTotalAuraModifierByMiscMask(SPELL_AURA_MOD_HEALING,
    spellProto->GetSchoolMask())` feeds SpellHealingBonusTaken. So the TBC mechanic works here as-is; only the AMOUNT
    needs computing.'
  - 'A Spirit-derived amount is an established idiom in THIS module: EraTalentProcScripts.cpp already uses DoEffectCalcAmount
    in six places (era_amplify_curse, era_firestone_spellpower, era_spellstone_absorb, era_pal_jotc_crit, era_hunter_scorpid_sting,
    era_pal_ardent_defender). 946266''s amount = 25% of the caster''s total Spirit is the same shape.'
  - 'The delivery vehicle already exists and is real-client proven: HandleShapeshiftBoosts'' spell-map loop auto-casts
    any learned spell with SPELL_ATTR0_PASSIVE|SPELL_ATTR0_DO_NOT_DISPLAY whose Stances mask includes the entered
    form (FORM_TREE = 2, so ShapeshiftMask bit 1 << (2-1) = 2 — the same value stock 34123 carries). This is exactly
    the Vanilla LotP 932503/932506 split.'
  the_one_real_obstacle: "DOUBLE-DIP. The core's hardcast of WotLK 34123 (+6% party MOD_HEALING_PCT) still fires\
    \ for an era druid, so a naive clone would stack the TBC flat bonus ON TOP of the WotLK percentage. The spec's\
    \ \"does not fight\" test therefore FAILS as written — but the fight is winnable without a core patch:\n  route\
    \ A (preferred, all scripts on CUSTOM ids): grant a fresh 946-band clone of the FORM spell\n    33891 instead\
    \ of stock 33891, and bind an AuraScript to the clone with an AfterEffectApply hook\n    on its MOD_SHAPESHIFT\
    \ effect calling `GetTarget()->RemoveAurasDueToSpell(34123)`. Ordering is\n    safe: AuraEffect::HandleEffect\
    \ runs the default handler (HandleShapeshiftBoosts, which casts\n    34123) BEFORE CallScriptAfterEffectApplyHandlers.\
    \ The core re-derives the form from\n    GetMiscValue(), so the clone keeps every FORM_TREE behavior (spell\
    \ restrictions, -20% speed).\n  route B (lighter, one stock binding): keep granting stock 33891 and bind an\
    \ era-guarded AuraScript\n    to STOCK 34123 with DoEffectCalcAmount on EFFECT_0 / SPELL_AURA_MOD_HEALING_PCT\
    \ returning 0 when\n    the caster is an era-TBC druid. Binding a script to a stock id is precedented in this\
    \ module\n    (stock Sap, stock Berserker Rage 18499, stock 5138/11297 in the warlock/rogue datasets) and does\n\
    \    NOT violate the era-safety rule, which forbids spell_dbc overrides and runtime SpellInfo\n    mutation,\
    \ not per-cast scripts. Downside: a +0% party buff icon still shows.\n"
  ids: 946265 = hidden FORM_TREE form-passive; 946266 = the party aura. (Amendment A.4)
  known_limitations_to_record_either_way:
  - The amount is computed at aura apply (form entry). SPELL_AURA_MOD_HEALING is not on any core stat-change recalculation
    path, so a Spirit swap mid-form will not update the bonus until the druid re-enters the form. Acceptable; must
    be stated in the node tooltip's wording or the verification record.
  - Party-only scope is CORRECT for TBC (Effect 35), so unlike Moonkin Aura there is no scope gap.
  fallback_if_task_8_runtime_fails: 'Demote to `accepted_gap` with the Moonkin Aura treatment — keep the WotLK +6%
    raid aura, rewrite the node 20161 tooltip to describe what actually ships, and record it in the verification
    doc''s accepted-gaps table. Do NOT escalate to a core patch: this task found a non-patch route, so a patch is
    not the last resort it would have to be to qualify.

    '
  escalation_status: NOT escalated. No core patch is proposed or needed.
  task8_outcome: 'SHIPPED as Route B (2026-08-31, generation b52600c7). 946265 = hidden FORM_TREE form-passive
    (template 17007 for the Attributes-464 talent-passive shape, ShapeshiftMask 2, EFFECT_0 TRIGGER_SPELL ->
    946266); 946266 = the party aura (template 34123, re-authored to Effect 35 APPLY_AREA_AURA_PARTY / aura 115
    MOD_HEALING / misc 127 / radiusIndex 11) with its amount set to 25% of the caster''s total Spirit by the
    era_dru_tree_of_life AuraScript. Node 20161 grants the STOCK form 33891; 946265 rides EraTalents.cpp''s
    CLASS_DRUID paired-grant arm (kEraDruidTbcPaired), flagged custom so every other era strips it, because
    era_talent_rank''s PK is (talentId, rank) and a node grants exactly one spell per rank.

    SUPPRESSION was implemented ONE STEP STRONGER than the spec described. era_dru_tree_of_life_suppress is bound
    to STOCK 34123 and registers BOTH hooks: DoCheckAreaTarget returning false (the primary -- Aura::CanBeAppliedOn
    -> CheckAreaTarget runs for EVERY candidate of an area aura including the caster, SpellAuras.cpp:1888-1907, so
    rejecting all of them means the WotLK aura is never APPLIED to anyone) and DoEffectCalcAmount -> 0 (the
    fallback the spec named). The reason for the upgrade: DoEffectCalcAmount alone leaves a VISIBLE +0% "Tree of
    Life" buff icon on every party member alongside 946266''s, which the spec noted as Route B''s downside.
    The era gate on both hooks is era-band OWNERSHIP -- HasSpell(946265) -- never EraFromIP and never "is a bot",
    per the CLAUDE.md rule; a WotLK druid never owns 946265, so the stock binding is inert for it.

    '
  task8_runtime_status: 'NOT VERIFIED IN FORM. Headless verification proved the substrate only: 946265/946266
    load with no spell_dbc / spell_proc / spell_script_names errors, both script bindings are present in
    spell_script_names (34123 -> era_dru_tree_of_life_suppress, 946266 -> era_dru_tree_of_life), and a TBC-band
    druid bot that spent node 20161 (Kylarya, level 68) persisted BOTH 33891 (node grant) and 946265 (paired-grant
    arm) into character_spell. What could NOT be observed is the only thing that matters for the double-dip:
    whether a druid actually IN Tree of Life form ends up with the TBC aura and NOT WotLK''s +6%. Bots do not
    shapeshift on this realm (established at Task 7), so no character entered FORM_TREE. THE IN-FORM CHECK IS
    HANDED TO TASK 10 (real client): enter Tree of Life in a party, confirm party members carry exactly ONE
    "Tree of Life" buff, that it is the 946266 icon/text, and that its amount tracks the druid''s Spirit. If the
    suppression fails there, the fallback stays what A.2 said -- demote to accepted_gap, rewrite node 20161''s
    tooltip, NEVER a core patch.

    '
