non_effect_divergences:
  16880:
    field: ProcChance
    tbc: 100
    live: 33
    node: 20112
    severity: MATERIAL
    note: 'THE FINDING OF THIS SWEEP. TBC Nature''s Grace is a SINGLE-rank 100%-on-spell-crit talent; WotLK split
      it into a 3-rank 33/66/100% chain (16880/61345/61346) and left rank 1 at 33%. Node 20112 is maxRank 1 -> granting
      stock 16880 ships a 33% proc where TBC is 100%. Contradicts spec §2''s ''Clean'' bucket (which diffed EFFECTS
      only). Fix is cheap: a fresh 946-band clone of 16880 with procChance 100.'
  16886:
    field: DurationIndex / ProcCharges / ProcTypeMask
    tbc: 8 (15000ms) / 1 / 87376
    live: 27 (3000ms) / 0 / 0
    node: 20112
    severity: MINOR
    note: The Nature's Grace BUFF. TBC = a 15-second, 1-charge window. The reused Vanilla clone 932504 uses durationIndex
      21 (-1, persists until consumed) + 1 charge, so a TBC druid could bank the -0.5s indefinitely. See reuse_ledger
      932504.
  16689:
    field: ProcChance / ProcCharges / ManaCost
    tbc: 35 / 1 / 0 (NO SpellPower row)
    live: 100 / 3 / 0
    node: 20101
    severity: MATERIAL
    note: 'Proc mechanics match the Vanilla clone EXACTLY (35% / 1 charge). MANA DOES NOT: TBC Nature''s Grasp has
      NO SpellPower row at any rank (16689/16810/16811/16812/16813/17329) and the Wowhead TBC tooltip shows no mana
      line, i.e. it is FREE. The reused Vanilla clones charge 50/65/80/95/110/125. Contradicts spec §3''s ''including
      its mana cost''.'
  16857:
    field: DurationIndex
    tbc: 64 (40000ms)
    live: 5 (300000ms)
    node: 20133
    severity: MATERIAL
    note: 'Faerie Fire (Feral): TBC 40s, WotLK 5 min — on top of the effect-level divergence (TBC flat -175 armor
      via aura 22 MOD_RESISTANCE misc 1 vs WotLK -5% via aura 101 MOD_RESISTANCE_PCT). Node 20133 needs a clone
      either way.'
  16864:
    field: DurationIndex / ProcTypeMask / ManaCost / proc-ICD
    tbc: 30 (1800000ms=30min) / 20 / 120 / 10s
    live: 0 (none, PASSIVE) / 81924 / 0 / none
    node: 20149
    severity: MATERIAL
    note: 'Omen of Clarity. TBC is a CASTABLE 120-mana 30-MINUTE buff (Attributes 0x50000, no PASSIVE/DO_NOT_DISPLAY)
      that procs on MELEE ONLY (mask 20 = DONE_MELEE_AUTO_ATTACK 0x4 | DONE_SPELL_MELEE_DMG_CLASS 0x10) with a 10-second
      internal cooldown (tooltip: ''(10s cooldown)''). WotLK 16864 is a hidden passive (Attributes 192). See reuse_ledger
      932512 — the Vanilla clone is 10 MIN, procs on magic spells too (81924), and has no ICD.'
  33876:
    field: DurationIndex
    tbc: 29 (12000ms)
    live: 3 (60000ms)
    node: 20141
    severity: MATERIAL
    note: 'Mangle bleed-amplify debuff window: TBC 12s, WotLK 60s. Applies to ALL SIX Mangle ranks (33876/33982/33983
      Cat, 33878/33986/33987 Bear). The spec §3 Mangle row listed only the weapon% and the aura reshape — the duration
      is a THIRD divergence the clones must carry.'
  33881:
