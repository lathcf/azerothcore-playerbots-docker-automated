- id: tree_of_life_client_tooltip
  spec_ref: NEW (Task 8)
  gap: 'Node 20161 grants the STOCK form 33891, whose CLIENT tooltip is global and immutable and reads
    "increase healing received by $34123s1% for all party and raid members within $34123a1 yards" -- i.e. it
    renders WotLK 34123''s +6% and 100-yard raid scope. What actually ships is the TBC party aura 946266 (flat,
    25% of the druid''s Spirit, party-only, 45 yards) with the WotLK aura suppressed. The talent panel hyperlinks
    the granted spell, so it shows that text too rather than node 20161''s authored prose.'
  evidence: '3.3.5a Spell.dbc 33891 Description_Lang_enUS = "Shapeshift into the Tree of Life. While in this form
    you increase healing received by $34123s1% for all party and raid members within $34123a1 yards, and you can
    only cast Restoration spells in addition to Innervate, Barkskin, Nature''s Grasp and Thorns spells." The
    $-substitutions resolve client-side against the client''s own 34123 row, which this project does not (and must
    not) override -- editing a stock client row changes it for WotLK-stage characters too.'
  why_accepted: 'Closing it requires granting a CLONE of the FORM spell (spec Amendment A.2''s Route A), which the
    approved decision deliberately did not take. The node''s authored tooltip records the shipped behavior; the
    client text is cosmetic and does not change what the aura does. Flagged for the Task 10 fix-round decision.'
