# TBC Paladin stock spell reference + survival map — TBC Phase 1, Task 3 (2026-08-27).
# THE PIVOTAL DELIVERABLE the authoring tasks (nodes/seals/leaks) read INSTEAD of re-investigating.
# Mirrors era-data/_ref/paladin-spells.yaml (Vanilla) in shape; adds a TBC-scoped methodology + a
# per-node `survival:` verdict, a `seal_ledger:`, and a `baseline_leaks:` block.
#
# ============================ Verification method (era-scoped) ============================
# ERA OF RECORD: TBC 2.4.3.  The wago 2.5.4.44833 (TBC Classic) `SpellEffect`/`SpellMisc` DB2s are the
# MAGNITUDES of record (the numbers a TBC-faithful build must match). The LIVE 3.3.5a store is the
# final word on what THIS server actually has. A spell "survives" iff its stock id is present in the
# live 3.3.5a Spell.dbc with a TBC-compatible shape; the wago row is the mechanized first pass, the live
# store overrules it, and every DIVERGED/absent verdict below was live-confirmed (never assumed).
#
#   - Live 3.3.5a Spell.dbc pulled out of the running container (kept for the authoring tasks):
#       docker exec ac-worldserver cat /azerothcore/env/dist/data/dbc/Spell.dbc > <scratch>/dbc/Spell.dbc
#   - wago 2.5.4.44833 CSVs (curl -A "Mozilla/5.0"), FULL-table fetch worked (no 403, ~3.3MB/2.2MB):
#       https://wago.tools/db2/SpellEffect/csv?build=2.5.4.44833   (join key = last col `SpellID`;
#         `EffectIndex` is 0-based; per-effect cols Effect / EffectAura / EffectBasePoints /
#         EffectMiscValue_0 / EffectSpellClassMask_0..3 / EffectTriggerSpell)
#       https://wago.tools/db2/SpellMisc/csv?build=2.5.4.44833    (CastingTimeIndex / DurationIndex /
#         RangeIndex / SchoolMask, join key `SpellID`)
#   - BASE-POINTS CONVENTION (verified): BOTH the wago 2.5.4 DB2 and the 3.3.5a DBC store value-1
#     (displayed = EffectBasePoints + 1). Divine Strength wago 1/3/5/7/9 = +2/4/6/8/10% (TBC) vs live
#     2/5/8/11/14 = +3/6/9/12/15% (WotLK) — a real magnitude divergence, not a convention artifact.
#   - Effect-level detail: python3 tools/dump_spell_effects.py <Spell.dbc> tools/spell_dbc_columns.txt
#       --ids <id>  ;  family identity: python3 tools/dump_spell_family.py <Spell.dbc> ... --names/--ids
#     Aura/effect numbers resolve against the fork headers (SpellAuraDefines.h / SharedDefines.h).
#   - Live name/absence checks: python3 tools/wgconsole.py <out> "lookup spell <name>" "wait:2" ...
#   - Trainer-leak verdicts: the PRISTINE stock trainer table
#       azerothcore-wotlk/data/sql/base/db_world/trainer_spell.sql
#     (the live acore_world `trainer_spell` is CONFOUNDED — the Vanilla-era gate SQL already DELETED the
#     leak rows, so a live query returns 0 rows for BoK; the base SQL is the un-gated ground truth.)
#   - Raw artifacts kept under the Task-3 scratchpad: node_diff.txt (per-node wago-vs-live), live_effects.txt,
#     SpellEffect_2.5.4.csv / SpellMisc_2.5.4.csv, lookup.out.
#
# HELPER-ID CHECK (Task 3 Step 1) — run 2026-08-27, result **946000-946255 ALL FREE**:
#   grep -rn "9460[0-9][0-9]\|9461[0-9][0-9]\|9462[0-5][0-9]" era-data/ modules/mod-era-talents/data/sql/
#     client-addons-src/EraTalents/data/  -> no hits. Paladin's TBC helper slice [946000,946255] is clean.

