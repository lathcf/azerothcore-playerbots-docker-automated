# ============================ seal_ledger: reuse-first per the design §3 ============================
# The Vanilla phase reconstructed the EXACT TBC seal model — single "Judgement" unleash button + on-hit
# seals you swap + Seal of the Crusader/JotC (absent from 3.3.5a) — as custom family-10 clones (932600-753).
# So the TBC seal-modifying talents bind to that reconstructed substrate, never to stock WotLK seals.
#
# VALUE-EQUALITY IS THE REUSE GATE (design §3): grant a shipped Vanilla clone to a TBC paladin ONLY where
# its baked value == TBC 2.4.3 (wago). Any per-rank divergence forces a fresh 946xxx clone (NEVER mutate a
# shipped Vanilla clone — era spells are per-character but spell ids are global).
#
# WHAT I VERIFIED (survival of the substrate pieces in 3.3.5a):
#   - Seal of the Crusader base castable: ABSENT (only orphan passives 23300/28852/33557). The Vanilla
#     clones 932634-639 (seal) + 932640-645 (JotC) EXIST and are reusable. Judgement of the Crusader base: ABSENT.
#   - Sanctity Aura base 20218: ABSENT (removed WotLK). Vanilla clone 932602 present.
#   - Seal of Blood 31892: SURVIVES near-identical (aura4 DUMMY 39/9/trig-31897; wago==live value set). B bit10.
#   - Seal of Vengeance 31801: SURVIVES but WotLK-REWORKED (aura4 dummy + aura240 -> Holy Vengeance DoT). B bit11.
#   - Judgement of Blood 31898: SURVIVES but DIVERGED (TBC flat 294 Holy vs WotLK weapon%+eff58). A bit23+B bit3+C bit4.
#   - Judgement of Vengeance 31804: SURVIVES. A bit23 + B bits.
#   - Seal of Command 20375: IDENTICAL wago==live; the Vanilla single-target clone 932606 is TBC-faithful.
#
# >>> OVERRIDE 2026-08-27 (Task 5b, USER DECISION): the REUSE verdicts below are SUPERSEDED for VALUES.
# TBC seals now use wago 2.5.4.44833 END-TO-END, including the TBC-Classic ~2x seal rebalance vs original
# 2.4.3. So the six STANDARD seals are authored as FRESH 946xxx clones for EVERY rank (low ranks included),
# NOT reused from the Vanilla 932xxx clones. The structural model + era_pal_* scripts are unchanged; only the
# ids/values/ranks differ. Value convention: authored basePoints = wago EffectBasePoints + 1 (confirmed:
# SoC proc 69->70%, SotC attack-speed 39->+40%). STILL REUSED (kept): the single Judgement button 932746 +
# Lay on Hands 932668-670. Authored in era-data/tbc/paladin.yaml `helpers:`; reconcile-granted by level in
# EraTalents.cpp kTbcPalSealGrants; doctor recognizes 946000-946077 for a TBC paladin. Fresh 946xxx id map:
#   SoR  seal 946000-008 / on-hit 946009-017 / JoR 946018-026   (9 ranks incl. TBC r9 L66)
#   SoC  seal 946027-032 / shared 70% proc 946033               (6 ranks; node-granted, NOT the arm)
#   SoL  seal 946034-038 / on-hit heal 946039-043 / JoL 946044-048 / carrier 946049  (5 ranks incl. r5 L69)
#   SoW  seal 946050-053 / on-hit mana 946054-057 / JoW 946058-061 / carrier 946062  (4 ranks incl. r4 L67)
#   SoJ  seal 946063 (r1) + 946079 (r2 L48) — both reuse stock stun 20170 + JoJ 20184 (Task 5c: r2 uses
#        the SAME stock mechanic as r1, avoiding the unverified 31895/31896; no dangling DUMMY)
#   SotC seal 946064-070 / JotC 946071-077                      (7 ranks incl. TBC r7 L61; AP ~2x = the rebalance)
#   MARKER 946078 "Era: TBC Paladin" (Task 5c) — hidden seal-training marker (spell_dbc in 2026_08_27_02).
# DONE in Task 5c (2026-08-27): the "Era: TBC Paladin" marker (946078), trainer_spell + spell_ranks for the
# STANDARD seals (marker-rooted SoR/SoJ/SoL/SoW/SotC; SoC r2-6 talent-rooted at 946027), and the reconcile
# arm converted from grant-all-ranks-by-level (5b interim) to grant-marker-only + strip. Seals are now
# TRAINER-TAUGHT. STILL DEFERRED to Task 5d: SoB/SoV (faction seals) — they will add rows on THIS marker.
# ON-HIT (Task 5c fold, USER DECISION 2026-08-27): the SoR on-hit flat base is now DERIVED FROM wago-2.5.4,
# not carried from Vanilla. wago's on-hit is a DUMMY coefficient (107..2111) for a modern SP/AP formula
# incompatible with the base-x-speed era_pal_seal_of_righteousness script, so we capture the TBC-Classic
# rebalance MAGNITUDE (~2x, the same lift SotC AP got): flat base = Vanilla 1.12.1 DPS-base x2 (r1..r9 =
# 6/14/24/38/56/78/102/130/162). ACCEPTED MAGNITUDE GAP: no SP/AP contribution. JoR flat = wago rebalance. <<<
