# =================================================================================================
# ATTRIBUTE DIVERGENCES — every one of the eight words is compared verbatim; nothing is filtered.
# Adjudicated by hand against the AzerothCore bit names (src/server/shared/SharedDefines.h).
# GROUPED BY BIT because the same WotLK-era hygiene bit recurs across dozens of unrelated spells.
# =================================================================================================
attribute_divergences:
  ATTR2_IGNORE_LINE_OF_SIGHT_0x4:
    count: 18
    verdict: "ENCODING/HYGIENE — not a behaviour the era must reproduce."
    detail: >-
      3.3.5a sets SPELL_ATTR2_IGNORE_LINE_OF_SIGHT (AttributesEx2 0x4) on a broad class of
      self-cast passives, triggered payloads and instant strikes that TBC left clear (Shiv 5940,
      Blade Flurry payload 22482, Quick Recovery energize 31663, Shadowstep payloads 36563/44373,
      every Deadly/Crippling poison payload, ...). It only relaxes a LoS check on an effect that
      already has a target. Adjudication: keep the LIVE value on any clone; do NOT author the
      TBC zero, which would add a LoS check the WotLK core's own spells do not have.
  ATTR3_SUPPRESS_TARGET_PROCS_0x20000:
    count: 10
    verdict: "PROC PLUMBING — keep the LIVE value on a clone."
    detail: >-
      Live sets it on the poison payloads (5760/8692/11398/13218/13222/13223/13224/27189), on
      Ruthlessness' combo payload 14157 and on the Blade Twisting daze 31125. It stops a payload
      from re-entering the proc system. TBC's core did not need the flag because its proc engine
      differed; authoring the TBC zero on a 3.3.5a clone risks proc recursion.
  ATTR6_TAPS_IMMEDIATELY_0x800000:
    count: 9
    verdict: "ENCODING — WotLK tap/loot bookkeeping, no era-visible behaviour."
    detail: "Live-only on the baseline abilities 408/703/1766/1833/1943/2094/8639/8647 and
             Slice and Dice. All are stock baselines the era never clones."
  ATTR3_ALWAYS_HIT_0x40000 and ATTR7_0x3800000 and ATTR0_NO_ACTIVE_DEFENSE_0x200000:
    count: "9 / 8 / 8 — the SAME set of spells, three columns"
    verdict: "RE-ENCODING of one identical behaviour. Grant/author the LIVE encoding."
    detail: >-
      The affected ids are exactly the eight hidden Mutilate halves (5374, 27576, 34414-34419).
      TBC expresses "this attack cannot be avoided" as ATTR0 NO_ACTIVE_DEFENSE (0x200000) +
      ATTR3 ALWAYS_HIT (0x40000); 3.3.5a expresses the same thing as ATTR7 0x3800000 =
      NO_ATTACK_DODGE | NO_ATTACK_PARRY | NO_ATTACK_MISS. Functionally identical; the live
      encoding is the one this core honours. This is why Mutilate is a GRANT and not a clone.
  ATTR3_SUPPRESS_CASTER_PROCS_0x10000:
    count: 7
    verdict: "PROC PLUMBING — keep the LIVE value."
    ids_and_meaning: >-
      Live-only on Mutilate 1329/34411/34412/34413, Premeditation 14183, Feint 1966 and
      Pick Pocket 921. On Mutilate it is REQUIRED on this core: the visible cast and both hidden
      halves would otherwise all proc, triple-counting every on-hit effect. Authoring the TBC
      zero would be a real bug, not era fidelity.
  ATTR0_0x401c0_on_the_Find_Weakness_buffs:
    count: 3
    ids: [31234, 31235, 31236]
    verdict: "HAZARD — read before reusing the surviving buff ids."
    detail: >-
      TBC 0x40010 vs live 0x1d0. TBC sets 0x40000 (SPELL_ATTR0_NOT_SHAPESHIFTED-adjacent hidden
      bit used on this buff) and live sets 0x1c0 = DO_NOT_LOG | DO_NOT_DISPLAY | 0x40. Combined
      with the DurationIndex diff (TBC 1 = 10 000 ms -> live 0 = permanent) it means the
      surviving 3.3.5a Find Weakness buffs are HUSKS: no duration, hidden, and reachable by no
      talent. They must be cloned, not granted. See node_findings 20419.
  ATTR3_INSTANT_TARGET_PROCS_0x80000 and ATTR3_CAN_PROC_FROM_PROCS_0x4000000:
    ids: [31226, 31227, 31124, 31126]
    verdict: "part of the WotLK REWORK of Master Poisoner / Blade Twisting; both nodes are
              authored from wago anyway, so the live values are irrelevant to them."
  ATTR0_0x180_and_0x20000000_on_Master_of_Subtlety:
    ids: [31665, 31666]
    verdict: >-
      31665 (the damage buff): TBC sets DO_NOT_LOG|DO_NOT_DISPLAY (0x180), live clears them, so
      3.3.5a SHOWS the buff icon. That is a UI improvement, not a mechanic. 31666 (the tracker):
      live adds NO_IMMUNITIES (0x20000000). Both are LIVE-preferred; node 20460 grants stock.
  remainder:
    ids_and_bits: >-
      ATTR1 ALLOW_WHILE_STEALTHED 0x20 (Slice and Dice 5171/6774 — live-only, cosmetic for a
      finisher), ATTR1 NO_THREAT 0x400 + ATTR4 NO_HARMFUL_THREAT 0x10 + ATTR2 NOT_AN_ACTION
      0x10000000 + ATTR6 NOT_AN_ATTACK 0x4 (Ruthlessness payload 14157 — live-only proc hygiene),
      ATTR4 NO_PARTIAL_IMMUNITY 0x800 (Crippling payloads 3409/11201), ATTR2 CANT_CRIT 0x20000000
      + ATTR3 DO_NOT_DISPLAY_RANGE 0x40000000 (Shiv payload 5940), ATTR2
      ITEM_CAST_WITH_OWNER_SKILL 0x1000000 (Anesthetic payload 26688), ATTR6 NOT_AN_ATTACK 0x4
      (Shadowstep 36554 + payloads), ATTR1 PREVENTS_ANIM 0x40000 (Mace Stun 5530).
      NONE of these is an era magnitude; all are adjudicated "keep LIVE".

