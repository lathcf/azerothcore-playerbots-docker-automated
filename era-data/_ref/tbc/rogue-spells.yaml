  generator_change_task8: >-
    A per-effect **`perLevel:`** key on a node `mechanic: multi` `effects:` entry ->
    `EffectRealPointsPerLevel_N` (a FLOAT column), written ONLY when present, plus a lint that a
    per-rank list must be maxRank long. SAME KEY NAME AND MEANING as the long-standing `helpers:`
    effect key — one spelling for one column, so the two paths cannot drift. Byte-neutral for every
    shipped dataset: no existing NODE effect carries the key (grepped era-data/), and the helper path
    is untouched. Needed by node 20455 Serrated Blades, whose armor-ignore half is aura 123
    MOD_TARGET_RESISTANCE at basePoints 0 with EffectRealPointsPerLevel -2.67/-5.34/-8.00; the
    alternatives were both worse — flattening to the level-70 total hands a level-40 rogue the
    level-70 armour reduction, and three per-rank HELPER clones would have spent three ids to reach a
    column the node emitter is one line away from. A generated node passive leaves
    SpellLevel/BaseLevel/MaxLevel at 0, which is exactly the shape wago's own 14171-14173 rows carry,
    so no level keys are needed for the growth window to match. TDD-guarded by
    test_node_effect_per_level_column, test_node_effect_without_per_level_key_does_not_emit_column
    and test_lint_rejects_short_per_level_list in tools/test_gen_era_talents.py.
  generator_change_task7: >-
    A per-effect **`mechanic:`** key on a `helpers:` effect -> the `EffectMechanic_N` column,
    written ONLY when present (so a templated helper keeps INHERITING the cloned record's mechanic
    for any slot that omits it). Byte-neutral for every shipped dataset — no existing helper effect
    carries the key, grepped. Needed by the Riposte clone 947777: it replaces live 14251's Effect_2
    (aura 138 MOD_MELEE_HASTE, EffectMechanic **8** = SLOW_ATTACK) with TBC's aura 67 MOD_DISARM,
    which must read EffectMechanic **3** = DISARM. The core reads the per-effect column in
    `Unit::IsImmunedToSpellEffect` (per effect index) and in
    `SpellMgr::GetDiminishingReturnsGroupForSpell` (SpellMgr.cpp:278 -> DIMINISHING_DISARM), both
    through `SpellInfo::GetAllEffectsMechanicMask()`, so an inherited 8 would test a disarm-immune
    target for slow-attack immunity and file the disarm in the wrong DR group. The existing
    spell-level `mechanic:` scalar was REJECTED for this: it applies to the WHOLE spell, so a
    disarm-immune target would also become immune to the clone's 150%-weapon-damage half.
    TDD-guarded by test_helper_effect_mechanic_column and
    test_helper_effect_without_mechanic_key_does_not_emit_column in tools/test_gen_era_talents.py.
