# =================================================================================================
# PREPARATION RESET-LIST RESOLUTION (plan Step 7 — triage row docs/era-talents-tbc-reconcile-triage.md:137)
# =================================================================================================
preparation_resolution:
  the_three_way:
    TBC_2_4_3:
      source: "cached tooltip era-data/_ref/tbc/tooltips/14185.json (wowhead TBC)"
      text: "When activated, this ability immediately finishes the cooldown on your Evasion,
             Sprint, Vanish, Cold Blood, Shadowstep and Premeditation abilities."
      reset_set: [Evasion, Sprint, Vanish, Cold Blood, Shadowstep, Premeditation]
      cooldown: "600000 ms (10 min) — wago SpellCooldowns.RecoveryTime"
    LIVE_3_3_5a:
      source: "azerothcore-wotlk/src/server/scripts/Spells/spell_rogue.cpp:456-511
               (class spell_rog_preparation), bound to POSITIVE id 14185"
      mechanism: >-
        **NOT an id list** — the plan's prose says "it resets by id list", which is wrong. The
        script WALKS the caster's whole spellbook and resets every SPELLFAMILY_ROGUE spell whose
        `SpellFamilyFlags[1] & 0x240` (SPELLFAMILYFLAG1_ROGUE_COLDB_SHADOWSTEP = Cold Blood bit 6
        + Shadowstep bit 9) or `SpellFamilyFlags[0] & 0x860`
        (SPELLFAMILYFLAG_ROGUE_VAN_EVAS_SPRINT = Evasion bit 5 + Sprint bit 6 + Vanish bit 11).
        A Glyph of Preparation branch additionally covers Kick / Dismantle / Blade Flurry.
      reset_set: [Evasion, Sprint, Vanish, Cold Blood, Shadowstep]
      missing_vs_TBC: [Premeditation]
      cooldown: "480000 ms (8 min)"
    VANILLA_CLONE_932983:
      source: "modules/mod-era-talents/src/EraTalentProcScripts.cpp class era_rog_preparation,
               bound to 932983 only"
      mask: "flags[1] & 0x240 | flags[0] & (0x860 | 0x01000000) — the stock set PLUS Blind"
      reset_set: [Evasion, Sprint, Vanish, Cold Blood, Shadowstep, Blind]
      note_shadowstep: "the Shadowstep bit is harmless in Vanilla (no Vanilla rogue has it) —
                        the module comment says so explicitly."
      cooldown: "600000 ms (10 min) — the SAME as TBC"
      client_description: "'...Evasion, Sprint, Vanish, Cold Blood and Shadowstep abilities.'
                           (does NOT name Blind, and does NOT name Premeditation)"
  what_the_sweep_says: >-
    14185 verdict = DIVERGED, and the SOLE differing field across all fourteen families is
    `RecoveryTime TBC600000 -> LIVE480000`. Everything else — the DUMMY effect, attributes,
    category, GCD, class mask, levels — is identical.
  RESOLUTION:
    disposition: "FRESH CLONE in the rogue TBC helper slice (947768+)."
    why_not_grant_stock_14185: >-
      Two independent reasons, either sufficient: (1) the cooldown is 8 min live vs TBC's 10 min;
      (2) the core script never resets Premeditation, which TBC's Preparation does — and
      Premeditation IS a node in this tree (20463), so the omission is reachable and visible.
    why_not_reuse_932983: >-
      Its DATA is TBC-equal (see reuse_ledger), but its BEHAVIOUR is not: the bound module script
      resets Blind (a Vanilla-only addition) and not Premeditation. Rebinding or widening
      `era_rog_preparation`'s mask would change what a VANILLA rogue gets, which the plan forbids
      ("Vanilla rogue behavior must stay byte-identical"). Its client Description is also
      Vanilla-authored and would read wrong for TBC, and a 932xxx row must never be modified.
    what_the_clone_needs:
      - "one helper id (947768+), template-cloned from 14185, RecoveryTime 600000"
      - "`client.description` naming the TBC six (lesson 17d — it replaces a stock grant)"
      - "`scriptBindings:` to a NEW module script arm (e.g. `era_rog_preparation_tbc`) whose mask
         is `flags[1] & 0x260 | flags[0] & 0x860` — 0x260 = Cold Blood (0x40) + Shadowstep (0x200)
         + **Premeditation (0x20)**. Do NOT widen the existing Vanilla script's mask."
      - "plan Task 5 Step 2's TBC arm: strip STOCK 14185 for a TBC rogue holding node 20457, and
         strip the Vanilla clone 932983 on an era transition (StripOrphanedGrants already covers
         managed-band rows, so only the STOCK strip is new — lesson 17f)."
  adrenaline_rush:
    node: 20441
    verdict: "DIVERGED — SOLE field `RecoveryTime TBC300000 (5 min) -> LIVE180000 (3 min)`."
    tooltip_confirmation: "cached TBC tooltip 13750.json says '5 min cooldown' and
                           'Increases your Energy regeneration rate by 100% for 15 sec' — the
                           +100%/15 s half is identical live."
    RESOLUTION: "FRESH CLONE (cooldown-only retune). Plan Task 5 Step 2's TBC arm strips stock
                 13750 for a TBC rogue holding node 20441."
  cold_blood:
    node: 20412
    verdict: "LIVE_MATCH on all fourteen families, including RecoveryTime 180000 (3 min), which
              the cached TBC tooltip confirms ('3 min cooldown')."
    RESOLUTION: >-
      **GRANT STOCK 14177**, with a recorded accepted gap: the live spellmod mask drops Shiv
      (bit 29) and adds Fan of Knives. Granting is strongly preferred over cloning because TWO
      by-id core scripts key off 14177 — `spell_rog_cold_blood` (bound to 14177) and
      `spell_rog_mutilate` (which calls `caster->GetAura(SPELL_ROGUE_COLD_BLOOD)` with the
      hardcoded id and then reaches INTO the Cold Blood script instance to decide whether to
      consume the charge). A band clone breaks the Mutilate/Cold Blood charge interaction in a
      way `scriptBindings:` on the clone alone cannot repair, because the hardcoded lookup is on
      the OTHER script. Cloning Cold Blood would require touching the fork. Not worth a
      Shiv-only mask gap.

# =================================================================================================
# VANILLA-HELPER REUSE LEDGER (plan Step 8). Default FRESH; reuse only on all-family equality.
# Comparison method: every one of the ~100 fields in the fourteen families read out of
# acore_world.spell_dbc for the helper and out of the wago 2.5.4 component tables for the TBC
# counterpart, normalised identically. BOTH raw values are printed on any disagreement (lesson 16).
# =================================================================================================
reuse_ledger:
  932983:
    name: "Preparation (Vanilla clone of stock 14185)"
    tbc_counterpart: 14185
    differing_fields: 2
    diffs:
      - "SpellClassSet: helper=8  TBC=0"
      - "SpellClassMask_2: helper=4096  TBC=0"
    caveat: >-
      BOTH "diffs" are an ABSENT wago SpellClassOptions row for 14185, not a real change: the
      LIVE stock 14185 is SpellClassSet 8 / SpellClassMask_2 4096 (word2 bit 12 = Preparation's
      identity bit, per the family8_bit_census), and the era-less Vanilla ref records the same.
      So on DATA the Vanilla clone is TBC-equal.
    VERDICT: "**FRESH** (do not reuse)."
    reason: >-
      Data equality is not sufficient here because Preparation is 100% SCRIPT behaviour and the
      script is bound BY ID. 932983 carries `era_rog_preparation`, whose reset mask includes
      Blind and excludes Premeditation — the exact inverse of TBC. Its client Description is
      Vanilla-authored. Modifying either is forbidden (it would move a shipped Vanilla tree).
      See preparation_resolution.
  "932985, 932986, 932987":
    name: "Hemorrhage r1/r2/r3 (Vanilla clone chain, TrainerId 9, SQL 2026_08_17_12)"
    tbc_counterpart: "16511 / 17347 / 17348"
    differing_fields: "4 / 6 / 6"
    diffs_932985_vs_16511:
      - "Effect_2: helper=80 (ADD_COMBO_POINTS)  TBC=31 (WEAPON_PERCENT_DAMAGE)"
      - "EffectBasePoints_2: helper=0  TBC=109  (i.e. TBC's 110% weapon damage)"
      - "EffectBasePoints_3: helper=2  TBC=12   (the +physical-damage-taken debuff)"
      - "ProcCharges: helper=30  TBC=10"
    diffs_932986_vs_17347: "the same four, plus BaseLevel 30->46 and SpellLevel 30->46"
    diffs_932987_vs_17348: "the same four, plus BaseLevel 30->58 and SpellLevel 30->58"
    VERDICT: "**NO REUSE AND NO CLONE — the question is moot.**"
    reason: >-
      TBC's Hemorrhage chain is LIVE_MATCH on all fourteen families, so node 20459 grants stock
      16511 and the stock trained ranks. The Vanilla clones stay exactly where they are, reachable
      only by a Vanilla rogue holding node 18449. Recorded in full because the plan asked for the
      comparison and because the numbers document HOW different the two eras' Hemorrhage is
      (Vanilla: 30 charges, +2/4/6 flat; TBC: 10 charges, 110% weapon damage, +12/20/28).
  932988:
    name: "Mace Specialization stun payload (Vanilla-authored custom proc)"
    tbc_counterpart: "5530 'Mace Stun Effect'"
    differing_fields: 9
    diffs:
      - "EffectBasePoints_1: helper=-1  TBC=0"
      - "Effect_2: helper=0  TBC=30 (SPELL_EFFECT_ENERGIZE-slot reused as the weapon-skill half)"
      - "EffectBasePoints_2: helper=0  TBC=69 (raw; effective 70)"
      - "EffectDieSides_2: helper=0  TBC=1"
      - "EffectMiscValue_2: helper=0  TBC=1"
      - "ImplicitTargetA_2: helper=0  TBC=1"
      - "ProcChance: helper=0  TBC=101"
      - "AttributesEx: helper=0x0  TBC=0x40088"
      - "DefenseType: helper=0  TBC=1"
    VERDICT: "**FRESH** (do not reuse)."
    reason: >-
      Nine field differences, so the all-or-nothing rule alone settles it. Note WHAT differs: the
      functional half (e1 aura 12 MOD_STUN, DurationIndex 27 = 3 000 ms) is IDENTICAL; the
      differences are TBC 5530's vestigial warrior weapon-skill half plus metadata. A fresh clone
      should carry ONLY the stun half (the weapon-skill half is meaningless on 3.3.5a and is the
      same "TBC encoding dead on this core" trap the Mangle DUMMY lesson names). The TBC talent
      itself also differs from Vanilla's in shape (TBC adds a +1..5% crit-damage half via aura
      163), so the node is authored either way.
  summary: "0 of 5 Vanilla helpers reused. Fresh helper ids required so far: Preparation clone,
            Adrenaline Rush clone, Mace-Spec stun payload — plus whatever Tasks 6-8 allocate for
            the authored payloads listed in node_findings."

