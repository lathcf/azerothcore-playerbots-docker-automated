        TBC covers bit 29 = SHIV; live drops Shiv and adds word1 bit 18 = FAN OF KNIVES (a WotLK
        ability). Fan of Knives is unreachable for a TBC rogue, so the live-only half is harmless;
        the MISSING half (Shiv) is a small, real fidelity loss if stock is granted.
