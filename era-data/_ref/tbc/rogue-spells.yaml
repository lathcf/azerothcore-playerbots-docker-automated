# =================================================================================================
# TRIGGERS — every id the transitive closure added beyond the 198 rank spells, with what it is.
# =================================================================================================
  per_effect_mask_word1_render_caveat: >-
    **READ THIS BEFORE AUTHORING ANY MASK FROM A `survival_map` `tbc:` LINE** (added by Plan Task 6,
    2026-09-03). `method.conventions.tbc_line_is_authoritative` claims the `tbc:` line carries the
    complete per-effect record "incl. effect class masks". For per-effect mask WORD 0 that holds; for
    WORD 1 it does NOT always — the renderer under-reports it on some entries, and three are proven:
    14128 Lethality (`tbc:` renders mask word1 0x0; this section's load_bearing row and
    node_findings[20408] both say TBC 0x6 = the two hidden Mutilate halves), 14177 Cold Blood
    (`tbc:` 0x0 vs load_bearing's TBC 0x10f) and 14179 Relentless Strikes (`tbc:` 0x0, verdict
    LIVE_MATCH with no O-pass diff, while the LIVE row's own word1 is 0x9 — so TBC's must be 0x9
    too). Other entries render word1 correctly (31234 0x10f, 16513 0x18, 13733 e2 0x6), so this is a
    per-entry defect, not a blanket one.
    THE THREE-WAY CROSS-CHECK THAT SETTLES ANY CASE, used for every mask Task 6 authored:
    (1) this section (`effect_class_mask_diffs`) prints BOTH sides for every one of the 24 real
    diffs; (2) where it prints no diff, the LIVE row's mask IS the TBC mask, and the live row can be
    dumped from `azerothcore-wotlk/ip-dbc/Spell.dbc` (columns `EffectSpellClassMask{A,B,C}_{1,2,3}`,
    LETTER = effect index, `_N` = word index — see corrections_to_the_plan_script); (3) the cached
    Wowhead TBC tooltip ENUMERATES the affected spells, so summing their identity bits from `spells:`
    reproduces the mask arithmetically. Worked example: Lethality's tooltip names Sinister Strike +
    Backstab + Gouge + Hemorrhage + Ghostly Strike + Shiv = 0x2600000e exactly, plus Mutilate, whose
    damage rides word1 bits 1|2 = 0x6; the live dump gives word1 0x106 (= 0x6 | Riposte), which is
    precisely the load_bearing row's LIVE value. All three agree; the `tbc:` line alone does not.
