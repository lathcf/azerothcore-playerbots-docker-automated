    Seven of the sixteen spell_script_names rows were NOT on the plan's candidate list:
    spell_rog_cold_blood (14177), spell_rog_mutilate (-1329), spell_rog_setup (-13983),
    spell_rog_rupture (-1943), spell_rog_pickpocket (921), spell_rog_vanish_purge (18461) and
    spell_gen_remove_impairing_auras (30918). The warrior/shaman precedent held.
proc_data_census:
  why: >-
    `spell_proc_event` / `spell_proc` rows define the PROC conditions for six of this tree's
    talents, and every one of them is keyed by the NEGATIVE stock first-rank id. A band clone
    inherits NONE of them and would never proc. This census is NOT in the plan's Step 5 and is
    the rogue analog of the warrior "family outside the diff" lesson.
  rows:
    - { entry: -35541, table: spell_proc_event, detail: "procFlags 8388608 — EXACTLY the TBC ProcTypeMask. The DBC's live value 4 is overridden, so Combat Potency's only divergence is already neutralised on this server." }
    - { entry: -31244, table: "spell_proc_event + spell_proc", detail: "family 8, mask0 0x3E0000 (the five finishers) + mask1 9, procEx 52/11196 — Quick Recovery's 'finishing moves that MISS' condition." }
    - { entry: -31124, table: "spell_proc_event + spell_proc", detail: "Blade Twisting's ability mask. The node is authored anyway, so the authored proc row must be written by the generator." }
    - { entry: -16511, table: spell_proc_event, detail: "an all-zero row for the Hemorrhage chain. Granted stock, so kept for free." }
    - { entry: -14186, table: "spell_proc_event + spell_proc", detail: "Seal Fate — family 8 mask 0x407E0008/0x42000C0E + cooldown 1000/500 ms. Node 20415 grants stock (LIVE_MATCH), kept for free." }
    - { entry: -14156, table: "spell_proc_event + spell_proc", detail: "Ruthlessness — finisher mask. Node 20403 grants stock (LIVE_MATCH), kept for free." }
    - { entry: -14143, table: spell_proc, detail: "Remorseless — the crit-buff consume condition. Node 20401 grants stock, kept for free." }
    - { entry: -13983, table: "spell_proc_event + spell_proc", detail: "Setup — procEx 24 (dodge/resist). A clone MUST get its own row." }
    - { entry: -13960, table: spell_proc, detail: "Sword Specialization — an all-zero row. Node 20435 is AUTHORED (id repurposed), so the authored proc row must be written." }
    - { entry: -13754, table: "spell_proc_event + spell_proc", detail: "Improved Kick — family 8 mask 0x10 (Kick). Node 20430 grants stock (LIVE_MATCH), kept for free." }
    - { entry: -31226, table: spell_proc, detail: "Master Poisoner — family 8 mask1 0x80000 (the DoT-poison proc bit). WotLK-rework-specific; the authored TBC passive is not a proc at all." }
    - { entry: "31221 / 31222 / 31223", table: spell_proc_event, detail: "Master of Subtlety — family 8 mask 0x400200 (Ambush + Stealth), procFlags 1024. POSITIVE ids, one row per rank. Node 20460 grants stock, kept for free." }
