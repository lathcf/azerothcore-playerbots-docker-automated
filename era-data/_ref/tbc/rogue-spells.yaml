# STEALTH-IMPLIED FINDINGS (plan Step 1's seed set — the rogue analog of the warrior stances).
# =================================================================================================
stealth_implied:
  why_seeded: "Master of Subtlety, Initiative, Improved Ambush, Camouflage, Master of Deception,
               Elusiveness, Premeditation and Opportunity all act ON or THROUGH Stealth / Vanish /
               Sap rather than on their own row."
  Stealth 1784, 1785, 1786, 1787:
    verdict: DIVERGED
    diffs: >-
      r1 only: e3 (aura 33 MOD_DECREASE_SPEED) TBC -50 -> LIVE -30, and MaxLevel TBC 19 -> LIVE 0.
      ALL FOUR RANKS: ProcTypeMask TBC 139944 -> LIVE 664232, and AuraInterruptFlags TBC 0x3c06 ->
      LIVE 0x23c04.
    adjudication: >-
      The rank-1 speed difference is real TBC data (Stealth r1 slowed you 50%, later ranks less),
      but Stealth is a BASELINE spell — an era cannot correct a stock id (eras are per-character,
      spells are global). The ProcTypeMask/AuraInterruptFlags drift is WotLK proc-engine
      re-encoding. Camouflage (node 20449) modifies Stealth's speed by SPELLMOD on the
      stealth identity bit, which works against whatever the live base value is.
    disposition: "ACCEPTED GAP — no era action. Recorded so a future sweep does not re-open it."
  Vanish 1856, 1857, 26889 and their self-buff halves 11327, 11329, 26888:
    verdict: DIVERGED
    diffs: >-
      Carriers: `PreventionType TBC0 -> LIVE2` and `CategoryRecoveryTime TBC300000 (5 min) ->
      LIVE180000 (3 min)`. Self-buff halves 11327/11329: TBC carries an e1 aura 16 MOD_STEALTH
      (170/270) plus an e2 aura 31 MOD_INCREASE_SPEED that WotLK DROPPED (live shifts the stealth
      aura into e1 and leaves e2 empty), and AuraInterruptFlags 0x3c07 -> 0x3c04. 26888 adds
      ProcCharges 0 -> 1.
    adjudication: >-
      Vanish is baseline, not talent-granted, so the 5-min-vs-3-min cooldown is an ACCEPTED GAP
      exactly like Stealth. It matters for TWO nodes though: Elusiveness (20454) reduces Vanish's
      cooldown by 45 s in TBC vs 30 s live, and Preparation (20457) resets it — both act by
      spellmod/family-flag on the live spell, so both work regardless.
  Sap 2070, 6770, 11297:
    verdict: DIVERGED
    diffs: "AuraInterruptFlags TBC 0x2 -> LIVE 0x480002 and MaxTargets TBC 1 -> LIVE 0."
    behaviour_check: >-
      **TBC Sap does NOT break the rogue's stealth**, and neither does 3.3.5a Sap: the live spells
      carry ATTR1_ALLOW_WHILE_STEALTHED. The module's `era_rog_sap_stealth` (which restores the
      VANILLA break-stealth behaviour) is gated on `EraTalentBots::EraFor(rogue) == ERA_VANILLA`
      and therefore returns immediately for a TBC rogue. VERIFIED at
      EraTalentProcScripts.cpp:1012. There is no TBC analog of Vanilla's Improved Sap node, and
      the misc-14 DUMMY marker it reads is never minted for a TBC rogue.
    disposition: "NO ACTION. Add the reason as a comment at the Vanilla gate (plan Task 5 Step 3)."
  net: "The stealth seeds produced ZERO era work items and TWO accepted gaps. They were still
        worth sweeping — the Vanish self-buff halves 11327/11329/26888 are reachable only through
        the closure and would otherwise have been invisible."

# =================================================================================================
# BASELINE-LEAK CHECK (plan Step 9). Query: trainer_spell joined against the whole 351-id set.
# =================================================================================================
baseline_leaks:
  method: >-
    `SELECT ts.SpellId, ts.TrainerId, ts.ReqLevel, ts.ReqAbility1 FROM trainer_spell ts WHERE
    ts.SpellId IN (<the 351 ids>)`, plus `playercreateinfo_spell_custom` for classmask 8. The
    trainer-gating INTENT test (framework doc) is applied to every hit: a row is a hole ONLY if a
    TBC-era rogue could obtain a TALENT-GATED spell without the talent.
  result: "**NO LEAKS. Zero rows required a gate.**"
  detail:
    talent_granted_actives_have_no_trainer_row: >-
      Not one of 1329 (Mutilate), 16511 (Hemorrhage), 14185 (Preparation), 13750 (Adrenaline
      Rush), 14177 (Cold Blood), 13877 (Blade Flurry), 14251 (Riposte), 14278 (Ghostly Strike),
      14183 (Premeditation), 36554 (Shadowstep), 32601 (Surprise Attacks) or 31228-30 (Cheat
      Death) has a `trainer_spell` row or a `playercreateinfo_spell_custom` row. Every one is
      talent-only in 3.3.5a exactly as in TBC.
    trained_ranks_are_correctly_chained: >-
      The 38 trainer rows that DO exist are all baseline abilities (Backstab, Gouge, Garrote,
      Sap, Stealth, Vanish, Blind, Sprint, Evasion, Kick, Pick Pocket, Pick Lock, Feint, Rupture,
      Slice and Dice, Expose Armor, Ambush, Cheap Shot, Kidney Shot) plus the Mutilate and
      Hemorrhage rank chains — and every rank-2+ row carries `ReqAbility1` pointing at the
      previous rank, which for both chains terminates at the TALENT-granted rank 1. A TBC rogue
      without the talent cannot buy rank 2. Correct as shipped; no DELETE proposed, so the
      orphaned-higher-rank check is not triggered.
    wotlk_only_ranks_are_level_gated: >-
      Hemorrhage r5 48660 (ReqLevel 80), Mutilate r5 48663 (75) and r6 48666 (80) are reachable
      only above the TBC level cap. mod-individual-progression caps a TBC-stage character at 70,
      and `EraTalentBots::EraFor` puts any bot at level 71+ into the WotLK band, so neither the
      player path nor the bot path can reach them while era-TBC. No gate needed; recorded so the
      reasoning is on file rather than re-derived.
    kBaselineSpellGates: "No rogue row is needed. The table stays warrior-only."

