    Node 20419 needs it: TBC's finisher mask is (0x3e0000, 0x9, 0), but Eviscerate, Envenom and
    Deadly Throw each also carry the shared word-0 bit 23 ("offensive ability", 88 spells), so the
    `affects:` identity OR is (0xbe0000, 0x9, 0) and SpellInfo::IsAffected — true on ANY nonzero
    word intersection — would arm the buff off Sinister Strike / Backstab / Ambush / Hemorrhage /
