# Weapon-subclass bitmasks for `equipClass`/`equipSubclass` gates (ITEM_CLASS_WEAPON = 2).
# Transcribed verbatim from the era-less ref (era-neutral: these are ItemSubClassWeapon bit
# positions from azerothcore-wotlk/src/server/game/Entities/Item/ItemTemplate.h, not spell data).
# TBC's own SpellEquippedItems rows for the rogue weapon specs confirm them:
#   Dagger Spec 13706 sub 0x8000 = 32768; Sword Spec 13960 sub 0x80 = 128;
#   Mace Spec 13709 sub 0x30 = 48; Fist Spec 13707 sub 0x2000 = 8192.
weaponSubclassMasks:
  equipClass: 2
  sword1h: 128       # 1 << 7
  sword2h: 256       # 1 << 8
  swordSpecMask: 128 # TBC rogue Sword Specialization is ONE-HAND SWORD ONLY (0x80). NOTE: this is
                     # NARROWER than the Vanilla ref's `swordSpecMask: 384` — see accepted_gaps and
                     # node_findings 20435. The LIVE (WotLK "Hack and Slash") value is 0x81 = sword1h|axe1h.
  mace1h: 16         # 1 << 4
  mace2h: 32         # 1 << 5
  maceSpecMask: 16   # mace1h ONLY. **CORRECTED at Plan Task 7 (2026-09-03).** This row used to read
                     # `48  # mace1h | mace2h — TBC Mace Spec 13709 EquippedItemSubclass 0x30,
                     # unchanged live`, transcribed from the era-less VANILLA ref (Vanilla's Mace
                     # Spec really did cover 2H maces). BOTH raw values measured, per lesson 16: the
                     # survival_map `tbc:` lines for 13709/13800-13803 all read `equipSub=16`, and a
                     # live DBC dump of 13709/13800/13803 reads 16 — i.e. 0x10 on BOTH sides, not
                     # 0x30 on either. Inert for a rogue either way (no 2H proficiency); 16 is the
                     # value node 20433's helpers 947779-947783 ship.
  dagger: 32768      # 1 << 15 — TBC Dagger Spec 13706 sub 0x8000; LIVE ("Close Quarters Combat") 0xa000 = dagger|fist
  fist: 8192         # 1 << 13 — TBC Fist Weapon Spec 13707 sub 0x2000 (talent absent from 3.3.5a)
  meleeWeaponMask: 173555   # 0x2a5f3 — the "Requires Melee Weapon" set (Hemorrhage/Ghostly Strike/
                            # Riposte/Blade Twisting carry it on both sides)
  precisionMask_tbc: 368796 # 0x5a09c — TBC Precision 13705 EquippedItemSubclass; LIVE is 0x5a09d
                            # (WotLK added bit 0 = one-hand axe). See node_findings 20426.

method:

  # =============================================================================================
  # READ THESE CONVENTIONS BEFORE USING ANY NUMBER IN THIS FILE.
  # =============================================================================================
  conventions:

    effect_slot_numbering: >-
      THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/Effect_2/Effect_3,
      i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is DBC
      slot 1. Wherever a core-source token appears (script_census) it is written
      `EFFECT_n (0-based core enum; = this map's e<n+1>)`. Never translate one to the other by name.

    magnitudes_are_effective: >-
      EVERY magnitude in this file (`val<N>` in a `tbc:` line, and both sides of every `detail:`
      effect tuple) is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides == 1` and
      `basePoints` when DieSides is 0 (SpellEffectInfo::CalcBaseValue). Both sides of every
      comparison are normalised the same way before diffing, so a clone or live row that moved the
      +1 into DieSides does not read as a divergence. Raw figures, where quoted, say "raw".

    energy_is_manacost_1to1: >-
      Rogue energy costs ride the `ManaCost` column (wago SpellPower.ManaCost) at face value, NOT
      the x10 scaling warrior rage uses. Anchors re-measured on this id set: Mutilate 1329
      ManaCost 60 (= 60 energy, matching the TBC tooltip), Hemorrhage 16511 = 35, Shadowstep
      36554 = 10, Blade Flurry 13877 = 25. `PowerType` is 3 (POWER_ENERGY) on both sides for every
      energy ability in the set — the sweep compares ManaCost/ManaCostPct and found ZERO
      divergences across all 351 ids, which is a real finding, not a missing column (verified by
      hand against six anchors).

    verdict_vocabulary: >-
      LIVE_MATCH = every compared field in the fourteen verdict families agrees. DIVERGED = at
      least one compared field differs. WAGO_ONLY = present in TBC 2.5.4, ABSENT from the live
      3.3.5a store (Spell.dbc AND the acore_world.spell_dbc overlay) — must be authored, never
      granted. LIVE_ONLY = present live, absent from TBC — must not be reachable by a TBC rogue.
      A LIVE_MATCH verdict does NOT mean "safe to grant": the supplementary per-effect class-mask
      pass (family O) is deliberately excluded from the verdict and found FOUR load-bearing
      divergences on otherwise-LIVE_MATCH spells (Cold Blood 14177, Lethality 14128-137, Surprise
      Attacks 32601, and the Find Weakness buffs). Read `effect_class_mask_diffs:` before granting.

    tbc_line_is_authoritative: >-
      Every survival_map entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record an author
      needs to reproduce the spell (per-effect tuple incl. effect class masks and implicit targets,
      plus duration/proc/power/cooldown/category/mechanic/preventionType/aura-restriction/
      shapeshift/equip/level/family/ownMask and every non-zero attribute word). Tasks 6-8 author
      FROM THIS LINE; they do not need to re-fetch wago. Where a field is absent from the line it
      is zero in TBC. LIVE_ONLY entries carry no `tbc:` line by construction.
      **ONE KNOWN EXCEPTION, and it is a MISSING ROW rather than a zero:** wago 2.5.4 has no
      SpellClassOptions row for **14185 Preparation**, so its `tbc:` line shows no `family=` and no
      `ownMask=`. The live spell is SpellClassSet 8 / SpellClassMask_2 4096 (word1 bit 12), the
      Vanilla clone 932983 carries the same, and any TBC clone MUST carry it too — a family-0
      Preparation would be unreachable by its own reset script and by Improved Sprint-style
      family walks. Exactly THREE TBC-present ids in the 351 have no wago SpellClassOptions row
      while the LIVE spell is family 8 — **1804 Pick Lock, 14185 Preparation, 14983 Vigor** (plus
      the 21 LIVE_ONLY WotLK ids, where the absence is expected). Only 14185 is cloned, so only
      it matters; Pick Lock is baseline and Vigor is granted stock. Every OTHER `family=`-less
      line is a genuinely family-0 spell (the shared payloads 14157 / 14189 / 15250 / 16459 /
      13977 / 5530).

  live_dbc:
    source: /azerothcore/env/dist/data/dbc/Spell.dbc inside the running ac-worldserver
    md5: 49c9c5f53e8974c27d67635384725f46
    live_verified: >-
      The worldserver's DBC, the warrior phase's copy and the repo's azerothcore-wotlk/ip-dbc/
      Spell.dbc all return the IDENTICAL md5 (49c9c5f53e8974c27d67635384725f46, 53466210 bytes) —
      NO client/server generation mismatch, so the sweep's live side is the store the worldserver
      actually runs. Plan Step 3's `docker cp` fails on this image ("read-only file system"); the
      working extraction is `docker exec ac-worldserver cat <path> > out`.
  db_overlay: >-
    The DBC on disk is not the whole live store: acore_world.spell_dbc (7218 rows) REPLACES records
    at load. Two ids in this map are covered by it and by nothing else — 18461 ("Vanish", the
    purge-dummy the core's spell_rog_vanish_purge is bound to) and 45176 (the Master Poisoner
    trigger payload live 31226/31227 fire) — both absent from the 3.3.5a DBC AND from wago 2.5.4,
    i.e. AzerothCore-supplied. The sweep takes `spell_dbc` membership as live presence, so neither
    is mis-verdicted WAGO_ONLY.
  tbc_source: >-
    wago 2.5.4.44833 — SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellClassOptions,
    SpellCategories, SpellCooldowns, SpellAuraRestrictions, SpellShapeshift, SpellLevels,
    SpellEquippedItems, SpellInterrupts, SpellTargetRestrictions, SpellName (the fourteen the plan
    lists) plus Spell, SpellDuration, SpellRange, SpellCastTimes for decoding indices. Headers were
    printed and verified before use. Tooltips cached under era-data/_ref/tbc/tooltips/<id>.json
    (32 further ids fetched this task from https://nether.wowhead.com/tbc/tooltip/spell/<id>).

  # ---------------------------------------------------------------------------------------------
  # COLUMN LIST ACTUALLY COMPARED — the fourteen verdict families + one supplementary.
  # Workflow lesson 11: "everything matches" means suspect the column list. It fired twice on this
  # id set — see `corrections_to_the_plan_script.effect_class_mask_column_mapping`.
  # ---------------------------------------------------------------------------------------------
  families_compared_pointer: "MOVED to the TOP-LEVEL `families_compared:` key (the plan's
    required key name). Read it there."
  corrections_to_the_plan_script:
    live_column_names: >-
      As the warrior file records, `tools/spell_dbc_columns.txt` spells the spell's OWN identity
      words `SpellClassMask_1/_2/_3` (1-based) — there is no `SpellClassMaskA`. wago
      `SpellClassMask_0` (word 0) maps to live `SpellClassMask_1`. Verified again here.
    effect_class_mask_column_mapping: >-
      **NEW CORRECTION, and a live instance of lesson 11.** The live column names
      `EffectSpellClassMaskA_1/A_2/A_3/B_1/.../C_3` read as if A/B/C were the three WORDS and
      _1/_2/_3 the three EFFECTS. They are the OTHER WAY ROUND: **A/B/C = the EFFECT index and
      _1/_2/_3 = the WORD index**, i.e. effect 1's three mask words are
      (EffectSpellClassMaskA_1, EffectSpellClassMaskA_2, EffectSpellClassMaskA_3). The first
      supplementary pass used the intuitive-but-wrong mapping and reported 85 "divergences",
      including fabricated ones on Sleight of Hand, Sinister Calling and Shadowstep. Authorities
      that settle it: `tools/gen_era_talents.py:818` writes a clone's EFFECT_0 mask as
      `EffectSpellClassMaskA_1: a, A_2: b, A_3: c`, and `tools/era_audit.py:315` names
      "EFFECT_0's SpellClassMask word 1" as `EffectSpellClassMaskA_2`. Independent data anchor:
      stock Improved Poisons 21881, whose TBC effect-1 mask is (0x1001e000, 0x10, 0) and whose
      live A_1/A_2/A_3 are exactly 0x1001e000 / 0x10 / 0. With the corrected mapping the pass
      returns 24 real diffs. The main verdict sweep never touched these columns, so no verdict
      was affected.
    base_points_convention: >-
      Carried over unchanged from the shaman/warrior refs and re-verified on this id set: wago
      2.5.4 stores EffectBasePoints in the SAME raw (value-1) convention as the 3.3.5a DBC, so the
      comparison normalises BOTH sides to the effective value. Anchor re-measured here: TBC
      Mutilate 1329 e1 raw 1 / DieSides 1 = effective 2 combo points, matching the tooltip
      "Awards 2 combo points"; TBC Vile Poisons 16513 e1 raw 3 / DieSides 1 = 4%, matching the
      cached TBC tooltip "increases the damage dealt by your poisons ... by 4%".
    float_columns: >-
      Speed, EffectRealPointsPerLevel_N, EffectMultipleValue_N, EffectPointsPerCombo_N,
      EffectChainAmplitude_N and EffectDamageMultiplier_N are unpacked as FLOATS and rounded to
      4 dp. This is load-bearing for exactly one node here: Serrated Blades 14171-73, whose TBC
      armor-penetration half is carried ENTIRELY in EffectRealPointsPerLevel
      (-2.67 / -5.34 / -8.0 with base points 0). An int32 unpack reports those as
      -1075539968-style garbage and hides the whole mechanic.

  noise_filters_applied:
    - "DurationIndex disagreement confined to {0, 21} (both mean permanent) on a passive.
       ZERO entries in this id set were filtered by it."
    - "A live slot with NO wago SpellEffect row is reported as `unverified_slots:`, never as a
       divergence (DB2 stores no empty-effect row, so an absent row is not evidence of a zero).
       ZERO entries hit this filter on the rogue set."
    - "A missing wago SpellAuraOptions row opposite the live 'not a proc' default
       (ProcChance 101 or 0 / charges 0 / mask 0 / stack 0). Where TBC has no row and LIVE really
       IS a proc, the difference IS printed (`ProcRow TBC(no SpellAuraOptions row)->LIVE ...`) —
       Crippling Poison payloads 3409/11201 are the two hits."
    - "NOTHING in the attribute words is filtered. All eight are compared verbatim; every
       difference is hand-adjudicated in `attribute_divergences:` with the AzerothCore bit name."
    - "Per-effect class masks are excluded from the VERDICT only (families_compared.O); all 24
       differences are recorded in full under `effect_class_mask_diffs:`."
    - "A wago table with NO row for a spell is treated as ABSENCE, not zero, only for SpellEffect
       and SpellAuraOptions. For SpellClassOptions the SWEEP skips the comparison entirely when the
       row is missing (so family F never fires a false positive), but the REUSE LEDGER compares
