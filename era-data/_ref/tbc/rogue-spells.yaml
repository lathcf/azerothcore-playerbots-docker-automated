poison_chains:
  how_the_chain_works: >-
    item_template.spellid_1 -> the APPLY spell (SPELL_EFFECT_ENCHANT_ITEM_TEMPORARY = 54, whose
    EffectMiscValue_1 is the SpellItemEnchantment id) -> the enchant row (Effect_1 = 1 =
    ITEM_ENCHANTMENT_TYPE_COMBAT_SPELL, EffectArg_1 = the PAYLOAD spell, EffectPointsMin_1 = the
    flat proc chance) -> the payload spell that lands on the target. NO talent row references any
    link in this chain, which is why no closure reaches it.
  where_the_proc_chance_actually_comes_from: >-
    Player::CastItemCombatSpell (Player.cpp:7545-7561): `chance = pEnchant->amount[s]` (the
    enchant's EffectPointsMin) UNLESS acore_world.spell_enchant_proc_data has a row for the
    enchant id, in which case PPMChance (converted by Unit::GetPPMProcChance) or customChance
    wins. **The APPLY SPELL's own ProcChance field is NEVER read on this path.** That makes the
    Wound Poison apply-spell divergence (`ProcChance TBC30 -> LIVE50` on 13219/13225/13226/13227/
    27188) and the Anesthetic one (`TBC20 -> LIVE50` on 26785) INERT for the enchant path — do not
    "fix" them.
  spellmods_are_applied_to_the_PAYLOAD_id: >-
    Player.cpp:7556 — `ApplySpellMod(pEnchant->spellid[s], SPELLMOD_CHANCE_OF_SUCCESS, chance)`.
    The mod is matched against the PAYLOAD spell's own family mask, and every payload carries the
    same family-8 identity bit as its apply spell (verified id-by-id below). So a TBC-encoded
    Improved Poisons (SPELLMOD_CHANCE_OF_SUCCESS, mask covering all six poisons) WORKS on this
    core unchanged. Vile Poisons' SPELLMOD_DAMAGE / SPELLMOD_DOT / SPELLMOD_RESIST_DISPEL_CHANCE
    likewise bind at payload cast time. **No enchant re-point and no payload clone is required —
    this is NOT a Flametongue case.**
