# TBC (2.4.3) ROGUE stock-spell reference — the LIVE-VERIFIED fourteen-family survival map, poison
# enchant-proc chain map, script/proc-data census, capstone + trained-rank chain resolution,
# Preparation reset-list resolution, Vanilla-helper reuse ledger, stealth-implied findings and
# baseline-leak list for Plan Task 3 of
# docs/superpowers/plans/2026-09-02-era-talents-tbc-phase5-rogue.md.
#
# Era-scoped. The era-less `era-data/_ref/rogue-spells.yaml` is VANILLA-verified (1.12.1 vs 3.3.5a);
# its MAGNITUDES must not be inherited. Its family-8 IDENTITY-MASK table (`spells:`) and its
# `weaponSubclassMasks:` block ARE era-neutral (they describe the LIVE 3.3.5a store, which both eras
# share) — they are TRANSCRIBED VERBATIM below (and re-verified) because the GENERATOR resolves an
# `affects: ["Backstab"]` in era-data/tbc/rogue.yaml against the `spells:` key of the `_ref` the
# DATASET embeds, i.e. against THIS file. A human-readable "see the other file" is not enough.
#
# Class 4, spell family 8 (SPELLFAMILY_ROGUE). era_audit.py's family guard covers family 8
# (tools/era_audit.py:453 `_TRANSCRIBED_SWEEP_FAMILIES`) — a wrong `family:` is a dataset bug,
# never an audit bug. Rogue ENERGY costs ride the `ManaCost` column (wago SpellPower.ManaCost),
# stored 1:1 (NOT x10 like warrior rage — verified: Mutilate 1329 ManaCost 60 == 60 energy).
#
# Produced by Plan Task 3, 2026-09-02. Authority chain: wago 2.5.4.44833 component tables for TBC
# structure+magnitudes, the cached Wowhead TBC tooltips for behaviour the tables cannot express,
# the LIVE 3.3.5a server (Spell.dbc + acore_world.spell_dbc overlay + the enchant/proc/trainer/
# script tables) for what this core actually has. Where this file and the spec's §3 buckets
# disagree, THIS FILE WINS — see `spec_bucket_contradictions:`.

era: 1
class: 4
family: 8
familyName: 8

# The FOURTEEN verdict families + one supplementary — the standing sweep column list.
families_compared:
  A_effects: >-
    per slot: Effect, EffectAura, EFFECTIVE base points, EffectMiscValue_0, EffectMiscValue_1(B),
    EffectTriggerSpell, EffectAuraPeriod, EffectRadiusIndex_0, EffectMechanic, EffectChainTargets,
    EffectRealPointsPerLevel (float, 4 dp), ImplicitTarget_0(A), ImplicitTarget_1(B).
  B_proc_options: ProcChance, ProcCharges, ProcTypeMask, CumulativeAura (wago SpellAuraOptions).
  C_misc: >-
    DurationIndex, CastingTimeIndex, RangeIndex, SchoolMask, Speed (float), and ALL EIGHT
    attribute words (wago SpellMisc.Attributes_0..7 vs live Attributes/AttributesEx..Ex7).
  D_categories: Category, DefenseType, DispelType, Mechanic, PreventionType, StartRecoveryCategory.
  E_power: ManaCost, ManaCostPct (wago SpellPower OrderIndex 0). Rogue energy rides ManaCost 1:1.
  F_class_options: SpellClassSet and the spell's OWN identity mask WORD 0 only (words 1-3 excluded
    as cross-build encoding noise, per the shaman A.12 / warrior precedent).
  G_cooldowns: >-
    RecoveryTime, CategoryRecoveryTime, StartRecoveryTime (wago SpellCooldowns). This family
    alone is what flipped Adrenaline Rush 13750 (TBC 5 min -> live 3 min), Preparation 14185
    (TBC 10 min -> live 8 min) and Premeditation 14183 (TBC 2 min -> live 20 s) to DIVERGED —
    every one of them is byte-identical in family A.
  H_aura_restrictions: >-
    CasterAuraState, TargetAuraState, ExcludeCasterAuraState, ExcludeTargetAuraState,
    CasterAuraSpell, TargetAuraSpell, ExcludeCasterAuraSpell, ExcludeTargetAuraSpell.
    It is what found Shadowstep 36554's live `ExcludeTargetAuraSpell 65219`.
  I_shapeshift: >-
    ShapeshiftMask, ShapeshiftExclude. Rogue has no stance system, so this is mostly the
    "usable while stealthed / not usable while shapeshifted" exclude word; one hit in this set
    (Kick - Silenced 18425, TBC ShapeshiftMask 0x8000000 -> live 0).
  J_levels: BaseLevel, MaxLevel, SpellLevel. It is what confirmed the Mutilate (50/60/70) and
    Hemorrhage (46/58/70) trained-rank levels independently of the trainer table.
  K_equipped_item: >-
    EquippedItemClass, EquippedItemSubclass, EquippedItemInvTypes — the weapon-spec + "requires
    dagger"/"requires melee weapon" surface. It is what found Dagger Spec (TBC 0x8000 -> live
    0xa000), Sword Spec (0x80 -> 0x81) and Precision (0x5a09c -> 0x5a09d).
  L_interrupts: InterruptFlags, AuraInterruptFlags, ChannelInterruptFlags. It is what found the
    Stealth/Sap/Blind AuraInterruptFlags drift (see `stealth_implied:`).
  M_targets: Targets, TargetCreatureType, MaxTargets. It found Sap's `MaxTargets 1 -> 0`.
  N_identity: >-
    wago SpellName.Name_lang vs the live DBC Name_Lang_enUS — the ID-REPURPOSING detector.
    TWENTY-ONE ids in this set are renamed live; the two that matter are Dagger Specialization
    13706-13807 -> "Close Quarters Combat" and Sword Specialization 13960-13964 -> "Hack and
    Slash". Nothing else in the sweep would have flagged them as hazards. See `id_repurposing:`.
  O_effect_class_masks: >-
    Per-effect EffectSpellClassMask words 0/1/2, compared as a SUPPLEMENTARY pass whose result is
    recorded in `effect_class_mask_diffs:` and deliberately does NOT feed the verdict. FOUR of
    its 24 hits are load-bearing rather than encoding drift — read that section before granting
    any LIVE_MATCH spellmod.


