script_census:
  method: >-
    `SELECT spell_id, ScriptName FROM spell_script_names WHERE ABS(spell_id) IN (<the 351 ids>)`
    on the live acore_world, plus the SAME query against `spell_proc_event` and `spell_proc` —
    which the plan's step did not ask for and which turns out to carry the real proc definitions
    for six of these talents (lesson 11: the family outside the diff).
  spell_script_names:
    - { spell_id: 13877,  script: spell_rog_blade_flurry,        disposition: "node 20434 grants stock 13877 (LIVE_MATCH) — script kept for free." }
    - { spell_id: -31228, script: spell_rog_cheat_death,         disposition: "node 20464 grants stock 31228-30 (ALL THREE LIVE_MATCH) — script kept for free. NO rebind needed; this REFUTES the spec's §3a expectation." }
    - { spell_id: 14177,  script: spell_rog_cold_blood,          disposition: "node 20412 — if the O-pass Shiv-mask gap is accepted, grant stock and keep the script; if cloned, `scriptBindings: [spell_rog_cold_blood]` is MANDATORY (bound by POSITIVE id)." }
    - { spell_id: -35541, script: spell_rog_combat_potency,      disposition: "node 20443 — the talent DIVERGES only on ProcTypeMask, and spell_proc_event(-35541) already overrides that field with the TBC value 8388608. See proc_data_census. Grant stock; script kept." }
    - { spell_id: -2818,  script: spell_rog_deadly_poison,       disposition: "poison payload chain — never cloned. Untouched." }
    - { spell_id: 31666,  script: spell_rog_master_of_subtlety,  disposition: "the stealth-buff TRACKER (C++ class spell_rog_stealth_buff_tracker<31665>). Node 20460 grants stock 31221-23 (LIVE_MATCH), so the tracker chain is untouched." }
    - { spell_id: -1329,  script: spell_rog_mutilate,            disposition: "node 20420 grants stock 1329 + the stock trained ranks — script kept for free. The script reads Cold Blood (14177) off the caster; if 20412 clones Cold Blood, THIS script stops seeing it (it checks `GetAura(SPELL_ROGUE_COLD_BLOOD)` by hardcoded id 14177). CROSS-NODE HAZARD — record on both nodes." }
    - { spell_id: -31130, script: spell_rog_nerves_of_steel,     disposition: "node 20442 is AUTHORED (WotLK reworked the talent) — the authored passive is pure aura data (MOD_MECHANIC_RESISTANCE), needs no script." }
    - { spell_id: 921,    script: spell_rog_pickpocket,          disposition: "baseline, untouched." }
    - { spell_id: 14185,  script: spell_rog_preparation,         disposition: "node 20457 CLONES Preparation (cooldown + reset list both differ) — the clone loses this script and needs a TBC-armed module script. See preparation_resolution." }
    - { spell_id: -31244, script: spell_rog_quick_recovery,      disposition: "node 20414 grants stock 31244/31245 (BOTH LIVE_MATCH) — script kept for free." }
    - { spell_id: -1943,  script: spell_rog_rupture,             disposition: "baseline finisher, untouched." }
    - { spell_id: -13983, script: spell_rog_setup,               disposition: "node 20453 diverges on ProcChance ONLY (15/30/45 vs 33/66/100). If cloned, `scriptBindings: [spell_rog_setup]` is mandatory — the script is what restricts the proc to the SELECTED target." }
    - { spell_id: -1856,  script: spell_rog_vanish,              disposition: "baseline, untouched." }
    - { spell_id: 18461,  script: spell_rog_vanish_purge,        disposition: "AzerothCore-added dummy, untouched." }
    - { spell_id: 30918,  script: spell_gen_remove_impairing_auras, disposition: "Improved Sprint payload. Node 20429 grants stock 13743/13875 (LIVE_MATCH) — kept for free." }
  module_scripts_own_by_this_repo:
    era_rog_preparation:
      bound_to: "932983 ONLY (the Vanilla Preparation clone)"
      tbc_status: "INERT for TBC by construction — a TBC rogue never holds 932983."
      tbc_arm_needed: >-
        YES if node 20457 clones Preparation, which the resolution below recommends. The Vanilla
        script's reset mask is `flags[1] & 0x240 | flags[0] & (0x860 | 0x01000000)` — i.e. Cold
        Blood/Shadowstep/Vanish/Evasion/Sprint **plus BLIND**. TBC resets Premeditation
        (flags[1] bit 5 = 0x20) and does NOT reset Blind. A TBC arm must therefore be a SEPARATE
        binding with mask `flags[1] & 0x260 | flags[0] & 0x860`, not a widened shared mask —
        widening would silently give the Vanilla clone a Premeditation reset it must not have.
    era_rog_sap_stealth:
      bound_to: "the STOCK Sap ranks 2070 / 6770 / 11297 / 51724"
      tbc_status: >-
        INERT for TBC and VERIFIED so. `HandleAfterCast` returns immediately unless
        `EraTalentBots::EraFor(rogue) == ERA_VANILLA` (EraTalentProcScripts.cpp:1012). A TBC-era
        rogue therefore keeps the 3.3.5a behaviour, which IS the TBC behaviour: Sap carries
        ATTR1_ALLOW_WHILE_STEALTHED and does not break stealth.
      tbc_arm_needed: "NO. Record the reason as a comment at the Vanilla gate (plan Task 5 Step 3)."
  predicted_but_ABSENT:
    spell_rog_shiv: "bound to 5938 (the Shiv ABILITY), which is not a talent and is not in the
                     tree's id set. Its payload 5940 has no script binding."
