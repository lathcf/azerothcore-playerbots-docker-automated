  "932408/932409/932410":
    what: "Ancestral Healing - the +8/16/25% armor buff the heal-crit proc triggers"
    node: 20244
    verdict: FRESH
    added_in: fix round (the review's C3; the spec never named this candidate)
    evidence: >-
      Live clones 932408/932409/932410 vs wago 2.5.4 16177/16236/16237, field by field:
      MAGNITUDE - clone e1 raw basePoints 8/16/25, DieSides 0 = EFFECTIVE +8/+16/+25%;
      TBC raw 7/15/24, DieSides 1 = EFFECTIVE +8/+16/+25%. EQUAL, and this is what makes the
      candidate look reusable at a glance.
      MISC - 1 (physical school = armor) on both. EQUAL.
      DURATION - DurationIndex 8 = 15000 ms on both. EQUAL.
      RANGE - RangeIndex 1 on both. EQUAL.
      COOLDOWN / MANA - 0 on both. EQUAL.
      **AURA - NOT EQUAL, and it is material.** The clone uses aura 142
      SPELL_AURA_MOD_BASE_RESISTANCE_PCT; TBC uses aura 101 SPELL_AURA_MOD_RESISTANCE_PCT.
      In 3.3.5a these are different handlers with different reach:
      142 -> `AuraEffect::HandleAuraModBaseResistancePCT` (SpellAuraEffects.cpp:4136) applies a
      **BASE_PCT** modifier, which scales only the BASE armor term;
      101 -> `AuraEffect::HandleModResistancePercent` (SpellAuraEffects.cpp:4157) applies a
      **TOTAL_PCT** modifier, which scales the whole armor total INCLUDING item armor.
      On a geared level-70 shaman item armor dominates, so +25% BASE_PCT and +25% TOTAL_PCT are
      not remotely the same buff. Both handlers are fully implemented in 3.3.5a, so the spec §2
      "keep the live 3.3.5a carrier" doctrine that sanctions 932411's aura-283 substitution does NOT
      apply here:
      a literal TBC aura-101 clone works, and is what fidelity requires.
      ATTRIBUTES - EQUAL, swept in the second fix round: clones 932408/932409/932410 and wago
      16177/16236/16237 are all `Attributes_0..7 = 0`. The attribute family is the one place this
      candidate agrees; the verdict rests entirely on the aura, above.
      SECONDARY DIFFERENCES (recorded, not decisive on their own) - SchoolMask clone 0 vs TBC 2;
      ProcChance/ProcTypeMask clone 0/0 vs TBC 100/4 (inert on a triggered buff, but live
      16177 carries 100/4 too, so the clone is the odd one out).
      CONCLUSION: mint FRESH 946512+ clones for node 20244, aura 101 misc 1 at EFFECTIVE
      +8/+16/+25%, DurationIndex 8, and re-point the three aura-42 proc passives at them.
      This is the same failure mode that flipped 932413: the effects "match" until the carrier
      and the non-effect fields are actually read.
    node_side: >-
      The proc passives 16176/16235/16240 are LIVE_MATCH and can be granted or authored
      unchanged apart from their EffectTriggerSpell, which must point at the new clones.

  "932400-932404":
    what: "Flurry - the 5-rank +10/15/20/25/30% melee-haste buff chain"
    node: 20229
    verdict: FRESH
    verdict_history: >-
      Called REUSE in the first fix round on the strength of an evidence line that read
      "ATTRIBUTES - 0 on both. EQUAL." That line was FALSE and is corrected below. Flipped to
      FRESH in the second fix round. The magnitude / proc-field / duration / school / range
