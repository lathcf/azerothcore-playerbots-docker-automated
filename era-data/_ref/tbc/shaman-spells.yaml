      era = allow" is already correct and PERMANENTLY so. The Vanilla arm below it gates on the
      talent clone 932406 (node 18822), which stays Vanilla-only. Not edited.

  how_the_orphan_check_works:
    band: "EraTalents::ERA_CUSTOM_BAND_LOW=920000 .. ERA_CUSTOM_BAND_HIGH=950000 (EraTalents.h:12-13) - so BOTH the 932xxx and the 946xxx TBC bands are in scope."
    loop: >-
      EraTalentsCommand.cpp walks t->GetSpellMap(), keeps in-band ids that HasSpell() reports
      active, runs a ladder of explicit per-spell predicates, and anything not claimed by one
      falls through to a generic check: for each node in NodesFor(era, class), if the node's
      CURRENT rank's rankSpell == id then granted. Not granted -> "ORPHAN ERA SPELL".
    consequence: >-
      CONFIRMED (this was the claim to verify): a NODE-granted spell needs no explicit predicate -
      the generic NodesFor() fallback resolves it. An explicit predicate is required ONLY for a
      spell the doctor can see in the spell map that no node grants, i.e. TRAINER-taught or
      RECONCILE-granted. This is exactly why the shipped ladder covers 932507-932511 (Vanilla NG
      trainer chain), 946270-946275 (TBC NG), 932416-era paladin markers, etc.
    corollary: >-
      A proc-TRIGGERED buff is never in the spell map at all and can never orphan. That disposes
      of the whole Vanilla shaman helper sub-band 932400-932404 (Flurry haste buffs),
      932408-932410 (Ancestral Healing armor buffs), 932411 (Healing Way stacking buff) and
      932415 (Clearcasting): all are `trigger:` targets in era-data/vanilla/shaman.yaml, learned
      by nobody. No predicate is needed or possible for them.

  existing_shaman_predicates: >-
    THERE ARE NONE. EraTalentsCommand.cpp contains zero CLASS_SHAMAN predicates - the ladder is
    warlock (932930/932950), paladin (932749/932634-932753/946000-946086/932668-932670/932746)
    and druid (932513/932507-932511/946270-946275/946258-946265) only. So Task 5's original
    premise - "widen an existing Vanilla-only shaman predicate to Vanilla-or-TBC" - had no
    subject even before Amendment A.9 sent all four reuse candidates FRESH. Nothing to widen.

  node_granted_shaman_spells_verified:
    method: "SELECT DISTINCT r.grantedSpellId FROM era_talent_rank r JOIN era_talent t ON t.id=r.talentId WHERE t.eraId=? AND t.classId=7"
    vanilla_in_931_932_band: [932405, 932406, 932407, 932412, 932413]
    tbc: "(none) - 61 nodes, zero grantedSpellId > 0. The dataset is still the all-display_only seed."
    note: >-
      932413 Elemental Mastery IS node-granted in Vanilla, so it resolves through the generic
      fallback there. Since Amendment A.9 made TBC's Elemental Mastery a FRESH clone, a TBC
      shaman must not hold 932413 - and if one ever does, the generic check correctly reports it
      as an orphan with no predicate needed. Same for 932411/932400-404 (never learned at all).

  fresh_band_946512_946611:
    verdict: "NO predicate needed now. Defer the one that will be needed to Task 8."
    reasoning: >-
      Tasks 6-8 grant this band by NODE, and node grants resolve through the generic
      NodesFor(ERA_TBC, CLASS_SHAMAN) fallback (see how_the_orphan_check_works). The ONE
      exception is the Earth Shield r2/r3 clone chain, which Task 8 authors as TRAINER-taught
      behind a ReqAbility1 chain off the node-granted r1 - structurally identical to the Vanilla
      Nature's Grasp 932507-932511 and TBC NG 946270-946275 predicates already in the ladder,
      and therefore invisible to the generic check.
    deferred_to_task_8_DONE: >-
      SHIPPED by Plan 3a Task 8 (2026-09-01), in EraTalentsCommand.cpp immediately above the generic
      NodesFor() fallback:
        if (id >= 946538 && id <= 946539)
        { if (!(era == ERA_TBC && t->getClass() == CLASS_SHAMAN &&
                EraTalents::CurrentRank(t, ERA_TBC, 20260) != 0))
              handler->PSendSysMessage("  ORPHAN ERA SPELL: {} (TBC Earth Shield trained rank without
                                        the TBC Earth Shield talent 20260)", id); continue; }
      Range note: it covers r2/r3 (946538/946539) ONLY. 946537 is node 20260's own rankSpell, so the
      generic check resolves it - and leaving it there keeps the rank-0 case reportable (a shaman
      still holding r1 with the talent unspent is a real strip gap the doctor should say out loud).
      Both arms gate on the same node either way.
    deferred_to_task_8: >-
      (ORIGINAL TEXT, kept for the record.) Task 8 must add a predicate of the shipped shape when it authors the Earth Shield chain,
      gated on the SAME node its reconcile arm gates on, e.g.
        if (id >= <ES_r2> && id <= <ES_r3>)
        { if (!(era == ERA_TBC && t->getClass() == CLASS_SHAMAN &&
                EraTalents::CurrentRank(t, ERA_TBC, <ES_node>) != 0))
              handler->PSendSysMessage("  ORPHAN ERA SPELL: {} ...", id); continue; }
      Task 5 deliberately did NOT add it: the ids and the node are not authored yet, so the
      predicate would be untestable and would guard an empty band.

  deferred_to_plan_3b:
    what: "the totem-roster orphan false positives - triage rows 142 (kStockShaSwap/kEraShaHide) and 188 (the 932416/932417 markers)"
    evidence: >-
      Live doctor run (below) shows 77 ORPHAN lines on a level-60 Vanilla shaman bot and 1 on the
      same bot at level 70 (TBC). Every one of them is a totem-roster spell:
        - 931000-931370 (76 lines at L60): the Vanilla custom totem summons. Verified TRAINER-taught,
          not node-granted - they are rows in acore_world.trainer_spell anchored on ReqAbility 932416
          (EraTalents.cpp kEraShaTrained), so the generic NodesFor() check can never resolve them.
        - 932416 (1 line at L60) / 932417 (1 line at L70): the presence-only era-totem markers,
          RECONCILE-granted in the CLASS_SHAMAN arm of EraTalents.cpp - never node-granted, never
          trainer rows.
    scope_call: >-
      NOT FIXED HERE, on purpose. The plan explicitly assigns triage rows 142 and 188 to Plan 3b
      as totem-roster decisions, and Task 5's Step 3 forbids changing Vanilla doctor behavior.
      Adding the 931xxx/932416/932417 predicates would change 77 Vanilla lines. It is also
      genuinely 3b's decision: 3b chooses which totems a TBC shaman gets and therefore what the
      predicate's era arm must say. Plan 3b should add ONE predicate covering
      931000-931399 + 932416 + 932417 and gate it on the era that owns each marker.
    pre_existing: >-
      This is a Vanilla-phase defect that predates the whole TBC shaman plan (same shape as the
      Vanilla Nature's Grasp gap the druid phase fixed). It is not caused or worsened by Plan 3a.

  verification:
    procedure: >-
      Bot LEVEL BAND, not `.ip set` (spec Amendment A.11). EraTalentBots::EraFor returns BotEra
      for bots; the band is <=60 Vanilla / 61-70 TBC / 71+ WotLK. Stack was already running the
      current binary - no rebuild, because no C++ changed.
    command: >-
      python3 tools/wgconsole.py /tmp/claude-1000/tbc-shaman/doctor.out
        ".character level Onnegsqi 60" "wait:5" ".eratalents doctor Onnegsqi" "wait:4"
        ".character level Onnegsqi 70" "wait:5" ".eratalents doctor Onnegsqi" "wait:4"
    vanilla_L60: >-
      "era=Vanilla storedEra=WotLK available=0 spent=51 generation=ac40a09e"; 14 node lines all
      "known=yes spellInfo=yes"; 77 ORPHAN lines, all 931xxx totems + 932416 (see
      deferred_to_plan_3b). No STALE STOCK SPELL lines.
    tbc_L70: >-
      "era=TBC storedEra=WotLK available=61 spent=0 generation=ac40a09e"; "(no era talents spent
      this era)"; exactly ONE ORPHAN line: 932417. No 946xxx orphan, no leaked Vanilla clone -
      the era transition stripped every 931xxx custom and swapped 932416 -> 932417 cleanly.
    what_this_proves: >-
      (a) The Vanilla->TBC transition leaves NO Vanilla shaman clone behind on a TBC shaman, so
      Amendment A.9's all-FRESH decision creates no strip gap the doctor can see. (b) No
      predicate in the shipped ladder mis-fires on a shaman in either era. (c) Vanilla behavior
      is unchanged (trivially - no code was changed).
    what_this_does_NOT_prove: >-
      NOTHING about the TBC shaman TREE's own spells. The dataset is the all-display_only seed:
      61 nodes, zero grantedSpellId, and the bot spent 0 of 61 points, so there is not a single
      TBC shaman era spell in the spell map that COULD orphan. The 946512-946611 band is empty.
      Real orphan coverage for the tree arrives only after Tasks 6-8 author it, and Task 8 owns
      the Earth Shield predicate above. Step 3's "zero ORPHAN lines in either era" acceptance
      criterion is NOT met, and cannot be met by this task - the residual lines are Plan 3b's.
    incidental: >-
      The L70 build logged 15 "authored build order skipped ... regenerate kAuthoredOrders"
      warnings and produced a 0-point build. Cause: kAuthoredOrders (EraTalentBots.cpp:88) is
      keyed (class, specTab) with NO era dimension, so a TBC shaman bot walks the VANILLA node-id
      order and every TryLearn misses, then the greedy fill finds nothing spendable because the
      TBC nodes are unwired display_only seeds. This is the already-documented cross-class TBC
      gap (docs/era-talents-tbc-workflow.md:244, spec §-design line 332), not a shaman-specific
      defect and not Task 5's to fix. Expect it to clear once Tasks 6-8 wire the nodes.

# ---------------------------------------------------------------------------------------------
# ACCEPTED GAPS (spec §7), carried into the Plan 3b verification record. Task 3's job was to
# RESOLVE §7.3; the others are restated with whatever this sweep added.
# ---------------------------------------------------------------------------------------------
accepted_gaps:

  - id: 1
    what: "Flametongue / Frostbrand / Rockbiter Weapon stay stock WotLK"
    status: OPEN (user decision, 2026-08-31)
    task3_finding: >-
      The sweep quantifies the cost. Frostbrand Attack 8034 is DIVERGED — TBC EFFECT_1 aura 33
      MOD_DECREASE_SPEED -25% vs LIVE -50%, EFFECT_2 direct damage 35 vs 42 (EFFECTIVE; raw 34 vs 41), and LIVE adds an
      EFFECT_3 aura 271 MOD_DAMAGE_FROM_CASTER. Flametongue Attack 10444 is LIVE_MATCH.
      So the gap is real but confined to Frostbrand's slow and tick.
    compounds_with_node_20233: >-
      ADDED IN THE TASK 7 FIX ROUND (2026-09-01), recorded here AND on the node because Plan 3b reads
      the two independently. Node 20233 Elemental Weapons binds a +5/10/15% SPELLMOD_DAMAGE to
      Frostbrand Attack 8034 - the same stock id this gap leaves at WotLK values - so the talent
      multiplies live's inflated Effect_2 base (42) rather than TBC's (35): at rank 3, 42 x 1.15 =
      48.3 against TBC's 35 x 1.15 = 40.25. The talent does not cause the divergence, it scales it.
      TWO BOUNDS, because the obvious reading over-estimates the damage: (a) the node's op is
      `damage` - TBC's own EffectMiscValue 0 SPELLMOD_DAMAGE, NOT the Vanilla node 18827's
      `allEffects` - so the mod reaches the SCHOOL_DAMAGE effect only and never touches 8034's
      Effect_1 aura-33 slow, leaving the -50%-vs--25% half entirely unscaled; (b) Flametongue Attack
      10444 is LIVE_MATCH, so the other spell the same effect binds is clean. The compounding is
      therefore confined to Frostbrand's direct damage, and closing gap 1 closes it for free -
      node 20233 needs no change either way.

  - id: 2
    what: "Elemental Weapons' Rockbiter half is code-verified inert regardless of era"
    status: OPEN (inherited from the Vanilla ledger)
    task3_finding: >-
      Unchanged. Separately, node 20233 Elemental Weapons IS diverged in its own right —
      16266/16302-equivalents: TBC EFFECT_1 aura 108 misc 12 +7% and EFFECT_2 aura 108 misc 0
      +5%, vs LIVE two identical aura 108 misc 12 +10% effects. Task 7 authors TBC's split shape.
    task7_disposition: >-
      SHIPPED as authored, gap CARRIED. Node 20233 now ships TBC's other two halves as spellmods on the
      unique ATTACK-spell bits - Flametongue Attack 10444 (word-A bit21) + Frostbrand Attack 8034 (bit24)
      at +5/10/15%, and Windfury Attack 25504 (bit23) at +13/27/40% - never the shared word-B bit11 imbue
      passives, which double-count onto Windfury (the Vanilla phase's 2026-08-23 redesign, measured
      5+13=18 / 10+27=37 / 15+40=55). The ROCKBITER half authors NO effect: its attack-power bonus is a
      flat SpellItemEnchantment.dbc value consumed directly by Player::UpdateDamageDoneMods's
      `case ITEM_ENCHANTMENT_TYPE_DAMAGE` branch, so no spell is cast and SpellEffectInfo::CalcValue -
      and therefore any spellmod - is never reached. Shipping it would ship a provably inert effect.
      Closing it needs a core patch; not attempted, and not proposed.
      SEE ALSO accepted_gaps id 1 `compounds_with_node_20233`: the OTHER half this node does ship
      (+5/10/15% on Flametongue and Frostbrand Attack) rides on top of gap 1's stock-imbue decision,
      so on Frostbrand it scales live's damage base rather than TBC's. Bounded and recorded there;
      it is an interaction between the two gaps, not a defect in either.

  - id: 3
    what: "Stormstrike strike count - carried pending the Task 3 read of TBC's aura-87 encoding vs live aura 271"
    status: >-
      RESOLVED (mechanism) - one real-client confirmation outstanding.
      Re-statused in the Task 7 fix round (2026-09-01). The ORIGINAL gap - the aura-87 vs aura-271
      encoding and the strike count - is genuinely closed and shipped as clone 946520. What is NOT
      closed is the knock-on this row grew underneath it: `knock_on_resolution` reasons from core
      source that a Stormstrike cast cannot consume a Flurry charge, and that has not been observed
      in play. It was previously filed under a flat "RESOLVED ... the gap CLOSES", which anyone
      triaging by scanning `status:` would skip - and gap 5 delegates its only open half in here, so
      the phase's single unproven item was parked inside the one gap marked closed. Do not close
      this row until the real-client check below passes.
    task3_finding: >-
      Read: TBC 17364 EFFECT_1 = aura 87 SPELL_AURA_MOD_DAMAGE_PERCENT_TAKEN, misc 8 (Nature),
      effective +20% — the debuffed target takes +20% Nature damage from EVERYONE. Live 17364
      EFFECT_1 = aura 271 SPELL_AURA_MOD_DAMAGE_FROM_CASTER, misc 8, effective +20% — WotLK
      narrowed it to the CASTER only. Aura 87 is a real, fully implemented 3.3.5a aura
      (SpellAuraDefines.h:150), so the TBC encoding can be authored LITERALLY; no core patch.
      The other half of the question is the charge count: ProcCharges TBC 2 vs LIVE 4 — TBC's
      debuff is consumed by 2 Nature spells, WotLK's by 4. The physical delivery is NOT part of
      the gap: both strike triggers 32175 (MH) and 32176 (OH) are LIVE_MATCH, so a clone that
      keeps them still lands two weapon attacks. A clone carrying aura 87 + ProcCharges 2 +
      ProcTypeMask 139944 (vs LIVE 139808) reproduces TBC exactly.
    knock_on: >-
      `spell_sha_flurry_proc` matches Stormstrike BY ID (SPELL_SHAMAN_STORMSTRIKE = 17364), so a
      Stormstrike clone will no longer be excluded from consuming Flurry charges. Task 7 must
      either accept that as a new gap or route it through an era proc script.
    knock_on_resolution: >-
      TASK 7 (2026-09-01). SHIPPED: node 20238 grants clone 946520. The knock-on is BOUNDED, not
      accepted-as-broken, and the argument is a source read rather than an observation - stated that way
      on purpose.
      Traced: the exclusion lives in `spell_sha_flurry_proc::CheckProc`, which is registered on the
      Flurry BUFF chain (-16257), i.e. it gates CHARGE CONSUMPTION. The buff consumes a charge only on
      `PROC_FLAG_DONE_MELEE_AUTO_ATTACK` (0x4) - TBC 16257's own ProcTypeMask, LIVE_MATCH, and written
      explicitly as `flags: 4` on the fresh clones' own spell_proc rows rather than left to a default.
      Stormstrike is `DefenseType 2` = SPELL_DAMAGE_CLASS_MELEE (live DBC dump 2026-09-01), and BOTH
      paths that build proc flags for a melee-damage-class spell - `Spell::prepareDataForTriggerSystem`
      (Spell.cpp:2253) and `Unit::ProcSkillsAndAuras` (Unit.cpp:12746) - set
      `PROC_FLAG_DONE_SPELL_MELEE_DMG_CLASS` (0x10) and never 0x4. So a Stormstrike cast cannot spend a
      Flurry charge whether or not the script recognises its id, and the by-id exclusion is unreachable
      through this gate on this build.
      The script's OTHER exclusion, Windfury Attack, is matched by FAMILY FLAG (SPELLFAMILY_SHAMAN +
      flags[0] & 0x00800000) rather than by id and is unaffected by any clone.
      NOT PROVEN, and it is the one item on this node's real-client queue: confirm in play that a
      Stormstrike cast does not consume a Flurry charge. If it does, the fix is to add 946520 to an era
      proc script - a C++ change Task 7 did not make.

  - id: 4
    what: "Guardian Totems' Windwall half and Enhancing Totems' Grace of Air half - should CLOSE once Plan 3b ships era clones for both"
    status: >-
      **CLOSED (data side) 2026-09-01 by Plan 3b Task 2 batch 4a.** All THREE consumers now bind the
      TBC pulses. In-client confirmation that the two halves actually MOVE a magnitude remains Plan
      3b Task 8's, exactly as `task7_disposition` asked.
    task8_receipt: "Enhancing Totems' Strength of Earth half OBSERVED FIRING live (Task 8,
                    2026-09-02): a TBC-band bot's SoE pulse 947041 applied at amount 98 = authored
                    86 x 1.15. The Grace of Air half and Guardian Totems' Stoneskin/Windwall halves
                    were not caught in the sampling window — rolled onto Task 9's real-client list."
    batch4a_closure: >-
      **The decision is the OPPOSITE of "give the TBC air totems the same word-C bits".** The TBC
      pulses batch 4a mints carry **TBC's OWN word-A bits** and the Vanilla-minted word-C bits are
