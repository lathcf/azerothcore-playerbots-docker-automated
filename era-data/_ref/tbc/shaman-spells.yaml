      casts 45284 / 45297. The talent's own e1 (core enum EFFECT_0) is a bare SPELL_AURA_DUMMY — inert without
      the script. Both overload casts 45284 / 45297 are LIVE_MATCH, so they stay stock.
    also_needs: "the `spell_proc` row (-30675: SpellFamilyName 11 / Mask0 3 / SpellTypeMask 1 / SpellPhaseMask 2) - see proc_rows"

  30823:
    script: spell_sha_shamanistic_rage
