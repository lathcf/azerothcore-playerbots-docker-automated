# TBC (2.4.3) shaman stock-spell reference — the LIVE-VERIFIED survival map, script-binding census
# and reuse ledger for Plan 3a (talent tree) and Plan 3b (totem roster + Windfury Weapon).
#
# Era-scoped. The era-less `era-data/_ref/shaman-spells.yaml` and `era-data/_ref/shaman-totems.yaml`
# are VANILLA-verified and MUST NOT be inherited (spec §1). Only the `skillLines:` and `spells:`
# family-mask identity tables in the era-less shaman-spells.yaml are era-neutral (they describe the
# LIVE 3.3.5a store, which both eras share) and are referenced rather than duplicated here.
#
# Class 7, spell family 11 — the mirror of druid's class 11 / family 7. Getting these backwards
# silently produces family-7 spellmods that bind DRUID spells; era_audit.py's family guard catches
# it. Do not transpose them.
#
# Produced by Plan 3a Task 3, 2026-08-31; fix round the same day. Authority chain: wago 2.5.4.44833
# for TBC magnitudes, the LIVE server for what 3.3.5a actually has. Where this file and the spec's
# §4 buckets disagree, THIS FILE WINS — see `spec_bucket_contradictions:`.

era: 1
class: 7
family: 11
familyName: 11

# Live-confirmed via SkillLineAbility.dbc + SkillLine.dbc; identical to the era-less
# era-data/_ref/shaman-spells.yaml (a SkillLine is a property of the live 3.3.5a store, not of an
# era, so the Vanilla-phase confirmation carries over unchanged).
skillLines:
  elemental: 375         # "Elemental Combat"
  enhancement: 373       # "Enhancement" — the entry the plan asked to confirm; CONFIRMED at 373.
  restoration: 374       # "Restoration" (SHAMAN). NEVER 573 — that is the DRUID Restoration line.

method:

  # ===========================================================================================
  # READ THESE FOUR CONVENTIONS BEFORE USING ANY NUMBER IN THIS FILE.
  # ===========================================================================================
  conventions:

    effect_slot_numbering: >-
      THIS FILE NUMBERS EFFECT SLOTS 1-BASED: `e1`/`e2`/`e3` are DBC columns Effect_1/Effect_2/
      Effect_3, i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where
      `EFFECT_0` is DBC slot 1 and `EFFECT_1` is DBC slot 2. The two collide, and the collision
      lands on the highest-risk entry in the file (Nature's Guardian, whose threshold the core
      reads from `Effects[EFFECT_1]` = this map's e2). RULE: wherever a core-source token appears
      — in `script_bindings:` and in `unverified_slots:` — it is written
      `EFFECT_n (0-based core enum; = this map's e<n+1>)`. Anywhere else, `eN` is 1-based and
      means the DBC column of the same number. Never translate one into the other by name alone.

    magnitudes_are_effective: >-
      EVERY magnitude quoted in prose anywhere in this file is the EFFECTIVE value — what the
      server computes, i.e. `basePoints + 1` when `EffectDieSides == 1` and `basePoints` when
      DieSides is 0 (`SpellEffectInfo::CalcBaseValue`). The same is true of the `val<n>` term in
      every survival_map `detail:` tuple. Where a raw DBC base-points figure is given it is
      always marked `(EFFECTIVE …; raw …)` or the word "raw". If a row says neither, it is
      effective. This error class has recurred, so treat an unmarked number as effective and
      re-derive rather than assuming.

    verdict_vocabulary: >-
      LIVE_MATCH = every comparable field agrees. DIVERGED = at least one comparable field
      differs. WAGO_ONLY = in TBC, absent from 3.3.5a (reconstruct). LIVE_ONLY = in 3.3.5a,
      absent from TBC (must not be reachable). LIVE_ONLY_DB_ADDED = in neither DBC nor wago but
      present in acore_world.spell_dbc, so the SERVER has it. LIVE_MATCH_UNVERIFIED_SLOT =
      everything comparable agrees BUT at least one slot could not be compared at all; it is a
      distinct token precisely so a consumer matching `LIVE_MATCH` exactly does not silently
      accept it. Any entry carrying `unverified_slots:` must be read before it is trusted.

    cross_references: >-
      Each survival_map entry carries the outbound links a consumer needs so that no finding in
      this file is reachable only from a section the consumer did not open. `see:` lists the other
      top-level keys that discuss this id (that is what makes, e.g., the Flurry contradiction
      reachable from 16256, whose own verdict is LIVE_MATCH). `triggers:` / `triggered_by:` link
      a spell to its chain in both directions. `node:` is populated for triggered spells too - it
      names the node whose rank spell triggers them - so a triggered id is never orphaned from the
      talent that owns it.
      `see:` is computed by scanning the RAW TEXT of each top-level section, not a parsed dump -
      the first implementation parsed the YAML first, which silently dropped trailing `#` comments
      and matched only whole-word ids, so mentions inside a comment (32593/32594 in
      spells_supplement) and inside a client format spec (`$64701s1` in reuse_ledger) were missed.
      Both classes are covered now.

    trigger_chains: >-
      A node's TALENT ROW being LIVE_MATCH does not make the node safe. Four nodes have a clean
      talent row and a diverged TRIGGERED chain (see node_buckets.clean_row_diverged_chain).
      Every id's `triggers:` / `triggered_by:` keys are populated so a chain can be walked from
      either end; the trigger targets of every id in this map have themselves been swept.

  live_dbc:
    source: azerothcore-wotlk/ip-dbc/Spell.dbc
    md5: 49c9c5f53e8974c27d67635384725f46
    live_verified: >-
      The running ac-worldserver's /azerothcore/env/dist/data/dbc/Spell.dbc has the IDENTICAL md5
      (49c9c5f53e8974c27d67635384725f46, 53466210 bytes). No client/server generation mismatch.
      NOTE the plan's Step 2 `docker cp` path (/azerothcore/env/dist/dbc/Spell.dbc) does not exist
      in this image; the real path is /azerothcore/env/dist/data/dbc/Spell.dbc.
  db_overlay: >-
    The DBC on disk is NOT the whole live store. acore_world.spell_dbc adds rows at worldserver
    load. Two ids in this map exist ONLY there — 18350 "Dummy Trigger" and 39301 "Nature's
    Guardian" (the NG threat-drop the core script casts). A DBC-only diff verdicts both as
    absent/WAGO_ONLY; the server HAS them. This is exactly what live-verification was for.
    Verdict `LIVE_ONLY_DB_ADDED` marks them.
  tbc_source: wago 2.5.4.44833 SpellEffect / SpellMisc / SpellAuraOptions / SpellPower / SpellName / SpellDuration

  corrections_to_the_plan_script:
    base_points_off_by_one: >-
      The plan's Step 3 snippet compares wago EffectBasePoints against LIVE EffectBasePoints + 1.
      That is WRONG: wago 2.5.4 stores EffectBasePoints in the same raw (value-1) DBC convention.
      Proof — the framework doc's own anchor, TBC Mangle (Cat) 33876 EFFECT_2 "basePoints 159
      (=160%)", reads 159 in the wago CSV. Left uncorrected the script marks 199 of 240 ids
      DIVERGED, i.e. it destroys the artifact. This map compares the EFFECTIVE value on both
      sides (see conventions.magnitudes_are_effective), which also normalises the several places
      where a clone or live row moved the +1 into DieSides.
    duration_index_is_comparable: >-
      wago 2.5.4's SpellDuration table matches every 3.3.5a index anchor this project has recorded
      (8=15000, 9=30000, 18=20000, 21=-1 infinite, 29=12000, 64=40000), so raw DurationIndex values
      ARE comparable across the two builds for this id set. ms values quoted below come from
      SpellDuration-2.5.4.
    unused_slot_filter_narrowed: >-
      FIX ROUND. The first pass discarded any slot whose `Effect` was 0 on BOTH sides as padding.
      That is unsafe: `SpellEffectInfo::CalcValue()` returns basePoints regardless of whether
      `Effect` is 0, so a slot can be both "unused" and load-bearing — and two core scripts prove
      it (Windfury Weapon's attack-power bonus and Nature's Guardian's health threshold both live
      in such a slot). The filter now discards the slot ONLY when the base points also agree;
      otherwise the values are printed under `unverified_slots:` with a `~eN` marker, matching the
      druid sibling's `~e3` precedent.
    attributes_were_never_swept: >-
      SECOND FIX ROUND, and the same shape of gap as the non-effect one that workflow lesson 1
      exists for: an entire column family sat outside the diff. Neither the original pass nor the
      first fix round compared `Attributes` / `AttributesEx` / `AttributesEx2` .. `AttributesEx7`
      (wago `SpellMisc.Attributes_0..7`) at all. It surfaced because a reuse_ledger entry asserted
      "ATTRIBUTES - 0 on both. EQUAL." for the Flurry buff clones, which was FALSE - they carry
      `AttributesEx3 524288` (SPELL_ATTR3_INSTANT_TARGET_PROCS) against TBC's 0, and that single
      field reversed the verdict. All eight words are now swept for every id in the map.
      LAYOUT VALIDATED BEFORE USE, independently of the review that raised it: across the 214 ids
      present on both sides, wago `Attributes_N` agrees with live `AttributesEx(N)` at
      97.7 / 99.5 / 98.6 / 94.9 / 99.1 / 99.5 / 93.5 / 96.3 % for N = 0..7. A bit-reassignment
      between the two builds would not produce agreement at that level, so the disagreements are
      real era differences rather than layout artifacts.
      RESULT: 31 of 262 ids carry at least one attribute difference; they are recorded per-entry
      under `attribute_divergences:` with the AzerothCore bit name for each differing bit. Eight
      of them had been LIVE_MATCH.
      LESSON FOR THE NEXT CLASS PHASE: sweep attributes from the FIRST pass. The most frequent
      single finding here is `AttributesEx6` bit 26 (SPELL_ATTR6_VEHICLE_IMMUNITY_CATEGORY, which
      AzerothCore itself annotates "Unknown attribute 26@Attr6") on 11 ids, all TBC 0 -> LIVE set;
      the most consequential is `AttributesEx3` bit 19 on the Flurry buff chain.
    generator_reach_over_attributes: >-
      Needed to decide any reuse question that turns on an attribute. `tools/gen_era_talents.py`
      exposes `attributes` -> `Attributes` (line 1134) and `attributesEx` -> `AttributesEx`
      (line 1143) as helper scalars, and NOTHING for AttributesEx2..7 (`grep -c AttributesEx3`
      returns 0). So a fresh clone can be authored to TBC's `Attributes`/`AttributesEx`, but its
      AttributesEx2..7 come from whatever template it clones and cannot be overridden. That
      asymmetry is what makes `Attributes` a field that DISCRIMINATES between reuse and fresh,
      while AttributesEx2..7 generally do not.
    wago_cannot_answer_an_empty_slot: >-
      Load-bearing consequence, and the reason the marker says UNVERIFIED rather than DIVERGED:
      wago 2.5.4's SpellEffect table contains exactly ONE row with `Effect == 0` in the entire
      table. DB2 simply does not store empty-effect rows. So where the live DBC has `Effect 0`
      with non-zero base points, TBC's value for that slot is NOT KNOWABLE from wago — the
      absence of a row is not evidence of a zero, and this file does not claim one.

  noise_filters_applied:
    - "per-effect SpellClassMask words are NOT compared at all (spec §2 - 2.4.3 used two 32-bit
       words, the DB2 four, with different bit assignments)"
    - "a slot whose Effect is 0 on BOTH sides AND whose base points agree (narrowed in the first
       fix round - see corrections_to_the_plan_script.unused_slot_filter_narrowed)"
    - "a live padding Effect_N = 6 with no aura where wago has no SpellEffect row"
    - "DurationIndex disagreement confined to {0, 21} on a passive (both mean permanent)"
    - "a missing wago SpellAuraOptions row opposite the live DBC 'not a proc' default
       (ProcChance 101 / charges 0 / mask 0) - AND ONLY THEN. Second fix round: the first
       implementation had this condition INVERTED, so the cases where TBC has no row and 3.3.5a
       IS a real proc were being printed inside a '[noise ignored: ...]' bracket. Five ids were
       affected (16086/16544 live 100/0/0; 16180/16196/16198 live 33|66|100 / 0 / 16384 - WotLK's
       Improved Water Shield genuinely procs where TBC's Nature's Guidance has no
       SpellAuraOptions row at all). No verdict changed - all five are DIVERGED on effects anyway
       - but the difference now appears in `detail:` where a Task 6/7 author will see it."
    - "NOTHING in the ATTRIBUTE words is filtered. All eight are compared verbatim."

