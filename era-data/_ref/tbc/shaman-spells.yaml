# ---------------------------------------------------------------------------------------------
# THE SCRIPT-BINDING CENSUS (spec §5 — this phase's dominant risk).
#
# Source: SELECT spell_id, ScriptName FROM acore_world.spell_script_names WHERE ABS(spell_id) IN
# <the 250 ids>. 17 rows. A NEGATIVE spell_id binds the spell AND every rank in its chain, so a
# clone chain must either carry its own `spell_ranks` root plus a negative binding, or bind each
# rank id individually — recorded per row as `clone_bind_shape`.
#
# `action` values:
#   rebind            - this plan clones the spell; the clone MUST carry a scriptBindings entry
#   rebind_if_cloned  - the disposition is still open (Task 6/7/8 or Plan 3b decides); if it clones, bind
#   n_a               - no bind is needed on any clone, WITH the reason recorded
# ---------------------------------------------------------------------------------------------
script_bindings:

  -974:
    script: spell_sha_earth_shield
    negative: true
    chain: [974, 32593, 32594, 49283, 49284]
    cloned_by: null
    clone_owner: "Plan 3a Task 8 (node 20260 + the r2/r3 trainer chain)"
    action: rebind
    clone_bind_shape: "negative on the clone chain root (the clones need a `spell_ranks` root anyway for the r2/r3 trainer chain)"
    why: >-
      This IS Earth Shield. The AuraScript owns the whole mechanic: DoEffectCalcAmount on EFFECT_0 (0-based core enum; = this map's e1)
      SPELL_AURA_DUMMY (applies SpellHealingBonusDone + Glyph of Earth Shield + the Improved
      Shields spellmod), CheckProc (the 3.5s internal cooldown), and OnEffectProc (casts
      SPELL_SHAMAN_EARTH_SHIELD_HEAL 379 with the calculated amount). Unbound, an Earth Shield
      clone applies an inert DUMMY and heals nothing. The clone MUST keep EFFECT_0 (0-based core enum; = this map's e1) as
      SPELL_AURA_DUMMY or the registration does not match.
    also_needs: "the `spell_proc` row (-974: SpellTypeMask 1, AttributesMask 2, Cooldown 3500) - see proc_rows"

  -30881:
    script: spell_sha_nature_guardian
    negative: true
    chain: [30881, 30883, 30884, 30885, 30886]
    cloned_by: null
    clone_owner: "Plan 3a Task 8 (node 20257)"
    action: rebind
    clone_bind_shape: "negative on a clone `spell_ranks` root, or five individual binds"
    why: >-
      Owns the whole talent: CheckProc tests HealthBelowPctDamaged, OnEffectProc casts
      SPELL_SHAMAN_NATURE_GUARDIAN 31616 for CalculatePct(maxHealth, EFFECT_0 (0-based core enum;
      = this map's e1) amount) and
      SPELL_SHAMAN_NATURE_GUARDIAN_THREAT 39301 at the attacker.
    trap: >-
      THE THRESHOLD LIVES IN EFFECT_1 (0-based core enum; = THIS MAP'S e2, i.e. DBC column
      EffectBasePoints_2 - do NOT write it into slot 1). `spell_shaman.cpp:1167` reads
      `GetSpellInfo()->Effects[EFFECT_1].CalcValue()` as the health percentage, and live 30881
      carries raw 29 / DieSides 1 = EFFECTIVE 30 in that slot. TBC's 30881 has NO such slot
      populated - and wago cannot even tell us it is empty (see
      method.corrections_to_the_plan_script.wago_cannot_answer_an_empty_slot and this id's
      `unverified_slots:`). A literal TBC clone therefore yields threshold 0 and the talent NEVER
      FIRES. The clone must keep the live e2 carrier (EFFECTIVE 30) while authoring the TBC e1 value (EFFECTIVE 10% at every rank,
      vs live 3/6/9/12/15%) and the TBC ProcChance (10/20/30/40/50 vs live 100). This is the
      Mangle "keep the live carrier, author the TBC values" lesson, exactly.
    also_needs: "the `spell_proc` row (-30881: SpellTypeMask 1, Cooldown 30000 - the 30s ICD) - see proc_rows"

  -30675:
    script: spell_sha_lightning_overload
    negative: true
    chain: [30675, 30678, 30679, 30680, 30681]
    cloned_by: null
    clone_owner: "Plan 3a Task 6 (node 20218)"
    action: rebind
    clone_bind_shape: "negative on a clone `spell_ranks` root; the TBC chain is FIVE ranks (30680/30681 are WAGO_ONLY and must be reconstructed) against WotLK's three"
    why: >-
      Owns the whole talent: CheckProc gates on SpellFamilyFlags[0] & 0x3 (Lightning Bolt / Chain
