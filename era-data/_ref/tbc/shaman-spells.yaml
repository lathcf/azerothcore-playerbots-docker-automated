      shaman and their absence proves NOTHING. This matters more here than for any class shipped
      so far: patch 0021's largest surface is the shaman totem subsystem
      (`ShamanActions.cpp`, `ShamanTriggers.cpp`, `TotemsShamanStrategy.cpp` — rank walks,
      per-slot no-totem gates, `EraKnownMatchesAny` UNIT_CREATED_BY_SPELL identity checks, and the
