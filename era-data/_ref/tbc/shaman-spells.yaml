  - id: 11
    what: "Restorative Totems (node 20250): TBC's SPELLMOD_DOT half is deliberately NOT shipped"
    status: >-
      ACCEPTED (Plan 3a Task 8, 2026-09-01). **RE-OPENED AND RE-CLOSED 2026-09-01 by Plan 3b Task 2
      batch 3, on a DIFFERENT reason.** The `owner:` line below said "re-open only if Plan 3b's TBC
      Healing Stream is a real periodic heal" -- and it IS, so the condition fired. The DISPOSITION
      is unchanged (ship the ALL_EFFECTS half only) but the JUSTIFICATION below is retracted: see
      `batch3_correction:`.
    owner: "Plan 3a Task 8; condition fired and was re-closed by Plan 3b Task 2 batch 3 (2026-09-01)"
    measured: >-
      TBC 16187/16205/16206 carry TWO effects at the SAME magnitude:
        e1 aura 108 ADD_PCT_MODIFIER, EffectMiscValue 22 SPELLMOD_DOT,         EFFECTIVE +5/10/15/20/25%
        e2 aura 108 ADD_PCT_MODIFIER, EffectMiscValue  8 SPELLMOD_ALL_EFFECTS, EFFECTIVE +5/10/15/20/25%
      LIVE replaced e1 with a single ALL_EFFECTS mod at +7/12/20% scoped to Mana Spring alone (mask A
      16384) and made e2 a bare DUMMY the core reads BY ICON for WotLK's Cleansing-Totem half.
    consequence: >-
      NONE that is observable - which is the point. `SPELLMOD_DOT` has exactly two consumers in the
      fork, `Unit::SpellDamageBonusDone` (Unit.cpp:8934) and `Unit::SpellHealingBonusDone` (:9716),
      both gated on `damagetype == DOT`, and neither totem reaches them on this build: Mana Spring's
      pulse 5677 is `aura 85 PERIODIC_ENERGIZE` (no SPELLMOD_DOT path touches energize at all), and
      Healing Stream's pulse 5672 is `aura 23 PERIODIC_TRIGGER_SPELL -> 52041`, whose Effect_1 is a
      DUMMY that `spell_sha_healing_stream_totem::HandleDummy` turns into a DIRECT cast of 52042,
      never a DOT. Shipping e1 would ship a row that provably does nothing - the same call
      accepted_gaps id 2 makes for Elemental Weapons' Rockbiter half.
      The surviving ALL_EFFECTS half delivers the whole tooltip: it is applied in
      SpellEffectInfo::CalcValue, which BOTH pulses reach through the totem's GetSpellModOwner() (Mana
      Spring via AuraEffect::CalculateAmount, Healing Stream via the script's GetEffectValue() on
      52041), and both TBC effects carry the same magnitude - so one mod gives each totem exactly the
      advertised bonus, once.
    mask_note: >-
      The node binds `affectsMask {a: 24576}` = Healing Stream bit13 | Mana Spring bit14, both unique
      per-pulse bits (52041 carries bit13 too, so the heal carrier itself is in scope). Live's own
      bind is bit14 alone because WotLK moved the Healing Stream half into the icon-read DUMMY; the
      TBC tooltip names both totems, so both bits are bound. No double-application with the core's
      WotLK path: `spell_sha_healing_stream_totem` looks Restorative Totems up as
      `GetAuraEffect(SPELL_AURA_DUMMY, SPELLFAMILY_SHAMAN, <icon 338>, 1)`, and this node's
      auto-passives carry SpellIconID 1 and no DUMMY, so that read finds nothing.
    plan3b_followup: >-
      **SUPERSEDED by `batch3_correction:` below.** As written it said: "IF Plan 3b's TBC Healing
      Stream pulse is rebuilt as a genuine periodic heal, drop the Healing Stream bit from the
      ALL_EFFECTS mask and ship TBC's e1 against it instead." The condition fired; the prescription
      did not survive review. Both arrangements apply the bonus exactly once, and the ALL_EFFECTS
      one is what is already shipped and already correct, so nothing is re-pointed. Kept verbatim
      only so a reader who finds the old wording elsewhere can see it was considered and dropped.

    batch3_correction: >-
      **THE `consequence:` REASONING ABOVE IS WRONG ABOUT HEALING STREAM, and the error is the one
      Amendment B.8.1 generalises: it reasoned about LIVE 5672, not about the spell a TBC shaman
      actually gets.** Live 5672 is WotLK's rework (`aura 23 PERIODIC_TRIGGER_SPELL -> 52041 dummy
      -> 52042 direct heal`). **TBC's own 5672 is `Effect 35 / aura 8 SPELL_AURA_PERIODIC_HEAL /
      period 2000 / bp 5`** (wago 2.5.4), and the shipped Vanilla clone `931190-931194` -- which
      Plan 3b Task 2 batch 3 REUSES unchanged under Amendment B.8.1 -- reproduces exactly that
      shape. Its ticks DO reach `Unit::SpellHealingBonusDone` (Unit.cpp:9716) at
      `damagetype == DOT`, so `SPELLMOD_DOT` is **REACHABLE**, not inert. Only the Mana Spring half
      of the `consequence:` paragraph survives (aura 24 PERIODIC_ENERGIZE in TBC, aura 85 in live --
      no SPELLMOD_DOT path touches either).
      **THE SHIPPED OUTCOME IS UNCHANGED, on the right reason: shipping BOTH halves would
      DOUBLE-APPLY.** ALL_EFFECTS raises the aura's calculated amount in
      `SpellEffectInfo::CalcValue` (reached through the totem's `GetSpellModOwner()`), and DOT would
      then raise the healing done on every tick of that already-raised amount. TBC's two effects
      carry the SAME magnitude, so one ALL_EFFECTS mod delivers the advertised bonus exactly once.
      Node 20250 keeps its single mod against `affectsMask {a: 24576}` exactly as Plan 3a shipped
      it; batch 3 changed nothing about which spell that mask binds (bit13 rides the reused Healing
      Stream pulses, bit14 the freshly minted Mana Spring pulses, which inherit it from their own
      stock templates).
      The generalisable lesson, worth more than the node: **"code-verified inert" is only as good as
      the spell the verification looked at. For an era clone, the spell that matters is the CLONE at
      the ERA's shape, never the live stock id it shares a name with.**

