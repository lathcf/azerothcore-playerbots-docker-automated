  id_set_extensions: >-
    The plan's Step 1 list carried 240 ids. It is now 262, extended twice, as Step 1 invites.
    FIRST PASS (+10): 16257/16277/16278/16279/16280 (the Flurry BUFF chain — script-bound via
    -16257 and value-diverged, while the Flurry TALENT ranks are all LIVE_MATCH: the clearest
    instance of spec §5's "chase triggers, not just the talent row"); 8514 (TBC Windfury Totem
    trigger); 18350 (the dummy trigger Nature's Guardian 30881 fires); 51466 Elemental Oath (the
    only thing spell_sha_clearcasting computes); 63280 Glyph of Totem of Wrath (the only thing
    spell_sha_totem_of_wrath does); 38443 (the "Totemic Mastery" spell_sha_totemic_mastery binds).
    FIX ROUND (+12): rather than chase the three chains the review named, every EffectTriggerSpell
    of every id already in the map — on BOTH sides — was enumerated and any target not yet swept
    was added. That found twelve, nine of them not previously named: 16177/16236/16237 (Ancestral
    Fortitude — a REAL DEFECT, see spec_bucket_contradictions), 18848/36591 (Spirit Weapons),
    29177/29178/30165 (Elemental Devastation), 674 (Dual Wield), 64701 (Elemental Mastery's WotLK
    haste trigger) and **30806/30807 — the 4th and 5th ranks of the TBC Unleashed Rage buff chain,
    which the plan's hardcoded list had as three ranks (30803/30804/30805) when TBC has five.**
    The sweep is now closed: re-running it against the 262-id set finds no further unswept target.

