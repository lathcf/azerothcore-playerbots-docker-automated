    added_in: >-
      fix round. NOT named by spec §4.2 and NOT requested by the review - found while sweeping
      node 20229's triggered chain, because the era-less era-data/_ref/shaman-spells.yaml records
      Vanilla Flurry at 10/15/20/25/30%, which is exactly TBC's value set.
    evidence: >-
      Live clones 932400-932404 vs wago 2.5.4 16257/16277/16278/16279/16280, field by field:
      MAGNITUDE - clone e1 aura 138 MOD_MELEE_HASTE raw basePoints 10/15/20/25/30, DieSides 0 =
      EFFECTIVE +10/+15/+20/+25/+30%; TBC raw 9/14/19/24/29, DieSides 1 = EFFECTIVE
      +10/+15/+20/+25/+30%. EQUAL on all five ranks.
      MISC - 0 on both. AURA - 138 on both. EQUAL.
      PROC FIELDS - ProcChance 100, ProcCharges 3, ProcTypeMask 4, CumulativeAura 0 on both.
      EQUAL (and the 3-charge count is the whole point of Flurry).
      DURATION - DurationIndex 8 = 15000 ms on both. SCHOOL - SchoolMask 1 on both.
      RANGE - RangeIndex 1 on both. COOLDOWN / MANA - 0 on both. EQUAL.
      **ATTRIBUTES - NOT EQUAL. This is what decides it, and the first fix round got it wrong by
      asserting "0 on both" without reading the columns.** Measured: clones 932400-932404 carry
      `Attributes 0 / AttributesEx 0 / AttributesEx2 0 / **AttributesEx3 524288** / Ex4..Ex7 0`;
      wago 2.5.4 SpellMisc for 16257/16277/16278/16279/16280 carries `Attributes_0..7 = 0` on
      every rank. 524288 = 0x80000 = **SPELL_ATTR3_INSTANT_TARGET_PROCS**, inherited from the
      live 16257-16280 the Vanilla clones were built from (the stock ids themselves now verdict
      DIVERGED on exactly this word - see survival_map 16257).
      IT DISCRIMINATES, unlike SpellClassSet. `tools/gen_era_talents.py` has no AttributesEx3 key
      at all (`grep -c AttributesEx3` returns 0), so a fresh clone emits 0 = TBC\'s value while
      reuse carries 524288 = WotLK\'s. Fresh is strictly more faithful here, so the all-or-nothing
      rule IS engaged - the same rule that flipped 932413 and 932408-932410.
      AND IT IS NOT PROVABLY IMMATERIAL, so no immateriality argument is available either. In
      `Unit::TriggerAurasProcOnEvent` (Unit.cpp:12970-12976) an aura carrying this attribute wraps
      its own proc handling in `SetCantProc(true)` / `SetCantProc(false)` - while the Flurry charge
      is being consumed, no OTHER aura on the unit may proc. An enhancement shaman is exactly the
      case where that bites: Windfury, Elemental Devastation, Ancestral Healing, Stormstrike and
      weapon imbues are all competing procs on the same swings. The effect may be small, but it is
      real, and "small" is not a claim this file is entitled to make without measuring it.
      NOT DECISIVE, recorded for completeness: SpellClassSet, clone 0 vs TBC 11 - a PIPELINE
      PROPERTY, not an authoring choice (`gen_era_talents.py:1010` emits
      `"SpellClassSet": fam if has_mask else 0`, and this buff carries no family-masked effect, so
      a fresh clone comes out family 0 too). That analysis stands and is why SpellClassSet alone
      would NOT have flipped the verdict; AttributesEx3 does.
      CONCLUSION: mint FRESH clones for node 20229. The cost is small and the ledger stays
      consistent: template off 932400-932404, which match TBC on every other swept field, and let
      the generator emit AttributesEx3 0.
    task7_must_still: >-
      1. Add a `scriptBindings:` entry - the core `spell_sha_flurry_proc` is bound to -16257 and
      is dead on a clone chain (see script_bindings -16257).
      2. Hand-author the `spell_proc` row (-16257 carries Cooldown 500; a clone inherits none).
      3. If any era effect ever needs to bind this buff by family mask, set `family: 11`
      explicitly - the generator exposes it as the `family:` helper scalar
      (gen_era_talents.py:1159) - since a generated clone will not carry it.
    tooltip_defect_in_the_vanilla_clones: >-
      Same class as the 932413 defect already logged, found in the second fix round and recorded
      whether or not anyone reuses these ids: all five clones carry
      `Description_Lang_enUS = "Increases your attack speed by $16257s1%"`. The client resolves
