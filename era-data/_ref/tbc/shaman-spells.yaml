      regardless of the rank actually learned. `AuraDescription_Lang_enUS` is `$s1%` and is
      correct. A fresh TBC clone must NOT copy that Description - use `$s1%`, or hyperlink the
      clone\'s own id. This is also a live VANILLA defect; see open_questions.

