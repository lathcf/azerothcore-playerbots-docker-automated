    what: "Shamanistic Rage clone 946526 inherits AttributesEx5 SPELL_ATTR5_ALLOW_WHILE_STUNNED, which TBC does not have"
    status: "**CLOSED 2026-09-02: the cheap fix was taken exactly as `cheap_fix_when_someone_wants_it`
