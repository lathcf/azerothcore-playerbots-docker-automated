    owner: "Plan 3a Task 7; closable by a one-key generator addition at any time"
    measured: >-
      survival_map[30823].attribute_divergences records `AttributesEx5 TBC 0x0 -> LIVE 0x8`. 0x8 is
      SPELL_ATTR5_ALLOW_WHILE_STUNNED (fork SharedDefines.h:558), a WotLK addition. Clone 946526 uses
      `template: 30823`, and tools/gen_era_talents.py exposes `attributes` -> Attributes and
      `attributesEx` -> AttributesEx and NOTHING for AttributesEx2..7
      (method.corrections_to_the_plan_script.generator_reach_over_attributes), so the bit rides along.
    consequence: >-
      A TBC-era shaman can activate Shamanistic Rage while stunned; TBC did not allow that. Small, real,
      and confined to PvP.
    why_accepted: >-
      The alternative is a from-scratch row, the way the Flurry buff clones went for AttributesEx3, and
      the two cases are not the same trade. Flurry's clones are one-effect BUFFS whose entire shape is
      eight known scalars, so from-scratch costs nothing and the ledger's all-or-nothing rule applies
      cleanly. 946526 is a player-CASTABLE active: the generator exposes none of InterruptFlags,
      AuraInterruptFlags, Targets, SpellVisualID, DefenseType, PreventionType or StanceBarOrder, every
      one of which `template: 30823` supplies and a from-scratch row would silently zero. Trading one
      known 1-bit divergence for an unbounded set of unknown dropped columns on a spell the player casts
      is the worse deal - and a silently-broken cast is exactly the failure class this framework exists
      to prevent.
