# ---------------------------------------------------------------------------------------------
# REUSE LEDGER (spec §4.2). Substrate policy = druid Amendment A.3, "fidelity to the letter":
# reuse a shipped Vanilla clone ONLY where every value is identical to TBC. Reuse is
# ALL-OR-NOTHING per helper; any single difference makes it a fresh 946512+ clone.
# Both candidates were read out of the LIVE acore_world.spell_dbc, not assumed.
# ---------------------------------------------------------------------------------------------
reuse_ledger:

  932411:
    what: "Healing Way - the 3-stack +6% Healing-Wave-received buff"
    node: 20252
    verdict: FRESH
    verdict_history: >-
      REUSE in the original pass and the first fix round. Flipped to FRESH in the second fix
      round, when the ATTRIBUTE words were swept for the first time. Everything the original
      entry claimed about magnitude, stacks, duration, cooldown, proc fields and the carrier is
      unchanged and still correct - the entry simply made no attribute claim at all, and once
      made, the claim does not come out equal.
    evidence: >-
      Live clone 932411 vs wago 2.5.4 29203, field by field:
      MAGNITUDE - clone e1 aura 283 MOD_HEALING_RECEIVED raw basePoints 6 / DieSides 0 =
      EFFECTIVE +6%; TBC 29203 e1 raw basePoints 5 / DieSides 1 = EFFECTIVE +6%. EQUAL.
      STACKS - CumulativeAura 3 both. EQUAL.
      DURATION - DurationIndex 8 both = 15000 ms. EQUAL.
      COOLDOWN - RecoveryTime 0 both. EQUAL.
      PROC FIELDS - ProcTypeMask 0 both; the clone's ProcChance 101 against TBC's SpellAuraOptions
      row saying 0 is the DBC "not a proc" default (spec §2 encoding artifact), and neither era
      makes the BUFF a proc.
      CARRIER - TBC's 29203 is a bare SPELL_AURA_DUMMY (aura 4), which does NOTHING in 3.3.5a; the
      Vanilla clone already implements it as the live carrier aura 283 scoped by
      EffectSpellClassMaskA_1 = 64 = Healing Wave (confirmed against era-data/_ref/shaman-spells.yaml
      `"Healing Wave": flagsA 64`). That is precisely spec §2's "keep the live 3.3.5a carrier;
      author the TBC values into it" — a literal copy of 29203 would ship nothing at all
      (the Mangle-bleed trap). SpellClassSet 11. Description text is era-neutral
      ("Increases the amount healed by your Healing Wave spell by $s1%.").
      **ATTRIBUTES - NOT EQUAL, swept in the second fix round.** Measured: clone 932411 carries
      `Attributes 0 / AttributesEx 0 / AttributesEx2 0 / AttributesEx3 67108864 / Ex4..Ex7 0`;
      wago 2.5.4 SpellMisc 29203 carries `Attributes_0 = 327680`, `Attributes_3 = 262144`, rest 0.
      Decoded against AzerothCore\'s SharedDefines.h:
      TBC `Attributes` 327680 = 0x10000 **SPELL_ATTR0_NOT_SHAPESHIFTED** + 0x40000
      **SPELL_ATTR0_DO_NOT_SHEATH** (client only); the clone has neither.
      TBC `AttributesEx3` 262144 = 0x40000 **SPELL_ATTR3_ALWAYS_HIT**; the clone instead has
      0x4000000 **SPELL_ATTR3_CAN_PROC_FROM_PROCS**. So the two rows disagree in both directions
      on that word.
      DOES IT DISCRIMINATE? For `Attributes`, YES: `gen_era_talents.py:1134` exposes an
      `attributes:` helper scalar, so a fresh clone can be authored to TBC\'s 327680 while the
      reused id is stuck at 0. That alone engages the all-or-nothing rule. (`AttributesEx3` does
      NOT discriminate - the generator has no key for it, so fresh and reused both inherit
      whatever their template carries; it is recorded but is not the deciding field.)
      ON MATERIALITY - deliberately NOT the basis of this verdict. Inspected, the individual bits
      look inert for a proc-applied buff: DO_NOT_SHEATH is flagged client-only in the core enum;
      ALWAYS_HIT governs miss/dodge/parry/block, which a positive spell on a friendly target does
      not roll; NOT_SHAPESHIFTED gates the CASTER\'s form, and the shaman applying it is not in
      one. A materiality carve-out is exactly what produced the false Flurry REUSE one round
      earlier, so it is not being taken here.
      NOTE the carrier substitution is still SANCTIONED and is NOT the reason for the flip: TBC\'s
      29203 is a bare SPELL_AURA_DUMMY that does nothing in 3.3.5a, and re-expressing it as aura
      283 masked to Healing Wave is precisely spec §2\'s "keep the live 3.3.5a carrier, author the
      TBC values into it". That doctrine covers the AURA. It does not extend to attributes.
      CONCLUSION: mint a FRESH clone for node 20252. It is a one-field variation on 932411 -
      copy it and add `attributes: 327680`. The magnitude (+6%), `CumulativeAura 3`,
      `DurationIndex 8`, mask A 64 = Healing Wave and the aura-283 carrier all carry over verbatim.
      IF THE PHASE OWNER WANTS TO RELAX Amendment A.3 for provably-inert / client-only attribute
      bits, 932411 is the ONE candidate in this ledger that would come back as REUSE. That is a
      spec-level decision about the fidelity bar, not one this file is taking on its own.
    node_side_still_needed: >-
      The node's own three ranks are NOT reusable-by-implication: TBC 29206/29205/29202 are
      aura 109 SPELL_AURA_ADD_TARGET_TRIGGER at effective chance 33/66/100, mask A word0 = 64,
      EffectTriggerSpell 29203 -> must be re-pointed at 932411. All three are WAGO_ONLY
      (absent from 3.3.5a; WotLK flattened the talent into a plain aura 108 spellmod), so Task 8
      authors them fresh. Same aura-109 shape the druid Improved-Faerie-Fire fix used.

  932413:
    what: "Elemental Mastery - flat +100 crit, -100% cost"
    node: 20216
    verdict: FRESH
    evidence: >-
      Live clone 932413 vs wago 2.5.4 16166. The EFFECTS do match, exactly as spec §4.2 claimed:
