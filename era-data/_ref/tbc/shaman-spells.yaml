      `_ref/tbc/shaman-totems-tbc.yaml`'s Grace of Air / Windwall families and the `_ref.spells`
      entries in `era-data/tbc/shaman.yaml` were re-pointed in the same change. The shipped VANILLA
      nodes (18817 / 18821 / 18838) and clones (931330 / 931350) are UNTOUCHED and keep the word-C
      bits; a Vanilla character never receives a 947xxx pulse.
    task3_finding: >-
      Node 20222 Guardian Totems is LIVE_MATCH (16258/16293), i.e. its spellmods bind by family
      flag and will pick up whatever Plan 3b ships, so the gap closes IF and ONLY IF the Windwall
      clone carries the right family flags. Node 20226 Enhancing Totems is DIVERGED on magnitude
      (16259/16295: TBC EFFECT_1 and EFFECT_2 both aura 108 misc 8 at +8%/+15%; LIVE +5%/+10%,
