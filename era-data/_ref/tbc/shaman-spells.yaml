      `attributesEx` key was made by (its own comment records the TBC druid Improved Faerie Fire clones
      946277-946279 as the motivating case), and it would close this gap outright. Deliberately not done
      in the fix round: a second generator change, for a PvP-only bit, on top of the `ppm:` key the same
      task already added.
    note: >-
      The sibling finding on 946520 is NOT a gap and is recorded under fresh_clones[946520]
