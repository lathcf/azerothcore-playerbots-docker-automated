      pulse **947285** = **32768** (word-A bit15, SHARED with Stoneskin Totem Effect 8072).
      Evidence, all re-measured for the batch rather than inherited:
        * wago 2.5.4 `SpellClassOptions`: 8836 / 10626 / 25360 = 131072; 15108 / 15109 / 15110 /
          25576 = 32768; and 8072 Stoneskin = 32768 in wago AND live, so the sharing is TBC's own.
        * TBC's own talents already carry the masks the Plan-3a nodes emit: wago 16258/16293
          Guardian Totems EFFECT_1 `EffectSpellClassMask_0` = **32768**; wago 16259/16295 Enhancing
          Totems = EFFECT_1 **65536** (Strength of Earth) + EFFECT_2 **131072** (Grace of Air).
        * Live 3.3.5a still RESERVES both bits for these two deleted spells: 21891 "Earthfury Stat
          Totem" binds maskA **196608** (bit16|bit17), 21895 "Increased Totem Radius" binds
          **67362816** (bits 13,14,15,16,17,26), and 52456 / 16295 EFFECT_2 keep the residual
          **131072**. A sweep of all 50 011 records in `ip-dbc/Spell.dbc` finds word-A bit17 on
          exactly two family-11 spells - 32138 "Corrupted Air" and 32662 "Shadow Totem", NPC-side
          Grace of Air derivatives that kept the bit AND the icon - and word-A bit15 on nothing but
          the twelve Stoneskin ranks. The same sweep finds word-C bits 15/16 on ZERO family-11
          spells: the Vanilla bits are free, but invented.
        * Spec Amendment B.8 names scope and radius as "the ONLY two fields where the Vanilla shape
          is carried forward on purpose", and lists class-mask word 0 among the fields still
          authored to TBC.
      Per-node outcome, each VERIFIED against the emitted `spell_dbc` / `era_talent_effect` SQL:
        * **20222 Guardian Totems - NO EDIT.** `affects: [Stoneskin Totem Effect, Windwall Totem]`
          now resolves both names to word-A bit15, so the emitted mask is `a: 32768` (word c 0),
          byte-identical to stock/wago 16258/16293. It binds the Stoneskin clones 947010-947015 and
          the Windwall clones 947285-947287.
        * **20226 Enhancing Totems - NO EDIT.** Its Grace of Air effect now emits `a: 131072`,
          byte-identical to wago 16259/16295 EFFECT_2; the Strength of Earth effect keeps 65536.
        * **20248 Totemic Mastery - EDITED.** `affectsMask` word a gains bit17
          (100786176 -> **100917248**) and word c drops 98304 -> **0**. Windwall rides the bit15
          word a already carried for Stoneskin. Tranquil Air 947291 also joins this mask for free:
