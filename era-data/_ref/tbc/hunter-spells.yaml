# =================================================================================================
# BASELINE LEAKS — what a TBC hunter could buy or be granted that TBC did not have.
# =================================================================================================
baseline_leaks:
  no_talent_became_wotlk_baseline: >-
    Swept `trainer_spell` for every one of the 191 TBC hunter talent RANK-1 ids. **ZERO hits** — no
    TBC hunter talent became a WotLK baseline trained spell. No `kBaselineSpellGates` hunter row is
    needed. (Contrast priest Divine Spirit / paladin Consecration.)
  deterrence_19263:
    row: "TrainerId 7, ReqLevel 60, MoneyCost 2200, **ReqAbility1 = 932305** ('WotLK Hunter' marker)"
    problem: >-
      The marker gate was added by `2026_08_25_00_..._deterrence_gate.sql` for the Vanilla phase,
      and the current `CLASS_HUNTER` reconcile `else` arm grants 932305 to EVERY post-Vanilla
      hunter — so a **TBC** hunter holds 932305 today and can BUY stock Deterrence while the TBC
      tree offers it as a talent.
    disposition: "**marker-gate (Task 5).** The three-way marker chain (spec §4a) fixes it: the `else` arm narrows to `era >= ERA_WOTLK`, so a TBC hunter no longer holds 932305. NO trainer SQL change is needed for this row — only the reconcile arm."
  scorpid_sting_3043:
    row: "TrainerId 7, ReqLevel 22, MoneyCost 6000, **ReqAbility1 = 932305**"
    problem: "Same shape: a TBC hunter currently holds 932305 and can buy stock 3043 (the -3% WotLK version)."
    disposition: "**marker-gate (Task 5)** for the same reason, PLUS a new TrainerId-7 row for the TBC clone behind the new 948280 marker at the same cost 6000. This completes the per-era clone pattern (lesson 17e) — never an OR-gate on one shared row."
  aimed_shot_r2_r7:
    rows: "20900/20901/20902/20903/20904/27065 (+ WotLK 49049/49050)"
    disposition: "**self-gating.** `20900.ReqAbility1 = 19434`, and a TBC hunter is granted the era clone at r1, never stock 19434. Nothing to delete, nothing to re-gate."
  trueshot_r2_r4:
    rows: "NONE EXIST"
    disposition: "**none.** There is no stock Trueshot trainer row at any level."
  counterattack_r2_r4:
    rows: "20909/20910/27067 (+ WotLK 48998/48999)"
    disposition: "**self-gating** on `20909.ReqAbility1 = 19306`."
  wyvern_sting_r2_r4:
    rows: "24132/24133/27068 (+ WotLK 49011/49012)"
    disposition: "**self-gating** on `24132.ReqAbility1 = 19386`."
  orphaned_higher_rank_check:
    ran: true
    result: >-
      **Zero deletions proposed, therefore zero orphans possible.** The framework check
      (`SELECT ts.SpellId ... WHERE ts.ReqAbility1 IN (<deleted ids>)`) has an empty input set for
      this phase. Every WotLK-only rank — Aimed Shot 49049/49050, Counterattack 48998/48999, Wyvern
      Sting 49011/49012 — stays reachable for a native WotLK hunter, because their prerequisite
      chains are untouched.
  ip_cast_cancel_lists:
    file: "azerothcore-wotlk/modules/mod-individual-progression/src/IndividualProgressionPlayer.cpp"
    enclosing_condition_verbatim: |
      void OnPlayerSpellCast(Player* player, Spell* spell, bool /*skipCheck*/) override
      {
          if (!sIndividualProgression->enabled || !player || !player->IsInWorld() || !spell)
              return;

          if (sIndividualProgression->isBotAccount(player)) // bots don't cast lower ranks of spells
              return;

          if (sIndividualProgression->EnableAllSpellRanks)
              return;

          if (!sIndividualProgression->hasPassedProgression(player, PROGRESSION_TBC_TIER_5) || player->GetLevel() < 70) // no need to check spells if player is not in WotlK
              return;
    hunter_lists:
      - "`Hunter_SM_1_4` (SchoolMask 1 or 4) — 34 ids: Aimed Shot 19434/20900-20904, Counterattack 19306/20909/20910, Explosive Trap, Immolation Trap, Mongoose Bite, Multi-Shot, Raptor Strike ranks."
      - "`Hunter_SM_8_16_64` (SchoolMask 8/16/64) — 37 ids: Serpent Sting, Arcane Shot, Mend Pet, Hunter's Mark, Volley, **Wyvern Sting 19386/24132/24133**, Freezing Trap, Scare Beast ranks."
    ruling: >-
      **Fires ONLY for a WotLK-stage player.** The guard requires
      `hasPassedProgression(player, PROGRESSION_TBC_TIER_5)` AND `GetLevel() >= 70`; a TBC-stage
      character fails the first test and returns before any list is walked. It also early-returns
      for bot accounts. Every id in both lists is a STOCK id, so the TBC era clones are not named
      anyway — but the enclosing condition is the reason it cannot matter, and it is quoted here
      verbatim per lesson 15. **No interaction with this phase.**
  devouring_plague_style_items:
    result: "NONE. The trainer-gating intent test (a `trainer_spell` row is a hole only if IP itself gates that spell somewhere and a missed set leaks it) finds no hunter analog — the only IP-gated hunter surface is the cast-cancel list above, which gates nothing at TBC stage."
  trainer_sets_audit:
    result: >-
      Hunter has exactly TWO `trainer` rows with `Requirement = 3` — **Id 7** (the full 148-row
      trainer) and **Id 8** (a five-row starter trainer: 1494 Track Beasts, 1978 Serpent Sting,
      13163 Aspect of the Monkey, 1130 Hunter's Mark, 3044 Arcane Shot, levels 2-6). Id 8 contains
      no talent-rooted or era-relevant row, so the paladin-style "IP gated set 3 but the factory
      unions all sets" hole does not exist for hunter.
  quest_taught_check:
    result: >-
      Checked for the shaman analog (commit 8129c5b — Stoneskin/Searing/Healing Stream are
      quest-taught and have NO trainer row, so the reconcile must GRANT the era clone rather than
      rely on a trainer gate). **NO hunter analog.** Every stock spell this phase's clones replace
      has a `trainer_spell` row on TrainerId 7 (Aimed Shot r2+, Counterattack r2+, Wyvern Sting
      r2+, Deterrence, Scorpid Sting) or is talent-granted (Aimed Shot r1, Counterattack r1, Wyvern
      Sting r1, Bestial Wrath, The Beast Within, Trueshot Aura, Readiness, Silencing Shot, Scatter
      Shot, Intimidation). Nothing is quest-taught.

# =================================================================================================
# WHERE THIS FILE CONTRADICTS THE SPEC'S SECTION 3/4 BUCKETS.
# **NUMBERING WARNING (2026-09-04 review round):** these are `C1`-`C15`, THIS FILE's own finding
# numbers. They were originally written as `A.1`-`A.15` and were renumbered because the spec's
# Amendment A now exists with its OWN A.1-A.15 and the two sets do NOT line up (e.g. this file's
# C1 "hunter tooltips ARE cached" has no spec counterpart, while spec A.1 is the Scorpid Sting
# decision). **Cite the SPEC's A.x for decisions and this file's Cx for findings.**
# =================================================================================================
spec_bucket_contradictions:
  - id: C1
    spec_says: "§1 — 'Hunter tooltips are NOT yet cached under era-data/_ref/tbc/tooltips/'."
    reality: "They ARE. 1425 tooltip JSONs are present and every hunter id checked resolved, with three exceptions (3043, 34456, 34471, none of which has a cached file). Task 2's `--fetch` should still run to fill the gaps, but the statement is stale."
  - id: C2
    spec_says: "§3c — 'Bestial Swiftness' is a likely GRANT."
    reality: >-
      **DIVERGED.** TBC 19596 is the Classic owner-SPELLMOD shape (`SPELLMOD_ALL_EFFECTS +30`
      masked to Tamed Pet Passive 04 19582) with `SPELL_ATTR0_ONLY_OUTDOORS`; live 19596 "Boar's
      Speed" is a direct `aura 31` with the outdoor flag dropped. AUTHOR, not grant. This also
      answers the Vanilla `_ref`'s long-standing `grants.boars_speed` UNRESOLVED, and can CLOSE
      Vanilla accepted gap 2 for TBC.
  - id: C3
    spec_says: "§3c — 'Improved Feign Death' is a likely GRANT (inert on this core either way)."
    reality: >-
      **ID REPURPOSING.** Live 19286/19287 are 'Survival Tactics', a different talent with a
      Disengage/Feign-Death cooldown half and a wider mask. Granting stock ships the WRONG TALENT,
      not merely an inert one. AUTHOR. (The inertness gap still carries — accepted gap 1.)
  - id: C4
    spec_says: "§3c — 'Thick Hide, Endurance Training, Ferocity, Frenzy, Bestial Discipline, Unleashed Fury' are likely grants."
    reality: >-
      Five of six confirmed LIVE_MATCH -> GRANT. **Unleashed Fury is DIVERGED**: TBC is
      +4/8/12/16/20% pet damage, live is +3/6/9/12/15%. AUTHOR.
  - id: C5
    spec_says: "§3c — 'Improved Mend Pet' is a likely GRANT."
    reality: >-
      Confirmed GRANT, but for a non-obvious reason worth recording: TBC's own encoding
      (`aura 112 OVERRIDE_CLASS_SCRIPTS misc 4086`) is INERT on this core (aura 112 is
      HandleNoImmediateEffect and no handler exists for those misc values), while live's aura-4
      DUMMY is the working re-implementation at the SAME 25/50% magnitudes. The verdict is DIVERGED
      on family A and the disposition is still GRANT. Lesson 3.
  - id: C6
    spec_says: "§3c — 'Hawk Eye' is a likely GRANT."
    reality: >-
      LIVE_MATCH on all fourteen families, so GRANT is defensible — but its SPELLMOD_RANGE mask
      reaches Aimed Shot through the stock 0x20000 bit, which the era clone drops. A granted stock
      Hawk Eye will not extend the era Aimed Shot's range. Accepted gap 5, or AUTHOR.
  - id: C7
    spec_says: "§3a — 'Rapid Killing ... mask must reach the Aimed Shot clone'."
    reality: >-
      The TALENT (34948/34949) is LIVE_MATCH and its mask targets Arcane Shot + Rapid Fire, not
      Aimed Shot. It is the **triggered BUFF (35098/35099)** whose mask reaches Aimed Shot. Grant
      the talent, clone the buff. Same correction applies to Master Tactician (talent authored for
      ProcChance, buffs 34833-34837 cloned for the mask).
  - id: C8
    spec_says: "§3a — 'Careful Aim ... if it masks'."
    reality: "It does NOT mask Aimed Shot (its mask is Multi-Shot's 0x1000) and the mask is INERT anyway on an `aura 212`. Answered NO."
  - id: C9
    spec_says: "§3a — 'Go for the Throat ... stock triggers if values match' and 'Thrill of the Hunt' unlisted disposition."
    reality: >-
      Both are DIVERGED on the DBC but their divergences are NEUTRALISED by negative-id
      `spell_proc` rows the DBC sweep cannot see (lesson 18): `-34950` and `-34497` both force
      crit-only. GRANT both; a clone would LOSE the crit gate and fire on every hit.
  - id: C10
    spec_says: "§4d — 'Ferocious Inspiration ... Task 3 establishes how stock 34455 reaches the pet ... and whether a granted stock passive registers for a non-talent-frame learn'."
    reality: >-
      Answered on both counts, and the answer forces a RECONSTRUCTION: a granted stock passive DOES
      register (see pet_aura_census), but the stock rows point at the WotLK payloads
      75593/75446/75447 which are LIVE_ONLY, and **TBC's own two payload ids (34457 the pet proc
      carrier, 34456 the party buff) are BOTH WAGO_ONLY.** Neither exists on this server. Both must
      be authored, with a hand `spell_proc` row for the carrier.
  - id: C11
    spec_says: "§4e — 'The \"only while Hawk\" gate is expressed in data first (`casterAuraSpell` / aura-state); a script (and DUMMY misc 19) only if data cannot gate it'."
    reality: >-
      **There is no gate to express.** The Quick Shots proc lives on Aspect of the Hawk 13165's own
      e2 (`aura 42 -> 6150`), governed by the `-13165` proc row; Improved Aspect of the Hawk is a
      pure SPELLMOD onto it and is LIVE_MATCH on all five ranks. GRANT stock. **DUMMY-marker misc
      19 is NOT consumed by this phase.**
  - id: C12
    spec_says: "§4f — 'Readiness (its core handler resets cooldowns by family/attribute ...)'."
    reality: >-
      Confirmed a FAMILY walk (so band clones are covered), but with a THREE-ID EXCLUSION LIST that
      makes a naive clone-plus-rebind actively broken: the clone would clear its own cooldown
      because `SendSpellCooldown()` runs before the effect handlers. Needs a module script, not a
      `scriptBindings:` entry. See core_hardcodes.readiness.
  - id: C13
    spec_says: "§3b — 'Trueshot Aura flat +RAP r1-r4' listed alongside other retunes."
    reality: >-
      Stronger than a retune: **r2/r3/r4 (20905/20906/27066) do not exist on this server at all**
      and there are ZERO stock Trueshot trainer rows. This is the phase's only fully-absent trained
      chain, and its TBC levels (40/50/60/70) had to come from wago `SpellLevels`.
  - id: C14
    spec_says: "§3b — 'Trap Mastery 19376/19377 (WotLK repurposed)' listed once."
    reality: >-
      TBC has **TWO separate trap-improvement talents**: node 20648 Clever Traps (19239/19245,
      both WAGO_ONLY, duration + damage) and node 20651 Trap Mastery (19376/19377, a resist-miss
      spellmod; 19377 WAGO_ONLY). Live 19376 'Trap Mastery' is WotLK's merge of the two. Both nodes
      are RECONSTRUCT/AUTHOR.
  - id: C15
    spec_says: "§4c — 'Wyvern Sting r2-r4 (19386/24132/24133/27068 — sleep + trained DoT ranks)'."
    reality: >-
      Correct, plus the DoT chain is FOUR more clones (24131/24134/24135/27069 at 50/70/100/157 per
      tick). The DoT ranks are never trained — they need a `spell_ranks` chain so `GetRank()`
      resolves, but no trainer rows.

