# TBC (2.4.3) HUNTER stock-spell reference — the LIVE-VERIFIED fourteen-family survival map,
# triggered-chain map, spell_proc / spell_script_names / spell_pet_auras census, capstone +
# trained-rank chain resolution, trainer cost curve, core family-flag/id hardcode table, free
# family-9 identity-bit census, Vanilla-helper reuse ledger and baseline-leak list for Plan Task 3
# of the TBC Phase 7 (Hunter) plan.
#
# Era-scoped. The era-less `era-data/_ref/hunter-spells.yaml` is VANILLA-verified (1.12.1 vs
# 3.3.5a); its MAGNITUDES must not be inherited. Its family-9 IDENTITY-MASK table (`spells:`),
# `trapEffects:`, `petAbilities:` and `petPassiveCarriers:` ARE era-neutral (they describe the LIVE
# 3.3.5a store, which both eras share) and are TRANSCRIBED VERBATIM below — and re-verified
# id-by-id against the running server — because the GENERATOR resolves an
# `affects: ["Aimed Shot"]` in era-data/tbc/hunter.yaml against the `spells:` key of the `_ref`
# the DATASET embeds, i.e. against THIS file. A human-readable "see the other file" is not enough.
# RE-VERIFICATION RESULT (2026-09-04): all 58 transcribed rows matched
# SpellClassSet/SpellClassMask_1/_2/_3 exactly against the running server's Spell.dbc
# (md5 49c9c5f53e8974c27d67635384725f46) — ZERO mismatches.
#
# Class 3, spell family 9 (SPELLFAMILY_HUNTER). Note the class-id/family-id inversion with
# warlock (class 9 / family 5). Hunter spells cost MANA; TBC uses FLAT `ManaCost` almost
# everywhere and 3.3.5a converted nearly every hunter ability to `ManaCostPct` (percent of base),
# which is a systematic divergence family E — it is NOT a magnitude finding on its own, but where
# BOTH sides are percent and the percentages differ (Scorpid Sting 9->11, Intimidation 6->8,
# Scatter Shot 6->8, Bestial Wrath 10->12) it is a real era difference.
#
# Produced by Plan Task 3, 2026-09-04. Authority chain: wago 2.5.4.44833 component tables for TBC
# structure+magnitudes, the cached Wowhead TBC tooltips (era-data/_ref/tbc/tooltips/) for behaviour
# the tables cannot express, the LIVE 3.3.5a server (Spell.dbc + the acore_world.spell_dbc overlay
# + the proc/script/pet-aura/trainer tables + the fork's C++) for what this core actually has.
# Where this file and the spec's Section 3 buckets disagree, THIS FILE WINS — see
# `spec_bucket_contradictions:`.

era: 1
class: 3
family: 9
familyName: 9

# The FOURTEEN verdict families + one supplementary — the standing sweep column list, carried over
# from era-data/_ref/tbc/warrior-spells.yaml, re-verified against tools/spell_dbc_columns.txt and
# the printed wago headers before use (headers were printed for all fourteen CSVs first).
families_compared:
  A_effects: >-
    per slot: Effect, EffectAura, EFFECTIVE base points, EffectMiscValue_0(->live
    EffectMiscValue_N), EffectMiscValue_1(->live EffectMiscValueB_N), EffectTriggerSpell,
    EffectAuraPeriod, EffectRadiusIndex_0, EffectMechanic, EffectChainTargets,
    EffectRealPointsPerLevel (float, 4 dp), ImplicitTarget_0(->ImplicitTargetA_N),
    ImplicitTarget_1(->ImplicitTargetB_N). 101 of the 162 DIVERGED verdicts have at least one
    A-family hit.
  B_proc_options: >-
    ProcChance, ProcCharges, ProcTypeMask (wago ProcTypeMask_0), CumulativeAura (wago
    SpellAuraOptions). A missing wago row opposite a live "not a proc" default (chance 0/101,
    charges 0, mask 0, stack 0) is filtered; where LIVE really IS a proc the difference IS printed
    as `B:ProcRow TBC(no SpellAuraOptions row)->LIVE(...)` — THREE hits: 19287 (the repurposed
    'Survival Tactics'), 19591 Tamed Pet Passive 06, 13163 Aspect of the Monkey. This family is
    what separates Master Tactician (TBC ProcChance 6 -> live 10), Concussive Barrage (2/4 -> 50/100)
    and Entrapment (8/16/25 -> 100) from LIVE_MATCH.
  C_misc: >-
    DurationIndex, CastingTimeIndex, RangeIndex, SchoolMask, Speed (float), and ALL EIGHT
    attribute words (wago SpellMisc.Attributes_0..7 vs live Attributes/AttributesEx..Ex7). Every
    attribute difference is hand-adjudicated in `attribute_divergences:`. It is what found Bestial
    Wrath's 10 s -> 18 s and Wyvern Sting's 30 s -> 12 s.
  D_categories: >-
    Category, DefenseType, DispelType, Mechanic, PreventionType, StartRecoveryCategory (wago
    SpellCategories). It is what found Aimed Shot's Category 2 -> 85 and the whole ASPECT family's
    Category 0 -> 47 (the WotLK shared aspect cooldown), plus Silencing Shot going off the GCD
    (StartRecoveryCategory 133 -> 0).
  E_power: >-
    ManaCost, ManaCostPct, ManaPerSecond, PowerType (wago SpellPower OrderIndex 0). Systematic:
    TBC flat -> live percent. Real magnitude hits (both sides percent): Scorpid Sting 9->11,
    Intimidation 6->8, Scatter Shot 6->8, Bestial Wrath 10->12.
  F_class_options: >-
    SpellClassSet and the spell's OWN identity mask WORD 0 only (words 1-3 excluded as cross-build
    encoding noise, per the shaman A.12 / warrior / rogue precedent). EXACTLY ONE divergence in the
    whole 301-id set — Immolation Trap Effect 13797 (TBC ownMask word0 0x4 -> LIVE 0x0; live moved
    its identity to word2 0x20000). SpellClassSet never differs. Read `family9_bit_census:` before
    decoding any mask.
  G_cooldowns: >-
    RecoveryTime, CategoryRecoveryTime, StartRecoveryTime (wago SpellCooldowns). It is the ONLY
    family that separates Readiness 23989 (TBC 5 min -> live 3 min) from LIVE_MATCH, and it carries
    Aimed Shot's 6 s -> 10 s and Wyvern Sting's 2 min -> 1 min.
  H_aura_restrictions: >-
    CasterAuraState, TargetAuraState, ExcludeCasterAuraState, ExcludeTargetAuraState,
    CasterAuraSpell, TargetAuraSpell, ExcludeCasterAuraSpell, ExcludeTargetAuraSpell. TWO
    divergences, both on BASELINE spells (1495 Mongoose Bite CasterAuraState 1 -> 0, 34026 Kill
    Command CasterAuraState 10 -> 0); ZERO on any talent-reachable id. Counterattack's
    CasterAuraState 7 is identical on both sides, which is a real finding — the parry-window gate
    survives into 3.3.5a and the era clone inherits it.
  I_shapeshift: >-
    ShapeshiftMask, ShapeshiftExclude. ZERO divergences across all 301 ids, and zero non-zero
    values on either side — hunter has no forms. A real finding, not a missing column: the sweep
    compares both fields unconditionally (defaulting a missing wago SpellShapeshift row to 0) and
    would print an `I:` line; grepping the output for `I:` returns nothing.
  J_levels: >-
    BaseLevel, MaxLevel, SpellLevel (wago SpellLevels). It CONFIRMS every TBC trained rank level
    independently of the trainer table — see `capstone_chains:`. It is also what proves Deterrence
    moved from level 20 to level 60 and Scatter Shot from 30 to 15.
  K_equipped_item: >-
    EquippedItemClass, EquippedItemSubclass, EquippedItemInvTypes. ONE divergence — Deterrence
    19263 (TBC -1/0 -> live class 2 / subclass 173555, i.e. WotLK bolted a weapon-equip
    requirement onto it) — plus baseline Disengage 781. The default for a missing wago
    SpellEquippedItems row is EquippedItemClass -1, matching the DBC convention.
  L_interrupts: >-
    InterruptFlags, AuraInterruptFlags, ChannelInterruptFlags. FIVE divergences, all
    AuraInterruptFlags 0x2 -> 0x480002 on the Wyvern Sting sleep chain (19386/24132/24133/27068),
    Scatter Shot 19503 and Freezing Trap Effect 3355 — WotLK widened the take-damage break rule.
    Load-bearing for the Wyvern Sting clone. (Six hits including 3355; the five that matter are the
    talent-reachable ones.)
  M_targets: >-
    Targets, TargetCreatureType, MaxTargets, MaxTargetLevel (wago SpellTargetRestrictions). EXACTLY
    ONE divergence across all 301 ids, and it is on a BASELINE triggered spell — 42243 "Volley"
    (TBC Targets 64 -> LIVE 0). ZERO on any talent-reachable id. Hand-checked against the rows that
    carry a non-zero value on either side (19577 Intimidation TargetCreatureType 1, 34692 The Beast
    Within TargetCreatureType 1, 136 Mend Pet TargetCreatureType 1 — identical on both sides).
  N_identity: >-
    wago SpellName.Name_lang vs the live DBC Name_Lang_enUS — the ID-REPURPOSING detector.
    **FIFTEEN ids are renamed live** (recounted from the file in the 2026-09-04 review round; the
    first draft said TEN). **ELEVEN** are the cosmetic "Tamed Pet Passive (DND)" -> "Tamed Pet
    Passive NN (DND)" numbering (8875, 19580, 19581, 19582, 19589, 19591, 20782, 20784, 34666,
    34667, 34675) and ONE is the trap-effect suffix drop (13797 "Immolation Trap Effect" ->
    "Immolation Trap"). The remaining THREE are the real hazards:
    **19286 and 19287 'Improved Feign Death' -> 'Survival Tactics'**, and 19596 'Bestial Swiftness'
    -> "Boar's Speed". Nothing else in the sweep would have flagged either. See `id_repurposing:`.
  O_effect_class_masks: >-
    Per-effect EffectSpellClassMask words 0/1/2, compared as a SUPPLEMENTARY pass whose result is
    recorded in `effect_class_mask_diffs:` and deliberately does NOT feed the verdict. **43 hits, of
    which SIX are load-bearing** rather than encoding drift (Savage Strikes, Efficiency, Mortal
    Shots, Hawk Eye, Rapid Killing's buff, Improved Stings) — **plus ONE load-bearing mask that is
    NOT a hit at all**: the Master Tactician buffs 34833-34837 carry Aimed Shot's 0x20000
    identically on both sides, so the O pass reports nothing while the mask still fails to reach
    the era clone. Together they are the reason the Aimed Shot identity question has a per-talent
    answer — read that section AND
    `aimed_shot_identity:` before granting ANY spellmod that reads LIVE_MATCH.

method:

  conventions:

    effect_slot_numbering: >-
      THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/Effect_2/Effect_3,
      i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is DBC
      slot 1. Wherever a core-source token appears (script_census, core_hardcodes) it is written
      `EFFECT_n (0-based core enum; = this map's e<n+1>)`. Never translate one to the other by name.

    magnitudes_are_effective: >-
      EVERY magnitude in this file (`val<N>` in a `tbc:` line, and both sides of every `diff:`
      effect tuple) is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides == 1` and
      `basePoints` when DieSides is 0 (SpellEffectInfo::CalcBaseValue). Both sides of every
      comparison are normalised the same way before diffing, so a clone or live row that moved the
      +1 into DieSides does not read as a divergence. Raw figures, where quoted, say "raw".
      Anchor re-measured on this id set: Scorpid Sting 3043 TBC raw basePoints **-6** / DieSides 1
      = effective **-5**, against live raw **-4** / DieSides 1 = effective **-3** — matching the
      TBC tooltip's "-5% chance to hit" and the WotLK tooltip's "-3%".

    mana_is_flat_in_tbc: >-
      TBC hunter abilities carry a FLAT `SpellPower.ManaCost`; 3.3.5a converted almost all of them
      to `ManaCostPct`. Eleven `E:ManaCost TBC<n>->LIVE0` lines and six `E:ManaCostPct TBC0->LIVE<n>`
      lines in the sweep are that conversion and are NOT magnitude findings. Where BOTH sides are
      percent the comparison IS meaningful: 3043 (9 -> 11), 19577 (6 -> 8), 19503 (6 -> 8),
      19574 (10 -> 12). An era clone authors the TBC FLAT cost with `manaCostPct: 0`.

    verdict_vocabulary: >-
      LIVE_MATCH = every compared field in the fourteen verdict families agrees. DIVERGED = at
      least one compared field differs. WAGO_ONLY = present in TBC 2.5.4, ABSENT from the live
      3.3.5a store (Spell.dbc AND the acore_world.spell_dbc overlay) — must be authored, never
      granted. LIVE_ONLY = present live, absent from TBC — must not be reachable by a TBC hunter.
      LIVE_MATCH_UNVERIFIED_SLOT = every compared field agrees but LIVE carries an EXTRA populated
      effect slot with no wago counterpart; those are enumerated under `unverified_slots:` on the
      entry and adjudicated in `live_extra_slot_adjudication:`.
      ABSENT_BOTH = used only in `triggers:` — the id exists in NEITHER wago 2.5.4 NOR the 3.3.5a
      store, i.e. a dangling `EffectTriggerSpell` that fires nothing (18350 is the only case).
      It is NOT a survival_map verdict: the sweep tests live presence first, so such an id would be
      mis-labelled WAGO_ONLY there — which is why 18350 carries an explicit note on its entry. **A LIVE_MATCH verdict does NOT mean
      "safe to grant"** — the supplementary per-effect class-mask pass (family O) is excluded from
      the verdict and found seven load-bearing divergences on otherwise-LIVE_MATCH spells.

    tbc_line_is_authoritative: >-
      Every survival_map entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record an author
      needs to reproduce the spell (per-effect tuple incl. effect class masks and implicit targets,
      plus duration/cast/range/school/proc/power/cooldown/category/mechanic/preventionType/
      aura-restriction/shapeshift/equip/level/interrupt/target/family/ownMask and every non-zero
      attribute word). Tasks 6-8 author FROM THIS LINE; they do not need to re-fetch wago. Where a
      field is absent from the line it is zero in TBC. LIVE_ONLY entries carry no `tbc:` line by
      construction.
      **Ids with NO wago SpellClassOptions row** (so their `tbc:` line shows `(no SpellClassOptions
      row)` and family F is skipped rather than compared): 19295/19297/19298/19300/19301
      Deflection, 19410 Improved Concussive Shot stun, 19229 Improved Wing Clip root, 19185
      Entrapment root, 19577 Intimidation, 24394 Intimidation stun, 19426-19431 Lethal Shots,
      19507-19510 Ranged Weapon Specialization, 19168-24297 Lightning Reflexes, 19370-19373 Killer
      Instinct, 24293-24295 Monster Slaying, 19151-19153 Humanoid Slaying, 19578/20895/19579/24529
      Spirit Bond, 34501 Expose Weakness payload, 34952/34953 Go for the Throat energize,
      35060/35061 Focused Fire pet auras. Every one of these is genuinely family-0 LIVE as well
      (checked id-by-id), EXCEPT **19577 Intimidation**, whose LIVE record is family 9 with
      ownMask (0,0,0x8) — a missing row, not a family change. A clone of 19577 MUST carry
      `family: 9` + `maskC: 8`.

    duration_and_cast_indices_decoded: >-
      Decoded from the running server's SpellDuration.dbc / SpellCastTimes.dbc / SpellRange.dbc /
      SpellRadius.dbc (extracted from the same container as Spell.dbc), never from memory:
      DurationIndex 1=10s, 3=60s, 4=120s, 5=300s, 8=15s, 9=30s, 18=20s, 21=permanent(-1),
      27=3s, 28=5s, 29=12s, 31=8s, 32=6s, 35=4s, 39=2s, 85=18s, 165=7s.
      CastingTimeIndex 1=0ms, 14=3000ms, 18=-1000000 (the "next ranged attack" sentinel),
      **19=2500ms**. RangeIndex 1=0, 2=5yd, 6=100yd, 11=15yd, 13=50000yd, 114=35yd.
      EffectRadiusIndex 9=20yd, 10=30yd, 11=45yd, 12=100yd, 13=10yd, 23=40yd, 47=15yd.
      **TBC Aimed Shot is a 2.5 s cast (CastingTimeIndex 19), not 3 s** — the shipped Vanilla clone
      chain 932952-932957 uses index 14 = 3000 ms.

  live_dbc:
    source: /azerothcore/env/dist/data/dbc/Spell.dbc inside the running ac-worldserver
    md5: 49c9c5f53e8974c27d67635384725f46
    live_verified: >-
      The worldserver's DBC and the repo's azerothcore-wotlk/ip-dbc/Spell.dbc return the IDENTICAL
      md5 (49c9c5f53e8974c27d67635384725f46, 53466210 bytes) — NO client/server generation
      mismatch, so the sweep's live side is the store the worldserver actually runs. This is the
      same md5 the shaman/warrior/rogue/priest phases recorded. `docker cp` fails on this image
      ("read-only file system"); the working extraction is
      `docker exec ac-worldserver cat <path> > out`.
  db_overlay: >-
    The DBC on disk is not the whole live store: acore_world.spell_dbc REPLACES records at load.
    A full `SELECT ... WHERE SpellClassSet=9` over the overlay was run (see
    `aimed_shot_identity.overlay_census`); it contains 15 stock-id overrides plus this module's own
    era rows, and NONE of it changes a verdict in this map (no id in the 301-id set is
    overlay-only). The Vanilla Aimed Shot clones 932952-932957 do NOT appear in that query because
    they carry SpellClassSet 0 — the family-0 escape.
  tbc_source: >-
    wago 2.5.4.44833 — SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellClassOptions,
    SpellCategories, SpellCooldowns, SpellAuraRestrictions, SpellShapeshift, SpellLevels,
    SpellEquippedItems, SpellInterrupts, SpellTargetRestrictions, SpellName (the fourteen the plan
    lists). Headers were printed and verified before use. Tooltips read from the already-cached
    era-data/_ref/tbc/tooltips/<id>.json (the spec says hunter tooltips are not cached — that is
    STALE: 1425 tooltip files are present and every hunter id checked resolved, EXCEPT 3043,
    34471 and 34456, which have no cached file).

  corrections_to_the_plan_script:
    live_column_names: >-
      As the warrior and rogue files record, `tools/spell_dbc_columns.txt` spells the spell's OWN
      identity words `SpellClassMask_1/_2/_3` (1-based) — there is no `SpellClassMaskA`. wago
      `SpellClassMask_0` (word 0) maps to live `SpellClassMask_1`. The warrior plan's script uses
      `cols["SpellClassMaskA"]`, which does not exist in this column file; corrected here.
      Verified again on this id set.
    effect_class_mask_column_mapping: >-
      Carried over from the rogue file (spec Amendment A.12 / lesson 19) and re-applied verbatim:
      the live column names `EffectSpellClassMaskA_1/A_2/A_3/B_1/.../C_3` read as if A/B/C were the
      three WORDS and _1/_2/_3 the three EFFECTS. They are the OTHER WAY ROUND: **A/B/C = the
      EFFECT index and _1/_2/_3 = the WORD index**. Effect 1's three mask words are
      (EffectSpellClassMaskA_1, EffectSpellClassMaskA_2, EffectSpellClassMaskA_3). Independent data
      anchor re-measured on THIS set: stock Efficiency 19416, whose TBC effect-1 mask is
      (0x7fa00, 0x1081, 0) and whose live A_1/A_2/A_3 are 0x7fa00 / 0x88801081 / 0x1 — the word-0
      halves line up exactly, which they cannot under the transposed reading.
    float_columns: >-
      Speed, EffectRealPointsPerLevel_N, EffectMultipleValue_N, EffectPointsPerCombo_N are unpacked
      as FLOATS and rounded to 4 dp. Load-bearing for exactly one entry here: baseline Disengage
      781, whose TBC knockback carries EffectRealPointsPerLevel -3.0. An int32 unpack reports that
      as garbage.
    base_points_convention: >-
      Carried over unchanged from the shaman/warrior/rogue/priest refs and re-verified on this id
      set: wago 2.5.4 stores EffectBasePoints in the SAME raw (value-1) convention as the 3.3.5a
      DBC, so the comparison normalises BOTH sides to the effective value. Anchors: TBC Careful Aim
      34482 raw 14 / DieSides 1 = 15%, matching the TBC tooltip; TBC Scorpid Sting 3043 raw -6 /
      DieSides 1 = -5%.
    duration_index_noise_filter: >-
      A DurationIndex disagreement confined to {0, 21} (both mean permanent) is filtered. ZERO
      entries in this id set were filtered by it.

  noise_filters_applied:
    - "A live slot with NO wago SpellEffect row is reported under `unverified_slots:` on the entry
       and downgrades the verdict to LIVE_MATCH_UNVERIFIED_SLOT rather than DIVERGED (DB2 stores no
       empty-effect row, so an absent row is weak evidence of a zero). **43 slots across 39 ids**
       hit this (recounted from the file, 2026-09-04 review round: 4 ids carry two slots each —
       13163, 19376, 19559, 19560). **Every one of the 39 ids is enumerated in
       `live_extra_slot_adjudication:`**, in three buckets: TEN change a disposition, four are
       already-DIVERGED or already-cloned ids where the slot changes nothing, and five are BASELINE
       spells no era talent clones."
    - "A missing wago SpellAuraOptions row opposite the live 'not a proc' default (ProcChance 101
       or 0 / charges 0 / mask 0 / stack 0). Where TBC has no row and LIVE really IS a proc, the
       difference IS printed — three hits (19287, 19591, 13163)."
    - "NOTHING in the attribute words is filtered. All eight are compared verbatim; every
       difference is hand-adjudicated in `attribute_divergences:` with the AzerothCore bit name."
    - "Per-effect class masks are excluded from the VERDICT only (families_compared.O); all 43
       differences are recorded in full under `effect_class_mask_diffs:`."
    - "For SpellClassOptions the SWEEP skips the comparison entirely when the wago row is missing
       (so family F never fires a false positive). The affected ids are enumerated in
       method.conventions.tbc_line_is_authoritative; only 19577 Intimidation is a hazard."

