  id_set_construction: >-
    Seed = all 191 distinct rank spells across the 64 skeleton nodes, plus the ids the plan names
    (Aimed Shot r2-r7, Trueshot r2-r4, Counterattack r2-r4, Wyvern Sting r2-r4 + the stock DoT,
    3043, the payload candidates 6150/34456/34471/34501/34837/34952/34953, the roots
    19229/19410/19185, the Spirit Bond talents+carriers, three Tamed Pet Passive carriers, and the
    Aspect of the Hawk rank chain). Closure = TRANSITIVE over EffectTriggerSpell on BOTH sides
    (wago and the live DBC), re-run after every extension until it added nothing.
    FOUR EXTENSIONS were made during the task, each of which the closure alone would have missed —
    this is the hunter analog of the rogue phase's poison chain (lesson 17a):
      * **spell_pet_auras edges.** `spell_pet_auras` is NOT an EffectTriggerSpell edge; the link is
        owner-spell -> row -> pet-side payload, resolved at aura-apply time in C++. Adding the six
        payloads named by the live rows (34457 was found from the TBC side, 35060/35061, 68361,
        75593/75446/75447) is what produced the single most important finding in this map: the TBC
        Ferocious Inspiration delivery chain (34457 -> 34456) is **entirely WAGO_ONLY**, while the
        live rows point at WotLK payloads that are **LIVE_ONLY**.
      * **the nine family-9 pet passive CARRIERS** (20782, 8875, 19582, 19589, 20784, 34666, 34667,
        34675, 55566). No talent row triggers them; they are the spellmod TARGETS of eight BM
        talents and are auto-learned by the pet (`Pet::LearnPetPassives`). Without them, eight
        `mask=(0x...)` values in the `tbc:` lines cannot be decoded.
      * **core-script-reached ids** from `spell_hunter.cpp`'s `HunterSpells` enum that no data edge
        reaches: 24406 (Improved Mend Pet's dispel payload), 34720 (Thrill of the Hunt's mana),
        37506 (the id `spell_hun_scatter_shot` is ACTUALLY bound to), 24394 (Intimidation's stun).
      * **the 32 BASELINE spells the tree's spellmods and masks target** (the shots, stings,
        aspects, traps + trap effects, Mend Pet, Revive Pet, Wing Clip, Feign Death, Raptor
        Strike, Mongoose Bite, Rapid Fire, Kill Command, Disengage, Aspect of the Viper) —
        informational, since a stock base spell can never be era-corrected, but five of them turn
        out to matter (see `accepted_gaps:`).
    The sweep is closed: re-running the transitive walk over the final 301-id set adds nothing.

# =================================================================================================
# ID REPURPOSING — the N_identity family's hits, and the one that is a real hazard.
# =================================================================================================
id_repurposing:
  "19286_19287":
    tbc_name: "Improved Feign Death"
    live_name: "Survival Tactics"
    hazard: HIGH
    detail: >-
      TBC 19286/19287 are `aura 107 ADD_FLAT_MODIFIER, misc 16 SPELLMOD_RESIST_MISS_CHANCE, +2/+4,
      mask (0x100,0,0)` = Feign Death — the classic "Improved Feign Death". WotLK reused the two
      ids for **Survival Tactics**: the effect tuple happens to still read as a +2/+4 resist-miss
      mod (which is why family A did NOT flag 19286), but the live mask is (0x11c, 0x2000, 0) —
      Feign Death PLUS Freezing/Explosive/Immolation traps PLUS Snake Trap Effect — and live adds
      an e2 `SPELLMOD_COOLDOWN -2000/-4000` half. Granting stock ships the WRONG TALENT. ONLY the
      N-family name comparison and the O-family mask pass caught this.
      Node 20653 is therefore AUTHORED, not granted.
  19596:
    tbc_name: "Bestial Swiftness"
    live_name: "Boar's Speed"
    hazard: MEDIUM
    detail: >-
      Same id, completely different encoding. TBC 19596 is the CLASSIC owner-spellmod shape:
      `aura 107 ADD_FLAT_MODIFIER, misc 8 SPELLMOD_ALL_EFFECTS, +30, mask (0x10000000,0,0)` =
      Tamed Pet Passive 04 (19582, the aura-31 speed carrier whose own base amount is 0), plus
      `Attributes 0x81d0` which includes **SPELL_ATTR0_ONLY_OUTDOORS**. Live 19596 is a direct
      `aura 31 MOD_INCREASE_SPEED +30` on whoever holds it, with the outdoor flag dropped. This
      RETIRES the Vanilla `_ref`'s `grants.boars_speed` "Bound is NOT viable / how it reaches the
      pet is UNRESOLVED" note *for TBC*: the TBC record answers it — the owner holds a spellmod and
      the pet's own auto-learned carrier picks it up through `GetSpellModOwner()`, the same
      mechanism Frenzy 19621 and Bestial Discipline 19590 already use and which the Vanilla phase
      shipped as Bound. See node 20607's disposition, and `accepted_gaps` id 2.
  tamed_pet_passives:
    ids: [20782, 8875, 19580, 19581, 19582, 19589, 19591, 20784, 34666, 34667, 34675]
    hazard: NONE
    detail: >-
      All eleven are named "Tamed Pet Passive (DND)" in wago 2.5.4 and "Tamed Pet Passive NN (DND)"
      live. Cosmetic numbering only; masks, auras and amounts are identical on every one.
  13797:
    tbc_name: "Immolation Trap Effect"
    live_name: "Immolation Trap"
    hazard: LOW
    detail: >-
      The DoT sub-spell lost its "Effect" suffix live, which is exactly the ambiguity the Vanilla
      `_ref` documents under `trapEffects:` (a name lookup returns TWO rank chains). This is also
      the ONE family-F divergence in the whole set: TBC ownMask word0 0x4 -> LIVE word0 0x0, because
      live moved the identity to word2 0x20000. Bind by the LIVE identity (0,0,0x20000).

