attribute_divergences:
  systematic_classes:
    totals_by_word:                # every `C:Attr<n>` hit in survival_map, counted from the file
      attr0: 13                    # 1510 3045 19407 19412 19434 19596 20900 20901 20902 20903 20904 27065 42243
      attr1: 5                     # 1510 19263 34026 34074 35101
      attr2: 11                    # 19434 19579 20900 20901 20902 20903 20904 24529 27065 37506 42243
      attr3: 21                    # the 15 CAN_PROC_FROM_PROCS below + 781 1510 13161 13812 35101
      attr4: 14                    # 1495 3355 19386 19434 20900 20901 20902 20903 20904 24132 24133 27065 27068 34026
      attr5: 2                     # 19574 42243
      attr6: 16                    # the 12 TAPS_IMMEDIATELY below + 1130 13159 19506 20043
      attr7: 3                     # 5384 19506 34490
      distinct_ids_with_any_attr_diff: 58
    attr6_0x800000_TAPS_IMMEDIATELY:
      count: 12
      ids: [1978, 2974, 3034, 3043, 3355, 5116, 13797, 19386, 24132, 24133, 24394, 27068]
      excluded:
        - { id: 19574, reason: "its Attr6 does NOT differ; the Bestial Wrath attribute divergence is AttributesEx5 0x0 -> 0x60008. Listed here in the first draft by mistake; see individually_load_bearing.19574_bestial_wrath." }
        - { id: 13165, reason: "its Attr6 does NOT differ; the Aspect of the Hawk divergence is D/E/G (Category 47, mana, GCD). See aspect_category_47." }
        - { id: 1130,  reason: "Attr6 differs but with a DIFFERENT value (0x0 -> 0x4), not TAPS_IMMEDIATELY." }
        - { id: 13159, reason: "Attr6 0x0 -> 0x4000000 (VEHICLE_IMMUNITY_CATEGORY), not TAPS_IMMEDIATELY." }
        - { id: 19506, reason: "Attr6 0x0 -> 0x4000000, not TAPS_IMMEDIATELY. Load-bearing for the Trueshot clone — see reuse_ledger." }
        - { id: 20043, reason: "Attr6 0x0 -> 0x4000000, not TAPS_IMMEDIATELY." }
      ruling: >-
        `SPELL_ATTR6_TAPS_IMMEDIATELY` (0x800000) is set live on almost every hunter damage/DoT
        ability and absent in TBC — a WotLK-wide tapping change, not a hunter era difference.
        An era clone of a damaging ability SHOULD carry it (the post-fix live value) so kill credit
        behaves like every other spell on this core. Recorded, not reproduced literally.
    attr3_0x4000000_CAN_PROC_FROM_PROCS:
      count: 15
      ids: [13810, 19184, 19387, 19388, 19577, 34497, 34498, 34499, 34500, 34502, 34503, 34950, 34954, 35100, 35102]
      excluded:
        - { id: 781,   reason: "Attr3 0x0 -> 0x40030000 on baseline Disengage — the WotLK rebuild, not the proc bit." }
        - { id: 1510,  reason: "Attr3 0x0 -> 0x20 on baseline Volley." }
        - { id: 13161, reason: "Attr3 0x0 -> 0x10000000 on baseline Aspect of the Beast." }
        - { id: 13812, reason: "Attr3 0x240 -> 0x40240 on Explosive Trap Effect — ALWAYS_HIT added, not the proc bit." }
        - { id: 35101, reason: "Attr3 0x0 -> 0x20000 (SUPPRESS_TARGET_PROCS) on the Concussive Barrage daze." }
      ruling: >-
        `SPELL_ATTR3_CAN_PROC_FROM_PROCS` added live to every hunter PROC passive. It lets the
        passive fire off a triggered spell. Era clones of proc passives SHOULD carry it (matching
        live) unless a specific double-proc is being avoided; the generated auto-passives already
        do not set it, which is the CONSERVATIVE direction (fewer procs, never more).
    aspect_category_47:
      note: "NOT an attribute class — a D/G-family class, kept here because it is the other systematic sweep of the same id group."
      count: 14
      ids: [5118, 13159, 13161, 13163, 13165, 14318, 14319, 14320, 14321, 14322, 20043, 25296, 27044, 34074]
      ruling: >-
        Every Aspect gained `Category 47` + `CategoryRecoveryTime 1000` live (the shared 1 s aspect
        cooldown) and lost `StartRecoveryCategory 133`/`StartRecoveryTime 1500`. BASELINE spells —
        no era talent clones an Aspect, so this is informational only. It is also why
        `SpellMgr.cpp:3493` keys `SPELL_ATTR0_CU_NO_INITIAL_THREAT` on `GetCategory() == 47`.
  individually_load_bearing:
    19434_aimed_shot:
      diff: "Attributes TBC 0x410012 -> LIVE 0x10012 (TBC has SPELL_ATTR0_TRACK_TARGET_IN_CAST_PLAYER_ONLY 0x400000); AttributesEx2 TBC 0 -> LIVE 0x20000 (DO_NOT_RESET_COMBAT_TIMERS); AttributesEx4 TBC 0x18000000 -> LIVE 0x10000000 (TBC additionally has SPELL_ATTR4_FORCE_DISPLAY_CASTBAR 0x8000000)"
      ruling: >-
        The Aimed Shot clone chain MUST author `attributes: 0x410012` and `attributesEx4:
        0x18000000` — FORCE_DISPLAY_CASTBAR is what makes the 2.5 s cast bar visible, which is a
        named real-client checklist item. It must NOT carry live's DO_NOT_RESET_COMBAT_TIMERS.
    19574_bestial_wrath:
      diff: "AttributesEx5 TBC 0x0 -> LIVE 0x60008 (ALLOW_WHILE_STUNNED 0x8 | ALLOW_WHILE_FLEEING 0x20000 | ALLOW_WHILE_CONFUSED 0x40000)"
      ruling: >-
        WotLK made Bestial Wrath castable while CC'd. This is ALSO one of the two "named attribute
        consequences" the Vanilla BW clone 932967 inherited from its template — 932967 carries
        AttributesEx5 393224 = exactly live's 0x60008.
        **DECIDED (spec Amendment A.6): author `attributesEx5: 0`** — the era-literal TBC value
        (lesson 17c: author the era value for an inherited AttributesEx3/5 bit). The consequence is
        accepted and named: the Vanilla clone still ships live's 0x60008, so a Vanilla and a TBC
        hunter's Bestial Wrath will behave differently while CC'd until the Vanilla fix round picks
        up A.14 item 2.
    19263_deterrence:
      diff: "AttributesEx TBC 0x0 -> LIVE 0x10 (SPELL_ATTR1_NO_SKILL_INCREASE)"
      ruling: "Cosmetic; the Vanilla clone 932964 inherited live's 0x10. Either value is defensible; recorded so the reuse ledger's FRESH verdict is on the record for the right reason."
    34490_silencing_shot:
      diff: "AttributesEx7 TBC 0x0 -> LIVE 0x800 (SPELL_ATTR7_CAN_CAUSE_INTERRUPT)"
      ruling: >-
        Live flags Silencing Shot as an interrupt so it feeds the interrupt-tracking paths. Harmless
        to keep; the era-relevant Silencing Shot divergence is the GCD, not this.
    19596_bestial_swiftness:
      diff: "Attributes TBC 0x81d0 -> LIVE 0x150 (TBC has SPELL_ATTR0_ONLY_OUTDOORS 0x8000)"
      ruling: >-
        **This is the evidence that could close Vanilla accepted gap 2.** TBC's Bestial Swiftness
        is a PLAYER-held passive carrying ONLY_OUTDOORS, and `Spell::CheckCast`'s outdoor gate DOES
        apply to player auras — unlike a `mechanic: pet` buff, which is applied to the pet and is
        not area-gated. Authoring node 20607 as a spellmod auto-passive with `attributes` including
        0x8000 reproduces the outdoor restriction for free.
    19503_scatter_shot_and_wyvern:
      diff: "AuraInterruptFlags TBC 0x2 -> LIVE 0x480002"
      ruling: >-
        WotLK added two take-damage break bits. For the Wyvern Sting SLEEP clone this is
        load-bearing (it decides whether a DoT tick breaks the sleep); author LIVE's 0x480002 only
        if the era intent is the WotLK break rule. TBC's own 0x2 is the era-literal value and is
        what the clone should carry.
    13165_aspect_of_the_hawk:
      diff: "no attribute diff; the divergence is D/E/G (category, mana, GCD)"
      ruling: "Recorded because the Aspect is the PROC CARRIER for Improved Aspect of the Hawk and someone will check it."

# =================================================================================================
# PER-EFFECT CLASS-MASK DIFFS (family O, supplementary — excluded from the verdict). 43 hits.
# SIX are load-bearing (plus the LIVE_MATCH Master Tactician mask); the rest are word-1/word-2 encoding drift between builds (Amendment A.12
# says higher words are NOT comparable, so only the word-0 halves are read as evidence).
# =================================================================================================
effect_class_mask_diffs:
  load_bearing:
    19159_19160_savage_strikes:
      diff: "e1 TBC (0x2,0,0) -> LIVE (0x2,0x80000,0)"
      why: >-
        LIVE's mask adds word1 0x80000 = **Counterattack**, so stock Savage Strikes raises
        Counterattack's crit as well as Raptor Strike's and Mongoose Bite's. The era Counterattack
        clone WILL carry word1 0x80000 (it is the identity bit), so a stock grant leaks +10/20%
        crit onto it. Node 20644 is AUTHORED with `affectsMask {a: 2}`.
    19416_19420_efficiency:
      diff: "e1 TBC (0x7fa00,0x1081,0) -> LIVE (0x7fa00,0x88801081,0x1)"
      why: >-
        Word 0 is IDENTICAL and INCLUDES Aimed Shot's 0x20000 on both sides. The era Aimed Shot
        clone drops that bit, so Efficiency must AUTHOR an `affectsMask` that adds the era word2
        bit. This is the single most important consequence of the Aimed Shot identity decision.
    19485_19490_mortal_shots:
      diff: "e1 TBC (0x63a01,0x1,0) -> LIVE (0x63a00,0x80800001,0xa41), plus ApplySpellFix ORs 0x4000 into live word0"
      why: >-
        TBC's word0 carries bit 0 (Auto Shot) which live lacks; live+fix carries 0x4000 (Serpent
        Sting) which TBC lacks. Both sides carry Aimed Shot's 0x20000. AUTHOR with an explicit
        `affectsMask` at TBC's set PLUS the era Aimed Shot bit.
    19498_19500_hawk_eye:
      diff: "e1 TBC (0x7fa01,0x1081,0) -> LIVE (0x7fa01,0x88801081,0x401)"
      why: >-
        Word 0 identical, and it INCLUDES 0x20000. Hawk Eye reads LIVE_MATCH on all fourteen
        families, but a stock grant will NOT extend the era Aimed Shot clone's range. Recorded as
        the caveat on node 20643's GRANT disposition, and as accepted gap 5 if the grant stands.
    35098_35099_rapid_killing_buff:
      diff: "e1 TBC (0x20801,0,0) -> LIVE (0x20800,0,0x1)"
      why: >-
        The triggered buff's SPELLMOD_DAMAGE mask includes 0x20000 on both sides. Node 20628 grants
        stock 34948/34949 (LIVE_MATCH), which trigger the STOCK buffs — so Rapid Killing will not
        boost the era Aimed Shot unless the buffs are cloned with the era bit.
    34833_34837_master_tactician_buffs:
      is_a_hit: false
      diff: "**NOT one of the 43 hits** — no wago-vs-live diff at all; the mask is (0x7fa43,0x81,0) on BOTH sides. Listed in this section because it is load-bearing for the same reason the real hits are."
      why: >-
        Not a divergence, but the same trap: the crit buff's mask includes 0x20000, so a granted
        stock buff will not crit-boost the era Aimed Shot clone. Same decision as Rapid Killing.
    19464_19468_improved_stings:
      diff: "e3 TBC (0xc000,0x1180,0) -> LIVE (0x4000,0x100,0)"
      why: >-
        TBC's dispel-resist half covers Serpent + Scorpid + Viper + Wyvern-sleep + Wyvern-DoT; live
        narrowed it to Serpent + Wyvern-DoT. AUTHOR with the TBC scope, decoded against the LIVE
        identities in `spells:` (Amendment A.12 — do not copy TBC's higher mask words).
  encoding_drift_only:
    - "19286/19287 (the repurposing, covered under id_repurposing)"
    - "19376 Trap Mastery e1 TBC 0x1c -> LIVE 0x18 (TBC adds Explosive Trap Effect bit 0x4)"
    - "19407/19412 Improved Concussive Shot e1 TBC 0x0 -> LIVE 0x200 (different mechanic entirely)"
    - "19461/19462/24691 Barrage + 35104/35110/35111 Improved Barrage: LIVE adds 0x20000 (Aimed Shot). TBC does not. Granting stock is era-correct BY CONSTRUCTION because the era clone drops the bit."
    - "19549-19551 Imp. Aspect of the Monkey e1 word2 0 -> 0x2000; 19552-19556 IAotH e1 word2 0 -> 0x1000 (both harmless additions to an already-unique word-0 bit)"
    - "34453/34454 Animal Handler e1 TBC (0x4000000,0,0) -> LIVE (0,0,0x80000) — an INERT mask on a non-spellmod aura on both sides (the Boar's Speed lesson)"
    - "34494/34496 Survival Instincts e2 TBC 0 -> LIVE (0x800,0x80000001,0x240) — different aura entirely"

# =================================================================================================
# PROC-DATA CENSUS (lesson 18 / spec Amendment A.9). A NEGATIVE-id row OVERRIDES the DBC proc
# contract for the WHOLE rank chain; a CLONE inherits NEITHER the row nor the script binding.
# Queried live over the 301-id set: SEVEN spell_proc rows, EIGHT spell_proc_event rows.
# =================================================================================================
proc_data_census:
  -13165:
    table: "spell_proc + spell_proc_event"
    row: "family 0, mask (0,0,0), ProcFlags 64 (PROC_FLAG_DONE_RANGED_AUTO_ATTACK), SpellPhaseMask 2, everything else 0"
    what: >-
      **Aspect of the Hawk's own proc contract — and the answer to the 'while Hawk is active'
      question.** The Quick Shots proc lives ON THE ASPECT (13165's e2 is aura 42 -> 6150), not on
      the talent, so it can only fire while the Aspect is up. The negative id covers all eight
      ranks. Improved Aspect of the Hawk is a pure SPELLMOD onto it.
    disposition: >-
      Node 20600 GRANTS stock, the Aspect is baseline — NOTHING to do. No `casterAuraSpell`, no
      aura-state, no DUMMY marker, no module script. DUMMY-marker misc 19 stays free.
  -19184:
    table: "spell_proc + spell_proc_event"
    row: "spell_proc: family 9, mask (16, 8192, 0), ProcFlags 0, SpellPhaseMask 4 (FINISH), AttributesMask 2 (PROC_ATTR_TRIGGERED_CAN_PROC). spell_proc_event: family 9, mask (16, 8192, 262144), procPhase 2"
    what: "Entrapment's trap-activation contract. ProcFlags 0 means the DBC ProcTypeMask governs; the family mask filters by trap-effect line."
    disposition: >-
      The era Entrapment auto-passives get GENERATED `spell_proc` rows — the framework's
      `attrMask: 2` trap-proc shape (`ProcFlags 2097152` = PROC_FLAG_DONE_TRAP_ACTIVATION,
      `SpellPhaseMask 4`), which the Vanilla phase already ships as rows 922672-922676. A clone
      inherits nothing from -19184.
  -19572:
    table: "spell_proc + spell_proc_event"
    row: "family 9, mask (0x800000, 0, 0) = Mend Pet, ProcFlags 262144, SpellTypeMask 2 (HEAL), SpellPhaseMask 2"
    what: "Improved Mend Pet's proc contract, paired with the `spell_hun_improved_mend_pet` script (also bound negatively)."
    disposition: >-
      Node 20609 GRANTS stock 19572/19573 — the row and the script binding both survive for free.
      This is a positive reason to grant rather than clone. (The module already binds the VANILLA
      auto-passives 922480/922481 to the same script, so the pattern for a clone exists if needed.)
  -34497:
    table: "spell_proc + spell_proc_event"
    row: "spell_proc: family 9, mask (0x60800, 0x800001, 0x201), SpellTypeMask 1, SpellPhaseMask 2, HitMask 2 (CRIT-ONLY). spell_proc_event: procEx 2"
    what: "Thrill of the Hunt's crit-only contract over the ranged-shot set."
    disposition: >-
      Node 20659 GRANTS stock 34497-34499 (only AttributesEx3 and r3's ProcTypeMask differ, and the
      negative row overrides ProcTypeMask anyway). A clone would lose BOTH the row and
      `spell_hun_thrill_of_the_hunt`, and would then need a hand row plus a rebind.
  -34500:
    table: "spell_proc + spell_proc_event"
    row: "**ALL ZEROS for family/mask** — SchoolMask 0, SpellFamilyName 0, masks 0, ProcFlags 0, SpellTypeMask 1, SpellPhaseMask 2, HitMask 2 (CRIT-ONLY)"
    what: "Expose Weakness's crit-only contract."
    disposition: >-
      The Sword-Specialization case from the rogue phase, verbatim: **a CLONE does not inherit this
      all-zero row and would silently never fire.** Node 20661 is AUTHORED, so the generator writes
      its own per-rank `spell_proc` rows — but the payload clone 34501 needs no row and the
      auto-passives DO. Explicit `hitMask: 2` is mandatory.
  -34950:
    table: "spell_proc + spell_proc_event"
    row: "**ALL ZEROS for family/mask**, SpellTypeMask 1, SpellPhaseMask 2, HitMask 2 (CRIT-ONLY)"
    what: "Go for the Throat's crit-only contract."
    disposition: >-
      Node 20625 GRANTS stock 34950/34954 precisely BECAUSE of this row: the only fourteen-family
      differences are ProcTypeMask (which the row overrides) and AttributesEx3. Cloning would lose
      the crit-only gate and the talent would fire on every ranged hit.
  -35100:
    table: "spell_proc + spell_proc_event"
    row: "family 9, mask (0x1000, 0, 1) = Multi-Shot + Chimera Shot, ProcFlags 0, SpellPhaseMask 2"
    what: >-
      Concussive Barrage's contract — and it is WotLK's, not TBC's. The TBC tooltip says
      "successful **Auto Shot** attacks have a 2% chance to Daze"; TBC's DBC `ProcTypeMask 320`
      (0x140 = DONE_RANGED_AUTO_ATTACK | DONE_SPELL_RANGED_DMG_CLASS) matches the tooltip, while
      the live row narrows the family mask to Multi-Shot.
    disposition: >-
      Node 20631 is AUTHORED at TBC's 2/4/6% with `procTypeMask: 320` and NO family mask — the
      generator writes its own row. The stock daze payload 35101 can be triggered as-is.
  19577:
    table: "spell_proc_event ONLY (POSITIVE id, no spell_proc row)"
    row: "procEx 1027, everything else 0"
    what: "Intimidation's proc-flag extension. NB positive id = this single rank only."
    disposition: >-
      Node 20612's clone would LOSE this row and `spell_hun_intimidation`. That is a real cost of
      the CLONE disposition and the main argument for GRANTing stock + an accepted 2pp mana gap.
  none_found_for:
    - "34506-34508/34838/34839 Master Tactician — NO row on either table, so the DBC ProcChance (TBC 6 / live 10) is the whole contract. That is why family B alone decides this node."
    - "19228/19232/19233 Improved Wing Clip, 19407-19415 Improved Concussive Shot, 34455/34459/34460 Ferocious Inspiration — no rows; all three are RECONSTRUCTED and get generated rows."
    - "13165's chain is the only ASPECT with a proc row; no other baseline hunter spell in the set has one."

# =================================================================================================
# SCRIPT CENSUS — every `spell_script_names` row over the 301-id set. Each is a mechanic that DIES
# on a clone without a `scriptBindings:` entry (lesson 6).
# =================================================================================================
script_census:
  19574:
    script: spell_hun_bestial_wrath
    binding: "POSITIVE (this id only). The module ALREADY binds the Vanilla clone 932967 to it."
    body: "SpellScript, OnCheckCast: requires a player caster with a living pet."
    disposition: "The TBC BW clone MUST add a `scriptBindings:` entry to `spell_hun_bestial_wrath` (mirror 932967)."
  -19572:
    script: spell_hun_improved_mend_pet
    binding: "NEGATIVE — the whole 19572/19573 rank chain. The module ALSO binds the Vanilla auto-passives 922480/922481 to it."
    body: >-
      AuraScript. `CheckProc` rolls `GetEffect(EFFECT_0)->GetAmount()`; `HandleProc` is registered
      on **EFFECT_0, SPELL_AURA_DUMMY** and casts 24406. **This is why a literal TBC copy of 19572
      would be dead**: TBC's own e1 is `aura 112 OVERRIDE_CLASS_SCRIPTS`, and the handler would
      never bind. Lesson 3, exactly.
    disposition: "Node 20609 GRANTS stock — nothing to do."
  19577:
    script: spell_hun_intimidation
    binding: "POSITIVE (this id only)."
    body: "AuraScript, `DoCheckProc`: rejects positive spells so the stun only fires off a hostile hit."
    disposition: "A clone of 20612 must rebind; a grant needs nothing."
  23989:
    script: spell_hun_readiness
    binding: "POSITIVE (this id only)."
    body: >-
      SpellScript. Walks `caster->GetSpellCooldownMap()` and clears every cooldown whose
      `SpellFamilyName == SPELLFAMILY_HUNTER` and whose `Id` is not 23989, 19574 or 59543. It is a
      **FAMILY walk, not an id list**, so era band clones carrying family 9 ARE covered.
    disposition: >-
      **The single most dangerous binding in this census.** See `core_hardcodes.readiness` — a
      clone bound to this script clears its OWN cooldown. Node 20663 needs a module script.
  37506:
    script: spell_hun_scatter_shot
    binding: "POSITIVE — and it is bound to the **NPC copy 37506**, NOT to the player spell 19503."
    body: "SpellScript."
    disposition: >-
      A Scatter Shot clone needs NO rebind, because the player id was never bound. Recorded
      explicitly so the next reader does not add a spurious `scriptBindings:` entry. (The player
      19503's own e3 TRIGGER_SPELL -> 37506 is what routes into it.)
  -34497:
    script: spell_hun_thrill_of_the_hunt
    binding: "NEGATIVE — the whole 34497/34498/34499 chain."
    body: "AuraScript, HandleProc: computes the mana refund (incl. a special Explosive Shot arm) and casts 34720."
    disposition: "Node 20659 GRANTS stock — nothing to do."
  -19386:
    script: spell_hun_wyvern_sting
    binding: "NEGATIVE — the whole 19386/24132/24133/27068/49011/49012 sleep chain."
    body: >-
      AuraScript, `AfterEffectRemove` on **EFFECT_0, SPELL_AURA_MOD_STUN**: casts
      `sSpellMgr->GetSpellWithRank(24131, GetSpellInfo()->GetRank())`. **It resolves the DoT BY
      RANK through `spell_ranks`**, which is exactly why the Vanilla phase needed its own
      `era_wyvern_sting` — a band clone's rank is resolved against the band's own `spell_ranks`
      chain, and 24131's chain is the stock one.
    disposition: >-
      Node 20660: extend `era_wyvern_sting` to a per-era {sleep clone -> DoT clone} table (the spec
      already plans this) and do NOT rebind the core script. The era sleep clones must still carry
      word1 0x1000 + SpellIconID 1721 for `DIMINISHING_DISORIENT`.
  not_in_the_set_but_worth_recording:
    - "68361 spell_hun_animal_handler — bound to the WotLK PET payload, not to the talent. A TBC Animal Handler is authored and needs no bind."
    - "34026 spell_hun_kill_command / 58914 spell_hun_kill_command_pet — Kill Command is BASELINE in TBC (trainer L66); no era talent clones it, so both are untouched."
    - "13161/61669 spell_hun_aspect_of_the_beast, 34074 spell_hun_ascpect_of_the_viper (sic), 781 spell_hun_disengage, -136/-755 spell_hun_check_pet_los, 34902-34904 spell_hun_generic_scaling, 53478 spell_hun_last_stand_pet, 53412 spell_hun_invigoration, 34477/35079 misdirection, 53209 chimera, -53301 explosive shot, -56342 lock and load, -53228/-53234/56654/58882 rapid recuperation/piercing shots, -53290 hunting party, -53302 sniper training, 67151 t9 4p, 56841/57870 glyphs, 1742 spell_hun_cower, 19548-30654 tame beast — none is reachable by a TBC hunter talent."
    - "**19503 has NO script row.** Confirmed by the full `WHERE ScriptName LIKE 'spell_hun%'` dump."
    - "**23989, 19574, 19577 are the only three POSITIVE single-id hunter bindings in the whole table** that a TBC era node touches."
  spell_linked_spell:
    query: "SELECT * FROM spell_linked_spell WHERE ABS(spell_trigger) IN (<the 301 ids>) OR ABS(spell_effect) IN (<same>)"
    rows:
      - { spell_trigger: 19263, spell_effect: 67801, type: 2, comment: "Deterrence" }
    ruling: >-
      EXACTLY ONE row over the whole id set. It links stock Deterrence to **67801**, which is
      **LIVE_ONLY** (`aura 288 DEFLECT_SPELLS +100` + `aura 185` -100) — WotLK's spell-deflection
      half of Deterrence, absent from TBC entirely. `type: 2` is the aura-apply link. A clone of
      19263 does NOT inherit the row, and that is **era-CORRECT**: TBC Deterrence is dodge+parry
      only. Recorded so the missing link is not later mistaken for a defect. No other era clone in
      this phase has a `spell_linked_spell` row to lose.

# =================================================================================================
# PET-AURA CENSUS — how a hunter talent reaches the PET, and the decisive answer to spec §4d's
# registration question.
# =================================================================================================
pet_aura_census:
  mechanism:
    registration: >-
      `spell_pet_auras` rows are registered into the OWNER's `m_petAuras` set by exactly TWO code
      paths, BOTH keyed on the owner's spell actually running an effect at the row's `effectId`:
        * `AuraEffect::HandleAuraDummy` (SpellAuraEffects.cpp:5186-5193) — on aura APPLY of a
          `SPELL_AURA_DUMMY` effect: `sSpellMgr->GetPetAura(GetId(), m_effIndex)` ->
          `target->AddPetAura(petSpell)`.
        * `Spell::EffectDummy` (SpellEffects.cpp:761-766) — on cast of a non-aura
          `SPELL_EFFECT_DUMMY`: `m_caster->AddPetAura(petSpell)`.
      `Unit::AddPetAura` (Unit.cpp:13749) inserts into `m_petAuras` and immediately
      `pet->CastPetAura()`s it; `Pet::CastPetAuras` (Pet.cpp:2354) replays the whole set on every
      summon/load, which is what makes it survive a dismiss+resummon.
      Removal is symmetric: `Player::_removeTalentAurasAndSpells` (Player.cpp:3093) and
      `Player::removeSpell` (Player.cpp:3552) both walk all three effect indices calling
      `GetPetAura(spellId, i)` -> `RemovePetAura`.
    answer_to_spec_4d: >-
      **YES — `Pet::CastPetAuras` registers STOCK `spell_pet_auras` rows for a spellbook-learned,
      non-talent-frame passive.** Nothing in the path consults `Talent.dbc`, `HasTalent`, or the
      talent frame; learning a passive auto-casts it (`Player::learnSpell` -> `CastSpell` for a
      PASSIVE), the DUMMY effect applies, and the row registers. An era-granted stock passive
      therefore delivers its pet aura exactly like a talented one.
      **BUT there is a hard condition, and it is the trap:** the row is keyed
      `(spellId, effectId)` and only fires if the spell's effect AT THAT INDEX is a DUMMY. Every
      stock hunter row exploits LIVE's encoding, and TBC's encoding is DIFFERENT at three of them:
        * Ferocious Inspiration row `(34455, 0)`: LIVE e1 is `aura 4 DUMMY misc 18` -> registers.
          **TBC e1 is `aura 107 ADD_FLAT_MODIFIER`** -> a literal TBC clone would NOT register.
        * Animal Handler row `(34453, 1)`: LIVE e2 is `aura 4 DUMMY misc 8` -> registers.
          **TBC e2 is `aura 107`** -> would not register.
        * Focused Fire row `(35029, 0)`: BOTH sides are `SPELL_EFFECT_DUMMY` (effect 3) -> fine.
        * Spirit Bond rows `(19578, 0)` / `(20895, 0)`: BOTH sides are `aura 4 DUMMY` -> fine.
      This is why the era pet path goes through the module's own `mechanic: pet` / `petBuffIds`
      emitter (which writes its own `spell_pet_auras` rows against a generated auto-passive that
      carries the required DUMMY) rather than trying to reproduce TBC's literal encoding.
  stock_rows_over_the_id_set:
    - { spell: 19578, effectId: 0, pet: 0, aura: 19579, note: "Spirit Bond r1. pet=0 = ANY pet. STOCK." }
    - { spell: 20895, effectId: 0, pet: 0, aura: 24529, note: "Spirit Bond r2. STOCK." }
    - { spell: 34453, effectId: 1, pet: 0, aura: 68361, note: "Animal Handler r1 -> the WotLK pet-expertise payload (LIVE_ONLY). TBC's pet half is a SPELLMOD onto Tamed Pet Passive 08 instead." }
    - { spell: 34454, effectId: 1, pet: 0, aura: 68361, note: "Animal Handler r2 -> the same payload (the amount comes from the owner's icon-2234 DUMMY via spell_hun_animal_handler)." }
    - { spell: 34455, effectId: 0, pet: 0, aura: 75593, note: "Ferocious Inspiration r1 -> WotLK's permanent +1% raid aura (LIVE_ONLY)." }
    - { spell: 34459, effectId: 0, pet: 0, aura: 75446, note: "FI r2 -> +2% (LIVE_ONLY)." }
    - { spell: 34460, effectId: 0, pet: 0, aura: 75447, note: "FI r3 -> +3% (LIVE_ONLY)." }
    - { spell: 35029, effectId: 0, pet: 0, aura: 35060, note: "Focused Fire r1 -> the +1% pet-damage carrier. Both sides SPELL_EFFECT_DUMMY." }
    - { spell: 35030, effectId: 0, pet: 0, aura: 35061, note: "Focused Fire r2 -> +2%." }
  the_other_delivery_path:
    what: "OWNER SPELLMOD onto an auto-learned Tamed Pet Passive carrier."
    why_it_works: >-
      The pet's `GetSpellModOwner()` is the hunter, so an owner-held `aura 107/108` masked to the
      carrier's family bit changes the amount the PET's own aura computes. No `spell_pet_auras` row,
      no script, no registration question. `Pet::LearnPetPassives` (Pet.cpp:2333) guarantees the
      carrier is present on every tamed pet.
    tbc_talents_that_use_it:
      20601: "Endurance Training -> 19581 (health %)"
      20604: "Thick Hide -> 19580 (resistance %)"
      20608: "Unleashed Fury -> 8875 (damage %)"
      20610: "Ferocity -> 19591 (weapon crit %)"
      20613: "Bestial Discipline -> 19589 (focus regen %)"
      20615: "Frenzy -> 20784 (proc chance)"
      20607: "Bestial Swiftness -> 19582 (movement speed) — the id_repurposing finding"
      20614: "Animal Handler -> 34666 (pet hit %)"
      20618: "Catlike Reflexes -> 34667 (pet dodge %)"
      20619: "Serpent's Swiftness -> 34675 (pet melee haste %)"
    consequence: >-
      **TEN of the 21 Beast Mastery nodes reach the pet through this path, and SIX of those ten are
      plain stock GRANTS.** Only Spirit Bond (a 119 area-aura), Ferocious Inspiration (a pet-side
      proc) and Focused Fire (a pet-damage DUMMY) need the `spell_pet_auras` route at all.
  first_era1_pet_window_claim: >-
    `petBuffBase: 944000` is the FIRST claim of the era-1 pet window `[944000,946000)`. The
    generator's era-1 window has no direct unit test (framework FOLLOW-UP note); the spec assigns
    that test to the task that authors the first pet node. Only node 20611 (Spirit Bond) and
    node 20616 (Ferocious Inspiration) are expected to consume ids from it.

