# mana + attribute equality. Every candidate was compared FIELD-BY-FIELD against its TBC
# counterpart with the same fourteen-family script that produced the survival map; both raw values
# are printed on every disagreement (lesson 16).
# =================================================================================================
reuse_ledger:
  summary: >-
    22 candidate pairs assessed. **THREE are field-identical on all fourteen families (Counterattack
    r1/r2/r3, ids 932979/932958/932959) — the first genuine reuse hits in any TBC class phase.**
    Two more are one noise-field away (932966 Wyvern DoT r1, 932968/932969 Spirit Bond carriers).
    Everything else is FRESH or MOOT. **DECIDED (spec Amendment A.10): ALL FRESH** — the three
    identical hits are recorded as evidence, not acted on; Counterattack mints fresh ids
    948338-948341. See `counterattack_decision`.
  "932979_932958_932959":
