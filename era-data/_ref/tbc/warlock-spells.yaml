# =================================================================================================
# TBC WARLOCK — stock-spell reference (Phase 8, Task 1).
#
# Companion to `era-data/tbc/warlock.yaml` (authored in Tasks 2-4) and to the era-less
# `era-data/_ref/warlock-spells.yaml` (Vanilla). Structure mirrors the hunter / rogue / warrior TBC
# refs. EVERY number here was measured on 2026-09-05 from one of exactly three sources:
#
#   * wago.tools DB2 export, build **2.5.4.44833** (TBC Classic) — the fourteen tables the plan
#     names plus SpellDuration / SpellCastTimes / SpellRange / SpellRadius for index decoding.
#   * the LIVE 3.3.5a store — `azerothcore-wotlk/ip-dbc/Spell.dbc`
#     (md5 `49c9c5f53e8974c27d67635384725f46`, identical to the running worldserver's copy and to
#     the hunter/rogue phases' copies) PLUS the `acore_world.spell_dbc` overlay (7711 rows), which
#     REPLACES records at load. Overlay membership counts as live presence.
#   * the fork source at HEAD for every core hardcode, and `acore_world` for the DB censuses.
#
# Wowhead TBC tooltips (cached under `era-data/_ref/tbc/tooltips/<id>.json`, 184 warlock ids added
# by this task's `import_tbc_talents.py --fetch`) are PRESENTATION only — they never override wago.
#
# TASKS 2-4 AUTHOR FROM `disposition_table:` AND `survival_map:` AND DO NOT RE-DERIVE VERDICTS.
# =================================================================================================
era: 1
class: 9
family: 5                  # SPELLFAMILY_WARLOCK. NB the class-id/family-id INVERSION with hunter
                           # (hunter = class 3 / family 9; warlock = class 9 / family 5).
                           # `CLASS_TOKENS` and `ID_BASE` are keyed by CLASS id (9), the generator's
                           # `_class_mask` / `affects:` resolution by FAMILY id (5).
familyName: 5              # THE KEY THE GENERATOR READS. tools/gen_era_talents.py resolves the
                           # SpellClassSet of every emitted spellmod/multi/proc row from
                           # `_ref.familyName` and DEFAULTS IT TO 3 (MAGE) when the key is absent
                           # (gen_era_talents.py:820/1048/1155, era_audit.py:581) — `family:` above
                           # is documentation only. Every other TBC _ref file carries it; this one
                           # did not, so the Affliction task added it (a family-3 warlock spellmod
                           # binds nothing, silently).

