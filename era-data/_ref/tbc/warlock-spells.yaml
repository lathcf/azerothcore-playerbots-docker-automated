# =================================================================================================
# PET AURA CENSUS — the single most consequential section for Task 3.
# =================================================================================================
pet_aura_census:
  mechanism_reference: >-
    See `era-data/_ref/tbc/hunter-spells.yaml` `pet_aura_census.mechanism` for the full registration
    path and its answer to spec 4d. Restated for warlock: **YES, `Pet::CastPetAuras` registers stock
    `spell_pet_auras` rows for a spellbook-learned, non-talent-frame passive** — nothing in
    `AuraEffect::HandleAuraDummy` / `Spell::EffectDummy` / `Unit::AddPetAura` / `Pet::CastPetAuras`
    consults `Talent.dbc` or `HasTalent`. The hard condition is that the row is keyed
    `(spellId, effectId)` and only fires if the spell's effect AT THAT INDEX is a DUMMY.
  the_other_delivery_path:
    what: "OWNER SPELLMOD onto an auto-learned demon 'Tamed Pet Passive (DND)' / 'Pet Passive (DND)' carrier."
    why_it_works: "The demon's `GetSpellModOwner()` is the warlock, so an owner-held aura 107/108 masked to the carrier's family bit changes the amount the PET's own aura computes. No `spell_pet_auras` row, no script, no registration question."
    carriers_live_verified:
      "0x4000000 (word0 bit26)":  { spells: [18727, 18728, 18729, 18730, 30147], effect: "aura 79 MOD_DAMAGE_PERCENT_DONE misc 1 (physical) + misc 126 (magic), base 0", used_by: "node 20732 Unholy Power" }
      "0x8000000 (word0 bit27)":  { spells: [18735, 18736, 18737, 18738, 30148], effect: "aura 137 MOD_TOTAL_STAT_PERCENTAGE misc 2 (Stamina), base 0", used_by: "node 20729 Fel Stamina" }
      "0x10000000 (word0 bit28)": { spells: [18739, 18740, 18741, 18742, 30149], effect: "aura 137 misc 3 (Intellect), base 0", used_by: "node 20726 Fel Intellect" }
      "word1 0x2000":             { spells: [35695], effect: "aura 57 spell crit + aura 52 melee crit, base 0", used_by: "node 20741 Demonic Tactics" }
      "word1 0x4000":             { spells: [35697], effect: "aura 87 MOD_DAMAGE_PERCENT_TAKEN misc 127, base 0", used_by: "node 20738 Demonic Resilience" }
    all_seventeen_are_LIVE_MATCH: >-
      Every carrier above verdicts LIVE_MATCH against wago 2.5.4 — the per-demon rank rows
      (18727-18730 etc.) AND the Felguard rows (30147/30148/30149) that TBC added. Nothing about the
      warlock pet-stat path needs reconstruction.
  first_era1_pet_window_claim: >-
    `petBuffBase: 945000` is the SECOND claim of the era-1 pet window `[944000,946000)` (hunter
    holds 944000 and emits nothing). **The expectation in spec 4c that warlock would be the first
    class to emit auto pet-buff rows is NOT borne out by the data.** Every warlock pet-stat talent
    reaches the demon through the owner-spellmod carrier path above, so the generator's
    `mechanic: pet` emitter is not needed for any of them, and `[945000, 946000)` is expected to
    stay EMPTY. Task 3 still declares `petBuffBase: 945000` so the window is reserved, and the
    generator unit test the hunter phase added still covers it. Escalate only if a node turns out
    to need `spell_pet_auras` after all.
