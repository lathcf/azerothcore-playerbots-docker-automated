    - { spell: 19028, effectId: 0, pet: 0, aura: 25228, note: "Soul Link. pet=0 = ANY pet. Registering it delivers the LIVE 25228 (20% split, NO +5% damage) — which is why node 20739 CLONES rather than grants." }
