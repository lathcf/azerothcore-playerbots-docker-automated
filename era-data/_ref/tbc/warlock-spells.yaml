    - { spell: 23825, effectId: 0, rows: { 416: 23829, 1860: 23844, 1863: 23836, 417: 23840, 17252: 35706 }, note: "MD r5." }
    - { spell: 35691/35692/35693, effectId: 0, pet: 0, aura: 35696, note: "Demonic Knowledge r1-r3 -> the pet-side 143 APPLY_AREA_AURA_OWNER carrier. All three talent ranks LIVE_MATCH and 35696 diverges only on an AttributesEx7 bit -> **GRANT is correct**." }
