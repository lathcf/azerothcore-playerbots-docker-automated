# =================================================================================================
# CORE HARDCODES — every SPELLFAMILY_WARLOCK arm and every warlock-relevant by-id `case` in the
# fork, with what it keys on and what that means for the era build. This is the lesson-20/23 pass.
# Answers (a)-(f) from the task brief are marked.
# =================================================================================================
core_hardcodes:
  conflagrate_immolate_consume:                       # ANSWER (a)
    where: "src/server/game/Spells/SpellEffects.cpp:386-430 (SPELLFAMILY_WARLOCK arm of the SCHOOL_DAMAGE handler)"
    keys_on: "`m_spellInfo->TargetAuraState == AURA_STATE_CONFLAGRATE` — a **DATA field**, not an id and not a family bit."
    mechanism: >-
      The branch (1) implicitly gates the cast on the target carrying the state, (2) adds a
      %-of-Immolate bonus computed from THIS spell's Effect_2/Effect_3 base values, (3) sets
      `apply_direct_bonus = false` so the flat damage takes no spellpower, and (4) removes the
      CASTER's Immolate unless Glyph of Conflagrate 56235 is held. `SpellInfo.cpp:1980` is what puts
      Immolate (family bit word0 0x4) and Shadowflame (word2 0x2) into the state in the first place —
      also family-based, also era-safe.
    disposition: >-
      **The Vanilla clone 932780 already answers this and its shape is copied verbatim.** Template
      17962 (inheriting TargetAuraState 14, category 672, the 10 s category cooldown, range, school
      and the family identity), author only e1, and leave e2/e3 ZERO so the %-bonus computes 0 and
      no DoT is applied. Consume + requirement survive with no script.
  create_healthstone_improved_lookup:                 # ANSWER (b)
    where: "src/server/scripts/Spells/spell_warlock.cpp:601-669 (`spell_warl_create_healthstone`)"
    keys_on: >-
      TWO-STAGE. It FINDS Improved Healthstone with
      `unitTarget->GetDummyAuraEffect(SPELLFAMILY_WARLOCK, 284, 0)` (family + **SpellIconID 284** +
      effect index 0), then switches on `aurEff->GetId()` against the literal
      `SPELL_WARLOCK_IMPROVED_HEALTHSTONE_R1 = 18692` / `_R2 = 18693` to pick the rank, logging
      `"Unknown rank of Improved Healthstone id: {}"` and falling back to rank 0 for anything else.
    disposition: >-
      **YES, it reads the stock ids — so node 20721 MUST GRANT 18692/18693.** Both are LIVE_MATCH
      and carry no live-extra slot, so the grant is exact. A band clone would be found by the icon
      lookup and then produce the un-improved healthstone plus an error-log line per cast.
  unstable_affliction_dispel:                         # ANSWER (c)
    where: "src/server/scripts/Spells/spell_warlock.cpp:1024-1049 (`spell_warl_unstable_affliction`), bound to -30108"
    keys_on: >-
      **NOTHING id-specific.** `HandleDispel` reads its own `GetEffect(EFFECT_0)` base amount,
      multiplies by 9 and casts the hardcoded payload `SPELL_WARLOCK_UNSTABLE_AFFLICTION_DISPEL =
      31117` at the dispeller. `Id == 30108` is never tested.
    disposition: >-
      Clone freely. Bind the script to the three clone ids in `scriptBindings:` (or to a negative
      root once the clone `spell_ranks` chain exists). TBC's 110/tick x 9 = 990 reproduces the
      tooltip's "990 damage to the dispeller and silence them for 5 sec" exactly, and 31117 is
      present live (diverges only on attribute bits).
  shadowburn_shard_refund:                            # ANSWER (d)
    where: "src/server/scripts/Spells/spell_warlock.cpp:1265-1283 (`spell_warl_shadowburn`), bound to the POSITIVE id 29341"
    keys_on: >-
      **Neither family bits nor the Shadowburn id.** The script is registered on
      `SPELL_AURA_CHANNEL_DEATH_ITEM` at EFFECT_0 of 29341 — the carrier every Shadowburn rank
      triggers (e1 eff 64) — and it merely prevents the default shard grant unless the target died
      while honor/XP-worthy.
    disposition: "Moot — Shadowburn is a GRANT, so the whole stock mechanism is inherited."
  proc_payload_reach:                                 # ANSWER (e)  — lesson 23
    soul_leech: "MASK for the trigger set (`spell_proc` -30293, family 5, mask0 0x181 + mask1 0x820000 = Shadow Bolt|Shadowburn|Searing Pain|Soul Fire|Incinerate|Conflagrate), **ID for the payload** (`SPELL_WARLOCK_SOUL_LEECH_HEAL = 30294` hardcoded). Heal %% comes from the aura's own EFFECT_0 amount. GRANT works."
    nightfall: "MASK for the trigger set (`spell_proc` -18094, family 5, mask0 0xa = Corruption+Drain Life), **ID for the payload** (`SPELL_WARLOCK_SHADOW_TRANCE = 17941`). GRANT works; the payload's own consume row is stock."
    pyroclasm: "NEITHER on this core in the TBC sense. TBC 18096/18073 carry `aura 112 OVERRIDE_CLASS_SCRIPTS misc 2188/2189` plus a dummy trigger 18350, and **3.3.5a implements no class script 2188/2189** (the only warlock cases in `Unit.cpp`'s class-script switch are 4992/4993 Soul Siphon and 6917/6926/6928 Death's Embrace). LIVE instead triggers 18093/63243, which are the WotLK **damage buff**, not a stun. AUTHOR + reconstruct the stun."
    aftermath: "MASK for the trigger set (`spell_proc` -18119, family 5, mask1 0x800000 = Conflagrate ONLY, the WotLK rework), **ID for the payload** (talent e1 aura 42 trigger 18118). TBC's set is the whole Destruction school and TBC 18118 dazes -50% with Mechanic 11 vs live -70% / Mechanic 27. AUTHOR + reconstruct the daze + write the correct proc row."
    backlash: "Neither family nor id — `spell_proc` -34935 is keyed purely on HitMask 1027 with an 8000 ms cooldown, and the payload 34936 is reached by the talent's own `aura 42` trigger. Everything matches TBC. GRANT works."
    shadow_embrace: "MASK (`spell_proc` -32385, family 5, mask0 0x1 + mask1 0x40000 = Shadow Bolt + Haunt) — the WotLK set. TBC's own e2 is `aura 112 OVERRIDE_CLASS_SCRIPTS misc 4994`, again a class script 3.3.5a does not implement, over the mask (0x402, 0x11, 0) = Corruption + Curse of Agony + Siphon Life + Seed of Corruption. AUTHOR + reconstruct the debuffs + write the correct proc row."
    improved_shadow_bolt: "MASK (`spell_proc` -17793, family 5, mask0 0x1) for the trigger, per-rank ID for the payload (talent e1 aura 42 trigger 17794/17798/17797/17799/17800). Those five payload ids are REPURPOSED live — see id_repurposing. AUTHOR + reconstruct."
  pet_aura_registration:                              # ANSWER (f)
    answer: >-
      **YES** — `Pet::CastPetAuras` (Pet.cpp:2354) replays the owner's whole `m_petAuras` set on
      every summon/load and nothing in the registration path (`AuraEffect::HandleAuraDummy`
      SpellAuraEffects.cpp:5186-5193, `Spell::EffectDummy` SpellEffects.cpp:761-766,
      `Unit::AddPetAura` Unit.cpp:13749) consults `Talent.dbc`, `HasTalent` or the talent frame, so
      a SPELLBOOK-LEARNED (era-granted) stock passive registers its `spell_pet_auras` rows exactly
      like a talented one, and it survives dismiss+resummon.
    citation: "Recorded in full at `era-data/_ref/tbc/hunter-spells.yaml` `pet_aura_census.mechanism.answer_to_spec_4d`; re-confirmed unchanged at fork HEAD for this phase."
    hard_condition: "The row is keyed `(spellId, effectId)` and fires only if that effect index is a DUMMY. Live Demonic Knowledge 35691-35693 e1 IS `aura 4 DUMMY` (row effectId 0) — so the GRANT delivers. Live Master Demonologist 23785/23822-23825 likewise register — which is precisely why granting them is WRONG (the payloads are WotLK's)."
  mana_feed_life_tap:
    where: "src/server/scripts/Spells/spell_warlock.cpp:841-851 (inside the Life Tap script)"
    keys_on: "`caster->GetAuraEffect(SPELL_AURA_ADD_FLAT_MODIFIER, SPELLFAMILY_WARLOCK, WARLOCK_ICON_ID_MANA_FEED = 1982, 0)` — **family + SpellIconID 1982 + aura 107 at effect index 0**."
    also: "The Drain Mana half is `SpellAuraEffects.cpp:6782-6796`: it reads the DRAIN MANA aura's own `GetBase()->GetEffect(1)` amount (i.e. Drain Mana's effect 2) as the pct and casts 32554 at the caster. TBC 30326's `aura 107 val 33 misc 12` (op 12 = SPELLMOD_EFFECT2) is exactly the spellmod that puts the number there."
    disposition: >-
      Node 20736 is AUTHOR, and the authored per-rank passive **must carry SpellIconID 1982 and put
      the `aura 107 / op 12` on effect index 0**, or the Life Tap half silently never fires. This is
      the one place in this class where an icon is load-bearing rather than cosmetic.
  soul_siphon_class_script:
    where: "src/server/game/Entities/Unit/Unit.cpp:8542-8578 (`case 4992: case 4993:` in the OVERRIDE_CLASS_SCRIPTS switch)"
    keys_on: "the aura's own MiscValue 4992/4993; `maxPercent` = the effect's amount, `stepPercent` = `CalculateSpellDamage(..., 0)` (this map's e1), and the counted set is the hardcoded Affliction mask `SpellFamilyFlags[1] & 0x0004071B || SpellFamilyFlags[0] & 0x8044C402`."
    disposition: "AUTHOR is safe — an era passive carrying `aura 112` with misc 4992/4993 and the TBC magnitudes (e1 2/4, e2 cap 24/60) gets the exact core mechanism. The hardcoded Affliction mask covers Corruption / CoA / Siphon Life / Seed of Corruption, matching the TBC tooltip."
  demonic_aegis:
    where: "src/server/game/Spells/Auras/SpellAuraEffects.cpp:6643-6645"
    keys_on: "family + `SpellFamilyFlags[1] & 0x20000000` (Fel Armor) on the target aura, then `GetAuraEffect(SPELL_AURA_ADD_PCT_MODIFIER, SPELLFAMILY_WARLOCK, icon 89, 0)` on the caster."
    disposition: "GRANT 30143-30145 (LIVE_MATCH). If it were ever authored, the passive would need SpellIconID 89."
  conflagrate_attributescu_by_id:
    where: "src/server/game/Spells/SpellMgr.cpp:3702 — `case 17962: ... AttributesCu |= SPELL_ATTR0_CU_NO_POSITIVE_TAKEN_BONUS`"
    keys_on: "the literal spell id 17962."
    disposition: >-
      **A band clone does not get it, and this one is invisible to `era_audit.py`'s
      `check_spellfix_inheritance`, which only reads `ApplySpellFix({...})` calls in
      `SpellInfoCorrections.cpp` — this `case` lives in `SpellMgr.cpp`'s AttributesCu sweep.**
      Recorded as accepted gap 6; it already applies to the shipped Vanilla clones 932780-932783 and
      will apply to the TBC clones 948650-948655. Impact is small because the era clone deals FLAT
      damage with `apply_direct_bonus = false` rather than the WotLK %-of-Immolate, so there is very
      little "positive taken bonus" left to double-count.
  other_family_arms_swept_and_irrelevant:
    - "SpellInfo.cpp:1883 — Curse of Doom/Exorcism target-type hack, keyed on Category 1179. Baseline."
    - "SpellInfo.cpp:2126 — SPELL_SPECIFIC (curse / warlock armor), family + mask. Baseline."
    - "SpellMgr.cpp:169 / 356 — diminishing-returns group + PvP duration for curses / Banish / Curse of Tongues. Family + mask, era-safe."
    - "SpellMgr.cpp:3450 — Haunt/Drain Soul excluded from BINARY_SPELL. Mask-based."
    - "SpellAuras.cpp:1614-1630 — Improved Fear (53759/53754), a WotLK talent. Unreachable."
    - "SpellAuraEffects.cpp:6782 — Drain Mana / Mana Feed (see mana_feed_life_tap)."
    - "Spell.cpp:2303 — Hellfire proc reclassification, mask 0x40. Baseline."
    - "Unit.cpp:8738-8756 — Fire and Brimstone (icon 3173), Drain Soul <25%% x4, Shadow Bite. All WotLK or baseline."
    - "SpellEffects.cpp:373-385 — Incinerate's +25%% vs Immolate, keyed on `SpellFamilyFlags[1] & 0x40 && SpellIconID == 2128`. Baseline (Incinerate is a trained spell)."
