method:

  # =============================================================================================
  # READ THESE CONVENTIONS BEFORE USING ANY NUMBER IN THIS FILE.
  # =============================================================================================
  conventions:

    effect_slot_numbering: >-
      THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/Effect_2/Effect_3,
      i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is DBC
      slot 1. Wherever a core-source token appears (script_census, and the Devastate/Concussion Blow
      entries whose core handlers read a specific index) it is written
      `EFFECT_n (0-based core enum; = this map's e<n+1>)`. Never translate one to the other by name.

    magnitudes_are_effective: >-
      EVERY magnitude in this file is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides == 1`
      and `basePoints` when DieSides is 0 (SpellEffectInfo::CalcBaseValue). Both sides of every
      comparison are normalised the same way before diffing, so a clone or live row that moved the +1
      into DieSides does not read as a divergence. Raw base-points figures, where quoted, say "raw".

    rage_is_manacost: >-
      Warrior rage costs ride the `ManaCost` column (wago SpellPower.ManaCost), stored x10: TBC
      Bloodthirst `powerCost=300` is 30 rage. Rage GRANTED by an ENERGIZE effect is likewise x10:
      TBC Shield Specialization's trigger 23602 has `val10` = 1 rage. Every `powerCost=` in a `tbc:`
      line below carries the decoded rage figure in parentheses.

    verdict_vocabulary: >-
      LIVE_MATCH = every compared field agrees. DIVERGED = at least one compared field differs.
      WAGO_ONLY = present in TBC, ABSENT from the live 3.3.5a store (Spell.dbc + the
      acore_world.spell_dbc overlay) — must be authored, never granted. LIVE_ONLY = present live,
      absent from TBC — must not be reachable by a TBC warrior. LIVE_MATCH_UNVERIFIED_SLOT =
      everything comparable agrees BUT at least one live slot has no wago counterpart row at all; it
      is a distinct token precisely so a consumer matching `LIVE_MATCH` exactly does not silently
      accept it. Any entry carrying `unverified_slots:` must be read before it is trusted.

    tbc_line_is_authoritative: >-
      Every survival_map entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record an author needs
      to reproduce the spell (per-effect tuple incl. effect class masks and implicit targets, plus
      duration/proc/power/cooldown/category/mechanic/preventionType/casterAuraState/shapeshift/equip/
      spellLevel/family/ownMask and every non-zero attribute word). Tasks 6-8 author FROM THIS LINE;
      they do not need to re-fetch wago. Where a field is absent from the line, it is zero in TBC.

  live_dbc:
    source: /azerothcore/env/dist/data/dbc/Spell.dbc inside the running ac-worldserver
    md5: 49c9c5f53e8974c27d67635384725f46
    live_verified: >-
      `docker exec ac-worldserver md5sum` and the repo's `azerothcore-wotlk/ip-dbc/Spell.dbc` return
      the IDENTICAL md5 (49c9c5f53e8974c27d67635384725f46, 53466210 bytes) — no client/server
      generation mismatch, so the sweep's live side is the store the worldserver actually runs.
      NOTE the plan's Step-2 `docker cp` fails on this image ("read-only file system"); the working
      extraction is `docker exec ac-worldserver cat <path> > out`.
  db_overlay: >-
    The DBC on disk is not the whole live store: acore_world.spell_dbc (6983 rows) REPLACES records at
    load. Exactly ONE id in this map is covered — 18350 "Dummy Trigger" (SPELL_EFFECT_DUMMY, no aura),
    which is absent from BOTH the 3.3.5a DBC and wago 2.5.4 but present in the DB, i.e. the SERVER has
    it. It matters here because TBC Rampage 29801 e1 triggers it (see capstone_chains.rampage).
  tbc_source: >-
    wago 2.5.4.44833 — SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellClassOptions,
    SpellCategories, SpellCooldowns, SpellAuraRestrictions, SpellShapeshift, SpellLevels,
    SpellEquippedItems, SpellInterrupts, SpellTargetRestrictions, SpellName, Spell, SpellDuration,
    SpellRange, SpellCastTimes. Tooltips cached under era-data/_ref/tbc/tooltips/<id>.json (58 warrior
    ids fetched this task). Behavior tiebreaker: github.com/wowsims/tbc sim/warrior/{talents,rampage,
    sweeping_strikes}.go.

  # ---------------------------------------------------------------------------------------------
  # COLUMN LIST ACTUALLY COMPARED. Workflow lesson 11 exists because a whole family sat outside the
  # diff in every prior phase. This pass compares FOURTEEN families from the first run; the two that
  # the plan's own script did NOT list are called out, because both found real divergences.
  # ---------------------------------------------------------------------------------------------
  families_compared:
    A_effects: >-
      per slot: Effect, EffectAura, EFFECTIVE base points, EffectMiscValue_0, EffectMiscValue_1(B),
      EffectTriggerSpell, EffectAuraPeriod, EffectRadiusIndex_0, EffectMechanic, EffectChainTargets,
      EffectRealPointsPerLevel, ImplicitTarget_0(A), ImplicitTarget_1(B).
    B_proc_options: ProcChance, ProcCharges, ProcTypeMask, CumulativeAura (wago SpellAuraOptions).
    C_misc: >-
      DurationIndex, CastingTimeIndex, RangeIndex, SchoolMask, Speed, and ALL EIGHT attribute words
      (wago SpellMisc.Attributes_0..7 vs live Attributes/AttributesEx..Ex7).
    D_categories: Category, DefenseType, DispelType, Mechanic, PreventionType, StartRecoveryCategory.
    E_power: ManaCost, ManaCostPct (wago SpellPower OrderIndex 0).
    F_class_options: SpellClassSet and the spell's OWN identity mask WORD 0 only.
    G_cooldowns: RecoveryTime, CategoryRecoveryTime, StartRecoveryTime (wago SpellCooldowns).
    H_aura_restrictions: >-
      CasterAuraState, TargetAuraState, ExcludeCasterAuraState, ExcludeTargetAuraState,
      CasterAuraSpell, TargetAuraSpell, ExcludeCasterAuraSpell, ExcludeTargetAuraSpell.
      **NOT IN THE PLAN'S SCRIPT.** It is what found TBC Rampage's `CasterAuraState 11` crit gate.
    I_shapeshift: >-
      ShapeshiftMask, ShapeshiftExclude — the warrior STANCE gate. **NOT IN THE PLAN'S SCRIPT.**
      It is what found Berserker Rage 18499 carrying `ShapeshiftMask 0x40000` in TBC and 0 live.
    J_levels: BaseLevel, MaxLevel, SpellLevel.
    K_equipped_item: >-
      EquippedItemClass, EquippedItemSubclass, EquippedItemInvTypes. It is what found TBC Devastate
      requiring a ONE-HANDED WEAPON (class 2 / subclass 0xa091) where live requires a SHIELD
      (class 4 / subclass 0x40).
    L_interrupts: InterruptFlags, AuraInterruptFlags, ChannelInterruptFlags.
    M_targets: Targets, TargetCreatureType, MaxTargets.
    N_identity: >-
      Name_lang vs the live DBC Name_Lang_enUS — the ID-REPURPOSING detector. WotLK reused FIVE TBC
      warrior talent ids for DIFFERENT talents; see `id_repurposing:`. Nothing else in the sweep
      would have caught 29723 (TBC Improved Disciplines / live Sudden Death) as a hazard.
    O_effect_class_masks: >-
      Per-effect EffectSpellClassMask words 0/1/2. Compared as a SUPPLEMENTARY pass whose result is
      recorded in `effect_class_mask_diffs:` and deliberately does NOT feed the verdict — see that
      section for why, and for the FOUR entries in it that are load-bearing rather than encoding drift.

  corrections_to_the_plan_script:
    live_column_names: >-
      The plan's Step-3 snippet reads `cols["SpellClassMaskA"]` and `cols["EffectRadiusIndex_N"]`.
      `tools/spell_dbc_columns.txt` actually spells the spell's own identity words
      `SpellClassMask_1/_2/_3` (1-based) — there is no `SpellClassMaskA`. The mapping used here is
      wago `SpellClassMask_0` (word 0) -> live `SpellClassMask_1`. `EffectRadiusIndex_N` is correct.
    base_points_convention: >-
      The shaman ref's correction carries over unchanged and was re-verified on this id set: wago
      2.5.4 stores EffectBasePoints in the SAME raw (value-1) convention as the 3.3.5a DBC, so the
      comparison must normalise BOTH sides to the effective value. Anchor re-measured here: TBC
      Bloodthirst 23881 raw basePoints 44 / DieSides 1 = effective 45, matching the Wowhead TBC
      tooltip "(Attack Power * 45 / 100)".
    float_columns: >-
      Spell.dbc stores Speed, EffectRealPointsPerLevel_N, EffectMultipleValue_N, EffectPointsPerCombo_N
      and EffectChainAmplitude_N as FLOATS. Unpacking the whole record as int32 (which the plan's
      snippet does) makes every non-zero float read as a garbage integer — e.g. Battle Shout 2048
      reported "EffectRealPointsPerLevel TBC1 -> LIVE1065353216" (0x3F800000 = 1.0f). The sweep here
      unpacks those columns as floats and rounds to 4 dp; nothing in this id set diverges on them.
    dbc_only_verdict_is_wrong_for_18350: >-
      A DBC-only diff verdicts 18350 as absent from the live store. It is not: acore_world.spell_dbc
      supplies it. The sweep takes `spell_dbc` membership as live presence.

  noise_filters_applied:
    - "DurationIndex disagreement confined to {0, 21} (both mean permanent) on a passive."
    - "A live slot with NO wago SpellEffect row is reported as `unverified_slots:`, never as a
       divergence: DB2 stores no empty-effect row, so the absence of a row is not evidence of a zero.
       The filter fires only when the live slot is actually used (Effect != 0 or base points != 0)."
    - "A missing wago SpellAuraOptions row opposite the live 'not a proc' default
       (ProcChance 101 or 0 / charges 0 / mask 0 / stack 0). Where TBC has no row and LIVE really is
       a proc, the difference IS printed (`ProcRow TBC(no SpellAuraOptions row)->LIVE ...`) —
       Recklessness 1719 is the one hit in this id set."
    - "NOTHING in the attribute words is filtered. All eight are compared verbatim; every difference
       is hand-adjudicated in `attribute_divergences:` with the AzerothCore bit name."
    - "Per-effect class masks are excluded from the VERDICT only (see families_compared.O); all 67
       differences are recorded in full under `effect_class_mask_diffs:`."

  ids_swept: 308
  verdict_counts:
    LIVE_MATCH: 100
    LIVE_MATCH_UNVERIFIED_SLOT: 12
    DIVERGED: 158
    WAGO_ONLY: 24
    LIVE_ONLY: 14

  id_set_construction: >-
    Seed = all 199 distinct rank spells across the 66 skeleton nodes, plus the three stance auras
    2457 / 71 / 2458 (spec §4a). Closure = TRANSITIVE over EffectTriggerSpell on BOTH sides (wago and
    the live DBC), re-run after every extension until it added nothing. Extensions made during the
    task, each of which the closure alone would have missed:
      * the granted-active TRAINED RANK chains (Mortal Strike, Bloodthirst incl. its per-rank heal
        buffs, Shield Slam, Devastate, Rampage) — trained ranks are same-name siblings, not trigger
        targets, so no closure reaches them;
      * the 25 baseline spells the tree's spellmods target (Heroic Strike, Rend, Charge, Thunder Clap,
        Overpower, Whirlwind, Cleave, Execute, Slam, Berserker Rage, Hamstring, Intercept, Bloodrage,
        Sunder Armor, Disarm, Taunt, Shield Wall, Shield Bash, Shield Block, Revenge, Demoralizing
        Shout, Battle Shout, Intimidating Shout, Recklessness, Retaliation) — informational, since a
        stock base spell can never be era-corrected, but three of them turn out to matter (see
        `baseline_leaks:` and `accepted_gaps:`);
      * **the three core-hardcast STANCE PASSIVES 21156 / 7376 / 7381** — `HandleAuraModShapeshift`
        (SpellAuraEffects.cpp:1377-1384) casts one per stance and NO talent row or DB2 trigger
        references them. Two of the three DIVERGE. This is the warrior analog of the druid form
        auras (workflow lesson 2) and the single most important id-set extension of the task;
      * Second Wind's heal payloads 29841 / 29842 — reached only through the core script's hardcoded
        switch (spell_warrior.cpp:1032-1040), not through any data trigger;
      * the Deep Wounds intermediate chain 12162 / 12850 / 12868 and the Sword-Spec extra-attack
        payload 16459, for the same reason.
    The sweep is closed: re-running the transitive walk over the final 308-id set adds nothing.
# =================================================================================================
# NODE BUCKETS — the disposition every authoring task (6/7/8) starts from. 66 nodes, no node omitted.
# Bucket vocabulary:
#   grant_stock          the node GRANTS a live stock id verbatim (TBC == live on every family)
#   authored_passive     the generator mints the passive from the wago values (spellmod/stat/proc/
#                        multi). No stock id is granted, so a DIVERGED or WAGO_ONLY or REPURPOSED
#                        stock rank is HARMLESS for these nodes — it is only a source of numbers.
#   authored_plus_helper authored passive whose payload (a triggered buff/stun/heal/bleed/energize)
#                        must be a FRESH band clone because the stock payload diverges
#   clone                the node grants a FRESH band clone of a stock ACTIVE ability
#   reconstruction       no usable stock carrier; the mechanic is rebuilt from parts
# `script:` names the module script the node reuses. All four already exist in
# EraTalentProcScripts.cpp and are era-agnostic; under the recommended dispositions this phase needs
# NO new C++ at all (Rampage included — see capstone_chains.rampage).
# =================================================================================================
node_buckets:

  counts:
    grant_stock: 4
    authored_passive: 48
    authored_plus_helper: 6
    clone: 7
    reconstruction: 1
    total: 66
    note: >-
      A node can carry BOTH a bucket and a `script:`; the counts above partition the 66 nodes by
      bucket only. Four nodes reuse an EXISTING module script — 20308 (era_deep_wounds), 20337
      (era_improved_berserker_rage, via the misc-15 DUMMY marker), 20340 (era_bloodthirst_vanilla),
      20349 (era_last_stand) — and one rebinds an existing CORE script, 20335
      (spell_warr_sweeping_strikes). No new C++ is required by any node under these dispositions.

  grant_stock:
    - id: 20319
      name: Mortal Strike
      grants: 12294
      why: >-
        12294 LIVE_MATCH on all fourteen families. The stock TRAINED chain is also era-correct at TBC
        levels — 21551@48 / 21552@54 / 21553@60 / 25248@66 / 30330@70 all exist on TrainerId 1 with a
        ReqAbility1 chain rooted at 12294, and every one of them is LIVE_MATCH. Granting stock gives a
        TBC warrior exactly the TBC rank ladder with no trainer SQL at all. r7/r8 (47485@75 / 47486@80)
        are unreachable at the TBC level cap, so no gate is needed.
    - id: 20320
      name: Second Wind
      grants: [29834, 29838]
      why: >-
        29834 LIVE_MATCH; 29838's only difference is ProcTypeMask bit 31 (0x80000000), a TBC-only
        encoding bit with no meaning in 3.3.5a (highest defined ProcFlag is bit 24, PROC_FLAG_DEATH) —
        see attribute_divergences.tbc_only_procflag_bit31. Heal payloads 29841/29842 are LIVE_MATCH.
      hard_constraint: >-
        MUST be granted, NOT cloned. `spell_warr_second_wind` (spell_warrior.cpp:996; the switch is at :1032) picks the heal
        by a hardcoded `switch (GetId())` over {29838, 29834, 42770} with `default: return` — a clone
        with a fresh id falls into `default` and the talent silently does NOTHING. This is the
        strongest form of workflow lesson 6 in the tree.
    - id: 20328
      name: Piercing Howl
      grants: 12323
      why: >-
        Diverges only on AttributesEx6 bit 23 (SPELL_ATTR6_TAPS_IMMEDIATELY, a WotLK-engine bit — see
        attribute_divergences) and BaseLevel/SpellLevel 0 -> 20. No mechanical difference.
    - id: 20345
      name: Tactical Mastery
      grants: [12295, 12676, 12677]
      why: 12295/12676/12677 all LIVE_MATCH (rage retained 5/10/15 + the two Defensive-Stance threat spellmods).
      hard_constraint: >-
        The rage-retention magnitude is read by CORE CODE, not by the aura: HandleAuraModShapeshift
        (SpellAuraEffects.cpp:2218-2233) walks the player's SPELL map and TALENT map and sums
        `CalculateSpellDamage(target, spellInfo, 0)*10` for every entry with
        `SpellFamilyName == SPELLFAMILY_WARRIOR && SpellIconID == 139`. Live 12295/12676/12677 are
        family 4 / icon 139 (verified). Granting stock therefore works, and it works via the SPELL-map
        loop, which is the era-safe one: an era-managed character's native TALENT map is stripped, so a
        talent-map-only mechanism would have been dead. **If Task 8 ever replaces this with an authored
        clone, the clone MUST carry `family: 4` and SpellIconID 139 or the rage retention is silently
        zero** — the icon is load-bearing behaviour, not decoration.

  clone:
    - id: 20312
      name: Death Wish
      stock: 12292
      why: >-
        TBC 12292 has THREE effects — e1 aura79 MOD_DAMAGE_PERCENT_DONE +20 misc1, e2 aura77
        MECHANIC_IMMUNITY val100 misc5, e3 aura87 MOD_DAMAGE_PERCENT_TAKEN +5 misc127 — 30 s, 3 min cd,
        10 rage. Live 12292 keeps e1 and e3 verbatim and drops ONLY e2; it also adds the spell-level
        `Mechanic 31` (MECHANIC_ENRAGED) + `DispelType 9` (DISPEL_ENRAGE) that TBC does not have.
        Granting stock therefore costs a TBC warrior the FEAR IMMUNITY its own tooltip promises
        ("makes you immune to Fear effects") and makes the buff enrage-dispellable.
      why_correction_2026_09_02: >-
        This entry PREVIOUSLY read "Live 12292 dropped e2 and e3 entirely and moved the fear immunity
        to the spell-level Mechanic 31 + DispelType 9. Granting stock gives a TBC warrior a Death Wish
        with no +5% damage taken (a straight buff over the era version)." **Both halves were wrong**
        and are retracted here (workflow lesson 15 — a wrong rationale under a right decision). BOTH
        RAW VALUES, measured at Task 6 with tools/dump_spell_effects.py against the running server's
        Spell.dbc (md5 49c9c5f53e8974c27d67635384725f46): live 12292 e2 = `Effect_2 0 / basePoints -1`
        (empty) but live 12292 **e3 = `Effect_3 6 / EffectAura_3 87 / basePoints 4 dieSides 1 / misc
        127`** = MOD_DAMAGE_PERCENT_TAKEN +5, i.e. IDENTICAL to TBC's e3 — which is exactly what
        survival_map[12292] already said (its `detail` flags e2 only). MECHANIC_ENRAGED is not a fear
        immunity; WotLK made Death Wish an Enrage effect, it did not relocate the immunity. The
        DECISION (clone, not grant) is unchanged and is now carried by the fear-immunity half alone.
      vanilla_helper: 932808 exists but is NOT reusable — see reuse_ledger.
