# capstone chain resolution, Vanilla-helper reuse ledger, stance-implied findings and baseline-leak list
# for Plan Task 3 of docs/superpowers/plans/2026-09-02-era-talents-tbc-phase4-warrior.md.
#
# Era-scoped. The era-less `era-data/_ref/warrior-spells.yaml` is VANILLA-verified (1.12.1 vs 3.3.5a)
# and MUST NOT be inherited for magnitudes. Its family-4 IDENTITY-MASK table (`spells:`) and its
# `weaponSubclassMasks:` block ARE era-neutral (they describe the LIVE 3.3.5a store, which both eras
# share) and are referenced rather than duplicated here. Its `triggers:`/`grants:` magnitudes are
# Vanilla and are re-derived here for TBC.
#
# Class 1, spell family 4 (SPELLFAMILY_WARRIOR). era_audit.py's family guard covers family 4
# (tools/era_audit.py:453) — a wrong `family:` is a dataset bug, never an audit bug.
#
# Produced by Plan Task 3, 2026-09-02. Authority chain: wago 2.5.4.44833 component tables for TBC
# structure+magnitudes, wowsims/tbc for behavior the tables cannot express, the LIVE 3.3.5a server for
# what this core actually has. Where this file and the spec's §3 buckets disagree, THIS FILE WINS —
# see `spec_bucket_contradictions:`.

