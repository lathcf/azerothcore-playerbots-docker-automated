    divergences:
      damage: "TBC e1 `SPELL_EFFECT_WEAPON_PERCENT_DAMAGE 50` + e2 `NORMALIZED_WEAPON_DMG 15/25/35` (per Sunder application). LIVE e2 `WEAPON_PERCENT_DAMAGE 120` + e3 `NORMALIZED_WEAPON_DMG 58/96/134`."
      weapon_requirement: >-
        **TBC requires a ONE-HANDED MELEE WEAPON** (EquippedItemClass 2 / subclass 0xa091 = 41105 =
        axe|mace|sword|fist|dagger, the era-less ref's `oneHandSpecMask`); the Wowhead TBC tooltip
        prints "Requires One-Handed Melee Weapon". **LIVE requires a SHIELD** (class 4 / subclass 0x40).
        Granting stock would silently impose WotLK's shield requirement on a TBC warrior.
      identity_mask: "TBC own-mask word 0 = 0x4000 (Sunder Armor's bit — TBC Devastate shares it). LIVE word 0 = 0, identity moved to word 1 bit 6 (0x40)."
    core_handling_the_census_cannot_see:
      where: src/server/game/Spells/SpellEffects.cpp:3418-3434, inside Spell::EffectWeaponDamage.
      what: >-
        `case SPELLFAMILY_WARRIOR: if (m_spellInfo->SpellFamilyFlags[1] & 0x40) { CastSpell(target,
