  authored_plus_helper:
    - id: 20308
      name: Deep Wounds
      helper: fresh bleed carrier (a TBC sibling of Vanilla 932800)
      script: era_deep_wounds
      why: >-
        The talent rows 12834/12849/12867 diverge only on AttributesEx3 bits, but the MECHANIC diverges
        completely. TBC: 20/40/60% of average melee weapon damage over 12 s, carrier 12721 with
        `period 3000 ms` (4 ticks) and spell-level `Mechanic 15` (BLEED). Live: the core pair
        `spell_warr_deep_wounds_aura` (-12834) + `spell_warr_deep_wounds` (-12162) computes
        `ApplyPct(damage, 16.0f * GetRank() / 6.0f)` per tick on carrier 12721 with `period 1000 ms`
        over 6 s = WotLK's 16/32/48%. Both the percentage AND the tick cadence differ.
      reuse_verdict: >-
        Reuse the SCRIPT; the BLEED HELPER must be fresh (Vanilla 932800 is `period 1000 ms` =
        12 ticks; TBC needs `period 3000 ms` = 4 ticks). The script's ARITHMETIC is era-agnostic — it
        reads its own DUMMY marker's amount and divides by `bleed->GetMaxTicks()`, so it produces the
        right per-tick value for any helper cadence.
      reuse_verdict_correction_2026_09_02: >-
        This entry PREVIOUSLY said the script was "era-agnostic" full stop, which read as "reuse it
        untouched". **It is not: `era_deep_wounds` HARDCODES the carrier** —
        `EraTalentProcScripts.cpp:1063` `enum : uint32 { SPELL_ERA_DEEP_WOUNDS_BLEED = 932800 }`, cast
        at `:1090` — so a TBC node bound to the unmodified script would have shipped TBC's 20/40/60%
        through the VANILLA 1000 ms / 12-tick carrier, i.e. exactly the cadence divergence the fresh
        helper exists to fix, AND through a family-LESS bleed that Blood Frenzy cannot bind. Task 6
        therefore made a small, ownership-gated C++ change: the script picks 947551 when the PROCCING
        PASSIVE is one of the TBC node's own auto-passives (938464/938465/938466 =
        custom_passive_id(20308, 1..3)) and 932800 otherwise. Ownership of the proccing aura, never
        an "is a bot" test and never a live era lookup.
      blood_frenzy_interaction: >-
        LOAD-BEARING and new in TBC (Vanilla warrior had no Blood Frenzy). TBC Blood Frenzy 29836's
        aura-109 EffectSpellClassMask is `(0x20, 0x10, 0)` = Rend's word-0 bit 5 PLUS Deep Wounds'
        word-1 bit 4; live 29836's is `(0x20, 0, 0)` — WotLK dropped the Deep Wounds bit. So the TBC
        era bleed helper must be reachable by the authored Blood Frenzy mask. Two routes: give the
        helper `family: 4` + `maskB: 0x10` (stock 12721's own identity, so the same mask value works)
        and bind Blood Frenzy with an explicit `affectsMask: {a: 0x20, b: 0x10}`; or bind Blood Frenzy
        by explicit `affects:` on Rend + the helper. NOTE the Vanilla bleed 932800 was deliberately
        made FAMILY-LESS "so no warrior spellmod touches it" — the TBC helper must NOT copy that
        choice, or Blood Frenzy silently misses half its trigger set.
    - id: 20313
      name: Mace Specialization
      helper: fresh stun+energize payload (TBC 5530 shape)
      why: >-
        TBC 12284..12704 are `aura 42 PROC_TRIGGER_SPELL -> 5530`, ProcChance 100 / procFlags 20, with
        the per-rank chance living in the talent's spell_proc (Wowhead TBC r1-r5 all read "a chance");
        live 12284..12704 were reworked into `aura 280 MOD_ARMOR_PENETRATION_PCT 3/6/9/12/15` — a
        different talent entirely. The payload 5530 is likewise repurposed (see `id_repurposing:`).
