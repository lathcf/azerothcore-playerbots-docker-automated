  protection_unverified_live_slots:
    status: >-
      **DECIDED at Task 8 (Protection authoring), 2026-09-03. Author the wago slots ONLY; drop every
      live-only slot.** Six Protection nodes are LIVE_MATCH_UNVERIFIED_SLOT or carry an extra live
      effect with no wago SpellEffect row. Decided as ONE question because the evidence and the
