    - id: 20349
      name: Last Stand
      stock: 12975
      why: >-
        TBC RecoveryTime 480 000 ms (8 min, in RecoveryTime); live CategoryRecoveryTime 180 000 ms
        (3 min, in the CATEGORY column, Category 1251). Also BaseLevel/SpellLevel 0/1 vs 20/20.
      script: era_last_stand
      data_gap_resolved: >-
        wago 12975 e1 is `SPELL_EFFECT_DUMMY` with EFFECTIVE value 0 — TBC does not store the 30% in
