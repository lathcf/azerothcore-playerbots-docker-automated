baseline_leaks:
  method: >-
    For every spell the tree GRANTS (or would grant), query trainer_spell for the spell and its rank
    chain, then apply the framework's trainer-gating INTENT test: a row is a hole only if a TBC warrior
    could obtain the talent-gated spell WITHOUT the talent.
  granted_actives_not_on_any_trainer:
    ids: [12294, 23881, 23922, 20243, 12809, 12328, 12975, 12292, 12323, 29801]
    finding: >-
      Rank 1 of every talent-granted active in the tree is absent from `trainer_spell` entirely
      (verified by a single query over the whole 308-id set). There is no rank-1 leak anywhere in the
      warrior tree.
  trained_rank_chains_reachable_at_TBC_levels:
    - chain: Mortal Strike
      rows: "21551@48 (req 12294), 21552@54, 21553@60, 25248@66, 30330@70"
      disposition: none
      why: >-
        Node 20319 GRANTS stock 12294, so this chain is exactly the TBC rank ladder and SHOULD be
        reachable. Every rank is LIVE_MATCH. Leaving it alone is the era-correct outcome, not an
        oversight. (47485@75 / 47486@80 are above the cap.)
    - chain: Shield Slam
      rows: "23923@48 (req 23922), 23924@54, 23925@60, 25258@66, 30356@70"
      disposition: gate
      why: >-
        Node 20362 grants a CLONE, so stock r1 23922 is never held and the ReqAbility1 chain is
        self-gating on its own. BUT the existing `kBaselineSpellGates` row force-grants stock 23922 at
        L40 to non-Vanilla eras (`grantHigherEra=true`) — which, once TBC owns trees, would hand a
        TBC warrior stock Shield Slam r1 for free AND unlock the whole stock trained chain. **This is
        the one real leak in the tree, and it is created by our own substrate rather than by Blizzard
        data.** Fix = the three-way split the plan's Task 5 Step 1 already specifies: TBC takes the
        STRIP arm keyed on node 20362.
    - chain: Devastate
      rows: "30016@60 (req 20243), 30022@70 (req 30016)"
      disposition: none
      why: >-
        Node 20365 grants a clone; stock 30016's ReqAbility1 is stock 20243, which a TBC warrior never
        holds. Self-gating. **Do not add a DELETE** — see capstone_chains.devastate.trainer_sql.
    - chain: Bloodthirst
      rows: none
      disposition: none
      why: stock Bloodthirst has no trainer rows on this server at all.
    - chain: Rampage
      rows: none
      disposition: none
      why: stock Rampage has no trainer rows and no rank chain (WotLK's is a 1-rank passive).
  baseline_spells_the_tree_modifies:
    finding: >-
      All 25 are ordinary trainer-taught baseline abilities available to every warrior in both eras
      (Charge@4, Rend@4, Thunder Clap@6, Hamstring@8, Bloodrage@10, Shield Bash@12, Overpower@12,
      Demoralizing Shout@14, Revenge@14, Shield Block@16, Disarm@18, Cleave@20, Retaliation@20,
      Intimidating Shout@22, Execute@24, Shield Wall@28, Slam@30, Intercept@30, Berserker Rage@32,
      Whirlwind@36, Recklessness@50, Battle Shout@69-rank-8, Taunt/Sunder Armor/Heroic Strike at low
      levels). None is talent-gated in either era, so none is a leak.
    but: >-
      Several of them DIVERGE from TBC in ways an era character cannot be shielded from — see
      accepted_gaps.baseline_ability_divergences. That is a fidelity note, not a leak.
  reconcile_disposition_table_rows_needed:
    - "Shield Slam: split EraTalents.cpp:404 three ways (Vanilla node 18552 / TBC node 20362 / WotLK auto-grant)."
    - "Bloodthirst: three-way the kWarriorTrainedRanks strip and the stock-23881 strip (Vanilla clones 932829-831, TBC clone ranks, both strip stock)."
    - "Last Stand: three-way the stock-12975 strip (both managed eras strip it; each keeps its own clone)."
    - "Rampage / Devastate: new TBC-only trainer-taught clone chains ⇒ new `.eratalents doctor` range predicates (plan Task 5 Step 3)."

# =================================================================================================
spec_bucket_contradictions:
  note: >-
    Findings that contradict the spec's §3 PROVISIONAL buckets. Per the plan's Task-3 exit gate these
    become spec **Amendment A**, and where the plan's later prose disagrees with them, Amendment A wins.
  rows:
    - spec_says: "§3a lists Second Wind, Focused Rage, Precision, Weapon Mastery, Improved Whirlwind and Improved Berserker Stance as 'new-in-2.x candidates (author from scratch)'."
      finding: >-
        Only two of the six are meaningfully new work. **Second Wind must be GRANT-STOCK, not authored**
        — the core script switches on a hardcoded id list and a clone is silently inert. **Precision,
        Weapon Mastery and Focused Rage are LIVE_MATCH** ordinary authored passives (Focused Rage needs
        an explicit affectsMask, nothing more). Only **Improved Whirlwind** (TBC cooldown vs live
        damage) and **Improved Berserker Stance** (TBC attack-power% vs live Strength%) are real
        re-authors, and neither is "from scratch" — both are one-effect passives.
    - spec_says: "§3b lists 'Shield Slam/Bloodthirst rank chains (TBC adds trained ranks in 61-70)' as retune candidates."
      finding: >-
        Correct but incomplete: **BOTH must clone, not retune**, and Bloodthirst's decisive divergence
        is the 6 s vs 4 s CATEGORY cooldown, which the plan's own Step-3 script does not compare. Also
        the TBC Bloodthirst ladder is SIX ranks (40/48/54/60/66/70), not the four the Vanilla dataset
        shipped, and Shield Slam's is six (40/48/54/60/66/70).
    - spec_says: "§3b lists Flurry and Tactical Mastery as retune candidates whose 'Vanilla ref diagnoses seed this bucket'."
      finding: >-
        **Both are LIVE_MATCH in TBC and need no clone at all.** The Vanilla ref's Flurry buff/proc
        split and Tactical Mastery notes are 1.12.1-vs-3.3.5a findings that do NOT carry to TBC:
        TBC Flurry is +5/10/15/20/25% (identical to 3.3.5a) where Vanilla was +10..30%, and TBC
        Tactical Mastery has the extra Defensive-Stance threat effects that Vanilla lacked. Reading the
        prior-era ref was still the right call (workflow lesson 12) — it just refuted the hypothesis
        instead of confirming it, which is the outcome the lesson is silent about.
    - spec_says: "§3a 'Endless Rage (Arms capstone, 29623): survival vs 3.3.5a unknown until swept — do not assume either way.'"
      finding: LIVE_MATCH. `aura 213 MOD_RAGE_FROM_DAMAGE_DEALT +25`, identical on both sides. Plain authored passive.
    - spec_says: "§4a frames the stance risk as 'stance-modifying talents may act on those hidden spells rather than the talent's own row'."
      finding: >-
        The talents do NOT act on the stance passives — Improved Berserker Stance and Improved
        Defensive Stance both carry ShapeshiftMask 0 and modify nothing stance-side. The real finding is
        the opposite shape: **the stance passives 7376 and 7381 diverge on their own**, with no talent
        involved, and cannot be era-corrected from the talent side at all. Spec §4a's mechanism is
        wrong; its instinct (chase the hidden stance spells) is what found the actual defect.
    - spec_says: "§4b predicts a spell_script_names census with surprises 'like the shaman census (17 rows, 8 unpredicted)'."
      finding: >-
        19 rows, 3 unpredicted — but the census's biggest lesson is a MISS, not a hit: **Devastate has
        no spell_script_names row at all**, because the core implements it inside
        Spell::EffectWeaponDamage keyed on a family flag. A census-only search concludes "Devastate is
        unscripted" and ships a clone that applies no Sunder Armor.
    - spec_says: "§2 'DUMMY markers: next free misc is 19; allocate only if a core-side or script-side discriminator is actually needed (none is currently foreseen)'."
      finding: >-
        Still true — no NEW marker is needed. But node 20337 (Improved Berserker Rage) REUSES the
        existing **misc 15** marker: the module script is gated on band-range + misc 15, not on era, so
