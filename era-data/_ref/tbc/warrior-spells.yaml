      - { node: 20348, name: Toughness, live_only_slot: "e2 aura 232 MECHANIC_DURATION_MOD -6/-12/-18/-24/-30 misc 11 (MECHANIC_SNARE)" }
      - { node: 20351, name: Improved Revenge, live_only_slot: "e2 aura 108 +30/+60 and e3 aura 108 -50 misc 20 (WotLK's Revenge damage/cost talent)" }
      - { node: 20354, name: Improved Disarm, live_only_slot: "e2 aura 107 misc 12 SPELLMOD_EFFECT2 +5/+10" }
      - { node: 20358, name: Improved Shield Bash, live_only_slot: "e2 aura 108 misc 12 SPELLMOD_EFFECT2 +5/+10 (the Gag Order damage half)" }
      - { node: 20359, name: Shield Mastery, live_only_slot: "e2 aura 107 misc 11 SPELLMOD_COOLDOWN -10000/-20000" }
      - { node: 20361, name: Improved Defensive Stance, live_only_slot: "e2 aura 42 PROC_TRIGGER_SPELL -> 57514/57516 (WotLK's Enrage proc)" }
      - { node: 20364, name: Vitality, live_only_slot: "e3 aura 240 MOD_EXPERTISE +2/+4/+6" }
    evidence: >-
