      three_authoring_constraints:
        - "The clone MUST carry `family: 4` AND `maskB: 0x40` (SpellFamilyFlags[1] = DBC
           SpellClassMask_2), or the branch never fires and the clone applies NO Sunder Armor at all."
        - "The per-Sunder bonus MUST live in `CalculateSpellDamage(2, ...)` = **EFFECT_2 (0-based core
           enum; = this map's e3)**. TBC stores it in e2. Copying the TBC slot layout literally puts the
           value where the core never reads it. Author: e1 or e2 = WEAPON_PERCENT_DAMAGE 50, e3 =
           NORMALIZED_WEAPON_DMG 15/25/35."
        - "Whether to also carry TBC's word-0 0x4000 (Sunder Armor's identity bit) is an AUTHORING
           DECISION with a consequence: it makes every Sunder-Armor-targeting spellmod also hit
           Devastate. TBC's own Improved Sunder Armor mask lists BOTH bits explicitly
           (0x4000, 0x40), so the tooltip's 'Sunder Armor and Devastate' is satisfied by binding both
           bits WITHOUT giving the Devastate clone Sunder's own bit. RECOMMENDATION: give the clone
           word 1 bit 6 only, and bind node 20353 to (0x4000 | the clone's bit)."
      sunder_side_effect: >-
        The core branch casts 58567 (the WotLK Sunder Armor debuff, LIVE_ONLY — TBC's Sunder Armor 7386
        applies `aura 22 MOD_RESISTANCE -90 misc1` directly instead of triggering anything). A TBC
        Devastate clone therefore stacks WotLK's Sunder, not TBC's. Recorded as accepted_gaps.sunder_armor
        because Sunder Armor is a BASELINE ability shared with WotLK characters and cannot be era-forked.
    trainer_sql:
      orphaned_higher_rank_check: >-
        RUN AND CLEAN — because the recommendation is to add NO DELETE. Stock 47497.ReqAbility1 = 30022
        and 47498.ReqAbility1 = 47497, so deleting stock 30016/30022 would lock native WotLK warriors
        out of Devastate r4/r5 — exactly the druid Mangle regression (framework doc, workflow lesson 4).
      resolution: >-
        Framework option 3 (the preferred one): the stock chain is ALREADY SELF-GATING. Stock 30016's
        `ReqAbility1` is stock 20243, which a TBC warrior never has (the node grants the clone), so a
        TBC warrior can never buy stock 30016/30022 no matter what. **Add no DELETE.** `_03` is pure
        INSERT: clone r2 @60 (ReqAbility1 = clone r1) and r3 @70 (ReqAbility1 = clone r2) on
        TrainerId 1, plus the clone spell_ranks chain.

  shield_slam:
    node: 20362 (Protection tier 7)
    verdict: DIVERGED on every TBC-reachable rank — clone chain required.
    tbc_chain_values: "e2 SCHOOL_DAMAGE effective 224 / 263 / 302 / 341 / 380 / 419 for r1-r6 (23922, 23923, 23924, 23925, 25258, 30356)."
    live_values: "293 / 345 / 395 / 446 / 498 / 548. Also Category 971 (TBC) vs 1209 (live) on r1."
    trainer_levels: "stock rows on TrainerId 1: 23923@48 (req 23922), 23924@54, 23925@60, 25258@66, 30356@70, then 47487@75 and 47488@80 (beyond the TBC cap)."
    orphaned_higher_rank_check: >-
      The existing Vanilla `kBaselineSpellGates` row (EraTalents.cpp:404) already handles the stock
      chain with `grantHigherEra=true` + the trainer edit in
      2026_08_18_21_era_talent_baseline_gate_trainers.sql. Adding a TBC arm to the SAME row (strip for
      TBC, keyed on node 20362) introduces no new DELETE, so the check has nothing new to flag. The
      TBC clone chain's own trainer rows are pure INSERTs gated on the clone r1.
    note: >-
      r7/r8 (47487/47488) are 75/80 and unreachable at the TBC cap; they stay in the strip list
      (harmless and future-proof, matching the existing comment).

  bloodthirst:
    node: 20340 (Fury tier 7)
    verdict: DIVERGED — clone chain required. This ANSWERS the plan's Task-5 Step-2 triage question.
    tbc_chain:
      23881: { rank: 1, level: 40, ap_pct: 45, heal_buff: 23885, heal: 23880, heal_amount: 10 }
      23892: { rank: 2, level: 48, ap_pct: 45, heal_buff: 23886, heal: 23889, heal_amount: 13 }
      23893: { rank: 3, level: 54, ap_pct: 45, heal_buff: 23887, heal: 23890, heal_amount: 17 }
      23894: { rank: 4, level: 60, ap_pct: 45, heal_buff: 23888, heal: 23891, heal_amount: 20 }
      25251: { rank: 5, level: 66, ap_pct: 45, heal_buff: 25252, heal: 25253, heal_amount: 25 }
      30335: { rank: 6, level: 70, ap_pct: 45, heal_buff: 30339, heal: 30340, heal_amount: 30 }
    per_family_answer:
