      vanilla_helper: 932801 exists but is stun-ONLY — NOT reusable, see reuse_ledger.
    - id: 20329
      name: Blood Craze
      helper: fresh per-rank regen payload (TBC 16488/16490/16491 shape)
      why: >-
        Talent rows 16487/16489/16492 diverge on ProcTypeMask (TBC **0x222a8** = 139944; live
        **0xa22a8** = 664232 — WotLK added PROC_FLAG_TAKEN_PERIODIC bit 19; this line previously
        mistyped both as `0x22268`/`0xa2268`, corrected at Task 7 against the survival_map's own
        `detail` line "ProcTypeMask TBC139944->LIVE664232", which is the raw sweep output and wins).
        The payloads diverge on tick cadence: TBC
        16488/16490/16491 `period 6000/3000/2000 ms`, live `3000/1500/1000 ms` — same 1/2/3% total,
        half the TBC tick interval, i.e. live regenerates over half the time.
    - id: 20333
      name: Enrage
      helper: fresh per-rank melee-damage buff (TBC 12880/14201-14204 shape)
      why: >-
        Talent rows 12317/13045-13048 diverge on ProcChance (TBC 100, live 30). Buffs diverge on
        magnitude: TBC +5/10/15/20/25% (aura 79 misc 1), live +2/4/6/8/10%. TBC buff also carries
        `procCharges 12`, `dur 29 (12 000 ms)`, `category 21`.
      vanilla_helper: 932815-819 carry the IDENTICAL magnitudes but not the identical proc row — see reuse_ledger.
    - id: 20347
      name: Shield Specialization
      helper: fresh 1-rage ENERGIZE payload
      why: >-
        The talent rows 12298/12724/12725/12726/12727 are LIVE_MATCH (block% 1/2/3/4/5, proc chance
        20/40/60/80/100, procFlags 680) — but each one's e2 hardcodes `trigger 23602`, and 23602
        DIVERGES: TBC `ENERGIZE val10 misc1` = **1 rage**, live `val50` = **5 rage**. wowsims/tbc
        `applyShieldSpecialization` confirms `warrior.AddRage(sim, 1, ...)` at 20%/rank. Because the
        trigger id is baked into the stock talent's effect and stock 23602 may not be modified, the
        node CANNOT grant stock: it must author per-rank passives that trigger a fresh 1-rage helper.
        This is the tree's clearest clean-row / diverged-chain case (workflow lesson 2).
      shape_correction_2026_09_03: >-
        The last sentence above ("author per-rank passives that trigger a fresh 1-rage helper")
        accounts only for the RAGE half and, taken literally, would have SHIPPED THE TALENT WITHOUT
        ITS BLOCK PERCENTAGE. A generated node row cannot carry both halves: a `proc` node's carrier
        passive is aura-42-only and a `multi` node is stat/spellmod-only. The DECISION (author both
        halves; the node cannot grant stock) is unchanged; the SHAPE is the shipped,
        real-client-verified VANILLA 932823-827 build — a HELPER CLONE PER RANK carrying
        `e1 aura 51 MOD_BLOCK_PERCENT` + `e2 aura 42 PROC_TRIGGER_SPELL` + its own `spell_proc` row,
        granted per rank by the node. Task 8 ships that as 947561-947565 (templated off the
        TBC-identical stock rows, so ProcChance/ProcTypeMask/attrs/icon are inherited) plus the fresh
        1-rage payload 947566. The proc row's **HitMask 64 (PROC_HIT_BLOCK)** is authored, not
        inherited: the live `spell_proc` row for -12298 carries HitMask **112** (dodge|parry|block),
        WotLK's widened rule, where every TBC rank tooltip says "when a block occurs".
        Recorded rather than silently widened (workflow lesson 15).
    - id: 20358
      name: Improved Shield Bash
      helper: fresh silence payload (TBC 18498 shape)
      why: >-
