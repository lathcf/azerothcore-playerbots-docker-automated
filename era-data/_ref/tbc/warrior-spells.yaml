# =================================================================================================
reuse_ledger:
  policy: >-
    Default disposition is FRESH (spec §4c). A reuse claim must survive ALL FOURTEEN field families
    including power cost and attributes. Reuse is all-or-nothing per helper; MODIFYING a shipped
    932xxx spell is forbidden (it would move already-shipped Vanilla trees). Where the two sides
    disagree, BOTH raw values are printed (workflow lesson 16).
  outcome: >-
    **ALL FRESH — zero of the thirteen Vanilla warrior helper families is reusable.** Same result the
    TBC shaman ledger reached, and for the same reason: the families that decide it are the ones an
    effects-only comparison never reaches (tick period, proc row, spell-level Mechanic, cooldown).
    Two families are moot before they are even compared, because the TBC node grants stock instead.
  entries:

    - helper: 932800
      family: Deep Wounds bleed carrier
      tbc_counterpart: 12721
      verdict: FRESH
      evidence: >-
        EQUAL: aura 3 PERIODIC_DAMAGE; DurationIndex 29 (12 000 ms); Attributes 0x10; EquippedItemClass
        -1; Mechanic 15 on both (932800 EffectMechanic_1 = 15, TBC 12721 spell-level Mechanic = 15).
        DIFFERENT: **EffectAuraPeriod — 932800 = 1000 ms (12 ticks, inherited from the WotLK carrier
        the Vanilla clone templated off), TBC 12721 = 3000 ms (4 ticks).** era_deep_wounds divides the
        total by `GetMaxTicks()`, so reusing 932800 would deliver the right TOTAL over the wrong
        cadence, and would also make the TBC bleed share an id (and therefore a cross-era strip
        identity) with the Vanilla one.
      also: >-
        The TBC helper additionally needs `family: 4` + `maskB: 0x10` so Blood Frenzy can bind it —
        the OPPOSITE of the Vanilla helper's deliberate family-less choice.

    - helper: 932801
      family: Mace Specialization stun payload
      tbc_counterpart: 5530
      verdict: FRESH
      evidence: >-
        EQUAL: aura 12 MOD_STUN; DurationIndex 27 (3000 ms); spell-level Mechanic 12.
        DIFFERENT: **TBC 5530 has a SECOND effect — `SPELL_EFFECT_ENERGIZE val70 misc1` = 7 rage** —
        which 932801 does not have at all (Vanilla's Mace Spec was stun-only, per the era-less ref's
        own note that the Vanilla stun "must be AUTHORED as a custom proc"). The Wowhead TBC tooltip
        for 12284 confirms: "chance to stun your target for 3 sec and generate 7 rage".
        Also AttributesEx: 932801 = 0x0, TBC 5530 = 0x40088.

    - helper: 932802
      family: Improved Hamstring root
      tbc_counterpart: 23694
      verdict: MOOT — no clone needed
      evidence: >-
        TBC node 20316's talent rows (12289/12668/23695) are LIVE_MATCH and the root payload 23694
        diverges only on AttributesEx2 bit 2 (IGNORE_LINE_OF_SIGHT). The TBC node triggers STOCK
        23694, so no helper of any provenance is required. (For the record, 932802 and TBC 23694 also
        differ: 932802 Attributes 0x8000000 / AttributesEx 0x88 vs TBC 0x0 / 0x0.)

    - helper: 932803-932807
      family: Tactical Mastery rage retention (5 ranks)
      tbc_counterpart: 12295 / 12676 / 12677 (3 ranks)
      verdict: MOOT — no clone needed
      evidence: >-
        TBC Tactical Mastery is 3 ranks and all three are LIVE_MATCH, so node 20345 grants stock.
        Recorded because a reuse attempt would ALSO have been wrong on shape: the Vanilla clones carry
        a single `aura 4` effect, while TBC 12295 carries THREE effects (aura 4 rage retention 5/10/15
        plus two `aura 108 ADD_PCT_MODIFIER misc 2 SPELLMOD_THREAT` at 21/42/63 — the Defensive-Stance
        Bloodthirst/Mortal-Strike threat half of the tooltip, which Vanilla's talent did not have).

    - helper: 932808
      family: Death Wish
      tbc_counterpart: 12292
      verdict: FRESH
      evidence: >-
        EQUAL: e1 aura 79 MOD_DAMAGE_PERCENT_DONE +20 misc 1; DurationIndex 9 (30 s); RecoveryTime
        180 000 ms (3 min); ManaCost 100 (10 rage).
        DIFFERENT: 932808's e2 is `aura 77 MECHANIC_IMMUNITY` with **misc 0**, and it has **no e3**.
        TBC 12292 is `aura 77 val100 **misc 5**` plus `e3 aura 87 MOD_DAMAGE_PERCENT_TAKEN +5
        misc 127`. The +5% damage taken is the TBC drawback and is absent from the Vanilla clone
        (Vanilla Death Wish had no damage-taken penalty).

    - helper: 932810-932814
      family: Flurry haste buffs
      tbc_counterpart: 12966-12970
      verdict: MOOT — no clone needed, AND reuse would have been WRONG
      evidence: >-
        TBC 12966-12970 are LIVE_MATCH on all fourteen families (aura 138 MOD_MELEE_HASTE
        **+5/10/15/20/25%**, DurationIndex 8 = 15 s, ProcChance 100, ProcCharges 3, ProcTypeMask 4),
        so node 20338 triggers the stock buffs. The Vanilla clones are **+10/15/20/25/30%** — Vanilla's
        1.12.1 numbers. Reusing them would have overpaid every rank by 5 percentage points. This is
        the ledger's clearest illustration of why the default must be FRESH-or-stock, never "the
        previous era already built one with this name".

    - helper: 932815-932819
      family: Enrage melee-damage buffs
      tbc_counterpart: 12880 / 14201 / 14202 / 14203 / 14204
      verdict: FRESH (closest call in the ledger)
      evidence: >-
        EQUAL: aura 79 MOD_DAMAGE_PERCENT_DONE misc 1, effective **5 / 10 / 15 / 20 / 25** on both
        sides; DurationIndex 29 (12 000 ms); ProcCharges 12; Category 21; Attributes 0x1000000.
        DIFFERENT: the DBC proc row — 932815-819 carry `ProcChance 101 / ProcTypeMask 0`, TBC
        12880/14201-4 carry `ProcChance 100 / ProcTypeMask 20`. Under the all-or-nothing rule that is
        a fail. It is also not purely cosmetic: the Vanilla clones' zeroed DBC proc fields work only
        because a generated `spell_proc` row supersedes them, so reuse would silently couple the TBC
        node's charge-consumption behaviour to the Vanilla node's proc row.
      practical_note: >-
        Because the MAGNITUDES are identical, Task 7 can copy the Vanilla YAML block verbatim and only
        change the ids and the two proc fields. "Identical numbers" is not "reusable id".

    - helper: 932821
      family: Improved Revenge stun payload
      tbc_counterpart: 12798
      verdict: MOOT — no clone needed
      evidence: >-
        Live 12798 "Revenge Stun" is present and diverges from TBC only on an UNUSED base-point
        (TBC effective 100 vs live 0 — irrelevant for `aura 12 MOD_STUN`) and AttributesEx2 bit 2.
        Node 20351 authors its own 15/30/45% proc and triggers STOCK 12798.
        (932821 also differs from TBC 12798 on Attributes 0x0 vs 0x4000000 and AttributesEx 0x0 vs 0x88.)

    - helper: 932822
      family: Concussion Blow
      tbc_counterpart: 12809
      verdict: FRESH (second-closest call)
      evidence: >-
        EQUAL: aura 12 MOD_STUN; DurationIndex 28 (5 000 ms); ManaCost 150 (15 rage);
        **RecoveryTime 45 000 ms** (the Vanilla clone already carries TBC's cooldown, because Vanilla's
        was 45 s too); PreventionType 2; EquippedItemClass 2 / subclass 173555; Attributes 0x50010;
        AttributesEx 0x8000200.
        DIFFERENT: where MECHANIC_STUN is recorded — 932822 has `Mechanic 0 / EffectMechanic_1 12`,
        TBC 12809 has `Mechanic 12 / EffectMechanic 0`. Both make the ability a stun for immunity and
        diminishing-returns purposes, so the practical delta is small; under the all-or-nothing rule it
        is still FRESH, and the `mechanic:` helper key (gen_era_talents.py:1250) lets the TBC clone
        record it TBC's way.

    - helper: 932823-932827
      family: Shield Specialization (block% + rage-on-block)
      tbc_counterpart: 12298 / 12724 / 12725 / 12726 / 12727
      verdict: FRESH
      evidence: >-
        EQUAL: `aura 51 MOD_BLOCK_PERCENT` effective 1/2/3/4/5; `aura 42 PROC_TRIGGER_SPELL` in e2;
        ProcChance 20/40/60/80/100; ProcTypeMask 680; the rage payload VALUE (Vanilla routes to 12964
        `ENERGIZE val10 misc1` = 1 rage; TBC routes to 23602 `ENERGIZE val10 misc1` = 1 rage — the same
        number through a different id).
        DIFFERENT: the TRIGGER ID (932823-827 -> 12964, TBC -> 23602), and DurationIndex (Vanilla
        clones 0, TBC 21 = permanent). Reuse would work behaviourally by accident; it fails the rule,
        and it would make a TBC prot warrior's Shield Specialization share ids with a Vanilla one.
      note: >-
        The FRESH TBC helper only needs to be the 1-rage energize; the per-rank passive that triggers
        it is a generated node row, not a helper.

    - helper: 932828-932831
      family: Bloodthirst damage clones (4 ranks)
      tbc_counterpart: 23881 / 23892 / 23893 / 23894 (+ 25251 / 30335, which have no Vanilla analog)
      verdict: FRESH
      evidence: >-
        EQUAL on the headline numbers: e1 SCHOOL_DAMAGE effective 45; ManaCost 300 (30 rage);
        CategoryRecoveryTime 6000 ms; Attributes 0x50010; AttributesEx 0x8000200; PreventionType 2;
        EquippedItemClass 2 / subclass 173555.
        DIFFERENT: **Category — 932828-831 carry Category 0 (deliberately neutralised), TBC carries
        Category 971.** And structurally, TBC has SIX ranks where the Vanilla family has four; reuse
        is all-or-nothing per helper, so a 4-of-6 reuse is not on the table.
      note: "EquippedItemClass is the one place the VANILLA clone and TBC disagree in the other direction: TBC 23881 has no SpellEquippedItems row at all (no weapon requirement), while the Vanilla clone inherited class 2/173555 from the stock template. The TBC clones should author `equipClass: -1`."

    - helper: 932832-932835
      family: Bloodthirst heal BUFFS (the 5-charge, 8 s carrier)
      tbc_counterpart: 23885 / 23886 / 23887 / 23888 (+ 25252 / 30339)
      verdict: FRESH
      evidence: >-
        EQUAL: `aura 42 PROC_TRIGGER_SPELL`; DurationIndex 31 (8 000 ms); ProcChance 100;
        ProcCharges 5; ProcTypeMask 20.
        DIFFERENT: the trigger targets (932836-839 vs 23880/23889/23890/23891/25253/30340) and, again,
        four ranks vs six.

    - helper: 932836-932839
      family: Bloodthirst FLAT heal payloads
      tbc_counterpart: 23880 / 23889 / 23890 / 23891 (+ 25253 / 30340)
      verdict: FRESH
      evidence: >-
        EQUAL: `SPELL_EFFECT_HEAL`, effective **10 / 13 / 17 / 20** for ranks 1-4 — the Vanilla and TBC
        numbers are IDENTICAL for the four ranks both eras have.
        DIFFERENT: TBC adds ranks 5 and 6 at **25** and **30** (25253 and 30340), which the Vanilla
        family has no ids for. All-or-nothing per helper ⇒ FRESH for the whole chain.
      note: This is the single entry where a partial reuse would have been numerically safe; it is
        rejected on the rule, not on the numbers, and the numbers are printed so Task 7 can copy them.

    - helper: 932840
      family: Last Stand
      tbc_counterpart: 12975
      verdict: FRESH
      evidence: >-
        EQUAL: e1 SPELL_EFFECT_DUMMY effective 30 (932840 stores raw 29 / DieSides 1); PreventionType 2.
        DIFFERENT: **RecoveryTime — 932840 = 600 000 ms (10 min, Vanilla's cooldown); TBC = 480 000 ms
        (8 min).** A single field, and it is the whole point of the clone.

