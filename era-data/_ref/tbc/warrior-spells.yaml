    title: The Death Wish clone keeps live 12292's `DispelType 9` (DISPEL_ENRAGE)
    detail: >-
      BOTH RAW VALUES — wago 2.5.4 12292: DispelType 0, Mechanic 0. Live 12292: DispelType 9
