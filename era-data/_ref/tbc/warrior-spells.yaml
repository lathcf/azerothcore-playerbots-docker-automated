  concussion_blow_start_recovery_time:
    status: >-
      **DECIDED at Task 8: INHERIT the template's 1500 ms; do NOT reproduce TBC's stored 0.**
    both_raw_values: >-
      wago 2.5.4 SpellCooldowns for 12809: StartRecoveryTime **0**, StartRecoveryCategory 133. Live
      12809: StartRecoveryTime **1500**, StartRecoveryCategory 133. The sweep prints this as a
      divergence (survival_map[12809].detail).
    decision_and_why: >-
      The generator has no `startRecoveryTime` key, so a templated clone inherits 1500 either way —
      but the choice is deliberate rather than accidental: both sides carry StartRecoveryCategory
      133 (the standard 1.5 s GCD category), so TBC's stored 0 is the DB2 convention of leaving the
      category to supply the number, not a claim that Concussion Blow had no global cooldown.
      Reproducing the literal 0 would have shipped a GCD-free stun, i.e. an ability stronger than
      either era's. Same class of judgement as the Rampage `CasterAuraState 11` and Mangle DUMMY
      calls: a TBC encoding that means something different on this core is not copied literally.
    what_would_close_it: >-
      one `("startRecoveryTime", "StartRecoveryTime")` line in `_HELPER_SCALARS` if a future clone
      ever needs a genuinely different GCD; byte-neutral for shipped data, like every other key
      there. Not needed for this one.

  shield_slam_category:
    status: >-
      **DECIDED at Task 8: KEEP live's Category 1209 on the era clones — a deliberate departure from
      TBC's own data and from the category-neutralize precedent.**
    both_raw_values: "wago 2.5.4 23922-30356 Category **971**; live 23922-30356 Category **1209** (CategoryRecoveryTime 6000 on both)."
    why: >-
      THE CORE READS THE CATEGORY BY VALUE. `Spell::EffectSchoolDMG` (SpellEffects.cpp:351) adds the
      shield block value only when `m_spellInfo->SpellFamilyFlags[1] & 0x200 &&
      m_spellInfo->GetCategory() == 1209`. Copying TBC's 971 — or applying the Bloodthirst / Aimed
      Shot `category: 0 + categoryCooldown: 0 + cooldown:` neutralize idiom — would silently drop
      "modified by your shield block value", the headline half of the ability AND of its tooltip.
      The 6-second cooldown is identical on both sides and rides CategoryRecoveryTime either way, so
      keeping the category also gives the six-rank ladder the SHARED cooldown a rank chain wants.
      Category 1209 is not 132, so the family-4 shared-cooldown sweep
      (era_audit.check_sweep_collisions) is unaffected.
    generalisation: >-
      The category-neutralize idiom is for clones whose era cooldown must ESCAPE an inherited
      category. Check first whether any core code keys on the category NUMBER; here it does, and the
      idiom would have been a silent functional regression rather than a fidelity improvement.

