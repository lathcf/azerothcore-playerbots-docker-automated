capstone_chains:

  rampage:
    node: 20343 (Fury tier 9)
    verdict: RECONSTRUCTION — the spec's hypothesis is CONFIRMED and is stronger than stated.
    tbc_chain:
      29801: { rank: 1, level: 50, ap_per_stack: 30, buff: 30029 }
      30030: { rank: 2, level: 60, ap_per_stack: 40, buff: 30031, trainer: true }
      30033: { rank: 3, level: 70, ap_per_stack: 50, buff: 30032, trainer: true }
    trainer_levels_source: >-
      Wowhead TBC tooltips cached this task at era-data/_ref/tbc/tooltips/{30030,30033}.json —
      "Requires level 60" and "Requires level 70"; corroborated by wago SpellLevels
      (30030 BaseLevel/SpellLevel 60, 30033 70, 29801 50).
    tbc_mechanic:
      activated: "20 rage (powerCost 200), instant, GCD category 133, 30 s duration (DurationIndex 9)."
      gate: >-
        `CasterAuraState 11` on all three ranks — the TBC 'scored a critical hit recently' state.
        Wowhead TBC: "This ability can only be used after scoring a critical hit."
        wowsims/tbc sim/warrior/rampage.go sets `rampageValidUntil = sim.CurrentTime + 5s` on any
        crit and requires `sim.CurrentTime < rampageValidUntil` to cast — **the window is 5 seconds**.
      on_cast: "e2 SPELL_EFFECT_TRIGGER_SPELL -> the rank's buff (the first stack). wowsims: RampageAura.Activate + AddStack."
      stacking: >-
        e1 `aura 42 PROC_TRIGGER_SPELL`, ProcChance 100, ProcTypeMask 20
        (PROC_FLAG_DONE_MELEE_AUTO_ATTACK 0x4 | PROC_FLAG_DONE_SPELL_MELEE_DMG_CLASS 0x10), trigger
        18350. The trigger target is a bare SPELL_EFFECT_DUMMY 'Dummy Trigger', i.e. in real TBC the
        SERVER handled the stack increment off that dummy; the data does not encode it.
      buff: "aura 99 MOD_ATTACK_POWER, +30/+40/+50 per stack, `CumulativeAura 5`, 30 s, refreshed on each stack."
    live_3_3_5a: >-
      29801 is a PASSIVE (SPELL_ATTR0_PASSIVE set live, clear in TBC) with a single effect
      `eff 65 / aura 52 MOD_WEAPON_CRIT_PERCENT +5, radius index 12` — WotLK's Rampage grants the
      party/raid a flat crit bonus. No cost, no duration, no proc, no CasterAuraState, no buff chain.
      30029-30033 do not exist in the live store at all (WAGO_ONLY).
      **The WotLK spell is unusable as a carrier in every respect**, which is what the spec predicted.
    recommended_implementation:
      route: "Escalation-ladder rung 1 (pure data) + ONE small generator key. NO module script, NO core patch."
      pieces:
        - "Three activated clones (fresh 947512+ ids): powerCost 200, category/GCD 133, DurationIndex 9,
           e1 `aura 42 PROC_TRIGGER_SPELL -> <own rank's buff>` with helper scalars
           `procChance: 100` + `procTypeMask: 20` (both keys already exist, gen_era_talents.py:1291/1299)
           so no spell_proc row is needed, e2 `SPELL_EFFECT_TRIGGER_SPELL -> <own rank's buff>`."
        - "Three buff helpers: `aura 99 MOD_ATTACK_POWER` +30/+40/+50, `stackAmount: 5` (key exists,
           -> CumulativeAura), DurationIndex 9, hidden-ish aura with an authored client.auraDescription."
        - "One hidden 'Rampage Ready' aura helper (5 s, no visible effect) plus a per-rank generated
           proc passive (`mechanic: proc`, melee flags, HitMask 2 = crit-only, Chance 100) that
           triggers it — this reproduces wowsims' 5-second crit window in data."
        - "`casterAuraSpell: <ready aura id>` on each Rampage clone."
      why_a_stack_re_application_works: >-
        Re-casting a `CumulativeAura N` aura on a unit that already has it increments the stack and
        refreshes the duration (Unit::_ApplyAura / Aura::ModStackAmount), so `aura 42 PROC_TRIGGER_SPELL`
        pointing at the buff produces exactly TBC's 'each melee hit adds a stack, up to 5'. TBC's own
        indirection through 18350 must NOT be copied literally — 18350 is a bare DUMMY on this core and
        casting it does nothing (the Mangle-DUMMY lesson, workflow lesson 3).
      generator_gap:
        finding: >-
          `tools/gen_era_talents.py` has NO `casterAuraSpell` key — `grep -c CasterAuraState
          gen_era_talents.py` and the same for CasterAuraSpell both return 0. The live column exists
          (tools/spell_dbc_columns.txt index 24) and the core ENFORCES it: `Spell::CheckCast`
          (Spell.cpp:5779) fails the cast with SPELL_FAILED_CASTER_AURASTATE when
          `m_spellInfo->CasterAuraSpell && !m_caster->HasAura(...)`.
        ask: >-
          Add `("casterAuraSpell", "CasterAuraSpell")` to `_HELPER_SCALARS` — one line, byte-neutral
          for every shipped helper (unlisted keys default to 0 / the template's value), same shape as
          the `procChance`/`procTypeMask`/`stackAmount` keys already there.
        why_not_casterAuraState: >-
          Copying TBC's `CasterAuraState 11` literally is DEAD on this core. AzerothCore's
          AuraStateType has no 11 (`//AURA_STATE_UNKNOWN11 = 11, // C t| 60348 - Maelstrom Ready!,
          test spells`, SharedDefines.h:1291) and NOTHING in src/server/game ever calls
          `ModifyAuraState` with it — verified by grep. A clone carrying CasterAuraState 11 would be
          permanently uncastable.
      fallback_if_the_generator_key_is_refused: >-
        Rung 2 — a module SpellScript in EraTalentProcScripts.cpp with `OnCheckCast` returning
        SPELL_FAILED_CASTER_AURASTATE unless the caster holds the band-ranged ready aura, registered
        like era_bloodthirst_vanilla and gated on `!Enabled()` + band ownership (never on "is a bot").
        This is strictly more C++ for the same behaviour, hence the recommendation above.
      known_fidelity_deltas:
        - "TBC cleared the crit window on use (wowsims sets rampageValidUntil = 0 in ApplyEffects); a
           CasterAuraSpell gate leaves the 5 s ready aura running, so a second Rampage inside the same
           window would be castable. Cost: a re-cast can refresh the buff slightly earlier than TBC
           allowed. Closing it needs the ready aura consumed on cast — one `ProcCharges 1` on the ready
           aura would NOT do it (it is not the proc), so it needs the module script. Flagged, not hidden.
           (CLOSED 2026-09-07 by the module script.)"
    trainer_sql: >-
      NO stock Rampage trainer rows and NO stock spell_ranks rows exist (verified: `SELECT ... FROM
      trainer_spell WHERE SpellId IN (29801,30030,30031,30032,30033)` returns 0 rows; same for
      spell_ranks). So `_02` is pure INSERT — no DELETE, hence no orphaned-higher-rank exposure at
      all. Insert clone r2 @ ReqLevel 60 (ReqAbility1 = clone r1) and r3 @ 70 (ReqAbility1 = clone r2)
      on TrainerId 1, plus a spell_ranks chain rooted at clone r1 so respec cascade-strips.

  devastate:
    node: 20365 (Protection tier 9)
    verdict: DIVERGED — clone required. The spec's "expected diverged" is confirmed, and the reason is
      bigger than "damage retuned".
    tbc_chain:
