      power: "DIVERGED — powerCost 300 (30 rage) vs 200 (20 rage)."
      cooldowns: >-
        DIVERGED — CategoryRecoveryTime 6000 ms (TBC) vs 4000 ms (live), on ALL SIX ranks. **This
        family alone moved ranks 2-6 from LIVE_MATCH to DIVERGED**; an effects-only sweep would have
        concluded 'ranks 2-6 are identical, grant stock' and shipped a 4-second Bloodthirst.
      equipped_item: "DIVERGED — TBC has NO SpellEquippedItems row (no weapon requirement); live requires class 2 / subclass 0x2a5f3."
      attributes / class_options / categories / aura_restrictions / shapeshift / interrupts / targets: "equal on every rank."
