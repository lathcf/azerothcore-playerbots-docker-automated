accepted_gaps:
  note: >-
    Proposed, not yet accepted — the plan's Task-3 exit gate escalates these to the orchestrator.
    Each carries the evidence that would close it (workflow lesson 13: never "not knowable").
  gaps:
  - id: 1
    title: Defensive / Berserker Stance passives carry WotLK values for every character
    detail: >-
      7376 Defensive Stance Passive: TBC -10% damage done / +30% threat; live -5% / +45%.
      7381 Berserker Stance Passive: TBC +10% damage taken; live +5%.
      Both are cast by CORE CODE with hardcoded ids (HandleAuraModShapeshift, SpellAuraEffects.cpp:
      1377-1384). Eras are per-character and spells are global, so the era-safety rule forbids editing
      them, and no talent-side data mechanism reaches them.
    impact: A TBC-era warrior deals 5 pp more damage and holds 15 pp less relative threat in Defensive
      Stance, and takes 5 pp less extra damage in Berserker Stance, than TBC did.
    what_would_close_it: >-
      A module-side compensating aura applied to era-managed characters on stance change (a
      `PlayerScript`/`UnitScript` hook on shapeshift, granting band-gated correction auras: -5%
      damage done / -15% threat in Defensive, +5% damage taken in Berserker), gated on
      `EraTalentBots::EraFor(p) == ERA_TBC` so Vanilla and WotLK characters are untouched. That is new
      module behaviour outside the talent pipeline and is a design decision for the user, not an
      authoring choice — hence escalated rather than silently absorbed.
  - id: 2
    title: Battle Stance grants +10% armour penetration that TBC did not have
    detail: >-
      Live 2457 carries a second effect `aura 280 MOD_ARMOR_PENETRATION_PCT 10` absent from wago 2.5.4.
      Same class of problem as gap 1 and the same reason it cannot be fixed from the talent side.
    what_would_close_it: the same module-side stance hook.
  - id: 3
    title: Sunder Armor is WotLK's for both eras, so TBC Devastate stacks the WotLK debuff
    detail: >-
      TBC Sunder Armor 7386 applies `aura 22 MOD_RESISTANCE -90 misc1` directly over 30 s; live 7386 is
      `SPELL_EFFECT_TRIGGER_SPELL -> 58567` (LIVE_ONLY). Sunder Armor is a BASELINE ability every
      warrior of every era trains, so it cannot be era-forked, and the core's Devastate branch casts
      58567 unconditionally.
    impact: cosmetic-to-small — the Devastate clone's "causes the Sunder Armor effect" resolves to the
      WotLK Sunder, and the era Improved Sunder Armor spellmod modifies the WotLK one.
    what_would_close_it: an era Sunder Armor clone chain (a large piece of work with its own baseline
      gate), or acceptance. Recommend acceptance.
  - id: 4
    status: CLOSED 2026-09-07 — era_rampage_consume_ready (AfterCast RemoveAurasDueToSpell 947540) bound to 947533-947535.
    title: Rampage's crit window is not consumed on use
    detail: see capstone_chains.rampage.known_fidelity_deltas.
    what_would_close_it: a module SpellScript that removes the ready aura in AfterCast (a few lines in
      EraTalentProcScripts.cpp, same shape as era_improved_berserker_rage's AfterCast).
  # ---- opened at Task 6 (Arms authoring), 2026-09-02 ----
  - id: 5
    status: >-
      **CLOSED at Task 7 (Fury authoring), 2026-09-03.** The generator gained the one-line
      `("dispelType", "DispelType")` entry in `_HELPER_SCALARS` (TDD guard
      `test_helper_dispel_type_column`, verified byte-neutral by regenerating five shipped datasets
      and diffing against their committed SQL — all five byte-identical), and helper 947548 now
      authors `dispelType: 0`. The era Death Wish is no longer removable by an Enrage dispel, which
      is what wago 2.5.4's record says. The same key immediately paid for itself a second time on
