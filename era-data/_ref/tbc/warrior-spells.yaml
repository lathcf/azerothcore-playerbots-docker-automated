# =================================================================================================
open_questions:
  note: Each names the evidence that settles it. None is "not knowable".

  # ---- RESOLVED at Task 6 (Arms authoring), 2026-09-02. Kept here, decided, rather than deleted. ----
  poleaxe_specialization_e2:
    question: >-
      survival_map[12700-12785] is LIVE_MATCH_UNVERIFIED_SLOT — live carries an
      `e2 aura 163 MOD_CRIT_DAMAGE_BONUS +1..5` for which wago 2.5.4 has NO SpellEffect row, so TBC's
      value for that slot is not in DB2. node_buckets said "Author e1 from wago; decide e2 explicitly".
    decision: >-
      **Author e1 ONLY** (a single-effect `mechanic: stat` node, aura 52 MOD_WEAPON_CRIT_PERCENT
      +1..5% gated to `equipSubclass: 67`). The crit-DAMAGE half is a WotLK addition.
    evidence: >-
      The cached Wowhead TBC tooltip for 12700 (era-data/_ref/tbc/tooltips/12700.json) reads
      "Increases your chance to get a critical strike with Axes and Polearms by 1%." and nothing
      else — no crit-damage line — on every rank. A DB2 row's ABSENCE is not evidence of a zero
      (noise_filters_applied), but the rendered TBC tooltip IS evidence of what the talent did, and it
      names one effect. Shipping the live e2 would make the in-client tooltip a lie in the other
      direction (lesson 17d).
    what_would_reopen_it: a 2.4.3 client Spell.dbc dump showing a non-zero Effect_2 on 12700.

  sword_specialization_icd:
    question: >-
      node_buckets[20314] notes "Live also carries a 6 s spell_proc cooldown on -12281 — author the
      TBC chance and decide the cooldown explicitly." Ship an internal cooldown on the era proc row?
    decision: "**No ICD.** The generated spell_proc row for node 20314 carries `Cooldown 0`."
    evidence: >-
      THREE raw values. (1) `acore_world.spell_proc` for -12281: `Cooldown 6000` — the WotLK 3.0.8
      anti-chain nerf, which post-dates TBC. (2) wago 2.5.4 has no cooldown field for a proc of this
      shape at all; the TBC record carries only `ProcChance 1/2/3/4/5` (which IS shipped, and which
      wowsims/tbc corroborates verbatim: `procChance := 0.01 * float64(warrior.Talents.SwordSpecialization)`).
      (3) wowsims/tbc DOES carry `icd := core.Cooldown{Duration: time.Millisecond * 500}` — but that
      is a SIM recursion guard: wowsims issues its extra swing inline from inside the proc handler.
      AzerothCore cannot recurse that way — `Unit::AddExtraAttacks` only QUEUES into
      `extraAttacksTargets` (Unit.cpp:2930) and the queue is drained once per `Unit::Update`
      (Unit.cpp:563-579) via `AttackerStateUpdate(victim, BASE_ATTACK, /*extra=*/true)`, whose `extra`
      flag clears `_lastExtraAttackSpell` and stops the extra swing re-arming the queue. So no ICD is
      needed for safety and none is authored for fidelity. NB the payload stays STOCK 16459 — the core
      hardcodes `SPELL_SWORD_SPECIALIZATION = 16459` in the drain path (Unit.h:298), so a clone would
      lose the melee-range exemption at Unit.cpp:571.
    matches_precedent: the shipped, real-client-verified Vanilla node 18515 also authors no cooldown.

  sweeping_strikes_duration:
    status: >-
      **DECIDED at Task 7 (Fury authoring), 2026-09-03: TBC's data verbatim — DurationIndex 1
      (10 000 ms) + ProcCharges 10**, i.e. the `recommendation:` below, taken. The tiebreaker that
      settled it is one the entry did not have: the CACHED WOWHEAD TBC TOOLTIP for 12328
      (era-data/_ref/tbc/tooltips/12328.json) renders the buff line as "10 second(s remaining)"
      alongside "Your next 10 melee attacks", so the rendered 2.4.3 client agrees with wago on BOTH
      fields and wowsims' `NeverExpires` is alone in disagreeing. The 10 s window on a 30 s cooldown
      remains a visible nerf versus the live spell and is a named real-client checklist item; the
      revert is one `durationIndex:` line on helper 947549.
      SEPARATELY AND NOT PART OF THIS QUESTION: the clone must author `attributes: 327696` because
      `SpellInfoCorrections.cpp:1161` ORs SPELL_ATTR0_NOT_SHAPESHIFTED onto STOCK 12328 by id at
      load ("Sweeping Strikes stance change") and a clone never receives an id-pinned fix. era_audit
      .check_spellfix_inheritance caught it; it is the only spellfix in the Fury id set, and it is
      load-bearing on a Battle|Berserker-gated buff that a Fury warrior stance-dances through.
    question: Should the Sweeping Strikes clone carry TBC's DurationIndex 1 (10 000 ms) or live's 9 (30 000 ms)?
    both_raw_values: >-
      wago 2.5.4 SpellMisc for 12328: DurationIndex 1 -> SpellDuration.Duration 10000.
      Live Spell.dbc 12328: DurationIndex 9 -> 30000. ProcCharges: TBC 10, live 5. The CHARGE count is
      unambiguous (TBC 10, and the Wowhead TBC tooltip says "Your next 10 melee attacks").
    conflict: >-
      wowsims/tbc sim/warrior/sweeping_strikes.go registers the aura with `Duration:
      core.NeverExpires, MaxStacks: 10` — i.e. the sim models TBC Sweeping Strikes as charge-limited
      with NO timer, which agrees with neither DBC value.
    recommendation: >-
      Author TBC's data verbatim (10 charges, DurationIndex 1 = 10 s) per the fidelity bar's precedence
      rule (wago is the number of record; wowsims is the tiebreaker only for what the tables cannot
      express, and here they do express it). Flagged because a 10-second window on a 30-second
      cooldown is a visible nerf versus the live spell and the user may prefer live's 30 s.
    what_would_settle_it: a 2.4.3-era combat log or a private-server DBC dump showing the aura's real
      lifetime; failing that, an explicit user decision.

  one_handed_spec_attr5:
    question: >-
      Should the One-Handed Weapon Specialization passive (node 20360) reproduce TBC's ABSENT
      SPELL_ATTR5_AURA_AFFECTS_NOT_JUST_REQ_EQUIPPED_ITEM bit, or live's SET bit?
    both_raw_values: "wago SpellMisc 16538-16542 Attributes_5 = 0x0; live AttributesEx5 = 0x10000."
    what_the_bit_does: >-
      Unit.cpp:8468 — without it, a MOD_DAMAGE_PERCENT_DONE aura whose own EquippedItemClass != -1 is
      excluded from modifying spells with EquippedItemClass == -1; and Unit.cpp:8481/:10265 — without
      it, the aura applies only when the player holds an item fitting the aura's requirement.
    conflict: >-
      wowsims/tbc applies the talent as a blanket `PseudoStats.PhysicalDamageDealtMultiplier *= 1+0.02*rank`
      whenever the main hand is not two-handed — behaviourally what the bit-SET path produces.
    default_if_unresolved: >-
      Generated auto-passives do not carry AttributesEx5, so authoring the node normally reproduces
      TBC's record for free. That is the recommendation; the note exists so the choice is deliberate.
    what_would_settle_it: an in-client measurement on the dev box (Mortal Strike tooltip damage with 5/5
      One-Handed Weapon Specialization and a 1H equipped, with and without the bit authored).

  devastate_sunder_identity_bit:
    question: Should the Devastate clone carry TBC's own-mask word 0 bit 14 (0x4000, Sunder Armor's bit)?
    trade_off: >-
      Carrying it reproduces TBC's encoding exactly and makes every Sunder-Armor spellmod also hit
      Devastate. Not carrying it (word 1 bit 6 only, which the core branch requires anyway) keeps the
      two spells independent and satisfies the Improved Sunder Armor tooltip by binding both bits on
      node 20353's spellmod instead.
    recommendation: word 1 bit 6 only; bind node 20353 to both. Recorded because TBC's data says
      otherwise and a later reviewer will notice.

  generator_casterAuraSpell_key:
    question: Add `("casterAuraSpell", "CasterAuraSpell")` to `_HELPER_SCALARS`?
    why: It is what makes the Rampage crit gate pure data instead of new C++.
    risk: nil — unlisted keys default to 0 / the template's value, so the addition is byte-neutral for
      every shipped helper, exactly like `procChance`/`procTypeMask`/`stackAmount` were.
    owner: orchestrator decision; the work belongs in Task 1 (generator) or Task 7 (Rampage).

