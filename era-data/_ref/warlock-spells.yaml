  # Added in Task 6 (Demonology authoring). Healthstone = the USE spell of the healthstone item
  # (5720 rank-1, family=5 SpellFamilyFlags 65536) — its Effect_1 SPELL_EFFECT_HEAL is what a
  # SPELLMOD op=allEffects pct scales for Improved Healthstone. "Summon Demon" = the four
  # Summon Imp/Voidwalker/Succubus/Felhunter spells, which ALL share the SINGLE family bit
  # 536870912 (verified: 688/697/712/691 all dump mask=(536870912,0,0)) — one entry binds all
  # four for Master Summoner. Both live-dumped from Spell.dbc via dump_spell_family.py (2026-08-15).
  "Healthstone":         { id: 5720,  flagsA: 65536,    flagsB: 0,       flagsC: 0 }
  "Summon Demon":        { id: 688,   flagsA: 536870912, flagsB: 0,      flagsC: 0 }
  # PET abilities (added 2026-08-16, final warlock pass). All are family=5 with real word-1 masks —
  # dump_spell_family on every rank confirmed identical masks per ability line: Firebolt 3110
  # mask=(4096,0,0); Lash of Pain 7814 mask=(8192,0,0); and ALL FOUR Voidwalker abilities (Torment
  # 3716, Suffering 17735, Consume Shadows 17767, Sacrifice 7812) share the single bit
  # mask=(33554432,0,0), so one entry binds the whole kit for Improved Voidwalker. An owner-side
  # SPELLMOD binds to a pet's cast because the pet's GetSpellModOwner() is the warlock — the exact
  # stock mechanism of WotLK Demonic Power 18126 (castTime spellmod masked 4096 + cooldown spellmod
  # masked 8192, tool-verified).
  Firebolt:              { id: 3110,  flagsA: 4096,     flagsB: 0,       flagsC: 0 }
  "Lash of Pain":        { id: 7814,  flagsA: 8192,     flagsB: 0,       flagsC: 0 }
  "Voidwalker Abilities": { id: 3716, flagsA: 33554432, flagsB: 0,       flagsC: 0 }
  # Identity in WORD 2 (flagsB) for these four — raw masks (0,512,0)/(0,128,0)/(0,1024,0)/(0,8388608,0):
  "Curse of the Elements": { id: 1490,  flagsA: 0,      flagsB: 512,     flagsC: 0 }
  "Soul Fire":           { id: 6353,  flagsA: 0,        flagsB: 128,     flagsC: 0 }
  Fear:                  { id: 5782,  flagsA: 0,        flagsB: 1024,    flagsC: 0 }
