# Stock Warlock spell reference — live-verified from Spell.dbc (SpellClassSet=5) + `lookup spell`
# on the dev-box worldserver console (2026-08-14). DO NOT guess ids/flags; see priest-spells.yaml /
# mage-spells.yaml for the shape this mirrors and the general verification method.
#
# Verification method:
#   - spells: flagsA/flagsB/flagsC = SpellClassMask_1/_2/_3 read straight from Spell.dbc for the
#     rank-1 id (lowest id among the family=5, nonzero-mask entries sharing the spell's
#     Name_Lang_enUS), via tools/dump_spell_family.py. EVERY warlock spell dumped here showed
#     SpellClassSet=5 on its player-cast ranks (family 5 = WARLOCK confirmed). flagsC is ALWAYS 0
#     here: NOT ONE of the 20 base spells carries any word-3 (SpellClassMask_3) bit — the entire
#     warlock identity for these lives in word 1, except Curse of the Elements / Soul Fire / Fear /
#     Conflagrate whose identity is in word 2 (flagsB). So no word-3-drop judgement call arose at
#     all (unlike the Mage/Priest tables where a shared category bit had to be dropped).
#   - grants/triggers/soulLinkStock: reused stock spell ids resolved on the LIVE dev-box worldserver
#     via `tools/wgconsole.py ... "lookup spell <name>"`, taking the rank-1 [talent] entry for
#     actives. Each is pasted with its lookup line in the Task-3 report.
#   - corruptionRanks: the 7 player-cast Corruption ranks, cross-checked against BOTH `lookup spell
#     Corruption` (172/6222/6223/7648/11671/11672 ranks 1-6, 25311 rank 7) AND IP's own list in
#     mod-individual-progression/src/IndividualProgressionPlayer.cpp:550 (identical). The many other
#     family=5 mask(2,0,0) "Corruption, rank 1" ids (13530, 18376, 21068, 28829, ...) are NPC/proc
#     variants, deliberately excluded.
