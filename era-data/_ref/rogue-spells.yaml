#   - Spell.dbc pulled live out of the running container:
#       docker exec ac-worldserver cat /azerothcore/env/dist/data/dbc/Spell.dbc > /tmp/.../Spell.dbc
#   - spells: flagsA/flagsB/flagsC = SpellClassMask_1/_2/_3 (the spell's OWN identity mask — what a
#     SPELLMOD's EffectSpellClassMask must intersect to bind it) read straight from that DBC via
#       python3 tools/dump_spell_family.py <Spell.dbc> tools/spell_dbc_columns.txt --names "..." (comma-separated, exact Name_Lang_enUS)
#     Every rank of every multi-rank line below was dumped; the recorded mask is the SHARED mask
#     across the player-cast ranks, and every NPC/decoy id sharing the same NAME but a different
#     family/mask is called out explicitly (this family has an unusual number of them — Rogue is
#     an old class and many ability names were reused for boss/mob spells and for other classes'
#     unrelated talents of the same name).
#   - Effect-level detail (Effect_N / EffectAura_N / EffectSpellClassMaskA/B_N / EffectMiscValue_N /
#     ProcChance / ProcTypeMask) came from
#       python3 tools/dump_spell_effects.py <Spell.dbc> tools/spell_dbc_columns.txt --ids ... --cols ...
#     Aura numbers and effect numbers were resolved against the fork's OWN
#     azerothcore-wotlk/src/server/shared/SharedDefines.h (SPELL_EFFECT_*) and
#     azerothcore-wotlk/src/server/game/Spells/Auras/SpellAuraDefines.h (SPELL_AURA_*), and the
#     SpellMod op table against azerothcore-wotlk/src/server/game/Spells/SpellDefines.h
