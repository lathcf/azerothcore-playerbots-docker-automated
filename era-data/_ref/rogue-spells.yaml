                         # weapon) and the ON-HIT proc spell that actually lands on the target
                         # (Effect_1 = 6 APPLY_AURA for the 4 DoT poisons, or Effect_1 = 2
                         # SCHOOL_DAMAGE for Instant Poison — it isn't a DoT). BOTH carry the SAME
                         # flagsA identity bit; only the DoT-poison PROC id additionally carries
                         # word-2 bit 524288 (19) — Instant Poison's proc does NOT (verified: both
                         # 8679 and 8680 dump flagsB=0). ids below are the SpellLevel 20-32 base
                         # rank; each poison also has 1-2 further same-mask ids at SpellLevel 50-70
                         # that are NPC-cast copies (Attributes 262144) or a level-gated reissue —
                         # not relevant to a Vanilla-era rogue.
  "Deadly Poison":
    apply: { id: 2823, flagsA: 65536, flagsB: 0, flagsC: 0 }        # Effect_1=54 SPELL_EFFECT_WEAPON
    proc:  { id: 2818, flagsA: 65536, flagsB: 524288, flagsC: 0 }   # Effect_1=6 APPLY_AURA / EffectAura_1=3 PERIODIC_DAMAGE
  "Instant Poison":
