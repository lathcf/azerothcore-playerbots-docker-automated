# Stock Hunter spell reference — live-verified from Spell.dbc (SpellClassSet=9) + `lookup spell`
# on the dev-box worldserver console (2026-08-16). DO NOT guess ids/flags; see warlock-spells.yaml /
# priest-spells.yaml / mage-spells.yaml for the shape this mirrors and the general verification method.
#
# Verification method (Phase 5 Task 3):
#   - Spell.dbc pulled live out of the running container:
#       docker exec ac-worldserver cat /azerothcore/env/dist/data/dbc/Spell.dbc > /tmp/.../Spell.dbc
#   - spells/trapEffects/petAbilities/petPassiveCarriers: flagsA/flagsB/flagsC = SpellClassMask_1/_2/_3
#     read straight from that DBC via
#       python3 tools/dump_spell_family.py <Spell.dbc> tools/spell_dbc_columns.txt --names ... / --ids ...
#     (NOTE the tool's REAL signature: positional <dbc> <columns-file>, then --names/--ids — the
#     bare-name form in the plan text is not how it is invoked.) Every rank of every multi-rank line
#     below was dumped; the recorded mask is the SHARED mask across the player-cast ranks, and where a
#     rank chain splits into two different masks that split is called out explicitly.
#   - Effect-level detail (Effect_N / EffectAura_N / EffectSpellClassMaskA_N / ProcTypeMask) came from
#       python3 tools/dump_spell_effects.py <Spell.dbc> tools/spell_dbc_columns.txt --ids ... --cols ...
#     Aura numbers were resolved against the fork's own
#     src/server/game/Spells/Auras/SpellAuraDefines.h (never from memory).
#   - grants/triggers: stock ids resolved on the LIVE dev-box worldserver via
#       python3 tools/wgconsole.py <out> "lookup spell <name>" ...
#     taking the rank-1 [talent] entry. Raw output kept at /tmp/claude-1000/hids.out + hids2.out during
#     the task; the id ranges 19150-19370 and 19370-19700 were additionally swept by id so no
#     Vanilla-tree talent id is a guess.
#   - Trap sub-spell identity was established from the WORLD DB, not from names: the trap GameObject's
#     `gameobject_template.Data3` is the spell its trigger casts. Query used (the LIKE form matters —
#     an exact `name IN (...)` match misses "Hemet's Immolation Trap", which is the whole point of the
#     51740 decoy finding recorded under trapEffects):
#       SELECT entry,name,Data3 FROM gameobject_template
#        WHERE type=6 AND name LIKE '%Trap%'
#          AND Data3 IN (51740,13797,63487,13812,3355,13810);
#     This matters — see the trapEffects notes; two same-named rank chains exist for Immolation Trap and
#     only one of them is what the player's trap actually fires.
#   - spell_pet_auras / spell_proc / spell_proc_event / spell_linked_spell / spell_script_names were all
#     queried live on ac-database (acore_world) to decide Bound-vs-Authored for the pet talents; results
#     are recorded as comments on the relevant entries below (Task 6 depends on them).
#
# HELPER-ID CHECK (Task 3 Step 1) — run 2026-08-16, result ALL FREE:
#   grep -rn "93295[2-7]\|93296[1-9]\|93297[12]" era-data/ modules/mod-era-talents/data/sql/  -> no hits.
#   Neighbors confirmed untouched: warlock 932900-932949, priest 932950/932951/932960/932970,
#   mage 932980-932982/932990/932991, sentinel 932999.

