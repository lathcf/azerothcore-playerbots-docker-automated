trapEffects:             # the TRIGGERED sub-spells the trap GameObjects cast (gameobject_template.Data3)
  # Resolved from the world DB, NOT by name — the name alone is ambiguous for Immolation Trap.
  #   GO 2561   "Freezing Trap"   Data3 = 3355
  #   GO 164638 "Immolation Trap" Data3 = 13797
  #   GO 164639 "Frost Trap"      Data3 = 63487
  #   GO 164839 "Explosive Trap"  Data3 = 13812
  "Immolation Trap Effect":
    id: 13797            # ranks 13797/14298-14301/27024/49053/49054
    flagsA: 0
    flagsB: 0
    flagsC: 131072       # identity is WORD 3 ONLY — it does NOT share the trap-placement bit 128
    note: >-
      DBC Name_Lang_enUS is literally "Immolation Trap" (same as the placement spell), so a name
      lookup returns two rank chains: placement (128,0,0) and this DoT (0,0,131072). Effect_1=6
      APPLY_AURA / EffectAura_1=3 PERIODIC_DAMAGE confirms which is which.
      DO NOT use 51740 "Immolation Trap Effect" (4,0,0) — that id belongs to GO 190603
      "Hemet's Immolation Trap" (a quest object), verified by the gameobject_template query.
  "Explosive Trap Effect":
    id: 13812            # ranks 13812/14314/14315/27026/49064/49065
    flagsA: 4
    flagsB: 0
    flagsC: 16384
    note: >-
      Carries BOTH word-1 bit 4 and word-3 bit 16384 on every rank. Word-1 bit 4 is shared with
      51740 and the 22910/47784/52606 "Immolation Trap" NPC chain; word-3 16384 is exclusive to this
      line. Effect_1=2 SCHOOL_DAMAGE + Effect_2=27 PERSISTENT_AREA_AURA/aura 3 PERIODIC_DAMAGE.
  "Freezing Trap Effect":
    id: 3355             # ranks 3355/14308/14309/31932/55041
    flagsA: 8
    flagsB: 0
    flagsC: 0
    note: >-
      Effect_1 = 6 APPLY_AURA / aura 12 MOD_STUN, Effect_2 = 6 / aura 308 MOD_CRIT_CHANCE_FOR_CASTER.
      Word-1 bit 8 is otherwise held only by Freezing Arrow Effect 60210 and NPC/Ram copies.
  "Frost Trap (trigger)":
    id: 63487            # what GO 164639 actually casts
    flagsA: 0
    flagsB: 0
    flagsC: 262144
    note: >-
      Pure trigger shell: Effect_1 = 64 TRIGGER_SPELL -> 67035 (Frost Trap Slow),
      Effect_2 = 64 TRIGGER_SPELL -> 13810 (Frost Trap Aura). Nothing damaging of its own.
  "Frost Trap Aura":
    id: 13810
    flagsA: 16
    flagsB: 0
    flagsC: 0
    note: >-
      The persistent ground aura (Effect_1/2 = 27 PERSISTENT_AREA_AURA, aura 33 MOD_DECREASE_SPEED
      and aura 23 PERIODIC_TRIGGER_SPELL -> 18350). Reached only via 63487, never cast directly.
      DANGLING TRIGGER, EXPLICITLY RECORDED (same class of gotcha as 67035's empty mask):
      EffectTriggerSpell_2 = 18350 but id 18350 DOES NOT EXIST in Spell.dbc (dump_spell_family --ids
      18350 -> "not found"). The periodic trigger therefore fires nothing; the actual slow is
      delivered by 67035, which 63487 triggers separately. Do not author against 18350.
  "Frost Trap Slow":
    id: 67035
    flagsA: 0
    flagsB: 0
    flagsC: 0
    emptyFamilyMask: true
    note: >-
      EMPTY MASK, EXPLICITLY RECORDED (the plan asked for this call-out). SpellClassSet = 9 but
      SpellClassMask_1/2/3 are all ZERO, so NO family-mask `affects:` can ever select it — an
      Entrapment/Clever-Traps style node that needs to key off the frost slow must match by
      school+family, bind the placement spell (13809, bit 128) or the aura (13810, bit 16) instead.
      Core names it SPELL_FROST_TRAP_SLOW in src/server/scripts/Spells/spell_hunter.cpp:70.

