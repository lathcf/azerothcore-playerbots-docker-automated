petPassiveCarriers:      # "Tamed Pet Passive NN (DND)" — the hidden family-9 carriers pet talents ride
  # ===========================================================================================
  # THE MOST IMPORTANT TASK-6 FINDING. Hunter pets auto-learn these passives — they are NOT in
  # spell_pet_auras. Path (read in the fork, not assumed):
  #   DBCStores.cpp:489  — every PASSIVE spell on the pet skill line with SpellLevel 0 and
  #                        AcquireMethod LEARNED_ON_SKILL_LEARN is inserted into sPetFamilySpellsStore
