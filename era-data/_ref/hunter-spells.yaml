  # SPELLMOD_DOT effect masks the two DAMAGE sub-spells — Explosive Trap Effect 13812 (whose
  # Effect_1 is direct SCHOOL_DAMAGE, not only its periodic component) and the Immolation DoT
  # 13797. The placement bit is used by neither. See grants.trap_mastery for the exact masks.
  # (For completeness: a scan of family=9 word-1 bit 128 also returns Black Arrow 3674, Snake Trap
  # 34600, Freezing Arrow 60192, Arcane Trap 47789, Ice Trap 71249 and Trap Launcher 63461 — all
  # post-Vanilla or NPC, so unreachable in a Vanilla-era tree, but the bit is not exclusive to these
