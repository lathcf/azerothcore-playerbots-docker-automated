  # --- Traps (the PLACEMENT spells) -----------------------------------------------------------
  # All four Vanilla traps share word-1 bit 128, but READ THIS BEFORE BINDING IT: bit 128 identifies
  # the PLACEMENT cast only (the SUMMON_OBJECT_SLOT effect that drops the trap GO). It does NOT reach
  # the damage/CC the trap actually delivers, which lives in the separate triggered sub-spells listed
  # under `trapEffects:` below.
  # Stock Trap Mastery (19376/63457/63458) proves the intended encoding — a trap-improvement spellmod
  # masks the EFFECT spells, never bit 128 (dump_spell_effects, all three ranks identical in shape):
