# Stock Mage spell reference — live-verified from Spell.dbc (family=3) + lookup. DO NOT guess.
# flagsA/B/C = the targeting mask a SPELLMOD passive uses (word3 category bit dropped). Generated by
# extracting Spell.dbc via tools/dump_spell_family.py on 2026-08-13.
#
# Verification method:
#   - spells: flagsA/flagsB = SpellClassMask_1/_2 read straight from Spell.dbc for the given id;
#     flagsC is ALWAYS 0 here (word 3, value 8 on most of these, is a shared category flag reused
#     across many mage spells — dropping it avoids a SPELLMOD over-matching unrelated spells; this
#     mirrors stock Improved Fireball, which uses EffMaskA=(1,0,0) with word3 dropped too).
#   - grants: reused stock spell ids resolved on the LIVE dev-box worldserver via
#     `tools/wgconsole.py ... "lookup spell <name>"`, disambiguated against Spell.dbc SpellLevel/
#     family/SchoolMask where the name collided with NPC/mob duplicates (Counterspell, Ice Block).
#     Only rank 1 is recorded per the era-talents Bound-node convention; the full rank chain (where
#     the talent grants a multi-rank stock spell) is noted in a comment for future authoring.
familyName: 3
