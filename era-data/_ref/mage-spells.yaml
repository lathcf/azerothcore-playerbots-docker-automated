  "Amplify Magic":   { id: 1008,  flagsA: 8192,    flagsB: 0,       flagsC: 0 }
  "Dampen Magic":    { id: 604,   flagsA: 8192,    flagsB: 0,       flagsC: 0 }
  # Frost Warding scales the armor/resist of Frost Armor + Ice Armor (SPELLMOD_ALL_EFFECTS). The
  # Vanilla-band ranks (Frost Armor 168/7300/7301, Ice Armor 7302/7320/10219/10220) all share mask
  # 34078720 (bits 19|25) — the 524288/0 masks belong to higher WotLK ranks an era char won't have.
  "Frost Armor":     { id: 168,   flagsA: 34078720, flagsB: 0,      flagsC: 0 }
  "Ice Armor":       { id: 7302,  flagsA: 34078720, flagsB: 0,      flagsC: 0 }
  # Pseudo-spell for the custom Improved Blizzard chill helpers (932980-2). Reserved family WORD-2
  # bit 6 (word-0 bit 28 was used until 2026-09-06 — it is MAGE ARMOR's identity; never recycle it)
  # (unused by any stock mage spell) so Permafrost's SPELLMOD can extend/deepen JUST that chill.
  "Blizzard Chill":  { id: 932980, flagsA: 0,         flagsB: 0,    flagsC: 64 }
