  families_compared:
    A_effects: 'per slot: Effect, EffectAura, EFFECTIVE base points, EffectMiscValue_0, EffectMiscValue_1(B), EffectTriggerSpell,
      EffectAuraPeriod, EffectRadiusIndex_0, EffectMechanic, EffectChainTargets, EffectRealPointsPerLevel (float,
      4 dp), ImplicitTarget_0(A), ImplicitTarget_1(B).'
    B_proc_options: ProcChance, ProcCharges, ProcTypeMask, CumulativeAura (wago SpellAuraOptions).
    C_misc: DurationIndex, CastingTimeIndex, RangeIndex, SchoolMask, Speed (float), and ALL EIGHT attribute words
      (wago SpellMisc.Attributes_0..7 vs live Attributes/AttributesEx..Ex7).
    D_categories: Category, DefenseType, DispelType, Mechanic, PreventionType, StartRecoveryCategory.
    E_power: 'ManaCost, ManaCostPct, ManaPerSecond, PowerType (wago SpellPower OrderIndex 0). This family fires
      on almost every warlock ACTIVE, and almost always for the same systemic reason: WotLK converted flat mana
      costs to `ManaCostPct` of base mana. See `accepted_gaps` id 3 — it is an era-wide core change, not a per-node
      finding, and it is the single largest contributor to the DIVERGED count.'
    F_class_options: 'SpellClassSet and the spell''s OWN identity mask WORD 0 only (words 1-3 excluded as cross-build
      encoding noise, per the shaman A.12 / warrior / rogue precedent). One hit that matters: Conflagrate 17962
      `ownMaskW0 TBC 0x200 -> LIVE 0x0` — TBC Classic re-encoded Conflagrate''s identity into word 0 bit 9 while
      3.3.5a keeps it in word 1 bit 23 (0x800000). A TBC clone MUST carry the LIVE encoding (`flagsB 8388608`),
      which is what templating 17962 gives for free.'
    G_cooldowns: RecoveryTime, CategoryRecoveryTime, StartRecoveryTime (wago SpellCooldowns).
    H_aura_restrictions: 'CasterAuraState, TargetAuraState, ExcludeCasterAuraState, ExcludeTargetAuraState, CasterAuraSpell,
      TargetAuraSpell, ExcludeCasterAuraSpell, ExcludeTargetAuraSpell. wago 2.5.4''s SpellAuraRestrictions is a
      SPARSE table — 186 rows for 28 606 spells — because a row exists only when a restriction is non-default. That
      is NOT a broken export: the six warlock ids in this set that need one all have one, and the load-bearing case
      is present (**Conflagrate 17962 `TargetAuraState = 14` in BOTH TBC and live**, so the family reports no divergence
      and the Immolate requirement/consume is confirmed identical). Verified by re-fetching the table.'
    I_shapeshift: ShapeshiftMask, ShapeshiftExclude. ZERO hits on the warlock id set.
    J_levels: BaseLevel, MaxLevel, SpellLevel. It is what supplies every TRAINED-RANK LEVEL in `capstone_chains:`
      independently of any tooltip — Siphon Life 30/38/48/58/63/70 and Conflagrate 40/48/54/60/65/70 are read straight
      off wago SpellLevels, and they match the stock trainer curve shape exactly.
    K_equipped_item: EquippedItemClass, EquippedItemSubclass, EquippedItemInvTypes. ZERO hits.
    L_interrupts: InterruptFlags, AuraInterruptFlags, ChannelInterruptFlags. Its only hits are the four Demonic
      Sacrifice benefit buffs (18789-18792) gaining `AuraInterruptFlags 0x48000c` live — the WotLK "cancel on mount/enter
      vehicle" retune, cosmetic for our purposes.
    M_targets: Targets, TargetCreatureType, MaxTargets, MaxTargetLevel.
    N_identity: wago SpellName.Name_lang vs live Name_Lang_enUS — the ID-REPURPOSING detector, and on warlock it
      is the single most valuable family in the sweep. NINE ids in the set are a DIFFERENT TALENT live; five of
      them (17794/17797/17798/17799/17800) are TBC's Improved Shadow Bolt debuffs reused as WotLK's Shadow Mastery
      ranks. Nothing else in the sweep would have flagged them. See `id_repurposing:`.
    O_effect_class_masks: 'Per-effect EffectSpellClassMask words 0/1/2, compared as a SUPPLEMENTARY pass. **Column
      mapping (rogue''s correction, re-confirmed here): the live names `EffectSpellClassMaskA_1/A_2/A_3`, `B_*`,
      `C_*` are {EFFECT}_{WORD}, NOT {word}_{effect}** — A/B/C is the effect index and _1/_2/_3 the word index (workflow
      lesson 19). Verified again against `gen_era_talents.py:818` and `era_audit.py:315`.'
  method:
    conventions:
      effect_slot_numbering: 'THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/_2/_3 (array
        indices 0/1/2). The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is this map''s e1. Wherever
        a core token appears it is written `EFFECT_n (0-based; = this map''s e<n+1>)`.'
      magnitudes_are_effective: Every magnitude is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides ==
        1`, else `basePoints`. Both sides are normalised identically before diffing, so a row that moved the +1
        into DieSides does not read as a divergence. Where a spell has a real damage RANGE the `tbc:` line prints
        `val=<max> dieSides=<n>(raw bp=<raw>)` so an author can reproduce it exactly (e.g. Conflagrate r1 `val=240
        dieSides=68(raw bp=239)` = 240-307 before level scaling).
      indices_are_build_stable: "DurationIndex / CastingTimeIndex / RangeIndex / EffectRadiusIndex are indexes into\
        \ separate DB2 tables, so comparing them across builds is only valid if the tables agree. **They do.** SpellDuration\
        \ / SpellCastTimes / SpellRange / SpellRadius were fetched for 2.5.4.44833 and every index this id set uses\
        \ decodes to the same value as 3.3.5a:\n  DurationIndex  1=10000  8=15000  9=30000  21=-1(permanent)  27=3000\
        \  29=12000\n                 32=6000  35=4000  39=2000  85=18000\n  CastingTimeIndex 1=0(instant)  3=500\
        \  5=2000  16=1500\n  RangeIndex     1=Self(0)  3=20yd  4=30yd  6=100yd  13=Unlimited(50000)\n  EffectRadiusIndex\
        \ 12=100  13=10  14=8\nTwo independent anchors confirm it: Corruption castIdx 5 = the known TBC 2 s cast,\
        \ and Unstable Affliction durIdx 85 = the tooltip's 18 sec."
      verdict_vocabulary: "LIVE_MATCH = every field in the fourteen verdict families agrees. DIVERGED = at least\
        \ one differs. WAGO_ONLY = present in TBC 2.5.4, ABSENT from BOTH `Spell.dbc` and `acore_world.spell_dbc`\
        \ —\n  must be authored, never granted.\nLIVE_ONLY = present live, absent from TBC — must not be reachable\
        \ by a TBC warlock. LIVE_OVERLAY = absent from Spell.dbc but present in the `acore_world.spell_dbc` overlay,\
        \ i.e.\n  AzerothCore-supplied. Exactly TWO ids: **1206 \"Dummy Proc\"** and **18350 \"Dummy Trigger\"**\
        \ —\n  both reached only through the trigger closure and neither is authorable content.\nERA_BAND = an id\
        \ in [920000,950000): this repo's own Vanilla clone, read from `spell_dbc`.\n  53 such ids ride along because\
        \ the bounded Vanilla re-audit put them in the set; they are\n  never \"missing from TBC\".\nLIVE_MATCH_UNVERIFIED_SLOT\
        \ = all compared fields agree but a LIVE effect slot has no wago\n  SpellEffect row (DB2 stores no empty-effect\
        \ row, so absence is not evidence of a zero).\n  ONE id: 17803 (Improved Shadow Bolt r5) — see `live_extra_slots:`.\n\
        **A LIVE_MATCH verdict is NOT by itself a licence to GRANT.** Three independent hazards sit outside the\
        \ verdict families and each has bitten a node here: a LIVE EXTRA SLOT (`live_extra_slots:`), an id-repurposed\
        \ NAME (`id_repurposing:`), and a stock `spell_pet_auras` / `spell_proc` / `spell_script_names` row whose\
        \ PAYLOAD diverges even though the talent rank itself matches (Master Demonologist is the textbook case)."
      tbc_line_is_authoritative: Every `survival_map` entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record
        needed to reproduce the spell (per-effect tuple with die sides, effect class masks and implicit targets,
        plus duration/proc/power/cooldown/category/mechanic/preventionType/aura-restriction/ shapeshift/equip/level/interrupt/target/family/ownMask
        and every non-zero attribute word). Tasks 2-4 author FROM THIS LINE and do not re-fetch wago. A field absent
        from the line is zero in TBC. LIVE_ONLY / LIVE_OVERLAY entries carry no meaningful `tbc:` line.
      column_list_gaps: "**Workflow lesson 11, stated up front.** Three DBC column families are NOT compared because\
        \ wago 2.5.4 publishes no table for them, and an author must therefore carry them EXPLICITLY on any clone\
        \ rather than assume the sweep vetted them:\n  * **Reagent_1..8 / ReagentCount_1..8.** Live values that\
        \ matter here (all verified by hand):\n    Shadowburn 17877 + every trained rank + Summon Felguard 30146\
        \ = Soul Shard **6265 x1**;\n    all Create Firestone / Create Spellstone ranks = 6265 x1; Conflagrate,\
        \ Siphon Life,\n    Dark Pact, UA and Shadowfury carry NO reagent.\n  * **EffectItemType_1..3.** The nine\
        \ TBC Create-stone clones live or die on this column —\n    stock 6366/17951/17952/17953/27250 point at\
        \ the WotLK enchant stones\n    41170/41169/?/41172/40773 and 2362/17727/17728/28172 at 41191/41192/41193/41194;\
        \ the era\n    clones must re-point at the reconstructed items (the Vanilla clones 932922-932928 already\n\
        \    do — 932922 -> 1254, 932926 -> 5522).\n  * **SpellIconID / ActiveIconID.** Not a cosmetic detail on\
        \ this class: the core finds\n    Mana Feed's Life Tap half BY ICON (`WARLOCK_ICON_ID_MANA_FEED = 1982`).\
        \ See\n    `core_hardcodes.mana_feed_life_tap`."
    live_dbc:
      source: azerothcore-wotlk/ip-dbc/Spell.dbc
      md5: 49c9c5f53e8974c27d67635384725f46
      note: Identical md5 to the hunter and rogue phases' copies and to the running worldserver's DBC — no client/server
        generation mismatch, so the sweep's live side is the store the worldserver actually runs.
    db_overlay: '`acore_world.spell_dbc` (7711 rows) REPLACES records at load, so overlay membership is live presence.
      Queried for all 403 ids: 55 hits — 53 of this repo''s own Vanilla warlock band clones plus 1206 and 18350
      (see LIVE_OVERLAY above). Without this step, all 55 would have been mis-verdicted WAGO_ONLY.'
    tbc_source: 'wago 2.5.4.44833: SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellClassOptions, SpellCategories,
      SpellCooldowns, SpellAuraRestrictions, SpellShapeshift, SpellLevels, SpellEquippedItems, SpellInterrupts,
      SpellTargetRestrictions, SpellName (the fourteen), plus SpellDuration, SpellCastTimes, SpellRange, SpellRadius
      for index decoding. Headers printed and verified before use.'
    tooltip_cache: '`era-data/_ref/tbc/tooltips/<id>.json`, 184 warlock ids added by this task''s `import_tbc_talents.py
      --fetch` (1610 files total in the directory after the run). **The cache uses TBC-CLASSIC RENAMES** — "Improved
      Sayaad" (18754-18756), "Improved Subjugate Demon" (18821/18822), "Succubus/Incubus", "Subjugate Demon", "Fel
      Guard". The DATASET authors the 2.4.3 / live-3.3.5a names ("Improved Succubus", "Improved Enslave Demon",
      "Succubus", "Enslave Demon", "Felguard"); the cache is NOT edited. Nothing else in the cached text changes.
      The importer wrote real names + real icons for all 64 nodes: `grep -c ''"icon": "classic_''` on the skeleton
      returns **0**.'
    id_set_construction: Seed = the 184 distinct rank spells of the 64 skeleton nodes; PLUS the bounded Vanilla
