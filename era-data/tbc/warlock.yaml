    pet_aura_registration:
      answer: '**YES** — `Pet::CastPetAuras` (Pet.cpp:2354) replays the owner''s whole `m_petAuras` set on every
        summon/load and nothing in the registration path (`AuraEffect::HandleAuraDummy` SpellAuraEffects.cpp:5186-5193,
        `Spell::EffectDummy` SpellEffects.cpp:761-766, `Unit::AddPetAura` Unit.cpp:13749) consults `Talent.dbc`,
        `HasTalent` or the talent frame, so a SPELLBOOK-LEARNED (era-granted) stock passive registers its `spell_pet_auras`
        rows exactly like a talented one, and it survives dismiss+resummon.'
