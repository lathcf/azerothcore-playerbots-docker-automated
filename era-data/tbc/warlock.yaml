  core_hardcodes:
    conflagrate_immolate_consume:
      where: src/server/game/Spells/SpellEffects.cpp:386-430 (SPELLFAMILY_WARLOCK arm of the SCHOOL_DAMAGE handler)
      keys_on: '`m_spellInfo->TargetAuraState == AURA_STATE_CONFLAGRATE` — a **DATA field**, not an id and not a
        family bit.'
      mechanism: The branch (1) implicitly gates the cast on the target carrying the state, (2) adds a %-of-Immolate
        bonus computed from THIS spell's Effect_2/Effect_3 base values, (3) sets `apply_direct_bonus = false` so
        the flat damage takes no spellpower, and (4) removes the CASTER's Immolate unless Glyph of Conflagrate 56235
        is held. `SpellInfo.cpp:1980` is what puts Immolate (family bit word0 0x4) and Shadowflame (word2 0x2) into
        the state in the first place — also family-based, also era-safe.
      disposition: '**The Vanilla clone 932780 already answers this and its shape is copied verbatim.** Template
        17962 (inheriting TargetAuraState 14, category 672, the 10 s category cooldown, range, school and the family
        identity), author only e1, and leave e2/e3 ZERO so the %-bonus computes 0 and no DoT is applied. Consume
        + requirement survive with no script.'
