      pyroclasm: NEITHER on this core in the TBC sense. TBC 18096/18073 carry `aura 112 OVERRIDE_CLASS_SCRIPTS misc
        2188/2189` plus a dummy trigger 18350, and **3.3.5a implements no class script 2188/2189** (the only warlock
