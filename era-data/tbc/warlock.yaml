# --- Master Spellstone 22646 behaviour (948432/948433) -------------------------------------------
# TBC spellstones are **dispel-only**: the 2.4.3 Use effect removes all harmful magic from the caster
# and there is NO absorb shield (WotLK is what added one, and the Vanilla reconstruction's 400/650/900
# absorb is 1.12's). So 948432 is the shipped Vanilla use spell 932948 MINUS its aura-69 effect — one
# SPELL_EFFECT_DISPEL, 3 min cooldown, no duration (nothing persists).
# 948433 is the equip half: TBC Master Spellstone gives **+20 spell critical strike RATING**, i.e.
# `aura 189 SPELL_AURA_MOD_RATING` with EffectMiscValue = the combat-rating BITMASK 1<<10
# (CR_CRIT_SPELL) = 1024 — NOT the flat +1% crit chance (aura 57) the Vanilla items carry. Item
# spellid_1 (trigger 0 = on-use) -> 948432, spellid_2 (trigger 1 = on-equip) -> 948433.
- id: 948432               # Master Spellstone use — dispel harmful magic (no absorb; TBC has none)
  name: Spellstone
  castTimeIndex: 1         # instant
  rangeIndex: 1            # self
  cooldown: 180000         # 3 min (the stone cooldown)
  effects:
  - effect: 38             # SPELL_EFFECT_DISPEL — self-cast = removes harmful magic from the caster
    basePoints: 10         # dispel count ("removes all" in practice)
    misc: 1                # DISPEL_MAGIC
    targetA: 1
  client:
    name: Spellstone
    icon: 344              # Spellstone art
    description: "Dispels all harmful magic effects from the caster."
- id: 948433               # Master Spellstone equip — +20 spell crit RATING
