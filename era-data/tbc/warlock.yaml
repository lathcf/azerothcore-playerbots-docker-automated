  accepted_gaps:
  - id: 1
    what: Shared Spellstone tier magnitudes.
    detail: TBC 2.4.3 Spellstones (items 5522/13602/13603) give **+8/+11/+14 spell crit RATING** with a dispel-only
      Use and require level 36/48/60; the shipped Vanilla reconstruction gives **+1% spell crit + 400/650/900 absorb**
      at levels 31/43/55. Items are GLOBAL and eras are per-character (spec Q2 = A), so a TBC warlock gets the 1.12
      values. The four **Firestone** tiers are value-IDENTICAL between 1.12 and 2.4.3 (25-35/+10, 40-60/+14, 60-90/+17,
      80-120/+21) — no gap there. The evidence that would close it is a per-era item mint, declined.
    raw_values_both_eras: Amendment A.0 of the spec carries the per-tier tooltip figures; the shipped Vanilla side
      is `era-data/vanilla/warlock.yaml` helpers 932931-932938 / 932946-932949.
  - id: 2
    what: TBC-Classic renames in the cached Wowhead tooltips.
    detail: '''Improved Sayaad'' (18754-18756), ''Improved Subjugate Demon'' (18821/18822), ''Succubus/Incubus'',
      ''Subjugate Demon'', ''Fel Guard''. The dataset authors the 2.4.3 / live-3.3.5a names; the cache is not edited
      (it is evidence, not content).'
  - id: 3
    what: The WotLK flat-mana -> ManaCostPct conversion.
    detail: 'WotLK converted almost every warlock spell''s flat `ManaCost` to `ManaCostPct` of base mana. It is
      the single largest contributor to the DIVERGED count and it is an era-wide CORE data change, not a per-node
      finding. It only matters where we CLONE (the clone carries the TBC flat cost, which is correct) — for a GRANT
      the stock %-cost stands. Sub-gap **3b**: the same is true of the WotLK-era global attribute bits that show
      up on nearly every warlock spell (`AttributesEx6 0x800000`, `AttributesEx4 0x100000`), which are never a reason
      on their own to refuse a GRANT.'
  - id: 4
    what: Nightfall's 6 s internal cooldown.
    detail: '`spell_proc` row -18094 carries `Cooldown 6000`. TBC''s Nightfall had no ICD. The row is stock AzerothCore
      balance; changing it would affect WotLK warlocks too (rows are global). Declined.'
  - id: 5
    what: Dark Pact range.
    detail: TBC RangeIndex 4 (30 yd); live 6 (100 yd). Node 20717 GRANTs the stock spell, so a TBC warlock can Dark
      Pact a pet further away than TBC allowed. Harmless (the target is the caster's own demon) and un-fixable without
      a clone whose only purpose would be the range.
  - id: 6
    what: '`SPELL_ATTR0_CU_NO_POSITIVE_TAKEN_BONUS` does not reach a Conflagrate clone.'
    detail: '`SpellMgr.cpp:3702` applies it to the literal id 17962. Band clones (Vanilla 932780-932783, TBC 948650-948655)
      have different ids and never get it. `AttributesCu` is core-computed with no DBC column and no generator key,
      so there is nothing to author. Impact is small: the era clone deals FLAT damage with `apply_direct_bonus =
      false` rather than the WotLK %-of-Immolate, so there is little positive-taken bonus left to double-count.
      **Follow-up for the framework, not this phase: `era_audit.check_spellfix_inheritance` reads only `ApplySpellFix({...})`
      in `SpellInfoCorrections.cpp` and is blind to `SpellMgr.cpp`''s by-id AttributesCu sweep.**'
  - id: 7
    what: Shadow Embrace debuff duration.
    detail: TBC's debuffs 32386-32391 carry `DurationIndex 21` = PERMANENT, because the TBC client managed their
      lifetime through class script 4994 (unimplemented on 3.3.5a). A permanent -5% physical damage debuff is not
      shippable, so Task 2 picks a finite duration and records the choice in the node comment. Recorded here so
      the deviation is not later mistaken for an error.
