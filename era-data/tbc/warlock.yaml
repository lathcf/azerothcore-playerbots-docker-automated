# (SpellAuras.cpp:2858-2866 — the `targetList.push_back(GetUnitOwner())` that would also hit the
# holder belongs to effect 119 APPLY_AREA_AURA_PET, which falls through into the OWNER arm), so a
# single 143 effect cannot buff the demon. The warlock's half therefore rides the visible buff
# (948550 e2) and the demon's half is a plain self-aura on the carrier the pet already casts
# (948551 e2). Reproduces the TBC tooltip's "both the demon and master will inflict 5% more damage"
# without the double-application a 119 effect on the carrier would give the owner.
# The split % still travels 948550 (DUMMY amount 20) -> era_soul_link -> CastCustomSpell BASE_POINT0,
# which overrides EFFECT_0 only, so 948551's +5% e2 keeps its authored value.
