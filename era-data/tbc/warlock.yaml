    icon: 344
    description: "Increases your spell critical strike rating by 20."
# === Affliction (948450-948549) ==================================================================
# Allocated IN ORDER by this task. USED: 948450-948458, 948460-948464, 948470-948472 (17 ids).
# HOLES: 948459 (see above), 948465-948469. FREE within the partition: 948473-948549.
#   948450        Amplify Curse active (node 20708)
#   948451-456    Siphon Life r1-r6 reconstruction (node 20713; r1 node-granted, r2-r6 trainer-taught)
#   948457/458    Improved Drain Soul payloads (node 20703): mana-return energize / threat passive
#   948460-464    Shadow Embrace debuffs r1-r5 (node 20712)
#   948470-472    Unstable Affliction clones r1-r3 (node 20720; r1 node-granted, r2/r3 trainer-taught)
# The trainer rows and the two `spell_ranks` chains (rooted at 948451 and 948470) are Task 5's — the
# generator has no `spell_ranks` key, exactly as the hunter Aimed Shot chain 948370-948376 does it
# (`client.rank:` here, chain + trainer rows in a hand SQL migration).
#
# --- Amplify Curse (node 20708) ------------------------------------------------------------------
# Stock 18288 is WotLK's hidden PASSIVE (a -0.5 s curse-GCD spellmod), not an ability — granting it
# lands an invisible passive on the bar (the Vanilla phase measured exactly that). TBC's Amplify
# Curse is a real ACTIVE, so author one, template-less for the same reason the Vanilla clone 932918
# is: cloning 18288 would inherit its passive+hidden Attributes into the CLIENT row and hide the
# castable. Shape from the survival map (18288 `tbc:`): durIdx 9 = 30 s, RecoveryTime 180000 = 3 min,
# 0 mana, instant, self, ProcCharges 1, school 32, dispel 1.
# The DUMMY is a marker, not the mechanism: wago's own e1/e2 spellmods (+50 allEffects masked
# CoA|CoD, -20 effect1 masked CoE) cannot express Curse of Exhaustion's slow, whose amount is
# NEGATIVE — a percentage spellmod on it moves the number the wrong way — so the boost stays in
# `era_amplify_curse`, which uses the sign-aware CalculatePct (CalculatePct(-200,50) = -100) and
# consumes the marker so only the NEXT curse is amplified. That is the shipped, real-client-verified
# Vanilla design; TBC reuses it verbatim and only changes the TARGET SET, via the script's era table.
# ProcCharges 1 is authored for fidelity (TBC's buff renders as a 1-charge aura) and is inert on the
# server: with no `spell_proc` row and DBC ProcTypeMask 0, Aura::IsProcTriggeredOnEvent never fires,
# so nothing can drop the charge — the script's RemoveAurasDueToSpell is what ends the buff.
- id: 948450
  name: Amplify Curse
  powerCost: 0             # TBC Amplify Curse costs no mana (wago: no SpellPower row)
  castTimeIndex: 1         # instant
  rangeIndex: 1            # self (0 yd) — it is a self-buff marker
  durationIndex: 9         # 9 = 30000ms (30 s)
  cooldown: 180000         # 3 min (RecoveryTime, ms)
  procCharges: 1           # fidelity only — see the block comment
  school: 32               # SPELL_SCHOOL_MASK_SHADOW (wago school=32; the Vanilla clone left it 0)
  dispelType: 1            # DISPEL_MAGIC (wago dispel=1) — TBC's buff really is dispellable
  effects:
  - effect: 6              # APPLY_AURA
    aura: 4                # SPELL_AURA_DUMMY — the marker era_amplify_curse reads off the caster
    basePoints: 0
