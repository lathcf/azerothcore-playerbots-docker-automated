# Allocated by Task 4 to spec Amendment A.1's PINS. USED: 948650-948655, 948660-948667, 948670-948672
# (17 ids). HOLES: 948656-948659, 948668/948669 — deliberate, because A.1 pins the ISB debuffs at
# 948660 and the Shadowfury chain at 948670. Never renumber into a hole. FREE: 948673-948749.
#   948650-655    Conflagrate clones r1-r6   (node 20760; r1 node-granted, r2-r6 trainer-taught)
#   948660-664    Improved Shadow Bolt debuffs r1-r5 ("Shadow Vulnerability", node 20743)
#   948665        Aftermath daze             (node 20746)
#   948666        Pyroclasm stun             (node 20754)
#   948667        Nether Protection immunity (node 20757)
#   948670-672    Shadowfury clones r1-r3    (node 20763; r1 node-granted, r2/r3 trainer-taught)
# The two `spell_ranks` chains (rooted at 948650 and 948670) and their TrainerId-31 rows are Task 5's
# — the generator has no `spell_ranks` key, exactly as the TBC hunter Aimed Shot chain does it
# (`client.rank:` here, chain + trainer rows in a hand SQL migration).
#
# --- Conflagrate clones r1-r6 (node 20760) -------------------------------------------------------
# CLONE ×6 on template 17962, the shipped Vanilla 932780-932783 shape extended to TBC's six ranks and
# given TBC's per-level growth. Live 17962 is the WotLK 3.0 rework (instant, damage computed as a % of
# the target's Immolate, its own Fire DoT, ManaCostPct 16); TBC is a FLAT nuke with no DoT, and ranks
# 2-6 (18930/18931/18932/27266/30912) are WAGO_ONLY, so every rank is a band clone.
# THE IMMOLATE REQUIREMENT AND CONSUME ARE PURE DBC — NO SpellScript. Template 17962 carries
# TargetAuraState 14 (AURA_STATE_CONFLAGRATE), and the core's generic SPELLFAMILY_WARLOCK
# SCHOOL_DAMAGE handler (SpellEffects.cpp:387) enters the Conflagrate branch for ANY warlock damage
# spell in that state: it (a) gates the cast on the target carrying Immolate/Shadowflame, (b) adds a
# %-of-Immolate bonus computed from Effect_2/Effect_3's base values, and (c) removes THIS caster's
# Immolate. Authoring ONLY e1 and letting the templated 0-fill zero e2/e3 makes the %-bonus 0 (flat
# e1 damage stands, no DoT lands) while requirement + consume remain — exactly TBC. The branch also
# sets apply_direct_bonus=false, so the flat damage takes no spell power, which is likewise TBC.
# INHERITED from 17962 and NOT re-authored: Category 672 + CategoryRecoveryTime 10000 (the 10 s
# cooldown), RangeIndex 4 (30 yd), SchoolMask 4 (Fire), CastingTimeIndex 1 (instant), SpellClassSet 5
# + SpellFamilyFlags_2 8388608 (the LIVE Conflagrate identity bit — which is what makes this tab's
# `affects: [Conflagrate]` spellmods bind the clones), attrs, icon 12.
# AUTHORED per rank: flat mana (live converted it to ManaCostPct 16 — `manaCostPct: 0` is load-bearing,
# the core ADDS the flat and the pct costs), DurationIndex 0 (live carries 32 for its DoT), the
# SpellLevel/BaseLevel/MaxLevel growth window, and e1's basePoints/dieSides/perLevel.
# `client.description` is REQUIRED on every rank: the TBC talent panel renders the GRANTED spell's
# client text, and an unauthored one would show WotLK's %-of-Immolate prose (hunter record §21).
# Ranges are the cached Wowhead TBC per-rank tooltips (presentation source); the server's own value at
# level 70 is one point lower at the top of ranks whose (levelDiff x perLevel) has a fraction, because
# Wowhead rounds the max up where core's int32 truncates. Cosmetic, and it matches the node tooltip.
