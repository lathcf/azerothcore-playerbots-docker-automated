# --- Improved Shadow Bolt debuffs r1-r5 (node 20743) ---------------------------------------------
# RECONSTRUCT. TBC's own debuff ids 17794/17798/17797/17799/17800 ARE live's Shadow Mastery ranks 1-5
# (aura 179 MOD_ATTACKER_SPELL_CRIT_CHANCE, misc 126) — a HARD BLOCK on granting or triggering any of
# them, the same trap the Vanilla phase hit. Fresh band rows instead, and they are byte-identical to
# the Vanilla helpers 932940-932944 (which this commit brings to parity by back-porting the charge
# cap): same aura 87 MOD_DAMAGE_PERCENT_TAKEN, same misc 32 (Shadow), same +4/8/12/16/20%, same
# DurationIndex 29 = 12 s, same `procCharges: 4` + consume row. Spec Amendment A.1 pins them FRESH at
# 948660-948664 rather than reusing the Vanilla ids, so a band move in either direction can strip a
# whole era's rows without touching the other's.
# THE CHARGE CAP NEEDS BOTH HALVES. `procCharges: 4` alone is inert — a charge is only ever spent by a
# proc, so the debuff also carries its own `spell_proc` row. Live 17800 has NO such row (verified
# 2026-09-05: `SELECT * FROM spell_proc WHERE ABS(SpellId)=17800` and the `spell_proc_event` twin both
# return 0 rows) because WotLK's Shadow Mastery has no charges, so the contract comes from wago 2.5.4's
# own 17794-17800: **ProcCharges 4, ProcTypeMask 139936**. 139936 = 0x20 TAKEN_SPELL_MELEE_DMG_CLASS |
# 0x80 TAKEN_RANGED_AUTO_ATTACK | 0x200 TAKEN_SPELL_RANGED_DMG_CLASS | 0x2000
# TAKEN_SPELL_NONE_DMG_CLASS_NEG | 0x20000 TAKEN_SPELL_MAGIC_DMG_CLASS_NEG (SpellMgr.h) — note the
# absence of PROC_FLAG_TAKEN_PERIODIC, which is precisely the tooltip's "non-periodic damage sources".
# No family/school filter, so ANY qualifying source spends a charge (the tooltip says "sources", not
# "your sources"). `phaseMask` is deliberately absent: REQ_SPELL_PHASE_PROC_FLAG_MASK is
# `SPELL_PROC_FLAG_MASK & DONE_HIT_PROC_FLAG_MASK`, so a TAKEN-only row may not carry one.
