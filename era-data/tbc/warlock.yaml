      where: src/server/scripts/Spells/spell_warlock.cpp:601-669 (`spell_warl_create_healthstone`)
      keys_on: 'TWO-STAGE. It FINDS Improved Healthstone with `unitTarget->GetDummyAuraEffect(SPELLFAMILY_WARLOCK,
        284, 0)` (family + **SpellIconID 284** + effect index 0), then switches on `aurEff->GetId()` against the
        literal `SPELL_WARLOCK_IMPROVED_HEALTHSTONE_R1 = 18692` / `_R2 = 18693` to pick the rank, logging `"Unknown
        rank of Improved Healthstone id: {}"` and falling back to rank 0 for anything else.'
      disposition: '**YES, it reads the stock ids — so node 20721 MUST GRANT 18692/18693.** Both are LIVE_MATCH
        and carry no live-extra slot, so the grant is exact. A band clone would be found by the icon lookup and
        then produce the un-improved healthstone plus an error-log line per cast.'
    unstable_affliction_dispel:
      where: src/server/scripts/Spells/spell_warlock.cpp:1024-1049 (`spell_warl_unstable_affliction`), bound to
        -30108
      keys_on: '**NOTHING id-specific.** `HandleDispel` reads its own `GetEffect(EFFECT_0)` base amount, multiplies
        by 9 and casts the hardcoded payload `SPELL_WARLOCK_UNSTABLE_AFFLICTION_DISPEL = 31117` at the dispeller.
        `Id == 30108` is never tested.'
      disposition: Clone freely. Bind the script to the three clone ids in `scriptBindings:` (or to a negative root
        once the clone `spell_ranks` chain exists). TBC's 110/tick x 9 = 990 reproduces the tooltip's "990 damage
        to the dispeller and silence them for 5 sec" exactly, and 31117 is present live (diverges only on attribute
        bits).
