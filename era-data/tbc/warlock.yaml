      where: src/server/scripts/Spells/spell_warlock.cpp:1265-1283 (`spell_warl_shadowburn`), bound to the POSITIVE
        id 29341
      keys_on: '**Neither family bits nor the Shadowburn id.** The script is registered on `SPELL_AURA_CHANNEL_DEATH_ITEM`
        at EFFECT_0 of 29341 — the carrier every Shadowburn rank triggers (e1 eff 64) — and it merely prevents the
        default shard grant unless the target died while honor/XP-worthy.'
      disposition: Moot — Shadowburn is a GRANT, so the whole stock mechanism is inherited.
    proc_payload_reach:
      soul_leech: MASK for the trigger set (`spell_proc` -30293, family 5, mask0 0x181 + mask1 0x820000 = Shadow
        Bolt|Shadowburn|Searing Pain|Soul Fire|Incinerate|Conflagrate), **ID for the payload** (`SPELL_WARLOCK_SOUL_LEECH_HEAL
        = 30294` hardcoded). Heal %% comes from the aura's own EFFECT_0 amount. GRANT works.
