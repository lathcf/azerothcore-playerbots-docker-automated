# The era-1 auto pet-buff band origin. Amendment A.2: every TBC warlock pet-stat talent turns out to
# be an OWNER spellmod onto a LIVE_MATCH Tamed-Pet-Passive carrier, so the auto window is expected to
# stay EMPTY — the key is declared anyway (as hunter's 944000 is) so a future `mechanic: pet` node has
# a reserved home that cannot collide with the hunter dataset's block.
petBuffBase: 945000
# Era-wide client base-cast override (addon Tooltip.lua). TBC Corruption is a **2 s cast at every
# rank** (172/6222/6223/7648/11671/11672/25311, all CastingTimeIndex 5 in wago 2.5.4); WotLK 3.0 made
# it instant, so the live client Spell.dbc says Instant. Core patch 0019 restores the 2 s base
# server-side for a caster holding the pre-Wrath cast-time marker 932930, and this key makes the
# client tooltip agree at every Improved Corruption rank (including rank 0). Same key, same value and
# the same addon path as the Vanilla dataset.
clientCastTimeBase:
  Corruption: 2000
extraSkillLines: []
scriptBindings:
# --- Amplify Curse (node 20708) ------------------------------------------------------------------
# `era_amplify_curse` (AuraScript, EraTalentProcScripts.cpp) is ALREADY bound to every family-5 rank
# of Curse of Weakness / Curse of Agony / Curse of Exhaustion by the VANILLA dataset
# (era-data/vanilla/warlock.yaml scriptBindings, incl. the TBC ranks 27218/27224/29539/30909) — a
# spell_script_names row is global, not per-era, so re-binding those here would only emit duplicate
# DELETE+INSERT pairs across two SQL files. TBC's ONLY new target is **Curse of Doom**, which Vanilla
# has no talent reason to touch. Both ranks live-dumped 2026-09-05
# (tools/dump_spell_family.py ip-dbc/Spell.dbc): `603 Curse of Doom family=5 mask=(0,2,0)` and
# `30910 Curse of Doom family=5 mask=(0,2,0)` — word-1 bit 1, the bit the TBC era row below names.
# Which curses each era actually amplifies is decided by the script's era table (marker 932918 vs
# 948450), NOT by the binding: a Vanilla warlock casting Curse of Doom simply matches no row.
- { spell: 603,   script: era_amplify_curse }   # Curse of Doom r1
- { spell: 30910, script: era_amplify_curse }   # Curse of Doom r2 (TBC)
# --- Unstable Affliction (node 20720) ------------------------------------------------------------
# The CORE script `spell_warl_unstable_affliction` (spell_warlock.cpp:1024-1049) is bound BY ID to
# -30108 and is therefore dead on the band clones. It keys on NOTHING id-specific — HandleDispel
# reads its own EFFECT_0 base amount, multiplies by 9 and casts the hardcoded payload 31117 at the
# dispeller — so re-binding it to the three clones reproduces TBC exactly: 110*9 = 990 at r1, which
# is the number the TBC tooltip states.
- { spell: 948470, script: spell_warl_unstable_affliction }
- { spell: 948471, script: spell_warl_unstable_affliction }
- { spell: 948472, script: spell_warl_unstable_affliction }
# --- Demonic Sacrifice (node 20734) --------------------------------------------------------------
# `era_demonic_sacrifice` (SpellScript, EraTalentProcScripts.cpp) is already bound to the VANILLA
# cast clone 932929 by era-data/vanilla/warlock.yaml; a spell_script_names row is per-SPELL, so the
# TBC cast clone needs its own binding. The script is era-table-driven keyed on the CAST id
# (kDsRows), so this binding is what selects the TBC buff set — including the Felguard (17252) arm.
- { spell: 948552, script: era_demonic_sacrifice }
# --- Soul Link (node 20739) ----------------------------------------------------------------------
# Same story for `era_soul_link` (AuraScript): Vanilla binds 932900, TBC binds its own buff. The
# script reads the split carrier from EraSoulLink::kPairs keyed on the buff id that invoked it, so
# 948550 -> 948551 (20% split + the 5% damage halves) with no era lookup.
# `era_soul_link_relink` is a PetScript (registered by NAME, not per-spell) and walks the whole pair
# table on every demon summon, so it needs NO binding here.
- { spell: 948550, script: era_soul_link }
# --- Improved Enslave Demon (node 20733) ---------------------------------------------------------
# NO binding needed: `era_improved_enslave` is bound to every family-5 Enslave Demon RANK by the
# Vanilla dataset (1098 / 11725 / 11726 / 20882 / 61191 — 20882 is TBC's own rank), and it reads
# DUMMY marker 10 straight off the caster, which a TBC warlock's node 20733 passive now mints.
# --- Master Demonologist (node 20737) ------------------------------------------------------------
# NO binding needed either: `era_master_demonologist` is a PetScript registered by name; it now
# reads EraTalentBots::EraFor(owner) and keys on node 20737 for a TBC warlock.
# --- Master Conjuror (node 20735) + the TBC stones (948430-948433) -------------------------------
# Node 20735 itself needs NO binding: it only mints the DUMMY markers 12 (Improved Firestone) and 13
# (Improved Spellstone) that the three stone scripts already read off the wearing warlock. What DOES
# need bindings is the MASTER tier's own behaviour spells, because a spell_script_names row is
# per-SPELL: the seven shared stone tiers create the SAME items the Vanilla dataset already reconstructed,
# so their behaviour spells (932931-934 / 932946-948 / 932949) keep the bindings Vanilla gave them, and
# only the two Master items' spells are new here.
- { spell: 948430, script: era_firestone_spellpower }   # Master Firestone equip — scales EFFECT_0 (+30 fire spell dmg) by marker 12
- { spell: 948431, script: era_firestone_proc_dmg }     # Master Firestone melee proc — scales the 116-174 hit by marker 12
# 948433 (Master Spellstone equip, +20 spell crit RATING) needs the marker-13 reader, but NOT
# `era_spellstone_absorb`: that script's Register hooks `AuraEffectCalcAmountFn(..., EFFECT_1,
# SPELL_AURA_SCHOOL_ABSORB)` — hard-wired to the VANILLA use-spell's absorb slot — while 948433 has a
# single EFFECT_0 of aura 189 MOD_RATING, so the hook would match no effect (the core logs the usual
# "did not match dbc effect data" line at load) and Master Conjuror would not scale the Master
# Spellstone's crit rating at all. Task 5 therefore added a SECOND marker-13 reader,
# `era_spellstone_crit_rating` (EraTalentProcScripts.cpp), hooking EFFECT_0 / SPELL_AURA_MOD_RATING,
# and this binding points at it. TBC's Master Spellstone has no absorb at all, so there is nothing
# for the absorb script to have scaled.
- { spell: 948433, script: era_spellstone_crit_rating } # marker-13 reader for the +20 crit RATING equip effect
