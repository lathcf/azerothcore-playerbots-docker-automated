# --- Master Firestone 22128 behaviour (948430/948431) --------------------------------------------
# Same two-part shape as the Vanilla firestones (932931-934 equip + 932935-938 proc damage), at the
# TBC Master values: **+30 Fire spell damage** and a **116-174** melee fire proc. Item spellid_1
# (trigger 1 = on-equip) points at 948430; the proc damage 948431 is cast by 948430's aura-42 effect
# and is not on the item at all.
# DOCUMENTED APPROXIMATION, inherited verbatim from the Vanilla block: the real 2.4.3 stone applied a
# weapon ENCHANT (a SpellItemEnchantment row, a DBC surface this pipeline does not ship), so the proc
# rides the equip aura instead — no weapon glow, no temp-enchant slot conflict, same damage behaviour.
# `chance: 20` is the same ~6 PPM-at-caster-weapon-speed approximation the four Vanilla tiers use, so
# all five tiers behave consistently.
# Damage-range encoding is the stock convention: BasePoints = min-1, DieSides = max-min+1.
# `era_firestone_spellpower` / `era_firestone_proc_dmg` (bound below) scale BOTH halves by Master
# Conjuror's marker 12, which node 20735 mints at 15/30%.
- id: 948430               # Master Firestone equip — +30 fire spell dmg, 116-174 melee fire proc
  name: Firestone
