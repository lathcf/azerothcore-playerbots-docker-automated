# WotLK shape for any warlock who learned 19028 — so the era build must own both halves.
# WHY THE SPLIT IS PET-CAST: Unit.cpp's SPLIT_DAMAGE_PCT loop finds split auras ON THE VICTIM and
# routes the redirected damage to each aura's CASTER, skipping caster==victim. A warlock self-cast
# split redirects nothing; the demon must be the caster. SPELL_EFFECT_APPLY_AREA_AURA_OWNER (143)
