# --- Improved Drain Soul payloads (node 20703) ----------------------------------------------------
# Both halves of the TBC talent are delivered by `era_improved_drain_soul` (EraTalentProcScripts.cpp),
# which the node's `mechanic: proc-scripted` binds to its own hidden DUMMY passive per rank.
# WHY THE MANA HALF CANNOT BE DATA: TBC's e3 (SPELL_EFFECT_DUMMY 7/15) is byte-identical to live, but
# the core reaches it from `spell_warl_drain_soul` (spell_warlock.cpp:1225) via
# `caster->GetAuraOfRankedSpell(SPELL_WARLOCK_IMPROVED_DRAIN_SOUL_R1 = 18213)` — BY STOCK ID. An era
# warlock holds neither 18213 nor 18372, so the stock path can never see an authored passive and the
# mana return silently never happens (lesson 23's inverse: the payload is reached by id).
# WHY THE THREAT HALF RIDES A HELPER: the generator emits exactly ONE effect for a proc-scripted node
# (the DUMMY the script hooks at EFFECT_0), so the -5/-10% Affliction threat spellmod cannot share
# that passive. It is applied/stripped by the script's OnApply/OnRemove instead — the same always-on
# shape the shipped Vanilla helper 932917 uses, with the per-rank amount supplied per cast.
# 948457 = the on-kill reward. Cloned from stock 18371 (the core's own Improved Drain Soul energize:
# Effect_1 = 30 SPELL_EFFECT_ENERGIZE, EffectMiscValue 0 = POWER_MANA, base points supplied per cast)
# so it inherits the visual and shadow school. No `spellFixAck:` needed — a whole-file grep of
# SpellInfoCorrections.cpp finds no ApplySpellFix for 18371.
- id: 948457
  name: Improved Drain Soul
  template: 18371          # stock Improved Drain Soul energize — inherits the visual/school/attrs
  effects:
  - effect: 30             # SPELL_EFFECT_ENERGIZE
    basePoints: 0          # supplied per cast (CastCustomSpell SPELLVALUE_BASE_POINT0 = pct of max mana)
    misc: 0                # POWER_MANA
    targetA: 1             # TARGET_UNIT_CASTER
  client:
    name: Improved Drain Soul
    icon: 113              # stock 18371's SpellIconID — without a client row the combat-log line
                           # for the mana gain cannot render (the hidden-payload gotcha, VE 932951)
# 948458 = the always-on threat half. A PASSIVE+hidden ADD_PCT_MODIFIER on SPELLMOD_THREAT (op 2)
# over the TBC Affliction spell set — wago 18213/18372 e2 mask (0x8048c41a, 0xf1b, 0), authored
# verbatim. The amount is 0 in the row and is supplied per cast by the script (-5 at rank 1, -10 at
# rank 2) so ONE helper serves both ranks; a 0-amount spellmod is a no-op if it is ever applied bare.
- id: 948458
  name: Improved Drain Soul
  attributes: 262608       # PASSIVE + hidden — self-applied, invisible (same mask as 932917)
  family: 5                # REQUIRED: SpellInfo::IsAffected returns true for EVERY spell when
                           # familyName is 0, so a family-0 masked spellmod would cut all threat
  effects:
  - effect: 6              # APPLY_AURA
    aura: 108              # SPELL_AURA_ADD_PCT_MODIFIER
    basePoints: 0          # supplied per cast by era_improved_drain_soul (-5 / -10)
    misc: 2                # SPELLMOD_THREAT
    targetA: 1             # TARGET_UNIT_CASTER
    maskA: 2152252442      # word0 0x8048C41A — the TBC Affliction set
    maskB: 3867            # word1 0x00000F1B
    maskC: 0
# --- Shadow Embrace debuffs r1-r5 (node 20712) ---------------------------------------------------
# RECONSTRUCT. TBC 32386-32391 are `aura 79 MOD_DAMAGE_PERCENT_DONE -1..-5% misc 1 (Physical)` on the
# TARGET; WotLK REPURPOSED those same ids into aura 271 (+shadow DoT damage taken, 3 stacks), so the
# stock ids cannot be triggered — they would deliver the opposite effect. Fresh band rows instead.
# DURATION (the row's OPEN question, decided here): TBC's own DurationIndex is 21 = PERMANENT because
# the TBC client script `aura 112 OVERRIDE_CLASS_SCRIPTS misc 4994` managed the debuff's lifetime, and
# 3.3.5a implements NO class script 4994 — a permanent debuff would therefore never come off. The
# debuff is chosen to match the DoT window instead: **DurationIndex 29 = 12 s**, which is also what
# live 32386 carries, and it is refreshed by the next Corruption/CoA/Siphon Life/SoC application
# (the proc is chance 100).
# The word0 bit-31 identity is wago's own (`ownMask (0x80000000,0,0)`, the shared Dark Pact / Curse
# of Tongues / Shadow Embrace category bit) and is kept deliberately: the core's hardcoded Soul
# Siphon affliction count (Unit.cpp:8568, `SpellFamilyFlags[0] & 0x8044C402`) tests that bit, so in
# TBC a Shadow Embrace debuff really did count toward Soul Siphon's cap.
# `attributesEx3: 65536` = SPELL_ATTR3_SUPPRESS_CASTER_PROCS (wago attr3=0x10000) so applying the
# debuff cannot itself feed the warlock's procs. wago's `auraInterruptFlags 0x80000` has no generator
# key and is NOT reproduced (recorded, not actioned — the same class as hunter's Attr6 note).
