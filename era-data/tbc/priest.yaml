    # TAKEN_SPELL_RANGED_DMG_CLASS = "struck by a melee or ranged" hit) and `hitMask: 2` narrows it
    # to CRITICAL — together, the tooltip's "struck by a melee or ranged critical hit". `typeMask`
    # is left at the generator default 1 (SPELL_TYPE_MASK_DAMAGE), matching the live row.
    # `chance` is TBC's own ProcChance 100 on all three ranks (the rank ladder lives in `vals`).
