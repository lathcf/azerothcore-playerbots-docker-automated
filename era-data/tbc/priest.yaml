# --- Vampiric Embrace TRIO: 948031 castable / 948032 hidden proc-passive / 948033 heal ----------
# USER-LOCKED FRESH (spec section 4b, `_ref` node_findings[20555] + reuse_ledger 921152/932950/
# 932951). The three ids are FIXED by the Phase-6 plan and were hard-coded into EraTalents.cpp
# (reconcile arm 4), EraTalentsCommand.cpp (doctor) and EraTalentProcScripts.cpp
# (`era_vampiric_embrace::kVeIds`) by Task 5 BEFORE this task allocated them — they are the one
# out-of-order block in the 948024+ ledger, which is why Task 6 skipped them.
#
# THE MECHANISM (framework "Debuff-anchored heal pattern"), identical in shape to the shipped
# Vanilla trio 921152/932950/932951 and DIFFERENT in every magnitude:
#   948031  the CASTABLE — cast on an ENEMY (ImplicitTargetA 6), applies a visible DUMMY debuff.
#   948032  a hidden PERMANENT proc-passive on the priest, granted/stripped by
#           ReconcileBaselineSpells against node 20555's rank. `era_vampiric_embrace` is bound to
#           it and, on the priest's Shadow damage to a mob carrying THIS priest's 948031 debuff,
#           heals the party for the passive's own DUMMY amount + Improved VE's misc-4 marker.
#   948033  the heal delivery the script casts per party member with SPELLVALUE_BASE_POINT0.
# WHY THREE SPELLS AND NOT ONE: `spell_dbc`/the client `Spell.dbc` are GLOBAL, so stock 15286
# cannot be edited for one era (framework "Custom castable spells"); and the proc must live on a
# PERMANENT passive, because a temp buff silently expires mid-session (memory
# `era-passive-cloned-from-active-inherits-duration`).
#
# TBC vs VANILLA, both raw (workflow lesson 16) — the reuse ledger's FIVE disagreements:
#   heal %      TBC 15 (raw 14/ds1)          VANILLA 20        (1.12.1's number, retuned down in 2.0)
#   mana        TBC ManaCostPct 2, flat 0    VANILLA flat 40
#   ProcTypeMask TBC 0x80050000              VANILLA 0x50000   (bit 31 is undefined in 3.3.5a)
#   DispelType  TBC 1 (Magic)                VANILLA 0
#   attr3       TBC 0x04000000 CAN_PROC_FROM_PROCS  VANILLA 0
# TBC vs LIVE (the era divergence that forces the clone at all): live 15286 is a SELF-buff
# (ImplicitTargetA 1, DurationIndex 30 = 30 min, RangeIndex 1, no dispel/mana/cooldown) that heals
# only the priest; TBC's is a 1-minute enemy debuff at 30 yd on a 10 s cooldown that heals the party.
#
# THE NAME IS LOAD-BEARING ON 948031: patch 0021's `EraTalentBots_ResolveSpellId(bot, 15286)`
# resolves BY NAME, and the bot AI's enemy/self branch in PriestActions.h/PriestTriggers.h keys on
# getting the era castable back — "Vampiric Embrace" exactly, no rank suffix.
# SCRIPT CENSUS (`_ref` script_census): stock 15286 carries TWO `spell_script_names` rows,
# `spell_pri_vampiric_embrace` (the core's self-heal proc handler) and IP's `isAllowedToCastSpell`.
# NEITHER is rebound: the core handler is REPLACED by this module's `era_vampiric_embrace` on
# 948032, and IP's gate is encounter-scoped to Naxx40 10HC, which a TBC-era character cannot enter.
- id: 948031
  name: Vampiric Embrace     # EXACT — patch 0021 resolves the bot AI's stock 15286 by this string
  template: 15286            # clone stock VE -> inherits its shadow cast visual, instant cast,
                             # SchoolMask 32, DefenseType 1, PreventionType 1, gcd 133/1500 and
                             # attr3 CAN_PROC_FROM_PROCS (identical on both sides)
  powerCost: 0               # TBC has NO flat ManaCost — the whole cost is the percent below
  manaCostPct: 2             # TBC's own; live 15286 is free (0/0)
  rangeIndex: 4              # 30 yd (live 1 = self-only)
  cooldown: 10000            # 10 s (live has none)
  durationIndex: 3           # 60 s debuff on the mob (live 30 = a 30-minute self-buff)
  dispelType: 1              # Magic — TBC's own; live 15286 is undispellable
  family: 6
  mask: 4                    # family-6 word0 bit2 = `_ref` spells["Vampiric Embrace"].flagsA, so
                             # Improved VE / Silent Resolve style spellmods still bind
  effects:
  - { effect: 6, aura: 4, basePoints: 14, dieSides: 1, targetA: 6 }   # DUMMY 15% anchor on the ENEMY
  client:
    name: Vampiric Embrace
    icon: 150                # stock 15286 SpellIconID
    skillLine: 78            # Shadow — else the granted active lands in the client General tab
    description: Afflicts your target with Shadow energy that causes all party members to be healed for 15% of any Shadow spell damage you deal for 1 min.
    auraDescription: Party members are healed for 15% of any Shadow spell damage the priest deals.
- id: 948032
  name: Vampiric Embrace     # hidden PERMANENT proc-passive — NO `client:` block, so it ships no
  template: 15286            # client row and is invisible in the spellbook and on the buff bar
  attributes: 262608         # PASSIVE|HIDDEN — reconcile-managed (EraTalents.cpp arm 4) vs node 20555
  durationIndex: 0           # PERMANENT. Template 15286 is an ACTIVE self-buff (DurationIndex 30 =
                             # 30 min) and a passive clone INHERITS that unless overridden — the
                             # exact defect that silently killed all Vanilla VE healing 30 minutes
                             # into a session (memory era-passive-cloned-from-active-inherits-duration).
                             # 0 = no SpellDuration entry -> Aura::CalcMaxDuration grants infinite
                             # duration for a PASSIVE aura.
  effects:
  - { effect: 6, aura: 4, basePoints: 15, targetA: 1 }   # DUMMY 15 — the amount era_vampiric_embrace
                                                          # reads via aurEff->GetAmount() (EFFECT_0)
  # EXPECTED, NOT A BUG — `.eratalents doctor` prints `AI resolve: 15286 (Vampiric Embrace) -> 948032`
  # on a TBC priest that has spent node 20555, i.e. it names THIS hidden passive rather than the
  # castable 948031. `EraTalentBots_ResolveSpellId` keeps the HIGHEST matching band id ("ids ascend
  # with rank in the era chains"), and both trio members carry the identical name by design, so 948032
  # wins. It is harmless because the resolved id is used ONLY as a boolean discriminator: patch 0021's
  # `CastVampiricEmbraceAction::GetTargetName` asks `(known && known != 15286) ? "current target" :
  # "self target"`, which is right for either id. The id the bot actually CASTS comes from
  # `SpellIdValue::Calculate`, whose `if (!spellInfo || spellInfo->IsPassive()) continue;`
  # (SpellIdValue.cpp:55) skips this passive and lands on 948031. The shipped, real-client-verified
  # VANILLA trio has exactly the same shape (932950 outranks the castable 921152).
  proc:
    flags: 327680            # 0x50000 = DONE_SPELL_MAGIC_DMG_CLASS_NEG (0x10000, Mind Blast /
                             # SW:Death / Mana Burn) | DONE_PERIODIC (0x40000, SW:Pain / Devouring
                             # Plague / the era Mind Flay + Vampiric Touch clones, which are REAL
                             # periodic auras). Deliberately NOT TBC's own 0x80050000: bit 31 is
                             # undefined in 3.3.5a's ProcFlags enum (the highest defined bit is 24,
                             # PROC_FLAG_DEATH), so the low 0x50000 is the whole of TBC's contract
                             # that this core can express — and it is byte-identical to the shipped,
                             # real-client-verified Vanilla proc row.
    school: 32               # SPELL_SCHOOL_MASK_SHADOW — "any Shadow spell damage you deal"
    family: 6                # PRIEST; with school 32 this is exactly the priest's shadow damage
    attrMask: 2              # PROC_ATTR_TRIGGERED_CAN_PROC. Redundant on paper for the era tree
                             # (the Mind Flay clone deals damage DIRECTLY via aura 3, so `_ref`
                             # capstone_chains.mind_flay.additional_finding's "do not blanket-apply
                             # attrMask 2" applies) but kept: it costs nothing, matches the Vanilla
                             # row, and still covers any triggered shadow damage a TBC priest can
                             # produce (e.g. a trinket/proc chain).
    chance: 100
    hitMask: 0               # core default (normal+crit). NEVER 8 (= FULL_RESIST only) — the live
                             # Vanilla defect the framework's field table calls out.
- id: 948033
  name: Vampiric Embrace Heal   # the delivery spell; the script casts it once per party member with
  template: 15290               # SPELLVALUE_BASE_POINT0 = the computed heal
  effects:
  - { effect: 10, basePoints: 0, targetA: 21 }   # SPELL_EFFECT_HEAL on TARGET_UNIT_TARGET_ALLY.
                                                 # targetA 1 (CASTER) would redirect EVERY heal onto
                                                 # the priest — the Vanilla trio's original bug.
                                                 # EffectRadiusIndex is INHERITED (12) because the
                                                 # generator writes `radius` only when authored.
  client:                        # no skillLine -> no spellbook row. Without a client row the heal is
    name: Vampiric Embrace       # INVISIBLE in the combat log (framework "Client visibility"); named
    icon: 150                    # like stock 15290 so log lines read "Vampiric Embrace".
    # `description:` IS AUTHORED even for a payload that is never in a spellbook: a templated helper
    # with no `client.description` INHERITS the template's, and the generator hard-errors only on a
    # leaked AuraDescription, never on a leaked Description. Stock 15290's is WotLK's self-heal prose
    # carrying a `$15286s1%` token that resolves against the STOCK spell's 15% — wrong on both counts.
    description: Heals a party member for a share of the Shadow spell damage the priest deals.
# --- Vampiric Touch r1-r3 (948060-948062) + energize payload 948063 -------------------------------
# THE SHADOW CAPSTONE (node 20563; spec section 4c, `_ref` capstone_chains.vampiric_touch,
# node_findings[20563]). DIVERGED on families A, B, C, E and J. TBC returns 5% of the Shadow damage
# the priest deals TO THE VT TARGET as mana to the party; WotLK rebuilt the spell around
# Replenishment (e1 DUMMY 2 + a `-34914` proc row keyed to MIND BLAST) and added a dispel backlash.
# The per-rank damage is IDENTICAL between the eras (90/120/130 per 3 s tick over 15 s); what moves is
#   A  e1 DUMMY 5 -> 2, and live adds a THIRD effect (aura 4 DUMMY -1, the Replenishment carrier)
#      which the clone DROPS — a templated helper that authors `effects:` 0-fills the slots it omits.
#   B  ProcTypeMask 0x80050000 -> 0x20000 (see the proc block below; the `spell_proc` row is what
#      actually governs, lesson 18)
#   C  live adds SPELL_ATTR6_TAPS_IMMEDIATELY (0x800000) which TBC does not carry
#   E  FLAT 325/400/425 mana -> ManaCostPct 18/18/16 — `manaCostPct: 0` is LOAD-BEARING on all three
#   J  r3 MaxLevel TBC 79 -> live 74 (the WotLK rank-window re-cut)
# INHERITED-ATTRIBUTE GAP, measured not assumed: the generator has no `attributesEx6` key, so the
# clones ride live's ATTR6 0x800000. `grep -rn SPELL_ATTR6_TAPS_IMMEDIATELY azerothcore-wotlk/src/`
# returns ONLY `enuminfo_SharedDefines.cpp` (the reflection tables) — no reader anywhere in the core,
# so it is inert. Same measurement as the Discipline tab's ATTR6/ATTR7 note.
# SCRIPT CENSUS: `spell_script_names` binds `spell_pri_vampiric_touch` to `-34914` (the WotLK dispel
# backlash, casting 64085). It is DELIBERATELY NOT REBOUND — the absence of the backlash IS the TBC
# behaviour (spec section 4c, `_ref` script_census). What IS bound, per rank, is this module's
# `era_pri_vampiric_touch_tbc` (see `scriptBindings:`).
# THE PROC BLOCK IS THE WHOLE MECHANISM AND IS TAKEN-SIDE, WHICH IS UNUSUAL — read this before
# changing it. The aura lives on the VT TARGET, and the event we want is "the CASTER dealt Shadow
# damage to this target", so the row's ProcFlags are the TAKEN pair, not the DONE pair:
#   0x20000 PROC_FLAG_TAKEN_SPELL_MAGIC_DMG_CLASS_NEG  (Mind Blast / SW:Death direct hits)
#   0x80000 PROC_FLAG_TAKEN_PERIODIC                   (SW:Pain / Devouring Plague / Mind Flay /
#                                                       VT's own ticks — all real periodic auras here)
#   = 655360. Values transcribed from azerothcore-wotlk/src/server/game/Spells/SpellMgr.h `enum ProcFlags`.
# The delivery path is code-verified end to end: `Unit::ProcSkillsAndAuras(caster, target, procAttacker,
# procVictim, ...)` -> `TriggerAurasProcOnEvent`, whose TARGET-side `ProcEventInfo(this, actionTarget,
# this, typeMaskActionTarget, ...)` sets GetActor() = the DAMAGE DEALER (Unit.cpp:12946), so the
# script's `eventInfo.GetActor() == GetCaster()` check is what keeps one priest's VT from feeding off
# another priest's damage. `AuraEffect::HandleProc` calls `CallScriptEffectProcHandlers` BEFORE its
# aura-type switch (SpellAuraEffects.cpp:1287), so an `OnEffectProc` hook fires for ANY aura type.
# NOTE the generator silently zeroes SpellPhaseMask for a TAKEN-only ProcFlags (the core ignores it —
# `CanSpellTriggerProcOnEvent` only tests the phase for REQ_SPELL_PHASE_PROC_FLAG_MASK events), which
# is why no `phaseMask` is authored here; authoring a non-zero one is a generator hard error.
- id: 948060
