    # entirely from the live `-33191` `spell_proc` row, measured on this server 2026-09-05 as
    # "Family 6, Mask0 32768 (SW:Pain), Mask1 1024 (Vampiric Touch), Mask2 64 (Mind Flay word2 bit6),
    # ProcFlags 0, TypeMask 0, PhaseMask 2, HitMask 0" — and a CLONE inherits no `spell_proc` row at all.
    # SHIPPED AS AURA 109, per A.7's preferred shape and the Shadow Weaving precedent one tier up:
    # `SPELL_AURA_ADD_TARGET_TRIGGER` is victim-targeted natively (`Spell::DoTriggersOnSpellHit` casts
    # the trigger on the spell's own target), so it needs NEITHER a `spell_proc` row NOR a rebind of
    # the core's `spell_gen_proc_on_victim` — the generic script bound to `-33191` whose only job is to
    # move an aura-42 proc onto the victim. The mask below is the `-33191` row's contract transcribed
    # onto the ERA clones' identities: SW:Pain word0 0x8000 (unchanged — it is baseline), the Vampiric
    # Touch clones' word1 0x400 (948060-948062 author `maskB: 1024` for exactly this), and the Mind
    # Flay clones' word2 0x40. `chance: 100` is TBC's own ProcChance on all five ranks; the rank
    # ladder lives in the debuffs' magnitudes, not in the chance.
    # TBC's SECOND effect (aura 112 OVERRIDE_CLASS_SCRIPTS, EffectMiscValue 5066) is OMITTED — see the
    # `helpers:` banner above 948073 and `_ref` core_hardcodes.class_script_5066 / accepted_gaps id 7.
    # HOLY FIRE IS DROPPED ON PURPOSE: TBC's DBC mask carries word0 bit20 (Holy Fire) but the `-33191`
    # proc row — the operative contract, and the only source that matches the tooltip — does not, and
    # neither does the tooltip. Following the row is what A.7 directs.
    mechanic: multi
    effects:
    - type: stat
      aura: 109               # SPELL_AURA_ADD_TARGET_TRIGGER — victim-targeted, no proc row needed
      vals: [100, 100, 100, 100, 100]   # TBC ProcChance 100 on every rank
      trigger: [948073, 948074, 948075, 948076, 948077]   # one debuff per rank
      affects:
      - 'Shadow Word: Pain'
      - Vampiric Touch
      - Mind Flay
      affectsMask: { a: 32768, b: 1024, c: 64 }   # the live `-33191` proc row's mask, re-pointed
