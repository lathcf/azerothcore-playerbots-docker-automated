# --- Misery debuffs r1-r5 (948073-948077; node 20562 aura-109 triggers them) ----------------------
# FIVE FRESH DEBUFFS (spec Amendment A.7, `_ref` node_findings[20562] + triggers 33196-33200).
# TBC 33196-33198 exist live but are REPURPOSED (aura 186 MOD_ATTACKER_SPELL_HIT_CHANCE misc 127 —
# WotLK's "+hit" Misery) and 33199/33200 are absent entirely, so all five are authored at TBC's own
# aura 87 MOD_DAMAGE_PERCENT_TAKEN, EffectMiscValue 126 (every magic school), +1/+2/+3/+4/+5%.
# ALL FIVE TEMPLATE OFF 33196 — including r4/r5, which have no live id of their own. That is
# deliberate: the plumbing a from-scratch helper cannot express is AuraInterruptFlags 0x80000
# (AURA_INTERRUPT_FLAG_CHANGE_MAP — the debuff drops when the target changes map), which has no
# generator key, and templating every rank off the same row keeps all five byte-identical apart from
# the amount. DurationIndex 106 = 24 s, verified by reading the other spells that carry index 106 in
# the base Spell.dbc (Curse of Agony, Devouring Plague) rather than from memory.
# THE TWO AUTHORED NON-EFFECT OVERRIDES are TBC's own values: `rangeIndex: 1` (live re-cut to 6) and
# `attributesEx2: 0` / `attributesEx3: 65536` (live adds SPELL_ATTR2_IGNORE_LINE_OF_SIGHT and a second
# ATTR3 bit; TBC carries only 0x10000).
# NOT STACKING ACROSS PRIESTS: hand SQL `2026_09_05_04_..._shadow_chains.sql` section (c) roots all
# five in ONE `spell_ranks` chain at 948073, so `Aura::CanStackWith` -> `SpellInfo::IsRankOf` treats
# two priests' different Misery ranks as one spell and refuses to stack them (the TBC druid Improved
# Faerie Fire 946277-946279 precedent, `2026_08_31_05_..._iff_ranks.sql`).
# TBC's own SECOND effect (aura 112 OVERRIDE_CLASS_SCRIPTS, EffectMiscValue 5066) is OMITTED, not
# lost: `_ref` core_hardcodes.class_script_5066 measured that this core has NO handler for it
# (`grep` for `case 5066` returns nothing) and that wago carries no per-rank magnitude for it
# (r1 raw 99, r2-r5 raw 0), while the TBC tooltip promises only the +N% spell damage. Recorded as
# `_ref` accepted_gaps id 7 — deliberately NOT a data-shipped no-op (the Mangle-DUMMY lesson).
# NO `skillLine:` — these land on the priest's TARGET and are never spellbook entries.
- id: 948073
  name: Misery
  template: 33196                # r1
  rangeIndex: 1                  # TBC (live 6)
  attributesEx2: 0               # drop live-only SPELL_ATTR2_IGNORE_LINE_OF_SIGHT (0x4)
  attributesEx3: 65536           # 0x10000 — TBC's own (live carries 0x30000)
  effects:
  - { effect: 6, aura: 87, basePoints: 0, dieSides: 1, misc: 126, targetA: 6 }   # +1% magic damage taken
  client:
    name: Misery
    icon: 2211                   # stock 33196 SpellIconID
    rank: 1
    # `description:` IS AUTHORED on all five: a templated helper with no `client.description`
