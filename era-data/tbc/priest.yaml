# --- Circle of Healing r1-r5 (948046-948050; node 20542 grants r1) -------------------------------
# THE HOLY CAPSTONE CLONE CHAIN (spec section 4d, `_ref` capstone_chains.circle_of_healing,
# node_findings[20542]). DIVERGED on five families, and every one of them is authored here:
#   A  targeting + heal value: TBC ImplicitTargetA 21 / B 37 and raw 245/287/326/369/408 with
#      DieSides 25/31/35/39/43; LIVE A 63 / B 31 (raid-smart) and raw 342/402/457/517/571.
#   C  live adds SPELL_ATTR5_NOT_ON_TRIVIAL (0x400000) on r1/r3/r4/r5 (TBC 0 on all five).
#   D  Category: TBC 0, LIVE 1204.
#   E  mana: TBC FLAT 300/337/375/412/450, LIVE ManaCostPct 24/24/24/24/21.
#   G  cooldown: TBC none, LIVE CategoryRecoveryTime 6000 (the 6 s WotLK added).
#
# TARGET PAIR — TBC'S OWN 21 + 37 IS AUTHORED, AND IT IS LIVE ON THIS CORE (verified, not assumed).
# `SpellInfo.cpp:251` gives target 37 TARGET_UNIT_LASTTARGET_AREA_PARTY as
# {UNIT, REFERENCE_TYPE_LAST, SELECT_CATEGORY_AREA, CHECK_PARTY}: an AREA select around the
# PREVIOUS effect target (the ally picked by TargetA 21 TARGET_UNIT_TARGET_ALLY), party-checked.
# That is exactly "the friendly target and that target's party", and it is the pair stock Prayer of
# Healing 596/996/10960/10961/25308/25316 uses, so it is proven on this build. Live's 63 + 31
# (TARGET_DEST_TARGET_ANY + TARGET_UNIT_DEST_AREA_ALLY) is the WotLK raid-smart rework and is NOT
# used here.
# `radius: 18` IS AUTHORED AND IS A DELIBERATE DEPARTURE FROM TBC'S LITERAL ROW (workflow lesson 3,
# the same call the Prayer of Spirit clones above make). TBC's own record carries EffectRadiusIndex
# 0, but on this core an AREA target resolves its radius through `SpellEffectInfo::CalcRadius`,
# which returns 0.0f with no SpellRadius entry — a literal copy would heal a party at range ZERO.
# Index 18 = 15.0 yards, read out of the live SpellRadius.dbc (row 18 = 15.0), which is both the
# radius live CoH itself uses and the "within 15 yards of the target" the cached TBC tooltip
# promises. `$a1` in the description resolves against this row, so the tooltip stays honest.
#
# THE CORE SCRIPT `spell_pri_circle_of_healing` IS DELIBERATELY **NOT** REBOUND. Three measured
# reasons, in order of decisiveness:
#   1. IT WOULD LOG A BOOT ERROR AND DO NOTHING. `spell_priest.cpp:197` registers its only hook as
#      `OnObjectAreaTargetSelect += SpellObjectAreaTargetSelectFn(..., EFFECT_0,
#      TARGET_UNIT_DEST_AREA_ALLY)` — target type 31. `SpellScript::TargetHook::CheckEffect`
#      (SpellScript.cpp:242) returns false unless the bound spell's effect actually carries that
#      target type, and `SpellScript::_Validate` (SpellScript.cpp:334-336) then LOG_ERRORs
#      "Spell `948046` Effect ... did not match dbc effect data — handler ... won't be executed"
#      once per rank per boot and drops the handler. Our clones carry target 37, not 31.
#   2. ITS ONLY JOB IS ALREADY DONE BY THE TARGET TYPE. The script's body is
#      `targets.remove_if(RaidCheck)` + sort-by-health + `targets.resize(5 or 6)` — a cap WotLK
#      needs because 63/31 selects the whole raid around the target. TBC's 37 is `TARGET_CHECK_PARTY`
#      off the target, so the selection is structurally the target's party and can never exceed it.
#   3. Its Glyph of Circle of Healing branch (the 5->6 widening) is inert for an era priest anyway,
#      because `EraGlyphGate` blocks glyphs for every non-DK TBC-band character.
#   This is a DEVIATION from the Task-7 dispatch, which assumed the live target pair and asked for a
#   per-rank rebind; the rebind is not merely unnecessary but actively harmful under TBC targeting.
#
# `attributesEx5: 0` drops live's SPELL_ATTR5_NOT_ON_TRIVIAL. MEASURED INERT rather than assumed:
# `grep -rn SPELL_ATTR5_NOT_ON_TRIVIAL azerothcore-wotlk/src/server/` returns ONLY the enum
# declaration in shared/SharedDefines.h:577 — no reader anywhere in the core. It is authored because
# TBC's record does not carry it and the key is free, not because it changes behaviour.
# `manaCostPct: 0` is LOAD-BEARING on all five (live converts the whole chain to a percent cost; the
# core charges the flat ManaCost PLUS the percent).
# `category: 0` + `categoryCooldown: 0` neutralise live's Category 1204 / 6000 ms — the Aimed Shot
# 932952-957 idiom: a cd that lives in a CATEGORY is not reachable by `cooldown:` alone.
# `cooldown: 0` is authored explicitly even though live's RecoveryTime is already 0, so the "no
# cooldown in TBC" decision is visible in one place.
# DurationIndex, RangeIndex 5, CastingTimeIndex 1 (instant), attr0 0x10000, attr2 0x80000,
# attr3 0x80 (DOT_STACKING_RULE), PreventionType 1, DefenseType, the gcd category and the per-rank
# SpellLevel/BaseLevel/MaxLevel windows are IDENTICAL between eras and INHERITED — no keys.
# SPELLFIX: none. `_ref` spellfix_inheritance has no block touching 34861-34866.
