# --- Reflective Shield r1-r5 (948034-948038; node 20519 grants one per rank) ----------------------
# FROM SCRATCH, not `template:`d — `_ref` node_findings[20519]: only r1/r2 exist live (at WotLK's
# 22%/45% and carrying EffectMiscValue 5065/5064, WotLK's class-script ids), r3-r5 are WAGO_ONLY.
# Cloning 33201/33202 for two of five ranks and minting three would produce a chain whose halves
# disagree on EffectMiscValue, so all five are minted at TBC's own row: aura 4 SPELL_AURA_DUMMY,
# EffectMiscValue 0, basePoints 10/20/30/40/50, Attributes 0x1d0 (= IS_ABILITY | PASSIVE |
# DO_NOT_DISPLAY | DO_NOT_LOG, byte-identical to live 33201), SchoolMask 1, family 6 with a ZERO
# own-mask (TBC `ownMask=(0x0,0x0,0x0)` — the passive is never a spellmod target).
# THE DUMMY IS READ BY A MODULE SCRIPT, NOT BY THE CORE. `spell_pri_power_word_shield_aura::
# ReflectDamage` (spell_priest.cpp:690) finds the talent via
# `GetAuraEffectOfRankedSpell(33201, EFFECT_0)`, a `spell_ranks` walk from STOCK rank 1 — and
# `acore_world.spell_ranks` has NO ROW for 33201-33205 on this server, so that walk inspects
# exactly the id 33201 and an era priest (who never owns it) gets nothing. The module's
# `era_pri_reflective_shield_tbc` AuraScript is bound ALONGSIDE the core script on the same twelve
# stock PW:Shield ranks (see `scriptBindings:`) and does the same reflect off these clones.
# ZERO CORE PATCH (`_ref` core_hardcodes.reflective_shield).
# `client:` block WITHOUT `skillLine:` — these are hidden passives (DO_NOT_DISPLAY), so they must
# never get a spellbook row, but the TALENT PANEL hyperlinks a grant node's granted spell
# (framework "Talent-panel tooltip for spell-granting nodes"), so a missing client row would leave
# the panel tooltip blank. `auraDescription` is deliberately absent: the helper is not templated, so
# there is no stock text to leak, and live 33201's own AuraDescription is empty too.
