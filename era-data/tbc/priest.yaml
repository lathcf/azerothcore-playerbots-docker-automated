# --- Prayer of Spirit r1-r2 (948029-948030) ------------------------------------------------------
# TARGETING IS THE ERA DIFFERENCE AND IS AUTHORED: TBC is `ImplicitTargetA 21`
# (TARGET_UNIT_TARGET_ALLY) + `ImplicitTargetB 37` (TARGET_UNIT_LASTTARGET_AREA_PARTY) = "the
# TARGET's PARTY"; live re-encoded it to `ImplicitTargetA 56` (TARGET_UNIT_CASTER_AREA_RAID) = the
# caster's whole RAID. Enum values read from azerothcore-wotlk/src/server/shared/SharedDefines.h:1427+.
# `radius: 12` IS AUTHORED ON ALL THREE EFFECTS AND IS A DELIBERATE DEPARTURE FROM TBC'S LITERAL
# ROW (workflow lesson 3 — "never copy a TBC encoding literally without checking it still works in
# 3.3.5a"). TBC's own record has EffectRadiusIndex 0 on all three effects, but on THIS core an area
# target type resolves its radius through `SpellEffectInfo::CalcRadius`, which returns 0.0f when
# there is no SpellRadius entry — so a literal copy would buff a party at range ZERO, i.e. nobody.
# Every live 3.3.5a spell using the same 21+37 pair carries a real radius (Prayer of Healing
# 596/996/10960/10961/25308/25316/48072 all use index 10; the stock PoS rows use 12), so index 12
# is inherited-from-template on e1 and authored on e2/e3 (the template's own slots 2/3 are empty and
# would otherwise inherit 0). Index 12 = 100 yd, i.e. "the whole party, wherever they are" — the
# PARTY SCOPE, which is what TBC actually restricts, is carried by target 37 and is unaffected.
# `attributesEx2: 524292` = 0x80004 is the SPELLFIX-INHERITANCE value (lesson 14):
# `SpellInfoCorrections.cpp:4556` ORs SPELL_ATTR2_IGNORE_LINE_OF_SIGHT (0x4) onto 27681/32999/48074
# BY ID, and a clone never receives it — without it the raid buff would silently fail to reach
# anyone behind a pillar. The base is live's 0x80000 (SPELL_ATTR2_ALLOW_WHILE_NOT_SHAPESHIFTED, the
# "also allow outside shapeshift" family bit both eras carry); TBC r2 32999's own raw value is
# 0x80100 and the extra 0x100 is deliberately DROPPED — `SPELL_ATTR2_INCLUDE_IN_ADVANCED_COMBAT_LOG` is documented
# in SharedDefines.h:452 as "not set in 3.3.5a" and live drops it on both rows, so authoring it
# would be inventing a bit this core does not read.
- id: 948029
  name: Prayer of Spirit
  template: 27681                # r1 (L60) — trainer-taught, ReqAbility1 = Divine Spirit r1 948024
  family: 6
  mask: 32
  powerCost: 1500                # TBC flat (live 1940)
  manaCostPct: 0
  attributesEx2: 524292          # 0x80004 — see the spellfix note above
  effects:
  - { effect: 6, aura: 29,  basePoints: 39, dieSides: 1, misc: 4,   targetA: 21, targetB: 37, radius: 12 }
  - { effect: 6, aura: 174, basePoints: -1, dieSides: 1, misc: 126, miscB: 4, targetA: 21, targetB: 37, radius: 12 }
  - { effect: 6, aura: 175, basePoints: -1, dieSides: 1, misc: 4,   targetA: 21, targetB: 37, radius: 12 }
  client:
    name: Prayer of Spirit
    icon: 1870                   # stock 27681 SpellIconID
    rank: 1
    skillLine: 613
    description: Holy power infuses the target's party members, increasing their Spirit by 40 for 1 hour.
    auraDescription: Increases Spirit by 40.
