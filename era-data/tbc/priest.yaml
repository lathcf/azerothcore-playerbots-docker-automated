  # =================================================================================================
  # spell_proc / spell_proc_event CENSUS (workflow lesson 18). acore_world.spell_proc has SIXTEEN
  # rows touching this id set; acore_world.spell_proc_event has ZERO. A NEGATIVE id covers the whole
  # rank chain and OVERRIDES the DBC proc contract; a CLONE inherits NOTHING, so every cloned proc
  # talent needs its row written by the generator or it silently never fires.
  # =================================================================================================
  proc_data_census:
    spell_proc_event_rows: 0
    spell_proc_rows: 16
    entries:
      - id: -33191
        name: "Misery (rank chain)"
        row: "SchoolMask 0, Family 6, Mask0 32768 (SW:Pain), Mask1 1024 (Vampiric Touch), Mask2 64 (Mind Flay word2 bit6), ProcFlags 0, TypeMask 0, PhaseMask 2, HitMask 0"
        verdict_impact: >-
          CHANGES THE READING OF THE NODE. Misery's own DBC EffectSpellClassMask is (0x908000, 0, 0)
          — SW:Pain + Holy Fire + the shared bit — which names NEITHER Vampiric Touch NOR live Mind
          Flay. The three spells the tooltip promises are supplied ENTIRELY by this row. A cloned
          Misery with no proc row would proc off SW:Pain (and, if the clone keeps shared bit 23,
          off 126 unrelated spells) and never off VT. Node 20562 MUST get a generator-written
          `spell_proc` row with the era clones' masks.
        disposition: "generator-written proc row required"
      - id: -33150
        name: "Surge of Light (rank chain)"
        row: "Family 0, ProcFlags 0, TypeMask 3 (damage+heal), PhaseMask 2 (HIT), HitMask 2 (CRITICAL), AttributesMask 2, Cooldown 6000"
        verdict_impact: >-
          The DBC ProcTypeMask divergence (TBC 0x14000 vs live 0x54000) on rank 1 is NOT the operative
          contract — this row's TypeMask/HitMask/Cooldown are. Note the 6-second internal cooldown,
          which is a LIVE addition with no TBC counterpart in any column.
        disposition: "clone + generator-written proc row; decide the internal cooldown deliberately (TBC had none in data)"
      - id: -34753
        name: "Holy Concentration (rank chain)"
        row: "Family 6, Mask0 6144 (Flash Heal|Greater Heal), Mask1 4 (Binding Heal), Mask2 4096, PhaseMask 2, HitMask 2 (CRITICAL), AttributesMask 2, Cooldown 1"
        verdict_impact: >-
          The LIVE talent procs on a CRITICAL heal; the TBC DBC says ProcChance 2/4/6 on ProcTypeMask
          0x4000 with no crit requirement. Both the chance AND the trigger condition differ.
        disposition: "clone + generator-written proc row at the TBC contract"
      - id: -34914
        name: "Vampiric Touch (rank chain)"
        row: "Family 6, Mask0 8192 (Mind Blast), TypeMask 1"
        verdict_impact: "The live VT aura procs off MIND BLAST (the WotLK Replenishment design). TBC VT returns mana from ALL the priest's shadow damage dealt to the VT target. The era clone's behaviour comes from the module AuraScript, not from a proc row — but a stale/absent row must not be relied on."
        disposition: "clone; the era script owns the behaviour. Do NOT copy this row's mask."
      - id: -15337
        name: "Improved Spirit Tap (the repurposed Spirit Tap r4/r5 ids)"
        row: "Family 6, Mask0 8396800, Mask1 2, TypeMask 1, PhaseMask 2, HitMask 2, AttributesMask 2"
        verdict_impact: "Belongs to the WotLK talent that reuses those ids. Another reason node 20543's ranks 4/5 must be fresh clones."
        disposition: "do not touch; era clones get their own rows"
      - id: -14892
        name: "Inspiration (rank chain)"
        row: "Family 6, Mask0 268443136 (Circle of Healing|Mind Blast overlap set), Mask1 65540, PhaseMask 2, HitMask 2 (CRITICAL), AttributesMask 2"
        verdict_impact: >-
          The TALENT reads LIVE_MATCH on all fourteen families and its DBC ProcTypeMask is 87376; this
          row is what actually restricts it to critical HEALS. A clone of the talent (needed anyway,
          because the payload buffs diverge) must carry an equivalent row.
        disposition: "clone + generator-written proc row"
      - id: -27811
        name: "Blessed Recovery (rank chain)"
        row: "Family 0, TypeMask 1, HitMask 2 (CRITICAL)"
        disposition: "clone + generator-written proc row (or reuse the module's era_blessed_recovery mechanism — see reuse_ledger)"
      - id: -33142
        name: "Blessed Resilience (rank chain)"
        row: "Family 0, TypeMask 1, HitMask 2 (CRITICAL)"
        disposition: "clone + generator-written proc row"
      - id: -45234
        name: "Focused Will (rank chain)"
        row: "Family 0, TypeMask 1, HitMask 2 (CRITICAL)"
        disposition: "clone + generator-written proc row"
      - id: -14531
        name: "Martyrdom (rank chain)"
        row: "Family 0, TypeMask 1, HitMask 2 (CRITICAL)"
        verdict_impact: "The talent reads LIVE_MATCH; only its payload diverges. If the node is implemented as 'clone the payload, keep the stock talent grant', the stock talent keeps this row for free — that is the cheapest correct shape for node 20505 IF the trigger can be re-pointed."
        disposition: "see node_findings 20505"
      - id: 15286
        name: "Vampiric Embrace (POSITIVE id — this spell only)"
        row: "SchoolMask 32 (Shadow), Family 6, Mask0 41984016, Mask1 9218, Mask2 8, TypeMask 1, PhaseMask 2, AttributesMask 2"
