  method:

    # =============================================================================================
    # READ THESE CONVENTIONS BEFORE USING ANY NUMBER IN THIS FILE.
    # =============================================================================================
    conventions:
      effect_slot_numbering: >-
        THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/Effect_2/Effect_3,
        i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is DBC
        slot 1. Wherever a core-source token appears (core_hardcodes/script_census) it is written
        `EFFECT_n (0-based core enum; = this map's e<n+1>)`. Never translate one to the other by name.
      magnitudes_are_effective: >-
        EVERY magnitude in this file (`val<N>` in a `tbc:` line, and both sides of every `detail:`
        effect tuple) is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides == 1` and
        `basePoints` when DieSides is 0 or > 1 (SpellEffectInfo::CalcBaseValue). Both sides of every
        comparison are normalised the same way before diffing. The `tbc:` lines also print the RAW
        pair as `raw=<basePoints>/ds<DieSides>` so a direct-heal roll range (Circle of Healing
        `raw=245/ds25` = 245..270) is not lost.
      base_points_convention: >-
        Carried over unchanged from the shaman/warrior/rogue refs and RE-VERIFIED on this id set:
        wago 2.5.4 stores EffectBasePoints in the SAME raw (value-1) convention as the 3.3.5a DBC,
        so the comparison normalises BOTH sides. Anchors re-measured here: TBC Improved Divine Spirit
        33174 e1 raw 4 / DieSides 1 = effective 5%, matching the cached TBC tooltip "an amount equal
        to 5% of their total Spirit"; TBC Blackout 15268 procChance 2 matching "a 2% chance to stun";
        TBC Vampiric Embrace 15286 e1 raw 14 / ds 1 = 15%, matching the wowhead TBC tooltip.
      mana_is_flat_or_pct: >-
        Priest mana rides `ManaCost` (flat) and `ManaCostPct` (percent of BASE mana), and the two are
        mutually exclusive per spell. TBC uses FLAT nearly everywhere; 3.3.5a converted the top ranks
        of several chains to PCT. A `E:ManaCost TBC<n>->LIVE0; E:ManaCostPct TBC0->LIVE<m>` pair in a
        detail line is that conversion, and it is a REAL divergence (the flat number is era-correct
        and reproducible on a clone), not a units artefact.
      verdict_vocabulary: >-
        LIVE_MATCH = every compared field in the fourteen verdict families agrees. DIVERGED = at
        least one compared field differs. WAGO_ONLY = present in TBC 2.5.4, ABSENT from the live
        3.3.5a store (Spell.dbc AND the acore_world.spell_dbc overlay) — must be authored, never
        granted. LIVE_ONLY = present live, absent from TBC — must not be reachable by a TBC priest.
        LIVE_MATCH_UNVERIFIED_SLOT = every compared field agrees BUT the live record carries an
        effect slot for which wago has no SpellEffect row. DB2 omits empty effects, so an absent row
        is not *formally* evidence of a zero — but on this id set ALL 15 hits are genuine WotLK
        ADDITIONS and every one of them is adjudicated to DIVERGED (see
        `live_extra_slot_adjudication:`). Two of them (Improved Mind Blast, Shadow Affinity) are
        exactly the core-hardcode hazards spec section 4g predicted.
        A LIVE_MATCH verdict does NOT mean "safe to grant": the supplementary per-effect class-mask
        pass (family O) is excluded from the verdict and found four load-bearing divergences on
        otherwise-LIVE_MATCH spells. Read `effect_class_mask_diffs:` before granting a spellmod.
      tbc_line_is_authoritative: >-
        Every survival_map entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record an author
        needs to reproduce the spell (per-effect tuple incl. effect class masks and implicit targets,
        plus duration/cast/range/school/proc/power/cooldown/category/mechanic/preventionType/
        aura-restriction/shapeshift/level/equip/interrupt/target/family/ownMask and every non-zero
        attribute word). Tasks 5-8 author FROM THIS LINE; they do not need to re-fetch wago. A field
        absent from the line is zero in TBC. LIVE_ONLY entries carry no `tbc:` line by construction.
        Known missing-row cases (a `family=`-less line where the LIVE spell IS family 6): wago 2.5.4
        has no SpellClassOptions row for 14522 Unbreakable Will, 18551-18555 Mental Strength,
        20711 Spirit of Redemption, 14531/14774 Martyrdom, 15270/15335/15336 Spirit Tap and
        45234/45243/45244 Focused Will. Every one is a PASSIVE whose family is irrelevant to
        behaviour EXCEPT 20711 (word2 bit 9, needed only if something ever masks it) — none is a
        hazard, but a clone of any of them should carry the LIVE family-6 identity rather than
        family 0.

    live_dbc:
      source: /azerothcore/env/dist/data/dbc/Spell.dbc inside the running ac-worldserver
      md5: 49c9c5f53e8974c27d67635384725f46
      size_bytes: 53466210
      live_verified: >-
        The worldserver's DBC and the repo's azerothcore-wotlk/ip-dbc/Spell.dbc return the IDENTICAL
        md5 — NO client/server generation mismatch, so the sweep's live side is the store the
        worldserver actually runs. It is also the same md5 the warrior and rogue phases recorded,
        i.e. no DBC generation has shipped since. `docker cp` out of this image fails
        ("read-only file system"); the working extraction is
        `docker exec ac-worldserver cat <path> > out`.
    db_overlay: >-
      The DBC on disk is not the whole live store: acore_world.spell_dbc (7352 rows) REPLACES records
      at load. EXACTLY TWO ids in this map are covered by it and by nothing else — 18350
      ("Dummy Trigger", the spell TBC and live Blessed Recovery 27811/27815/27816 both name as
      EffectTriggerSpell, absent from BOTH the 3.3.5a DBC and wago 2.5.4, i.e. AzerothCore-supplied)
      and 41967 (the Shadowfiend 34433 trigger). Both are recorded as OVERLAY_ONLY in
      `verdict_counts` and are NOT WAGO_ONLY reconstruction candidates.
    tbc_source: >-
      wago 2.5.4.44833 — SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellClassOptions,
      SpellCategories, SpellCooldowns, SpellAuraRestrictions, SpellShapeshift, SpellLevels,
      SpellEquippedItems, SpellInterrupts, SpellTargetRestrictions, SpellName (the fourteen the plan
      lists). Headers were printed and verified before use. Tooltips read from the committed cache
      era-data/_ref/tbc/tooltips/<id>.json (all 194 rank spells); no new fetches were needed.

    corrections_to_the_plan_script:
      live_column_names: >-
        `tools/spell_dbc_columns.txt` spells the spell's OWN identity words `SpellClassMask_1/_2/_3`
        (1-based) — there is NO `SpellClassMaskA` column, so the warrior plan's script literally
        KeyErrors on `cols["SpellClassMaskA"]` as written. wago `SpellClassMask_0` (word 0) maps to
        live `SpellClassMask_1`. Same correction the warrior and rogue files record; re-verified.
      effect_class_mask_column_mapping: >-
        Carried over from the rogue ref (workflow lesson 19) and used as recorded: the live column
        names `EffectSpellClassMaskA_1/A_2/A_3/B_1/.../C_3` are `{effect}_{word}`, NOT
        `{word}_{effect}` — A/B/C is the EFFECT index and _1/_2/_3 is the mask WORD. wago's
        per-effect columns are `EffectSpellClassMask_0/_1/_2` (0-based words) on the row whose
        `EffectIndex` selects the effect. Authorities: tools/gen_era_talents.py:818 writes a clone's
        EFFECT_0 mask as `EffectSpellClassMaskA_1/A_2/A_3`, and tools/era_audit.py:315 names
        "EFFECT_0's SpellClassMask word 1" as `EffectSpellClassMaskA_2`. Independent data anchor on
        THIS id set: TBC Improved Divine Spirit 33174 effect 1 mask (0x20,0,0) and effect 2 mask
        (0x20,0,0) — 0x20 is the Divine Spirit / Prayer of Spirit identity bit, which is only
        coherent under the corrected mapping.
      misc_value_b: >-
        wago `EffectMiscValue_1` is the SECOND misc value (live `EffectMiscValueB_N`), not "misc
        value of effect 1". It is load-bearing on exactly one node here: Divine Spirit's e2
        (aura 174 MOD_SPELL_DAMAGE_OF_STAT_PERCENT, misc 126 = all schools, miscB 4 = STAT_SPIRIT).
        Dropping it would author "spell damage from Strength".
      float_columns: >-
        Speed, EffectRealPointsPerLevel and EffectChainAmplitude are unpacked as FLOATS (int32 bit
        reinterpretation on the live side) and rounded to 4 dp. Load-bearing for the direct-heal
        lines: Circle of Healing r1-5 carry EffectRealPointsPerLevel 1.0/1.2/1.4/1.6/1.8 and Holy
        Nova r1-7 carry 0.2..1.4 — an int32 unpack reports those as 1065353216-style garbage and
        manufactures a divergence on every rank.
      overlay_membership: >-
        The plan's Step 2 compares only Spell.dbc. Membership in acore_world.spell_dbc must be
        checked separately or AzerothCore-supplied ids are mis-verdicted WAGO_ONLY (it would have
        sent Task 6 off to "reconstruct" 18350, the trigger both eras' Blessed Recovery already use).

    noise_filters_applied:
      - "DurationIndex disagreement confined to {0, 21} (both mean permanent) on a passive. ZERO
         entries in this id set were filtered by it."
      - "A live slot with NO wago SpellEffect row is reported as LIVE_MATCH_UNVERIFIED_SLOT plus an
         `unverified:` line, never silently as a match. All 15 hits are adjudicated individually in
         `live_extra_slot_adjudication:` and all 15 resolve to DIVERGED."
      - "A missing wago SpellAuraOptions row opposite the live 'not a proc' default (ProcChance 0 or
         101 / charges 0 / mask 0 / stack 0). Where TBC has no row and LIVE really IS a proc the
         difference IS printed — Lightwell Renew 7001/27873/27874 are the three hits."
      - "NOTHING in the attribute words is filtered. All eight are compared verbatim; every
         difference is hand-adjudicated in `attribute_divergences:` with the AzerothCore bit name."
      - "Per-effect class masks are excluded from the VERDICT only (families_compared.O); all 55
         differences are recorded in full under `effect_class_mask_diffs:`."
      - "SpellClassOptions comparison is SKIPPED when wago has no row for the spell (family F never
         fires a false positive on a missing row); the affected ids are enumerated in
         method.conventions.tbc_line_is_authoritative."

