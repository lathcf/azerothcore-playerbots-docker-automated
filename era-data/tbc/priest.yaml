  live_extra_slot_adjudication:
    method: >-
      Each of the 15 LIVE_MATCH_UNVERIFIED_SLOT ids was dumped from the live DBC and the extra slot
      identified by hand. Every one is a WotLK ADDITION, so every one is adjudicated DIVERGED.
      Two are the exact core-hardcode hazards spec section 4g predicted.
    entries:
      - ids: "15273, 15312, 15313, 15314, 15316 (Improved Mind Blast r1-5)"
        live_extra: "e2 = Effect 3 (SPELL_EFFECT_DUMMY), basePoints 19/39/59/79/99 ds1 = 20/40/60/80/100"
        meaning: >-
          THE MIND TRAUMA CHANCE. SpellEffects.cpp:449-467 scans the caster's ADD_FLAT_MODIFIER auras
          for SpellFamilyName==SPELLFAMILY_PRIEST && SpellIconID==95 and rolls
          `Effects[EFFECT_1].CalcValue()` percent to cast 48301 Mind Trauma when Mind Blast is cast in
          FORM_SHADOW. TBC Improved Mind Blast is COOLDOWN-ONLY.
        disposition: >-
          CLONE r1-5 with e1 only (aura 107 SPELLMOD_COOLDOWN misc 11, -500/-1000/-1500/-2000/-2500 ms,
          mask 0x2000 Mind Blast). The clone may keep SpellIconID 95 — with no EFFECT_1 the branch
          computes chance 0 and never fires. A STOCK GRANT would ship WotLK's Mind Trauma to a TBC
          priest, so node 20549 CANNOT be a grant. Section 4g CONFIRMED.
      - ids: "15318, 15272, 15320 (Shadow Affinity r1-3)"
        live_extra: "e2 = Effect 6 / Aura 4 (SPELL_AURA_DUMMY), basePoints 4/9/14 ds1 = 5/10/15, misc 23, mask (0x8000,0x400,0)"
        meaning: >-
          WotLK's mana-on-dispel half. SpellAuras.cpp:1638-1648: when SW:Pain (word0 0x8000) or
          Vampiric Touch (word1 0x400) is removed by AURA_REMOVE_BY_ENEMY_SPELL, the core looks for
          `GetDummyAuraEffect(SPELLFAMILY_PRIEST, 178, 1)` (icon 178, EFFECT_1 dummy) and casts 64103
          for that percent of base mana. TBC Shadow Affinity is THREAT-ONLY.
        disposition: >-
          CLONE r1-3 with e1 only (aura 108 SPELLMOD_THREAT misc 2, -8/-17/-26%). Keeping icon 178 is
          safe as long as EFFECT_1 carries no dummy. Section 4g CONFIRMED.
      - ids: "45234, 45243, 45244 (Focused Will r1-3)"
        live_extra: "e2 = Effect 6 / Aura 57 (SPELL_AURA_MOD_SPELL_CRIT_CHANCE), basePoints 0/1/2 ds1 = 1/2/3"
        meaning: "WotLK added a flat +1/2/3% spell crit to the talent. TBC's talent is the proc half only."
        disposition: "CLONE r1-3 with e1 only; also clone the three BUFFS 45237/45241/45242, which DIVERGED on the healing-received amount (TBC 4/7/10% vs live 3/4/5%)."
      - ids: "14749, 14767 (Improved Power Word: Fortitude r1-2)"
        live_extra: "e2 = Effect 6 / Aura 137 (MOD_TOTAL_STAT_PERCENTAGE), basePoints 1/3 ds1 = 2/4, misc 2 (STAT_STAMINA)"
        meaning: "WotLK bolted a +2/4% total Stamina bonus onto the talent. TBC is the +15/30% PW:Fortitude spellmod only."
        disposition: "CLONE r1-2 with e1 only (aura 108 SPELLMOD_ALL_EFFECTS misc 8, +15/+30%, mask 0x8). Contradicts the section 3c 'likely grant' assumption for this node's neighbours."
      - ids: "15290 (Vampiric Embrace Heal payload)"
        live_extra: "e2 = Effect 10 (SPELL_EFFECT_HEAL), a second heal slot TBC does not have"
        meaning: "WotLK VE heals the priest and the party through two separate effects; TBC's payload has one."
        disposition: "MOOT — the TBC VE trio is a user-locked FRESH clone set; the era heal-delivery spell is authored from the TBC 15290 line, not granted."
      - ids: "32375 (Mass Dispel, baseline)"
        live_extra: "e3 = Effect 64 (TRIGGER_SPELL) -> 72734"
        meaning: "A WotLK-added third dispel trigger on a BASELINE spell."
        disposition: "none — baseline spell, not era-correctable. Informational; recorded in accepted_gaps."

