scriptBindings:
# NB THE INDENT: this is a TOP-LEVEL dataset key and MUST stay at column 0, a sibling of `helpers:`
# / `tabs:` / `_ref:`. Indented by mistake into the `_ref:` block below, the generator emits ZERO
# `spell_script_names` rows with no error, no audit finding and no log line — every bound spell is
# simply inert. (Carried over from the TBC rogue/shaman datasets' warning.)
#
# --- Reflective Shield (node 20519, spec section 4e) ---------------------------------------------
# `era_pri_reflective_shield_tbc` (modules/mod-era-talents/src/EraTalentProcScripts.cpp) is bound
# ALONGSIDE the core's own `spell_pri_power_word_shield` on the twelve stock Power Word: Shield
# ranks. Two facts make this safe and necessary, both MEASURED rather than assumed:
#   * The core reflect is INERT for an era priest. `spell_pri_power_word_shield_aura::ReflectDamage`
#     (spell_priest.cpp:690-704) resolves the talent through
#     `GetAuraEffectOfRankedSpell(33201, EFFECT_0)`, which walks `GetFirstSpellInChain`/
#     `GetNextSpellInChain` — and `acore_world.spell_ranks` has NO ROW for 33201-33205 on this
#     server, so the walk inspects exactly the id 33201. An era priest holds a 948034-948038 clone
#     and never 33201, so the core branch simply does nothing for them (`_ref`
#     core_hardcodes.reflective_shield).
#   * A SECOND AuraScript on the same spell is fully supported: `ScriptMgr::CreateAuraScripts`
#     (ScriptDefines/SpellScriptLoader.cpp:43) iterates EVERY `spell_script_names` row bound to the
#     id and instantiates each, so both scripts register their `AfterEffectAbsorb(EFFECT_0)` hook
#     and both run. (Same multi-script pattern as the TBC shaman Earth Shield binds.)
# The generator emits an (id, ScriptName)-QUALIFIED DELETE for a STOCK id, so the core's own
# `spell_pri_power_word_shield` rows on these twelve ids survive the migration untouched — the bare
# per-id DELETE is used only for band ids (emit_custom_sql's `_band_deleted` branch).
# POSITIVE PER-RANK BINDS, not one negative `-17` chain bind: a negative spell_id makes
# `ObjectMgr::LoadSpellScriptNames` expand the row through `spell_ranks` at load time, which would
# silently pick up ranks 12/13 (48065/48066) as well. Those two are the WotLK L75/L80 ranks that a
# TBC-era priest can never hold, so they are OMITTED ON PURPOSE — an era priest capped at 70 tops
# out at rank 11 (25218, L70). (Same call as the rogue Mutilate per-rank binds.)
- { spell: 17,    script: era_pri_reflective_shield_tbc }   # PW:Shield rank 1  (L6)
- { spell: 592,   script: era_pri_reflective_shield_tbc }   # rank 2  (L12)
- { spell: 600,   script: era_pri_reflective_shield_tbc }   # rank 3  (L18)
- { spell: 3747,  script: era_pri_reflective_shield_tbc }   # rank 4  (L24)
- { spell: 6065,  script: era_pri_reflective_shield_tbc }   # rank 5  (L30)
- { spell: 6066,  script: era_pri_reflective_shield_tbc }   # rank 6  (L36)
- { spell: 10898, script: era_pri_reflective_shield_tbc }   # rank 7  (L42)
- { spell: 10899, script: era_pri_reflective_shield_tbc }   # rank 8  (L48)
- { spell: 10900, script: era_pri_reflective_shield_tbc }   # rank 9  (L54)
- { spell: 10901, script: era_pri_reflective_shield_tbc }   # rank 10 (L60)
- { spell: 25217, script: era_pri_reflective_shield_tbc }   # rank 11 (L65)
- { spell: 25218, script: era_pri_reflective_shield_tbc }   # rank 12 (L70)
#
# --- Vampiric Touch (node 20563, spec section 4c) ------------------------------------------------
# `era_pri_vampiric_touch_tbc` (modules/mod-era-talents/src/EraTalentProcScripts.cpp) is bound to
# the three era CLONES themselves, not to any stock spell. The aura it runs on sits on the VT
# TARGET and procs on damage TAKEN from its own caster; the script converts 5% of that Shadow
# damage into mana for the caster's party (the era VE heal-delivery shape).
# THREE POSITIVE PER-RANK BINDS, not one negative chain bind: a negative spell_id makes
# `ObjectMgr::LoadSpellScriptNames` expand the row through `spell_ranks` at load, which would work
# here (the clones do form a chain) but would also silently pick up any rank added later; the
# per-rank form is the same call the rogue Mutilate and TBC shaman Earth Shield binds make.
# These are BAND ids, so the generator emits a BARE per-id `DELETE FROM spell_script_names WHERE
# spell_id=<id>` before each insert (workflow lesson 17g) — a rebind converges on a live DB
# instead of leaking the previous script's row.
# NOT REBOUND, deliberately: the core's `spell_pri_vampiric_touch` on `-34914` is the WotLK dispel
# backlash (it casts 64085 when VT is dispelled); its ABSENCE is the TBC behaviour.
- { spell: 948060, script: era_pri_vampiric_touch_tbc }   # Vampiric Touch Rank 1 (L50, node-granted)
- { spell: 948061, script: era_pri_vampiric_touch_tbc }   # Rank 2 (L60, trainer-taught)
- { spell: 948062, script: era_pri_vampiric_touch_tbc }   # Rank 3 (L70, trainer-taught)
#
# --- Vampiric Embrace (node 20555, spec section 4b) ----------------------------------------------
# `era_vampiric_embrace` (modules/mod-era-talents/src/EraTalentProcScripts.cpp) is the SAME script
# both managed eras use; it is table-driven on the id it is running on
# (`kVeIds` = {932950, 921152, 932951} Vanilla / {948032, 948031, 948033} TBC), and its `Validate`
# resolves the heal payload PER BINDING so the live Vanilla binding cannot be dropped by the TBC
# heal being absent. The VANILLA binding on 932950 lives in era-data/vanilla/priest.yaml; this row
# is the TBC half, and WITHOUT IT the whole TBC VE trio is inert — the castable applies its debuff,
# the reconcile-managed proc-passive sits on the priest, and nothing ever heals.
# BOUND TO THE HIDDEN PROC-PASSIVE 948032, not to the castable 948031: the passive is what carries
# the `spell_proc` row and the DUMMY amount the script reads (`aurEff->GetAmount()` on EFFECT_0).
# NOT REBOUND: stock 15286's own `spell_pri_vampiric_embrace` (the core's WotLK self-heal handler)
# and IP's `isAllowedToCastSpell` — see the `helpers:` banner above 948031.
- { spell: 948032, script: era_vampiric_embrace }          # TBC Vampiric Embrace proc-passive
