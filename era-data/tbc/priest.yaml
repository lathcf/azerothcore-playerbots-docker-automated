        grey mobs; the TBC node 20543 authors it, matching both eras' tooltips.
      closes_if: "A Vanilla touch-up commit. Not taken here — changing merged content is a live behaviour change outside a TBC content task, and each item is a small buff/cosmetic rather than a break."
  open_questions:
    mind_flay_clone_identity:
      question: >-
        What SpellClassMask should the era Mind Flay clone chain (r1-r7) carry, and what mask should
        the four talents that affect it carry?
      measured_facts:
        - "TBC 15407's own identity is word0 0x00800000 — the SHARED bit carried by 126 family-6 spells — and word2 0."
        - "LIVE 15407's identity is word2 0x40 (unique to the Mind Flay chain) plus the shared word2 0x400; word0 is 0."
        - "FOUR TBC talents reach Mind Flay ONLY through the shared word0 bit 23: Focused Mind 0x822000, Darkness e2 0x2808000, Shadow Reach 0x680a004, Shadow Weaving 0x288a010. Misery's proc mask 0x908000 also carries it."
        - "Binding bit 23 alone would make each of those spellmods match all 126 bit-23 spells."
        - "The Vanilla ref already flagged this exact spell as needing a special case and settled on flagsC 64 for the LIVE store."
      recommendation: >-
        Author the era Mind Flay clones with the LIVE identity (word2 0x40, plus word2 0x400 if the
        shared category flag matters to the client), and give each affecting talent's mask the TBC
        word0 value MINUS bit 23 PLUS word2 0x40. That keeps every spellmod precise, keeps the Vanilla
        `spells:` table above correct as written, and keeps the core's glyph branch
        (Unit.cpp:8658, `SpellFamilyFlags[0] & 0x800000`) dead — which it already is for stock.
      mechanism: >-
        The generator supports this directly: `affectsMask: {a, b, c}` on a node/effect overrides the
        `affects:`-derived mask verbatim (`tools/gen_era_talents.py:802-816`, added for the paladin
        shared-aura-bit case). So the four talents keep a readable `affects: ["Mind Flay", ...]` for
        the addon/lint and carry an explicit `affectsMask:` for the DBC row. No new generator work.
      decision_owner: orchestrator
      RESOLVED: >-
        **LIVE'S IDENTITY (word2 0x40), taken 2026-09-05 by spec Amendment A.8 and shipped by Task 8 as
        helpers 948064-948070.** The clones carry `mask: 0 / maskB: 0 / maskC: 64` — live's unique Mind
        Flay bit, WITHOUT live's shared word2 bit10 (0x400) and without TBC's own word0 bit23. Verified
        on the live DB after regen: `SELECT SpellClassMask_1, _2, _3 FROM spell_dbc WHERE ID BETWEEN
        948064 AND 948070` returns (0, 0, 64) on all seven.
        Every talent that must reach Mind Flay was then re-checked one by one against A.8's
        grant-or-author rule, and the rule SPLIT them — which is the point of doing it per talent:
          * **Focused Mind 20557 -> GRANT STOCK.** Live's mask (0x22000, 0x100000, 0x40) covers word2
            0x40 and the whole TBC target set (Mind Blast bit13 + Mind Control bit17) and adds only
            Mind Sear (word1 bit20), a WotLK-only spell a TBC priest cannot learn. Both of the `_ref`
            disposition's clauses hold, so this node grants rather than clones — making it the
            SEVENTEENTH stock grant in the class, one more than Amendment A's headline count of 16,
            which was written before this question was settled.
          * **Darkness 20559 -> AUTHOR.** Live's e2 mask (0x2008000, 0x400, 0) has NO word2 word at
            all, so a stock grant would leave the era Mind Flay clone's DoT damage unboosted.
          * **Shadow Reach 20552 -> AUTHOR**, and NOT for the Mind Flay reason: live's mask does cover
            word2 0x40, but it also adds word0 bit17 = **Mind Control**, which IS TBC-reachable, so
            A.8's "adds nothing TBC-reachable" clause fails.
          * **Shadow Focus 20547, Shadow Weaving 20553, Shadow Affinity 20545 -> AUTHOR**, decided by
            their own magnitude/rank divergences before the mask question even arises.
          * **Misery 20562 -> AUTHOR**, mask taken from the live `-33191` proc row (A.7), re-pointed
            onto the era clone identities.
        A SECOND RE-POINT, not anticipated by this question, fell out of the same exercise and is
        recorded here because it has the identical shape: TBC's Shadow Affinity / Shadow Focus /
        Shadow Reach masks all carry word0 **bit26**, which is how TBC reaches TBC's own Silence
        (whose wago ownMask is word0 0x84000000 = bits 26 and 31). The era Silence CLONE 948071 keeps
        LIVE's identity (word1 bit21) per Amendment A.9, so bit26 alone would MISS it. All three
        authored masks therefore add word1 0x200000. Corroboration that bit26 really does cover
        Silence: LIVE's own re-encoding of Shadow Focus and Shadow Reach carries word1 bit21
        explicitly (`effect_class_mask_diffs`), i.e. WotLK moved the same reach into word1.
    lightwell_shape:
      question: "Should the era Lightwell reproduce TBC's GAMEOBJECT summon (Effect 50 -> GO 181102/181105/181106/181165) or keep live's CREATURE summon (Effect 28 -> 31897/31896/31895/31894) with only the cooldown and mana corrected?"
      measured_facts:
        - "All four TBC GameObject entries EXIST in acore_world.gameobject_template (type 22 GAMEOBJECT_TYPE_SPELLCASTER, displayId 6671, name 'Lightwell'), so the faithful path is not blocked by missing data."
        - "TBC CategoryRecoveryTime is 360000 (6 min); live is 180000 (3 min). Category 1145 on both sides."
        - "TBC mana is flat 225/295/365/445; live r4 is ManaCostPct 17."
        - "The live creature path is driven by spell_pri_lightwell (bound 60123) and spell_pri_lightwell_renew (bound -7001) plus PRIEST_LIGHTWELL_NPC_1..6 in spell_priest.cpp."
        - "What is NOT yet measured: which spell each GO's gameobject_template.Data* fields cast, and how many charges it grants. That is a Task 6 read, not a spell question."
      recommendation: >-
        Take the CREATURE path with TBC's cooldown/mana/levels (a minimal clone chain), UNLESS the
        real-client pass shows the GO version is needed for era feel. The GO path re-introduces a
        whole gameobject data surface for a talent whose player-visible difference is 'a well you
        click' either way, and the creature path keeps spell_pri_lightwell_renew working.
      decision_owner: orchestrator
      RESOLVED: >-
        CREATURE PATH, taken 2026-09-05 (spec Amendment A.3, shipped by Task 7 as helpers
        948051-948054). Correction to the recommendation's last clause: NO REBIND IS NEEDED OR MADE —
        neither `spell_pri_lightwell` nor `spell_pri_lightwell_renew` is bound to the SUMMON spell.
        Measured on the live DB 2026-09-05: `spell_script_names` carries 60123 -> spell_pri_lightwell
        and -7001 -> spell_pri_lightwell_renew, and NO row for 724/27870/27871/28275. Because the
        clones keep live's Effect 28 summon of the same creatures, both scripts keep working untouched.
        The cost of the decision is recorded as accepted_gaps id 9.
    blessed_recovery_mechanism:
      question: "Should node 20528's clones bind the CORE `spell_pri_blessed_recovery` (which resolves the HoT by rank arithmetic from 27813) or the MODULE's existing `era_blessed_recovery`?"
      measured_facts:
        - "The stock HoT payloads 27813/27817/27818 are LIVE_MATCH on all fourteen families — reusable either way."
        - "The trigger 18350 exists only in acore_world.spell_dbc (AzerothCore-supplied), so the core path is available."
        - "The module already ships era_blessed_recovery bound to the Vanilla clones 920976/920977/920978."
        - "Only the PROC PERCENTAGE differs (TBC 8/16/25 vs live 5/10/15)."
      recommendation: "Reuse the module script (one mechanism for both eras) and allocate fresh 948xxx clones; that avoids depending on the core script's rank arithmetic surviving a clone."
      decision_owner: "Task 6 (implementation detail, not design)"
      RESOLVED: >-
        MODULE SCRIPT `era_blessed_recovery`, decided by Task 7 (the node lives in the HOLY tab, so
        Task 6 never reached it), and the recommendation's reasoning is confirmed by reading the core
        script rather than inferred. `spell_pri_blessed_recovery` (spell_priest.cpp:1391) resolves the
        HoT as `sSpellMgr->GetSpellWithRank(27813, aurEff->GetSpellInfo()->GetRank())` — it reads the
        RANK of the aura it is bound to and walks the STOCK chain by that number; it does NOT read the
        trigger off the aura's EffectTriggerSpell. Node 20528's three per-rank passives are node
        auto-passives with no `spell_ranks` chain, so `GetRank()` cannot distinguish them.
        NO HELPER IDS WERE ALLOCATED: the node ships as `mechanic: proc-scripted`, whose DUMMY carriers
        ARE the auto-passives 940224-940226, and the module script reads the per-rank percentage from
        the carrier's own amount. Consequently only STOCK 27813 is reused, not the trio
        27813/27817/27818 — all three are byte-identical (aura 8, raw 0/ds1, 2000 ms, DurationIndex 32),
        because the real magnitude is the script's computed base points.
    surge_of_light_icd:
      question: "Author the live 6 s internal cooldown on the era Surge of Light proc row, or none?"
      measured_facts:
        - "The ICD exists only in the live `-33150` spell_proc row; no TBC column carries it."
        - "The cached TBC tooltips say a flat 25% / 50% chance on spell criticals, with no ICD language."
      recommendation: "No ICD, matching the TBC tooltip. Flagged because it is a deliberate divergence from the live proc contract and belongs in the verification record."
      decision_owner: orchestrator
      RESOLVED: >-
        NO ICD. Shipped by Task 7 as an explicit `cooldown: 0` on node 20536's `proc:` block (the
        generator's default is also 0; it is written out so the decision is visible rather than
        inferred from an absent key). Stays accepted_gaps id 5 and is on the real-client queue.

