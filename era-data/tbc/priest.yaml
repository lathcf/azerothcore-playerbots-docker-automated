# --- Lightwell r1-r4 (948051-948054; node 20539 grants r1) ---------------------------------------
# MINIMAL CLONE CHAIN OFF THE **LIVE** TEMPLATE (spec Amendment A.3, `_ref` capstone_chains.lightwell
# + open_questions.lightwell_shape — the orchestrator's decision, taken over the faithful-GameObject
# route). TBC's Lightwell is `Effect 50 SPELL_EFFECT_TRANS_DOOR` summoning GAMEOBJECT
# 181102/181105/181106/181165; WotLK re-implemented it as `Effect 28 SPELL_EFFECT_SUMMON` of
# creatures 31897/31896/31895/31894. Keeping the LIVE effect is what preserves the whole working
# click->heal chain: `spell_pri_lightwell` (bound to 60123, the creature's own script effect) reads
# `caster->GetEntry()` to pick the Renew rank, and `spell_pri_lightwell_renew` (bound to -7001)
# owns the break-on-damage rule. NEITHER IS BOUND TO THE SUMMON SPELL, so **no rebind is needed and
# none is authored** — measured on the live DB 2026-09-05: `spell_script_names` has rows for 60123
# (spell_pri_lightwell) and -7001 (spell_pri_lightwell_renew) and NO row for 724/27870/27871/28275.
# THE SUMMON EFFECT IS THEREFORE COPIED VERBATIM FROM THE LIVE TEMPLATE, per rank: Effect 28
# SPELL_EFFECT_SUMMON, EffectMiscValue = the Lightwell creature entry (31897/31896/31895/31894),
# EffectMiscValueB 1141 (the SummonProperties row — the link the summon needs; a templated helper
# that authors `effects:` writes all three slots, so omitting miscB would 0-fill it and break the
# summon, the shaman Mana Tide 932407 trap), ImplicitTargetA 87 TARGET_DEST_DEST. `effects:` cannot
# simply be omitted: the generator hard-errors on a `template:` with no authored effects
# (gen_era_talents.py:658), so "inherit everything" is spelled as "re-author the same tuple".
# EffectDieSides is copied per rank as live has it (1 on r1/r2/r4, 0 on r3) rather than normalised —
# for SPELL_EFFECT_SUMMON the effect value is the summon COUNT and `Spell::EffectSummonType` treats
# 0 and 1 alike, so the difference is cosmetic and matching live keeps the diff at zero.
# What IS authored is the three real era divergences:
#   G  `categoryCooldown: 360000` — TBC's SIX-minute cooldown vs live's three. Category 1145 is the
#      same on both sides and is inherited, so only the CategoryRecoveryTime moves.
#   C  `castTimeIndex: 16` — TBC 1.5 s vs live 0.5 s. Index 16 = 1500 ms and index 3 = 500 ms, read
#      out of the live SpellCastTimes.dbc (rows 16 and 3), which also reproduces the cached TBC
#      tooltip's "1.5 sec cast" exactly.
#   E  `powerCost:` 225/295/365/445 FLAT + `manaCostPct: 0`. r1-r3 already match live; the key is
#      LOAD-BEARING on r4, where live converts to ManaCostPct 17.
# `attributesEx: 0` drops live's SPELL_ATTR1_NO_AUTOCAST_AI (0x20000), which TBC does not carry.
# MEASURED INERT rather than assumed: the bit is read ONLY by `SpellInfo::IsAutocastable`
# (SpellInfo.cpp:1136-1142), and every caller of that is a PET path — `CharmInfo.cpp:127/155/277`,
# `PetHandler.cpp:970`, `Pet.cpp:1806/2245` and mod-playerbots' `GenericActions.cpp:90` (which walks
# `pet->m_spells`). A player-cast Lightwell reaches none of them.
# DurationIndex 25 (3 min), RangeIndex 5, attr0 0x10000, attr2 0x80000, PreventionType 1, Targets 64
# are identical between eras and inherited. The per-rank LEVEL WINDOWS are identical on r1-r3 only
# (40/46, 50/56, 60/66) — CORRECTED 2026-09-06 (M-22): `_ref` node_findings 28275 records
# "J:Levels TBC(70, 76, 70)->LIVE(70, 74, 70)", so r4 alone needs `maxLevel: 76`; the WotLK level-cap
# re-cut to 74 is exactly the same J-family drift Mind Flay r3 (948066) already authors.
# SPELLFIX: none — `_ref` spellfix_inheritance has no block touching 724/27870/27871/28275.
# TOOLTIP HONESTY (shaman fix-round lesson 17d): the cached TBC tooltip says "Any damage taken will
# cancel the effect" and "5 charges", but the CREATURE path we deliberately kept gives 10 charges
# (core `SPELL_PRIEST_LIGHTWELL_CHARGES` = 59907, ProcCharges 10, consumed one per click by
# `spell_pri_lightwell`) and the WotLK 30%-of-health cancel rule (`spell_pri_lightwell_renew`). The
# description below therefore states what SHIPS, not what TBC promised; the delta is recorded in
# `_ref` accepted_gaps id 9. The per-rank heal numbers need no such caveat — the Lightwell Renew
