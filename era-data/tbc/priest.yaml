  client:
    name: Reflective Shield
    icon: 566                    # stock 33201 SpellIconID
    rank: 1
    description: 'Causes 10% of the damage absorbed by your Power Word: Shield to reflect back at the attacker.  This damage causes no threat.'
- id: 948035
  name: Reflective Shield
  attributes: 464
  castTimeIndex: 1
  rangeIndex: 1
