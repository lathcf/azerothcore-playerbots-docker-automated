    - id: 11
      subject: "Blackout's wago ProcTypeMask omits DONE_PERIODIC — a DELIBERATE encoding departure"
      opened_by: "Task 8 (Shadow tab), 2026-09-05"
      gap: >-
        wago 2.5.4 gives all five Blackout ranks (15268/15323-15326) ProcTypeMask 87376 (0x15550),
        which contains DONE_SPELL_MELEE 0x10 | DONE_RANGED_AUTO 0x40 | DONE_SPELL_RANGED 0x100 |
        DONE_SPELL_NONE_POS 0x400 | DONE_SPELL_NONE_NEG 0x1000 | DONE_SPELL_MAGIC_POS 0x4000 |
        DONE_SPELL_MAGIC_NEG 0x10000 — and NOT DONE_PERIODIC 0x40000. Node 20544 ships
        `flags: 327680` (0x50000 = DONE_SPELL_MAGIC_NEG | DONE_PERIODIC) instead.
      why: >-
        WORKFLOW LESSON 3. On 3.3.5a every shadow damage source a TBC priest has except Mind Blast,
        Shadow Word: Death, Mana Burn and Starshards deals its damage as a PERIODIC aura tick — SW:Pain,
        Devouring Plague, and the era Mind Flay (948064-948070) and Vampiric Touch (948060-948062)
        clones, whose whole point is that TBC deals their damage directly as aura 3. A literal 0x15550
        therefore ships a talent whose tooltip says "your Shadow damage spells" and which cannot fire
        off most of them. 0x50000 is byte-identical to the shipped, real-client-verified VANILLA
        Blackout node 18133.
        THE BIT LAYOUTS ARE COMPARABLE, so this is a real omission in TBC's data rather than a decoding
        error: wago Spirit Tap carries ProcTypeMask 2 = PROC_FLAG_KILL, and wago Vampiric Embrace and
        Vampiric Touch both carry 0x80050000, whose low half is exactly 3.3.5a's DONE_SPELL_MAGIC_NEG |
        DONE_PERIODIC.
        The auto-attack/melee/ranged bits of 0x15550 are NOT added on top: DONE_RANGED_AUTO_ATTACK 0x40
        would let a SHADOW WAND swing proc the stun, because an auto-attack event carries no SpellInfo
        and `SpellMgr::CanSpellTriggerProcOnEvent` skips the family test when `GetSpellInfo()` is null,
        leaving only the SchoolMask — which a shadow wand passes.
      closes_if: "A source that records TBC's SERVER-side proc contract for Blackout (wowsims/tbc `sim/priest`, or a 2.4.3 sniff). The DBC alone cannot settle it. On the real-client pass, Blackout stunning off a Mind Flay tick is the observable that confirms the shipped choice."
