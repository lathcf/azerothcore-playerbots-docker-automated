# --- Divine Spirit r1-r5 (948024-948028) + Prayer of Spirit r1-r2 (948029-948030) ----------------
# THE PHASE'S HEADLINE CLONE CHAIN (spec section 4a, `_ref`
# capstone_chains.divine_spirit_and_prayer_of_spirit, node_findings[20513]). Live 14752 carries ONE
# effect; TBC carries THREE, and the two extra ones are ZERO-VALUED CARRIERS that exist purely so
# Improved Divine Spirit (node 20514) has something to spellmod:
#   e1 aura  29 SPELL_AURA_MOD_STAT          misc 4 (Spirit)                      = the Spirit buff
#   e2 aura 174 MOD_SPELL_DAMAGE_OF_STAT_PERCENT  misc 126 (all schools) miscB 4  = 0% of Spirit
#   e3 aura 175 MOD_SPELL_HEALING_OF_STAT_PERCENT misc 4 (Spirit)                 = 0% of Spirit
# WotLK DELETED e2/e3 when it retired Improved Divine Spirit, so a stock grant of 14752 can never
# carry the talent no matter what node 20514 authors. Both auras are fully implemented on this core
# and read misc/miscB exactly as TBC encodes them (Unit.cpp:9094 reads MiscValue as a school mask +
# MiscValueB as the Stats index for aura 174; Unit.cpp:9868 reads MiscValue as the Stats index for
# aura 175) — lesson 3 satisfied by CODE INSPECTION, not by assumption.
# Improved Divine Spirit reaches them because `SpellEffectInfo::CalcValue` applies the caster's
# SPELLMOD_EFFECT2 / SPELLMOD_EFFECT3 to effect index 1 / 2, and `SpellInfo::IsAffectedBySpellMod`
# requires the mod owner's SpellFamilyName to equal the affected spell's — hence `family: 6` here
# and the family-6 SpellClassSet the generated node passive carries.
# `mask: 32` (family-6 word0 0x20) IS MANDATORY on all seven, twice over
# (`_ref` core_hardcodes.divine_spirit_group_exclusivity):
#   * SpellInfo.cpp:2141 keys SPELL_SPECIFIC_PRIEST_DIVINE_SPIRIT on family 6 && word0 & 0x20 —
#     without it the core stops treating DS and PoS as one spell-specific group and BOTH stack on
#     the same target;
#   * it is also exactly Improved Divine Spirit's spellmod mask, so one value satisfies both.
#   It is inherited from every template anyway (live 14752/27681 carry 0x20); authored explicitly so
#   a future template swap cannot silently drop it.
# MANA is authored per rank from the `tbc:` lines (250/350/450/555/680 and 1500/1800) because TBC's
# is FLAT on every rank while live converted r5/PoS-r2 to a PERCENT (`manaCostPct` 26 / 69) — the
# clone must author `manaCostPct: 0` on those two or it would pay the flat cost PLUS the percent.
# Authored on all seven for symmetry (a no-op where the template is already 0).
# DurationIndex 30 (30 min) / 42 (1 h), RangeIndex 4 / 5, CastingTimeIndex 1, PreventionType 1,
# DispelType 1, SchoolMask 2, gcd category 133 and the stance mask are all IDENTICAL between eras
# and INHERITED — no key.
# EFFECT-SLOT NOTE: a templated helper writes ALL THREE slots (0-filling the ones it omits), so
# every effect is authored even where it matches live.
