# --- Silence 948071 (node 20554) -----------------------------------------------------------------
# CLONE (spec Amendment A.9, `_ref` node_findings[20554]). DIVERGED on families C, D, F and G, and
# BOTH divergences are real gameplay:
#   C  RangeIndex TBC 3 (20 yd) -> LIVE 4 (30 yd)
#   D+G StartRecoveryCategory/StartRecoveryTime TBC 133/1500 -> LIVE 0/0. WotLK took Silence OFF the
#      global cooldown, and StartRecoveryTime is the switch: `Spell::TriggerGlobalCooldown`
#      (Spell.cpp:8922) opens `int32 gcd = m_spellInfo->StartRecoveryTime; if (!gcd) ... return;`, so
#      a bare clone of live's 0 starts no GCD at all. The CATEGORY matters too — the haste-scaling
#      branch at Spell.cpp:8948 requires category 133 AND time 1500 — which is why both are authored.
#      This is what the new `startRecoveryCategory`/`startRecoveryTime` generator keys exist for.
#   F  ownMask TBC word0 0x84000000 -> LIVE word1 0x200000. **The clone keeps LIVE's identity** so
#      that anything masking Silence still finds it; the two era spellmods that must reach it
#      (Shadow Focus 20547, Shadow Reach 20552) therefore author word1 0x200000 explicitly instead
#      of TBC's word0 bit26 — the same re-point the Mind Flay identity decision makes.
# `attributesEx7: 2048` IS THE SPELLFIX ITEM (workflow lesson 14, spec Amendment A.14, `_ref`
# spellfix_inheritance line 3886): `SpellInfoCorrections.cpp` ORs SPELL_ATTR7_CAN_CAUSE_INTERRUPT
# (0x800) onto {47476, 15487, 5211, 6798, 8983} BY ID at load, and a clone has a different id.
# TBC 15487's own AttributesEx7 is 0, so the FINAL (post-fix) value is exactly 0x800 — without it the
# era Silence applies the silence aura and does NOT interrupt the target's in-progress cast, the
# single most visible thing the spell does. `era_audit.py::check_spellfix_inheritance` enforces it.
# INHERITED-ATTRIBUTE GAP, measured: live 15487 carries ATTR6 0xa00000 (SHOW_MECHANIC_AS_COMBAT_TEXT
# + TAPS_IMMEDIATELY) where TBC carries 0, and there is no `attributesEx6` generator key. Both bits
# are inert on the server — the first is documented client-only and `grep -rn` for either returns
# only `enuminfo_SharedDefines.cpp`.
# INHERITED AND IDENTICAL: DurationIndex 28 (5 s), Mechanic 9 SILENCE, DispelType 1, DefenseType 1,
# PreventionType 1, SchoolMask 32, flat mana 225, RecoveryTime 45000, Attributes 0x10000,
# AttributesEx2 0x80000, ShapeshiftMask 0x8000000.
# SCRIPT CENSUS: no `spell_script_names` row for 15487 on either side — nothing to rebind.
- id: 948071
  name: Silence
  template: 15487
  rangeIndex: 3                  # TBC 20 yd (live 30)
  startRecoveryCategory: 133     # TBC puts Silence ON the global cooldown; live is off-GCD (0/0)
  startRecoveryTime: 1500
  attributesEx7: 2048            # 0x800 SPELL_ATTR7_CAN_CAUSE_INTERRUPT — the post-fix value the
                                 # clone can never inherit (SpellInfoCorrections.cpp:3886)
  mask: 0
  maskB: 2101248                 # LIVE's identity, authored explicitly: 0x200000 (Silence, word1
                                 # bit21) | 0x1000 (the shared 43-spell bit12 live also carries).
                                 # TBC's own word0 0x84000000 is deliberately NOT used — see banner.
  maskC: 0
  effects:
  - { effect: 6, aura: 27, basePoints: 0, dieSides: 1, targetA: 6 }   # MOD_SILENCE
  client:
    name: Silence
