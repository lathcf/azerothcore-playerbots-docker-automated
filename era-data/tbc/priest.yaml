    #   * `flags: 87376` is TBC's OWN ProcTypeMask (0x15550 = every DONE spell/ranged event);
    #   * `typeMask: 2` = SPELL_TYPE_MASK_HEAL and is LOAD-BEARING — a heal event carries type 2 and
    #     the generator DEFAULTS SpellTypeMask to 1/DAMAGE, so 2 & 1 == 0 would reject every proc
    #     unconditionally (the shipped Vanilla shaman Ancestral Healing / Healing Way lesson);
    #   * `hitMask: 2` supplies the "critical effect" half;
    #   * `affectsMask` is the live row's family mask MINUS its one WotLK bit. word0 0x10001E00 =
    #     Prayer of Healing (bit9) | Heal (bit10) | Flash Heal (bit11) | Greater Heal (bit12) |
    #     Circle of Healing (bit28), word1 0x4 = Binding Heal — exactly the six spells the cached
    #     TBC tooltip names. Live additionally carries word1 0x10000 (Penance/Rapture, WotLK), which
    #     is dropped. The mask is authored VERBATIM rather than derived from `affects:` because
    #     word0 bit 28 is shared by a 40-spell Flash/Greater/Binding-Heal overlap set
    #     (_ref family6_bit_census word0.28) that identity ORing could not reproduce exactly.
    #     Circle of Healing resolves because the era clones 948046-948050 template off the stock
    #     chain and therefore keep its bit-28 identity.
    #   * `attrMask` is deliberately NOT authored (live carries 2 = PROC_ATTR_TRIGGERED_CAN_PROC).
    #     None of the six named spells is cast as a TRIGGERED spell by a TBC priest — every one is a
    #     direct player cast, including the era Circle of Healing, whose heal is Effect_1 of the cast
    #     itself and not a triggered sub-spell. The bit's only effect would be to widen the proc.
    # `chance` is omitted: TBC's ProcChance is 100 on all three ranks (the generator's
    # DEFAULT_PROC_CHANCE) and the rank ladder lives in the payloads' magnitudes.
    # The shipped VANILLA payloads 920987-920989 are NOT reused — see the `helpers:` block.
    mechanic: proc
    proc:
      flags: 87376            # TBC ProcTypeMask 0x15550 — every DONE spell event
      trigger: [948057, 948058, 948059]
      typeMask: 2             # SPELL_TYPE_MASK_HEAL — load-bearing, see above
      hitMask: 2              # PROC_HIT_CRITICAL only
      affects:                # drives the addon spellMods map + the not-in-_ref.spells lint
      - Flash Heal
      - Heal
      - Greater Heal
      - Binding Heal
      - Prayer of Healing
      - Circle of Healing
      affectsMask: { a: 268443136, b: 4, c: 0 }
