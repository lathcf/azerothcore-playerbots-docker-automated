# cast"). Templated off 33151 so DurationIndex, Attributes 0x10000, DispelType, RangeIndex and the
# family-6 word1 0x1000 identity all come across; only the three masks and ProcTypeMask move.
# The three effects are TBC's own, verbatim, and the SET of them is what makes the buff work at all:
#   e1 aura 108 ADD_PCT_MODIFIER misc 14 SPELLMOD_COST      -100%      (free)
#   e2 aura 108 ADD_PCT_MODIFIER misc 10 SPELLMOD_CASTING_TIME -100%   (instant)
#   e3 aura 108 ADD_PCT_MODIFIER misc  7 SPELLMOD_CRITICAL_CHANCE -10000%  (cannot crit)
