  # PER-EFFECT CLASS-MASK DIFFS (supplementary family O). 55 hits. Excluded from the verdict; FIVE
  # groups are load-bearing and MUST be read before granting any LIVE_MATCH spellmod.
  # =================================================================================================
  effect_class_mask_diffs:
    load_bearing:
      - ids: "14909, 15017 (Searing Light r1-2, node 20532)"
        diff: "e1 TBC (0x100080, 0, 0) -> LIVE (0x500080, 0x8000, 0)"
        decode: "TBC = Smite (word0 bit7) + Holy Fire (bit20). LIVE ADDS Holy Nova (bit22) and Penance (word1 bit15)."
        why_it_matters: >-
          A TBC priest CAN have Holy Nova (node 20527 grants it), so this is a REACHABLE divergence,
          not inert WotLK content: granting stock Searing Light would give the era priest +5/10%
          Holy Nova damage that TBC never had. The verdict for 14909/15017 is LIVE_MATCH on all
          fourteen families — ONLY this pass catches it.
        disposition: "CLONE node 20532 r1-2 with the TBC mask (0x100080, 0, 0). Spec section 3c anticipated 'adjudicate'; the adjudication is CLONE."
      - ids: "33213, 33214, 33215 (Focused Mind r1-3, node 20557)"
        diff: "e1 TBC (0x822000, 0, 0) -> LIVE (0x22000, 0x100000, 0x40)"
        decode: >-
          TBC = Mind Blast (bit13) + Mind Control (bit17) + the SHARED bit 23. LIVE drops bit 23 and
          names Mind Sear (word1 bit20) and Mind Flay (word2 bit6) explicitly. TBC's tooltip says
          "Mind Blast, Mind Control and Mind Flay" — TBC reaches Mind Flay ONLY through shared bit 23.
        why_it_matters: "Whatever identity the era Mind Flay CLONE carries decides whether Focused Mind still reduces its cost. See open_questions.mind_flay_clone_identity."
        disposition: "CLONE with a mask matched to the era Mind Flay clone's identity (recommended: 0x22000 word0 + 0x40 word2)."
      - ids: "15259, 15307, 15308, 15309, 15310 (Darkness r1-5, node 20559)"
        diff: "e2 TBC (0x2808000, 0x400, 0) -> LIVE (0x2008000, 0x400, 0)"
        decode: "TBC includes shared bit 23 (and therefore TBC Mind Flay); LIVE drops it."
        why_it_matters: "Same Mind Flay identity question, inverted: here the LIVE mask is the one that misses Mind Flay. Node 20559 reads all-LIVE_MATCH but a stock grant would not boost the era Mind Flay clone."
        disposition: "CLONE r1-5 with a mask matched to the era Mind Flay clone."
      - ids: "33151 (Surge of Light buff)"
        diff: "e1/e2/e3 TBC (0x80,0,0) -> LIVE (0x880,0,0)"
        decode: "TBC = Smite ONLY. LIVE adds Flash Heal (bit11)."
        why_it_matters: "This is the whole section 3a claim for node 20536, and it is confirmed at the mask level, not just the tooltip."
        disposition: "Fresh buff clone with mask 0x80 (Smite only) on all three effects."
      - ids: "14523, 14784, 14785 (Silent Resolve r1-3, node 20502)"
        diff: "e2 TBC (0xbb816f, 0x1679, 0) -> LIVE (0, 0, 0x400)"
        decode: >-
          e2 is aura 107 SPELLMOD_RESIST_DISPEL_CHANCE (misc 28 — the 'resistDispel op 28' the Vanilla
          priest record names). TBC ENUMERATES the affected spells; LIVE replaces the enumeration with
          the shared word2 bit 10 (154 spells).
        why_it_matters: "Node 20502 is DIVERGED anyway (magnitudes), but the clone must carry the TBC enumeration or it resists dispels on spells TBC never covered."
        disposition: "Clone with the TBC mask."
    wotlk_content_only_not_reachable:
