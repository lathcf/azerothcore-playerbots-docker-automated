  # =================================================================================================
  # CAPSTONE / TRAINED-RANK CHAINS. Six chains. For every one: the TBC per-rank values, the live
  # values, the verdict, the TBC required level (TBC levels = wago SpellLevels (family J),
  # independently confirmed by the live trainer_spell ReqLevel rank-for-rank; Wowhead tooltips are
  # cached for the rank-1 ids only and carry no per-rank level), the stock trainer rows and their
  # ReqAbility1 chain, and the ORPHANED-HIGHER-RANK CHECK for every stock row a later task might touch.
  #
  # GLOBAL FINDINGS (true of all six):
  #   * `trainer.Id = 11` is THE priest trainer set (Requirement 5). `trainer.Id = 12` is a SECOND
  #     priest set (same greeting) but it carries exactly ONE row in this space: Power Word: Shield
  #     rank 1 (17) at level 6. Any DELETE that names only TrainerId 11 leaves that row standing.
