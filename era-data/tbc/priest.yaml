  # =================================================================================================
  # SPEC SECTION 3 / 4 CONTRADICTIONS — the Amendment A material. Where this file and the spec
  # disagree, THIS FILE WINS.
  # =================================================================================================
  spec_bucket_contradictions:
    - spec: "Section 3a, node 20515 Focused Power: 'TBC +dmg/heal % + Mass Dispel cast time; WotLK became +spell hit'"
      measured: >-
        EXACTLY BACKWARDS. TBC 33186/33190: e1 aura 107 SPELLMOD_CASTING_TIME (misc 10) -500/-1000 ms
        on Mass Dispel (mask word1 0x80), e2 aura 107 SPELLMOD_RESIST_MISS_CHANCE (misc 16) +2/+4 on
        mask (0x2080, 0x80) = Smite | Mind Blast | Mass Dispel. Cached TBC tooltip: "Your Smite, Mind
        Blast and Mass Dispel spells have an additional 2% chance to hit. In addition, your Mass
        Dispel cast time is reduced by 0.5 sec." LIVE 33186/33190: e2 aura 79 MOD_DAMAGE_PERCENT_DONE
        +1/+3 (misc 126) and a live-extra e3 aura 136 MOD_HEALING_DONE_PERCENT +1/+3.
        So TBC = spell HIT + cast time; WotLK = damage + healing.
      impact: "The node is DIVERGED either way and clones either way; only the spec's rationale is wrong. Correct it (workflow lesson 15)."
    - spec: "Section 3b, node 20518: 'Power Infusion as +20% damage/healing with a 3 min cooldown'"
      measured: >-
        That is the VANILLA shape (and exactly what the Vanilla clone 920920 implements: aura 79 +20%
        damage done, aura 136 +20% healing done). TBC 10060 is e1 aura 65
        MOD_CASTING_SPEED_NOT_STACK +20% and e2 aura 72 MOD_POWER_COST_SCHOOL_PCT -20%, cd 180000 —
        i.e. TBC Power Infusion is +20% HASTE and -20% MANA COST, identical in effect to live, and
        differs from live ONLY in the cooldown (TBC 3 min vs live 2 min) and one EffectMiscValueB.
        Cached TBC tooltip confirms: "increasing spell casting speed by 20% and reducing the mana cost
        of all spells by 20%".
      impact: "Node 20518 is a MINIMAL clone (cooldown only), not a mechanic reconstruction. It also means the Vanilla helper 920920 is not remotely reusable."
    - spec: "Section 3c, 'likely grants' list includes Lightwell 724 + chain"
      measured: >-
        DIVERGED on all four ranks and on IMPLEMENTATION SHAPE: TBC summons a GAMEOBJECT
        (Effect 50 SPELL_EFFECT_TRANS_DOOR, entries 181102/181105/181106/181165) on a SIX-minute
        category cooldown; live summons a CREATURE (Effect 28, 31897/31896/31895/31894) on a THREE-
        minute cooldown. All four GO entries exist in this server's gameobject_template.
      impact: "Escalated as a design question — see open_questions.lightwell_shape."
    - spec: "Section 3c, 'likely grants' list includes Improved Mind Blast"
      measured: >-
        Live carries an EXTRA EFFECT_1 (SPELL_EFFECT_DUMMY, 20/40/60/80/100) that TBC does not, and
        SpellEffects.cpp:449 reads it as the Mind Trauma proc chance on any icon-95 family-6 flat
        modifier. A stock grant ships WotLK's Mind Trauma.
      impact: "Node 20549 is a CLONE, not a grant. Section 4g predicted this and asked for verification; verified."
    - spec: "Section 3c, 'likely grants' list includes Searing Light"
      measured: >-
        LIVE_MATCH on all fourteen verdict families, but the supplementary family-O pass shows the
        live mask widened from (0x100080) = Smite | Holy Fire to (0x500080, 0x8000) = + Holy Nova
        + Penance. Holy Nova is REACHABLE by a TBC priest (node 20527 grants it), so a stock grant
        hands out a Holy Nova damage bonus TBC never had.
      impact: "Node 20532 is a CLONE. Section 3c said 'a mask diff, adjudicate' — the adjudication is CLONE."
    - spec: "Section 3c, 'likely grants' list includes Improved Renew, Holy Specialization, Spell Warding, Divine Fury, Healing Focus, Holy Reach, Improved Healing, Healing Prayers, Spiritual Guidance, Improved Mana Burn, Improved Psychic Scream, Shadow Reach, Darkness, Spirit of Redemption"
      measured: "ALL CONFIRMED LIVE_MATCH — with two caveats: Shadow Reach (17322/17323) and Darkness (15259-15310) both carry family-O mask diffs that involve Mind Flay's identity bit, so their disposition depends on the Mind Flay clone decision."
      impact: "Counting the whole tree rather than the list: only FOURTEEN of the 64 nodes are unconditional stock grants (20504 20506 20511 20522 20523 20524 20525 20526 20530 20531 20533 20534 20535 20548), plus Holy Nova 20527 with a rank-7 mana gap. Improved PW:Fortitude, Focused Mind, Improved Mind Blast, Searing Light, Shadow Reach, Darkness, Lightwell, Mind Flay, Silence, Shadowform, Martyrdom, Inspiration and Inner Focus are NOT clean grants."
    - spec: "Section 3c, 'likely grants' list includes Mind Flay 15407 + stock trained chain, Silence 15487, Shadowform 15473, Inner Focus 14751"
      measured: >-
        Mind Flay: DIVERGED on all seven ranks (whole damage encoding, range, mana, own identity mask).
        Silence: DIVERGED (RangeIndex 3 vs 4, StartRecoveryCategory 133 -> 0, StartRecoveryTime 1500 ->
        0, flat mana 225 vs live's, ownMask 0x84000000 -> 0, Attr6). Shadowform: DIVERGED (e3 misc 1
        PHYSICAL vs live 127 ALL SCHOOLS — live's -15% damage taken applies to every school; plus
        three attribute words). Inner Focus: DIVERGED on TWO attribute bits only
        (+SPELL_ATTR3_CAN_PROC_FROM_PROCS, +SPELL_ATTR4_ALLOW_PROC_WHILE_SITTING) with every effect,
        the 3 min cooldown and the -100% cost / +25% crit values identical.
      impact: "Three clones and one borderline. Inner Focus is the only node in the class where GRANT-with-a-note is defensible."
    - spec: "Section 3a, node 20562 Misery: 'TBC: target takes +1-5% spell damage'"
      measured: >-
        CONFIRMED for the debuff, and the four fixed points the plan named are all reproduced. BUT the
        TBC talent ALSO carries a second effect (aura 112 SPELL_AURA_OVERRIDE_CLASS_SCRIPTS, MiscValue
        5066, mask (0x808000, 0x400, 0)) with NO magnitude progression and NO handler anywhere in this
        core. AND the operative proc contract is not the DBC mask (0x908000 = SW:Pain + Holy Fire +
        the shared bit) but the `-33191` spell_proc row (Mask0 32768 SW:Pain / Mask1 1024 VT /
        Mask2 64 Mind Flay) plus the `spell_gen_proc_on_victim` script binding.
      impact: "Omit the aura-112 half; the node needs a generator-written proc row AND a rebind of spell_gen_proc_on_victim, neither of which the spec mentions."
    - spec: "Section 3b lists Inspiration (20529) as '+armor', following the Vanilla record"
      measured: >-
        CORRECT, and better than the Vanilla implementation: TBC's buffs use aura 101
        MOD_RESISTANCE_PCT (misc 1 = armor) directly, and this core implements that aura
        (SpellAuraEffects.cpp:4157). The Vanilla phase's aura-87 damage-taken "armor proxy"
        (920987-989) is NOT needed for TBC.
      impact: "Node 20529 gets three fresh buffs at TBC's real encoding, not a proxy."
    - spec: "Section 3, overall shape — the buckets imply Discipline/Holy are mostly stock and Shadow is the reconstruction-heavy tab."
      measured: "INVERTED. Of the 65 LIVE_MATCH rank spells, 40 are HOLY, and the Holy tab has ZERO WAGO_ONLY ids. Discipline is 13/69 LIVE_MATCH with 16 WAGO_ONLY; Shadow is 12/63 with 11 WAGO_ONLY. Holy is the stock tab; Discipline and Shadow are near-total reconstructions."
      impact: "Task-sequencing hint for Tasks 6-8: the Holy tab is a fraction of the authoring work of the other two."

