  # =================================================================================================
  # CORE FAMILY-FLAG / ICON-KEYED HARDCODE TABLE (workflow lesson 20). Produced by LEADING with the
  # SPELLFAMILY_PRIEST grep across SpellEffects.cpp / Unit.cpp / SpellAuraEffects.cpp / SpellAuras.cpp
  # / SpellMgr.cpp / Spell.cpp / Player.cpp / SpellInfo.cpp, then the icon-id and
  # GetDummyAuraEffect/GetAuraEffectOfRankedSpell greps, then spell_priest.cpp's enums.
  # Paths are relative to azerothcore-wotlk/.
  # =================================================================================================
  core_hardcodes:
    - id: improved_mind_blast
      site: "src/server/game/Spells/SpellEffects.cpp:449-467"
      keys_on: "the CAST spell's SpellFamilyFlags[0] & 0x2000 (Mind Blast) + FORM_SHADOW, then scans the caster's SPELL_AURA_ADD_FLAT_MODIFIER auras for SpellFamilyName == SPELLFAMILY_PRIEST && SpellIconID == 95, and rolls `Effects[EFFECT_1].CalcValue()` percent"
      reached_by: "node 20549 (Improved Mind Blast) and, for the family-flag half, the era Mind Blast the priest casts (BASELINE 8092 — unchanged)"
      disposition: >-
        CLONE r1-5 with EFFECT_0 only (the cooldown spellmod). The clone may keep icon 95; with no
        EFFECT_1 the chance is 0 and Mind Trauma 48301 never fires. A STOCK GRANT ships WotLK's Mind
        Trauma to a TBC priest. THIS IS THE NODE THE FOURTEEN-FAMILY SWEEP CALLED
        LIVE_MATCH_UNVERIFIED_SLOT — lesson 20 in its purest form.
    - id: shadow_affinity
      site: "src/server/game/Spells/Auras/SpellAuras.cpp:1638-1648"
      keys_on: "on AURA_REMOVE_BY_ENEMY_SPELL of a spell with SpellFamilyFlags[0] & 0x8000 (SW:Pain) or SpellFamilyFlags[1] & 0x400 (Vampiric Touch), looks for `caster->GetDummyAuraEffect(SPELLFAMILY_PRIEST, 178, 1)` — icon 178, EFFECT_1 SPELL_AURA_DUMMY — and casts 64103 for that percent of base mana"
      reached_by: "node 20545 (Shadow Affinity, icon 178) and node 20563's VT clones (which carry word1 0x400) and the era SW:Pain (baseline 589)"
      disposition: >-
        CLONE node 20545 r1-3 with EFFECT_0 only (the threat spellmod). Icon 178 is safe to keep. The
        family-flag half of the branch WILL fire for the era VT clone (it must carry word1 0x400 so
        the rest of the AI/spellmod surface finds it) but with no dummy aura present the branch does
        nothing. VERIFIED INERT BY ABSENCE OF THE DUMMY, not by "the era priest is a bot" or any
        other reasoning.
    - id: reflective_shield
      site: "src/server/scripts/Spells/spell_priest.cpp:690-704 (spell_pri_power_word_shield_aura::ReflectDamage), bound to spell_id -17"
      keys_on: "`owner->GetAuraEffectOfRankedSpell(SPELL_PRIEST_REFLECTIVE_SHIELD_R1 = 33201, EFFECT_0)`"
      measured: >-
        `Unit::GetAuraEffectOfRankedSpell` (Unit.cpp:5796) walks
        `sSpellMgr->GetFirstSpellInChain(33201)` then `GetNextSpellInChain`. MEASURED ON THIS SERVER:
        `acore_world.spell_ranks` has NO ROW for 33201, 33202, 33203, 33204 or 33205 — the chain walk
        therefore inspects EXACTLY the id 33201 and nothing else (a live priest holding only stock
        rank 2 33202 gets no reflect either; that is an upstream defect, not ours).
      reached_by: "node 20519 (Reflective Shield) — 5 fresh 948xxx clones"
      disposition: >-
        ZERO CORE PATCH. The stock reflect is inert for an era priest because the era clones are not
        33201. Bind a module AuraScript to the SAME `-17` chain: AzerothCore runs every registered
        script for a spell, and both would register AfterEffectAbsorb on EFFECT_0 with the same
        `absorbAmount`. The module script reads the era clone's amount and casts the SAME triggered
        33619 (LIVE_MATCH, reusable) with the same `dmgInfo.GetSpellInfo()->Id != 33619` infinite-loop
        guard. Section 4e stands as designed.
    - id: divine_spirit_group_exclusivity
      site: "src/server/game/Spells/SpellInfo.cpp:2141-2146"
      keys_on: "SpellFamilyName == SPELLFAMILY_PRIEST && SpellFamilyFlags[0] & 0x20 -> SPELL_SPECIFIC_PRIEST_DIVINE_SPIRIT"
      reached_by: "node 20513's Divine Spirit + Prayer of Spirit clone chains"
      disposition: >-
        LOAD-BEARING FOR THE CLONE. The DS and PoS clones MUST carry ownMask word0 0x20 or the core
        stops treating them as the same spell-specific group and Divine Spirit + Prayer of Spirit
        will STACK on the same target. The same bit is Improved Divine Spirit's spellmod mask, so one
        value satisfies both requirements. NOT a patch — an authoring requirement.
    - id: mind_flay_smite_swdeath_glyph_bonuses
      site: "src/server/game/Entities/Unit/Unit.cpp:8658-8690"
      keys_on: "SpellFamilyFlags[0] & 0x800000 (Mind Flay), & 0x80 (Smite), SpellFamilyFlags[1] & 0x2 (SW:Death), each gated on a specific GLYPH aura (55687 / 55692 / 55682) or on Twisted Faith's SPELL_AURA_OVERRIDE_CLASS_SCRIPTS 2848"
      reached_by: "the era Mind Flay clone if it carries word0 0x800000 (TBC's own value); Smite and SW:Death are baseline"
      disposition: >-
        INERT for a TBC-era character on BOTH halves: glyphs are blocked for every non-DK TBC-band
        character by `EraGlyphGate` (EraTalents.GlyphGate, default 1), and Twisted Faith is a
        WotLK-only talent no era tree grants. NOTE the flag itself: `0x800000` is the SHARED 126-spell
        bit, and LIVE Mind Flay does not carry it — so this branch is dead for stock Mind Flay on this
        core and would become LIVE for an era clone that authors the TBC value. Still inert (no glyph),
        but it is a second reason the clone's identity choice deserves a deliberate decision.
    - id: prayer_of_mending_raid_proc
      site: "src/server/game/Entities/Unit/Unit.cpp:13864 and src/server/game/Spells/Auras/SpellAuraEffects.cpp:7042"
      keys_on: "SpellFamilyName == SPELLFAMILY_PRIEST && SpellFamilyFlags[1] & 0x20"
      reached_by: "baseline Prayer of Mending 33076 only — no priest talent node grants or masks it"
      disposition: "none — baseline, untouched."
    - id: improved_devouring_plague
      site: "src/server/game/Spells/Auras/SpellAuras.cpp:1409-1425"
      keys_on: "the Devouring Plague aura's SpellFamilyFlags[0] & 0x02000000, then `caster->GetDummyAuraEffect(SPELLFAMILY_PRIEST, 3790, 1)` (icon 3790, EFFECT_1 dummy)"
      reached_by: "nothing in the TBC tree — icon 3790 is the WotLK-only Improved Devouring Plague talent"
      disposition: "none. Verified by icon: no TBC priest talent in the 194-id set carries SpellIconID 3790."
    - id: swpain_dispel_hooks_and_shadow_word_death
      site: "src/server/game/Entities/Unit/Unit.cpp:8603, :9590; src/server/game/Spells/Auras/SpellAuraEffects.cpp:5596"
      keys_on: "SW:Pain family bit 0x8000 (Twisted Faith, icon 7377 — WotLK talent); the SPELLFAMILY_PRIEST arms at Unit.cpp:9590 and SpellAuraEffects.cpp:5596 are EMPTY (an `if (spellProto->Id == 63544)` T9 branch and a commented-out stub respectively)"
      disposition: "none — no TBC-reachable behaviour."
    - id: class_script_5066
      site: "no handler anywhere in src/server (grep for `case 5066` / `5066:` returns nothing)"
      keys_on: "SPELL_AURA_OVERRIDE_CLASS_SCRIPTS with MiscValue 5066 — TBC Misery 33191-33195's SECOND effect"
      reached_by: "node 20562 if the clone copies TBC's e2 literally"
      disposition: >-
        WORKFLOW LESSON 3 CASE. TBC Misery carries a second effect (aura 112, misc 5066, mask
        (0x808000, 0x400, 0) = SW:Pain + Vampiric Touch) that this core has NO handler for, and whose
        per-rank magnitude is NOT in the wago rows either (r1 raw 99/ds1, r2-r5 raw 0/ds0 — no rank
        progression). The TBC TOOLTIP for all five ranks says ONLY "cause the target to take an
        additional N% spell damage". DISPOSITION: OMIT the aura-112 half entirely; author only the
        debuff. This is not an accepted gap — the half has no player-facing effect in TBC's own
        presentation and no expressible value.
    - id: lightwell_gameobject
      site: "acore_world.gameobject_template entries 181102 / 181105 / 181106 / 181165"
      keys_on: "SPELL_EFFECT_TRANS_DOOR (Effect 50) with EffectMiscValue = the GO entry"
      measured: "all four rows EXIST (type 22 GAMEOBJECT_TYPE_SPELLCASTER, displayId 6671, name 'Lightwell')"
      disposition: "see capstone_chains.lightwell and open_questions.lightwell_shape — this is the enabler that makes a faithful TBC Lightwell possible."
    - id: _summary
      note: >-
        NINE core arms plus one DB row (lightwell_gameobject, gameobject_template — not core code)
        found. TWO are live hazards that a stock grant would ship (Improved Mind Blast ->
        Mind Trauma, Shadow Affinity -> mana on dispel), ONE is a load-bearing AUTHORING requirement on
        a clone (Divine Spirit's 0x20 identity bit), ONE settles a design question in the spec's favour
        (Reflective Shield's chain walk is provably confined to 33201 — zero core patch), ONE is an
        un-expressible TBC encoding to be omitted (class script 5066), and FOUR are inert.
        NO NEW CORE PATCH IS REQUIRED FOR THIS CLASS.

