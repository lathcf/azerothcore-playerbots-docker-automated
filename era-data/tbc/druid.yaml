# ---------------------------------------------------------------------------------------------------
# Leader of the Pack (node 20138). TWO helpers, the SAME split the shipped Vanilla pair 932503/932506
# uses -- and the split is MANDATORY, not stylistic: AuraEffect::HandleShapeshiftBoosts
# (SpellAuraEffects.cpp:1440-1456) only re-casts a learned spell whose Attributes carry
# PASSIVE|DO_NOT_DISPLAY and whose Stances mask includes the form being entered, so a single VISIBLE
# spell would apply once and then silently fail to reapply on every later form entry.
#   946256 = the HIDDEN form-passive. Templates 17007 to inherit Attributes 464
#            (PASSIVE|DO_NOT_DISPLAY|DO_NOT_LOG), family 7 and SpellIconID 312; the only authored
#            effect is SPELL_EFFECT_TRIGGER_SPELL (64) -> 946257. This is the spell node 20138 grants
#            and the one that appears in the Feral Combat spellbook tab (skillLine 134).
- id: 946256
  name: Leader of the Pack
  template: 17007
  stances: [cat, bear, direbear]              # ShapeshiftMask 145 = cat(1)|bear(16)|direbear(128)
  effects:
  - { effect: 64, aura: 0, basePoints: 0, dieSides: 0, targetA: 1, trigger: 946257 }
  client:
    name: Leader of the Pack
    icon: 312
    description: While in Cat, Bear or Dire Bear Form, the Leader of the Pack increases ranged and melee critical chance of all party members within 45 yards by 5%.
    auraDescription: Melee and ranged critical strike chance of nearby party members increased by 5%.
    skillLine: 134            # Feral Combat spellbook tab (the visible party aura is 946257)
#   946257 = the VISIBLE party aura. Templates STOCK 24932 (not 17007, unlike the Vanilla pair) for
#            three inherited properties that are all load-bearing:
#              * SpellClassMask_2 = 2048 (family-7 word-B bit11) -- the identity Improved Leader of
#                the Pack's spellmod (node 20139, EffectSpellClassMaskA_2 = 2048) binds to. Templating
#                17007 would inherit an all-zero mask and the +2%/+4% heal would never attach.
#              * ProcTypeMask 4436 (DONE melee auto | DONE spell melee | DONE ranged auto | DONE spell
#                ranged | DONE spell none-dmg-class neg) + ProcChance 100 -- the events
#                spell_dru_leader_of_the_pack procs on.
#              * Attributes 0 (a VISIBLE buff), AttributesEx 1024, DurationIndex 21 (-1, persists;
#                the ShapeshiftMask strips it on form exit).
#            Effects are re-authored to TBC's scope: Effect 35 APPLY_AREA_AURA_PARTY at radiusIndex 11
#            (45 yd) instead of live's Effect 65 APPLY_AREA_AURA_RAID at radiusIndex 12. The three
#            effect SLOTS are TBC's own (aura52 crit / aura4 DUMMY / aura189 MOD_RATING misc 768) --
#            the survival map's 24932 row shows TBC and live differ ONLY in the effect type and the
#            crit effect's radius index.
#            EFFECT_1 (index 1, the DBC Effect_2 column) MUST be the aura-4 DUMMY: the core script
#            registers OnEffectProc on EFFECT_1 / SPELL_AURA_DUMMY, and SPELLMOD_EFFECT2 (misc 12,
#            what node 20139 authors) modifies exactly that index. Its own amount stays 0, so the
#            whole heal% comes from the Improved LotP spellmod, as it does on stock.
#            The `proc:` block reproduces stock 24932's spell_proc row: HitMask 2 = CRIT ONLY. Without
#            it the clone would fall back to the core's default hit mask and heal on EVERY melee hit.
#            (Stock's row stores ProcFlags 0 = "use the DBC ProcTypeMask"; the generator hard-errors on
#            an explicit hitMask under flags 0, so the inherited 4436 is written out literally --
#            same effective events.)
#            scriptBindings below binds era_dru_leader_of_the_pack -- the core
#            spell_dru_leader_of_the_pack HandleProc MINUS the WotLK 68285 mana return (2026-09-07,
#            G-6). The core script is bound BY ID to stock 24932, so without a binding of some kind
#            the on-crit heal is simply dead on the clone.
- id: 946257
  name: Leader of the Pack
  template: 24932
  attributes: 0              # NO PASSIVE/DO_NOT_DISPLAY -> a VISIBLE buff (inherited from 24932; explicit)
  durationIndex: 21          # -1 (persists) — ShapeshiftMask gates it off on form exit
  stances: [cat, bear, direbear]              # ShapeshiftMask 145
  maskB: 2048                # family-7 word-B bit11 = the LotP-aura identity Improved LotP binds to
  effects:
  - { effect: 35, aura: 52, basePoints: 4, dieSides: 1, misc: 0, targetA: 1, radius: 11 }   # APPLY_AREA_AURA_PARTY, +5% weapon crit, 45yd
  - { effect: 35, aura: 4, basePoints: -1, dieSides: 1, misc: 0, targetA: 1, radius: 11 }   # the DUMMY the heal script + Improved LotP's SPELLMOD_EFFECT2 read (amount 0 by itself)
  - { effect: 35, aura: 189, basePoints: -1, dieSides: 1, misc: 768, targetA: 1, radius: 11 }  # MOD_RATING, amount 0 — present in BOTH eras' rows, kept for fidelity
  proc:
    flags: 4436              # = stock 24932's DBC ProcTypeMask (DONE melee/ranged auto + spell melee/ranged + spell none-neg)
    typeMask: 1
    phaseMask: 2
    hitMask: 2               # CRIT ONLY — mirrors stock 24932's spell_proc row
    chance: 100
  client:
    name: Leader of the Pack
    icon: 312
    auraDescription: Increases ranged and melee critical chance by $s1%.
    # no skillLine: triggered only (never learnable/trainable) — it must not get its own spellbook entry
