# Tree of Life (node 20161) — Route B (spec Amendment A.2, _ref.tree_of_life). TWO helpers, the same
# hidden-form-passive / visible-area-aura split as Leader of the Pack 946256+946257, and MANDATORY for
# the same reason: AuraEffect::HandleShapeshiftBoosts only re-casts a learned spell whose Attributes
# carry PASSIVE|DO_NOT_DISPLAY and whose Stances mask includes the form being entered, so a single
# VISIBLE spell would apply once and never reapply on a later form entry.
#   946265 = the HIDDEN form-passive. Templates 17007 for the proven talent-passive shape (Attributes
#            464 = PASSIVE|DO_NOT_DISPLAY|DO_NOT_LOG, family 7); the only authored effect is
#            SPELL_EFFECT_TRIGGER_SPELL (64) -> 946266. ShapeshiftMask 2 = 1 << (FORM_TREE - 1), the
#            same value stock 34123 carries.
#            NO client: block on purpose — it is never shown, never trainable, and has no skillLine,
#            so it gets no spellbook row. It is NOT the node grant either (the node grants the stock
#            form 33891); it is handed out by EraTalents.cpp's CLASS_DRUID paired-grant arm, flagged
#            `custom` so every other era strips it.
- id: 946265
  name: Tree of Life
  template: 17007
  attributes: 464            # PASSIVE|DO_NOT_DISPLAY|DO_NOT_LOG (inherited from 17007; explicit)
  stances: [tree]            # ShapeshiftMask 2 = 1 << (FORM_TREE(0x02) - 1)
  effects:
  - { effect: 64, aura: 0, basePoints: 0, dieSides: 0, targetA: 1, trigger: 946266 }
#   946266 = the VISIBLE TBC party aura. Templates STOCK 34123 so it inherits that row's Attributes
#            (134217728), AttributesEx (1024), DurationIndex 21 (-1, persists — ShapeshiftMask gates
#            it off on form exit), SpellIconID 2257 and family 7. Effects are re-authored to TBC's
#            own row: Effect 35 APPLY_AREA_AURA_PARTY (live is 65 APPLY_AREA_AURA_RAID), aura 115
#            SPELL_AURA_MOD_HEALING (live is 118 MOD_HEALING_PCT), EffectMiscValue 127 = all schools,
#            radiusIndex 11 = 45 yd (live is 12 = 100 yd).
#            basePoints 0 is TBC's own value and is NOT the magnitude: TBC computed the amount
#            server-side from the druid's Spirit. era_dru_tree_of_life (scriptBindings below) sets it
#            to 25% of the caster's total Spirit in DoEffectCalcAmount — the same idiom as the six
#            existing uses in EraTalentProcScripts.cpp.
#            KNOWN LIMITATION (recorded in _ref.tree_of_life.known_limitations_to_record_either_way):
#            the amount is computed at aura apply (form entry). SPELL_AURA_MOD_HEALING is not on any
#            core stat-change recalculation path, so a Spirit change mid-form does not update the
#            bonus until the druid re-enters the form.
- id: 946266
  name: Tree of Life
  template: 34123
  attributes: 134217728      # inherited from 34123 — a VISIBLE buff (no PASSIVE/DO_NOT_DISPLAY); explicit
  durationIndex: 21          # -1 (persists) — ShapeshiftMask gates it off on form exit
  stances: [tree]            # ShapeshiftMask 2 (inherited from 34123; explicit)
  effects:
  - { effect: 35, aura: 115, basePoints: 0, dieSides: 0, misc: 127, targetA: 1, radius: 11 }  # APPLY_AREA_AURA_PARTY, MOD_HEALING all schools, 45 yd
  client:
    name: Tree of Life
    icon: 2257
    # `description:` is authored too, not just auraDescription: a template clone inherits the stock
    # row's Description, and live 34123's reads "Increases healing received by raid members within
    # $a1 yards by $s1%" — the WotLK raid/percentage text, which is exactly what this aura is not.
    description: "Increases healing received by party members within 45 yards by an amount equal to 25% of the Tree of Life Druid's Spirit."
    auraDescription: "Healing received is increased by an amount equal to 25% of the Tree of Life Druid's Spirit."
    # no skillLine: triggered only (never learnable/trainable) — it must not get a spellbook entry
# ---------------------------------------------------------------------------------------------------
# Tree of Life FORM spell (node 20161). FIX ROUND 2026-08-31 (real-client defect 3), spec
# Amendment A.2's ROUTE A, taken on top of the shipped Route B aura pair.
#   THE DEFECT: node 20161 granted STOCK 33891, whose CLIENT Description hardcodes cross-spell
#   references -- "you increase healing received by $34123s1% for all party and raid members within
#   $34123a1 yards" -- which the client resolves against the WotLK 34123 row (+6%, radiusIndex 12 =
#   100 yd raid). Both the talent-panel tooltip (the addon hyperlinks a node's granted spell, see
#   gen_era_talents.py::_grant_is_client_visible) and the spellbook/stance-bar tooltip therefore
#   promised WotLK's +6% raid aura even though the MECHANIC ships TBC's (946265 -> 946266, with
#   stock 34123 suppressed by era_dru_tree_of_life_suppress). Stock 33891's DBC row is global and
#   may not be edited (eras are per-character, spells are global), and the $34123... references
#   cannot be re-pointed -- only a CLONE with its own authored Description can carry the TBC text.
#   THE CLONE: 946276 templates 33891 and re-authors ONLY the client strings. Every cast-relevant
#   field is inherited verbatim, which is what keeps the form mechanic intact:
#     * Effects re-authored byte-identically to 33891 (the generator lints that a `template:` helper
#       must author `effects:`): aura 36 MOD_SHAPESHIFT misc 2 = FORM_TREE, and aura 77
#       MECHANIC_IMMUNITY misc 17 = Polymorph. Same tuples, same basePoints/dieSides/targets.
#     * Attributes 327696 / AttributesEx 98304 / AttributesEx4 2097152, ManaCostPct 28,
#       DurationIndex 21, CastingTimeIndex 1, RangeIndex 1, SpellVisualID 8598, SpellIconID 2257,
#       ActiveIconID 122, NameSubtext "Shapeshift", SpellClassSet 7 / mask B 65536 -- all inherited.
#     * StanceBarOrder 4 is inherited, and that is the field the 3.3.5a client reads to place a form
#       on the stance bar; skillLine 573 (Restoration) reproduces stock 33891's SkillLineAbility row
#       (15089: SkillLine 573, ClassMask 1024) so the spellbook tab is unchanged.
#   WHY THIS DOES NOT BREAK THE MECHANIC: the form is keyed on the AURA's GetMiscValue(), never on
#   the spell id. AuraEffect::HandleShapeshiftBoosts (SpellAuraEffects.cpp:1355) switches on
#   GetMiscValue() to hardcast 34123, and its PASSIVE|DO_NOT_DISPLAY sweep
#   (SpellAuraEffects.cpp:1443-1457) walks the player's WHOLE spell map applying anything whose
#   Stances include the form -- which is how 946265 -> 946266 fires, independent of what caused the
#   form. Unit::GetModelForForm (Unit.cpp:15477) hardcodes only 7090/35200, then resolves by FORM.
#   And 33891 appears NOWHERE by id in src/server (grep). The suppression gate is
#   HasSpell(946265), which the kEraDruidTbcPaired arm still supplies unchanged.
- id: 946276
  name: Tree of Life
  template: 33891
  effects:
  - { effect: 6, aura: 36, basePoints: -1, dieSides: 1, misc: 2, targetA: 1 }    # MOD_SHAPESHIFT, FORM_TREE — verbatim from 33891
  - { effect: 6, aura: 77, basePoints: -1, dieSides: 1, misc: 17, targetA: 1 }   # MECHANIC_IMMUNITY, Polymorph — verbatim from 33891
  client:
    name: Tree of Life
    icon: 2257
    # The whole point of the clone: TBC prose with NO cross-spell `$34123...` references, so the
    # client renders the shipped behavior instead of resolving the WotLK 34123 row.
    description: "Shapeshift into the Tree of Life.  While in this form you increase healing received by all party members within 45 yards by an amount equal to 25% of your total Spirit, and you can only cast Restoration spells in addition to Innervate, Barkskin, Nature's Grasp and Thorns spells.\n\nThe act of shapeshifting frees the caster of Polymorph and Movement Impairing effects."
    auraDescription: "Immune to Polymorph effects.  Increases healing received by all party members within 45 yards by an amount equal to 25% of your total Spirit."
    skillLine: 573
