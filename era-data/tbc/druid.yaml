    #     FORM_TREE, keyed on the FORM — no HasTalent gate, no script, and line 1359 is the only
    #     occurrence of 34123 in the whole fork. So an era druid gets it whatever we grant.
    #   * TBC 34123 is APPLY_AREA_AURA_PARTY, aura115 MOD_HEALING (a FLAT healing-taken bonus, fully
    #     implemented here at Unit.cpp:9747), basePoints 0, radiusIndex 11 (45 yd) — the amount was
    #     computed server-side from the druid's Spirit (TBC tooltip: "25% of your total Spirit").
