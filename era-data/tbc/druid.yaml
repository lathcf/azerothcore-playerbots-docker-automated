# Final review deferred-gaps round (2026-09-07, G-6): the CORE script also returns 8% mana on the crit
# heal for Improved LotP (WotLK 3.0). era_dru_leader_of_the_pack is the same HandleProc without it.
# The on-crit LotP heal is simply dead without a binding — spell_script_names accepts any registered
# script name for any spell id, custom-band or not — the same "bind a script to our id" idiom the
# Vanilla paladin Eye for an Eye clones (932608/932609 -> spell_pal_eye_for_an_eye) already ship.
- { spell: 946257, script: era_dru_leader_of_the_pack }
# Tree of Life, Route B half 2: the TBC party aura's amount is 25% of the caster's total Spirit,
# computed in DoEffectCalcAmount (basePoints 0 in the DBC is TBC's own value, not a magnitude).
- { spell: 946266, script: era_dru_tree_of_life }
# Tree of Life, Route B half 1: bound to STOCK 34123. AuraEffect::HandleShapeshiftBoosts hardcasts
# 34123 on FORM_TREE unconditionally (SpellAuraEffects.cpp:1359, keyed on the FORM, no HasTalent
# gate), so the WotLK +6% raid aura must be SUPPRESSED for an era-managed TBC druid or it
# double-dips with 946266. The script is era-band OWNERSHIP-gated (HasSpell(946265)) and is a
# no-op for every other druid, so binding it to a stock id is safe: spell_script_names accepts any
# registered script for any id, the same "bind a stock script / bind to a stock id" idiom the
# Vanilla rogue Sap (18499/5138) and paladin Eye for an Eye clones already ship. Binding a SCRIPT
# to a stock id is NOT a stock-spell edit — no spell_dbc row and no SpellInfo field is touched.
- { spell: 34123, script: era_dru_tree_of_life_suppress }
