  spec_bucket_contradictions:
  - node: 20159
    name: Natural Perfection
    spec_bucket: diverged
    live_bucket: clean
    evidence: 'All three rank spells 33881/33882/33883 are byte-identical on every used effect slot (e1 aura 42
      PROC_TRIGGER -> 45281/45282/45283 with mask A word-A 32; e2 aura 57 MOD_SPELL_CRIT_CHANCE basePoints 0/1/2
      misc 127), and so are the three absorb spells 45281-45283 (e1 aura 87 MOD_DAMAGE_PERCENT_TAKEN basePoints
      -3 misc 127). The only raw diffs were unused-slot padding. Sole real delta is one ProcTypeMask bit (see non_effect_divergences).
      DISPOSITION: grant the stock chain; no clone.

      '
  - nodes:
    - 20114
    - 20140
    - 20142
    - 20145
    - 20148
    names:
    - Moonfury
    - Predatory Instincts
    - Improved Mark of the Wild
    - Nature's Focus
    - Subtlety
    spec_bucket: missing ranks (implied otherwise clean)
    live_bucket: diverged AND missing ranks
    evidence: '§2 presents its three buckets as mutually exclusive, so a node in ''Missing ranks'' reads as ''the
      surviving ranks are fine''. They are not: every one of these five is ALSO value-retuned on its surviving ranks
      — e.g. Moonfury r1-r3 TBC +2/4/6% (bp 1/3/5) vs WotLK +3/6/10% (bp 2/5/9); Improved MotW r1-r2 TBC +7/14%
      (bp 6/13) vs WotLK +20/40% (bp 19/39); Nature''s Focus r1-r3 TBC -14/28/42% (bp 13/27/41) vs WotLK -23/46/70%;
      Subtlety r1-r3 TBC -4/-8/-12% threat vs -10/-20/-30%; Predatory Instincts r1-r3 TBC crit-damage +2/4/6% +
      AoE-avoidance vs WotLK +3/7/10% + a different aura (229 MOD_AOE_DAMAGE_AVOIDANCE). DISPOSITION: no change
      in mechanism — all five are passives the auto-passive band covers for free at TBC values. Recorded so Task
      6/7 authors the retuned numbers rather than granting stock.

      '
  - node: 20112
    name: Nature's Grace
    spec_bucket: clean
    live_bucket: clean on EFFECTS, DIVERGED on ProcChance
    evidence: 'See non_effect_divergences 16880 — TBC 100% vs live 33%. The §2 diff was effect-only and could not
      see it. This is the one place where ''Clean'' would have shipped a wrong number.

      '
  reuse_ledger:
    932504:
      what: Nature's Grace -0.5s next-cast buff (clone of 16886)
      node: 20112
      verdict: REUSE_WITH_GAP
      evidence: 'TBC 16886 EFFECT_0 = (Effect 6 APPLY_AURA, aura 107 ADD_FLAT_MODIFIER, basePoints -501, misc 10
        SPELLMOD_CASTING_TIME) = a flat -500ms. Live/WotLK 16886 = (6, aura 65 MOD_CASTING_SPEED_NOT_STACK, basePoints
        19 = +20% haste, misc 10) — a different mechanic. 932504 was built as exactly the TBC shape (aura 107, misc
        10, basePoints -500, procCharges 1), so the MAGNITUDE and MECHANIC reuse cleanly.

        '
      gap: 'DURATION. TBC 16886 DurationIndex 8 = 15000ms; 932504 uses DurationIndex 21 (-1, persists until consumed).
        A TBC druid can bank the buff indefinitely instead of losing it after 15s. Cheap to close: one fresh 946-band
        clone identical to 932504 with durationIndex 8.

