# TBC DRUID hand-helper slice 946256-946511 (framework registry). BALANCE tab (Task 6) claims
# 946267 / 946268 (Nature's Grace) and 946270-946275 (Nature's Grasp). FERAL COMBAT tab (Task 7)
# claims 946256 / 946257 (Leader of the Pack) and 946258-946263 (Mangle Bear + Cat r1-r3).
# 946264-946266 and 946269 stay reserved by Amendment A.4 for Task 8 (the "Era: TBC Druid" marker,
# Tree of Life, Omen of Clarity). 946276 = the Tree of Life FORM clone (fix round 2026-08-31; Task 7
# had evaluated and DECLINED a Faerie Fire (Feral) clone at this id -- see node 20133 and
# _ref.accepted_gaps.faerie_fire_feral_substrate -- leaving it free). 946277-946511 free.
# ---------------------------------------------------------------------------------------------------
# Nature's Grace (node 20112). TWO helpers, per Amendment A.1/A.4:
#   946267 = the TALENT CARRIER. Stock 16880 procs at ProcChance 33 on this core (WotLK split the
#            talent into a 3-rank 33/66/100% chain and left rank 1 at 33%); TBC node 20112 is
#            maxRank 1 at 100%, so granting stock ships one third of the talent. The clone sets
#            ProcChance 100 AND carries its own spell_proc row -- flags 81920
#            (DONE_SPELL_MAGIC_DMG_CLASS pos+neg), typeMask 3 (DAMAGE|HEAL), hitMask 2 (CRIT ONLY),
#            chance 100 -- byte-for-byte the wiring the shipped Vanilla node 18712 uses. Without a
#            spell_proc row the core would fall back to the inherited DBC ProcTypeMask 87376 and
#            proc on every spell hit, not only crits.
#            NO client: block on purpose -- it is a hidden passive (Attributes 464 inherited =
#            PASSIVE|HIDDEN|DO_NOT_LOG), and a client-less grant makes the addon keep node 20112's
#            authored prose instead of hyperlinking a blank tooltip (the Redoubt/Reckoning
#            precedent, gen_era_talents.py::_grant_is_client_visible).
- id: 946267
  name: Nature's Grace
  template: 16880
  procChance: 100
  effects:
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 946268 }
  proc:
    # DONE_SPELL_MAGIC_DMG_CLASS_NEG(0x10000=65536)|POS(0x4000=16384) = damage + heal spells.
    # NOT 327680: that is NEG|DONE_PERIODIC(0x40000), which drops heal crits (the tooltip says
    # "All spell criticals") and adds periodic crits TBC did not have.
    flags: 81920
    typeMask: 3
    hitMask: 2
    chance: 100
#   946268 = the BUFF. Same -500ms shape as the Vanilla clone 932504 (aura107 ADD_FLAT_MODIFIER,
#            misc 10 SPELLMOD_CASTING_TIME, 1 charge) but at DurationIndex 8 = 15000ms, which is
#            TBC's real window; 932504 uses index 21 (-1 = persists until consumed), so reusing it
#            would let a TBC druid bank the -0.5s indefinitely (Amendment A.3, reuse_ledger 932504).
#            The per-effect EffectSpellClassMask is INHERITED from live 16886
#            (A=16777831 / B=58720288 / C=512): it is a strict SUPERSET of TBC's own
#            (16777831 / 32 / 0), and every extra bit belongs to a WotLK-only druid spell a TBC-era
#            character cannot have -- so nothing in TBC's set is lost and nothing reachable is added.
- id: 946268
  name: Nature's Grace
  template: 16886
  durationIndex: 8
  procCharges: 1
  effects:
  - { effect: 6, aura: 107, basePoints: -500, dieSides: 0, misc: 10, targetA: 1 }
  client:
    name: Nature's Grace
    icon: 10
    auraDescription: Reduces the casting time of your next spell by 0.5 sec.
