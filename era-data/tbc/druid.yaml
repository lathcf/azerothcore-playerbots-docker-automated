# Improved Faerie Fire r1-r3 companion debuffs (node 20118), added 2026-08-31. TBC delivered this
# talent as two SPELLMODs onto Faerie Fire's own EFFECT_2/EFFECT_3 (aura184 melee hit / aura185
# ranged hit, base 0). Stock 3.3.5a Faerie Fire has neither effect, so the spellmod shape is
# unportable and shipped inert; these three carry the real auras instead and are cast on the Faerie
# Fire target by the node's aura109 ADD_TARGET_TRIGGER at 100%. See node 20118 for why cloning
# Faerie Fire itself was rejected (it would break the bear-form Feral cast).
#
# template: 770 so the debuff inherits Faerie Fire's OWN plumbing and can never drift from it —
# DispelType 1 (magic: dispelling Faerie Fire's companion behaves like dispelling Faerie Fire),
# SchoolMask 8 (nature), RangeIndex 4, CastingTimeIndex 1, SpellIconID 109. A templated helper
# 0-fills every effect slot it does not author, so stock 770's armor-shred (Effect_1) and its
# vestigial aura186 spell-hit (Effect_3) are BOTH dropped rather than leaking through.
#
# attributes MUST be overridden, not inherited: stock 770 carries 65536 SPELL_ATTR0_NOT_SHAPESHIFTED
# (the very reason Faerie Fire (Feral) exists as a separate spell), and a bear-form druid casting
# FFF must still land this. 67108864 = SPELL_ATTR0_AURA_IS_DEBUFF, required because the amounts here
# are POSITIVE numbers that are BAD for the target — without it the core's positivity heuristic can
# read the aura as a buff and mis-handle it on an enemy.
#
# attributesEx MUST likewise be overridden to 0, and this one is a CLONE-OF-A-CORRECTED-SPELL trap:
# stock 770's AttributesEx is 98304, which includes SPELL_ATTR1_IMMUNITY_TO_HOSTILE_AND_FRIENDLY_
# EFFECTS (0x10000) — and SpellInfoCorrections.cpp:1266 CLEARS that bit from 770/16857 BY ID at load.
# A clone is not in that id list, so it would inherit the UNcorrected value and keep a bit the core
# considers wrong for Faerie Fire: Spell.cpp:6967 reads it on the aura being applied, so the
# companion debuff could land on a target whose school immunity blocks the Faerie Fire it is
# supposed to accompany. Neither immunity bit does anything for a spell with no immunity effects
# (every consumer is behind an `if (!immuneInfo) return;` plus a non-zero immunity mask), so 0 is
# both safe and the honest value here.
#
# durationIndex 5 (300000ms) is authored explicitly, not inherited, because it is COUPLED to the
# Faerie Fire the player actually applies: nodes 20118/20133 ship STOCK 770/16857, which are 5 min
# on this core. TBC's own Faerie Fire was 40s (index 64, _ref.diverged 16857) — if a future phase
# ever clones Faerie Fire to TBC duration, these three must move with it or the hit bonus outlives
# the debuff that is supposed to carry it.
- id: 946277
  name: Improved Faerie Fire
  template: 770
  attributes: 67108864
  attributesEx: 0
  durationIndex: 5
  effects:
  - { effect: 6, aura: 184, basePoints: 1, dieSides: 0, targetA: 6 }   # MOD_ATTACKER_MELEE_HIT_CHANCE +1%
  - { effect: 6, aura: 185, basePoints: 1, dieSides: 0, targetA: 6 }   # MOD_ATTACKER_RANGED_HIT_CHANCE +1%
  client:
    name: Improved Faerie Fire
    icon: 109
    # description is authored, NOT inherited: templating off 770 otherwise carries stock
    # Faerie Fire's own "Decrease the armor of the target by $s1%" prose, which this clone
    # does not do at all (its Effect_1 is the melee-hit aura, so $s1 would even render the
    # hit % as an armor number). Unreachable in practice — never learned, never in a
    # spellbook, and node 20118 is a non-grant node so the talent panel shows its own
    # prose — but wrong text shipped in the client patch is not worth carrying.
    description: "Increases the chance the target will be hit by melee and ranged attacks by 1% for $d."
    auraDescription: "Chance to be hit by melee and ranged attacks increased by 1%."
