# needs an era anchor: the Nature's Grasp and Mangle chains both anchor on their own talent-granted
# rank 1 (the TALENT-anchor flavor of the trainer gate, not the BASELINE-marker flavor), and the
# Restoration tab adds no trainer rows at all.
# ---------------------------------------------------------------------------------------------------
# Omen of Clarity (node 20149). ONE fresh clone; the Vanilla castable clone 932512 is NOT reused
# (Amendment A.3/A.4, _ref.reuse_ledger 932512 + _ref.non_effect_divergences 16864). Three of the four
# fields diverge and only the 120 mana matches:
#   * DurationIndex 30 = 1800000 ms (30 min). 932512 uses index 6 = 10 min.
#   * ProcTypeMask 20 = DONE_MELEE_AUTO_ATTACK (0x4) | DONE_SPELL_MELEE_DMG_CLASS (0x10), i.e. MELEE
#     ONLY, matching TBC's "Each of the Druid's melee attacks". 932512 inherits stock 16864's 81924,
#     which also procs off magic spell hits.
#   * a 10-second internal cooldown (TBC SpellAuraOptions.ProcCategoryRecovery 10000, rendered by
#     wowhead as "(10s cooldown)"). 932512 has none.
# `attributes: 0` strips live 16864's PASSIVE|DO_NOT_DISPLAY (192) so this is a real castable
# spellbook button — stock 16864 is a hidden passive that grants no spellbook entry at all — and
# castTimeIndex 1 keeps it instant. manaCostPct 0 is the flat-cost-clone discipline (16864's is
# already 0, so it is defensive).
# The PROC RATE + the ICD + the CheckProc filtering are HAND SQL
# (2026_08_31_04_era_talent_tbc_druid_omen.sql): stock Omen is gated by a spell_proc row at 3.5 PPM
# plus the core spell_dru_omen_of_clarity AuraScript.
# STALE-CLAIM CORRECTION (2026-09-01): this comment used to add "the generator hardcodes
# ProcsPerMinute 0" as the reason the rate could not come from the dataset. That is NO LONGER TRUE —
# TBC shaman Task 7 added a `ppm:` proc key to tools/gen_era_talents.py, and it emits a FLOAT, so
# `proc: { ppm: 3.5, chance: 0 }` now expresses this row's rate exactly. The hand SQL still works and
# is deliberately left alone (it is shipped, reviewed and real-client-verified content, and folding
# it back in would bump the generation stamp for no behavioural gain), but a NEW clone of a
# PPM-rated proc should use the key rather than copy this file. The second half of the original
# justification also still stands: this row wants ProcFlags 0 ("use the spell's own DBC events"),
# and the generator zeroes SpellPhaseMask for that shape.
# That file mirrors the shipped Vanilla precedent 2026_08_21_01_*omen_proc.sql exactly, with
# Cooldown 10000 added. ProcFlags stays 0 there ("use the spell's own DBC events") — which is why
# the melee-only mask has to live in the DBC row above, not in the proc row.
- id: 946269
  name: Omen of Clarity
  template: 16864
  attributes: 0              # remove PASSIVE|DO_NOT_DISPLAY -> castable button
  castTimeIndex: 1           # instant
  durationIndex: 30          # 1800000 ms = 30 min (TBC; the Vanilla clone is index 6 = 10 min)
  powerCost: 120             # 120 mana (the one field TBC and Vanilla agree on)
  manaCostPct: 0             # defensive: clones inherit ManaCostPct (16864's is already 0)
  procTypeMask: 20           # MELEE ONLY (live 16864 is 81924 = melee + magic spell hits)
  effects:
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 16870 }  # PROC_TRIGGER -> Clearcasting 16870
  client:
    name: Omen of Clarity
    icon: 1754
    description: "Imbues the Druid with natural energy. Each of the Druid's melee attacks has a chance of causing the caster to enter a Clearcasting state. The Clearcasting state reduces the Mana, Rage or Energy cost of your next damage or healing spell or offensive ability by 100%. Lasts 30 min."
    auraDescription: "Each of your melee attacks has a chance to reduce the cost of your next spell or ability by 100%."
    skillLine: 573           # Restoration spellbook tab (TBC moved Omen from Balance to Restoration)
