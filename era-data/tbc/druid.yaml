# "Era: TBC Heart of the Wild" marker (node 20135), added 2026-08-31. Arms CORE PATCH 0023.
#
# TBC's Heart of the Wild gives Bear/Dire Bear Stamina equal to the FULL Intellect % (4/8/12/16/20),
# but AuraEffect::HandleShapeshiftBoosts computes the per-form bonus as `amount / 2` (WotLK's retune)
# and casts serverside 24899 with it — so the node shipped promising 20% and delivering 10%. The
# magnitude lives in CORE CODE, not in spell data, which is exactly why the effect-diff pipeline
# never saw it: the granted stock chain 17003-24894 is byte-identical between the eras.
#
# Why this is the framework's step-6 escape hatch and not data: the halved value is derived from the
# stock, GLOBAL Intellect aura (eras are per-character, so it cannot be edited), and a second
# stance-gated Stamina top-up cannot reach the tooltip numbers either — MOD_TOTAL_STAT_PERCENTAGE
# auras combine MULTIPLICATIVELY (Unit::GetTotalAuraMultiplier -> AddPct), so the exact top-ups are
# 1.96/3.85/5.66/7.41/9.09% and the nearest integers land 19.90% at rank 5, not 20%.
