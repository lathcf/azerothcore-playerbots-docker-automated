    resolution: 'REVERTED at Task 7 review. The first revision of 2026_08_31_03 DELETEd those rows, following this file''s own baseline_leaks `delete_for_era` disposition. Two things were wrong with it. (1) It was a LIVE REGRESSION for native WotLK druids, who never touch the era system: the stock chain continues past rank 3 -- 48563 (Bear r4, L75) has ReqAbility1 = 33987 and 48565 (Cat r4, L75) has ReqAbility1 = 33983 -- so removing r2/r3 stranded every native druid at Mangle rank 1, r4/r5 included, with NO compensating grant anywhere in the module. This is the point of disanalogy with the Nature''s Grasp precedent it was modelled on: THAT deletion is compensated by the kWotlkDruidNG level-grant in EraTalents.cpp CLASS_DRUID arm (2); Mangle has no such arm. (2) It was UNNECESSARY. The stock chain already self-gates against an era character -- stock r2 requires stock r1 (33986 <- 33878, 33982 <- 33876) and a TBC druid holds 946258/946261, never 33878/33876. Verified there is no other path to the stock rank 1: no trainer_spell row of its own (taught only by the 33917 SPELL_EFFECT_LEARN_SPELL wrapper, which only the native _addTalentAurasAndSpells path can process, and Player::addSpell refuses that effect outright) and SkillLineAbility AcquireMethod 0, so learnSkillRewardedSpells never auto-teaches it. The migration now RESTORES the four rows idempotently instead of deleting them, so a database that applied the earlier revision is repaired.'
