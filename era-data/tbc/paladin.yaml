    affectsMask: { a: 3223322624, b: 65536, c: 0 }   # verbatim copy of the widened -20210 row's family mask
    typeMask: 0             # stock row is 0 = no SpellTypeMask filter (the proc event is a HEAL, not damage)
    phaseMask: 2            # PROC_SPELL_PHASE_HIT
