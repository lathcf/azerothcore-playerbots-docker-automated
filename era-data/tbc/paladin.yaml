#     Repentance incapacitates for **6 sec** and works on **Humanoids only**; live 20066 is WotLK's
#     widened form (DurationIndex 3 = 60 s, TargetCreatureType 118 = a much broader victim set), so
#     granting stock shipped a tooltip promising 6 s / Humanoid over a 1-minute all-types CC. Both
#     divergences are pure DBC scalars, so the clone authors NO effects at all and inherits stock
#     20066's aura 12 MOD_STUN / mechanic 14 / 60 s cooldown / range / GCD verbatim.
#     `targetCreatureType: 64` is the CREATURE_TYPE_HUMANOID BIT (1 << (7-1)), not the type id — see
#     the framework field-semantics table. Stock 20066 is talent-granted only, so the TBC stock-swap
#     table in EraTalents.cpp strips it once this node grants the clone. --------------------------
- id: 946146
  name: Repentance
  template: 20066
  durationIndex: 32         # 6000 ms (live index 3 = 60 s)
  effects:                  # stock 20066's own single effect, re-authored verbatim (a `template:`
  - { effect: 6, aura: 12, basePoints: 0, dieSides: 0, targetA: 6 }   # clone must author its effects)
  - {}
  - {}
  targetCreatureType: 64    # CREATURE_TYPE_HUMANOID only (live 118 = Humanoid+Demon+Giant+Undead+Dragonkin)
  client:
    name: Repentance
    icon: 316               # stock 20066 SpellIconID
    description: "Puts the enemy target in a state of meditation, incapacitating them for up to 6 sec. Any damage caused will awaken the target. Only works against Humanoids."
    auraDescription: "Incapacitated. Any damage caused will awaken the target."
    skillLine: 184          # Retribution tab (castable)

