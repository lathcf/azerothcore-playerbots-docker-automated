# --- Illumination (node 20008) — FRESH TBC clones 946141-145 of the stock chain 20210/20212-215
#     (final review G-1). TBC Illumination refunds **60%** of the healing spell's base mana cost;
#     live 3.3.5a 20210-20215 carry WotLK's 3.0.2 retune (EffectBasePoints_2 29 => 30%), and the
#     node's grant of the stock chain therefore shipped a tooltip promising 60% over a mechanic
#     delivering 30%. The refund % is read by the CORE AuraScript `spell_pal_illumination` off the
#     aura's OWN Effect_2 (`aurEff->GetSpellInfo()->Effects[EFFECT_1].CalcValue()`,
#     azerothcore-wotlk/src/server/scripts/Spells/spell_paladin.cpp:1994-2040), so a clone with
#     EffectBasePoints_2 59 (+DieSides 1 = 60) plus a `scriptBindings` entry to that same script is
#     the whole fix — no core patch, no era script.
#     Each clone re-authors all three effect slots verbatim from its template (E1 aura42
#     PROC_TRIGGER_SPELL -> stock energize carrier 18350; E2 aura112 OVERRIDE_CLASS_SCRIPTS misc 2689
#     = the script hook the core binds on; E3 empty) and changes ONLY E2's basePoints. Everything else
#     — Attributes, the inherited EffectSpellClassMask, SpellIconID 241 — comes from the template.
#     Each also needs its OWN `spell_proc` row: acore's stock row is keyed on the NEGATIVE id -20210
#     ("20210 and every rank in ITS spell_ranks chain"), which a clone is not in. The rows below
#     mirror the module's widened -20210 row byte-for-byte
#     (2026_08_30_20_era_holy_shock_illumination_proc.sql: family 10, mask0 0xC0200000 = Holy Light |
#     Flash of Light | the era Holy Shock heal executors' word-A bit21, mask1 0x00010000 = stock
#     WotLK HS heal's word-B bit16, SpellTypeMask 0 = no type filter so a HEAL qualifies,
#     SpellPhaseMask 2 HIT, HitMask 2 CRIT-only). `flags` is spelled out as 20210's own DBC
#     ProcTypeMask 17408 rather than left 0: the core substitutes the DBC value for a 0 ProcFlags
#     (SpellMgr.cpp:2079) but the generator zeroes — and hard-errors on — a phase/hit mask authored
#     alongside flags 0, and a zero SpellPhaseMask would make the proc never fire.
#     Stock 20210-20215 are TALENT-GRANTED ONLY, so a TBC paladin can hold them only from the NATIVE
#     WotLK frame — EraTalents.cpp's readiness-gated TBC stock-swap table strips them. ------------
- id: 946141
  name: Illumination
  template: 20210
  effects:
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, trigger: 18350, targetA: 1 }   # PROC_TRIGGER_SPELL -> stock energize carrier
  - { effect: 6, aura: 112, basePoints: 59, dieSides: 1, misc: 2689, targetA: 1 }     # OVERRIDE_CLASS_SCRIPTS 2689; CalcValue 59+1 = 60% refund (TBC; live is 29+1 = 30%)
  - {}
  proc:
