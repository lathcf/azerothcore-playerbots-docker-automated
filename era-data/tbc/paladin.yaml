    # _ref: reconstruct — TBC Aura Mastery is a PASSIVE aura-radius spellmod (WotLK 31821 is an active
    # cooldown; do NOT grant it). Authored as a data-only radius spellmod: op radius +10yd, bound to
    # ALL paladin auras via the shared family-10 word-C bit5 (maskC 32). No helper/C++ needed — core
    # CalcRadius applies SPELLMOD_RADIUS via GetSpellModOwner (SpellInfo.cpp:564). affectsMask
    # overrides to C bit5 alone so EVERY aura (incl. resistance auras) gains radius (intended
    # all-aura reach, not a leak). TOOLTIP DIVERGENCE (sanity-audit fix, user decision 2026-08-30):
    # wago says "to 40 yards" because TBC base aura radius was 30yd — but on this 3.3.5a core every
    # stock paladin aura is ALREADY EffectRadiusIndex 23 = 40yd, so the authentic end-state is the
    # untalented baseline. Keeping the +10yd (40->50yd) keeps the point meaningful; the tooltip now
    # states the actual behavior ("by 10 yards") instead of the unreachable original.
    mechanic: spellmod
    affects: [Devotion Aura, Retribution Aura, Concentration Aura]
    affectsMask: { a: 0, b: 0, c: 32 }
    op: radius
    kind: flat
    vals: [10]
