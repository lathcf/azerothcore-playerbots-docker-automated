# --- Seal Training marker "Era: TBC Paladin" (946078) — the TBC analog of the Vanilla 932749 marker.
#     A hidden PERMANENT passive granted to every TBC-era paladin by ReconcileBaselineSpells
#     (EraTalents.cpp CLASS_PALADIN TBC arm); its ONLY role is the trainer ReqAbility1 anchor for
#     every 946xxx seal/Judgement rank-1 trainer_spell row (2026_08_27_02), checked purely by
#     PRESENCE. Originally shipped as a hand-SQL byte-copy in 2026_08_27_02 with NO client row —
#     which BROKE the whole trainer window: Blizzard_TrainerUI.lua:319 (ClassTrainer_SetSelection)
#     formats the ReqAbility NAME unconditionally, the client resolves it from ITS Spell.dbc, and an
#     unknown id -> format(nil) Lua error -> empty trainer list (real-client repro 2026-08-30; the
#     hunter markers 932304/305 already carried client blocks for exactly this). Moved here so the
#     generator owns the server row AND the client row. The client block makes the marker resolvable
#     ("Requires TBC Seal Training" on red rows) — the PASSIVE_ATTR mask keeps it out of the
#     spellbook, mirroring 932304. ----------------------------------------------------------------
- id: 946078
  name: "Era: TBC Paladin"
  attributes: 262608       # PASSIVE + hidden -> self-applies on learn, no spellbook entry
  effects:
  - { effect: 6, aura: 4, basePoints: 0, misc: 0, targetA: 1 }   # inert DUMMY, presence-checked only
  client:
    name: "TBC Seal Training"
    icon: 1

