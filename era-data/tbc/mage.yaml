      bit).'
  method:
    conventions:
      effect_slot_numbering: 'THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/_2/_3 (array indices
        0/1/2). The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is this map''s e1.'
      magnitudes_are_effective: Every magnitude is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides == 1`, else
        `basePoints`. Both sides are normalised identically before diffing. Where a spell has a real damage RANGE the line
        prints `val=<max> dieSides=<n>(raw bp=<raw>)` so an author can reproduce it exactly (e.g. Pyroblast r1 `val=140 dieSides=47(raw
        bp=140)` = 141-187 before level scaling; Wowhead's level-70 render says 148-195 because of `perLevel=1.9`).
      indices_are_build_stable: "DurationIndex / CastingTimeIndex / RangeIndex / EffectRadiusIndex are indexes into separate\
        \ DB2 tables. SpellDuration / SpellCastTimes were fetched for 2.5.4.44833; the indices this id set uses decode as:\n\
        \  SpellDuration  3=60000  8=15000  9=30000  18=20000  21=-1(permanent)  22=45000  27=3000\n                 28=5000\
        \  29=12000  31=8000  32=10000  35=4000  39=2000  65=1500\n  SpellCastTimes 1=0(instant)  3=500  5=2000  6=5000  16=1500\
        \  171=6000\nTWO INDEPENDENT ANCHORS confirm the cast-time table is the same on both sides, which is what the Pyroblast\
        \ verdict turns on: the cached Wowhead TBC tooltip for 11366 reads **\"6 sec cast\"** and wago gives `castIdx=171`\
        \ = 6000; live 3.3.5a Pyroblast is the well-known 5 s cast and its `castIdx=6` = 5000 in the same table. Likewise\
        \ Dragon's Breath: TBC `durIdx=27` = 3000 and the tooltip says \"Disoriented for 3 sec\"; live `durIdx=28` = 5000."
      verdict_vocabulary: "LIVE_MATCH = every field in the fourteen verdict families agrees. DIVERGED = at least one differs.\
        \ WAGO_ONLY = present in TBC 2.5.4, ABSENT from BOTH `Spell.dbc` and `acore_world.spell_dbc` —\n  must be authored,\
        \ never granted.\nLIVE_ONLY = present live, absent from TBC — must not be reachable by a TBC mage. LIVE_OVERLAY =\
        \ absent from Spell.dbc but present in the `acore_world.spell_dbc` overlay. LIVE_MATCH_UNVERIFIED_SLOT = all compared\
        \ fields agree but a LIVE effect slot has no wago\n  SpellEffect row (DB2 stores no empty-effect row, so absence is\
        \ not evidence of a zero).\n  SIX ids: 11247/12606 (Magic Attunement), 31569/31570 (Improved Blink), 31574/31575\n\
        \  (Prismatic Cloak) — each hand-adjudicated in `live_extra_slots:`; ALL THREE turn out to be\n  real WotLK ADDITIONS,\
        \ so all three nodes are AUTHOR, not GRANT.\n**A LIVE_MATCH verdict is NOT by itself a licence to GRANT.** Four independent\
        \ hazards sit outside the verdict families and each has bitten a node here: a LIVE EXTRA SLOT (`live_extra_slots:`),\
        \ an id-repurposed NAME (`id_repurposing:`), a magnitude that lives in CORE CODE (`core_hardcodes:` — Shatter and\
        \ Molten Fury are textbook lesson-20 cases; Shatter reads LIVE_MATCH on all fourteen families at ranks 1-3 and is\
        \ still era-wrong), and a TRIGGERED PAYLOAD that diverges while the talent rank does not (Improved Blizzard's chill,\
        \ Improved Counterspell's silence, Improved Blink's buffs)."
      tbc_line_is_authoritative: Every `survival_map` entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record needed
        to reproduce the spell, and a `live:` line = the same shape read from `ip-dbc/Spell.dbc`. Tasks 2-4 author FROM THESE
        LINES and do not re-fetch wago. A field absent from a line is zero on that side.
      column_list_gaps: "**Workflow lesson 11, stated up front.** Three DBC column families are NOT compared because wago\
        \ 2.5.4 publishes no table for them:\n  * **Reagent_1..8 / ReagentCount_1..8.** ZERO mage spells in this set carry\
        \ a reagent\n    (checked by hand on the live side for all four cloned chains, Slow, AP, PoM, Combustion\n    and\
        \ the Water Elemental) — unlike warlock, mage has no Soul-Shard analogue.\n  * **EffectItemType_1..3.** On mage this\
        \ column is NEVER a real item: every non-zero value\n    in the id set is the pre-2.0 LEGACY \"affected spell mask\"\
        \ duplicate of the effect's own\n    class-mask word 0 (live 11190 `itemType=512` == mask `0x200`; TBC 11237 `itemType=2048`\n\
        \    == mask `0x800`; TBC 12606 `8192` == `0x2000`; TBC 11151 e2 `128` == `0x80`). Filtered\n    out of the verdict\
        \ — see `noise_filters_applied` — and printed in the lines regardless.\n  * **SpellIconID / ActiveIconID.** Load-bearing\
        \ on mage in exactly one place:\n    `spell_mage_arcane_potency` CheckProc gates on `SpellIconID == 212 (Clearcasting)`\
        \ or\n    `139 (Presence of Mind)`, and `spell_mage_master_of_elements` special-cases the Living\n    Bomb icon (`MAGE_ICON_LIVING_BOMB`).\
        \ Any clone of Clearcasting or PoM would have to carry the stock icon for\n    the stock script to see it — which\
        \ is one more reason node 20817 is AUTHORed with its own\n    script-free proc rather than rebound (see `core_hardcodes.arcane_potency`)."
