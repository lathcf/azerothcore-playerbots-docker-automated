# --- Winter's Chill debuff 948960 (node 20862 triggers it) ---------------------------------------
# CLONE of stock 12579, whose LIVE record was retuned by WotLK: live 12579 is `aura 179
# MOD_ATTACKER_SPELL_CRIT_CHANCE misc **126** val **1**` (+1% crit taken, ALL schools) where wago
# 2.5.4 12579 is `misc 16` (frost) `val 2` — the +2% FROST crit the cached TBC tooltip for 11180
# promises ("by 2% for 15 sec"). Everything else (`durIdx 8` = 15 s, `CumulativeAura 5`, school 16,
# `targetA 6`, family 3, `attributes 0x800000`) is identical in both stores. The Vanilla twin is
# 932764 (vanilla_fix_rows[18048]) — per-era identity, never one shared helper; stock 12579 ships
# untouched (a WotLK mage still gets the all-school +1%).
#
# **`singleAuraStack: true` IS LOAD-BEARING AND IS NOT INHERITED.** `SpellMgr.cpp:3752` applies
# `SPELL_ATTR0_CU_SINGLE_AURA_STACK` to **12579 BY ID** (workflow lesson 14), and without it every
# caster owns a separate aura and `Aura::CanStackWith` REPLACES a rival mage's stack instead of
# incrementing one shared 5-stack debuff. The generator emits the `spell_custom_attr` row for it.
#
# NO `spell_proc` ROW ON THE DEBUFF (Amendment C.3, same shape as Fire Vulnerability 948860): this
# is a plain aura-179 debuff that never procs — stock 12579 has no `spell_proc` row either, and the
# `-11180` proc contract belongs to the TALENT, which node 20862 carries. Lesson 18's "a clone
# inherits no proc row" only bites a clone that PROCS.
#
# INHERITED BY DECISION (the C.3 precedent): live 12579 carries `AttributesEx2 0x4`
# (IGNORE_LINE_OF_SIGHT) and `AttributesEx3 0x40020000` (incl. SUPPRESS_TARGET_PROCS) where wago
# has 0/0. On a PROC-APPLIED debuff those are proc-loop and LoS engine guards, not era magnitudes —
# clearing them would let the debuff's own application drive further procs on this core. They stay.
# Same for the inherited `SpellClassMask_3 = 1` (live's own "Winter's Chill" word-2 identity bit):
# no mask authored anywhere in this tree touches family word 2, so it binds nothing.
#
# The client text is AUTHORED, not inherited: live 12579's Description hardcodes the foreign id
# (`$12579s1`, workflow lesson 7), which on a clone would render STOCK's 1% forever.
