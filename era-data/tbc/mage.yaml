  families_compared:
    A_effects: 'per slot: Effect, EffectAura, EFFECTIVE base points, EffectDieSides, EffectMiscValue_0, EffectMiscValue_1(B),
      EffectTriggerSpell, EffectAuraPeriod, EffectRadiusIndex_0, EffectMechanic, EffectChainTargets, EffectItemType (see the
      legacy-column filter in `noise_filters_applied`), EffectRealPointsPerLevel / EffectMultipleValue / EffectPointsPerCombo
      (floats, 4 dp), ImplicitTarget_0(A), ImplicitTarget_1(B).'
    B_proc_options: ProcChance, ProcCharges, ProcTypeMask, CumulativeAura (wago SpellAuraOptions).
    C_misc: DurationIndex, CastingTimeIndex, RangeIndex, SchoolMask, Speed (float), and ALL EIGHT attribute words (wago SpellMisc.Attributes_0..7
      vs live Attributes/AttributesEx..Ex7).
    D_categories: Category, DefenseType, DispelType, Mechanic, PreventionType, StartRecoveryCategory.
    E_power: ManaCost, ManaCostPct, ManaPerSecond, PowerType (wago SpellPower OrderIndex 0). On mage this family fires far
      less than on warlock — the WotLK flat-mana -> ManaCostPct conversion only reached the LEVEL 65-70 ranks of the trained
      chains (Ice Barrier r6 33405 565 -> 25%, Blast Wave r7 33933 620 -> 28%, Dragon's Breath 31661/33041/33042 475/575/660
      -> 37%, 33043 700 -> 31%) plus Slow 31589 (20% -> 12%). See `accepted_gaps` id 2.
    F_class_options: 'SpellClassSet and the spell''s OWN identity mask WORD 0 only (words 1-3 excluded as cross-build encoding
      noise, per the shaman A.12 / warrior / rogue / warlock precedent). Two hits that matter: **Blast Wave 11113 `ownMaskW0
      TBC 0x800000 -> LIVE 0x0`** (TBC Classic re-encoded Blast Wave''s identity into word 0 bit 23 while 3.3.5a keeps it
      in word 1 bit 6 = 0x40; a TBC clone MUST carry the LIVE encoding, `flagsB 64`, which is what templating 11113 gives
      for free), and **Summon Water Elemental 31687 `TBC 0x80000 -> LIVE 0x0`** (same shape; live keeps it in word 1 bit 11).'
    G_cooldowns: RecoveryTime, CategoryRecoveryTime, StartRecoveryTime (wago SpellCooldowns).
    H_aura_restrictions: 'CasterAuraState, TargetAuraState, ExcludeCasterAuraState, ExcludeTargetAuraState, CasterAuraSpell,
      TargetAuraSpell, ExcludeCasterAuraSpell, ExcludeTargetAuraSpell. wago 2.5.4''s SpellAuraRestrictions is a SPARSE table
      (186 rows) — a row exists only when a restriction is non-default; verified again on this id set. Its two load-bearing
      hits are the mutual ExcludeCasterAuraSpell pair Arcane Power 12042 <-> Presence of Mind 12043, which LIVE has and TBC
      does NOT: **in TBC the two could be used together**, in 3.3.5a they lock each other out. Both are fresh TBC clones (948760
      / 948761), so the clones must NOT author the exclusion.'
    I_shapeshift: ShapeshiftMask, ShapeshiftExclude. ONE hit on the mage id set — 18469 "Counterspell - Silenced" carries
      `stanceMask 0x8000000` in TBC and 0 live; cosmetic here because the payload is cloned for its DURATION anyway (see 20810).
    J_levels: 'BaseLevel, MaxLevel, SpellLevel. This is what supplies every TRAINED-RANK LEVEL in `capstone_chains:` independently
      of any tooltip. ZERO level divergences across all four chains: every TBC rank''s `spellLevel` equals the live `trainer_spell.ReqLevel`
      exactly.'
    K_equipped_item: EquippedItemClass, EquippedItemSubclass, EquippedItemInvTypes. Its only hits are the two Wand Specialization
