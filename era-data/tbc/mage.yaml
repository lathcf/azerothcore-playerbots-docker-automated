# --- Magic Absorption clones 948762-948766 (node 20804) ------------------------------------------
# The CORE script `spell_mage_magic_absorption` (spell_mage.cpp) is bound BY NEGATIVE ID to -29441
# and is therefore dead on the band clones (workflow lesson 6). It is entirely amount-driven —
# `CalculatePct(GetMaxPower(POWER_MANA), aurEff->GetAmount())` off EFFECT_0 and a hardcoded cast of
# 29442 — so re-binding it to each clone reproduces TBC exactly at every rank.
#
# BOUND PER RANK WITH POSITIVE IDS, NOT ONE NEGATIVE CHAIN ROOT. `ObjectMgr::LoadSpellScriptNames`
# resolves a negative id through `SpellMgr::GetFirstSpellInChain` / `GetNextRankSpell`, i.e. through
# `spell_ranks` — and the generator emits no `spell_ranks` rows (every era rank chain in this repo
# gets them from a hand SQL migration). A `-948762` binding on a chain-less clone set would bind
# ONLY rank 1, silently, and ranks 2-5 would lose the mana rider. Five positive bindings need no
# hand SQL and cannot regress if a chain is added later.
- { spell: 948762, script: spell_mage_magic_absorption }
- { spell: 948763, script: spell_mage_magic_absorption }
- { spell: 948764, script: spell_mage_magic_absorption }
- { spell: 948765, script: spell_mage_magic_absorption }
- { spell: 948766, script: spell_mage_magic_absorption }
# --- Combustion clone 948887 (node 20841) --------------------------------------------------------
# `spell_mage_combustion` is bound to the **POSITIVE** id 11129 (dev-box `spell_script_names`,
# 2026-09-05), so a band clone gets nothing. The script IS the mechanic: its `DoCheckProc` casts a
# stack of 28682 and REFUSES the charge on a non-crit hit, and lets the charge drop on a crit — so
# without this rebind the clone would burn a charge on every fire hit and never build the crit buff.
# Positive id, one per rank (Amendment B.2); Combustion has a single rank.
- { spell: 948887, script: spell_mage_combustion }
# --- Dragon's Breath clones 948890-948893 (node 20844) -------------------------------------------
# `spell_mage_dragon_breath` is bound by NEGATIVE id to -31661, which resolves through `spell_ranks`
# and therefore never reaches a band clone. The script is a single `DoCheckProc` that refuses the
# disorient-breaking proc for Living Bomb's explosion — a WotLK spell a TBC mage cannot cast — so
# this rebind is parity insurance rather than a functional requirement (spec A.2 asks for it; the
# ref's disposition row leaves the script column blank, which is the same outcome either way).
# Positive ids per rank (Amendment B.2): a `-948890` binding would cover rank 1 only until Task 5's
# hand SQL adds the chain's `spell_ranks` rows.
- { spell: 948890, script: spell_mage_dragon_breath }
- { spell: 948891, script: spell_mage_dragon_breath }
- { spell: 948892, script: spell_mage_dragon_breath }
- { spell: 948893, script: spell_mage_dragon_breath }
