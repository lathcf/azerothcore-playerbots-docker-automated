  core_hardcodes:
    shatter:
      site: azerothcore-wotlk/src/server/game/Entities/Unit/Unit.cpp:9265-9279
      code: 'SPELL_AURA_OVERRIDE_CLASS_SCRIPTS misc `case 911: modChance += 16; [[fallthrough]] case 910: += 17; [[fallthrough]]
        case 849: += 17;` -> 17 / 34 / 50, gated on `IsAffectedOnSpell(spellProto)` and `HasAuraState(AURA_STATE_FROZEN)`.'
      tbc_data: 5 ranks 11170/12982/12983/12984/12985 with misc **849 / 910 / 911 / 912 / 913**, val 1, aura 112, mask (0x20ea1017,
        0x8, 0).
      live_data: only 3 ranks exist (11170/12982/12983, misc 849/910/911); 12984/12985 are WAGO_ONLY.
      answer_i: '**NO stock Shatter rank may be granted**, and the reason is stronger than "ranks 4/5 are missing". Ranks
        1-3 read **LIVE_MATCH on all fourteen families** — the DBC rows are identical — yet the MAGNITUDE lives in the code
        above, which pays 17/34/50 where TBC''s tooltips say **10/20/30/40/50** (cached 11170 "by 10%", 12985 "by 50%"). Granting
        r1 would give a TBC mage a 17% Shatter; and misc 912/913 have no `case` at all, so even a hypothetical clone carrying
        the TBC misc values would be inert. This is the exact lesson-20 shape (Mutilate / Heart of the Wild). Node 20857 therefore
        AUTHORs five `SPELL_AURA_DUMMY` auto-passives (942856-942860) with **EffectMiscValue 1** and amounts 10/20/30/40/50
        — the Vanilla 18045 shape.'
      patch_0018: 'The era block is `Unit.cpp:9299-9310`: it sums every `SPELL_AURA_DUMMY` on the caster with `GetMiscValue()
        == 1` whose spell id is in `[920000, 933000)`, when the victim `HasAuraState(AURA_STATE_FROZEN)`. It is NOT gated
        on `IsAffectedOnSpell`, which is correct for TBC ("all your spells"). Task 5 widens the upper bound to **950000**
        so the TBC auto-passives at 942856-942860 are read. No other change; the marker stays misc 1 (a MECHANIC flag shared
        across eras, lesson 25''s rule).'
      double_count_guard: 'a granted 11170 would ALSO be summed by the stock block above -> the reconcile must never grant
        a stock Shatter rank to a TBC mage. It does not: node 20857 has no `grants:`.'
    molten_fury:
      site: azerothcore-wotlk/src/server/game/Entities/Unit/Unit.cpp:8530-8537
      code: '`case 4920: case 4919: if (victim->HasAuraState(AURA_STATE_HEALTHLESS_35_PERCENT, ...)) AddPct(DoneTotalMod,
        (*i)->GetAmount());` — deliberately OUTSIDE the `IsAffectedOnSpell` filter (xinef: ''should work on all spells'').'
      answer_j: '**The threshold lives in CORE CODE, the amount lives in data.** TBC 31679/31680 carry `aura 112 misc 4919/4920
        val 10/20`; live carries the same misc values with `val 6/12`. So an AUTHORed node with misc 4919/4920 and amounts
        10/20 gets the right MAGNITUDE for free, but the health gate is `AURA_STATE_HEALTHLESS_35_PERCENT` while the cached
        TBC tooltip 31679 says "targets with less than **20%** health". There is no data field for the threshold (no `TargetAuraState`
        on either side) and no spellmod op for it. Under the zero-new-core-patch policy the node ships with the era-correct
        10/20% at a 35% window — strictly stronger than TBC. **ESCALATED** as `accepted_gaps` id 3.'
    ice_barrier_coefficient:
      site: azerothcore-wotlk/src/server/scripts/Spells/spell_mage.cpp — `float bonus = 0.8068f; bonus *= caster->SpellBaseDamageBonusDone(...)`
        at **:627** (`spell_mage_ice_barrier_aura`) and **:663** (`spell_mage_ice_barrier`). A THIRD `0.8068f` sits at **:537**
        inside `spell_mage_fire_frost_ward` — immaterial here (it is the ward's own absorb, not Ice Barrier's), recorded so
        a future reader does not "fix" it by mistake.
      answer_b: '**RESOLVED 2026-09-05. TBC''s Ice Barrier coefficient is 0.1; live is 0.8068 — an 8x divergence, so node
        20863 CLONES.** The DBC side is clean (r1-r5 byte-identical, r6 differs only in the mana encoding), so this hardcoded
        coefficient was the only possible divergence. wago publishes no coefficient column (coefficients are not DBC data)
        and **wowsims/tbc does not model Ice Barrier at all** (file listing fetched 2026-09-05 — no absorb file, no Ice Barrier
        arm in `talents.go`), so the tiebreaker is a 2.4.3-era server core, per lesson 13.'
      primary_evidence: '**cmangos `mangos-tbc`, `sql/base/mangos.sql` line 14318:** `(11426, 0.1,    0,       0,     0,     ''Mage
        - Ice Barrier''),` — a `spell_bonus_data` row whose second column is the direct/absorb spell-power coefficient. Fetched
        2026-09-05 from `https://raw.githubusercontent.com/cmangos/mangos-tbc/master/sql/base/mangos.sql` (653886 bytes).
        Its neighbours in the same block corroborate the column''s meaning (`(133, 1, ... ''Mage - Fire Ball'')`, `(116, 0.8143,
        ... ''Mage - Frost Bolt'')`, `(543, 0.3, ... ''Mage - Fire Ward'')`). The row applies to the WHOLE chain because the
        same file''s `spell_chain` block roots every rank at 11426 — **lines 14654-14659**: `(11426,0,11426,1,0) (13031,11426,11426,2,0)
        (13032,13031,11426,3,0) (13033,13032,11426,4,0) (27134,13033,11426,5,0) (33405,27134,11426,6,0)`.'
