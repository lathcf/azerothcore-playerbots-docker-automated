#   * `mechanic: 11` (SNARE) at SPELL level, which is where TBC carries it; live moved it onto e1
#     only. The template's EffectMechanic_1 = 11 is left inherited, so the snare is flagged at both
#     levels — a superset of TBC's own shape and the same DR group either way.
#   * `manaCostPct: 20` (TBC) over the inherited live 12.
#   * DurationIndex 8 (15 s), RangeIndex 4 and SchoolMask 64 are identical in both eras; the
#     "only one target at a time" behaviour is the inherited AttributesEx5 0x20.
# ACCEPTED, RECORDED: live 31589 also carries `AttributesEx6 0x800000`, which TBC lacks. There is no
