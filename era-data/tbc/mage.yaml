    O_effect_class_masks: 'Per-effect EffectSpellClassMask words 0/1/2, compared as a SUPPLEMENTARY pass (NOT part of the
      verdict). **Column mapping (rogue''s correction, re-confirmed here): the live names `EffectSpellClassMaskA_1/A_2/A_3`,
      `B_*`, `C_*` are {EFFECT}_{WORD}, NOT {word}_{effect}** (workflow lesson 19). Every `tbc:` and `live:` line in `survival_map:`
      prints the per-effect mask triple so an author can diff them by eye; several nodes'' whole disposition turns on it (Incineration
