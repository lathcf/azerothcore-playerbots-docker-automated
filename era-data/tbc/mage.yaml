# =================================================================================================
# ARCANE HAND HELPERS — 948760-948773.
# =================================================================================================
# --- Arcane Power clone 948760 (node 20819 grants it) --------------------------------------------
# FRESH clone of stock 12042, NOT a reuse of the Vanilla clone 932760 even though the two eras
# measure identical (reuse_ledger.932760_arcane_power: wago TBC 12042 = val 30/30/30, cooldown
# 180000 — the same numbers 932760 authors). Standing rule (memory `tbc-era-value-basis-wago-2540`):
# TBC magnitudes ship as FRESH clones in the era's own slice so a later Vanilla-only retune cannot
# move both. Shape copied from `era-data/vanilla/mage.yaml:82-100`:
#   * three aura-108 ADD_PCT_MODIFIER effects, +30% each: Effect_1 misc 0 SPELLMOD_DAMAGE (direct),
#     Effect_2 misc 14 SPELLMOD_COST, Effect_3 misc 22 SPELLMOD_DOT. WotLK split "+X% damage" into
#     direct + DoT, so all three carry the era's single "+30% damage / +30% cost" numbers.
#   * the three per-effect class masks A/B/C are INHERITED from the template (helper_overrides never
#     writes EffectSpellClassMask* unless a maskA/B/C key is present), so the effect->mask alignment
#     survives. Live's masks are a SUPERSET of TBC's and every TBC bit is present in them, so nothing
#     is LOST — but one added bit is reachable and it is recorded rather than waved off as "inert":
#     Effect_1's word1 goes TBC 0x8 -> live 0x19048, i.e. TBC covered only **Molten Armor** (word1
#     bit 3) while live adds **Blast Wave** (bit 6) alongside the genuinely WotLK-only Frostfire Bolt
#     (bit 12) / Arcane Barrage (bit 15) / Living Bomb (bit 16). A TBC mage CAN reach Blast Wave —
#     the Fire tab clones it and keeps live's `flagsB 64` — so this clone's +30% will also boost
#     Blast Wave, which TBC's own Arcane Power did not. One spell, one talent, +30% for 15 s on a
#     3-min cooldown; accepted, and authoring per-effect maskA/B/C to fix it would mean re-minting
#     all three masks by hand. (Bit attributions from `_ref` and the family-3 bit census; the
#     review note that called TBC's 0x8 "Blast Wave's 2.4.3 identity" was wrong — Blast Wave is
#     word1 bit 6 = 0x40 in BOTH eras, per survival_map[11113] ownMask.)
#   * `category: 0` + `categoryCooldown: 0` neutralise the inherited Category 1151 /
#     CategoryRecoveryTime 15000 so the 3-min cooldown lives purely in RecoveryTime (the Last Stand
#     932840 / Vanilla 932760 precedent). TBC's own record carries no category at all.
#   * DurationIndex 8 (15 s) inherits; both eras agree.
# `ExcludeCasterAuraSpell` is deliberately NOT authored (there is no generator key, and the
# inherited value 12043 is INERT for a TBC mage, which holds clone 948761 and never stock 12043).
# TBC allowed Arcane Power and Presence of Mind together, so that is the correct outcome either way.
# Stock 12042 ships untouched for WotLK; Task 5 adds the TBC arm of the CLASS_MAGE stock strip.
- id: 948760
  name: Arcane Power
  template: 12042
  category: 0
  categoryCooldown: 0
  cooldown: 180000       # TBC 3 min (live RecoveryTime 120000 = 2 min)
  # FINAL REVIEW 2026-09-06 (G-27): the three per-effect class masks are now AUTHORED rather than
  # inherited from template 12042, for one reason — **word 1 bit 6 (64) is Blast Wave's live
  # identity**, and a TBC Arcane Power must not buff it (the TBC Blast Wave clones 948880-948886
  # carry that live bit, so an inherited mask would reach them). Every other bit is the live 12042
  # value verbatim (dumped from the shipped `spell_dbc` row 2026-09-06); only bit 6 is cleared, and
  # only where it was set. Column mapping is {EFFECT}_{WORD} (workflow lesson 19), so the YAML keys
  # maskA/maskB/maskC on effect N are DBC words 0/1/2 of that effect:
  #   e1 (damage): 685904631 / 102472 -> 102408 / 0
  #   e2 (cost)  : 549591799 / 168000 -> 167936 / 0
  #   e3 (dot)   :   4194437 /   4096 (bit 6 not set — unchanged) / 0
  effects:
  - { effect: 6, aura: 108, basePoints: 30, misc: 0,  targetA: 1, maskA: 685904631, maskB: 102408, maskC: 0 }   # +30% direct spell damage
  - { effect: 6, aura: 108, basePoints: 30, misc: 14, targetA: 1, maskA: 549591799, maskB: 167936, maskC: 0 }   # +30% mana cost
  - { effect: 6, aura: 108, basePoints: 30, misc: 22, targetA: 1, maskA: 4194437,   maskB: 4096,   maskC: 0 }   # +30% periodic/DoT damage
  client:
    name: Arcane Power
    icon: 62             # stock 12042 SpellIconID
    skillLine: 237       # Arcane — else the granted active lands in the client's General tab
    description: "When activated, your spells deal 30% more damage while costing 30% more mana to cast. This effect lasts 15 sec."
    auraDescription: "Spell damage increased by 30%. Mana cost increased by 30%."
# --- Presence of Mind clone 948761 (node 20813 grants it) ----------------------------------------
# FRESH clone of stock 12043 by the same standing rule (reuse_ledger.932761_presence_of_mind: wago
# TBC 12043 cooldown 180000 == what the Vanilla clone 932761 authors — identical, still not reused).
# No `effects:` list at all: the mechanic is unchanged across all three eras, so the single
# aura-108 misc-10 SPELLMOD_CASTING_TIME -100% effect, its class mask, ProcCharges 1 and
# DurationIndex 21 all inherit from the template. Only the cooldown and the category differ.
#
# A CLONE INHERITS NO `spell_proc` ROW (lesson 18), and without one the charge is never consumed —
# the mage would keep an instant-cast buff forever. The `proc:` block reproduces the live row for
# the POSITIVE id 12043 verbatim from `_ref.proc_data_census` (school 0, family 3, mask0 1631584309,
# mask1 4096, ProcFlags 0, SpellTypeMask 7, SpellPhaseMask 1, HitMask 0, AttributesMask 8,
# Chance 0). Two of those need translating rather than copying:
#   * `flags: 87376` where the stock row says 0. `SpellMgr::LoadSpellProcs` substitutes the SPELL's
#     own DBC ProcFlags for a row whose ProcFlags is 0 (SpellMgr.cpp `if (!procEntry.ProcFlags)`),
#     and 12043's ProcTypeMask is 87376 — which the clone inherits from the template. Authoring 0
#     here instead would make the generator refuse the load-bearing `phaseMask: 1` as unusable and
#     would emit SpellPhaseMask 0 ("proc will not be triggered"). Post-load the two rows are
#     identical. (The TBC warlock Fel Domination clone 948570 uses the same idiom.)
#   * `chance: 0` reproduces the stock row; the core then seeds it from the DBC ProcChance (100).
# `attrMask: 8` = PROC_ATTR_REQ_SPELLMOD — drop the charge only for a spell this aura actually
# modified, which is what makes "your NEXT mage spell" mean the next spell the -100% applied to.
- id: 948761
  name: Presence of Mind
  template: 12043
  spellFixAck: >-
    SpellInfoCorrections.cpp:4664 ORs SPELL_ATTR6_NO_CATEGORY_COOLDOWN_MODS (0x80000000) onto stock
    12043 by id so Presence of Mind does not share category-1151 cooldown modifiers with Arcane
    Power 12042. There is no generator key for AttributesEx6, and the fix is MOOT for this clone:
    it authors `category: 0` / `categoryCooldown: 0`, so no category cooldown remains for a modifier
    to touch. Same acknowledgement the shipped, real-client-verified Vanilla clone 932761 carries.
  category: 0
  categoryCooldown: 0
  cooldown: 180000       # TBC 3 min (live RecoveryTime 120000 = 2 min)
  effects:               # byte-identical to stock 12043's Effect_1 (the mechanic is unchanged
                         # across all three eras); the generator requires an authored effects list
                         # on any `template:` helper. The EffectSpellClassMaskA (1631584309/4096/0),
                         # ProcCharges 1 and DurationIndex 21 all still inherit from the template.
  - { effect: 6, aura: 108, basePoints: -101, dieSides: 1, misc: 10, targetA: 1 }   # -100% cast time
  proc:
    flags: 87376         # = the clone's own inherited DBC ProcTypeMask; see the block comment
    typeMask: 7
    phaseMask: 1         # PROC_SPELL_PHASE_CAST — consumed when the modified spell is CAST
    hitMask: 0
    attrMask: 8          # PROC_ATTR_REQ_SPELLMOD
    chance: 0            # stock row; core seeds from the DBC ProcChance (100)
    affectsMask: { a: 1631584309, b: 4096, c: 0 }   # verbatim from the live 12043 spell_proc row
  client:
    name: Presence of Mind
    icon: 139            # stock 12043 SpellIconID
    skillLine: 237       # Arcane
    description: "When activated, your next Mage spell with a casting time less than 10 sec becomes an instant cast spell."
    auraDescription: "Your next Mage spell with a casting time less than 10 sec becomes an instant cast spell."
# --- Magic Absorption clones 948762-948766 (node 20804 grants one per rank) -----------------------
# CLONE chain, per disposition_table[20804] + Amendment A.1 item 7. TBC carries the mana-on-full-
# resist rider IN DATA — `e1 aura 4 DUMMY val 1..5` (the mana %) beside `e2 aura 22 MOD_RESISTANCE
# misc 124 val 2..10` — and the live core script reads EFFECT_0's amount, so the whole talent is
# expressible as data + a script rebind with no new module C++.
#
# TEMPLATE IS 29441 FOR ALL FIVE RANKS, not 29441/29444/29445/29446/29447 as the plan's seed text
# says. Measured on the base store this generator clones from (`azerothcore-wotlk/ip-dbc/Spell.dbc`):
# **29445 and 29446 do not exist there at all** (both are WAGO_ONLY in survival_map), and **29447 is
# "Torment the Weak" live** — a different spell in a different family, which is exactly why
# Amendment A.1 item 7 flags it as "never grant it". 29441 and 29444 are byte-identical apart from
# their per-rank amounts, so one donor + authored amounts reproduces every rank exactly.
#
# Per-rank authored fields:
#   * e1 `aura 4` SPELL_AURA_DUMMY, basePoints 1..5 = the mana % the core script reads.
#   * e2 `aura 22` MOD_RESISTANCE, misc **124** (TBC's own mask: every school but Physical AND Holy),
#     basePoints 2..10, and `perLevel: 0` — MANDATORY. Live 29441/29444 carry
#     EffectRealPointsPerLevel 0.5/1.0 on that slot, helper_overrides writes that column only when
#     the key is present, so an omitted `perLevel` would INHERIT the live scaling and hand a level-70
#     mage +35 resistance on top of the flat +2. TBC's rows are flat.
#   * `spellLevel: 0` — `SpellInfoCorrections.cpp:1061` sets SpellLevel 0 on 29441/29444 BY ID and a
#     clone never receives a by-id fix (lesson 14). Without it the per-level term above would also
#     acquire a nonzero base level.
#   * helper-level `proc:` copying the live `-29441` row from proc_data_census verbatim: family 0,
#     no masks, SpellTypeMask 7, SpellPhaseMask 0, **HitMask 8 = PROC_HIT_FULL_RESIST**, Cooldown
#     1000 (the tooltip's "1 sec. cooldown"), Chance 0. `flags: 131072` is the same translation as
#     Presence of Mind above: the stock row's ProcFlags 0 means "use the spell's own DBC
#     ProcTypeMask", which for 29441 is 131072 = TAKEN_SPELL_MAGIC_DMG_CLASS_NEG and which the clone
#     inherits from the template.
#   * `client:` block per rank — node 20804 is a GRANT node, so the talent-panel tooltip IS the
#     granted spell's own client-DBC Description (lesson 17d); without it the panel goes blank.
- id: 948762
  name: Magic Absorption
  template: 29441
  spellLevel: 0
  spellFixAck: >-
    SpellInfoCorrections.cpp:1061 sets `SpellLevel = 0` on stock 29441/29444 BY ID, and a clone never
    receives a by-id fix. The POST-FIX VALUE IS AUTHORED on this helper (`spellLevel: 0` above) —
    `SpellLevel` simply has no entry in era_audit's `_SPELLFIX_KEYABLE` table, so the check cannot see
    that the key is already set and falls through to the acknowledge-only branch. Nothing is waived.
  effects:
  - { effect: 6, aura: 4,  basePoints: 1, targetA: 1 }                # mana % the core script reads
  - { effect: 6, aura: 22, basePoints: 2, misc: 124, targetA: 1, perLevel: 0 }
  proc:
    flags: 131072        # = the clone's inherited DBC ProcTypeMask (stock row says 0 = "use the DBC")
    typeMask: 7
    phaseMask: 0
    hitMask: 8           # PROC_HIT_FULL_RESIST
    chance: 0            # stock row; core seeds from the DBC ProcChance (100)
    cooldown: 1000
  client:
    name: Magic Absorption
    icon: 459            # stock 29441 SpellIconID
    description: "Increases all resistances by 2 and causes all spells you fully resist to restore 1% of your total mana. 1 sec. cooldown."
