    # AUTHORED (multi) — disposition_table[20845]. TWO effects, exactly as Vanilla's twin 18033
    # splits them:
    #   (1) `spellmod allEffects, kind: pct` +15/30% on Frost Armor + Ice Armor. `affects:` ORs the
    #       two spells' full identity (34078720 = 0x2080000, bits 25+19 — the same value both share);
    #       TBC's own e1 mask is the narrower 0x2000000 (bit 25 only) and the superset is harmless
    #       because bit 19 is carried only by those two armors and Blizzard, which has no "effects"
    #       an allEffects spellmod could scale in a way the tooltip would notice.
    #   (2) `stat aura 4` SPELL_AURA_DUMMY with EffectMiscValue **3** = the reserved "frost ward
    #       reflect" era-hook opcode, amount = the reflect %. The module AuraScript `era_ward_reflect`
    #       (bound `-543`/`-6143`) scans the caster for a band DUMMY with misc 3 and applies the
    #       reflect while Frost Ward is up. It is ERA-AGNOSTIC — it accepts any spell id inside
    #       [ERA_CUSTOM_BAND_LOW 920000, ERA_CUSTOM_BAND_HIGH 950000), which contains this node's
    #       TBC auto-passives 942760/942761 — so this arms with ZERO C++ change and no new helper
    #       (reuse_ledger.932990_932991_ward_reflect_helpers: REUSE AS-IS).
    # Live is 25/50% armor + 15/20% reflect; TBC is 15/30% + 10/20%, so a grant is impossible.
    #
    # **SCOPE CONFLICT, FLAGGED FOR THE ORCHESTRATOR (2026-09-05).** The Task-4 dispatch, spec
    # Amendment A.1 item 8's parenthetical and the plan deltas all say "misc 3 is granted by NO TBC
    # node — TBC Frost Warding is the armor half only". THREE independent pieces of evidence in the
    # ref say otherwise and this node follows them: (a) `disposition_table[20845]` itself specifies
    # both effects incl. `stat aura 4 DUMMY misc 3 vals [10,20]`; (b)
    # `reuse_ledger.932990_932991_ward_reflect_helpers.tooltip_check` says in so many words "TBC
    # Molten Shields covers the FIRE ward only — misc 2 — exactly as Vanilla splits it (Frost
    # Warding 11189/28332 carries the frost half, `e2 = SPELL_EFFECT_DUMMY val 10/20`, misc 3).
    # **Both markers, one each, no new misc value.**"; (c) the RAW data — `survival_map[11189]`
    # reads `e2: eff=3 val=10` on the TBC side (`eff=3` IS SPELL_EFFECT_DUMMY), and the cached
    # Wowhead TBC tooltip below, which the addon renders in the talent panel, promises the reflect
    # in as many words. Authoring the armor half alone would ship a node whose own panel tooltip
    # advertises an effect nothing delivers. A.1 item 8's real finding — that MOLTEN SHIELDS covers
    # the fire ward only (misc 2) — is unaffected and stands.
