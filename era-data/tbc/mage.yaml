# CLONE per disposition_table[20841] + Amendment A.1 item 6. Two era divergences, both authored:
#   * `RecoveryTime` 180000 (3 min) over live's 120000 (2 min) — the cached TBC tooltip says 3 min.
#   * `e1` back to a BARE `aura 4` SPELL_AURA_DUMMY at value 0. Live turned that slot into
#     `aura 108 ADD_PCT_MODIFIER misc 15 SPELLMOD_CRIT_DAMAGE_BONUS +50%` — a WotLK-only half the
#     TBC tooltip does not promise. The DUMMY's own class mask is authored to wago's `0xc00017`
#     (12582935) rather than inheriting live's widened `0x8c00017`/`0x31048`; it is inert either way
#     on a bare DUMMY, and the era value is the honest one to ship.
# `e2` KEEPS `SPELL_EFFECT_TRIGGER_SPELL -> 28682` (both eras): 28682 is LIVE_MATCH, is already in
# the client DBC, and its own script `spell_mage_combustion_proc` stays bound to it untouched.
# `dispelType: 0` reproduces `SpellInfoCorrections.cpp:1055` (`{11129} Dispel = DISPEL_NONE`), which
# a clone never inherits (workflow lesson 14) — see the spellFixAck below for why the audit still
# needs the acknowledgement.
# SCRIPT REBIND IS MANDATORY: `spell_mage_combustion` is bound to the **POSITIVE** id 11129
# (`spell_script_names`, dev box 2026-09-05), so it is simply absent on a clone — and it is the whole
# mechanic (its `DoCheckProc` adds a 28682 stack and refuses the charge on a NON-crit, and lets the
# charge drop on a crit). One positive binding per rank per Amendment B.2; Combustion has one rank.
# OWN `spell_proc` ROW: stock 11129's row is a POSITIVE-id row, which a clone inherits nothing from
# (lesson 18). It is copied verbatim from `proc_data_census`: school 4, family 3, mask
# (146800663, 200776, 0), ProcFlags 0 -> the spell's own DBC ProcTypeMask 65536, SpellTypeMask 1,
# SpellPhaseMask 2, HitMask 0, AttributesMask 0, Chance 0 (the core seeds 100 from the DBC),
# Charges 0 -> the DBC's ProcCharges 3 (`SpellMgr.cpp:2081-2082`).
# RECORDED RESIDUALS (neither is an era magnitude, and the ref's row asks for neither):
#   * the census mask is LIVE's fire set, whose word1 bit 6 is Blast Wave — so on this build a TBC
#     Blast Wave feeds Combustion where wago's own `0xc00017` mask would not. Same shape as the ref's
#     accepted gap 9 (Arcane Power reaches Blast Wave), and the ref pins the census row verbatim.
#   * (`AttributesEx3` is no longer a residual — it is AUTHORED 0 below, see the next paragraph.)
#   * `spell_mage_combustion_proc` (bound to stock 28682) removes the STOCK id 11129 when the crit
#     stack is removed, so cancelling the 28682 buff no longer ends an era mage's Combustion. The
#     charge path (3 crits -> aura gone) is unaffected; 28682 is global and cannot be re-pointed per era.
# `attributesEx3: 0` IS AUTHORED (workflow lesson 17c — an inherited AttributesEx3 bit a template
# rides in). Live 11129 carries `0x4000000` SPELL_ATTR3_CAN_PROC_FROM_PROCS where wago 2.5.4 carries
# **0**: the bit is a WotLK addition that lets TRIGGERED casts drive the aura's proc, so inheriting it
# would let Ignite ticks and Blizzard's 42208 build and burn Combustion's three charges — behaviour
# TBC's own record does not have. Live's AttributesEx3 is exactly that one bit, so authoring 0 clears
# it and nothing else.
- id: 948887
  name: Combustion
  template: 11129
  cooldown: 180000       # 3 min (live 120000)
  attributesEx3: 0       # wago 11129 = 0; live's 0x4000000 CAN_PROC_FROM_PROCS is a WotLK addition
  dispelType: 0          # SpellInfoCorrections.cpp:1055 sets DISPEL_NONE on 11129 by id
  procCharges: 3         # 3 fire crits; authored explicitly because the charge window IS the spell
  spellFixAck: >-
    SpellInfoCorrections.cpp:1055 sets `Dispel = DISPEL_NONE` on stock 11129 BY ID, and a clone never
    receives a by-id fix. The POST-FIX VALUE IS AUTHORED on this helper (`dispelType: 0` above) —
    `Dispel` simply has no entry in era_audit's `_SPELLFIX_KEYABLE` table, so the check cannot see
    that the key is already set and falls through to the acknowledge-only branch. Nothing is waived.
  effects:
  - { effect: 6, aura: 4, basePoints: 0, targetA: 1, maskA: 12582935, maskB: 0, maskC: 0 }
  - { effect: 64, trigger: 28682, targetA: 1 }
  proc:
    flags: 65536         # = the clone's inherited DBC ProcTypeMask (the stock row's ProcFlags is 0)
    school: 4
    typeMask: 1
    phaseMask: 2
    hitMask: 0
    attrMask: 0
    chance: 0            # stock row; the core seeds from the DBC ProcChance (100)
    # FINAL REVIEW 2026-09-06 (G-27): word 1 is the census value 200776 MINUS Blast Wave's live
    # identity bit 6 (64) -> 200712. A TBC Combustion must not spend its charges on the era Blast
    # Wave clones 948880-948886, which carry that live bit. Word 0 is the census row verbatim.
    affectsMask: { a: 146800663, b: 200712, c: 0 }   # census row 11129, less Blast Wave's bit 6
  client:
    name: Combustion
