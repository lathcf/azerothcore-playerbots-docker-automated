# "Improved Scorch" and is `aura 179 MOD_ATTACKER_SPELL_CRIT_CHANCE misc 126 val 5, CumulativeAura 1`
# (+5% crit taken, ALL schools, one stack). wago 2.5.4 22959 is `aura 87 MOD_DAMAGE_PERCENT_TAKEN
# misc 4 (fire) val 3, durIdx 9 (30 s), CumulativeAura 5` and is named "Fire Vulnerability" — which is
# what the TBC tooltip promises. So the payload has to be cloned per era; stock 22959 ships untouched.
# The Vanilla twin is 932763 (vanilla_fix_rows[18026]) — per-era identity, never one shared helper.
#
# NO `spell_proc` ROW ON THE DEBUFF. Stock 22959 has none either (`SELECT * FROM spell_proc WHERE
# ABS(SpellId)=22959` = 0 rows, dev box 2026-09-05) — it is a plain aura-87 debuff that never procs,
# and the `-11095` contract belongs to the TALENT, which node 20832 carries. (The ref said the debuff
# needed one too; that was a slip, corrected in `disposition_table[20832]` in the same commit —
# lesson 18's "a clone inherits no proc row" only bites a clone that PROCS.)
#
# INHERITED BY DECISION, NOT AUTHORED (orchestrator, fix round): live 22959 carries `AttributesEx2
# 0x84` (IGNORE_LINE_OF_SIGHT | DO_NOT_REPORT_SPELL_FAILURE) and `AttributesEx3 0x30000`
# (SUPPRESS_CASTER_PROCS | SUPPRESS_TARGET_PROCS = no initial aggro) where wago 2.5.4 has 0/0. Unlike
# Combustion's CAN_PROC_FROM_PROCS (which changes an era-visible magnitude and IS authored to 0),
