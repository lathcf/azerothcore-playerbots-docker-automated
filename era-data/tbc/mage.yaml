# EVERY CHAIN IS A TEMPLATED CLONE OF ITS OWN RANK, so all the fields the era does NOT diverge on
# (per-level growth, radius, target B, per-effect mechanic, spell levels, attributes, icon, visual)
# are INHERITED and only the diverged ones are authored — `helper_overrides` writes an effect column
# only when its key is present, except the eight base columns (Effect/Aura/BasePoints/DieSides/
# Misc/MiscB/Trigger/TargetA) which a templated helper 0-fills across all three slots so a template's
# own effects can never leak. That 0-fill is exactly how the Blast Wave clones DROP live's
# `e3 SPELL_EFFECT_KNOCK_BACK`: authoring two effects zeroes the third.
#
