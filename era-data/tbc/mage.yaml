  accepted_gaps:
  - id: 1
    title: RETIRED 2026-09-05 — Ice Barrier's TBC spell-power coefficient
    status: RETIRED
    detail: 'Was "could not be established". It was: **0.1**, from cmangos `mangos-tbc` `sql/base/mangos.sql:14318` (chain-rooted
      at 11426 by `spell_chain` lines 14654-14659), vs live''s hardcoded 0.8068. Node 20863 flipped GRANT -> CLONE (948964-948969)
      with the new `era_mag_ice_barrier_tbc` script. Full citation in `core_hardcodes.ice_barrier_coefficient`. The id is
      kept as RETIRED rather than renumbered so nothing that cites "gap 1" goes stale.'
  - id: 2
    title: WotLK's flat-mana -> ManaCostPct conversion on the level 65-70 trained ranks
    detail: 'GRANTed stock spells at the top of a chain cost a percentage of base mana where TBC charged a flat amount: Pyroblast
      r10 33938 (500 -> 22%), Blast Wave r7 33933 (620 -> 28%), Dragon''s Breath (475/575/660/700 -> 37/37/37/31%). It is
      an era-wide core change, not a per-node finding (the warlock phase''s `accepted_gaps` id 3). **As of the fix round this
      gap has NO remaining instance in the mage tree**: all four chains are now CLONED and every clone authors the TBC flat
      cost. Kept as a standing note for the GRANTed spells elsewhere in the tree and for the Vanilla side.'
  - id: 3
    title: Molten Fury's health threshold is 35% on this core, 20% in TBC
    detail: '`Unit.cpp:8530-8536` gates the OVERRIDE_CLASS_SCRIPTS misc 4919/4920 arm on `AURA_STATE_HEALTHLESS_35_PERCENT`.
      The AMOUNT comes from the aura (so node 20842 ships the era-correct 10%/20%), but the window does not, and no data field
      expresses it. Fixing it needs a core patch, which the phase''s zero-new-core-patch policy forbids. The result is strictly
      stronger than TBC. **ESCALATED for a policy decision.**'
  - id: 4
    title: TBC Molten Shields' second half ('Molten Armor affects ranged and spell attacks')
    detail: The cached TBC tooltip for 11094/13043 has two halves; only the Fire-Ward reflect exists in the DBC (`SPELL_EFFECT_DUMMY
      val 10/20`), so TBC's own core must have read the same DUMMY for the second half. On 3.3.5a, Molten Armor's `spell_proc
      -30482` row already fires on `SpellTypeMask 1` with `HitMask 1027` — i.e. it already procs off ranged and spell attacks
      unconditionally — so the talent's second half is a no-op that the baseline already grants. Strictly >= TBC; recorded,
      not fixed.
  - id: 5
    title: Ice Block carries WotLK's Hypothermia lockout
    detail: 45438 is baseline in both eras, but live adds `ExcludeCasterAuraSpell 41425` (Hypothermia) and `AttributesEx7
      0x100000`, and drops TBC's `ExcludeCasterAuraState 19`. Fixing it would mean cloning a BASELINE spell for two eras.
      Applies to Vanilla identically (vanilla_fix_rows 18046).
  - id: 6
    title: 'Lesson-17d residual: a GRANTed stock spell''s SPELLBOOK tooltip is the stock client row'
    detail: Spec §7 item 1, unchanged. Applies to all 21 GRANT nodes. The talent PANEL shows era prose (the hunter phase's
      TalentUI fix); the spellbook does not.
  - id: 7
    title: Live-only extra halves dropped from three AUTHORed nodes
    detail: Magic Attunement's +3/6 yd range, Improved Blink's -25/-50% Blink cost and Prismatic Cloak's -1/-2 s Invisibility
      fade are WotLK additions (live_extra_slots). A TBC mage does not get them — correct, and noted so the real-client pass
      does not read their absence as a bug.
  - id: 8
    title: REMOVED 2026-09-05 — the three scope-flagged Vanilla FIX rows all ship
    status: REMOVED
    detail: 'Was "18024 / 18030 / 18032 may not ship this generation". **User decision 2026-09-05: all three SHIP**, as ordinary
      FIX rows owned by Task 3, each authored "same shape as the TBC twin, live stock values with ONLY the era-diverged field
      changed" on Vanilla ids 932310-932317 / 932320-932324 / 932325. The id is kept as REMOVED rather than renumbered.'
