# =================================================================================================
# TBC MAGE (Phase 9, the LAST TBC class). Class 8 / spell family 3 (SPELLFAMILY_MAGE) — no
# class/family inversion this time; `_ref.familyName: 3` is authored explicitly so nothing depends
# on the generator's default.
#
# AUTHORING INPUT: `era-data/_ref/tbc/mage-spells.yaml` `disposition_table:` (inlined below as
# `_ref:`), as amended by spec Amendment A. Tasks 2-4 author FROM that table and do not re-derive
# verdicts; every value here traces to a `disposition_table:` row, a `survival_map:` entry or a
# `proc_data_census:` row.
#
# HAND-HELPER SLICE 948750-949059, PRE-PARTITIONED BY TAB (workflow lesson 22 — partition first so
# the three tab tasks cannot collide; leave a HOLE rather than renumber a pinned id):
#   948750-948759  substrate (Task 5)  -- EXPECTED EMPTY. Amendment A: no marker is needed (Shatter
#                                         reuses DUMMY misc 1, Molten Shields reuses misc 2, and
#                                         both are node auto-passives, not hand helpers).
#   948760-948859  Arcane  (Task 2)    -- USED 948760-948773 (14 ids), see the ledger below.
#   948860-948959  Fire    (Task 3)
#   948960-949059  Frost   (Task 4)
#   949060-949999  stays FREE for Phase 9.5 and later fixes.
#
# ARCANE ID LEDGER (allocated in order; no holes):
#   948760          Arcane Power clone            (node 20819, template 12042)
#   948761          Presence of Mind clone        (node 20813, template 12043)
#   948762-948766   Magic Absorption clones r1-r5 (node 20804, template 29441)
#   948767-948769   Arcane Potency crit buffs     (node 20817, template 57529)
#   948770          Improved Counterspell silence (node 20810, template 18469, 4 s)
#   948771-948772   Improved Blink buffs r1-r2    (node 20812, templates 47000/46989)
#   948773          Slow clone                    (node 20822, template 31589)
#
# AUTO-PASSIVES: 936000 + (nodeId-20000)*8 + (rank-1) -> 942400-942935 for this class. Nothing to
# hand-allocate; no overlap with earlier TBC classes (warlock ends 942111).
#
# NAME RULE: nodes carry the 2.4.3 / live 3.3.5a names, NOT the 2.5.x Classic renames the wago
# import serves. Renamed at seed time: 20807 "Spell Impact" -> **Arcane Impact**, 20809 "Arcane
# Shielding" -> **Improved Mana Shield**, 20843 "Empowered Fire" -> **Empowered Fireball**, 20851
# "Perma Frost" -> **Permafrost**. 20832 IS "Improved Scorch" and 20836 IS "Critical Mass"
# (Amendment A.1 item 1 — the plan's table had those two swapped; the skeleton is correct).
#
# NO `petBuffBase:` — mage is not a pet-talent class. The Water Elemental is a stock guardian on the
# core's `spell_mage_pet_scaling` (35657-35660), not a pet-talent carrier, so this dataset claims no
# era-1 pet window (spec §2). Ice Block is BASELINE at level 30 in TBC as well as WotLK (spec §1),
# so no Frost node touches it and the existing `kBaselineSpellGates` row stays correct unchanged.
#
# SHATTER (node 20857, Frost) rides CORE PATCH 0018 through its auto-passives' DUMMY misc 1; Task 5
# widens that patch's band check from [920000, 933000) to [920000, 950000) so the TBC auto-passive
# band 942856-942860 is inside it. No new core patch anywhere in this phase.
# =================================================================================================
