# --- Ice Barrier r1-r6, 948964-948969 (node 20863 grants r1; r2-r6 trainer-taught at Task 5) -----
# CLONE per disposition_table[20863] + spec A.4 item 1 (user decision 2026-09-05).
#
# **THE ONLY ERA DIVERGENCE IS NOT IN THE DBC AT ALL.** Ranks r1-r5 (11426/13031/13032/13033/27134)
# are byte-identical across all fourteen families and r6 (33405) differs only in the mana encoding —
# but the spell-power coefficient lives in CORE CODE: `spell_mage_ice_barrier(_aura)` hardcodes
# `float bonus = 0.8068f` (spell_mage.cpp:627 and :663) where TBC's is **0.1** (cmangos `mangos-tbc`
# `sql/base/mangos.sql:14318` `spell_bonus_data (11426, 0.1, 0, 0, 0, 'Mage - Ice Barrier')`,
# chain-rooted at 11426 by that file's `spell_chain` block at lines 14654-14659, so it governs all
# six ranks). An 8x divergence at level-70 spell power — the textbook workflow-lesson-20 shape.
# core_hardcodes.ice_barrier_coefficient carries the full citation.
#
# So the clones copy the LIVE rows VERBATIM and the whole era fix is the NEW module AuraScript
# **`era_mag_ice_barrier_tbc`** (EraTalentProcScripts.cpp), bound per rank in `scriptBindings:`
# above with POSITIVE ids (Amendment B.2 — a `-948964` binding resolves through `spell_ranks`,
# which the generator does not emit, and would cover rank 1 only). The stock scripts are bound
# `-11426` and never see a band clone, so without that script the clones would get NO spell-power
# bonus at all. Read the script's header comment for what the two stock companions do and why
# neither is rebound (Incanter's Absorption is WotLK-only; the CheckCast bounce-guard would compare
# against its own 0.8068).
#
# Per-rank values, LIVE == TBC on every one of them: absorb 438/549/678/818/925/1075, perLevel
# 2.8/3.2/3.6/4.0/4.4/4.8, `durIdx 3` (60 s), `category 471` + `catCooldown 30000` (the 30 s shared
# cooldown Ice Floes 20861 reduces), spell levels 40/46/52/58/64/70 — every one INHERITED from that
# rank's own template, which is why each clone authors only its effect and (r6) its cost.
# **r6 is the one authored divergence:** WotLK converted 33405's flat 565 mana into `ManaCostPct 25`
# (survival_map 33405, family E), so 948969 authors `powerCost: 565` + `manaCostPct: 0` — the core
# charges flat PLUS pct, so leaving the inherited 25% would bill both (the framework's Seal-clone
# trap). That also retires the ref's accepted_gaps id 2 for this chain.
#
# Client text is the LIVE description verbatim — pure `$s1`/`$d` substitution off the clone's OWN
# row, so each rank renders its own absorb and its own 1 min duration, and the cached TBC tooltip
# for 11426 is the same sentence ("Instantly shields you, absorbing 455 damage. Lasts 1 min. ...";
# 455 = 438 + 2.8 x 6, the level-70 scaling of rank 1). Node 20863 is a GRANT node, so this string
# is the talent-panel tooltip as well as the spellbook one (workflow lesson 17d). `skillLine: 6` =
# the Frost tab, else a granted active lands in the client's General tab.
