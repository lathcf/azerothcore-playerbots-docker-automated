  plan_corrections:
    node_names: 'The plan''s Fire node-id table SWAPS two names: it lists "20832 Critical Mass 11095 r3" and "20836 Imp. Scorch
      11115 r3". The SPELL IDS are right and the Step-2 anchor assertion passes, but the NAMES are the wrong way round. Live
      `Name_Lang_enUS`: **11095/12872/12873 = "Improved Scorch"**, **11115/11367/11368 = "Critical Mass"**; wago 2.5.4 agrees.
      The importer wrote the correct pairing into the skeleton (20832 Improved Scorch, 20836 Critical Mass) and THAT is what
      Task 3 authors. Spec §3b compounds it a third way ("Improved Scorch (20831 …)"); 20831 is **Burning Soul**. The Improved-Scorch/Winter''s-Chill
      split of spec §4d therefore belongs to nodes **20832** and **20862**, and the Combustion prereq (20841 prereq 20836)
      is a prereq on CRITICAL MASS, not on Improved Scorch.'
    arcane_meditation_values: Spec §3b says "Arcane Meditation (20811; 15/30/45 vs live 17/33/50)". wago 2.5.4 says TBC is
      **10/20/30** (18462 `val=10`, 18463 `val=20`, 18464 `val=30`), and the cached Wowhead TBC tooltip for 18462 reads "Allows
      10% of your mana regeneration to continue while casting". Live is 17/33/50. Author **10/20/30**.
    improved_blink_is_not_a_mana_talent: Spec §3b/§3a say "TBC -25/50% Blink mana; live moved to speed". It is the OTHER WAY
      ROUND. TBC 31569/31570 have ONLY the proc-trigger effect (aura 42 -> 47000 / 46989); the -25%/-50% Blink MANA-COST spellmod
      is a LIVE-ONLY effect slot (see `live_extra_slots:`). TBC's payload buffs 47000/46989 are "For 4 sec after casting Blink,
      your chance to be hit by all attacks and spells is reduced by **13% / 25%**" (three auras 184/185/186, `durIdx 35` =
      4 s); live is 15%/30%. Nothing about speed in either era.
    ice_floes_spell_list: 'Spec §3b says "TBC -10/20% cd on Frost Nova/Cone of Cold/Ice Block/Ice Barrier; live 3r incl. Cold
      Snap". Wrong on two counts. The cached TBC tooltip for 31670 reads "Reduces the cooldown of your **Cone of Cold, Cold
      Snap, Ice Barrier and Ice Block** spells by 10%" — Cold Snap is IN and Frost Nova is OUT. Live is 2 ranks too (31670/31672),
      not 3, at **-7%/-14%**. **Mask, corrected in the fix round:** TBC''s own mask is `(0x200, 0x5, 0x0)` = Cone of Cold
      (word0 bit9) + Ice Barrier (word1 bit0) + Cold Snap (word1 bit2), and **TBC''s word2 is ZERO** — the first pass''s "Ice
      Block reached via the shared word-2 bit 3" was wrong (bit 3 of word 2 is the shared category bit this file''s `flagsC`
      convention DROPS, and it is carried by ~34 family-3 spells, so it would over-match wildly). On THIS core Ice Block 45438
      sits at **word1 bit 7** (`flagsB: 128` in `spells:`), so a literal copy of the TBC mask never reaches it. **Author word0
      `0x200` + word1 `0x85`** (Ice Barrier | Cold Snap | Ice Block).'
    improved_scorch_and_winters_chill_were_never_one_debuff: 'Spec §4d ("Live Improved Scorch and Winter''s Chill both feed
      ONE 1%-crit-taken debuff") is wrong. They are two separate spells in BOTH eras: 22959 and 12579. What changed is their
      CONTENT — TBC 22959 is "Fire Vulnerability", `aura 87 MOD_DAMAGE_PERCENT_TAKEN misc 4 (fire) val 3, durIdx 9 (30 s),
      stack 5`, and live 22959 is renamed "Improved Scorch", `aura 179 misc 126 val 5, stack 1`; TBC 12579 is `aura 179 misc
      16 (frost) val 2, durIdx 8 (15 s), stack 5` and live 12579 is `aura 179 misc 126 val 1, stack 5`. The authoring outcome
      is the same as the spec intended (two fresh clones, 948860 and 948960, each with its own `spell_proc` row) — only the
      stated reason changes. (lesson 15: the reason is corrected too.)'
    combustion_is_not_a_grant: 'Spec §3c lists Combustion among the "likely grants". It is not: TBC 11129 has `cooldown=180000`
      and its e1 is a bare `aura 4 DUMMY val 0`, while live 11129 has `cooldown=120000` and its e1 is `aura 108 ADD_PCT_MODIFIER
      misc 15 (SPELLMOD_CRIT_DAMAGE_BONUS) val 50` — a whole extra WotLK half (+50% fire crit damage) on top of a halved cooldown.
      CLONE.'
    ignite_is_a_grant: 'Spec §3b hedges on Ignite. It is a clean GRANT: all five TBC ranks are field-identical to live except
      `ProcTypeMask 65536 -> 327680`, and the live `spell_proc` row `-11119` (SchoolMask 4, family 3, SpellTypeMask 1, SpellPhaseMask
      2, HitMask 2) OVERRIDES the DBC mask anyway (lesson 18, the rogue Combat-Potency shape). `spell_mage_ignite`''s `8 *
      GetRank()` yields 8/16/24/32/40 — the exact TBC tooltip values (11119 "8%", 12848 "40%").'
    magic_absorption_rider_is_reachable: Spec §1's "known candidate" is confirmed and better than hoped. TBC 29441-29447 carry
      the mana-on-resist rider IN DATA as `e1 = aura 4 DUMMY val 1/2/3/4/5` (the % of max mana) beside `e2 = aura 22 MOD_RESISTANCE
      misc 124 val 2/4/6/8/10`, and `spell_mage_magic_absorption` reads exactly that EFFECT_0 amount (`CalculatePct(GetMaxPower(POWER_MANA),
      aurEff->GetAmount())` -> casts 29442). So a CLONE CHAIN + a `scriptBindings` rebind reproduces the TBC talent whole,
      including the 1 s ICD the live `spell_proc` row `-29441` already encodes (`SpellTypeMask 7, HitMask 8 (FULL_RESIST),
      Cooldown 1000`) and the TBC tooltip states ("1 sec. cooldown"). The same mechanism is the Vanilla 18005 FIX — see `vanilla_fix_rows:`.
