      = DONE_SPELL_MAGIC_DMG_CLASS_POS, typeMask 7, phaseMask 4 = FINISH, hitMask 0, attributesMask 2 = TRIGGERED_CAN_PROC)
      but **NOT that row''s mask1 34**: 34 is the LIVE trigger set (Clearcasting bit1 | Presence of Mind bit5) and PoM was
      added in 3.0, whereas **TBC 31571''s own mask is (0, 0x2, 0) = Clearcasting ONLY** (survival_map[31571].tbc). The node
      therefore authors `affects: [Clearcasting]`, which ORs to exactly (0, 2, 0). Trigger -> three FRESH clones **948767
      / 948768 / 948769** built on **the LIVE 57529 shape**: `aura 57 SPELL_AURA_MOD_SPELL_CRIT_CHANCE` at **+10 / +20 / +30**,
      `procCharges: 1`, `durationIndex 8` (**15 s = Clearcasting''s own window**; NB live 57529/57531 use `durIdx 21` PERMANENT
      + 1 charge — the 15 s is the deliberate era choice, both raw values recorded), school 1, `targetA 1`, family 3. **CONSUMPTION:
      each buff carries its OWN `spell_proc` row reproducing Clearcasting''s live consumption mask** (census `12536`: mask0
      549591799 = 0x20c21af7, mask1 168000 = 0x29040, phaseMask 1 = CAST, typeMask 0, hitMask 0), so the same cast that consumes
      the Clearcasting cost waiver drops this buff''s single charge. Without that row `LoadSpellProcs` auto-generates one
      from the INHERITED 57529 effect mask (0x61400035, 0x1000, 0), which omits Arcane Missiles / Arcane Explosion / Fire
      Blast / Frost Nova / Blizzard / Cone of Cold / Dragon''s Breath / Blast Wave — and since aura 57 is all-school crit,
      the mage would keep the whole +10/20/30% for the buff''s full 15 s after a Clearcast Arcane Missiles. `attributesMask`
      on the buff rows is **0, not Clearcasting''s 12**: bit 8 = PROC_ATTR_REQ_SPELLMOD tests `procSpell->m_appliedMods` (SpellAuras.cpp:2188),
      which only ever contains aura-107/108 spellmods, so it would stop an aura-57 buff from EVER dropping its charge; bit
      4 = PROC_ATTR_REQ_MANA_COST is consumed at `SpellMgr.cpp:888-893` (`CanSpellTriggerProcOnEvent`) and can only REFUSE
      a drop; omitted because every Clearcast-eligible spell costs mana. Live 57529 likewise carries neither (SpellMgr.cpp:2258
      ORs REQ_SPELLMOD only for ADD_FLAT/ADD_PCT auras). See core_hardcodes.arcane_potency for why neither a rebind nor a
      literal copy of TBC''s `SPELLMOD_EFFECT2` encoding works.'
