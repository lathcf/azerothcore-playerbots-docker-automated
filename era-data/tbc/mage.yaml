# --- Arcane Potency crit buffs 948767-948769 (node 20817 triggers one per rank) -------------------
# THREE FRESH BUFFS BUILT ON THE **LIVE 57529 SHAPE**, not on TBC's own encoding (spec A.3 (e),
# `_ref.core_hardcodes.arcane_potency`). TBC 31571-31573 encode the talent as `aura 107 misc 12
# SPELLMOD_EFFECT2` masked onto Clearcasting 12536's identity bit, because wago TBC 12536 carries a
# SECOND effect (`e2 aura 57 MOD_SPELL_CRIT_CHANCE val 0`) for that modifier to raise. **Live 12536
# has no e2 slot** — WotLK deleted it — so a literal copy of TBC's encoding modifies nothing.
#
# `template: 57529` is load-bearing for the SHAPE: the clone inherits ProcTypeMask 69904, ProcCharges
# 1 and the attribute words. `durationIndex: 8` = 15 s (Clearcasting's own window) is a deliberate
# era choice; both raw values are recorded — live 57529/57531 use durIdx 21 (PERMANENT) with 1
