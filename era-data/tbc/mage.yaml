#
# **CONSUMPTION IS AUTHORED, NOT INHERITED — each buff carries its own `spell_proc` row carrying
# CLEARCASTING'S consumption mask, so the same cast that consumes the Clearcasting cost waiver drops
# this buff's single charge.** Leaving the row off does NOT work: `SpellMgr::LoadSpellProcs` would
# auto-generate one from the INHERITED 57529 effect mask (0x61400035, 0x1000, 0) = Fireball /
# Flamestrike / Scorch / Frostbolt / Pyroblast / Arcane Blast only, and
# `SpellMgr::CanSpellTriggerProcOnEvent` (SpellMgr.cpp:904-906) then refuses the charge drop for
# Arcane Missiles, Arcane Explosion, Fire Blast, Frost Nova, Blizzard, Cone of Cold, Dragon's Breath
# and Blast Wave — while aura 57 is ALL-SCHOOL crit, so an Arcane mage would keep the full
# +10/20/30% for the buff's remaining 15 s after a Clearcast Arcane Missiles.
# The row's mask is `proc_data_census` row `12536` verbatim: mask0 549591799 = 0x20c21af7,
# mask1 168000 = 0x29040 (note bit 6 = 0x40 is Blast Wave's live word-1 identity, which the Fire
# tab's Blast Wave clones keep, so they consume it too), phaseMask 1 = PROC_SPELL_PHASE_CAST,
# typeMask 0, hitMask 0, Chance 0.
# `flags: 69904` is the usual translation of the stock row's ProcFlags 0 ("use the spell's own DBC
# ProcTypeMask"): 69904 is what the clone inherits from 57529.
# **`attrMask` is 0, NOT Clearcasting's 12**, and that difference is load-bearing in both bits:
#   * 8 = PROC_ATTR_REQ_SPELLMOD tests `procSpell->m_appliedMods` (SpellAuras.cpp:2188), which only
#     ever holds aura-107/108 spellmods — on an aura-57 buff it would stop the charge dropping
