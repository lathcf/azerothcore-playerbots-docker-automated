    description: "Reduces the cooldown of your Rapid Fire ability by 1 min.  In addition, after killing an opponent that yields experience or honor, your next Aimed Shot, Arcane Shot or Auto Shot causes 10% additional damage.  Lasts 20 sec."
    auraDescription: "Damage of your next Aimed Shot, Arcane Shot or Auto Shot increased by 10%."
