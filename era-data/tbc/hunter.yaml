# swing; TBC's 2.5 s cast does reset it); `attributesEx4: 402653184` = TBC 0x18000000, restoring
# SPELL_ATTR4_FORCE_DISPLAY_CASTBAR (0x08000000) over live's IGNORE_COMBAT_TIMERS-only 0x10000000.
# That bit has NO reader in src/server — it is client-only — and reaches the client because
# tools/build_client_dbc.py builds the patch row through the same `helper_overrides`; without it a
# 2.5 s cast renders no cast bar (real-client checklist item).
