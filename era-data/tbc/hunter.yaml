    B_proc_options: 'ProcChance, ProcCharges, ProcTypeMask (wago ProcTypeMask_0), CumulativeAura (wago SpellAuraOptions).
      A missing wago row opposite a live "not a proc" default (chance 0/101, charges 0, mask 0, stack 0) is filtered; where
      LIVE really IS a proc the difference IS printed as `B:ProcRow TBC(no SpellAuraOptions row)->LIVE(...)` — THREE hits:
      19287 (the repurposed ''Survival Tactics''), 19591 Tamed Pet Passive 06, 13163 Aspect of the Monkey. This family is
      what separates Master Tactician (TBC ProcChance 6 -> live 10), Concussive Barrage (2/4 -> 50/100) and Entrapment (8/16/25
