      row: TrainerId 7, ReqLevel 22, MoneyCost 6000, **ReqAbility1 = 932305**
      problem: 'Same shape: a TBC hunter currently holds 932305 and can buy stock 3043 (the -3% WotLK version).'
      disposition: '**marker-gate (Task 5)** for the same reason, PLUS a new TrainerId-7 row for the TBC clone behind the
        new 948280 marker at the same cost 6000. This completes the per-era clone pattern (lesson 17e) — never an OR-gate
        on one shared row.'
    aimed_shot_r2_r7:
      rows: 20900/20901/20902/20903/20904/27065 (+ WotLK 49049/49050)
      disposition: '**self-gating.** `20900.ReqAbility1 = 19434`, and a TBC hunter is granted the era clone at r1, never stock
