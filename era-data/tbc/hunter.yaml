# --- Silencing Shot (node 20640) -----------------------------------------------------------------
# survival_map 34490 diverges on exactly THREE fields, and only one of them matters: TBC is ON the
# global cooldown (`StartRecoveryCategory 133` / `StartRecoveryTime 1500`) where live 34490 is
# 0 / 0 — WotLK took Silencing Shot off the GCD, which is a real PvP divergence a template clone
# would inherit. `Spell::TriggerGlobalCooldown` (Spell.cpp:8922) opens `int32 gcd =
# m_spellInfo->StartRecoveryTime; if (!gcd) ... return;`, so BOTH columns are authored: a time with
# no category loses the haste-scaling branch (:8948, which requires category 133 + time 1500) and
# the `Spell::CheckPetCast` gate, and a category with no time is inert.
# The other two are deliberately NOT authored:
#   * AttributesEx7 TBC 0 -> live 0x800 SPELL_ATTR7_CAN_CAUSE_INTERRUPT. Live flags the shot as an
#     interrupt so it feeds the interrupt-tracking paths; `_ref.attribute_divergences
#     .individually_load_bearing.34490_silencing_shot` rules it harmless to keep, and keeping it is
#     the behaviour a player expects from a silence on this core. INHERITED ON PURPOSE.
#   * The EFFECTS are byte-identical on both sides (no A-family hit in the survival map). They are
#     still authored below because the generator REFUSES a `template:` helper with no `effects:`
#     list (the template's slots would pass through wholesale and a top-level `aura:` would be
#     silently ignored) — the authored values are the live/TBC pair verbatim, transcribed from
#     ip-dbc/Spell.dbc 2026-09-05: `WEAPON_PERCENT_DAMAGE` 49+1d1 = 50%, and `aura 27 MOD_SILENCE`
#     -1+1d1 = 0 with EffectMechanic 9 (MECHANIC_SILENCE), which is what puts it under silence
#     immunity. Effect_3 is empty on the template and stays empty (a templated helper 0-fills the
#     slots its `effects:` list does not reach).
# SpellIconID 127 is inherited — note it is NOT 132, so Silencing Shot is outside the
# DIMINISHING_SCATTER_SHOT group on this core (SpellMgr.cpp:215-232 keys that group on word0 0x40000
# AND icon 132; Silencing Shot shares the family bit but not the icon). The clone reproduces stock
# behaviour there exactly. `spell_script_names` has NO row for 34490 (full `LIKE 'spell_hun%'` dump
# in `_ref.script_census`), so nothing needs rebinding.
- id: 948383
  name: Silencing Shot
  template: 34490          # CLONE stock Silencing Shot — inherits effects/attrs/icon/visual/20 s CD
  spellFixAck: >-
    `ApplySpellFix({ 34490, 41084, 42671 })` at SpellInfoCorrections.cpp:641 sets
    `spellInfo->Speed = 0.0f`, and a clone never receives it -- so this clone keeps the DBC value
    60.0. That is TBC's OWN value (wago 2.5.4 34490 Speed 60.0, printed in `_ref.survival_map.34490`
    alongside live's identical DBC 60.0), i.e. the un-inherited correction leaves the ERA-LITERAL
    projectile travel time rather than AzerothCore's zeroed one. There is no `speed` generator key,
    so this is an acknowledgement rather than an authored post-fix value; the choice is deliberate
    (lesson 17c) and the only consequence is that the era shot's silence lands on impact instead of
    instantly, exactly as it did in 2.4.3.
  startRecoveryCategory: 133   # TBC is ON the GCD (live 0 / 0)
  startRecoveryTime: 1500
  effects:
  - { effect: 31, basePoints: 49, dieSides: 1, targetA: 6 }                          # 50% weapon damage
  - { effect: 6, aura: 27, basePoints: -1, dieSides: 1, targetA: 6, mechanic: 9 }    # MOD_SILENCE 3 s
  client:
    name: Silencing Shot
    icon: 127              # stock 34490 SpellIconID
    skillLine: 163         # Marksmanship tab (SkillLineAbility 34490 -> 163)
    description: "A shot that deals 50% weapon damage and Silences the target for 3 sec."
    auraDescription: "Silenced."
# --- Rapid Killing buffs r1/r2 (node 20628's kill-proc triggers) ----------------------------------
# survival_map 35098/35099 are LIVE_MATCH on all fourteen families. They are cloned for ONE reason:
# their SPELLMOD_DAMAGE mask is (0x20801, 0, 0) = Auto Shot | Arcane Shot | **Aimed Shot's stock
# word0 bit 17**, and the era Aimed Shot clones deliberately carry word2 bit 21 instead — so an
# era-literal mask would not name them and Rapid Killing's +10/20% would silently skip the one shot
# the tooltip leads with. The clones carry TBC's own word 0 plus `maskC: 2097152`.
# DEVIATION FROM SPEC AMENDMENT A.8, RECORDED: A.8 says "grant the talent, clone the buffs". Those
# two halves are incompatible — stock 34948/34949 name 35098/35099 in `EffectTriggerSpell` BY ID, so
# a granted talent triggers the STOCK buffs and these clones would be unreachable dead rows. Node
# 20628 is therefore AUTHORED (a `spellmod` + `procPassive` node, see the node comment) so its
# passive triggers these ids. Nothing is lost by authoring: both talent ranks are LIVE_MATCH, they
# have no `spell_proc`/`spell_proc_event` row and no `spell_script_names` row (`_ref
# .proc_data_census` / `.script_census`), so the generated proc row reproduces the whole contract.
# The +10%/+20% amounts, the 20 s duration (DurationIndex 18) and the single proc charge are
# inherited from the templates unchanged. `client:` carries no `skillLine` — these are hidden buffs,
# never spellbook entries — and BOTH authored texts replace live's, which name WotLK's Chimera Shot
# in place of TBC's Auto Shot. The `description:` is authored even though these buffs have no
# spellbook entry: a templated clone otherwise inherits live's, which additionally interpolates
# `$/60000;34948s2` and `$35098s1` — references to STOCK ids an era hunter does not know, so a
# chat-linked buff would render blanks. (`client.description` cannot be blanked, only replaced.)
- id: 948384
  name: Rapid Killing
  template: 35098          # CLONE stock rank-1 buff — inherits 20 s duration, 1 charge, icon, attrs
  effects:
  - { effect: 6, aura: 108, basePoints: 9, dieSides: 1, misc: 0, targetA: 1, maskA: 133121, maskB: 0, maskC: 2097152 }
    # ^ SPELLMOD_DAMAGE (misc 0) +10%. maskA 133121 = TBC's 0x20801 verbatim (Auto Shot 0x1 |
    #   Arcane Shot 0x800 | stock Aimed Shot 0x20000); maskC adds the era Aimed Shot identity bit.
  client:
