    - Counterattack r1-r4 and Wyvern Sting sleep r1-r4 — spellbook AND the root/sleep debuff tooltips.
    - Scorpid Sting clone — spellbook AND the -5% hit debuff tooltip.
    - Readiness clone, Silencing Shot clone, Scatter Shot clone, Intimidation clone (if cloned) — spellbook; Silencing Shot
      and Scatter Shot also need the CC debuff text.
    - Expose Weakness payload clone, Master Tactician buff clones, Rapid Killing buff clones, the Ferocious Inspiration party
