        the clone drops that bit. Since **word2 bit 21 is free by construction, no stock mask can already cover it** — so
        EVERY one of these is AUTHORED with an explicit `affectsMask` that adds `c: 2097152`. There are no exceptions to check;
        the spec''s "if the LIVE stock mask already covers the chosen bit ... grant stock" branch is unreachable for a free
        bit. The list was produced by scanning both sides'' per-effect masks for `word0 & 0x20000`.'
