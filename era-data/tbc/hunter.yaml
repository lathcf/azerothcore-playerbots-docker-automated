    id_set_construction: "Seed = all 191 distinct rank spells across the 64 skeleton nodes, plus the ids the plan names (Aimed\
      \ Shot r2-r7, Trueshot r2-r4, Counterattack r2-r4, Wyvern Sting r2-r4 + the stock DoT, 3043, the payload candidates\
      \ 6150/34456/34471/34501/34837/34952/34953, the roots 19229/19410/19185, the Spirit Bond talents+carriers, three Tamed\
      \ Pet Passive carriers, and the Aspect of the Hawk rank chain). Closure = TRANSITIVE over EffectTriggerSpell on BOTH\
      \ sides (wago and the live DBC), re-run after every extension until it added nothing. FOUR EXTENSIONS were made during\
      \ the task, each of which the closure alone would have missed — this is the hunter analog of the rogue phase's poison\
      \ chain (lesson 17a):\n  * **spell_pet_auras edges.** `spell_pet_auras` is NOT an EffectTriggerSpell edge; the link\
      \ is\n    owner-spell -> row -> pet-side payload, resolved at aura-apply time in C++. Adding the six\n    payloads named\
      \ by the live rows (34457 was found from the TBC side, 35060/35061, 68361,\n    75593/75446/75447) is what produced\
      \ the single most important finding in this map: the TBC\n    Ferocious Inspiration delivery chain (34457 -> 34456)\
      \ is **entirely WAGO_ONLY**, while the\n    live rows point at WotLK payloads that are **LIVE_ONLY**.\n  * **the nine\
      \ family-9 pet passive CARRIERS** (20782, 8875, 19582, 19589, 20784, 34666, 34667,\n    34675, 55566). No talent row\
      \ triggers them; they are the spellmod TARGETS of eight BM\n    talents and are auto-learned by the pet (`Pet::LearnPetPassives`).\
      \ Without them, eight\n    `mask=(0x...)` values in the `tbc:` lines cannot be decoded.\n  * **core-script-reached ids**\
      \ from `spell_hunter.cpp`'s `HunterSpells` enum that no data edge\n    reaches: 24406 (Improved Mend Pet's dispel payload),\
      \ 34720 (Thrill of the Hunt's mana),\n    37506 (the id `spell_hun_scatter_shot` is ACTUALLY bound to), 24394 (Intimidation's\
      \ stun).\n  * **the 32 BASELINE spells the tree's spellmods and masks target** (the shots, stings,\n    aspects, traps\
      \ + trap effects, Mend Pet, Revive Pet, Wing Clip, Feign Death, Raptor\n    Strike, Mongoose Bite, Rapid Fire, Kill\
      \ Command, Disengage, Aspect of the Viper) —\n    informational, since a stock base spell can never be era-corrected,\
      \ but five of them turn\n    out to matter (see `accepted_gaps:`).\nThe sweep is closed: re-running the transitive walk\
      \ over the final 301-id set adds nothing."
