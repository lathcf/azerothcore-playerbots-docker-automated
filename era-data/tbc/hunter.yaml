      NAME, matching the Vanilla 932966 precedent.
    - The Improved Wing Clip / Improved Concussive Shot / Entrapment root+stun payloads — hidden.
    - 'The ''Era: TBC Hunter'' marker 948280 — **EXCEPTION: it DOES need a `client:` block**, because it is a trainer `ReqAbility1`
      and the trainer UI formats the requirement name (the 932939 nil-format crash precedent). Same as 932304/932305.'
