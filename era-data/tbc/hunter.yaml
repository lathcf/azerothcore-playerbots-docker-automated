      percent. Real magnitude hits (both sides percent): Scorpid Sting 9->11, Intimidation 6->8, Scatter Shot 6->8, Bestial
      Wrath 10->12.'
    F_class_options: SpellClassSet and the spell's OWN identity mask WORD 0 only (words 1-3 excluded as cross-build encoding
      noise, per the shaman A.12 / warrior / rogue precedent). EXACTLY ONE divergence in the whole 301-id set — Immolation
      Trap Effect 13797 (TBC ownMask word0 0x4 -> LIVE 0x0; live moved its identity to word2 0x20000). SpellClassSet never
      differs. Read `family9_bit_census:` before decoding any mask.
    G_cooldowns: RecoveryTime, CategoryRecoveryTime, StartRecoveryTime (wago SpellCooldowns). It is the ONLY family that separates
