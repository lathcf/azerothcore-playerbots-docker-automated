# --- Bestial Wrath (node 20617) ------------------------------------------------------------------
# survival_map 19574 (DIVERGED): TBC DurationIndex 85 = 18 s (live 1 = 10 s), TBC AttributesEx5 0
# (live 0x60008), TBC StartRecoveryCategory 133 (live 0). Everything else — the three effects, the
# 2-min cooldown, ManaCostPct 10, RangeIndex 6, Attributes 0x20010000, AttributesEx 0x8400 — is
# identical, so a template clone overriding those three fields is the faithful era version.
# The core CheckCast script `spell_hun_bestial_wrath` is bound BY ID to stock 19574 and is therefore
# dead on the clone -> re-bound via scriptBindings (the Vanilla clone 932967 precedent), together
# with the new module arm `era_hun_beast_within_tbc` (see 948291/948292 below).
- id: 948290
  name: Bestial Wrath
  template: 19574          # CLONE stock Bestial Wrath — inherits visual/range/cooldown/attrs
  spellFixAck: >-
    NOT an ack — BOTH by-id corrections on 19574 are now REPRODUCED IN DATA below (closed at the
    phase-9 close-out, 2026-09-06). (a) SpellInfoCorrections.cpp:5199-5206 ORs
    SPELL_ATTR2_NO_SCHOOL_IMMUNITIES (0x04000000) into 42292 / 59752 / 19574 / 34471 — authored as
    `attributesEx2: 67108864` (the template's DBC AttributesEx2 is 0, so 0 | 0x04000000 is the
    post-fix value). (b) :4071 ORs SPELL_ATTR4_AURA_EXPIRES_OFFLINE (0x4) — authored as
    `attributesEx4: 4` (template DBC AttributesEx4 is 0). The `attributesEx4` generator key was
    added for the Aimed Shot clone chain's client-only FORCE_DISPLAY_CASTBAR bit; the shipped
    Vanilla clone 932967 carries the same two values. `era_audit.py::_SPELLFIX_KEYABLE` does not
    list AttributesEx4, so this key stays authored for the reader, not for the audit.
  durationIndex: 85        # TBC 18 sec (SpellDuration.dbc index 85 = 18000 ms); stock index 1 = 10 sec
  manaCostPct: 10          # TBC 10% of base mana — the SAME as live. Stated explicitly (not inherited)
                           # because the Vanilla clone 932967 carries 12%: that is the 1.12 value, and
                           # TBC re-priced it. survival_map 19574 lists no E-family diff.
  startRecoveryCategory: 133   # TBC gcdCat 133 (live 0) — survival_map "D:StartRecoveryCategory
                               # TBC133->LIVE0". StartRecoveryTime stays 0, so casting BW still
                               # TRIGGERS no GCD (Spell::TriggerGlobalCooldown early-returns on a
                               # zero time); what the category restores is TBC's behaviour that BW
                               # cannot be cast WHILE a category-133 GCD is running
                               # (Spell::CheckCast -> HasGlobalCooldown, keyed on the category).
  attributesEx2: 67108864  # SPELL_ATTR2_NO_SCHOOL_IMMUNITIES — post-fix value, see spellFixAck (a)
  attributesEx4: 4         # SPELL_ATTR4_AURA_EXPIRES_OFFLINE — post-fix value, see spellFixAck (b)
  attributesEx5: 0         # spec Amendment A.6: TBC's AttributesEx5 is 0. Live 19574 (and, by template
                           # inheritance, the Vanilla clone 932967) carry 0x60008; author the era value.
  effects:                 # 19574's own three effects re-authored verbatim (lint requires explicit
                           # effects on a template clone; stock convention basePoints X + dieSides 1
                           # -> value X+1). TBC and live agree on all three.
  - { effect: 6, aura: 61, basePoints: 49, dieSides: 1, targetA: 5 }             # MOD_SCALE +50 (pet)
  - { effect: 6, aura: 79, basePoints: 49, dieSides: 1, misc: 127, targetA: 5 }  # MOD_DAMAGE_PERCENT_DONE +50 all schools
  - { effect: 6, aura: 77, basePoints: -1, dieSides: 1, misc: 12, targetA: 5 }   # MECHANIC_IMMUNITY (stun)
  client:
    name: Bestial Wrath
    icon: 1680             # stock 19574 SpellIconID
    skillLine: 50          # Beast Mastery tab (stock 19574's SkillLine)
    description: "Send your pet into a rage causing 50% additional damage for 18 sec. While enraged, the beast does not feel pity or remorse or fear and it cannot be stopped unless killed."
    auraDescription: "Enraged."
