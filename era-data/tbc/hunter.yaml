      disposition: '**self-gating** on `24132.ReqAbility1 = 19386`.'
    orphaned_higher_rank_check:
      ran: true
      result: '**Zero deletions proposed, therefore zero orphans possible.** The framework check (`SELECT ts.SpellId ... WHERE
        ts.ReqAbility1 IN (<deleted ids>)`) has an empty input set for this phase. Every WotLK-only rank — Aimed Shot 49049/49050,
        Counterattack 48998/48999, Wyvern Sting 49011/49012 — stays reachable for a native WotLK hunter, because their prerequisite
        chains are untouched.'
    ip_cast_cancel_lists:
      file: azerothcore-wotlk/modules/mod-individual-progression/src/IndividualProgressionPlayer.cpp
      enclosing_condition_verbatim: "void OnPlayerSpellCast(Player* player, Spell* spell, bool /*skipCheck*/) override\n{\n\
        \    if (!sIndividualProgression->enabled || !player || !player->IsInWorld() || !spell)\n        return;\n\n    if\
        \ (sIndividualProgression->isBotAccount(player)) // bots don't cast lower ranks of spells\n        return;\n\n   \
        \ if (sIndividualProgression->EnableAllSpellRanks)\n        return;\n\n    if (!sIndividualProgression->hasPassedProgression(player,\
        \ PROGRESSION_TBC_TIER_5) || player->GetLevel() < 70) // no need to check spells if player is not in WotlK\n     \
        \   return;\n"
      hunter_lists:
      - '`Hunter_SM_1_4` (SchoolMask 1 or 4) — 34 ids: Aimed Shot 19434/20900-20904, Counterattack 19306/20909/20910, Explosive
        Trap, Immolation Trap, Mongoose Bite, Multi-Shot, Raptor Strike ranks.'
      - '`Hunter_SM_8_16_64` (SchoolMask 8/16/64) — 37 ids: Serpent Sting, Arcane Shot, Mend Pet, Hunter''s Mark, Volley,
        **Wyvern Sting 19386/24132/24133**, Freezing Trap, Scare Beast ranks.'
      ruling: '**Fires ONLY for a WotLK-stage player.** The guard requires `hasPassedProgression(player, PROGRESSION_TBC_TIER_5)`
        AND `GetLevel() >= 70`; a TBC-stage character fails the first test and returns before any list is walked. It also
        early-returns for bot accounts. Every id in both lists is a STOCK id, so the TBC era clones are not named anyway —
        but the enclosing condition is the reason it cannot matter, and it is quoted here verbatim per lesson 15. **No interaction
        with this phase.**'
    devouring_plague_style_items:
      result: NONE. The trainer-gating intent test (a `trainer_spell` row is a hole only if IP itself gates that spell somewhere
        and a missed set leaks it) finds no hunter analog — the only IP-gated hunter surface is the cast-cancel list above,
        which gates nothing at TBC stage.
