# --- Aimed Shot r1-r7 (node 20627) ---------------------------------------------------------------
# THE TAB'S LOAD-BEARING DECISION (spec Amendment A.7). Stock Aimed Shot's identity is family 9 +
# word0 bit 17 (0x00020000), and `SpellInfoCorrections.cpp:5311-5318` sweeps EVERY family-9 record
# carrying that bit: `RecoveryTime = 10 * IN_MILLISECONDS` + SPELL_ATTR6_NO_CATEGORY_COOLDOWN_MODS.
# `SpellMgr.cpp:3499` keys SPELL_ATTR0_CU_FORCE_SEND_CATEGORY_COOLDOWNS on the same bit. TBC's Aimed
# Shot is a 2.5 s cast on a 6 s cooldown, so the clone MUST NOT carry that bit — it takes the FREE
# word2 bit 21 (`maskC: 2097152`) instead. The bit is free in BOTH stores: a scan of all 1151
# SpellClassSet==9 records in the running Spell.dbc leaves word2 bits 21-30 unused, and none of the
# 74 family-9 rows in the acore_world.spell_dbc overlay carries one (`_ref.aimed_shot_identity`).
# Because the bit is free BY CONSTRUCTION, no stock spellmod can already reach the clone, so every
# TBC talent whose mask names Aimed Shot is AUTHORED with an explicit `affectsMask` adding
# `c: 2097152`: Efficiency 20624, Mortal Shots 20630, Hawk Eye 20643 (Task 7), the Master Tactician
# buff clones 948346-948350 (Task 7) and the Rapid Killing buff clones below. Careful Aim 20636,
# Barrage 20633 and Improved Barrage 20638 do NOT name Aimed Shot in TBC — live ADDS 0x20000 to the
# last two, so GRANTING them stock delivers TBC's narrower scope by construction.
# COOLDOWN PLACEMENT IS A DELIBERATE DEVIATION FROM TBC'S OWN ENCODING: wago 2.5.4 puts the 6 s on
# `Category 2` + `CategoryRecoveryTime 6000`, but a CATEGORY cooldown is only pushed to the client
# for a spell carrying the 0x20000 bit (SpellMgr.cpp:3499) — which this clone deliberately lacks —
# so the client would show no cooldown at all. `category: 0` + `categoryCooldown: 0` +
# `cooldown: 6000` puts the whole 6 s in RecoveryTime, which is always sent. Same choice the shipped
# Vanilla clones 932952-932957 make, and it is why the template's inherited Category 85 /
# CategoryRecoveryTime 10000 must BOTH be zeroed here.
# ATTRIBUTES (`_ref.attribute_divergences.individually_load_bearing.19434_aimed_shot`, all three
# authored): `attributes: 4259858` = TBC 0x410012, which adds SPELL_ATTR0_TRACK_TARGET_IN_CAST_
# PLAYER_ONLY over live's 0x10012; `attributesEx2: 0` drops live's 0x20000
