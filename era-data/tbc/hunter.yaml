      row: TrainerId 7, ReqLevel 60, MoneyCost 2200, **ReqAbility1 = 932305** ('WotLK Hunter' marker)
      problem: The marker gate was added by `2026_08_25_00_..._deterrence_gate.sql` for the Vanilla phase, and the current
        `CLASS_HUNTER` reconcile `else` arm grants 932305 to EVERY post-Vanilla hunter — so a **TBC** hunter holds 932305
        today and can BUY stock Deterrence while the TBC tree offers it as a talent.
      disposition: '**marker-gate (Task 5).** The three-way marker chain (spec §4a) fixes it: the `else` arm narrows to `era
        >= ERA_WOTLK`, so a TBC hunter no longer holds 932305. NO trainer SQL change is needed for this row — only the reconcile
        arm.'
