# --- Improved Concussive Shot 3 s stun payload (node 20621's proc trigger) ------------------------
# survival_map 19410 is WAGO_ONLY: TBC's stun does not exist in the 3.3.5a DBC at all (WotLK
# reworked the talent into a two-rank Concussive-Shot DURATION spellmod with no stun), so this is a
# RECONSTRUCTION from TBC's own record rather than a clone. FRESH id, not a reuse of the shipped
# Vanilla stun 932971: `_ref.reuse_ledger.932971` measures four diffs against TBC's 19410 —
# Attributes 0x800000 (ALLOW_CAST_WHILE_DEAD), AttributesEx 0x88 (NO_REDIRECTION | NO_REFLECTION),
# DefenseType 1 and the base-point value — all of which are authored here and none of which the
# Vanilla helper carries. DurationIndex 27 (3 s), `aura 12 MOD_STUN`, Mechanic 12 and the physical
# school DO match the Vanilla helper.
# `defenseType: 1` is not cosmetic: `Unit::SpellHitResult` returns SPELL_MISS_NONE unconditionally
# for DmgClass 0, so a from-scratch stun that leaves it at the zero default is UNRESISTABLE (the TBC
# priest Blackout 948079 precedent; the Vanilla 932971 has exactly that gap and is left alone).
# The spell-level `mechanic: 12` is what puts it in the stun DR group and under stun immunity.
# A custom stun needs a `client:` block or the 3.3.5a client renders no debuff icon at all.
- id: 948381
  name: Improved Concussive Shot
  aura: 12                 # SPELL_AURA_MOD_STUN
  mechanic: 12             # MECHANIC_STUN (SharedDefines.h) — DR group + stun immunity
  durationIndex: 27        # TBC 3 s (SpellDuration idx 27 = 3000)
  targetA: 6               # TARGET_UNIT_TARGET_ENEMY
  basePoints: 0            # TBC's own value (the stun carries no amount)
  school: 1                # physical, as TBC's record
  attributes: 8388608      # TBC 0x800000 SPELL_ATTR0_ALLOW_CAST_WHILE_DEAD
  attributesEx: 136        # TBC 0x88 = NO_REDIRECTION (0x8) | NO_REFLECTION (0x80)
  defenseType: 1           # TBC 1 (MAGIC) — a DmgClass-0 stun cannot be resisted at all
  client:
    name: Improved Concussive Shot
    icon: 15               # Concussive Shot 5116's SpellIconID
    auraDescription: "Stunned."
# --- Scatter Shot (node 20632) -------------------------------------------------------------------
# Was a GRANT of stock 19503 (spec Amendment A.5); CLONED at the phase-9 final review, which CLOSES
# the Scatter Shot half of accepted gap 11. survival_map 19503 lists FOUR divergences and two of
# them are real: `ManaCostPct` TBC 6 -> live 8, and `AuraInterruptFlags` TBC 0x2 -> live 0x480002.
# The second is the one that changes play: TBC's 0x2 is AURA_INTERRUPT_FLAG_DAMAGE alone — "any
# damage caused will remove the effect", exactly what the TBC tooltip promises — where live adds the
# 0x480000 TAKE_DAMAGE-family bits WotLK introduced, so a granted stock Scatter Shot breaks on events
# TBC's own record never breaks it on (the same divergence the whole Wyvern Sting chain and Freezing
# Trap Effect carry, _ref line 103). `auraInterruptFlags` is a NEW generator key added with this
# clone (tools/gen_era_talents.py `_HELPER_SCALARS`, TDD-covered, byte-neutral for shipped data).
# The remaining divergence — BaseLevel/SpellLevel 30 -> 15 — is inert for a talent-taught spell and
# is deliberately NOT authored.
# TEMPLATING 19503 IS LOAD-BEARING, not convenience: `SpellMgr.cpp:215-232` keys
