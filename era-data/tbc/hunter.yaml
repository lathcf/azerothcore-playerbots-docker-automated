  accepted_gaps:
  - id: 1
    name: Improved Feign Death is behaviorally inert on this core
    carried_from: Vanilla record gap 1 / spec §7 item 1
    detail: '`AuraEffect::HandleFeignDeath` computes no resist roll at all (the SMSG_FEIGN_DEATH_RESISTED branch is commented
      out, as retail WotLK ships), so a `SPELLMOD_RESIST_MISS_CHANCE` on Feign Death buys nothing. Node 20653''s rows are
      authored faithfully at TBC''s +2/+4 and would engage if the core restored the roll.'
    closes_when: The core restores the FD resist roll (a core patch; out of scope under the zero-core-patch policy).
  - id: 2
    name: Bestial Swiftness outdoor gate — REOPENED AS A CANDIDATE FIX, not a gap
    carried_from: Vanilla record gap 2 / spec §7 item 2
    detail: 'The Vanilla phase shipped node 18308 as `mechanic: pet` because 19596 live is a direct `aura 31` and nothing
      delivers it to the pet; a pet-applied buff is not area-gated, so +30% applied indoors too. **TBC''s own 19596 is a different
      shape** — an OWNER-held SPELLMOD onto Tamed Pet Passive 04 carrying `SPELL_ATTR0_ONLY_OUTDOORS`. Because the passive
      is held by the PLAYER, the core''s outdoor gate DOES apply. Authoring node 20607 that way reproduces the restriction
      for free.'
    closes_when: Node 20607 ships as an auto-passive spellmod with `attributes` including 0x8000 — i.e. THIS PHASE can close
      it for TBC. Vanilla stays as-is unless separately back-ported.
  - id: 3
    name: Improved Scorpid Sting is not a TBC node
    carried_from: Vanilla record gap 3 (informational)
    detail: The Vanilla tree has Improved Scorpid Sting (node 18328, DUMMY-marker misc 16, read by `era_hunter_scorpid_sting`).
      **The TBC tree has no such node** — it is absent from the 64-node skeleton. The marker and its script stay Vanilla-only;
      the TBC Scorpid clone needs neither.
    closes_when: N/A — recorded so nobody wires misc 16 into the TBC dataset.
  - id: 4
    name: Frost Trap Aura's slow magnitude is a BASELINE divergence (TBC -60%, live -50%)
    detail: '`13810 A:e1 TBC(27,33,-60,...) -> LIVE(27,33,-50,...)`. Frost Trap is a baseline trained ability, and era-talents
      never clones a baseline spell without a deliberate per-era decision (the Scorpid Sting exception was user-locked). A
      TBC hunter''s frost trap slows 10 percentage points less than TBC''s.'
    closes_when: A user decision to extend the per-era baseline-clone exception to Frost Trap (the wago values are in this
      file; nothing is unknown).
  - id: 5
    name: Hawk Eye does not extend the era Aimed Shot clone's range
    status: '**CLOSED by spec Amendment A.7 / A.15 item 5 — not a shipped gap.**'
    detail: Hawk Eye's `SPELLMOD_RANGE` mask carries Aimed Shot's stock word0 0x20000 on both sides; the era clone carries
      word2 0x200000 instead, so a GRANTED stock Hawk Eye would extend every other shot's range but not the era Aimed Shot's.
    closed_by: 'Node 20643 is AUTHORED as three auto-passives with `affectsMask` = TBC''s word-0 set plus `c: 2097152`. Cost:
      three auto-passive rows. The id is kept in the ledger so the reasoning survives; nothing ships degraded.'
  - id: 6
    name: Frost Trap Slow 67035 is unreachable by any spellmod
    carried_from: Vanilla record gap 6
    detail: '67035 carries an all-zero family mask, so no Clever Traps / Trap Mastery spellmod can reach it. **In TBC this
      gap is narrower than in Vanilla**: 67035 and its parent trigger 63487 are both LIVE_ONLY (WotLK re-plumbing); TBC''s
      frost trap GO cast 13810 directly, and 13810 IS masked. So the era-visible ground-cloud duration/resist ARE extended;
      only the WotLK-added single-target initial slow is untouched.'
    closes_when: N/A — it is a WotLK addition an era hunter simply also gets. Recorded, not fixed.
  - id: 7
    name: Lethal Shots and Ranged Weapon Specialization have all-weapon / all-school scope
    carried_from: Vanilla record gap 5
    detail: Lethal Shots grants stock `aura 52 MOD_WEAPON_CRIT_PERCENT` (which recomputes ALL weapon crit, so it also raises
      melee crit) and RWS uses `aura 79` misc 127 (all-school damage %, not ranged-weapon-only). No ranged-only weapon-crit
      or ranged-weapon-only damage aura exists in 3.3.5a. TBC's own rows use the SAME auras, so this is the scope both eras
      ship.
    closes_when: N/A — the stock chains ship the same scope.
  - id: 8
    name: TBC Aimed Shot's -50% healing rider needs `aura 118 MOD_HEALING_PCT` on a target the shot HITS
    detail: 'TBC''s Aimed Shot e2 is `aura 118 MOD_HEALING_PCT -50 misc 127, ImplicitTarget 6`. That aura exists on this core
      (it is what live Spirit Bond''s WotLK half uses), so the effect is expressible in data. **The uncertainty is duration**:
      TBC''s 19434 carries `DurationIndex 1` (10 s) at the SPELL level, which is what the debuff will inherit. Recorded because
      a reviewer will ask where the debuff duration comes from — it is the spell''s own DurationIndex, not a separate value.'
    closes_when: Real-client verification that the debuff shows 10 s (real-client checklist item).
  - id: 9
    name: Expose Weakness's '25% of your Agility' needs a script, not data
    detail: TBC 34501's payload is `aura 127 RANGED_ATTACK_POWER_ATTACKER_BONUS 25` + `aura 165 MELEE_ATTACK_POWER_ATTACKER_BONUS
      25` on the TARGET, and both auras take a FLAT amount on 3.3.5a. TBC's server computed the 25%-of-Agility server-side;
      the DBC literally says 25. Shipping the literal value would give +25 flat AP instead of ~+250.
    closes_when: An era module AuraScript (`era_hun_expose_weakness`) supplying the amount in `DoEffectCalcAmount` from the
      CASTER's Agility, exactly like the shaman Tree-of-Life Spirit precedent. **Escalation rung 5 (module script), NOT a
      core patch.** Basepoints stay 0 so a script that never runs ships nothing rather than a wrong magnitude.
  - id: 10
    name: Trueshot Aura's rank-4 trainer cost is a curve CHOICE, not a read value
    detail: There are no stock Trueshot trainer rows at all, so the r2-r4 prices are interpolated from the talent-chain sub-curve.
      L50 (1800) and L60 (2500) are unambiguous; **at L70 the two stock talent-rooted rows disagree — Wyvern Sting r4 = 5000
      and Aimed Shot r7 = 10000.**
    decided: '**5000 (spec Amendment A.9 / A.15 item 10)** — the Wyvern Sting chain is the only stock talent-rooted chain
      whose rank levels are exactly 50/60/70, so it is the one self-consistent series to copy. State the choice in the migration
      comment.'
    closes_when: N/A — a deliberate choice between two equally authentic stock prices, recorded so it is not re-litigated.
  - id: 11
    name: Intimidation and Scatter Shot cost 8% of base mana instead of TBC's 6%
    detail: 'Both nodes GRANT stock (spec Amendment A.5). Their ONLY era-relevant divergence is `ManaCostPct` 6 -> 8 (Intimidation
      additionally gains live''s `AttributesEx3 CAN_PROC_FROM_PROCS`). Cloning either was the fidelity-maximal alternative
      and was declined: an Intimidation clone would lose `spell_hun_intimidation`, its positive `spell_proc_event` row (procEx
      1027) and the live-only e2 `SPELL_EFFECT_SCRIPT_EFFECT` that sends the pet at the target, in exchange for two percentage
      points of mana.'
    closes_when: A later decision to clone either spell; the wago values are recorded on both survival_map entries and nothing
      is unknown.
  open_questions:
    counterattack_reuse:
      question: Take the three field-identical Vanilla Counterattack clones (932979/932958/932959) for TBC r1-r3, or mint
        four fresh?
      evidence: '`reuse_ledger."932979_932958_932959"` — ZERO diffs across all fourteen families on all three pairs. The counter-argument
        is chain coherence (r4 has no Vanilla counterpart) and era-keyed strip tables.'
      decided: '**FRESH (A.10)** — mint 948338-948341 for r1-r4. The identity is recorded as evidence, not acted on: r4 has
        no Vanilla counterpart, the strip tables are era-keyed, and a mixed-era chain would be the only one of its kind.'
    bestial_wrath_attributesEx5:
      question: 'Author `attributesEx5: 0` (era-literal, BW not castable while stunned/feared/confused) or keep live''s 0x60008
        (matching the shipped VANILLA clone 932967)?'
      evidence: TBC SpellMisc.Attributes_5 = 0; live AttributesEx5 = 0x60008; the Vanilla clone carries 0x60008 by template
        inheritance. Both raw values recorded in `attribute_divergences.individually_load_bearing.19574_bestial_wrath`.
      decided: '**`attributesEx5: 0` (A.6)** — author the TBC value (lesson 17c: author the era value for an inherited AttributesEx3/5
        bit). The Vanilla clone 932967''s inherited 0x60008 is flagged for the Vanilla fix round (A.14 item 2), NOT actioned
        this phase, so the two eras will deliberately differ until then.'
    trueshot_rank_costs:
      question: 1800 / 2500 / 5000 (the Wyvern Sting series) or 1800 / 2500 / 10000 (Aimed Shot's L70 price)?
      evidence: '`trainer_cost_curve.per_clone_row_costs.trueshot_resolution` — the two stock rows at L70 disagree (5000 vs
        10000); L50 and L60 are unambiguous.'
      decided: '**1800 / 2500 / 5000 (A.9)** — the Wyvern Sting chain is the only stock talent-rooted chain at exactly 50/60/70;
        Aimed Shot''s L70 10000 is the rejected alternative (recorded as accepted gap 10, a curve choice). **A.9 also bundles
        a VANILLA re-price into Task 8: 932962/932963 from 8000/16000 down to 1800/2500** — the shipped rows came off the
        baseline curve and predate commits 1286f34 / d1263c5.'
    hawk_eye_grant_or_author:
      question: GRANT stock Hawk Eye and accept gap 5, or AUTHOR three auto-passives so the range mod reaches the era Aimed
        Shot?
      evidence: '`aimed_shot_identity.talents_that_reach_aimed_shot` entry for node 20643.'
      decided: '**AUTHOR three auto-passives (A.7)** with `affectsMask` = TBC''s word-0 set plus `c: 2097152`. **Accepted
        gap 5 is CLOSED by this decision** (A.15 item 5) and node 20643 moves from the GRANT bucket to the AUTHOR bucket.'
    mortal_shots_serpent_sting_bit:
      question: Should the authored Mortal Shots mask include 0x4000 (Serpent Sting), which the core ADDS to stock by id but
        TBC's own row does not have?
      evidence: '`spellfix_inheritance.19485_19490_mortal_shots`. TBC''s crit-damage bonus does not list Serpent Sting; the
        core''s fix is an AzerothCore opinion.'
      decided: '**WITHOUT 0x4000 (A.7)** — author TBC''s own set, era-literal, plus the era Aimed Shot bit `c: 2097152`.'
    intimidation_and_scatter_shot:
      question: CLONE for the `ManaCostPct` 6 vs 8 fidelity, or GRANT stock and accept a 2pp cost gap?
      evidence: '`proc_data_census.19577` (a clone loses `spell_hun_intimidation` AND the positive `spell_proc_event` row
        AND the live-only pet-charge SCRIPT_EFFECT slot); `core_hardcodes.scatter_shot` (nothing to lose there, but the divergence
        is the same 2pp).'
      decided: '**GRANT stock both (A.5)**, with the 2pp `ManaCostPct` difference recorded as accepted gap 11. Nodes 20612
        and 20632 move from the CLONE bucket to the GRANT bucket.'
    silencing_shot:
      question: CLONE for the 1.5 s GCD, or GRANT stock and accept an off-GCD capstone?
      evidence: '`survival_map.34490` — the divergences are StartRecoveryCategory 133 -> 0, StartRecoveryTime 1500 -> 0, and
        live''s AttributesEx7 CAN_CAUSE_INTERRUPT. Nothing script- or proc-bound is lost by cloning.'
      decided: '**CLONE (A.6)** — the GCD is expressible with the generator''s `startRecoveryCategory`/`startRecoveryTime`
        keys (gained in the priest phase), plus a `speed: 0` authored value or `spellFixAck` for the by-id `ApplySpellFix({34490,...})`.'
