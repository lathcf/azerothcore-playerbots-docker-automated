      live_name: Survival Tactics
      hazard: HIGH
      detail: 'TBC 19286/19287 are `aura 107 ADD_FLAT_MODIFIER, misc 16 SPELLMOD_RESIST_MISS_CHANCE, +2/+4, mask (0x100,0,0)`
        = Feign Death — the classic "Improved Feign Death". WotLK reused the two ids for **Survival Tactics**: the effect
        tuple happens to still read as a +2/+4 resist-miss mod (which is why family A did NOT flag 19286), but the live mask
        is (0x11c, 0x2000, 0) — Feign Death PLUS Freezing/Explosive/Immolation traps PLUS Snake Trap Effect — and live adds
        an e2 `SPELLMOD_COOLDOWN -2000/-4000` half. Granting stock ships the WRONG TALENT. ONLY the N-family name comparison
        and the O-family mask pass caught this. Node 20653 is therefore AUTHORED, not granted.'
    19596:
      tbc_name: Bestial Swiftness
      live_name: Boar's Speed
      hazard: MEDIUM
      detail: 'Same id, completely different encoding. TBC 19596 is the CLASSIC owner-spellmod shape: `aura 107 ADD_FLAT_MODIFIER,
        misc 8 SPELLMOD_ALL_EFFECTS, +30, mask (0x10000000,0,0)` = Tamed Pet Passive 04 (19582, the aura-31 speed carrier
        whose own base amount is 0), plus `Attributes 0x81d0` which includes **SPELL_ATTR0_ONLY_OUTDOORS**. Live 19596 is
        a direct `aura 31 MOD_INCREASE_SPEED +30` on whoever holds it, with the outdoor flag dropped. This RETIRES the Vanilla
        `_ref`''s `grants.boars_speed` "Bound is NOT viable / how it reaches the pet is UNRESOLVED" note *for TBC*: the TBC
        record answers it — the owner holds a spellmod and the pet''s own auto-learned carrier picks it up through `GetSpellModOwner()`,
        the same mechanism Frenzy 19621 and Bestial Discipline 19590 already use and which the Vanilla phase shipped as Bound.
        See node 20607''s disposition, and `accepted_gaps` id 2.'
