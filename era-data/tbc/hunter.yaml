# --- Ferocious Inspiration (node 20616) — full RECONSTRUCTION (spec Amendment A.11) --------------
# Both halves of TBC's delivery are WAGO_ONLY (absent from the 3.3.5a Spell.dbc): the pet-side proc
# carrier 34457 (aura 42 PROC_TRIGGER_SPELL -> 34456, ProcTypeMask 69972 = every "damage done"
# event) and the party buff 34456 (aura 79 MOD_DAMAGE_PERCENT_DONE, radius index 12, ImplicitTargetA
# 20 TARGET_UNIT_CASTER_AREA_PARTY, DurationIndex 1 = 10 s). The stock `spell_pet_auras` rows
# 34455/34459/34460 point at the WotLK payloads 75593/75446/75447, which are LIVE_ONLY.
# TBC puts the magnitude on the TALENT (a SPELLMOD_ALL_EFFECTS +1/+2/+3 masked to 34456) and the
# proc chance on the talent too (SPELLMOD_CHANCE_OF_SUCCESS +100 masked to 34457). Neither spellmod
# survives the reconstruction: a `mechanic: pet` node's talent passive is a bare DUMMY by
# construction (`_pet_passive_row`), so the per-rank magnitude has to live ON THE PAYLOAD — hence
# THREE party buffs (948298-948300 at +1/+2/+3%) and THREE carriers (948295-948297), one carrier per
# rank because a carrier's EffectTriggerSpell is a single id. The proc CHANCE is likewise authored
# straight onto each carrier's generated `spell_proc` row (100, = TBC's 0 + the talent's +100).
# Identity: TBC's own word1 bits are kept on the payloads (carrier 0x20, party buff 0x40 — the
# latter is the only free word-1 bit live, and nothing binds either).
# LESSON 18: a fresh/cloned proc spell inherits NO `spell_proc` row — the `proc:` block below is
# what makes these fire at all.
- id: 948295
  name: Ferocious Inspiration
  attributes: 262608       # PASSIVE_ATTR — the shape every stock "Tamed Pet Passive" carrier uses
                           # (8875/19582/20784 all carry exactly 0x401D0). NB no `durationIndex:`:
                           # wago's 34457 says index 1 (10 s), which on this core would EXPIRE a
                           # permanent pet passive 10 s after every summon (memory: "era passive
                           # cloned from an active inherits its duration"). Index 0 + PASSIVE =
                           # infinite, which is what a pet passive must be.
  attributesEx3: 67108864  # SPELL_ATTR3_CAN_PROC_FROM_PROCS — TBC 34457's attr3 (a pet's triggered
                           # special attacks must be able to feed the proc)
  family: 9
  maskB: 32                # TBC 34457's own identity, word1 bit 5
  effects:
  - { effect: 6, aura: 42, basePoints: 0, trigger: 948298, targetA: 1 }   # PROC_TRIGGER_SPELL -> r1 party buff
  proc:
    flags: 69972           # TBC 34457 ProcTypeMask: DONE_MELEE_AUTO_ATTACK | DONE_SPELL_MELEE_DMG_CLASS
                           # | DONE_RANGED_AUTO_ATTACK | DONE_SPELL_RANGED_DMG_CLASS
                           # | DONE_SPELL_NONE_DMG_CLASS_NEG | DONE_SPELL_MAGIC_DMG_CLASS_NEG
    hitMask: 2             # PROC_HIT_CRITICAL — "when your pet scores a critical hit"
    chance: 100            # TBC: the carrier's own ProcChance is 0 and the talent adds +100
- id: 948296
  name: Ferocious Inspiration
  attributes: 262608
  attributesEx3: 67108864
  family: 9
  maskB: 32
  effects:
  - { effect: 6, aura: 42, basePoints: 0, trigger: 948299, targetA: 1 }
  proc: { flags: 69972, hitMask: 2, chance: 100 }
- id: 948297
  name: Ferocious Inspiration
  attributes: 262608
  attributesEx3: 67108864
  family: 9
  maskB: 32
  effects:
  - { effect: 6, aura: 42, basePoints: 0, trigger: 948300, targetA: 1 }
  proc: { flags: 69972, hitMask: 2, chance: 100 }
- id: 948298
  name: Ferocious Inspiration
