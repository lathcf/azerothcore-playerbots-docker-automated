  reuse_ledger:
    summary: '22 candidate pairs assessed. **THREE are field-identical on all fourteen families (Counterattack r1/r2/r3, ids
      932979/932958/932959) — the first genuine reuse hits in any TBC class phase.** Two more are one noise-field away (932966
      Wyvern DoT r1, 932968/932969 Spirit Bond carriers). Everything else is FRESH or MOOT. **DECIDED (spec Amendment A.10):
      ALL FRESH** — the three identical hits are recorded as evidence, not acted on; Counterattack mints fresh ids 948338-948341.
      See `counterattack_decision`.'
    '932979_932958_932959':
      name: Counterattack r1/r2/r3
      tbc_counterpart:
      - 19306
      - 20909
      - 20910
      result: '**IDENTICAL on all fourteen families** — zero diffs on any of the three pairs. Damage 40/70/110, mana 45/65/85,
        DurationIndex 28, Category 1135, CategoryRecoveryTime 5000, CasterAuraState 7, Attributes 0x250010 / AttributesEx
        0x200 / AttributesEx4 0x200, family 9 ownMask (0,0x80000,0), e2 `aura 26 MOD_ROOT mechanic 7`. Vanilla 1.12 and TBC
        2.4.3 Counterattack are the same spell.'
      counterattack_decision: "**FRESH 948338-948341, despite the equality (spec Amendment A.10).** Three reasons, stated\
        \ so the decision is not re-litigated:\n  1. TBC needs FOUR ranks (r4 = 27067, 165 damage @ L66) and no Vanilla counterpart\
        \ exists —\n     reusing r1-r3 and minting r4 gives a chain that is half Vanilla-band and half TBC-band,\n     which\
        \ the `spell_ranks` root, the `kHunterTrainedChains` strip table and the doctor\n     orphan predicates would all\
        \ have to straddle.\n  2. The strip tables are era-keyed. A shared id must be kept alive for BOTH eras, which\n  \
        \   breaks the `era != ERA_TBC` cross-era strip that is the safety net for trained ranks\n     after a band move (spec\
        \ §4c).\n  3. Every prior TBC class phase closed all-FRESH/MOOT; the druid Amendment A.3 reuse\n     (932500-932502,\
        \ 932513) was for NODE-GRANTED single passives, not a trainer-taught\n     rank chain.\nThe evidence for reuse was\
        \ genuine — it would have saved three helper ids and was the only defensible reuse in the phase — and it was weighed\
        \ and DECLINED. Do not reopen it without new evidence."
