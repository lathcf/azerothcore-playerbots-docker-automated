      file: acore_world.spell_proc / spell_proc_event row `-13165`; Spell.dbc 13165 e2
      code: 13165 e2 = `aura 42 PROC_TRIGGER_SPELL -> 6150`, and the negative proc row sets ProcFlags 64 (PROC_FLAG_DONE_RANGED_AUTO_ATTACK)
        / SpellPhaseMask 2.
      keys_on: '**Nothing. The proc lives ON Aspect of the Hawk itself.**'
      era_spell_that_reaches_it: N/A.
      disposition: '**DECISIVE ANSWER: there is no gate to reproduce.** "While Aspect of the Hawk is active" is structural
        — the proc aura only exists while the Aspect aura is applied. Improved Aspect of the Hawk 19552-19556 is a pure two-effect
        SPELLMOD pair (e1 `aura 107 misc 18 SPELLMOD_CHANCE_OF_SUCCESS +10` on the Aspect''s own mask 0x100000, raising 13165''s
        proc chance; e2 `aura 107 misc 8 SPELLMOD_ALL_EFFECTS +3/6/9/12/15` on Quick Shots'' mask (0,0x200,0), supplying the
        buff''s entire haste amount because 6150''s own basePoints is 0). **wago 2.5.4 and live are byte-identical on all
        five ranks.** So: GRANT stock, no `casterAuraSpell`, no aura-state, no DUMMY marker, no script. **DUMMY-marker misc
        19 is NOT consumed by this phase.** This is the same conclusion the Vanilla phase reached (its Finding section records
        IAotH as data-only).'
    readiness:
      file: src/server/scripts/Spells/spell_hunter.cpp:668-712 (`spell_hun_readiness`), bound POSITIVELY to 23989
      code: 'for each (spellId, cooldown) in caster->GetSpellCooldownMap(): if (spellInfo->SpellFamilyName == SPELLFAMILY_HUNTER
        && spellInfo->Id != SPELL_HUNTER_READINESS /*23989*/ && spellInfo->Id != SPELL_HUNTER_BESTIAL_WRATH /*19574*/ && spellInfo->Id
        != SPELL_DRAENEI_GIFT_OF_THE_NAARU /*59543*/) { remove RecoveryTime and CategoryRecoveryTime }'
      keys_on: '**A FAMILY WALK plus a three-entry id EXCLUSION list.** It is NOT an id list of what to reset.'
      era_spell_that_reaches_it: '**Every era band clone that carries `family: 9` IS reset** — the Aimed Shot chain, Deterrence,
        Wyvern Sting, Counterattack, Scatter Shot, Silencing Shot, the Scorpid clone. That is the desired behaviour and it
        comes for free.'
      disposition: "**CLONE + MODULE SCRIPT — and this is a trap the census nearly missed.** Two consequences:\n  1. The exclusion\
        \ `Id != 23989` protects Readiness's OWN cooldown. `Spell::SendSpellCooldown()`\n     runs at `Spell.cpp:3933`, BEFORE\
        \ `HandleLaunchPhase()`/`DoAllEffectOnTarget()` where the\n     SpellScript's `OnEffectHitTarget` handler runs — so\
        \ the caster's own Readiness cooldown\n     IS already in the map when the walk happens. **A clone bound to `spell_hun_readiness`\n\
        \     would clear its own 5-minute cooldown and be infinitely spammable.**\n  2. The exclusion `Id != 19574` protects\
        \ stock Bestial Wrath. The cached TBC tooltip for\n     23989 reads \"immediately finishes the cooldown on your **other**\
        \ Hunter abilities\" with\n     NO Bestial Wrath exception (the WotLK tooltip adds one), so the era clone SHOULD reset\n\
