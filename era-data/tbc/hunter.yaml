  method:
    conventions:
      effect_slot_numbering: 'THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/Effect_2/Effect_3,
        i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is DBC slot 1. Wherever a core-source
        token appears (script_census, core_hardcodes) it is written `EFFECT_n (0-based core enum; = this map''s e<n+1>)`.
        Never translate one to the other by name.'
      magnitudes_are_effective: 'EVERY magnitude in this file (`val<N>` in a `tbc:` line, and both sides of every `diff:`
        effect tuple) is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides == 1` and `basePoints` when DieSides
        is 0 (SpellEffectInfo::CalcBaseValue). Both sides of every comparison are normalised the same way before diffing,
        so a clone or live row that moved the +1 into DieSides does not read as a divergence. Raw figures, where quoted, say
        "raw". Anchor re-measured on this id set: Scorpid Sting 3043 TBC raw basePoints **-6** / DieSides 1 = effective **-5**,
        against live raw **-4** / DieSides 1 = effective **-3** — matching the TBC tooltip''s "-5% chance to hit" and the
        WotLK tooltip''s "-3%".'
      mana_is_flat_in_tbc: 'TBC hunter abilities carry a FLAT `SpellPower.ManaCost`; 3.3.5a converted almost all of them to
        `ManaCostPct`. Eleven `E:ManaCost TBC<n>->LIVE0` lines and six `E:ManaCostPct TBC0->LIVE<n>` lines in the sweep are
        that conversion and are NOT magnitude findings. Where BOTH sides are percent the comparison IS meaningful: 3043 (9
        -> 11), 19577 (6 -> 8), 19503 (6 -> 8), 19574 (10 -> 12). An era clone authors the TBC FLAT cost with `manaCostPct:
        0`.'
      verdict_vocabulary: 'LIVE_MATCH = every compared field in the fourteen verdict families agrees. DIVERGED = at least
        one compared field differs. WAGO_ONLY = present in TBC 2.5.4, ABSENT from the live 3.3.5a store (Spell.dbc AND the
        acore_world.spell_dbc overlay) — must be authored, never granted. LIVE_ONLY = present live, absent from TBC — must
        not be reachable by a TBC hunter. LIVE_MATCH_UNVERIFIED_SLOT = every compared field agrees but LIVE carries an EXTRA
        populated effect slot with no wago counterpart; those are enumerated under `unverified_slots:` on the entry and adjudicated
        in `live_extra_slot_adjudication:`. ABSENT_BOTH = used only in `triggers:` — the id exists in NEITHER wago 2.5.4 NOR
        the 3.3.5a store, i.e. a dangling `EffectTriggerSpell` that fires nothing (18350 is the only case). It is NOT a survival_map
        verdict: the sweep tests live presence first, so such an id would be mis-labelled WAGO_ONLY there — which is why 18350
        carries an explicit note on its entry. **A LIVE_MATCH verdict does NOT mean "safe to grant"** — the supplementary
        per-effect class-mask pass (family O) is excluded from the verdict and found seven load-bearing divergences on otherwise-LIVE_MATCH
        spells.'
      tbc_line_is_authoritative: 'Every survival_map entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record an author
        needs to reproduce the spell (per-effect tuple incl. effect class masks and implicit targets, plus duration/cast/range/school/proc/power/cooldown/category/mechanic/preventionType/
        aura-restriction/shapeshift/equip/level/interrupt/target/family/ownMask and every non-zero attribute word). Tasks
        6-8 author FROM THIS LINE; they do not need to re-fetch wago. Where a field is absent from the line it is zero in
        TBC. LIVE_ONLY entries carry no `tbc:` line by construction. **Ids with NO wago SpellClassOptions row** (so their
        `tbc:` line shows `(no SpellClassOptions row)` and family F is skipped rather than compared): 19295/19297/19298/19300/19301
        Deflection, 19410 Improved Concussive Shot stun, 19229 Improved Wing Clip root, 19185 Entrapment root, 19577 Intimidation,
        24394 Intimidation stun, 19426-19431 Lethal Shots, 19507-19510 Ranged Weapon Specialization, 19168-24297 Lightning
        Reflexes, 19370-19373 Killer Instinct, 24293-24295 Monster Slaying, 19151-19153 Humanoid Slaying, 19578/20895/19579/24529
        Spirit Bond, 34501 Expose Weakness payload, 34952/34953 Go for the Throat energize, 35060/35061 Focused Fire pet auras.
        Every one of these is genuinely family-0 LIVE as well (checked id-by-id), EXCEPT **19577 Intimidation**, whose LIVE
        record is family 9 with ownMask (0,0,0x8) — a missing row, not a family change. A clone of 19577 MUST carry `family:
        9` + `maskC: 8`.'
      duration_and_cast_indices_decoded: 'Decoded from the running server''s SpellDuration.dbc / SpellCastTimes.dbc / SpellRange.dbc
        / SpellRadius.dbc (extracted from the same container as Spell.dbc), never from memory: DurationIndex 1=10s, 3=60s,
        4=120s, 5=300s, 8=15s, 9=30s, 18=20s, 21=permanent(-1), 27=3s, 28=5s, 29=12s, 31=8s, 32=6s, 35=4s, 39=2s, 85=18s,
        165=7s. CastingTimeIndex 1=0ms, 14=3000ms, 18=-1000000 (the "next ranged attack" sentinel), **19=2500ms**. RangeIndex
        1=0, 2=5yd, 6=100yd, 11=15yd, 13=50000yd, 114=35yd. EffectRadiusIndex 9=20yd, 10=30yd, 11=45yd, 12=100yd, 13=10yd,
        23=40yd, 47=15yd. **TBC Aimed Shot is a 2.5 s cast (CastingTimeIndex 19), not 3 s** — the shipped Vanilla clone chain
        932952-932957 uses index 14 = 3000 ms.'
