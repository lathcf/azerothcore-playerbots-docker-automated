  spec_bucket_contradictions:
  - id: C1
    spec_says: §1 — 'Hunter tooltips are NOT yet cached under era-data/_ref/tbc/tooltips/'.
    reality: They ARE. 1425 tooltip JSONs are present and every hunter id checked resolved, with three exceptions (3043, 34456,
      34471, none of which has a cached file). Task 2's `--fetch` should still run to fill the gaps, but the statement is
      stale.
  - id: C2
    spec_says: §3c — 'Bestial Swiftness' is a likely GRANT.
    reality: '**DIVERGED.** TBC 19596 is the Classic owner-SPELLMOD shape (`SPELLMOD_ALL_EFFECTS +30` masked to Tamed Pet
      Passive 04 19582) with `SPELL_ATTR0_ONLY_OUTDOORS`; live 19596 "Boar''s Speed" is a direct `aura 31` with the outdoor
      flag dropped. AUTHOR, not grant. This also answers the Vanilla `_ref`''s long-standing `grants.boars_speed` UNRESOLVED,
      and can CLOSE Vanilla accepted gap 2 for TBC.'
  - id: C3
    spec_says: §3c — 'Improved Feign Death' is a likely GRANT (inert on this core either way).
    reality: '**ID REPURPOSING.** Live 19286/19287 are ''Survival Tactics'', a different talent with a Disengage/Feign-Death
      cooldown half and a wider mask. Granting stock ships the WRONG TALENT, not merely an inert one. AUTHOR. (The inertness
      gap still carries — accepted gap 1.)'
  - id: C4
    spec_says: §3c — 'Thick Hide, Endurance Training, Ferocity, Frenzy, Bestial Discipline, Unleashed Fury' are likely grants.
    reality: 'Five of six confirmed LIVE_MATCH -> GRANT. **Unleashed Fury is DIVERGED**: TBC is +4/8/12/16/20% pet damage,
      live is +3/6/9/12/15%. AUTHOR.'
  - id: C5
    spec_says: §3c — 'Improved Mend Pet' is a likely GRANT.
    reality: 'Confirmed GRANT, but for a non-obvious reason worth recording: TBC''s own encoding (`aura 112 OVERRIDE_CLASS_SCRIPTS
      misc 4086`) is INERT on this core (aura 112 is HandleNoImmediateEffect and no handler exists for those misc values),
      while live''s aura-4 DUMMY is the working re-implementation at the SAME 25/50% magnitudes. The verdict is DIVERGED on
      family A and the disposition is still GRANT. Lesson 3.'
  - id: C6
    spec_says: §3c — 'Hawk Eye' is a likely GRANT.
    reality: LIVE_MATCH on all fourteen families, so GRANT is defensible — but its SPELLMOD_RANGE mask reaches Aimed Shot
      through the stock 0x20000 bit, which the era clone drops. A granted stock Hawk Eye will not extend the era Aimed Shot's
      range. Accepted gap 5, or AUTHOR.
  - id: C7
    spec_says: §3a — 'Rapid Killing ... mask must reach the Aimed Shot clone'.
    reality: The TALENT (34948/34949) is LIVE_MATCH and its mask targets Arcane Shot + Rapid Fire, not Aimed Shot. It is the
      **triggered BUFF (35098/35099)** whose mask reaches Aimed Shot. Grant the talent, clone the buff. Same correction applies
      to Master Tactician (talent authored for ProcChance, buffs 34833-34837 cloned for the mask).
  - id: C8
    spec_says: §3a — 'Careful Aim ... if it masks'.
    reality: It does NOT mask Aimed Shot (its mask is Multi-Shot's 0x1000) and the mask is INERT anyway on an `aura 212`.
      Answered NO.
  - id: C9
    spec_says: §3a — 'Go for the Throat ... stock triggers if values match' and 'Thrill of the Hunt' unlisted disposition.
    reality: 'Both are DIVERGED on the DBC but their divergences are NEUTRALISED by negative-id `spell_proc` rows the DBC
      sweep cannot see (lesson 18): `-34950` and `-34497` both force crit-only. GRANT both; a clone would LOSE the crit gate
      and fire on every hit.'
  - id: C10
    spec_says: §4d — 'Ferocious Inspiration ... Task 3 establishes how stock 34455 reaches the pet ... and whether a granted
      stock passive registers for a non-talent-frame learn'.
    reality: 'Answered on both counts, and the answer forces a RECONSTRUCTION: a granted stock passive DOES register (see
      pet_aura_census), but the stock rows point at the WotLK payloads 75593/75446/75447 which are LIVE_ONLY, and **TBC''s
      own two payload ids (34457 the pet proc carrier, 34456 the party buff) are BOTH WAGO_ONLY.** Neither exists on this
      server. Both must be authored, with a hand `spell_proc` row for the carrier.'
  - id: C11
    spec_says: §4e — 'The "only while Hawk" gate is expressed in data first (`casterAuraSpell` / aura-state); a script (and
      DUMMY misc 19) only if data cannot gate it'.
    reality: '**There is no gate to express.** The Quick Shots proc lives on Aspect of the Hawk 13165''s own e2 (`aura 42
      -> 6150`), governed by the `-13165` proc row; Improved Aspect of the Hawk is a pure SPELLMOD onto it and is LIVE_MATCH
      on all five ranks. GRANT stock. **DUMMY-marker misc 19 is NOT consumed by this phase.**'
  - id: C12
    spec_says: §4f — 'Readiness (its core handler resets cooldowns by family/attribute ...)'.
    reality: 'Confirmed a FAMILY walk (so band clones are covered), but with a THREE-ID EXCLUSION LIST that makes a naive
      clone-plus-rebind actively broken: the clone would clear its own cooldown because `SendSpellCooldown()` runs before
      the effect handlers. Needs a module script, not a `scriptBindings:` entry. See core_hardcodes.readiness.'
  - id: C13
    spec_says: §3b — 'Trueshot Aura flat +RAP r1-r4' listed alongside other retunes.
    reality: 'Stronger than a retune: **r2/r3/r4 (20905/20906/27066) do not exist on this server at all** and there are ZERO
      stock Trueshot trainer rows. This is the phase''s only fully-absent trained chain, and its TBC levels (40/50/60/70)
      had to come from wago `SpellLevels`.'
  - id: C14
    spec_says: §3b — 'Trap Mastery 19376/19377 (WotLK repurposed)' listed once.
    reality: 'TBC has **TWO separate trap-improvement talents**: node 20648 Clever Traps (19239/19245, both WAGO_ONLY, duration
      + damage) and node 20651 Trap Mastery (19376/19377, a resist-miss spellmod; 19377 WAGO_ONLY). Live 19376 ''Trap Mastery''
      is WotLK''s merge of the two. Both nodes are RECONSTRUCT/AUTHOR.'
  - id: C15
    spec_says: §4c — 'Wyvern Sting r2-r4 (19386/24132/24133/27068 — sleep + trained DoT ranks)'.
    reality: Correct, plus the DoT chain is FOUR more clones (24131/24134/24135/27069 at 50/70/100/157 per tick). The DoT
      ranks are never trained — they need a `spell_ranks` chain so `GetRank()` resolves, but no trainer rows.
