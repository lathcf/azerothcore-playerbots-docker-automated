  live_extra_slot_adjudication:
    changes_a_disposition:
      '19295_19297_19298':
        node: 20646
        live_extra: e2 aura 234 MECHANIC_DURATION_MOD_NOT_STACK misc 3 (DISARM) -16/-25/-50
        ruling: WotLK bolted a disarm-duration reduction onto Deflection. TBC is parry only, at FIVE ranks (r4/r5 = 19301/19300
          are WAGO_ONLY). AUTHOR.
      '19485_19487_19488_19489_19490':
        node: 20630
        live_extra: e2 aura 108 ADD_PCT_MODIFIER misc 15 SPELLMOD_CRIT_DAMAGE_BONUS +12/24/36/48/60
        ruling: MOOT — `ApplySpellFix({19485,19487,19488,19489,19490})` sets `Effects[EFFECT_1].Effect = 0` at load, so the
          live extra slot is DEAD on this core. The same fix ORs 0x4000 (Serpent Sting) into e1's mask. Both are by-id and
          a clone receives NEITHER, which is a reason to AUTHOR rather than clone — see spellfix_inheritance.
      '19559_19560':
        node: 20606
        live_extra: e2 aura 172 MOD_MOUNTED_SPEED_NOT_STACK +5/10, e3 aura 211 flight-speed +5/10
        ruling: WotLK folded mount speed into Pathfinding. TBC Pathfinding is ONLY the Cheetah/Pack SPELLMOD_EFFECT1 +4/8.
          Granting stock hands a TBC hunter WotLK mount speed. AUTHOR.
      '19578_20895':
        node: 20611
        live_extra: e2 aura 4 SPELL_AURA_DUMMY misc 127, +5/10 (the '+5/10% healing received' half)
        ruling: WotLK-only. TBC Spirit Bond is health regen only. AUTHOR the node; the pet carriers are FRESH (see below).
      '19579_24529':
        node: 20611
        live_extra: e2 eff 119 APPLY_AREA_AURA_PET aura 118 MOD_HEALING_PCT +5/10
        ruling: The delivery half of the same WotLK addition. The 119 carriers must be FRESH (Vanilla 932968/932969 shape
          at TBC's identical 1%/2% magnitudes) — see reuse_ledger.
      '34462_34464_34465':
        node: 20618
        live_extra: e3 aura 107 ADD_FLAT_MODIFIER misc 11 SPELLMOD_COOLDOWN -10000/-20000/-30000
        ruling: WotLK added a Kill Command cooldown reduction to Catlike Reflexes. Kill Command IS a TBC baseline ability
          (trainer_spell row at level 66), so granting stock would hand a TBC hunter a cooldown reduction TBC never had. AUTHOR
          (e1 self-dodge + e2 pet-dodge spellmod only).
      '34485_34486_34487_34488_34489':
        node: 20639
        live_extra: e2 aura 108 misc 14 SPELLMOD_COST -5/-10/-15/-20/-25
        ruling: Live Master Marksman is a different talent entirely (aura 52 weapon crit + a cost reduction); TBC is aura
          167 MOD_RANGED_ATTACK_POWER_PCT. AUTHOR — this one was already DIVERGED on family A, the extra slot merely confirms
          it.
      '34455_34459_34460':
        node: 20616
        live_extra: e3 aura 108 ADD_PCT_MODIFIER (no misc) +3/6/9
        ruling: Part of WotLK's rebuild of Ferocious Inspiration into a permanent raid aura. Irrelevant to the TBC shape,
          which is RECONSTRUCTED wholesale (both payload ids are WAGO_ONLY).
      '19421_19422_19423':
        node: 20623
        live_extra: e2 aura 108 misc 14 SPELLMOD_COST -33/-66/-100
        ruling: WotLK gave Improved Hunter's Mark a Hunter's-Mark cost reduction. TBC has only the melee-AP scaling. AUTHOR
          at TBC's five ranks and DROP the cost half.
      19376:
        node: 20651
        live_extra: e2 aura 108 misc 22 SPELLMOD_DOT +10, e3 aura 107 misc 8 SPELLMOD_ALL_EFFECTS +1
        ruling: Live 19376 'Trap Mastery' is WotLK's duration/DOT rework of what Vanilla called Clever Traps. TBC has BOTH
          talents as separate nodes (20648 Clever Traps 19239/19245, 20651 Trap Mastery 19376/19377) and TBC's own 19376 is
          a FLAT SPELLMOD_RESIST_MISS_CHANCE. AUTHOR.
