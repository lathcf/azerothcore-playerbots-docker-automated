  pet_aura_census:
    mechanism:
      registration: "`spell_pet_auras` rows are registered into the OWNER's `m_petAuras` set by exactly TWO code paths, BOTH\
        \ keyed on the owner's spell actually running an effect at the row's `effectId`:\n  * `AuraEffect::HandleAuraDummy`\
        \ (SpellAuraEffects.cpp:5186-5193) — on aura APPLY of a\n    `SPELL_AURA_DUMMY` effect: `sSpellMgr->GetPetAura(GetId(),\
        \ m_effIndex)` ->\n    `target->AddPetAura(petSpell)`.\n  * `Spell::EffectDummy` (SpellEffects.cpp:761-766) — on cast\
        \ of a non-aura\n    `SPELL_EFFECT_DUMMY`: `m_caster->AddPetAura(petSpell)`.\n`Unit::AddPetAura` (Unit.cpp:13749)\
        \ inserts into `m_petAuras` and immediately `pet->CastPetAura()`s it; `Pet::CastPetAuras` (Pet.cpp:2354) replays the\
        \ whole set on every summon/load, which is what makes it survive a dismiss+resummon. Removal is symmetric: `Player::_removeTalentAurasAndSpells`\
        \ (Player.cpp:3093) and `Player::removeSpell` (Player.cpp:3552) both walk all three effect indices calling `GetPetAura(spellId,\
        \ i)` -> `RemovePetAura`."
      answer_to_spec_4d: "**YES — `Pet::CastPetAuras` registers STOCK `spell_pet_auras` rows for a spellbook-learned, non-talent-frame\
        \ passive.** Nothing in the path consults `Talent.dbc`, `HasTalent`, or the talent frame; learning a passive auto-casts\
        \ it (`Player::learnSpell` -> `CastSpell` for a PASSIVE), the DUMMY effect applies, and the row registers. An era-granted\
        \ stock passive therefore delivers its pet aura exactly like a talented one. **BUT there is a hard condition, and\
        \ it is the trap:** the row is keyed `(spellId, effectId)` and only fires if the spell's effect AT THAT INDEX is a\
        \ DUMMY. Every stock hunter row exploits LIVE's encoding, and TBC's encoding is DIFFERENT at three of them:\n  * Ferocious\
        \ Inspiration row `(34455, 0)`: LIVE e1 is `aura 4 DUMMY misc 18` -> registers.\n    **TBC e1 is `aura 107 ADD_FLAT_MODIFIER`**\
        \ -> a literal TBC clone would NOT register.\n  * Animal Handler row `(34453, 1)`: LIVE e2 is `aura 4 DUMMY misc 8`\
        \ -> registers.\n    **TBC e2 is `aura 107`** -> would not register.\n  * Focused Fire row `(35029, 0)`: BOTH sides\
        \ are `SPELL_EFFECT_DUMMY` (effect 3) -> fine.\n  * Spirit Bond rows `(19578, 0)` / `(20895, 0)`: BOTH sides are `aura\
        \ 4 DUMMY` -> fine.\nThis is why the era pet path goes through the module's own `mechanic: pet` / `petBuffIds` emitter\
        \ (which writes its own `spell_pet_auras` rows against a generated auto-passive that carries the required DUMMY) rather\
        \ than trying to reproduce TBC's literal encoding."
