      live_verified: The worldserver's DBC and the repo's azerothcore-wotlk/ip-dbc/Spell.dbc return the IDENTICAL md5 (49c9c5f53e8974c27d67635384725f46,
        53466210 bytes) — NO client/server generation mismatch, so the sweep's live side is the store the worldserver actually
        runs. This is the same md5 the shaman/warrior/rogue/priest phases recorded. `docker cp` fails on this image ("read-only
        file system"); the working extraction is `docker exec ac-worldserver cat <path> > out`.
    db_overlay: 'The DBC on disk is not the whole live store: acore_world.spell_dbc REPLACES records at load. A full `SELECT
      ... WHERE SpellClassSet=9` over the overlay was run (see `aimed_shot_identity.overlay_census`); it contains 15 stock-id
      overrides plus this module''s own era rows, and NONE of it changes a verdict in this map (no id in the 301-id set is
      overlay-only). The Vanilla Aimed Shot clones 932952-932957 do NOT appear in that query because they carry SpellClassSet
      0 — the family-0 escape.'
    tbc_source: 'wago 2.5.4.44833 — SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellClassOptions, SpellCategories,
      SpellCooldowns, SpellAuraRestrictions, SpellShapeshift, SpellLevels, SpellEquippedItems, SpellInterrupts, SpellTargetRestrictions,
      SpellName (the fourteen the plan lists). Headers were printed and verified before use. Tooltips read from the already-cached
      era-data/_ref/tbc/tooltips/<id>.json (the spec says hunter tooltips are not cached — that is STALE: 1425 tooltip files
      are present and every hunter id checked resolved, EXCEPT 3043, 34471 and 34456, which have no cached file).'
    corrections_to_the_plan_script:
      live_column_names: As the warrior and rogue files record, `tools/spell_dbc_columns.txt` spells the spell's OWN identity
        words `SpellClassMask_1/_2/_3` (1-based) — there is no `SpellClassMaskA`. wago `SpellClassMask_0` (word 0) maps to
        live `SpellClassMask_1`. The warrior plan's script uses `cols["SpellClassMaskA"]`, which does not exist in this column
        file; corrected here. Verified again on this id set.
      effect_class_mask_column_mapping: 'Carried over from the rogue file (spec Amendment A.12 / lesson 19) and re-applied
        verbatim: the live column names `EffectSpellClassMaskA_1/A_2/A_3/B_1/.../C_3` read as if A/B/C were the three WORDS
        and _1/_2/_3 the three EFFECTS. They are the OTHER WAY ROUND: **A/B/C = the EFFECT index and _1/_2/_3 = the WORD index**.
        Effect 1''s three mask words are (EffectSpellClassMaskA_1, EffectSpellClassMaskA_2, EffectSpellClassMaskA_3). Independent
        data anchor re-measured on THIS set: stock Efficiency 19416, whose TBC effect-1 mask is (0x7fa00, 0x1081, 0) and whose
        live A_1/A_2/A_3 are 0x7fa00 / 0x88801081 / 0x1 — the word-0 halves line up exactly, which they cannot under the transposed
        reading.'
      float_columns: 'Speed, EffectRealPointsPerLevel_N, EffectMultipleValue_N, EffectPointsPerCombo_N are unpacked as FLOATS
        and rounded to 4 dp. Load-bearing for exactly one entry here: baseline Disengage 781, whose TBC knockback carries
        EffectRealPointsPerLevel -3.0. An int32 unpack reports that as garbage.'
      base_points_convention: 'Carried over unchanged from the shaman/warrior/rogue/priest refs and re-verified on this id
        set: wago 2.5.4 stores EffectBasePoints in the SAME raw (value-1) convention as the 3.3.5a DBC, so the comparison
        normalises BOTH sides to the effective value. Anchors: TBC Careful Aim 34482 raw 14 / DieSides 1 = 15%, matching the
        TBC tooltip; TBC Scorpid Sting 3043 raw -6 / DieSides 1 = -5%.'
      duration_index_noise_filter: A DurationIndex disagreement confined to {0, 21} (both mean permanent) is filtered. ZERO
        entries in this id set were filtered by it.
    noise_filters_applied:
    - 'A live slot with NO wago SpellEffect row is reported under `unverified_slots:` on the entry and downgrades the verdict
      to LIVE_MATCH_UNVERIFIED_SLOT rather than DIVERGED (DB2 stores no empty-effect row, so an absent row is weak evidence
      of a zero). **43 slots across 39 ids** hit this (recounted from the file, 2026-09-04 review round: 4 ids carry two slots
      each — 13163, 19376, 19559, 19560). **Every one of the 39 ids is enumerated in `live_extra_slot_adjudication:`**, in
      three buckets: TEN change a disposition, four are already-DIVERGED or already-cloned ids where the slot changes nothing,
      and five are BASELINE spells no era talent clones.'
    - A missing wago SpellAuraOptions row opposite the live 'not a proc' default (ProcChance 101 or 0 / charges 0 / mask 0
      / stack 0). Where TBC has no row and LIVE really IS a proc, the difference IS printed — three hits (19287, 19591, 13163).
    - NOTHING in the attribute words is filtered. All eight are compared verbatim; every difference is hand-adjudicated in
      `attribute_divergences:` with the AzerothCore bit name.
    - Per-effect class masks are excluded from the VERDICT only (families_compared.O); all 43 differences are recorded in
      full under `effect_class_mask_diffs:`.
    - For SpellClassOptions the SWEEP skips the comparison entirely when the wago row is missing (so family F never fires
      a false positive). The affected ids are enumerated in method.conventions.tbc_line_is_authoritative; only 19577 Intimidation
      is a hazard.
