# --- Bestial Swiftness (node 20607) — the OWNER-held spellmod (spec Amendment A.2) ---------------
# survival_map 19596 (DIVERGED, and an id REPURPOSE): TBC 19596 IS "Bestial Swiftness" and is an
# owner-held SPELLMOD — aura 107 ADD_FLAT_MODIFIER, EffectMiscValue 8 SPELLMOD_ALL_EFFECTS, +30,
# masked to Tamed Pet Passive 04 (19582, word0 0x10000000), whose own aura-31 MOD_INCREASE_SPEED
# base amount is 0. Live 19596 is "Boar's Speed", a direct pet aura-31 rework. The TBC row ALSO
# carries SPELL_ATTR0_ONLY_OUTDOORS (attr0 0x81d0 vs live 0x150) — and because the passive is held
# by the PLAYER, the core's outdoor gate reaches it: Player::CheckAreaExploreAndOutdoor
# (Player.cpp:5896) turns a PASSIVE ONLY_OUTDOORS aura's effects OFF indoors and back ON outdoors
# (it does not remove it), which is exactly the tooltip's "outdoor movement speed" and CLOSES the
# Vanilla accepted gap 2 for TBC. (Needs CONFIG_VMAP_INDOOR_CHECK, the server default.)
# This is a HAND HELPER rather than a `mechanic: spellmod` node because a generated node passive's
# Attributes are hardcoded to PASSIVE_ATTR — there is no node-level `attributes:` key — and the
# ONLY_OUTDOORS bit is the whole point. maxRank is 1, so one helper covers the node.
- id: 948301
  name: Bestial Swiftness
  attributes: 295376       # PASSIVE_ATTR 262608 (0x401D0) | SPELL_ATTR0_ONLY_OUTDOORS 0x8000
  family: 9                # REQUIRED: SpellInfo::IsAffected opens with `if (!familyName) return true;`,
                           # so a family-0 masked spellmod would match EVERY spell
  effects:
  - { effect: 6, aura: 107, basePoints: 29, dieSides: 1, misc: 8, targetA: 1, maskA: 268435456 }
                           # ADD_FLAT_MODIFIER +30, SPELLMOD_ALL_EFFECTS, masked to Tamed Pet
                           # Passive 04 (19582). maskA = EffectSpellClassMaskA_1 = family word0.
  client:                  # the node GRANTS this clone, so the talent panel renders ITS description
    name: Bestial Swiftness
    icon: 1578             # stock 19596 SpellIconID (the id TBC names "Bestial Swiftness")
    skillLine: 50          # Beast Mastery tab
    description: "Increases the outdoor movement speed of your pets by 30%."
