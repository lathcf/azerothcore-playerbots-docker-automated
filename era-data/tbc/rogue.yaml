    id_set_construction: "Seed = all 198 distinct rank spells across the 67 skeleton nodes, plus the ten stealth-implied ids\
      \ the plan names (Stealth 1784-1787, Vanish 1856/1857/26889, Sap 2070/6770/11297). Closure = TRANSITIVE over EffectTriggerSpell\
      \ on BOTH sides (wago and the live DBC), re-run after every extension until it added nothing. Extensions made during\
      \ the task, each of which the closure alone would have missed:\n  * the TRAINED RANK chains of the two talent-granted\
      \ actives that have them — Mutilate\n    34411/34412/34413 and Hemorrhage 17347/17348/26864 (plus the live-only WotLK\
      \ ranks\n    48660/48663/48666 as LIVE_ONLY controls). Trained ranks are same-name siblings, not\n    trigger targets,\
      \ so no closure reaches them; adding 34411-34413 then pulled their hidden\n    main-/off-hand halves 34414-34419 in\
      \ through the closure.\n  * the ENTIRE poison chain (32 apply spells + 32 payload spells) — no talent row references\n\
      \    any of them, and the link runs item -> apply spell -> SpellItemEnchantment -> payload,\n    which is not an EffectTriggerSpell\
      \ edge at all. This is the rogue analog of the shaman\n    Flametongue chain (lesson 17a) and the single most important\
      \ extension of the task.\n  * the CORE-SCRIPT-reached ids: Cheat Death's payload 45182 + its 1-minute-lockout marker\n\
      \    31231, Master of Subtlety's damage buff 31665 + tracker 31666, Quick Recovery's energize\n    31663, Shiv's payload\
      \ 5940, Blade Flurry's extra-attack 22482. Each is reached only\n    through a hardcoded id in azerothcore-wotlk/src/server/scripts/Spells/spell_rogue.cpp\n\
      \    (the `RogueSpells` enum), never through data.\n  * the 21 BASELINE spells the tree's spellmods target (Sinister\
      \ Strike, Backstab, Ambush,\n    Gouge, Eviscerate, Rupture x2 ranks, Slice and Dice x2 ranks, Kidney Shot, Expose Armor,\n\
      \    Garrote, Cheap Shot, Kick, Blind, Feint, Sprint, Evasion, Pick Pocket, Pick Lock) —\n    informational, since a\
      \ stock base spell can never be era-corrected, but four of them turn\n    out to matter (see `accepted_gaps:`).\nThe\
      \ sweep is closed: re-running the transitive walk over the final 351-id set adds nothing."
