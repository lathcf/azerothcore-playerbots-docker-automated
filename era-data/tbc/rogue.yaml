      era_rog_preparation:
        bound_to: 932983 ONLY (the Vanilla Preparation clone)
        tbc_status: INERT for TBC by construction — a TBC rogue never holds 932983.
        tbc_arm_needed: YES if node 20457 clones Preparation, which the resolution below recommends. The Vanilla script's
          reset mask is `flags[1] & 0x240 | flags[0] & (0x860 | 0x01000000)` — i.e. Cold Blood/Shadowstep/Vanish/Evasion/Sprint
          **plus BLIND**. TBC resets Premeditation (flags[1] bit 5 = 0x20) and does NOT reset Blind. A TBC arm must therefore
          be a SEPARATE binding with mask `flags[1] & 0x260 | flags[0] & 0x860`, not a widened shared mask — widening would
          silently give the Vanilla clone a Premeditation reset it must not have.
