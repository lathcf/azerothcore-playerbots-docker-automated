# --- Mutilate (node 20420, Amendment A.14) ------------------------------------------------------
# (1) The core's Cold Blood bookkeeping, REBOUND onto the clone chain. `spell_rog_mutilate`
#     (spell_rogue.cpp:1138-1165) is bound by `spell_script_names` to **-1329**, i.e. every rank of
#     the STOCK chain (verified against the live table 2026-09-03), so the clones get none of it and
#     a TBC rogue's Cold Blood charge would survive a Mutilate — the next ability would crit for
#     free. The script is id-agnostic apart from the stock Cold Blood id it reads (14177), which TBC
#     GRANTS AS STOCK (Amendment A.7), so it works verbatim on a clone.
#     PER-RANK POSITIVE BINDS, not one negative chain bind on -947773: a negative spell_id requires
