# --- Find Weakness buff ranks 947768-947772 (node 20419 proc-triggers them) ----------------------
# THE PHASE'S RECONSTRUCTION (spec Amendment A.3). TBC's buff ranks are 31234/31235/31236 (live
# HUSKS) and 31237/31238 (absent live). All five are rebuilt FRESH rather than cloned or granted:
#   * `template:` is deliberately NOT used, even for r1-r3 whose ids exist. Live 31234-36 carry
#     Attributes 0x1d0 (PASSIVE | DO_NOT_DISPLAY | DO_NOT_LOG) and DurationIndex 0 = PERMANENT,
#     against TBC's 0x40010 and DurationIndex 1 = 10 000 ms; a template clone would inherit the
#     husk's per-effect masks too (live word1 0x4010f — Fan of Knives widened, dumped from the
#     running server's Spell.dbc), and the generator writes per-effect masks only for the words a
#     helper authors, so the inheritance is a real leak risk rather than a cosmetic one.
#   * They are VISIBLE 10 s buffs in TBC (no PASSIVE/DO_NOT_DISPLAY bits), so each carries a
#     `client:` block or the 3.3.5a client renders no buff icon at all (the Blackout precedent).
#     `description` AND `auraDescription` are both authored: the husks keep their text in
#     Description with an EMPTY AuraDescription, so authoring only one of the two would leave a
#     blank tooltip on whichever path the client takes.
#   * NO `skillLine:` — these are triggered auras, never spellbook entries.
#   * NO `spell_ranks` chain and no trainer rows: a rogue owns exactly one rank of the talent, the
#     buff lands on the ROGUE (not on a shared target), so two ranks can never coexist. (Contrast
#     the TBC druid Improved Faerie Fire debuffs, which needed a chain because two druids' debuffs
#     could stack on one mob.)
#   * PreventionType / AttributesEx3 / AttributesEx5 (lesson 17b/17c): TBC's row carries ZERO in
#     every attribute word except Attributes, and a non-templated helper 0-fills every scalar it
#     does not author — so there is nothing inherited to clear and nothing to author.
# EFFECT SHAPE (per rank, TBC 31234-31238 verbatim; the % is the ONLY thing that moves):
#   e1 aura108 ADD_PCT_MODIFIER misc0 SPELLMOD_DAMAGE +2/4/6/8/10% on the 13-spell offensive set
#   e2 aura108 ADD_PCT_MODIFIER misc22 SPELLMOD_DOT   same % on Garrote + Rupture
# Both ops are consumed by Unit.cpp:8934 (`damagetype == DOT ? SPELLMOD_DOT : SPELLMOD_DAMAGE`)
# and :10377 for melee, so the split covers direct abilities and the two bleeds respectively.
# MASK PROVENANCE (authored from the O-pass + the live DBC dump, NOT from survival_map's `tbc:`
# line — see _ref effect_class_mask_diffs.per_effect_mask_word1_render_caveat):
#   e1 word A 0x2602021e = Sinister Strike(1) | Backstab(2) | Gouge(3) | Kick(4) | Ambush(9) |
#             Eviscerate(17) | Hemorrhage(25) | Ghostly Strike(26) | Shiv(29)
#      word B 0x10f      = Deadly Throw(0) | the two hidden Mutilate halves(1,2) | Envenom(3) |
#             Riposte(8)          [live adds bit 18 = Fan of Knives -> 0x4010f; TBC has 0x10f]
#   e2 word A 0x100100  = Garrote(8) | Rupture(20)
#   Arithmetic cross-check: Wowhead's cached TBC tooltip for 31234 enumerates exactly those
#   spells (Ambush, Backstab, Deadly Throw, Envenom, Eviscerate, Ghostly Strike, Gouge,
#   Hemorrhage, Kick, Riposte, Shiv, Sinister Strike + periodic Garrote, Rupture); the two hidden
#   Mutilate halves are unnamed there because they are hidden, and they are what makes Mutilate
#   benefit. word A summed from the named ids IS 0x2602021e exactly.
# `family: 8` IS LOAD-BEARING: SpellInfo::IsAffectedBySpellMod tests the MOD OWNER's
# SpellFamilyName first, so a family-0 buff's spellmods would match nothing at all.
# The helper's OWN identity mask stays 0 (TBC 31234 has no SpellClassOptions mask), so no other
# talent's spellmod can accidentally bind to the buff.
