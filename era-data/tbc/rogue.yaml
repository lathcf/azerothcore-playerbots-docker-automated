        21881, whose TBC effect-1 mask is (0x1001e000, 0x10, 0) and whose live A_1/A_2/A_3 are exactly 0x1001e000 / 0x10 /
        0. With the corrected mapping the pass returns 24 real diffs. The main verdict sweep never touched these columns,
