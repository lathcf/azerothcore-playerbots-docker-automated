  method:
    conventions:
      effect_slot_numbering: 'THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/Effect_2/Effect_3,
        i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is DBC slot 1. Wherever a core-source
        token appears (script_census) it is written `EFFECT_n (0-based core enum; = this map''s e<n+1>)`. Never translate
        one to the other by name.'
      magnitudes_are_effective: EVERY magnitude in this file (`val<N>` in a `tbc:` line, and both sides of every `detail:`
        effect tuple) is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides == 1` and `basePoints` when DieSides
        is 0 (SpellEffectInfo::CalcBaseValue). Both sides of every comparison are normalised the same way before diffing,
        so a clone or live row that moved the +1 into DieSides does not read as a divergence. Raw figures, where quoted, say
        "raw".
      energy_is_manacost_1to1: 'Rogue energy costs ride the `ManaCost` column (wago SpellPower.ManaCost) at face value, NOT
        the x10 scaling warrior rage uses. Anchors re-measured on this id set: Mutilate 1329 ManaCost 60 (= 60 energy, matching
        the TBC tooltip), Hemorrhage 16511 = 35, Shadowstep 36554 = 10, Blade Flurry 13877 = 25. `PowerType` is 3 (POWER_ENERGY)
        on both sides for every energy ability in the set — the sweep compares ManaCost/ManaCostPct and found ZERO divergences
        across all 351 ids, which is a real finding, not a missing column (verified by hand against six anchors).'
      verdict_vocabulary: 'LIVE_MATCH = every compared field in the fourteen verdict families agrees. DIVERGED = at least
        one compared field differs. WAGO_ONLY = present in TBC 2.5.4, ABSENT from the live 3.3.5a store (Spell.dbc AND the
        acore_world.spell_dbc overlay) — must be authored, never granted. LIVE_ONLY = present live, absent from TBC — must
        not be reachable by a TBC rogue. A LIVE_MATCH verdict does NOT mean "safe to grant": the supplementary per-effect
        class-mask pass (family O) is deliberately excluded from the verdict and found FOUR load-bearing divergences on otherwise-LIVE_MATCH
        spells (Cold Blood 14177, Lethality 14128-137, Surprise Attacks 32601, and the Find Weakness buffs). Read `effect_class_mask_diffs:`
        before granting.'
      tbc_line_is_authoritative: Every survival_map entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record an author
        needs to reproduce the spell (per-effect tuple incl. effect class masks and implicit targets, plus duration/proc/power/cooldown/category/mechanic/preventionType/aura-restriction/
        shapeshift/equip/level/family/ownMask and every non-zero attribute word). Tasks 6-8 author FROM THIS LINE; they do
        not need to re-fetch wago. Where a field is absent from the line it is zero in TBC. LIVE_ONLY entries carry no `tbc:`
        line by construction. **ONE KNOWN EXCEPTION, and it is a MISSING ROW rather than a zero:** wago 2.5.4 has no SpellClassOptions
        row for **14185 Preparation**, so its `tbc:` line shows no `family=` and no `ownMask=`. The live spell is SpellClassSet
        8 / SpellClassMask_2 4096 (word1 bit 12), the Vanilla clone 932983 carries the same, and any TBC clone MUST carry
        it too — a family-0 Preparation would be unreachable by its own reset script and by Improved Sprint-style family walks.
