  baseline_leaks:
    method: '`SELECT ts.SpellId, ts.TrainerId, ts.ReqLevel, ts.ReqAbility1 FROM trainer_spell ts WHERE ts.SpellId IN (<the
      351 ids>)`, plus `playercreateinfo_spell_custom` for classmask 8. The trainer-gating INTENT test (framework doc) is
      applied to every hit: a row is a hole ONLY if a TBC-era rogue could obtain a TALENT-GATED spell without the talent.'
    result: '**NO LEAKS. Zero rows required a gate.**'
    detail:
      talent_granted_actives_have_no_trainer_row: Not one of 1329 (Mutilate), 16511 (Hemorrhage), 14185 (Preparation), 13750
        (Adrenaline Rush), 14177 (Cold Blood), 13877 (Blade Flurry), 14251 (Riposte), 14278 (Ghostly Strike), 14183 (Premeditation),
        36554 (Shadowstep), 32601 (Surprise Attacks) or 31228-30 (Cheat Death) has a `trainer_spell` row or a `playercreateinfo_spell_custom`
        row. Every one is talent-only in 3.3.5a exactly as in TBC.
      trained_ranks_are_correctly_chained: The 38 trainer rows that DO exist are all baseline abilities (Backstab, Gouge,
        Garrote, Sap, Stealth, Vanish, Blind, Sprint, Evasion, Kick, Pick Pocket, Pick Lock, Feint, Rupture, Slice and Dice,
        Expose Armor, Ambush, Cheap Shot, Kidney Shot) plus the Mutilate and Hemorrhage rank chains — and every rank-2+ row
        carries `ReqAbility1` pointing at the previous rank, which for both chains terminates at the TALENT-granted rank 1.
        A TBC rogue without the talent cannot buy rank 2. Correct as shipped; no DELETE proposed, so the orphaned-higher-rank
        check is not triggered.
      wotlk_only_ranks_are_level_gated: Hemorrhage r5 48660 (ReqLevel 80), Mutilate r5 48663 (75) and r6 48666 (80) are reachable
        only above the TBC level cap. mod-individual-progression caps a TBC-stage character at 70, and `EraTalentBots::EraFor`
        puts any bot at level 71+ into the WotLK band, so neither the player path nor the bot path can reach them while era-TBC.
        No gate needed; recorded so the reasoning is on file rather than re-derived.
      kBaselineSpellGates: No rogue row is needed. The table stays warrior-only.
