# --- Mutilate VISIBLE-cast clone chain 947773-947776 (node 20420) --------------------------------
# SPEC AMENDMENT A.14 (user-locked, 2026-09-03) — SUPERSEDES A.5's "grant stock 1329, no clone, no
# trainer SQL". A.5's DBC finding still holds (every field on the 12-spell chain is TBC-identical
# apart from behaviour-equivalent attribute re-encodings), but it was a finding about DATA, and two
# of TBC Mutilate's three headline properties do not live in data at all:
#   * "+50% damage against Poisoned targets" is HARDCODED in the core at
#     src/server/game/Spells/SpellEffects.cpp:3454-3475 (SPELLFAMILY_ROGUE arm of
#     Spell::EffectWeaponDmg), keyed on `m_spellInfo->SpellFamilyFlags[1] & 0x6` — the two hidden
#     hand-halves' identity bits — and applying `AddPct(totalDamagePercentMod, 20.0f)`: WotLK's
#     3.0.2 retune of TBC's +50%.
#   * "Must be behind the target" is likewise core-side: the positional gate is the CU attribute
#     SPELL_ATTR0_CU_REQ_CASTER_BEHIND_TARGET, assigned by a HARDCODED by-id switch in
#     SpellMgr.cpp:3590 that does not list 1329 (and a clone never inherits an id-keyed core fix).
# Same finding CLASS as the TBC druid Heart of the Wild (core patch 0023): a fourteen-family DBC
# sweep cannot see either, because neither is in the DBC. This phase takes ZERO core patches, so the
# behaviour is restored module-side and the CLONES exist for TOOLTIP HONESTY (lesson 17d: a grant
# node's in-client tooltip IS the granted spell's client-DBC Description, so granting stock 1329
# renders WotLK's "increased by 20%" prose with no positional line, in the panel AND the spellbook).
#
# WHAT IS CLONED AND WHAT IS NOT:
#   * CLONED: the FOUR VISIBLE casts only — 1329(L40) -> 947773, 34411(50) -> 947774,
#     34412(60) -> 947775, 34413(70) -> 947776. Node 20420 grants 947773; r2-r4 are trainer-taught
#     behind a ReqAbility1 chain off 947773 (TrainerId 9) plus a spell_ranks chain —
#     data/sql/world/base/2026_09_04_02_era_talent_tbc_rogue_mutilate_trainers.sql.
#   * NOT CLONED: the EIGHT hidden hand-halves (5374/27576 r1, 34414-34419 r2-r4). Each clone keeps
#     triggering the STOCK halves through its own Effect_2/Effect_3, exactly as stock does. They are
#     invisible to the player (no spellbook entry, no tooltip), they are byte-identical between the
#     eras apart from the ATTR0_NO_ACTIVE_DEFENSE|ATTR3_ALWAYS_HIT -> ATTR7 0x3800000 re-encoding of
#     "cannot be avoided" (_ref attribute_divergences — the LIVE encoding is the one this core
#     honours), and — decisively — the +% -vs-poisoned core branch keys on THEIR family bits, so
#     cloning them would move the very hook the era script has to attach to.
# IDENTITY BITS ARE LOAD-BEARING AND INHERITED, NOT AUTHORED: no `mask`/`maskB`/`maskC` scalar
# appears below, so each clone inherits SpellClassMask_2 = 2097152 (family-8 word-1 bit 21 =
# "Mutilate") from its template. Lethality (20423-adjacent), Puncturing Wounds, Find Weakness
# (947768-947772's e1 word-1 0x10f covers the two HALF bits) and Cold Blood 14177 all bind through
# those words; dropping them would silently unhook every one of them.
# ATTRIBUTES ARE INHERITED ON PURPOSE (lesson 17c): Attributes 327696 / AttributesEx 134218240 /
# AttributesEx2 1048576 / AttributesEx3 16843776 come straight from the template. The 0x10000 bit in
# AttributesEx3 is SUPPRESS_CASTER_PROCS and is REQUIRED on this core — without it the visible cast
# and both halves would each proc, triple-counting every on-hit effect (_ref
# attribute_divergences.ATTR3_SUPPRESS_CASTER_PROCS_0x10000: "authoring the TBC zero would be a real
# bug, not era fidelity"). Energy 60, the dagger gate (EquippedItemClass 2 / subclass 32768), the
# per-rank SpellLevel/BaseLevel (40/50/60/70), RangeIndex 2, CastingTimeIndex 1 and
# SpellDescriptionVariableID 172 (what makes `$<percent>` resolve) are all inherited too — verified
# against the live rows with tools/dump_spell_effects.py on 2026-09-03. `spell_dbc` carries no
# SpellInfoCorrections entry for 1329/34411/34412/34413 (grepped), so no `spellFixAck:` is due.
# EFFECT SLOTS are re-authored verbatim from each template because lint requires an authored
# `effects:` list on any `template:` helper (gen_era_talents.py:651) and a templated helper 0-fills
# every slot it omits:
#   e1 = SPELL_EFFECT_ADD_COMBO_POINTS (80), basePoints 1 / dieSides 1 -> CalcValue 2 combo points
#   e2 = SPELL_EFFECT_TRIGGER_SPELL (64) -> the stock word-1-bit-1 (off-hand) half
#   e3 = SPELL_EFFECT_TRIGGER_SPELL (64) -> the stock word-1-bit-2 (main-hand) half
# NB rank 4: stock 34413 lists 34419 in Effect_2 and 34418 in Effect_3 — the OPPOSITE numeric order
# from ranks 1-3, because 34419 is the bit-1 half and 34418 the bit-2 one. Copied as stock has it.
# CLIENT TEXT is the TBC prose from the cached Wowhead TBC tooltips (era-data/_ref/tbc/tooltips/
# {1329,34411,34412,34413}.json), keeping stock's two substitutions so the numbers stay live rather
# than frozen: `$<percent>` (SpellDescriptionVariable 172, inherited) and `$<halfId>s1`, a
# cross-spell reference to the STOCK half's Effect_1 value. Those resolve to 44/63/88/101 — exactly
# the flat bonuses the TBC tooltips quote (live 5374/34414/34416/34419 EffectBasePoints_1 =
# 43/62/87/100 with dieSides 1; the _ref's parenthesised "(82)" for rank 3 was wrong, live and TBC
# both say 88). Only the two SENTENCES the core got wrong are authored differently from stock: 50%
# instead of 20%, plus TBC's "Must be behind the target."
# `client.rank` gives the spellbook its "Rank N" label so the client collapses the four same-name,
# same-skill-line ranks to the highest known; `skillLine: 253` is Assassination (stock
# SkillLineAbility for 1329/34411/34412/34413 is SkillLine 253, ClassMask 8 — DBC dump 2026-09-03),
# without which the granted active lands in the General tab.
# THE BEHAVIOUR is restored by two module scripts (see the `scriptBindings:` block below):
#   * era_rog_mutilate_poison — bound to the eight STOCK halves, adds the missing x1.25 on a
#     poisoned target (1.20 x 1.25 = TBC's 1.50) and is a strict no-op unless the caster OWNS clone
#     r1 947773, so Vanilla and WotLK rogues are byte-identical.
#   * era_rog_mutilate_behind — bound to these four clones, re-adds the TBC positional CheckCast.
#     Clone-bound, therefore inherently TBC-only.
# `spell_rog_mutilate` (the core AfterCast that consumes a Cold Blood charge) is REBOUND onto all
# four clones; Cold Blood itself stays STOCK 14177 (Amendment A.7), so the hardcoded
# `caster->GetAura(14177)` lookup and `spell_rog_cold_blood`'s family-bit CheckProc both keep
# working unchanged.
