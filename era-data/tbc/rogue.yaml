  spec_bucket_contradictions:
  - id: A.1
    spec: '§3a — ''Cheat Death: the ids 31228-30 exist in WotLK RETUNED ... if a clone is needed, the script census and scriptBindings
      rebind are mandatory'''
    finding: NOT retuned. 31228/31229/31230 are LIVE_MATCH on all fourteen families, as are the payload 45182 and the lockout
      marker 31231. Grant stock; no clone, no rebind.
  - id: A.2
    spec: '§3a — ''Surprise Attacks: whether 32601 survives in the live store as a functional spell or a husk decides grant
      vs reconstruction'''
    finding: 'It survives FULLY functional and LIVE_MATCH on the fourteen verdict families — but the SUPPLEMENTARY effect-class-mask
      pass shows WotLK widened the +10% damage mask to include Hemorrhage (a node in this same tree). The right disposition
      is therefore neither of the spec''s two options: AUTHOR the passive from the TBC values (pure data, no script). The
      dodge-immunity half uses aura 202 IGNORE_COMBAT_RESULT, the identical encoding the live spell uses — so the framework''s
      "is this TBC encoding dead on this core?" test passes.'
  - id: A.3
    spec: '§3a — ''Find Weakness: whether 3.3.5a still carries these exact ids with the TBC mechanic, a retuned one, or not
      at all is the first mechanized-diff question'''
    finding: 'NOT AT ALL. All five talent ranks (31233/31239/31240/31241/31242) are absent from both the 3.3.5a DBC and acore_world.spell_dbc.
      Buff ranks 1-3 (31234/31235/31236) survive as hidden permanent husks; ranks 4-5 (31237/31238) are absent. Full reconstruction:
      5 talent ranks + 5 buff clones + an authored finisher proc row. Pure data.'
  - id: A.4
    spec: §3b — 'Hemorrhage (16511 — TBC damage/charge semantics vs WotLK's rework, plus a trained rank chain to 70; the Vanilla
      phase's 3-rank clone chain 932985-987 ... is the template if a chain is needed)'
    finding: There was no WotLK rework. 16511/17347/17348/26864 are ALL LIVE_MATCH including ProcCharges (10) and the +12/20/28/38
      damage-taken values, and the stock TrainerId-9 rows already gate ranks 2-4 behind the talent-granted rank 1 at exactly
      the TBC levels 46/58/70. Grant stock; **plan Task 8's `_03` trainer SQL is deleted** and Task 5 Step 1 takes its "TBC
      == WotLK" branch.
  - id: A.5
    spec: '§3a / plan Task 6 — ''Mutilate ... If any rank diverges: fresh clones per rank (visible + both components) + `_02`
      trainer SQL mirroring the druid Mangle file'''
    finding: Grant stock. The whole 12-spell chain's only divergences are proc-plumbing and encoding attribute bits the WotLK
      core requires (ATTR3 SUPPRESS_CASTER_PROCS on the visible casts; the ATTR0/ATTR3 -> ATTR7 re-encoding of "cannot be
      avoided" on the hidden halves). Levels, energy, dagger requirement, damage and trainer gates are TBC-identical. **Plan
      Task 6 Step 2's `_02` trainer SQL is deleted.**
  - id: A.6
    spec: §4a — the poison chains are the Flametongue analog (applier works, payload silently absent)
    finding: Not a Flametongue case. All 32 payloads are present, every payload carries its poison's family-8 identity bit,
      and `Player::CastItemCombatSpell` applies SPELLMOD_CHANCE_OF_SUCCESS against the PAYLOAD id — so the TBC-encoded Vile
      Poisons and Improved Poisons masks bind correctly with no enchant re-point and no payload clone. The real poison findings
      are (a) large stock MAGNITUDE differences in the payloads themselves (Instant Poison r1-r6 hit 50 % harder in TBC; Wound
      Poison is a 5-stack -10 % in TBC vs a flat -50 % live), which an era cannot correct without overriding stock ids, and
      (b) the Anesthetic Poison identity bit living in word1 bit 4 — the bit the Vanilla ref left "unaccounted-for".
  - id: A.7
    spec: §3b — 'Preparation (14185 — ... TBC's list adds Shadowstep/Cold Blood and differs from WotLK's)'
    finding: 'Half right. TBC''s list is Evasion / Sprint / Vanish / Cold Blood / Shadowstep / **Premeditation**; the live
      core script already covers the first five (it matches by FAMILY FLAGS, not by an id list as the plan states) and misses
      only Premeditation. The other divergence the spec did not anticipate is the COOLDOWN: TBC 10 min vs live 8 min. Clone,
      with a NEW module script arm — do not widen `era_rog_preparation`''s Vanilla mask.'
  - id: A.8
    spec: §3b — 'the four weapon specializations ... reuse the Vanilla generator equip-gate pattern'
    finding: 'Confirmed for the pattern, but with two ID-REPURPOSING hazards the spec did not flag: Dagger Spec 13706-13807
      is ''Close Quarters Combat'' live with the fist bit added, and Sword Spec 13960-13964 is ''Hack and Slash'' live with
      the axe bit added AND its payload repointed from 16459 to 66923. Both must be authored, never granted. Fist Weapon Specialization
      (13707/13966-13969) is WAGO_ONLY — WotLK deleted it. Mace Spec needs a fresh stun payload because stock 5530 is a proficiency
      husk live.'
  - id: A.9
    spec: §4c — 'Vanilla-helper reuse ... 932983 / 932985-987 / 932988'
    finding: 0 of 5 reused. 932983 is data-equal but behaviour-divergent (Blind vs Premeditation) and its Description is Vanilla-authored;
      932985-987 are moot (stock is granted); 932988 differs on 9 fields.
  - id: A.10
    spec: §4d — the by-id core scripts are a clone hazard
    finding: 'Confirmed and EXTENDED. Nineteen `spell_script_names` rows hit the id set (7 unpredicted), but the bigger find
      is `spell_proc_event` / `spell_proc`: THIRTEEN rows, all keyed by the negative stock first-rank id, define the proc
      conditions for Combat Potency, Quick Recovery, Blade Twisting, Seal Fate, Ruthlessness, Remorseless, Setup, Sword Spec,
      Improved Kick, Master of Subtlety and Hemorrhage. One of them — spell_proc_event(-35541) with procFlags 8388608 — is
      what makes Combat Potency''s ONLY divergence inert, turning a would-be clone into a grant. Neither table is in the plan''s
      Step 5.'
  - id: A.11
    spec: §3c — 'TBC-talent-became-WotLK-baseline leak sweep ... the ReconcileBaselineSpells / EraTalentPin.cpp disposition
      table gets a row'
    finding: ZERO leaks. No talent-granted rogue spell has a trainer_spell or playercreateinfo_spell_custom row; the Mutilate/Hemorrhage
      trained ranks are already ReqAbility1-chained off the talent-granted rank 1; the WotLK-only ranks are ReqLevel 75/80,
      above the TBC level cap. `kBaselineSpellGates` stays warrior-only.
  - id: A.12
    spec: plan Key facts — 'the live column is SpellClassMask_1 (not SpellClassMaskA)'
    finding: 'True, and there is a SECOND, unrecorded column trap in the same area: the per-effect columns `EffectSpellClassMaskA_1..C_3`
      use A/B/C for the EFFECT index and _1/_2/_3 for the WORD index, not the reverse. Getting it backwards fabricates ~60
      divergences. Recorded in method.corrections_to_the_plan_script.effect_class_mask_column_mapping so the priest phase
      does not re-discover it.'
  accepted_gaps:
  - id: 1
    subject: Poison payload magnitudes (all 32 payload spells)
    gap: 'TBC''s poison payloads hit differently from 3.3.5a''s: Instant Poison r1-r6 deal 18/29/43/66/ 91/111 in TBC vs 12/20/29/44/61/75
      live (r7 is 145 vs 160); Deadly Poison r1-r5 tick 9/13/20/27/34 vs 6/9/14/19/24 (r6/r7 tick 36/45 vs 40/51).'
    why_not_fixed: These are STOCK spells reachable by every character on the server. An era is per-character and a spell
      is global (framework non-negotiable), so correcting them would move poisons for WotLK players too. The Vile Poisons
      talent still scales whatever the live base is.
  - id: 2
    subject: Wound Poison stacking model
    gap: 'TBC: -10% healing per application, CumulativeAura 5 (five stacks = -50%). Live: a flat -50% with no stacking.'
    why_not_fixed: same as gap 1 — stock spell data.
  - id: 3
    subject: Cold Blood does not apply to Shiv
    gap: TBC 14177's spellmod mask includes Shiv (word0 bit 29); the live mask drops it (and adds Fan of Knives, which a TBC
      rogue cannot have).
    why_not_fixed: 'Cloning Cold Blood breaks the Mutilate interaction: `spell_rog_mutilate` looks up `caster->GetAura(14177)`
      by hardcoded id and then reaches into the `spell_rog_cold_blood` script instance on that aura to decide whether to consume
      the charge. Repairing that needs a fork patch, which this phase does not take. A Shiv-only mask gap is the smaller cost.'
  - id: 4
    subject: Precision's weapon set includes one-hand axes
    gap: TBC EquippedItemSubclass 0x5a09c; live 0x5a09d (WotLK added axe1h when rogues gained axe proficiency).
    why_not_fixed: granting stock keeps the by-id nothing and the values are identical; the extra bit only matters for a TBC-era
      rogue wielding a one-hand axe, which TBC itemisation/proficiency does not produce. Task 7 may author instead at no cost.
    status: '**NOT A REACHABLE GAP AT ALL — code-verified INERT at Plan Task 7 (2026-09-03), and that is why node 20426 GRANTS
      rather than authoring.** The premise above ("only matters for a TBC-era rogue wielding a one-hand axe") is too generous
      to itself in one direction and too strict in another: 3.3.5a rogues DO have one-hand-axe proficiency, so the weapon
      is reachable — but the field is never consulted for this aura. Precision is aura 54 SPELL_AURA_MOD_HIT_CHANCE, and the
      core sums it as a bare `m_modMeleeHitChance = GetTotalAuraModifier(SPELL_AURA_MOD_HIT_CHANCE)` / `m_modRangedHitChance`
      (StatSystem.cpp:873 and :879) with NO `CheckAttackFitToAuraRequirement` predicate — unlike the crit-CHANCE path, which
      does pass one (Player.cpp:7244, which is what makes the Dagger/Fist Spec gates real). So an authored TBC 368796 and
      the stock 368797 behave IDENTICALLY, with any weapon: authoring would have bought nothing and cost the client''s own
      tooltip.'
  - id: 5
    subject: Stealth rank 1's movement penalty and Vanish's base cooldown
    gap: TBC Stealth r1 slows 50% (live 30%); TBC Vanish CategoryRecoveryTime is 5 min (live 3 min).
    why_not_fixed: both are BASELINE spells, not talent-granted — same stock-id rule as gap 1. Camouflage/Elusiveness/Preparation
      all act on them by spellmod and work against the live base values.
  - id: 6
    subject: Sword Specialization's 500 ms internal cooldown
    gap: 'the cached TBC tooltip states ''(Proc chance: 1%, 500ms cooldown)''. The 500 ms is NOT in any wago column; live
      carries it in spell_proc(-13960) as an all-zero row (i.e. not there either).'
    evidence_that_would_settle_it: the TBC-Classic client's own SpellProcsPerMinute/ProcCategory tables, or wowsims/tbc `sim/rogue/sword_specialization.go`.
      Task 7 should author the proc row WITHOUT the cooldown unless one of those two sources supplies it.
    status: '**SETTLED AT PLAN TASK 7 (2026-09-03) — NO LONGER A GAP. The ICD is REAL and it is 500 ms.** Source: wowsims/tbc
      `sim/rogue/talents.go` (the file is talents.go, not the sword_specialization.go this entry guessed at — that file does
      not exist in the repo), fetched via raw.githubusercontent.com. It builds the proc as `procChance := 0.01 * float64(rogue.Talents.SwordSpecialization)`
      with `icd := core.Cooldown{ Timer: rogue.NewTimer(), Duration: time.Millisecond * 500 }`, a per-CHARACTER (not per-weapon)
      timer, triggering `ActionID{SpellID: 13964}` for the extra attack; the proc mask is assembled per weapon slot (`swordSpecMask
      |= core.ProcMaskMeleeMH / MeleeOH` when that slot holds a sword), which is the same per-attack scoping this core''s
      `EquippedItemClass` proc check already provides (SpellAuras.cpp:2225-2258). SHIPPED as `proc.cooldown: 500` on node
      20435 — `spell_proc.Cooldown` is exactly this mechanism (a per-aura proc cooldown in ms), so it is pure data, no script.'
  - id: 7
    subject: Serrated Blades' per-level armor penetration
    gap: TBC scales it as EffectRealPointsPerLevel (-2.67/-5.34/-8.00 per level). Whether the generator can emit a float realPointsPerLevel,
      or must flatten to the level-70 value (-187/-374/-560), is a Task-8 authoring decision.
    evidence_that_would_settle_it: '`grep -n realPointsPerLevel tools/gen_era_talents.py` — if the key exists, carry the float;
      otherwise flatten and say so in the tooltip. The era-less Vanilla ref took the flatten route.'
    status: >-
      **SETTLED AT PLAN TASK 8 (2026-09-03) — NO LONGER A GAP. The float is CARRIED, not flattened.** The per-effect
      `perLevel:` key existed only on a `helpers:` effect, so Task 8 extended the same key (same name, same column)
      to a node `multi` effect — see id_allocation.generator_change_task8. Flattening was rejected on behaviour: a
      flat level-70 value would hand a level-40 rogue the level-70 armour reduction, whereas the float reproduces
      TBC's own row byte-for-byte (bp -1, dieSides 1, SpellLevel/BaseLevel/MaxLevel 0 on both sides). ONE CORRECTION
      to this entry's own numbers, both values printed per lesson 16: the level-70 totals are **-186 / -373 /
      -560**, not the "-187/-374/-560" stated above and in node_findings[20455]. Core CalcValue computes
      `basePoints(-1) + int32(level * RealPointsPerLevel) + dieSides(1)` and **TRUNCATES** the product (70 x 2.67 =
      186.9 -> 186), while this file ROUNDED it. TBC's client truncated the same row the same way, so the shipped
      node tooltips quote -186/-373/-560.
  - id: 8
    status: '**CLOSED 2026-09-03** by spec Amendment A.14 (Plan Task 6b) — this entry is retained as the finding record; `why_not_fixed`
      below is superseded by `what_shipped`.'
    what_shipped: 'The user chose the "script + clone for tooltips" option, i.e. exactly `what_would_close_it` below plus
      the tooltip half. (1) The four VISIBLE casts are cloned into 947773-947776 with the TBC prose authored in `client.description`,
      because a grant node''s in-client tooltip AND its spellbook entry are the granted spell''s own client-DBC Description
      — so `consolation` below had it backwards: matching the WotLK text was not a consolation, it was the reason a TBC player
      could never read TBC''s numbers anywhere. The clones keep the family identity bits and keep triggering the STOCK hidden
      halves. (2) `era_rog_mutilate_poison`, a module SpellScript bound to the eight STOCK halves, adds the missing x1.25
      on a poisoned target (1.20 x 1.25 = TBC''s 1.50), gated on OWNERSHIP of clone r1 947773 rather than on `EraFor` — ownership
      is strictly tighter (it also requires the talent to be spent) and is bot-correct for free. (3) `era_rog_mutilate_behind`
      re-adds the positional CheckCast on the four clones. (4) `_02` trainer SQL ships the r2-r4 ladder off 947773; the stock
      rows stay (deleting them would strand the WotLK ranks 48663/48666). Zero core patches. Residual imprecision, documented
      at the script: the core applies its +20% BEFORE MeleeDamageBonusDone/Taken and the top-up lands after, so a flat melee
      addend (e.g. Hemorrhage''s +38 physical) is scaled by 1.25 as well — single digits on a several-hundred-damage hit,
      and no module-reachable hook exists between the two points.'
    subject: Mutilate's +% damage against Poisoned targets (and its lost positional requirement)
    gap: TBC Mutilate is "+50% damage against Poisoned targets" and "Must be behind the target" (both from the cached Wowhead
      TBC tooltip for 1329). This core delivers **+20%** and no positional requirement — WotLK's 3.0.2 retune. Node 20420
      grants stock 1329 (capstone_chains.mutilate), so a TBC rogue gets the WotLK numbers.
    why_the_sweep_missed_it: 'FOUND DURING TASK-6 AUTHORING, not by the fourteen-family sweep, and the sweep was not at fault:
      the multiplier is not spell data at all. It is hardcoded in `src/server/game/Spells/SpellEffects.cpp:3454-3475`, inside
      the SPELLFAMILY_ROGUE arm of `Spell::EffectWeaponDmg`, keyed on `m_spellInfo->SpellFamilyFlags[1] & 0x6` (the two hidden
      main-/off-hand halves'' identity bits) and applying `AddPct(totalDamagePercentMod, 20.0f)`. This is the same finding
      CLASS as the TBC druid Heart of the Wild case (core patch 0023): "the magnitude lives in CORE CODE, not spell data".
      The positional requirement is likewise absent from the live row rather than diverged in it. Standing sweep item for
      the remaining classes: for any granted ACTIVE, grep `src/server/game` for the spell''s FAMILY-FLAG bits as well as for
      its id — `spell_script_names` and an id grep both come up empty here (`spell_rog_mutilate` exists but only manages the
      Cold Blood charge).'
    why_not_fixed: NEITHER HALF IS FIXABLE BY A CLONE. The core branch keys on the family bits a faithful clone MUST carry
      (Puncturing Wounds, Lethality and Find Weakness all bind those same word-1 bits 1|2, and `spell_rog_cold_blood` reads
      them to avoid consuming its charge), so a clone gets +20% as well; a clone WITHOUT those bits would get no poisoned
      bonus at all and would break the Cold Blood + Puncturing Wounds interactions. Adding the positional gate to stock 1329
      would change it for WotLK rogues too (the framework's stock-id non-negotiable).
    what_would_close_it: An era-gated module SpellScript bound to the eight stock hidden halves (5374 / 27576 / 34414-34419)
      that adds the remaining ×1.25 when `EraTalentBots::EraFor(caster) == ERA_TBC` and the target carries a poison — escalation
      rung 2, the `era_rog_sap_stealth` precedent of binding a module script to a stock rogue id under an era gate. That is
      a design decision for the orchestrator; Task 6 shipped the grant the ref prescribed and recorded the gap rather than
      silently degrading or unilaterally adding C++.
    consolation: The talent panel hyperlinks a grant node's GRANTED spell, so the panel renders live 1329's own client text
      ("increased by 20% against Poisoned targets", with no positional line) — the tooltip a player reads matches the behaviour
      actually shipped.
  - id: 9
    opened: Plan Task 7 (2026-09-03), node 20433 Mace Specialization
    subject: Mace Specialization's crit-damage half is not weapon-gated, and two payload fields cannot be authored
    gap: THREE small residuals on the same talent. (a) TBC scopes BOTH halves to maces via EquippedItemClass 2 / EquippedItemSubclass
      0x10, and the shipped helpers 947779-947783 carry that gate — but it only binds the aura-42 PROC half. The e2 crit-damage
      half (aura 163 MOD_CRIT_DAMAGE_BONUS, misc 1 = the physical school mask) is summed by `GetTotalAuraModifierByMiscMask`
      at Unit.cpp:1553 / :1835 / :9456 with NO `CheckAttackFitToAuraRequirement` predicate, so the +1..5% crit damage applies
      with ANY weapon. (b) The stun payload 947784's `DefenseType` is 0 (live 5530's value) where TBC 5530 carries 1 — there
      is no generator key for the column. (c) TBC 5530's AttributesEx bit 0x40000 (PREVENTS_ANIM) is not carried; `attribute_divergences.remainder`
      already adjudicates that bit "keep LIVE", which is what a from-scratch helper produces anyway.
    why_not_fixed: (a) is a CORE behaviour, identical for stock 13709's own armor-pen half, so closing it means a core patch
      — disproportionate for an off-spec crit-damage bonus, and this phase takes zero core patches. (b) DmgClass NONE is the
      standard shape for a triggered aura payload on this core (live 31125 and the Vanilla Blackout stun both carry 0) and
      the stun is applied by a triggered cast that rolls no hit either way, so the column is inert here; adding a generator
      key for an inert field would be the wrong trade. (c) is an explicit "keep LIVE" adjudication, not a gap in the authoring.
  open_questions:
  - question: Does the generator support `EffectRealPointsPerLevel` on an authored passive?
    matters_for: node 20455 Serrated Blades
    ANSWERED: YES. tools/gen_era_talents.py:1398-1403 writes `EffectRealPointsPerLevel_<i>` from a per-effect `perLevel:`
      key (float), and :1279 documents the core's bound formula `EffectRealPointsPerLevel * (min(casterLevel, MaxLevel) -
      SpellLevel)`. Task 8 can carry TBC's -2.67/-5.34/-8.00 through verbatim rather than flattening — but MUST set the clone's
      SpellLevel/MaxLevel so the bound formula lands on the intended level-70 total, and MUST NOT copy the shaman Command-chain
      HALVING that sits next to that key (it is a normal-hit rule specific to that chain, not a general one). Accepted gap
      7 is thereby narrowed to "pick the encoding", not "can it be expressed".
  - question: Does TBC Sword Specialization have a 500 ms internal proc cooldown?
    matters_for: node 20435
    ANSWERED: '**YES — 500 ms, per-character.** Settled at Plan Task 7 (2026-09-03) from wowsims/tbc `sim/rogue/talents.go`
      (NB: not `sword_specialization.go`, which does not exist in that repo): `icd := core.Cooldown{ Timer: rogue.NewTimer(),
      Duration: time.Millisecond * 500 }`, alongside `procChance := 0.01 * float64(rogue.Talents.SwordSpecialization)` and
      `ActionID{SpellID: 13964}`. Shipped as `proc.cooldown: 500` on node 20435 (the generator''s existing `proc.cooldown`
      key -> `spell_proc.Cooldown`, milliseconds). See accepted_gaps id 6, now marked SETTLED.'
  - question: Is 65219 (live Shadowstep's ExcludeTargetAuraSpell) an AzerothCore addition with real behaviour, or dead data?
    matters_for: node 20466 — only if Task 8 decides to clone Shadowstep after all
    ANSWERED: 65219 is `No Teleport` in acore_world.spell_dbc (Effect_1 = 0, an aura-less marker the core uses to block teleport/charge
      effects). Live Shadowstep excluding targets that carry it is a correct WotLK-era hardening, not a regression. Reinforces
      grant_stock for node 20466; a clone would have to reproduce it deliberately.
