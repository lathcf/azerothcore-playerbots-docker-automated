  - { effect: 64, basePoints: 0, dieSides: 0, trigger: 5374,  targetA: 6 } # stock off-hand half (word1 bit1)
  - { effect: 64, basePoints: 0, dieSides: 0, trigger: 27576, targetA: 6 } # stock main-hand half (word1 bit2)
