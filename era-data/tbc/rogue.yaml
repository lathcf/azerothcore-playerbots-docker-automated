# COMBAT (Task 7) helpers 947777-947785 — NINE ids, claimed IN ORDER. Four families: the two
# single-rank ACTIVE clones (Riposte 947777, Adrenaline Rush 947778), the Mace Specialization
# per-rank passives (947779-947783) with their 3 s stun payload (947784), and the Blade Twisting
# daze payload (947785). NEXT FREE: 947786.
# The Surprise Attacks capstone (20444) claims NO helper id, against the `_ref`
# id_allocation.other_tabs_foreseen estimate: both its halves fit ONE `mechanic: multi` node
# (a masked `stat` effect for the aura-202 dodge immunity + a `spellmod` effect for the +10%), so
# the generated auto-passive 939552 carries it. `_ref` node_findings[20444] already buckets it
# `authored` (not `authored_plus_helper`), which is the disposition actually followed.
# =================================================================================================
# --- Riposte 947777 (node 20428 grants it) -------------------------------------------------------
# CLONE of stock 14251 (_ref node_findings[20428], bucket `clone`). TBC Riposte DISARMS for 6 s;
# WotLK 3.0.2 replaced the disarm with a -20% melee-attack-speed slow for 30 s, and the live row is
# the WotLK one. Only the SECOND effect and the duration move, so everything else is INHERITED and
# deliberately not authored: Attributes 327696 / AttributesEx 131584 / AttributesEx4 512,
# **CasterAuraState 1** (AURA_STATE_DEFENSE = "becomes active after parrying" — the whole gate),
# 10 energy, RecoveryTime 6000, RangeIndex 2, DefenseType 2, PreventionType 2, the 133/1000 ms GCD
# category, SpellClassSet 8 + SpellClassMask_2 256, and SpellIconID 278. Raw values dumped from
# azerothcore-wotlk/ip-dbc/Spell.dbc on 2026-09-03.
# THE IDENTITY BIT IS LOAD-BEARING AND INHERITED: word-1 bit 8 (=256) is "Riposte", and it is
# exactly the bit LIVE's Lethality adds to its crit-damage mask and TBC's does not
# (_ref effect_class_mask_diffs.load_bearing["14128, ..."]). Keeping the bit while node 20408
# authors Lethality at the TBC mask (0x2600000e, 0x6, 0) reproduces TBC's behaviour — the clone
# gets NO Lethality crit bonus — without either side having to know about the other.
# `durationIndex: 32` = 6000 ms on this core, cross-checked three ways: TBC 14251's own
# DurationIndex is 32 and its tooltip says "disarms the target for 6 sec"; stock Mocking Blow 694
# (a 6 s taunt) carries 32; and the shipped TBC shaman Focused Casting clone 946512 uses 32 for its
# "lasts for 6 sec". Live 14251 is index 9 = 30000 ms.
# EFFECT SLOTS — a templated helper writes all three and 0-fills the ones it omits, which is exactly
# what TBC needs here:
#   e1 eff31 WEAPON_PERCENT_DAMAGE 150% — byte-identical to live (raw bp 149 / dieSides 1).
#   e2 aura 67 MOD_DISARM at amount 0, with EffectMechanic 3 = MECHANIC_DISARM.
#   e3 DROPPED ON PURPOSE. Live 14251 carries Effect_3 = 80 ADD_COMBO_POINTS (bp 0 / dieSides 1 =
#      1 point) and its client Description ends "Awards $s3 combo point."  TBC does not: the cached
#      TBC tooltip (era-data/_ref/tbc/tooltips/14251.json) enumerates BOTH other mechanics and never
#      mentions a combo point, and the `_ref` survival_map's authoritative `tbc:` line for 14251
#      renders only e1+e2. **`_ref` DEFECT RECORDED (Task 7):** survival_map[14251].detail lists only
#      the e2 and DurationIndex diffs and OMITS the Effect_3 0 -> 80 one, even though family A
#      compares Effect per slot — see `_ref` node_findings[20428].task7_correction.
# `mechanic: 3` sits on the EFFECT, not on the spell-level `mechanic:` scalar, and that distinction
# is why this task added the per-effect `mechanic:` generator key. EffectMechanic feeds
# Unit::IsImmunedToSpellEffect (per effect index) and SpellMgr::GetDiminishingReturnsGroupForSpell
# (SpellMgr.cpp:278 -> DIMINISHING_DISARM), both via SpellInfo::GetAllEffectsMechanicMask; a
# templated clone that omitted it would INHERIT live's 8 (MECHANIC_SLOW_ATTACK), so a disarm-immune
# boss would be tested for slow-attack immunity and the disarm would land in the wrong DR group.
# The spell-level scalar was REJECTED: it applies to the whole spell, so a disarm-immune target
# would also become immune to the 150%-weapon-damage half.
# NO `scriptBindings:` — `spell_script_names` has no row for 14251 (script_census; re-grepped
# against the live table 2026-09-03), so there is nothing to rebind, and no core script is lost.
# No `spellFixAck:` — SpellInfoCorrections.cpp carries no entry for 14251 (grepped 2026-09-03).
# `client.description` AND `client.auraDescription` are both MANDATORY (lesson 17d): the panel
# hyperlinks the granted spell and the spellbook renders its client-DBC text, and without the aura
# text the 6 s debuff tooltip would read live's "Melee attack speed slowed by $s2%."
# CROSS-ERA NOTE (NOT fixed here, reported to the orchestrator): the shipped VANILLA node 18423
# grants stock 14251 with the comment "Stock Riposte is unchanged Vanilla->WotLK (150% weapon
# damage, 6s disarm...)". This sweep shows that claim is false — live 14251 has no disarm at all —
# so a Vanilla-era rogue gets WotLK's 30 s attack-speed slow behind a panel tooltip promising a
# disarm. Vanilla is merged to master and out of this task's scope; the fix is the same clone.
- id: 947777
  name: Riposte
  template: 14251           # stock Riposte — inherit the parry gate, energy, cooldown, identity bit
  durationIndex: 32         # 6000 ms (TBC); live 9 = 30000 ms
  effects:
  - { effect: 31, basePoints: 149, dieSides: 1, targetA: 6 }                        # 150% weapon damage
  - { effect: 6, aura: 67, basePoints: 0, dieSides: 0, mechanic: 3, targetA: 6 }    # MOD_DISARM, MECHANIC_DISARM
  client:
    name: Riposte
