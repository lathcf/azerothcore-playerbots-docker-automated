#   models or should replace. The clone therefore keeps `EffectMiscValue 15430` and ships NO creature
#   row; `check_totem_summons` ignores it correctly, because its creature-reference scan only fires
#   on a misc value inside the reserved band [920000,921000). Creature block 920350-920359 is
#   consequently UNUSED and stays free. Same call for Fire Elemental below.
# MINTED 947080. TBC vs live diverges on FOUR authorable fields: SchoolMask (8 Nature vs 1 Physical),
#   the cost model (TBC 705 flat + 0% vs live 0 flat + 24% of base -> `manaCostPct: 0` is mandatory,
#   the Stoneskin lesson), RecoveryTime (TBC 20 min vs live 10 min) and MaxLevel (TBC 70 vs live 0 —
