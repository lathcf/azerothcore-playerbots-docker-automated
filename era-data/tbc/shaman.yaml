# 946520 "Stormstrike" — node 20238's granted active.
#   _ref survival_map 17364 DIVERGED; Amendment A.5 closes the old accepted gap in full.
#   TEMPLATE 17364 for the instant cast, melee range (RangeIndex 2), EquippedItemClass 2 (weapon),
#   DurationIndex 29 (12 s), SpellIconID 2562 and the family triple. ManaCost 0 / ManaCostPct 8 are
#   INHERITED: both columns are in _ref's swept set and neither diverges, so TBC's cost is the same
#   8% of base mana the cached TBC tooltip prints.
#   COOLDOWN is the one field _ref could NOT settle — RecoveryTime is outside its swept column list.
#   The cached TBC tooltip for 17364 states "10 sec cooldown" against live's RecoveryTime 8000, so
#   `cooldown: 10000` is authored from that tooltip, which is the framework's stated source for era
#   text and numbers the DBC sweep does not reach.
#   EFFECT_1 is TBC's literal aura **87** MOD_DAMAGE_PERCENT_TAKEN, EffectMiscValue 8 (Nature school),
#   raw 19 / DieSides 1 = EFFECTIVE +20% — the debuff makes the target take +20% Nature damage from
#   EVERYONE, where live's aura 271 MOD_DAMAGE_FROM_CASTER narrows it to the shaman. aura 87 is fully
#   implemented in 3.3.5a (SpellAuraDefines.h:150), so no core patch is needed. The per-effect class
#   mask is deliberately NOT authored: it is INHERITED and INERT — aura 87 never consults it (only the
#   live aura-271 form did), and TBC's own mask is not in _ref's swept set, so zeroing it would be an
#   invented value rather than a measured one.
#   EFFECT_2/3 keep the stock weapon-strike triggers 32175 / 32176 verbatim (Amendment A.5: both are
#   unaffected; each diverges only on AttributesEx4, which the generator cannot reach).
#   INHERITED OWN-IDENTITY MASK — looked at rather than assumed. The clone inherits 17364's
#   SpellClassMask_2 = **16777232** (word-B bits 4 and 24) where wago's 17364 carries **16** (bit 4
#   alone), i.e. live added word-B bit24. A.12 says a higher-word difference is "probably WotLK-added,
#   verify what the bit names" — so it was verified by sweeping the whole 3.3.5a Spell.dbc for
#   family-11 rows carrying that bit in their own identity or in any per-effect mask (2026-09-01).
#   Exactly two hits: Stormstrike 17364 itself, and **Glyph of Stormstrike 55446**, whose Effect_1
#   mask is word-B 16777216. So bit24 exists solely as that WotLK glyph's binding hook, nothing else
#   in the store owns or reads it, and EraGlyphGate (`EraTalents.GlyphGate`, default 1) blocks glyph
#   items for every era-managed character. The inherited bit is INERT here by construction and is
#   left alone; overriding it would diverge from a value nothing reads.
#   ATTRIBUTES are equal on both sides and simply inherited: wago 17364 Attributes_0 327680 /
#   Attributes_1 512 / Attributes_3 67108866, and _ref records no attribute_divergences for 17364.
#   ProcCharges 2 (live 4) and ProcTypeMask 139944 (live 139808) are TBC's own values.
