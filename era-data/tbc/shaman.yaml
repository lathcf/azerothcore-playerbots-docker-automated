# --- Stoneclaw (family index 3, block 947050-947069) ------------------------------------------------
# PASSIVES: **REUSED, ids 931070-931075** (r1-r6). wago 5728/6397/6398/6399/10425/10426 are
#   byte-identical to LIVE and to the shipped clones once N6 (an inert DieSides delta on a
#   basePoints -1 aura-23 carrier, whose amount is never read) is applied. Each clone keeps the
#   TWO-effect 1.12/TBC shape: e1 aura 23 PERIODIC_TRIGGER_SPELL every 2000 ms -> the stock threat
#   effect (5729-chain), e2 aura 42 PROC_TRIGGER_SPELL -> 39796 Stoneclaw Stun.
# CREATURES: **REUSED, entries 920130-920135.** This is also what keeps WotLK's absorb OFF a TBC
#   shaman: the STOCK creatures (3579 ...) carry a second `creature_template_spell` at Index 1 --
#   55328-55335, the `spell_sha_stoneclaw_totem` absorb-shield chain -- which the era creatures do
#   not. TBC's Stoneclaw is still the 1.12 high-health taunt totem, so 55277/55278 must NEVER be
#   attached (`_ref.script_bindings[55278]`).
# SUMMONS: **MINTED 947050-947055.** NOTE THE B.2 SUBTLETY -- the summon spells are TBC == LIVE on
#   every compared field (mana 15/30/55/75/105/140 flat, DurationIndex 8 = 15 s, CategoryRecoveryTime
#   30000), so the "grant stock" branch would normally fire. It must not: granting stock 5730 summons
#   the STOCK creature and therefore the WotLK absorb pulse above. The clone exists solely to
#   redirect EffectMiscValue at our own creature (noise filter N2: "the whole substrate exists to
#   summon our own creature so it can cast our own pulse"), and it is still needed against the
#   VANILLA clone, whose 1.12 mana is 20/40/65/95/130/170.
#   Per-rank totem HEALTH (50/150/220/280/390/480) rides the summon's own basePoints+1, unchanged
#   1.12 -> TBC; DurationIndex 8 and the 30 s category cooldown are inherited from the template
#   (both verified equal in wago and live).
#   Rank 7 (summon 25525 L67, passive 25513, effect 25512) is TBC-ADDED. **AUTHORED BY TASK 3
#   (2026-09-01)** at the reserved 947056 / 947060 / 947061 on fresh creature 920336 -- all four
#   reserved ids consumed. Three things make r7 shaped differently from r1-r6, all measured:
#     * The SUMMON needs `manaCostPct: 0` and `school: 8`, which no lower rank does. Live 25525 is
#       0 flat + **6% of base** (r1-r6 are flat on both sides) and SchoolMask **1** (r1-r6 are 8 on
#       both sides) -- 25525 is one of `_ref` open_questions id 12's twenty-one WotLK re-schoolings.
#       **THE OQ-12 LIST NAMES 25525, AND 25525 IS THE SUMMON, NOT THE EFFECT** (wago SpellName
#       "Stoneclaw Totem", `Effect 28 SUMMON` -> creature 15478; the passive is 25513 and the effect
#       is 25512, and there is no 25524 in this family's roster at all). So the `school:` goes on the
#       summon, exactly where the other four EARTH-batch instances put it.
#     * The summon also authors `maxLevel: 71`. This is the ONE place N7 (the inert-MaxLevel filter)
#       does NOT apply in this family: N7 requires `EffectRealPointsPerLevel == 0` on BOTH sides, and
#       every Stoneclaw summon carries **ppl 3** (totem health grows 3/level). wago 25525 caps that
#       growth at MaxLevel 71 while live dropped the cap to 0 (= uncapped); r1-r6 are MaxLevel 0 on
#       both sides, which is why they author nothing. Inert below 71 in practice, authored for
#       fidelity because CalcValue genuinely reads it.
#     * The passive triggers a MINTED effect 947061 rather than the stock one. r1-r6 point at the
#       STOCK effects (5729/6393/6394/6395/10423/10424) because those are wago-vs-live identical **on
#       every field the noise filters leave discriminating**. 25512 is NOT: live carries `Attributes`
#       **536871168** = TBC's 256 | **0x20000000 SPELL_ATTR0_NO_IMMUNITIES** ("pierce
#       invulnerability"), a WotLK addition to a TAUNT effect. Attributes word 0 is explicitly
#       NOT_FILTERED by `_ref.method.noise_filters`, so this is a real divergence and the reserved
#       effect id exists for it; 947061 authors `attributes: 256`. §1.3 is all-or-nothing per SPELL,
#       not per family, so r7 cloning an effect that r1-r6 grant stock is the rule working, not an
#       inconsistency.
#       **CORRECTED 2026-09-01: an earlier draft of this bullet said the six are wago-vs-live
#       identical "byte-for-byte (attr 256/136 on both)". THE DECISION IS RIGHT AND BOTH HALVES OF
#       THAT REASON ARE WRONG** -- the kind of defect this project treats as real, so it is corrected
#       in place rather than beside. Measured: (a) all six carry wago `AttributesEx3` **0** against
#       live **131072**, so they are identical only AFTER the filters -- and 25512 carries the SAME
#       Ex3 delta, so Ex3 is not what separates r7 from r1-r6 either; (b) `AttributesEx` on 25512 is
#       **128**, not 136 (5729 and 10424 are 136), so Attributes word 0 was never the family's only
#       shape difference. That Ex3 delta is `SPELL_ATTR3_SUPPRESS_TARGET_PROCS` ("No initial aggro")
#       and it has a real behavioural consequence for a TAUNT -- `_ref` open_questions **id 17**,
#       which is a decision owed to the user, NOT something a later batch may settle on its own.
