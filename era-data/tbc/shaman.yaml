  doctor_predicates:
    outcome: NO CODE CHANGE to EraTalentsCommand.cpp. Verified from source + a live two-era doctor run.
    triage_row_170:
      what: shaman 2H axe/mace OnPlayerCanUseItem gate
      verdict: no change, confirmed
      source: modules/mod-era-talents/src/EraTalentPin.cpp:317 reads `if (EraFromIP(p) != ERA_VANILLA) return true;   // TBC/WotLK
        shaman -> 2H is baseline, allow`. TBC shamans have 2H axe/mace proficiency baseline exactly as WotLK does, so "any non-Vanilla
        era = allow" is already correct and PERMANENTLY so. The Vanilla arm below it gates on the talent clone 932406 (node
        18822), which stays Vanilla-only. Not edited.
    how_the_orphan_check_works:
      band: EraTalents::ERA_CUSTOM_BAND_LOW=920000 .. ERA_CUSTOM_BAND_HIGH=950000 (EraTalents.h:12-13) - so BOTH the 932xxx
        and the 946xxx TBC bands are in scope.
      loop: 'EraTalentsCommand.cpp walks t->GetSpellMap(), keeps in-band ids that HasSpell() reports active, runs a ladder of
        explicit per-spell predicates, and anything not claimed by one falls through to a generic check: for each node in NodesFor(era,
        class), if the node''s CURRENT rank''s rankSpell == id then granted. Not granted -> "ORPHAN ERA SPELL".'
      consequence: 'CONFIRMED (this was the claim to verify): a NODE-granted spell needs no explicit predicate - the generic
        NodesFor() fallback resolves it. An explicit predicate is required ONLY for a spell the doctor can see in the spell
        map that no node grants, i.e. TRAINER-taught or RECONCILE-granted. This is exactly why the shipped ladder covers 932507-932511
        (Vanilla NG trainer chain), 946270-946275 (TBC NG), 932416-era paladin markers, etc.'
      corollary: 'A proc-TRIGGERED buff is never in the spell map at all and can never orphan. That disposes of the whole Vanilla
        shaman helper sub-band 932400-932404 (Flurry haste buffs), 932408-932410 (Ancestral Healing armor buffs), 932411 (Healing
        Way stacking buff) and 932415 (Clearcasting): all are `trigger:` targets in era-data/vanilla/shaman.yaml, learned by
        nobody. No predicate is needed or possible for them.'
    existing_shaman_predicates: THERE ARE NONE. EraTalentsCommand.cpp contains zero CLASS_SHAMAN predicates - the ladder is
      warlock (932930/932950), paladin (932749/932634-932753/946000-946086/932668-932670/932746) and druid (932513/932507-932511/946270-946275/946258-946265)
      only. So Task 5's original premise - "widen an existing Vanilla-only shaman predicate to Vanilla-or-TBC" - had no subject
      even before Amendment A.9 sent all four reuse candidates FRESH. Nothing to widen.
    node_granted_shaman_spells_verified:
      method: SELECT DISTINCT r.grantedSpellId FROM era_talent_rank r JOIN era_talent t ON t.id=r.talentId WHERE t.eraId=? AND
        t.classId=7
      vanilla_in_931_932_band:
      - 932405
      - 932406
      - 932407
      - 932412
      - 932413
      tbc: (none) - 61 nodes, zero grantedSpellId > 0. The dataset is still the all-display_only seed.
      note: 932413 Elemental Mastery IS node-granted in Vanilla, so it resolves through the generic fallback there. Since Amendment
        A.9 made TBC's Elemental Mastery a FRESH clone, a TBC shaman must not hold 932413 - and if one ever does, the generic
        check correctly reports it as an orphan with no predicate needed. Same for 932411/932400-404 (never learned at all).
    fresh_band_946512_946611:
      verdict: NO predicate needed now. Defer the one that will be needed to Task 8.
      reasoning: Tasks 6-8 grant this band by NODE, and node grants resolve through the generic NodesFor(ERA_TBC, CLASS_SHAMAN)
        fallback (see how_the_orphan_check_works). The ONE exception is the Earth Shield r2/r3 clone chain, which Task 8 authors
