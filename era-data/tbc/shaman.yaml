# ===================================================================================================
# PLAN 3b TASK 2, BATCH 2 — the five FIRE totem families (Searing, Magma, Flametongue, Frost
# Resistance, Fire Nova Totem) plus the two TBC-NEW ELEMENTAL guardian summons (Earth Elemental
# L66, Fire Elemental L68). Ids from `era-data/_ref/tbc/shaman-totems-tbc.yaml` `id_allocation:`;
# each family's per-role base is recorded back into that file's `tbc_clone_base:`.
#
# The batch-1 header above states the rules this batch also runs on and does not repeat them: a
# totem is three coupled pieces (summon / creature / pulse, magnitude NEVER on the summon);
# Amendment B.2's reuse test applied per ROLE in BOTH directions; Amendment B.8/B.8.1 (scope and
# radius are NOT divergences — a role whose whole divergence list is `e:35->65` and/or `rad:9->10`
# is REUSABLE); Amendment B.3 (summon DurationIndex 4 = 120 s is TBC, 5 = 300 s is live — the spec
# body has it backwards); and the "30 yards" prose convention.
#
# FIVE THINGS THIS BATCH MEASURED THAT THE REFERENCE FILE DOES NOT RECORD. Read them before
# changing anything below; each one changed an authoring decision.
#
# (1) **`MaxLevel` is INERT wherever `EffectRealPointsPerLevel` is 0**, and it is 0 on every role in
#     this batch except the Fire Nova blast (where TBC and live agree anyway). `SpellEffectInfo::
#     CalcValue` (SpellInfo.cpp:410-429) reads `MaxLevel` ONLY inside `if (caster &&
#     basePointsPerLevel != 0.0f)`, and `grep MaxLevel` over the whole spell/aura layer finds no
#     other consumer. The `_ref`'s `discrimination_test` lists `maxLevel` as authorable-and-therefore-
#     discriminating; it is authorable but it does not discriminate without per-level growth. This
#     matters because MaxLevel is the ONLY field separating TBC from live on all six Searing bolts
#     (TBC 0 vs live 19/29/39/49/59/68) and on Earth Elemental Totem (TBC 70 vs live 0). Filtering it
#     is what makes Searing a grant-stock family instead of a 12-clone rebuild. It is deliberately
#     NOT authored anywhere in this batch.
#
# (2) **Magma has a DRIVER role the `_ref`'s `per_role: {pulse, summon}` schema does not model** —
#     the same class of finding as batch 1's Earthbind driver, and with the same consequence.
#     `creature_template_spell (5929, 0, 8188)`: the STOCK Magma creature casts **8188 "Magma Totem
#     Passive"** (Attributes 0x1c0 PASSIVE, aura 23 PERIODIC_TRIGGER_SPELL, period 2000 ms,
#     DurationIndex 21) which re-triggers the damage 8187 every 2 s. wago 2.5.4 and the live DBC
#     agree on 8188 field-for-field, so the driver is TBC's own arrangement, not a WotLK addition.
#     The shipped VANILLA substrate models no driver: creature 920160 casts the 8187-clone 931130
#     DIRECTLY, and `Totem::InitSummon` casts `m_spells[0]` exactly ONCE for a passive totem
#     (Totem.cpp:88-105) while `TotemAI::UpdateAI` returns immediately for a non-ACTIVE totem
#     (TotemAI.cpp:63-66) — so a 21 s Vanilla Magma Totem deals ONE tick of its ten. TBC gets the
#     batch-1 Earthbind treatment: a minted driver per rank on a fresh creature, triggering the
#     REUSED Vanilla damage clone. The Vanilla half is logged in `_ref.open_questions` and is NOT
#     fixed from inside this phase.
#
# (3) **The Flametongue Totem imbue deals no damage on this build, in EITHER era.** The enchant the
#     chain applies is real (`SpellItemEnchantment.dbc` 124/285/543/1683/2637 all present, type 1
#     ITEM_ENCHANTMENT_TYPE_COMBAT_SPELL, chance 100) but each row's combat spell is the 1.12/TBC
#     "Flametongue Totem Proc" id — 8253 / 8248 / 10523 / 16389 / 25555 — and ALL FIVE are ABSENT
#     from `ip-dbc/Spell.dbc`. `Player::CastItemCombatSpell` (Player.cpp:7526-7532) logs
#     "unknown spell {} is casted, ignoring..." and `continue`s. See the Flametongue block below and
#     `_ref.open_questions` id 7 — the proc role is deliberately NOT authored, because the only
#     fixes available (restoring the 8253 series at their STOCK ids, i.e. OUTSIDE the reserved
#     [920000,933000) band, or an era AuraScript) are both out of Task 2's scope and want a spec
#     decision. Recording it beats inventing it.
#
# (4) **Searing is the roster's first GRANT-STOCK family** and the Stoneclaw trap does NOT apply to
#     it: `creature_template_spell` for 2523/3902/3903/3904/7400/7402 is exactly one row each,
#     naming the stock bolt and nothing else (no WotLK second row — contrast Stoneclaw's 3579, which
#     carries the 55328 absorb chain at Index 1). Zero ids consumed. See the block below.
#
# (5) **The Fire Nova Totem summon's TBC `CategoryRecoveryTime 15000` needs `category: 35` with it.**
#     TBC 1535 is Category 35 / catRec 15000; the fire-slot donor 3599 the Vanilla substrate uses is
#     Category 0 / catRec 0, so a bare `categoryCooldown:` override would sit on category 0 and the
#     15 s reuse gate would never arm. Both are authored below. (The shipped Vanilla clones
#     931353-357 carry neither, which is 1.12-correct — 1.12 Fire Nova Totem had no reuse gate.)
# ---------------------------------------------------------------------------------------------------
# --- Earth Elemental (family index 5, block 947080-947089) ------------------------------------------
# TBC-NEW: no Vanilla counterpart at all (1.12's id 2062 is the `zzOLDSpell - Reuse` placeholder), so
# there is nothing to reuse and Amendment B.2 reduces to "TBC vs live".
# THE `totems:` BLOCK IS THE WRONG VEHICLE AND IS NOT USED — determined, not assumed. A `totems:`
#   entry emits a `creature_template` + `_model` + `_spell` triple for an ERA-OWNED totem NPC whose
#   whole job is to cast one pulse. Earth Elemental Totem summons **stock creature 15430** (Greater
#   Earth Elemental), a guardian with its own AI, its own stats and its own ability
