# ===================================================================================================
# TBC SHAMAN hand-helper slice **946512-947511** (framework registry). Planned sub-layout:
# 946512-946611 tree helpers (Plan 3a), 947000-947439 TBC totem summon/pulse clones and
# 947440-947511 Windfury Weapon + the "Era: TBC Totems" marker (Plan 3b).
# ELEMENTAL tab (Plan 3a Task 6) claims **946512** and **946513**.
# ENHANCEMENT tab (Plan 3a Task 7) claims **946514-946526**. 946527-946611 free.
# ---------------------------------------------------------------------------------------------------
# 946512 "Focused Casting" — the buff TBC's Eye of the Storm (node 20209) procs.
#   _ref: 29063 is WAGO_ONLY (absent from the 3.3.5a Spell.dbc AND from acore_world.spell_dbc), so
#   this is a from-scratch reconstruction, not a clone. Recorded TBC shape (_ref.open_questions
#   [29063]): ONE effect, aura 108 ADD_PCT_MODIFIER, EffectMiscValue 9 SPELLMOD_NOT_LOSE_CASTING_TIME,
#   EFFECTIVE +100.
#   SCOPE — wago's OWN mask, `maskA: 2499` = word-A bits {0,1,6,7,8,11} = Lightning Bolt | Chain
#   Lightning | Healing Wave | Lesser Healing Wave | Chain Heal | Ghost Wolf. Spec Amendment A.12
#   established that per-effect class-mask WORD 0 is comparable between wago and live, so this value
#   is measured, not inferred. An earlier draft shipped a whole-family bind (family 11 + all-zero flag
#   words, which SpellInfo::IsAffected matches against every shaman spell) on the grounds that TBC's
#   mask was unknowable; it is knowable, so the real value is authored. The practical delta is small —
#   pushback only ever affects a spell with a cast time, and 2499 IS the shaman's cast-time set — but
#   the narrow mask is strictly more faithful and cannot over-bind a future era clone. (For contrast,
#   live 29062's flattened WotLK spellmod is scoped to maskA_1 = 3 = LB|CL only.)
#   DURATION — `DurationIndex 32` = 6000 ms, i.e. the tooltip's "lasts for 6 sec", and it is wago's
#   own value. NOT a source conflict: _ref.open_questions[29063] originally recorded TBC
#   `DurationIndex 21` (permanent); that read was WRONG and was corrected in the Task-6 fix round —
#   wago `SpellMisc` gives index 32, and index 32 is 6000 ms in BOTH the TBC and the 3.3.5a duration
#   tables. Nothing here needs a real-client check.
#   SCHOOL — `SchoolMask 2` is wago 29063's own value. Cosmetic for a self-applied triggered spellmod
#   (it is not resisted, dispelled by school, or school-locked in practice), authored for fidelity.
#   No `spell_proc` row here: 946512 is the triggered BUFF, not a proc. The proc gate is node 20209's
#   own per-rank spell_proc rows.
- id: 946512
  name: Focused Casting
  family: 11               # SpellClassSet 11 (SHAMAN) — required for the per-effect mask below to scope at all
  school: 2                # SchoolMask 2 — wago 29063's own value
  durationIndex: 32        # 6000 ms — wago's own value, = the tooltip's "lasts for 6 sec"
  effects:
  - { effect: 6, aura: 108, misc: 9, basePoints: 99, dieSides: 1, targetA: 1, maskA: 2499, maskB: 0, maskC: 0 }   # SPELLMOD_NOT_LOSE_CASTING_TIME, EFFECTIVE +100, wago mask = LB|CL|HW|LHW|CH|Ghost Wolf
  client:
    name: Focused Casting
    icon: 2028             # stock Eye of the Storm SpellIconID (29062 dump 2026-08-31)
    auraDescription: "Prevents you from losing casting time on Shaman spells when taking damage."
    # no skillLine: triggered only — it must never get a spellbook entry
# ---------------------------------------------------------------------------------------------------
# 946513 "Elemental Mastery" — node 20216's granted active.
#   _ref.reuse_ledger[932413] verdict **FRESH** (spec Amendment A.9, overturning Sec 4.2's "directly
#   reusable"). The shipped Vanilla clone's EFFECTS do match TBC, but two non-effect fields do not:
#   DurationIndex 9 (30 s) vs TBC 21 (-1, persists until consumed) and ProcTypeMask 69632 vs TBC
#   87376 — both inherited from live 16166. All-or-nothing ⇒ fresh clone in this phase's slice.
#   TEMPLATE 16166 for the instant cast / SpellIconID 117 / family shape. ATTRIBUTES are already EQUAL
#   between live 16166 and wago 16166 (33882112 on both, _ref.reuse_ledger), so they are inherited
#   untouched — no `attributes:` override.
#   COOLDOWN: stock 16166 carries its 3 minutes as a SHARED Category (1202) CategoryRecoveryTime.
#   Both are neutralized and the cooldown moved into RecoveryTime, the shipped Vanilla-clone
