    #     Re-pointing it at a clone means cloning 16164 as well, which then needs the
    #     `spell_sha_elemental_focus` bind re-created and a hand `spell_proc` row -- three new failure
    #     surfaces to delete an effect that computes to zero.
    #  3. The shipped Vanilla clone 932415 is NOT a reuse candidate: it is Vanilla's Clearcasting
    #     (-100% cost, ProcCharges 1, DurationIndex 8) built on the Convection 16039 template. TBC is
    #     -40% / 2 charges, so under the all-or-nothing substrate rule (Amendment A.9) it would have
    #     to be a fresh clone anyway; no reuse is available here.
    # KNOWN, QUANTIFIED DIVERGENCE -- _ref.accepted_gaps id 6 (NOT an open uncertainty; spec
    # Amendment A.12 made per-effect class-mask word 0 comparable and settled it):
    #   wago  16246 EffectSpellClassMask_0 = 2416967683 = bits {0,1,20,28,31} -- NO heal bits
    #   live  16246 maskA_1                = 2551185859 = the same bits PLUS {6,7,8,27}
    # {6,7,8} are Healing Wave / Lesser Healing Wave / Chain Heal, so a TBC shaman could NOT spend an
    # Elemental Focus charge on a heal and the stock grant lets them. ACCEPTED, not overlooked: the
