# --- Flametongue (family index 8, block 947120-947139) ----------------------------------------------
# The only family in this batch that is fresh on every role it ships, because TBC's Flametongue Totem
# is a WEAPON-ENCHANT chain (summon -> PASSIVE aura 23 every 5000 ms -> EFFECT 92 ENCHANT_HELD_ITEM on
# a party area) while live 3.3.5a replaced the whole mechanic with the flat spell-damage buff 52109.
# Confirmed here: `creature_template_spell` for 5950/6012/7423/10557/15485 is (entry, 0, 52109..52113)
# — the stock creatures cast the WotLK buff, so neither the stock spells nor the stock creatures are
# usable, and the 1.12/TBC passive/effect ids (8229/8230, 8251/8250, 10524/10521, 16388/15036) are all
# ABSENT from `ip-dbc/Spell.dbc`, so there is no same-identity donor to template either.
# SUMMONS: **MINTED 947120-947123** (r1-r4). TBC vs live diverges on DurationIndex ALONE (4 = 120 s vs
#   5 = 300 s); mana is 90/140/200/275 flat with ManaCostPct 0 on BOTH sides, so no neutralisation is
#   needed — but `powerCost:` is stated anyway so the TBC figure reads next to the Vanilla clones'
#   1.12 values (110/170/250/340). Fresh creatures 920380-920383.
# PASSIVES: **MINTED 947125-947128.** `template: 5672` (stock Healing Stream Totem's own self-buff) as
#   a SHAPE donor only — the same donor the Vanilla substrate uses, and the reason it works is that
#   5672 is the identical two-hop mechanism (aura 23 self -> a party-area sub-spell). Overridden to
#   TBC: `attributes: 320` (TBC 0x140 = PASSIVE|DO_NOT_LOG; the donor is 0x40, and the Vanilla clones
#   inherited that), `school: 4` (donor is 8 Nature), `family: 0` + zeroed masks (TBC SpellClassSet is
#   0 here; the Vanilla clones took the donor's 11, and the donor's own word-A bit13 must not leak
#   onto a Healing Stream spellmod bind). DurationIndex stays the donor's 0 against TBC's 21 — the
#   N4-filtered pair: `Aura::CalcMaxDuration` grants infinite duration to a PASSIVE with no duration
#   entry, so both encodings are permanent.
# EFFECTS: **MINTED 947130-947133.** `template: 52041` (Healing Stream's party-area sub-spell) as the
#   matching shape donor, overridden to TBC on all four fields the `_ref` lists: `attributes: 256`
#   (TBC 0x100; donor 0x8000180), `school: 4` (donor 32 — which is the source of the shipped-Vanilla
#   SchoolMask-32 defect, `_ref.open_questions` id 1, NOT reproduced here), `rangeIndex: 1` (donor 4),
#   and the class mask.
#   THE MASK IS TBC'S OWN word-A **bit26 (67108864)**, not the Vanilla clones' bit25 — this closes
#   `_ref.accepted_gaps` id 4's open half. It is authored rather than inherited because there is no
#   same-identity donor to inherit from (8230 is absent from the DBC), which is the one situation the
#   framework's "inherit, never author" rule cannot cover. Bit26 is safe and correct: it is the bit
#   TBC actually ships, it is SHARED with the Frost/Fire/Nature Resistance pulses in stock 3.3.5a as
#   well as in TBC, and node 20248 Totemic Mastery's `affectsMask {a: 100786176}` ALREADY contains
#   both bit25 and bit26 — so the +10 yd radius mod reaches these clones with no re-point. Verified
#   on the emitted row, not assumed.
#   `radius: 10` follows Amendment B.8's radius half (the scope half does not apply — Effect 92 is
#   unchanged across all three eras); TBC's literal index is 9 (20 yd), and narrowing it would shrink
#   the imbue's reach at an era ADVANCE, exactly the downgrade B.8 exists to prevent.
#   Temp-enchant duration is deliberately left to the core fallback, as in Vanilla: `basePoints: -1`
#   + `dieSides: 1` is TBC's literal encoding and computes to 0, so `EffectEnchantHeldItem`
#   (SpellEffects.cpp:4452-4456) falls through GetDuration() = 0 -> damage*1000 = 0 -> a flat 10 s,
#   which comfortably bridges the 5 s re-trigger.
# PROC ROLE: **NOT AUTHORED — the imbue deals no damage on this build.** See header note (3). The
#   enchant rows exist and will be applied (weapon glow, tooltip), but their combat spell
#   8253/8248/10523/16389 is absent from `ip-dbc/Spell.dbc`, so `Player::CastItemCombatSpell` logs
#   "unknown spell ... ignoring" per swing and casts nothing. This is NOT a TBC regression: the
#   shipped, real-client-verified Vanilla chain hits the same wall, and its block comment's claim that
#   the enchant applies "with the correct authentic magnitude with zero guessing on our part" is
#   wrong for that reason — it read the enchant row's back-reference to 8253 as proof the spell
#   exists. Both candidate fixes (adding the 8253 series at their STOCK ids, i.e. OUTSIDE the reserved
#   [920000,933000) band; or an era AuraScript on the effect clone) are outside Task 2 and want a spec
#   decision, so this ships as `_ref.open_questions` id 7 and `accepted_gaps` id 7 rather than as an
#   invention.
# NODE 20231 (Improved Weapon Totems), FLAMETONGUE HALF — SAID, NOT SILENTLY RE-POINTED. The node
#   binds `Flametongue Totem Buff` 52109 at word-A bit25 with `op: allEffects, kind: pct`. A TBC
#   shaman's Flametongue Totem never casts 52109 (that is the WotLK mechanic), and its bit26 clones
#   carry a basePoints of -1 that computes to 0, so a percentage of it is 0 either way: the half is
#   INERT for TBC whether the mask is re-pointed or not. Re-pointing bit25 -> bit26 would therefore
#   change nothing except to make the inert bind harder to see, so it is left alone. The half becomes
#   reachable only if the 8253-series proc is ever restored, at which point the bind belongs on THAT
#   spell, not on the enchant applier. Recorded against `accepted_gaps` id 4 / id 8.
