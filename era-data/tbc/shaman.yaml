#   because a Sentry Totem casts nothing. So pointing the clone at the STOCK creature carries no
#   creature-side divergence, and minting an era creature would only duplicate an empty row.
#   Pointing at 3968 is also REQUIRED: the entire mechanic is entry-keyed, not spell-keyed —
#   `Totem::InitSummon` (Totem.cpp:113-122) checks `GetEntry() == SENTRY_TOTEM_ENTRY` (3968) and
#   casts bind-sight 6277 from the owner, and `TotemAI::AttackStart` (TotemAI.cpp:131) sends the
#   minimap ping off the same check. An era creature entry would silently kill both.
# `radius: 0` IS LOAD-BEARING — see the SpellInfoCorrections note in the batch header. Without it the
#   totem drops 100 yards away.
# `scriptBindings:` — the clone gets a POSITIVE bind to `spell_sha_sentry_totem` (bottom of this
#   file). The AuraScript registers `AfterEffectRemove` on **EFFECT_1** (the 0-based core enum = DBC
#   slot 2) for `SPELL_AURA_DUMMY` and calls `StopCastingBindSight` (spell_shaman.cpp:1194-1214), so
#   the clone MUST keep its slot-2 DUMMY (it does) and MUST carry the binding or the camera never
#   returns to the shaman. It reads no spell id but 6277, so it works verbatim on a clone.
#   ONE RESIDUAL GAP, logged as `_ref.accepted_gaps` id 12: `Totem::UnSummon` (Totem.cpp:154-157)
#   clears the owner's aura with a HARDCODED `RemoveAurasDueToSpell(6495)`. A clone's dummy is not
#   that id, so on an EARLY unsummon (totem killed / replaced / Totemic Recall) the buff lingers
#   until its own 5-minute duration instead of being dropped on the spot. Not fixable in data —
#   FIXED IN CORE 2026-09-02: patch 0024 removes 947260 (and the Vanilla sibling 931390) in the
#   same entry-gated block (accepted_gaps id 12 CLOSED).
# TASK 3 reservations: NONE (one TBC rank). 947261-947269 and creatures 920500-920509 stay free.
- id: 947260
  name: Sentry Totem
  template: 6495
  spellFixAck: >-
    SpellInfoCorrections.cpp:958 sets `Effects[EFFECT_0].RadiusEntry =
    sSpellRadiusStore.LookupEntry(0)` on 6495. ALREADY REPRODUCED IN DATA: effect 1 authors `radius:
    0`, and the emitted row carries EffectRadiusIndex_1 = 0 (verified against the emitted SQL
    2026-09-01). This correction MATTERS -- targetA 43 makes Spell::SelectImplicitCasterDestTargets
    use the effect radius as the totem DROP DISTANCE, and the template's stock index 12 is 100 yd --
    which is why batch 4a authored it. Logged in era-data/_ref/tbc/shaman-totems-tbc.yaml
    open_questions id 11.
  powerCost: 65         # TBC flat 65 (wago SpellPower) ...
  manaCostPct: 0        # ... and NOT live's 2% of base mana; CalculatePowerCost ADDS the pct on top of the flat cost
  school: 8             # TBC SchoolMask 8 (Nature); live 6495 is 1 (Physical)
  effects:
  - { effect: 28, basePoints: 99, dieSides: 1, misc: 3968, miscB: 83, targetA: 43, radius: 0 }   # 100-hp totem (bp99+d1); AIR slot; STOCK creature 3968 (entry-keyed mechanic). radius 0 REPRODUCES SpellInfoCorrections' by-id fix -- targetA 43 uses CalcRadius as the DROP DISTANCE, and stock index 12 = 100 yd
  - { effect: 6, aura: 4, basePoints: 0, dieSides: 0, targetA: 1 }                               # SPELL_AURA_DUMMY on the caster -- the slot spell_sha_sentry_totem's AfterEffectRemove(EFFECT_1) hangs off
  client:
    name: Sentry Totem
    icon: 195
    rank: 1
    skillLine: 373
    auraDescription: "Allows vision through Sentry Totem. Right-Click on the buff to switch back and forth between totem sight and shaman sight."   # authored because template 6495 carries a non-empty stock AuraDescription (generator lint); the TBC text is the same mechanic
