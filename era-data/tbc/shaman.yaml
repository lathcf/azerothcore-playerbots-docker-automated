      ranged critical strike. The Focused Casting effect prevents you from losing casting time on Shaman spells when taking
      damage.
    - Gives you a 66% chance to gain the Focused Casting effect that lasts for 6 sec after being the victim of a melee or
      ranged critical strike. The Focused Casting effect prevents you from losing casting time on Shaman spells when taking
      damage.
    - Gives you a 100% chance to gain the Focused Casting effect that lasts for 6 sec after being the victim of a melee or
      ranged critical strike. The Focused Casting effect prevents you from losing casting time on Shaman spells when taking
      damage.
    # _ref: DIVERGED -- a PROC-SHAPE REVERSAL (spec Sec 4.1). TBC 29062/29064/29065 are aura 42
    # PROC_TRIGGER_SPELL -> 29063 "Focused Casting" at ProcChance 33/66/100 and ProcTypeMask 680;
    # WotLK flattened all three into a permanent aura 108 misc 9 SPELLMOD_NOT_LOSE_CASTING_TIME at
    # +23/46/69% with no proc at all. Rebuilt here as TBC's proc.
    # ProcTypeMask 680 = 0x2A8 decoded against the fork's SpellMgr.h enum ProcFlags:
    #   0x008 TAKEN_MELEE_AUTO_ATTACK | 0x020 TAKEN_SPELL_MELEE_DMG_CLASS
    # | 0x080 TAKEN_RANGED_AUTO_ATTACK | 0x200 TAKEN_SPELL_RANGED_DMG_CLASS
    # = "the victim of a melee or ranged attack", and hitMask 2 (PROC_HIT_CRITICAL) makes it "...
    # critical strike". phaseMask is deliberately ABSENT: none of those four flags is in the core's
    # REQ_SPELL_PHASE_PROC_FLAG_MASK, so a phase mask would be an unusable field (the generator hard-
    # errors on one, and LoadSpellProcs logs "won't be used"). typeMask 1 (DAMAGE) is harmless for all
    # four flags. CanSpellTriggerProcOnEvent gates the SpellTypeMask test on
    # `eventInfo.GetTypeMask() & SPELL_PROC_FLAG_MASK` (0x2FFFF0), which contains bits 4-19 and 21 --
    # so the test is SKIPPED only for TAKEN_MELEE_AUTO_ATTACK (bit 3) and DOES apply to
    # TAKEN_RANGED_AUTO_ATTACK (bit 7). It passes there anyway: a landed ranged auto-attack carries
    # damage, and Unit::ProcSkillsAndAuras computes PROC_SPELL_TYPE_DAMAGE for any event with damage.
    # _ref.open_questions[29063] leaves "does the reconstruction need a hand spell_proc row?" open.
    # It is answered by construction here: `mechanic: proc` emits one spell_proc row per rank with
    # ProcFlags/Chance/HitMask authored explicitly, so the gate is a real row rather than the DBC
    # ProcTypeMask default. Whether the pushback immunity actually applies is a real-client check
    # (Task 9), not something this pass can assert.
    mechanic: proc
    proc:
      flags: 680               # TAKEN melee/ranged auto-attack + TAKEN melee/ranged spell (see decode above)
      typeMask: 1              # PROC_SPELL_TYPE_DAMAGE (only consulted for the two SPELL flags)
      hitMask: 2               # PROC_HIT_CRITICAL -- "victim of a critical strike"
      chance: [33, 66, 100]
      trigger: [946512, 946512, 946512]   # Focused Casting (helpers:)
