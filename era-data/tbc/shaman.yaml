        -> `AuraEffect::HandleAuraModBaseResistancePCT` (SpellAuraEffects.cpp:4136) applies a **BASE_PCT** modifier, which
        scales only the BASE armor term; 101 -> `AuraEffect::HandleModResistancePercent` (SpellAuraEffects.cpp:4157) applies
        a **TOTAL_PCT** modifier, which scales the whole armor total INCLUDING item armor. On a geared level-70 shaman item
        armor dominates, so +25% BASE_PCT and +25% TOTAL_PCT are not remotely the same buff. Both handlers are fully implemented
        in 3.3.5a, so the spec §2 "keep the live 3.3.5a carrier" doctrine that sanctions 932411''s aura-283 substitution does
