# PLAN 3b TASK 2, BATCH 4a — the seven AIR totem families MINUS Windfury Totem (Grounding, Nature
# Resistance, Sentry, Grace of Air, Windwall, Tranquil Air, Wrath of Air). Windfury Totem is batch 4b.
# Ids from `era-data/_ref/tbc/shaman-totems-tbc.yaml` `id_allocation:`; each family's actual per-role
# base is recorded back into that file's `tbc_clone_base:`, and the `id_allocation:` row itself is
# updated with used/creatures_used/reused/reserved_for_task3 and a corrected `need:`.
# Every rank whose ref `clone:` is null (Nature Resistance r4, Grace of Air r3, Windwall r4) is
# TBC-ADDED 61-70 content and belongs to TASK 3 — its ids are RESERVED below and nothing is authored
# for it here. No `spell_ranks` rows either: Task 3 owns chain coherence.
#
# The four standing rules from batches 1-3 apply unchanged and are not restated per family:
#   * A totem is THREE coupled pieces — SUMMON (`helpers:`, mana + the creature entry in
#     EffectMiscValue), CREATURE (`totems:`, which pulse it casts), PULSE (`helpers:`, the magnitude
#     and radius). The magnitude NEVER goes on the summon.
#   * REUSE RULE (Amendment B.2), applied per ROLE in BOTH directions: wago TBC == the shipped
#     Vanilla clone -> reuse the 931xxx clone AND its creature entry; wago TBC == LIVE 3.3.5a ->
#     grant the stock spell; neither -> mint a fresh 947xxx clone.
#   * SCOPE AND RADIUS ARE NOT DIVERGENCES (Amendments B.8 / B.8.1): the pulses keep the Vanilla
#     clones' `effect: 65` / `radius: 10` (30 yd) on purpose. Everything else (mana, duration,
#     magnitudes, school, class mask word 0) is authored to TBC.
#   * SUMMON DURATION IS INVERTED IN THE SPEC BODY (Amendment B.3): TBC `DurationIndex 4` = 120 s,
#     live `5` = 300 s. Every summon minted here authors `durationIndex: 4` EXCEPT Grounding
#     (TBC 22 = 45 s) and Sentry (TBC 5 = 300 s), where the template's own index is already TBC's.
#
# =================================================================================================
# GAP 4 (`_ref/tbc/shaman-spells.yaml` accepted_gaps id 4) IS CLOSED BY THIS BATCH, and the decision
# is the opposite of "keep the Vanilla word-C bits". READ THIS BEFORE TOUCHING ANY AIR-TOTEM MASK.
#
# The question: the shipped VANILLA Grace of Air / Windwall pulse clones (931330 / 931350) carry
# MINTED word-C bits 15 / 16, because 3.3.5a ships no air totem at all and the Vanilla phase had to
# invent an identity. Three Plan-3a nodes bind those bits — 20222 Guardian Totems (Windwall, C16),
# 20226 Enhancing Totems (Grace of Air, C15) and 20248 Totemic Mastery (`c: 98304` = C15|C16). Batch
# 4a mints FRESH TBC pulses, so either they carry the same invented bits or the nodes move.
#
# DECIDED: the TBC pulses take **TBC's OWN word-A bits** — Grace of Air **131072** (A bit17),
# Windwall **32768** (A bit15). The word-C bits are NOT carried forward. Five independent pieces of
# evidence, all re-measured for this batch rather than inherited:
#   1. wago 2.5.4 SpellClassOptions: 8836 / 10626 / 25360 (Grace of Air) = 131072; 15108 / 15109 /
#      15110 / 25576 (Windwall) = 32768. Windwall SHARES bit15 with Stoneskin Totem Effect 8072
#      (also 32768 in wago AND in live) — that sharing is not a collision, it is exactly why TBC's
#      Guardian Totems can buff "Stoneskin and Windwall" with ONE mask.
#   2. TBC's own talents agree bit-for-bit with the nodes Plan 3a already shipped. wago 16258/16293
#      Guardian Totems EFFECT_1 `EffectSpellClassMask_0` = **32768** — the identical value node
#      20222's Stoneskin half already emits. wago 16259/16295 Enhancing Totems = EFFECT_1 **65536**
#      (Strength of Earth) + EFFECT_2 **131072** (Grace of Air) — the identical two-effect split node
#      20226 already authors.
#   3. Spec Amendment B.8 is explicit that scope and radius are "the ONLY two fields where the
#      Vanilla shape is carried forward on purpose" and names "class-mask word 0" among the fields
#      still authored to TBC.
#   4. Live 3.3.5a STILL RESERVES both bits for these two spells even though it deleted them: 21891
#      "Earthfury Stat Totem" binds maskA **196608** = bit16|bit17 (Strength of Earth | Grace of
#      Air), 21895 "Increased Totem Radius" binds **67362816** = bits {13,14,15,16,17,26}, and 52456
#      / 16295 EFFECT_2 still carry the residual **131072**. A live-DBC sweep of all 50 011 records
#      finds word-A bit17 on exactly two family-11 spells — 32138 "Corrupted Air" and 32662 "Shadow
#      Totem", both NPC-side Grace of Air derivatives that kept the bit AND the icon — and word-A
#      bit15 on nothing but the twelve Stoneskin ranks. NEITHER bit is bound by anything a TBC
#      shaman can reach except nodes 20222/20226/20248.
#   5. The same sweep finds word-C bits 15/16 on **zero** family-11 records: the Vanilla bits are
#      free, but arbitrary. Nothing is lost by dropping them for TBC.
# CONSEQUENCES, all three verified against the emitted SQL at close-out:
#   * Node **20222** needs NO mask edit. `affects: [Stoneskin Totem Effect, Windwall Totem]` now
#     resolves both names to word-A bit15, so the emitted mask is `a: 32768` — TBC's own value.
#   * Node **20226** needs NO mask edit. Its Grace of Air effect now emits `a: 131072`.
#   * Node **20248** DOES need one: word a gains bit17 (100786176 -> **100917248**) and word c drops
#     to 0. Windwall rides the bit15 that word a already had for Stoneskin.
#   * `_ref.spells` "Grace of Air Totem" / "Windwall Totem" are re-pointed from the Vanilla clones
#     931330 / 931350 to the TBC pulses 947275 / 947285 with the TBC word-A bits.
# The shipped VANILLA nodes (18817 / 18821 / 18848) and clones are untouched: they keep the word-C
# bits, and a Vanilla character never receives a 947xxx pulse.
# =================================================================================================
#
# NO DRIVER IS ADDED TO ANY FAMILY IN THIS BATCH, and that is a measured decision, not an omission.
# `_ref.open_questions` id 9's one-shot-pulse sweep was re-run for these seven families before
# authoring ("stock casts an aura-23 driver AND the era spell is neither an area aura nor
# self-periodic"), reading `creature_template_spell` directly:
#   * Grounding — reused creature 920240 already models the driver correctly: Index 0 = the magnet
#     931290 (`Effect 35`, a permanent area aura), Index 1 = the aura-23 refresh 931291 at 10 000 ms.
#     Stock creature 5925 has exactly the same two rows (8178 / 8179). Nothing missing.
#   * Nature Resistance — reused creatures 920250-920252 cast 931310-931312, permanent `Effect 65`
#     area auras. Stock 7467/7468/7469 cast 10596/10598/10599, likewise plain area auras: there is
#     no driver in either era to miss.
#   * Sentry — `creature_template_spell` has NO row for stock creature 3968 in either era, because
#     the totem casts nothing at all; the whole mechanic is `Totem::InitSummon`'s entry-keyed
#     bind-sight (see the Sentry block).
#   * Grace of Air / Windwall / Tranquil Air — from-scratch permanent `Effect 65` area auras, and
#     their stock creatures do not exist on this build.
#   * Wrath of Air — stock creature 15447 casts 2895 DIRECTLY at Index 0, and 2895 is a permanent
#     PASSIVE area aura in both eras. The minted 947301 is the same shape.
# Verdict: batch 4a is CLEAR. Two instances of the defect class (Earthbind, Magma) remain the only
# two found, exactly as the progress doc records.
#
# BY-ID `SpellInfoCorrections` FIXES DO NOT FOLLOW A CLONE, and two of them land in this batch. Both
# are reproduced in data here; the wider sweep is logged as `_ref.open_questions` id 11.
#   * Sentry 6495 — `SpellInfoCorrections.cpp:958` forces `Effects[EFFECT_0].RadiusEntry` to
#     `LookupEntry(0)`. That is NOT cosmetic: `Spell::SelectImplicitCasterDestTargets` (Spell.cpp:
#     1683-1701) uses `Effects[i].CalcRadius()` as the DROP DISTANCE for the four totem-slot
#     destination targets (41-44) and only falls back to `DefaultTotemDistance = 3.0f` when
#     `!HasRadius()`. Stock 6495 carries EffectRadiusIndex 12 = 100 yd, so an un-corrected clone
#     would plant the totem ONE HUNDRED YARDS behind-right of the shaman. `radius: 0` on the summon
#     effect reproduces the correction exactly.
#   * Wrath of Air 2895 — `SpellInfoCorrections.cpp:127` forces `Effects[EFFECT_0].TargetA =
#     TARGET_UNIT_CASTER` and `TargetB = 0` (stock carries 18 / 33). Authored explicitly on both
#     effects of 947301.
# ---------------------------------------------------------------------------------------------------
# --- Grounding (family index 18, block 947240-947249, creatures 920480-920489) ----------------------
# EFFECT + PASSIVE: **REUSED, ids 931290 / 931291.** The effect is the sixth verified Amendment B.8.1
#   case: its ENTIRE `clone_vs_tbc_divergences` entry is `'effect: e1 rad:9->10'`, and the direct
