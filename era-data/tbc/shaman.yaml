    # the threat and the totem's cast resolves the owner's spellmods.
    # THE ACTIVATION-DELAY HALF IS LIVE -- _ref.accepted_gaps id 7 CLOSED 2026-09-01 by Plan 3b Task 4
    # (recorded here 2026-09-06, fix round M-14). It used to be deferred: TBC expresses the half as
    # spellmods on the Fire Nova Totem SUMMON, there was no TBC-era Fire Nova Totem, and the reader
    # `npc_era_fire_nova_totem::ResolveDetonateDelay` knew only the VANILLA node 18808 auto-passives.
    # Both halves of that are done: the TBC Fire Nova family is minted (summons 947310-947316, this
    # file's family index 25) and the reader was EXTENDED to this node's TBC auto-passives 937664/
    # 937665 (`EraTalentTotemScripts.cpp:32-33` declares them, `:152-155` reads them alongside the
    # Vanilla pair), so a TBC shaman's detonation delay drops 4 s -> 3 s / 2 s by rank.
    # It stays a C++ read rather than a spellmod because two of the three TBC ops are outside the
    # generator's OP map (19 SPELLMOD_ACTIVATION_TIME has no key; 1 SPELLMOD_DURATION does, as
    # `duration`) and because the delay is creature-AI timing, not a Spell.dbc value.
    mechanic: spellmod
    op: threat
    kind: pct
    affects: [Magma Totem]       # display only; the real bind is affectsMask
