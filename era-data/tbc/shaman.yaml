        \ t->getClass() == CLASS_SHAMAN &&\n          EraTalents::CurrentRank(t, ERA_TBC, <ES_node>) != 0))\n        handler->PSendSysMessage(\"\
        \  ORPHAN ERA SPELL: {} ...\", id); continue; }\nTask 5 deliberately did NOT add it: the ids and the node are not authored\
        \ yet, so the predicate would be untestable and would guard an empty band."
    deferred_to_plan_3b:
      what: the totem-roster orphan false positives - triage rows 142 (kStockShaSwap/kEraShaHide) and 188 (the 932416/932417
        markers)
      evidence: "Live doctor run (below) shows 77 ORPHAN lines on a level-60 Vanilla shaman bot and 1 on the same bot at level\
        \ 70 (TBC). Every one of them is a totem-roster spell:\n  - 931000-931370 (76 lines at L60): the Vanilla custom totem\
        \ summons. Verified TRAINER-taught,\n    not node-granted - they are rows in acore_world.trainer_spell anchored on ReqAbility\
        \ 932416\n    (EraTalents.cpp kEraShaTrained), so the generic NodesFor() check can never resolve them.\n  - 932416 (1\
        \ line at L60) / 932417 (1 line at L70): the presence-only era-totem markers,\n    RECONCILE-granted in the CLASS_SHAMAN\
        \ arm of EraTalents.cpp - never node-granted, never\n    trainer rows."
      scope_call: 'NOT FIXED HERE, on purpose. The plan explicitly assigns triage rows 142 and 188 to Plan 3b as totem-roster
        decisions, and Task 5''s Step 3 forbids changing Vanilla doctor behavior. Adding the 931xxx/932416/932417 predicates
        would change 77 Vanilla lines. It is also genuinely 3b''s decision: 3b chooses which totems a TBC shaman gets and therefore
        what the predicate''s era arm must say. Plan 3b should add ONE predicate covering 931000-931399 + 932416 + 932417 and
        gate it on the era that owns each marker.'
      pre_existing: This is a Vanilla-phase defect that predates the whole TBC shaman plan (same shape as the Vanilla Nature's
        Grasp gap the druid phase fixed). It is not caused or worsened by Plan 3a.
    verification:
      procedure: Bot LEVEL BAND, not `.ip set` (spec Amendment A.11). EraTalentBots::EraFor returns BotEra for bots; the band
        is <=60 Vanilla / 61-70 TBC / 71+ WotLK. Stack was already running the current binary - no rebuild, because no C++ changed.
      command: "python3 tools/wgconsole.py /tmp/claude-1000/tbc-shaman/doctor.out\n  \".character level Onnegsqi 60\" \"wait:5\"\
        \ \".eratalents doctor Onnegsqi\" \"wait:4\"\n  \".character level Onnegsqi 70\" \"wait:5\" \".eratalents doctor Onnegsqi\"\
        \ \"wait:4\""
      vanilla_L60: '"era=Vanilla storedEra=WotLK available=0 spent=51 generation=ac40a09e"; 14 node lines all "known=yes spellInfo=yes";
        77 ORPHAN lines, all 931xxx totems + 932416 (see deferred_to_plan_3b). No STALE STOCK SPELL lines.'
      tbc_L70: '"era=TBC storedEra=WotLK available=61 spent=0 generation=ac40a09e"; "(no era talents spent this era)"; exactly
        ONE ORPHAN line: 932417. No 946xxx orphan, no leaked Vanilla clone - the era transition stripped every 931xxx custom
        and swapped 932416 -> 932417 cleanly.'
      what_this_proves: (a) The Vanilla->TBC transition leaves NO Vanilla shaman clone behind on a TBC shaman, so Amendment
        A.9's all-FRESH decision creates no strip gap the doctor can see. (b) No predicate in the shipped ladder mis-fires on
        a shaman in either era. (c) Vanilla behavior is unchanged (trivially - no code was changed).
      what_this_does_NOT_prove: 'NOTHING about the TBC shaman TREE''s own spells. The dataset is the all-display_only seed:
        61 nodes, zero grantedSpellId, and the bot spent 0 of 61 points, so there is not a single TBC shaman era spell in the
        spell map that COULD orphan. The 946512-946611 band is empty. Real orphan coverage for the tree arrives only after Tasks
        6-8 author it, and Task 8 owns the Earth Shield predicate above. Step 3''s "zero ORPHAN lines in either era" acceptance
        criterion is NOT met, and cannot be met by this task - the residual lines are Plan 3b''s.'
      incidental: 'The L70 build logged 15 "authored build order skipped ... regenerate kAuthoredOrders" warnings and produced
        a 0-point build. Cause: kAuthoredOrders (EraTalentBots.cpp:88) is keyed (class, specTab) with NO era dimension, so a
        TBC shaman bot walks the VANILLA node-id order and every TryLearn misses, then the greedy fill finds nothing spendable
        because the TBC nodes are unwired display_only seeds. This is the already-documented cross-class TBC gap (docs/era-talents-tbc-workflow.md:244,
        spec §-design line 332), not a shaman-specific defect and not Task 5''s to fix. Expect it to clear once Tasks 6-8 wire
        the nodes.'
