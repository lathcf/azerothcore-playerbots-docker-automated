# ===================================================================================================
# PLAN 3b TASK 2, BATCH 3 — the five WATER totem families (Healing Stream, Mana Spring, Fire
# Resistance, Poison Cleansing, Disease Cleansing). Ids from `era-data/_ref/tbc/shaman-totems-tbc.yaml`
# `id_allocation:`; each family's actual per-role base is recorded back into that file's
# `tbc_clone_base:`. Every rank whose ref `clone:` is null (Healing Stream r6, Mana Spring r5, Fire
# Resistance r4) is TBC-ADDED 61-70 content and belongs to TASK 3 — its ids are RESERVED below and
# nothing is authored for it here. No `spell_ranks` rows either: Task 3 owns chain coherence.
#
# The three standing rules from batches 1-2 apply unchanged and are not restated per family:
#   * A totem is THREE coupled pieces — SUMMON (`helpers:`, carries mana + the creature entry in
#     EffectMiscValue), CREATURE (`totems:`, which pulse it casts), PULSE (`helpers:`, carries the
#     magnitude and radius). The magnitude NEVER goes on the summon.
#   * REUSE RULE (Amendment B.2), applied per ROLE in BOTH directions: wago TBC == the shipped
#     Vanilla clone -> reuse the 931xxx clone AND its creature entry; wago TBC == LIVE 3.3.5a ->
#     grant the stock spell; neither -> mint a fresh 947xxx clone.
#   * SCOPE AND RADIUS ARE NOT DIVERGENCES (Amendments B.8 / B.8.1): `effect: 65`
#     APPLY_AREA_AURA_RAID at `radius: 10` (30 yd) is carried forward from the Vanilla clones on
#     purpose. Everything else (mana, duration, magnitudes, school, attributes) is authored to TBC.
#   * SUMMON DURATION IS INVERTED IN THE SPEC BODY (Amendment B.3): TBC `DurationIndex 4` = 120 s,
#     live `5` = 300 s. Every summon minted here authors `durationIndex: 4`.
#
# NO DRIVER IS ADDED TO ANY FAMILY IN THIS BATCH, and that is a measured decision, not an omission.
# `_ref.open_questions` id 9's one-shot-pulse sweep was re-run for these five families before
# authoring, using the rule the progress doc records ("stock casts an aura-23 driver AND the era
# spell is neither an area aura nor self-periodic"):
#   * Healing Stream — stock creature 3527 DOES cast a driver (live 5672 is aura 23 -> 52041), but
#     the era clone 931190 is `Effect 65 / aura 8 PERIODIC_HEAL / period 2000`: an area aura AND
#     self-ticking, i.e. excluded by both exclusion clauses. **Adding a driver here would
#     DOUBLE-TICK the heal.**
#   * Mana Spring — stock creature 3573 casts 5677, which in live is `Effect 65 / aura 85`, an area
#     aura, not a driver. The minted TBC pulse is `Effect 65 / aura 24 PERIODIC_ENERGIZE @2000`,
#     likewise self-ticking.
#   * Fire Resistance — stock creature 5927 casts 8185, an `Effect 65` permanent area aura on both
#     sides. No driver exists to miss.
#   * Poison / Disease Cleansing — the driver IS the role being minted (the aura-23 "Passive"), and
#     stock creature 5924 casts exactly it (`creature_template_spell (5924, 0, 8172)`). Poison's
#     stock creature 5923 has no row at all because 8166/8167/8168 are absent from 3.3.5a.
# Verdict: batch 3 is CLEAR, matching the sweep already recorded in the progress doc.
#
# TBC's Healing Stream is a REAL periodic heal (Amendment B.8.1's correction): wago 5672 is
# `Effect 35 / aura 8 / period 2000 / bp 5`, and the reused clone 931190-931194 reproduces it. Node
# 20250 Restorative Totems is NOT re-pointed and its `SPELLMOD_DOT` half is still NOT shipped —
# shipping both halves would double-apply. Nothing in this batch changes which spell
# `affectsMask {a: 24576}` binds: bit13 rides the REUSED Healing Stream pulses and bit14 rides the
# MINTED Mana Spring pulses, which inherit it from their own stock templates.
# ---------------------------------------------------------------------------------------------------
# --- Healing Stream (family index 12, block 947170-947189, creatures 920420-920429) -----------------
# PULSES: **REUSED, ids 931190-931194** (r1-r5). The second B.8.1 case in this batch, verified rather
