      The node's tooltip promises "Reduces the delay before your Fire Nova Totem activates by
      1/2 sec" and nothing delivers it. The threat half works; the delay half is inert.
    why_deferred: >-
      TBC expresses the delay as spellmods on the Fire Nova Totem SUMMON, and there is no TBC-era
      Fire Nova Totem yet - Plan 3b owns the TBC totem substrate, so there is nothing to bind to.
