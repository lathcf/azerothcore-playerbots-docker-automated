# 946519 "Spirit Weapons" — BOTH halves of node 20232, in one hidden passive.
#   Node 20232's rank spell 16268 is LIVE_MATCH but is a LEARN-WRAPPER: two SPELL_EFFECT_LEARN_SPELL
#   effects teaching 18848 (parry proficiency, LIVE_MATCH) and 36591 (threat reduction, DIVERGED).
#   36591's sole divergence is the school mask — aura 10 SPELL_AURA_MOD_THREAT at EFFECTIVE -30% in
#   BOTH eras, EffectMiscValue **1** = physical only in TBC vs **127** = all schools live — and
#   Task 7's call, taken, is to CLONE rather than ship WotLK's widening (see node 20232).
#   WHY ONE SPELL AND NOT TWO GRANTS: `era_talent_rank`'s PRIMARY KEY is (talentId, `rank`), so a rank
#   grants exactly ONE spell id. `grants: {1: [18848, 946519]}` was the first shape authored and died
#   on a duplicate-key error at apply time. Collapsing is also the faithful reading — the TBC talent
#   is one package — and it costs one helper id instead of two.
#   TEMPLATE 18848 for its passive Attributes 80, SchoolMask 1, DurationIndex 0, RangeIndex 1,
#   CastingTimeIndex 1, SpellIconID 558 and SpellClassSet 11 (all LIVE_MATCH, i.e. TBC's own values).
#   EFFECT_1 reproduces stock 18848's parry row byte-for-byte: Effect 22 SPELL_EFFECT_PARRY,
#   EffectMiscValue 90, basePoints 0, DieSides 6, **ImplicitTargetA 0**. Target 0 is correct and
#   deliberate — `Spell::EffectParry` (SpellEffects.cpp:4701) reads `m_caster` in the
#   target-independent SPELL_EFFECT_HANDLE_HIT phase and never touches unitTarget, which is why both
#   stock 18848 and the Vanilla node 18828's stock grant 3127 ship target 0.
#   EFFECT_2 is 36591's aura at TBC's physical-only school mask. A templated helper 0-fills every
#   slot it does not author, so Effect_3 is empty and no template layout leaks through.
#   NO client: block — a hidden passive with no SkillLineAbility row that neither the caster nor the
#   target ever sees (the shipped Vanilla proficiency clone 932406 is the same shape).
#   Neither 18848 nor 36591 has a `script_bindings` or a `proc_rows` entry, so nothing else has to be
#   rebuilt, and neither has a trainer_spell row (queried 2026-09-01), so there is no baseline leak.
