# 946514-946518 "Flurry" — the melee-haste buff TBC's Flurry (node 20229) procs, r1-r5.
#   _ref.reuse_ledger["932400-932404"] verdict **FRESH** (Amendment A.9). Every swept field of the
#   shipped Vanilla clones matches TBC — aura 138 MOD_MELEE_HASTE at EFFECTIVE +10/15/20/25/30%,
#   ProcCharges 3, ProcTypeMask 4, ProcChance 100, DurationIndex 8 (15 s), SchoolMask 1, RangeIndex 1,
#   RecoveryTime 0, ManaCost 0 — EXCEPT `AttributesEx3 = 524288` (SPELL_ATTR3_INSTANT_TARGET_PROCS),
#   inherited from live 16257, where wago 2.5.4 has 0 on all five ranks.
#   FROM-SCRATCH, NOT `template: 16257` — load-bearing. gen_era_talents.py exposes `attributes` and
#   `attributesEx` and NOTHING for AttributesEx2..7, so a template clone of 16257 would inherit that
#   same 524288 and reproduce exactly the bit the ledger rejected. A from-scratch row starts every
#   unlisted column at 0, and for **every attribute word the ledger swept** (Attributes and
#   AttributesEx..Ex7, all 0 on wago 16257) that 0 IS TBC's value.
#   NOT A GENERAL RULE, and the qualifier is load-bearing: "unlisted column == 0 == TBC" is evidenced
#   here for the ATTRIBUTE family only, because that family is what the sweep measured. For a column
#   the sweep never read, an unlisted value is UNKNOWN, not zero — which is exactly the argument
#   helper 946526 makes for going the other way. THE TRADE INVERTS BY SPELL SHAPE: a triggered proc
#   BUFF like this one is eight swept scalars end to end, so from-scratch costs nothing and buys the
#   right attribute word; a player-CASTABLE active carries InterruptFlags, AuraInterruptFlags,
#   Targets, SpellVisualID, DefenseType, PreventionType and StanceBarOrder that the generator cannot
#   author and a from-scratch row would silently zero, so there `template:` wins even at the cost of
#   an inherited bit. See 946526 for that side of it. Everything else below is authored explicitly.
#   VALUES are TBC's literal encoding: raw basePoints 9/14/19/24/29 with DieSides 1 = EFFECTIVE
#   +10/15/20/25/30% (the Vanilla clones moved the +1 into basePoints; same result, TBC's form here).
#   OWN IDENTITY — `family: 11` **and** `maskB: 512` (SpellClassMask_2), both wago 16257's own values
#   and both load-bearing. The mask was MISSING in the first authoring, which emitted the identity
#   triple (0,0,0): the family-11 spellmod **37241 "Improved Flurry"** — the TBC Shaman Tier-5
#   4-piece set bonus, aura 107 ADD_FLAT_MODIFIER misc 8 SPELLMOD_ALL_EFFECTS at EFFECTIVE +5, whose
#   own effect mask is word-B 512 (wago SpellEffect + live Spell.dbc agree) — could then never match
#   the era buff, because SpellInfo::IsAffected computes `512 & 0 == 0`. A T5 enhancement shaman would
#   have silently lost the set bonus. `family:` alone is not enough: IsAffected tests the family AND
#   the flag words.
#   FAMILY 11 is wago 16257's own SpellClassSet. The _ref ledger notes a fresh clone would default to
#   family 0 and calls SpellClassSet "a PIPELINE PROPERTY" — but `family:` is an exposed scalar, so on
#   a from-scratch row it IS an authoring choice, and TBC's value is 11. The over-bind hazard of a
#   family-11 row with all-zero SpellFamilyFlags (SpellInfo::IsAffected returns true for a family-11
#   spellmod whose own flag96 is all-zero) does not arise here: every era spellmod this dataset ships
#   carries a non-zero mask (lint rejects an all-zero `affectsMask`), a TBC character's core talent
#   points are pinned to 0, and EraGlyphGate blocks glyphs.
#   PROC ROW: the stock buff-side row (-16257) is nothing but a 500 ms internal cooldown, and a clone
#   inherits none — authored per rank. `flags: 4` is TBC 16257's own ProcTypeMask
#   (PROC_FLAG_DONE_MELEE_AUTO_ATTACK, LIVE_MATCH) = "one charge per melee swing", written explicitly
#   rather than left to the core's DBC fallback; typeMask/phaseMask/hitMask are all UNUSABLE for that
#   flag (it is outside SPELL_PROC_FLAG_MASK and REQ_SPELL_PHASE_PROC_FLAG_MASK) so they are omitted
#   and the generator zeroes them. That same flag is what makes the Stormstrike knock-on unreachable —
#   see node 20238.
#   SCRIPT BIND: `spell_sha_flurry_proc` is bound to **-16257**, i.e. the whole STOCK chain, so a clone
#   gets none of it. Rebound per rank in `scriptBindings:` below (positive, not negative — a negative
#   spell_id requires the bound id to be the first rank of a real `spell_ranks` chain, and these five
#   are talent-granted proc targets with no chain of their own).
#   CLIENT: the Vanilla clones' `Description_Lang_enUS` is `"Increases your attack speed by $16257s1%"`,
#   which the client resolves against LIVE 16257 = 6% at every rank (_ref.open_questions[932400-404], a
#   live Vanilla defect). It is deliberately NOT copied; each rank carries its own literal text.
