  template: 17364          # instant, melee range, weapon-equip gate, DurationIndex 29 (12 s), icon 2562
  attributesEx3: 67108994  # live 17364's 67108866 | 0x80 SPELL_ATTR3_DOT_STACKING_RULE.
                           # `ApplySpellFix({17364})` (SpellInfoCorrections.cpp:938) ORs that bit
                           # onto the TEMPLATE by id; a clone never receives it, so without this the
                           # era Stormstrike's Nature-vulnerability debuff does not stack separately
                           # per caster. Caught by the batch 4a spec review: the aaa4086 commit added
                           # the attributesEx3 key CITING Stormstrike, then mislabelled 946520 as a
                           # shipped-Vanilla clone (it is TBC/Plan 3a, unmerged and freely editable)
                           # and left it unfixed. See _ref.open_questions id 11.
  cooldown: 10000          # TBC 10 s (live RecoveryTime is 8000) — from the cached TBC tooltip; RecoveryTime is outside _ref's swept columns
  procCharges: 2           # TBC (live 4) — "the next 2 sources of Nature damage"
  procTypeMask: 139944     # TBC (live 139808)
  effects:
  - { effect: 6,  aura: 87, misc: 8, basePoints: 19, dieSides: 1, targetA: 6 }              # MOD_DAMAGE_PERCENT_TAKEN, Nature, EFFECTIVE +20% from EVERYONE (mask inherited; aura 87 ignores it)
  - { effect: 64, trigger: 32175, basePoints: 0,  dieSides: 0, targetA: 6 }                 # main-hand weapon strike (stock, LIVE_MATCH apart from AttributesEx4)
  - { effect: 64, trigger: 32176, basePoints: -1, dieSides: 1, targetA: 6 }                 # off-hand weapon strike (stock)
  client:
    name: Stormstrike
    icon: 2562             # stock Stormstrike SpellIconID (17364 dump 2026-09-01)
    skillLine: 373         # Enhancement — else the granted active lands in the client's General tab
    description: "Instantly attack with both weapons. In addition, the next 2 sources of Nature damage dealt to the target are increased by 20%. Lasts 12 sec."
    auraDescription: "Increases Nature damage taken by 20%."
