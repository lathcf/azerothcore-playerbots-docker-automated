# --- Wrath of Air (family index 24, block 947300-947309, creatures 920540-920549) -------------------
# TBC-NEW, and the spec's "encoding read owed" premise was a false lead (1.12's 3738 is
# `zzOLDCure Poison`, an Effect-36 LEARN_SPELL wrapper, and 2895 is `zzOLDSpell - Reuse`). Both ids
# EXIST in 3.3.5a but were reshaped by WotLK, so both halves are minted.
# SUMMON **947300**, FRESH creature **920540**. `template: 3738` (the live carrier). TBC vs LIVE:
#   `ManaCost` **320 flat / PowerCostPct 0** against live's **0 flat / ManaCostPct 11**, and
#   `DurationIndex` 4 (120 s) against 5 (300 s). Everything else matches — SchoolMask **1** on BOTH
#   sides (the one summon in this batch that is genuinely Physical, so no `school:` override),
#   Attributes 65536, level 64, RangeIndex 1, CastingTimeIndex 1, SpellClassMask_1 536870912, the
#   air-slot miscB 83 / targetA 43, and bp 4 + DieSides 1 = 5 health.
#   `maxLevel` is NOT authored: wago gives 3738 MaxLevel 70 and live gives 0, but the summon's only
#   effect has `EffectRealPointsPerLevel` 0 on both sides, so the field is noise-filter **N7** —
#   `SpellEffectInfo::CalcValue` reads MaxLevel only inside `if (caster && basePointsPerLevel != 0)`.
# PULSE **947301**. `template: 2895` — the live carrier is reshaped but is still the right donor: it
#   supplies `Attributes 320` (PASSIVE), SchoolMask 8, and SpellClassMask_**2** = **256** (word-B
#   bit8), which wago confirms is TBC's own identity for this spell.
#   **CORRECTED 2026-09-01.** This block used to end "Nothing in this dataset binds word-B bit8, so
#   no node moves." The premise was true and the conclusion WRONG: TBC's own Totemic Mastery carries
#   bit8 (wago 16189 EFFECT_0 reads EffectSpellClassMask word0 67624960 / word1 **256**), and node
#   20248 had simply never been measured against it. Without bit8 a TBC shaman got +10 yd on every
#   friendly totem pulse EXCEPT this one. Node 20248's `affectsMask.b` is now 2097408 = bit21 |
#   bit8. **Standing rule this earned: whenever a batch MINTS a pulse, re-check that every
#   friendly-totem spellmod still intersects it** -- not just that the pulse carries the era's bit.
#   THE MECHANIC IS COMPLETELY DIFFERENT FROM LIVE and is the whole reason for the mint: live 2895 is
#   ONE effect, aura **65** MOD_CASTING_SPEED_NOT_STACK at +5% (WotLK's spell-haste rework). TBC's
#   2895 is TWO effects, both at EFFECTIVE **+101** with EffectMiscValue **126** (every magic school):
#   aura **13** MOD_DAMAGE_DONE and aura **135** MOD_HEALING_DONE — the classic "+101 spell damage
#   and healing" raid totem. Both are authored; slot 3 is 0-filled by the templated-helper rule.
#   `targetA: 1` / `targetB: 0` are authored on BOTH effects, NOT inherited: `SpellInfoCorrections
#   .cpp:127` rewrites exactly those two fields on stock 2895 (from 18 / 33) by ID, and a clone
#   receives no by-id fix. This also matches every other pulse in the substrate.
