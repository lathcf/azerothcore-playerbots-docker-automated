  - id: 6
    what: "Elemental Focus's Clearcasting (16246) is granted stock, and the stock mask lets the charge be spent on a heal"
    status: ACCEPTED (Plan 3a Task 6, node 20205)
    owner: "Plan 3a Task 6; re-open only if the real-client pass shows heal-spending is material"
    measured: >-
      wago 16246 EffectSpellClassMask_0 = 2416967683 = word-A bits {0,1,20,28,31} = Lightning Bolt |
      Chain Lightning | Earth Shock | Flame Shock | Frost Shock - NO heal bits.
      live 16246 maskA_1 = 2551185859 = those bits PLUS {6,7,8,27}, where {6,7,8} = Healing Wave /
      Lesser Healing Wave / Chain Heal. (Comparable because spec Amendment A.12 establishes word 0 is
      comparable between wago and live; higher words are not, and are not relied on here.)
    consequence: >-
      A TBC shaman could not spend an Elemental Focus charge on a heal; on this build they can. The
      charge is still only GAINED from a damage-spell crit - 16164's ProcFlags 65536 is
      DONE_SPELL_MAGIC_DMG_CLASS_NEG - so the divergence is confined to which spell SPENDS an
      already-earned charge, and the magnitude is one 40%-discounted heal per proc.
    why_accepted: >-
      16164 must be granted stock (LIVE_MATCH, script-bound by id to spell_sha_elemental_focus, and
      it carries a stock spell_proc row - script_bindings[16164] says so), and its DBC
      EffectTriggerSpell points at 16246. Narrowing the mask therefore means cloning 16246 AND
      cloning 16164 to re-point its trigger, re-creating the script binding, and hand-writing a
      second spell_proc row: three new silent-failure surfaces for one mask word. See
      open_questions[16246].task6_decision for the full reasoning.
  - id: 7
    what: "Improved Fire Totems (node 20208): the Fire Nova Totem ACTIVATION-DELAY half is not shipped"
    status: OPEN - **owner Plan 3b** (mirrored into the Plan 3b task list; this row is the handoff)
    measured: >-
      TBC 16086/16544 carry THREE effects. Only the third ships today:
      e1 aura 107 flat -1000/-2000, EffectMiscValue 19 SPELLMOD_ACTIVATION_TIME   } the delay half
      e2 aura 107 flat -1000/-2000, EffectMiscValue  1 SPELLMOD_DURATION          } (NOT shipped)
      e3 aura 108 pct  -25/-50,     EffectMiscValue  2 SPELLMOD_THREAT               (SHIPPED)
