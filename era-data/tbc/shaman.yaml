# --- Poison Cleansing (family index 15, block 947210-947219, creatures 920450-920459) ---------------
# --- Disease Cleansing (family index 16, block 947220-947229, creatures 920460-920469) --------------
# The two halves are one mechanic and are documented together; only DispelType, level and the
# creature entry differ. ONE RANK EACH, all three roles RETUNED, nothing reused.
# THE DECISIVE NUMBER IS THE DISPEL PERIOD (Amendment B.4 item 4): TBC's passive fires every
#   **5000 ms**; the shipped Vanilla clones 931250 / 931270 fire every **3000 ms**, and so does live
#   8172. That is a 67% throughput error on the totems' entire purpose, and it is the single reason
#   both directions of Amendment B.2 fail on the passive role.
# THE 3.3.5a ID COLLISION, which decides the donors: in TBC, 8166/8167/8168 are Poison-Cleansing-only
#   and 8170/8171/8172 are Disease-Cleansing-only. In 3.3.5a the 8166 series is **ABSENT ENTIRELY**
#   and the 8170 series is the MERGED "Cleansing Totem" that dispels both. So a TBC shaman must never
#   be granted stock 8170 (Task 6 keeps it in `kEraShaHide`), and Poison has no same-id donor at all.
#   Both halves therefore template off the 8170 series: TBC's 8166/8167/8168 and 8170/8172 are
#   field-identical to their disease counterparts except SpellLevel and the dispel type, so the
#   8170 series is the CORRECT donor for both, not a convenience.
# WHY THE DONOR CHANGED FROM THE VANILLA PHASE'S 8146 — and it matters. The Vanilla clones 931251 /
#   931271 template **8146** (Tremor Totem Effect) purely to inherit `ImplicitTargetB_1 = 33`
#   TARGET_UNIT_SRC_AREA_PARTY, because the generator's `effects:` schema had no `targetB` key at the
#   time. It does now, so the effect clones here template live **8171** instead and author
#   `targetB: 33` by hand. That single swap closes the Attributes divergence the reference flags
#   (`effect: Attributes TBC0x10180->CLONE0x900`): 8171 carries **65920** (0x10180) on BOTH sides,
#   which IS TBC's value, while 8146 carries 2304 (0x900) — the Vanilla clones' figure came from the
#   donor, not from either era's Cleansing Totem. 8171 also carries the right SpellClassSet 11,
#   SpellClassMask_1 67108864 (word-A bit26) and SchoolMask 8 for free.
# NO SCRIPT BINDING, verified rather than inherited. `_ref.script_bindings[8171]` says "DO NOT
#   rebind" and the reason still holds for what is authored here: `spell_sha_cleansing_totem_pulse`
#   registers `OnEffectHitTarget ... EFFECT_0, SPELL_EFFECT_DUMMY` (spell_shaman.cpp:554), and the
#   TBC-shaped clone's EFFECT_0 is `SPELL_EFFECT_DISPEL` (38), so the handler could never fire. The
#   script exists only to bridge live's DUMMY hop to 52025; TBC dispels directly and needs no bridge.
#   No other roster id in this batch carries a `spell_script_names` or `spell_proc` row.
# SUMMONS: **MINTED 947210 / 947220.** TBC vs LIVE diverges on DurationIndex (4 = 120 s vs 5) and
#   SchoolMask (**8 Nature** vs live 8170's 1 Physical); the cost model is 0 flat + 8% of base mana
#   on BOTH sides, so `powerCost: 0` / `manaCostPct: 8` are authored for legibility rather than
#   correction (the Vanilla clones carry 1.12's flat 75 + pct 0, which is what makes them unusable).
# PASSIVES: **MINTED 947211 / 947221.** `template: 8172` carries Attributes 67904 (PASSIVE 0x40 set)
#   and DurationIndex 0, which is what `SpellAuras.cpp:804` needs for a permanent totem aura; only
#   the period and the trigger id are overridden. TBC's DurationIndex 21 (infinite) vs the template's
#   0 (no duration entry) is the N4-filtered pair — both permanent, so 0 is inherited deliberately.
# EFFECTS: **MINTED 947212 / 947222.** `basePoints: 1 / dieSides: 0` = 1 dispel charge; TBC encodes
