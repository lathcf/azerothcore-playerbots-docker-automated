    conventions:
      effect_slot_numbering: 'THIS FILE NUMBERS EFFECT SLOTS 1-BASED: `e1`/`e2`/`e3` are DBC columns Effect_1/Effect_2/ Effect_3,
        i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where `EFFECT_0` is DBC slot 1 and `EFFECT_1`
        is DBC slot 2. The two collide, and the collision lands on the highest-risk entry in the file (Nature''s Guardian,
        whose threshold the core reads from `Effects[EFFECT_1]` = this map''s e2). RULE: wherever a core-source token appears
        — in `script_bindings:` and in `unverified_slots:` — it is written `EFFECT_n (0-based core enum; = this map''s e<n+1>)`.
        Anywhere else, `eN` is 1-based and means the DBC column of the same number. Never translate one into the other by
        name alone.'
      magnitudes_are_effective: EVERY magnitude quoted in prose anywhere in this file is the EFFECTIVE value — what the server
        computes, i.e. `basePoints + 1` when `EffectDieSides == 1` and `basePoints` when DieSides is 0 (`SpellEffectInfo::CalcBaseValue`).
        The same is true of the `val<n>` term in every survival_map `detail:` tuple. Where a raw DBC base-points figure is
        given it is always marked `(EFFECTIVE …; raw …)` or the word "raw". If a row says neither, it is effective. This error
        class has recurred, so treat an unmarked number as effective and re-derive rather than assuming.
      verdict_vocabulary: LIVE_MATCH = every comparable field agrees. DIVERGED = at least one comparable field differs. WAGO_ONLY
        = in TBC, absent from 3.3.5a (reconstruct). LIVE_ONLY = in 3.3.5a, absent from TBC (must not be reachable). LIVE_ONLY_DB_ADDED
        = in neither DBC nor wago but present in acore_world.spell_dbc, so the SERVER has it. LIVE_MATCH_UNVERIFIED_SLOT =
        everything comparable agrees BUT at least one slot could not be compared at all; it is a distinct token precisely
        so a consumer matching `LIVE_MATCH` exactly does not silently accept it. Any entry carrying `unverified_slots:` must
        be read before it is trusted.
      cross_references: Each survival_map entry carries the outbound links a consumer needs so that no finding in this file
        is reachable only from a section the consumer did not open. `see:` lists the other top-level keys that discuss this
        id (that is what makes, e.g., the Flurry contradiction reachable from 16256, whose own verdict is LIVE_MATCH). `triggers:`
        / `triggered_by:` link a spell to its chain in both directions. `node:` is populated for triggered spells too - it
        names the node whose rank spell triggers them - so a triggered id is never orphaned from the talent that owns it.
        `see:` is computed by scanning the RAW TEXT of each top-level section, not a parsed dump - the first implementation
        parsed the YAML first, which silently dropped trailing `#` comments and matched only whole-word ids, so mentions inside
        a comment (32593/32594 in spells_supplement) and inside a client format spec (`$64701s1` in reuse_ledger) were missed.
        Both classes are covered now.
      trigger_chains: A node's TALENT ROW being LIVE_MATCH does not make the node safe. Four nodes have a clean talent row
        and a diverged TRIGGERED chain (see node_buckets.clean_row_diverged_chain). Every id's `triggers:` / `triggered_by:`
        keys are populated so a chain can be walked from either end; the trigger targets of every id in this map have themselves
        been swept.
