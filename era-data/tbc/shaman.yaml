      6%-of-max-mana arithmetic lives in `spell_sha_mana_tide_totem` and is already TBC-correct; 16191 (the pulse) is LIVE_MATCH.
      The talent row 16190 is DIVERGED only on SchoolMask 16 (Frost) -> 1 (Physical) and ManaCostPct 3 -> 0.
    unresolved: Whether the widened radius is worth a clone + rebind. Task 8's call; both are defensible.
  - id: 16246
    what: Clearcasting - grant stock or clone?
    state: OPEN, both options safe
    known: Live 16246 adds an EFFECT_2 (aura 79 MOD_DAMAGE_PERCENT_DONE, misc 28) that TBC does not have. Its amount is computed
      by `spell_sha_clearcasting` from Elemental Oath 51466 — a WotLK talent a TBC shaman cannot take — so it evaluates to
      0 and the stock spell behaves as TBC's. Cloning is more literal; granting stock is functionally identical and keeps
      the Elemental Focus 16164 stock grant coherent.
    unresolved: Task 6's call. Either way NO scriptBindings entry (see script_bindings 16246).
    task6_decision: >-
      DECIDED (Plan 3a Task 6, node 20205): GRANT STOCK 16164, which triggers stock 16246. Do not
      clone either. Reasons, in order of weight: (1) the recorded divergence is one WotLK-ADDED
      EFFECT_2 whose amount `spell_sha_clearcasting` computes from Elemental Oath 51466, a WotLK
      talent a TBC shaman can never take, so it evaluates to 0 - and every field the two eras share
      already matches (live 16246 EFFECT_1 aura 108 misc 14 SPELLMOD_COST raw -41 / DieSides 1 =
      EFFECTIVE -40%, ProcCharges 2, DurationIndex 8 = 15 s), i.e. the stock row already IS "reduces
      the mana cost of your next 2 damage spells by 40%"; (2) 16164 itself must be granted stock
      (LIVE_MATCH, script-bound by id, and it carries a stock spell_proc row - script_bindings[16164]
      says so explicitly), and its DBC EffectTriggerSpell points at 16246, so re-pointing it at a
      clone would ALSO mean cloning 16164, re-creating the `spell_sha_elemental_focus` bind and
      hand-writing a second spell_proc row - three new silent-failure surfaces to remove an effect
      that computes to zero; (3) no reuse is available anyway - the shipped Vanilla clone 932415 is
      Vanilla's Clearcasting (-100% cost, ProcCharges 1, built on the Convection 16039 template)
      against TBC's -40% / 2 charges, so under the all-or-nothing rule it would have to be a fresh
      clone, and it is shipped Vanilla content this phase must not edit.
      KNOWN, QUANTIFIED DIVERGENCE (Task-6 fix round; recorded as accepted_gaps id 6, NOT as an
      uncertainty). Spec Amendment A.12 makes per-effect class-mask word 0 comparable, and it settles the
      question the first draft called unknowable:
      wago 16246 EffectSpellClassMask_0 = 2416967683 = bits {0,1,20,28,31} - NO heal bits;
      live 16246 maskA_1 = 2551185859 = the same bits PLUS {6,7,8,27}, where {6,7,8} are Healing Wave /
      Lesser Healing Wave / Chain Heal. So a TBC shaman could NOT spend an Elemental Focus charge on a
      heal, and the stock grant lets them. The grant-stock decision stands on cost/benefit - the charge
      can still only be GAINED from a damage-spell crit, so the delta is confined to which spell SPENDS
      an already-earned charge, and closing it costs a 16164 clone plus a re-created
      spell_sha_elemental_focus bind plus a hand spell_proc row - but it is now filed as a measured gap
      with both mask values, not as something unknown.
