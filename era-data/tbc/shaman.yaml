# 946526 "Shamanistic Rage" — node 20240's granted active.
#   _ref survival_map 30823 DIVERGED on EFFECT_1's amount only: TBC EFFECTIVE **30** (= 30% of attack
#   power) vs live 15. EFFECT_2 (aura 87 MOD_DAMAGE_PERCENT_TAKEN misc 127 at EFFECTIVE -30% damage
#   taken) is unchanged, and both slots are authored so the template's own values cannot leak.
#   TEMPLATE 30823 for the instant self-cast, SpellIconID 2024, family 11 + SpellClassMask_2 131072
#   (its own identity bit) and DurationIndex 8 (15 s, matching the tooltip's "Lasts 15 sec").
#   COOLDOWN, like Stormstrike's, is outside _ref's swept columns: the cached TBC tooltip says "2 min
#   cooldown" against live's RecoveryTime 60000, so `cooldown: 120000` is authored from the tooltip.
#   SCRIPT BIND (mandatory): `spell_sha_shamanistic_rage` is bound to 30823 BY ID, and its
#   OnEffectProc is the ENTIRE mana return — CalculatePct(GetTotalAttackPowerValue(BASE_ATTACK),
#   EFFECT_0 amount) cast into 30824 (spell_shaman.cpp:1813-1835, which reads nothing by id except
#   the 30824 it casts, so it works unchanged on a clone). See `scriptBindings:`.
#   PROC ROW (mandatory): _ref.proc_rows[30823] is SpellTypeMask 1 / SpellPhaseMask 2 /
#   **ProcsPerMinute 18** / Chance 0. A clone inherits none of it, and the core only falls back to the
#   DBC ProcChance when Chance AND ProcsPerMinute are both 0 (SpellMgr::LoadSpellProcs) — so without
#   this row the mana return fires at 100% on every melee hit. `flags: 20` is the clone's own inherited
#   ProcTypeMask written explicitly (the generator validates typeMask/phaseMask against the ROW's
#   flags and rejects them at 0), which is equivalent to the stock row's ProcFlags 0.
#   30824 stays STOCK — the script casts it by id, its effects and non-effect fields agree, and its
#   only divergence is an Attributes bit.
#   ACCEPTED INHERITED-ATTRIBUTE GAP — _ref.accepted_gaps id 9, and a DECISION rather than an
#   oversight. `_ref.survival_map[30823].attribute_divergences` records `AttributesEx5 TBC 0x0 ->
#   LIVE 0x8` = **SPELL_ATTR5_ALLOW_WHILE_STUNNED** (SharedDefines.h:558), a WotLK addition, and a
#   `template: 30823` clone inherits it because the generator exposes `attributes` / `attributesEx`
#   and nothing for AttributesEx2..7. Effect: a TBC shaman can pop Shamanistic Rage while stunned,
#   which TBC did not allow. Small, real, PvP-only.
#   WHY NOT FROM-SCRATCH, the way the Flurry clones went. A.9's discrimination test does point that
#   way — a from-scratch row would land Ex5 at 0 — but the two cases are not the same trade. Flurry's
#   clones are one-effect BUFFS whose entire shape is eight known scalars, so from-scratch costs
#   nothing. This is a player-CASTABLE active, and the generator exposes none of InterruptFlags,
#   AuraInterruptFlags, Targets, SpellVisualID, DefenseType, PreventionType or StanceBarOrder — every
#   one of which `template: 30823` supplies and a from-scratch row would silently zero. Trading one
#   known 1-bit divergence for an unbounded set of unknown dropped columns on a spell the player
#   casts is the worse deal, and is exactly the class of silent failure this framework keeps warning
#   about.
#   CHEAP FUTURE FIX: an `attributesEx5` generator scalar plus `attributesEx5: 0` here. The full
#   statement — what to add, why it is the same one-key shape the existing `attributesEx` key was
#   added by, and why this round did not take it — is NORMATIVE in `_ref.accepted_gaps` id 9
#   (`cheap_fix_when_someone_wants_it`). That row is the single source; do not restate it.
