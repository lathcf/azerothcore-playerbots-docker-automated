    db_overlay: The DBC on disk is NOT the whole live store. acore_world.spell_dbc adds rows at worldserver load. Two ids
      in this map exist ONLY there — 18350 "Dummy Trigger" and 39301 "Nature's Guardian" (the NG threat-drop the core script
      casts). A DBC-only diff verdicts both as absent/WAGO_ONLY; the server HAS them. This is exactly what live-verification
      was for. Verdict `LIVE_ONLY_DB_ADDED` marks them.
    tbc_source: wago 2.5.4.44833 SpellEffect / SpellMisc / SpellAuraOptions / SpellPower / SpellName / SpellDuration
    corrections_to_the_plan_script:
      base_points_off_by_one: 'The plan''s Step 3 snippet compares wago EffectBasePoints against LIVE EffectBasePoints + 1.
        That is WRONG: wago 2.5.4 stores EffectBasePoints in the same raw (value-1) DBC convention. Proof — the framework
        doc''s own anchor, TBC Mangle (Cat) 33876 EFFECT_2 "basePoints 159 (=160%)", reads 159 in the wago CSV. Left uncorrected
        the script marks 199 of 240 ids DIVERGED, i.e. it destroys the artifact. This map compares the EFFECTIVE value on
        both sides (see conventions.magnitudes_are_effective), which also normalises the several places where a clone or live
        row moved the +1 into DieSides.'
      duration_index_is_comparable: wago 2.5.4's SpellDuration table matches every 3.3.5a index anchor this project has recorded
        (8=15000, 9=30000, 18=20000, 21=-1 infinite, 29=12000, 64=40000), so raw DurationIndex values ARE comparable across
        the two builds for this id set. ms values quoted below come from SpellDuration-2.5.4.
      unused_slot_filter_narrowed: 'FIX ROUND. The first pass discarded any slot whose `Effect` was 0 on BOTH sides as padding.
        That is unsafe: `SpellEffectInfo::CalcValue()` returns basePoints regardless of whether `Effect` is 0, so a slot can
        be both "unused" and load-bearing — and two core scripts prove it (Windfury Weapon''s attack-power bonus and Nature''s
        Guardian''s health threshold both live in such a slot). The filter now discards the slot ONLY when the base points
        also agree; otherwise the values are printed under `unverified_slots:` with a `~eN` marker, matching the druid sibling''s
        `~e3` precedent.'
      attributes_were_never_swept: 'SECOND FIX ROUND, and the same shape of gap as the non-effect one that workflow lesson
        1 exists for: an entire column family sat outside the diff. Neither the original pass nor the first fix round compared
        `Attributes` / `AttributesEx` / `AttributesEx2` .. `AttributesEx7` (wago `SpellMisc.Attributes_0..7`) at all. It surfaced
        because a reuse_ledger entry asserted "ATTRIBUTES - 0 on both. EQUAL." for the Flurry buff clones, which was FALSE
        - they carry `AttributesEx3 524288` (SPELL_ATTR3_INSTANT_TARGET_PROCS) against TBC''s 0, and that single field reversed
        the verdict. All eight words are now swept for every id in the map. LAYOUT VALIDATED BEFORE USE, independently of
        the review that raised it: across the 214 ids present on both sides, wago `Attributes_N` agrees with live `AttributesEx(N)`
        at 97.7 / 99.5 / 98.6 / 94.9 / 99.1 / 99.5 / 93.5 / 96.3 % for N = 0..7. A bit-reassignment between the two builds
        would not produce agreement at that level, so the disagreements are real era differences rather than layout artifacts.
        RESULT: 31 of 262 ids carry at least one attribute difference; they are recorded per-entry under `attribute_divergences:`
        with the AzerothCore bit name for each differing bit. Eight of them had been LIVE_MATCH. LESSON FOR THE NEXT CLASS
        PHASE: sweep attributes from the FIRST pass. The most frequent single finding here is `AttributesEx6` bit 26 (SPELL_ATTR6_VEHICLE_IMMUNITY_CATEGORY,
        which AzerothCore itself annotates "Unknown attribute 26@Attr6") on 11 ids, all TBC 0 -> LIVE set; the most consequential
        is `AttributesEx3` bit 19 on the Flurry buff chain.'
      generator_reach_over_attributes: Needed to decide any reuse question that turns on an attribute. `tools/gen_era_talents.py`
        exposes `attributes` -> `Attributes` (line 1134) and `attributesEx` -> `AttributesEx` (line 1143) as helper scalars,
        and NOTHING for AttributesEx2..7 (`grep -c AttributesEx3` returns 0). So a fresh clone can be authored to TBC's `Attributes`/`AttributesEx`,
        but its AttributesEx2..7 come from whatever template it clones and cannot be overridden. That asymmetry is what makes
        `Attributes` a field that DISCRIMINATES between reuse and fresh, while AttributesEx2..7 generally do not.
      wago_cannot_answer_an_empty_slot: 'Load-bearing consequence, and the reason the marker says UNVERIFIED rather than DIVERGED:
        wago 2.5.4''s SpellEffect table contains exactly ONE row with `Effect == 0` in the entire table. DB2 simply does not
        store empty-effect rows. So where the live DBC has `Effect 0` with non-zero base points, TBC''s value for that slot
        is NOT KNOWABLE from wago — the absence of a row is not evidence of a zero, and this file does not claim one.'
    noise_filters_applied:
    - per-effect SpellClassMask words are NOT compared at all (spec §2 - 2.4.3 used two 32-bit words, the DB2 four, with different
      bit assignments)
    - a slot whose Effect is 0 on BOTH sides AND whose base points agree (narrowed in the first fix round - see corrections_to_the_plan_script.unused_slot_filter_narrowed)
    - a live padding Effect_N = 6 with no aura where wago has no SpellEffect row
    - DurationIndex disagreement confined to {0, 21} on a passive (both mean permanent)
    - 'a missing wago SpellAuraOptions row opposite the live DBC ''not a proc'' default (ProcChance 101 / charges 0 / mask
      0) - AND ONLY THEN. Second fix round: the first implementation had this condition INVERTED, so the cases where TBC has
      no row and 3.3.5a IS a real proc were being printed inside a ''[noise ignored: ...]'' bracket. Five ids were affected
      (16086/16544 live 100/0/0; 16180/16196/16198 live 33|66|100 / 0 / 16384 - WotLK''s Improved Water Shield genuinely procs
      where TBC''s Nature''s Guidance has no SpellAuraOptions row at all). No verdict changed - all five are DIVERGED on effects
      anyway - but the difference now appears in `detail:` where a Task 6/7 author will see it.'
    - NOTHING in the ATTRIBUTE words is filtered. All eight are compared verbatim.
    ids_swept: 262
    verdict_counts:
      LIVE_MATCH: 80
      LIVE_MATCH_UNVERIFIED_SLOT: 4
      DIVERGED: 130
      WAGO_ONLY: 31
      LIVE_ONLY: 15
      LIVE_ONLY_DB_ADDED: 2
    id_set_extensions: 'The plan''s Step 1 list carried 240 ids. It is now 262, extended twice, as Step 1 invites. FIRST PASS
      (+10): 16257/16277/16278/16279/16280 (the Flurry BUFF chain — script-bound via -16257 and value-diverged, while the
      Flurry TALENT ranks are all LIVE_MATCH: the clearest instance of spec §5''s "chase triggers, not just the talent row");
      8514 (TBC Windfury Totem trigger); 18350 (the dummy trigger Nature''s Guardian 30881 fires); 51466 Elemental Oath (the
      only thing spell_sha_clearcasting computes); 63280 Glyph of Totem of Wrath (the only thing spell_sha_totem_of_wrath
      does); 38443 (the "Totemic Mastery" spell_sha_totemic_mastery binds). FIX ROUND (+12): rather than chase the three chains
      the review named, every EffectTriggerSpell of every id already in the map — on BOTH sides — was enumerated and any target
      not yet swept was added. That found twelve, nine of them not previously named: 16177/16236/16237 (Ancestral Fortitude
      — a REAL DEFECT, see spec_bucket_contradictions), 18848/36591 (Spirit Weapons), 29177/29178/30165 (Elemental Devastation),
      674 (Dual Wield), 64701 (Elemental Mastery''s WotLK haste trigger) and **30806/30807 — the 4th and 5th ranks of the
      TBC Unleashed Rage buff chain, which the plan''s hardcoded list had as three ranks (30803/30804/30805) when TBC has
      five.** The sweep is now closed: re-running it against the 262-id set finds no further unswept target.'
