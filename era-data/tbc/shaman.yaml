# --- Windfury Totem (family index 26, block 947330-947339, creatures 920560-920569) -----------------
# THE HARDEST FAMILY IN THE ROSTER, and the one place in this batch where the TBC mechanic is
# reconstructed rather than copied. Read this whole block before changing anything in it.
#
# GROUND TRUTH, re-measured 2026-09-01 (wago 2.5.4 + `azerothcore-wotlk/ip-dbc/Spell.dbc`, NOT
# `acore_world.spell_dbc` -- that is the 6.8k-row CUSTOM-OVERRIDE table and gives false absences):
#   * FIVE TBC player ranks, confirmed from wago `SkillLineAbility` (SkillLine **373** Enhancement,
#     rows 4725 / 5646 / 9023 / 13317 / 13318): summons **8512 / 10613 / 10614 / 25585 / 25587** at
#     L32 / L42 / L52 / L61 / L70. 27621 has NO SkillLineAbility row and is excluded (`_ref`
#     open_questions id 4).
#   * TBC's chain is FOUR layers deep:
#       summon 8512...   -> creature 6112/7483/7484/15496/15497
#       passive 8515 / 10609 / 10612 / 25581 / 25582   (Attributes 320 PASSIVE, aura **23**
#            PERIODIC_TRIGGER_SPELL at **5000 ms**, DurationIndex 21, SchoolMask 8)
#         -> effect 8514 / 10607 / 10611 / 25579 / 25580   (`Effect 92 ENCHANT_HELD_ITEM`,
#            ImplicitTarget 20 CASTER_AREA_PARTY, radiusIndex 9, EffectMiscValue = the
#            SpellItemEnchantment id **1783 / 563 / 564 / 2638 / 2639**)
#         -> payload 8516 / 10608 / 10610 / 25583 / 25584   ("Windfury Totem" r1-3, renamed
#            "Windfury Attack" at r4/r5): `aura 99 MOD_ATTACK_POWER` at EFFECTIVE
#            **122 / 229 / 315 / 375 / 445** PLUS `Effect 19 ADD_EXTRA_ATTACKS` bp 0 + DieSides 1 =
#            **ONE** extra attack at every rank, ProcChance 100, ProcCharges 2, DurationIndex 65
#            (1500 ms). ONE, not two -- the shaman's personal Windfury WEAPON is the two-attack
#            spell and is Task 7's, a different chain entirely.
#   * PRESENCE IN THIS BUILD, checked id by id against ip-dbc/Spell.dbc (50 011 rows):
#       PRESENT: 8512 (summon r1), 8515 (passive r1), 25504 / 33750 (Windfury Attack MH/OH), 27621.
#       ABSENT : 10613, 10614, 25585, 25587, 10609, 10612, 25581, 25582,
#                **8514, 10607, 10611, 25579, 25580** (the whole Effect series),
#                **8516, 10608, 10610, 25583, 25584** (the whole payload series).
#     Live 8515 is WotLK's rework under the same id: `Effect 65 APPLY_AREA_AURA_RAID / aura 138`
#     flat melee HASTE, bp 15 + DieSides 1 = 16%, radiusIndex 10 -- the fact gap 8 turns on.
#
# WHY THE LITERAL TBC ENCODING IS NOT AUTHORED. It is not a fidelity preference; the chain is dead
# on this build, and cloning it would be actively harmful:
#   (1) The FIVE `SpellItemEnchantment.dbc` rows DO survive in `ip-dbc/SpellItemEnchantment.dbc`
#       ("Windfury Totem 1".."Windfury Totem 5"), each `type[0] = 1` ITEM_ENCHANTMENT_TYPE_COMBAT_
#       SPELL -- but each row's `spellid[0]` is the TBC payload 8516 / 10608 / 10610 / 25583 / 25584,
#       every one of which is ABSENT from Spell.dbc. `Player::CastItemCombatSpell`
#       (Player.cpp:7528-7533) logs "unknown spell {} is casted, ignoring..." and `continue`s --
#       BEFORE the chance roll -- so a literal clone would apply a weapon glow that procs nothing and
#       spam one error line per qualifying swing per imbued raid member. This is the SAME wall
#       `_ref.accepted_gaps` id 7 records for Flametongue, on the same evidence class.
#   (2) ~~a dead enchant would BLOCK the party's real temp imbues~~ **RETRACTED 2026-09-01 (batch 4b
#       spec review): THIS HARM DOES NOT EXIST, and the causal direction was inverted.** The refusal
#       at `SpellEffects.cpp:4469` lives inside `EffectEnchantHeldItem` -- the TOTEM's OWN handler.
#       Every "real temp imbue" it supposedly blocked is a DIFFERENT effect: Windfury Weapon 8232,
#       Flametongue Weapon 8024 and the poisons are `Effect 54` -> `Spell::EffectEnchantItemTmp`
#       (SpellEffects.cpp:126), which OVERWRITES unconditionally ("remove old enchanting before
#       applying new", :3128-3134). A squatting totem enchant is silently replaced by the next
#       self-imbue, not sticky. What the refusal actually does is block the TOTEM's imbue when a
#       self-imbue is present -- the exact asymmetry the module's own `IsWindfuryWeaponEnchant`
#       guard is built on. The rejection still stands on (1) alone.
#   (3) Re-pointing the enchant is **not impossible, and an earlier note here said it was.**
#       RETRACTED 2026-09-01, found independently by BOTH batch-4b reviews: `DBCStores.cpp:377`
#       loads `SpellItemEnchantment.dbc` with the DB-overlay table `spellitemenchantment_dbc`, via
#       the same `LoadFromDB` path (`:253-254`) that `spell_dbc` itself rides, and that table ships
#       in the fork base. The real costs, which is what the rejection should rest on: the CLIENT
#       half is genuinely unreachable (`merge-into-patch.sh` patches only Spell.dbc +
#       SkillLineAbility.dbc, so a minted enchant id would have no client-side visual), and it is
#       materially more machinery per rank for a mechanic the DUMMY reconstruction already delivers.
#       Authoring the payload at its STOCK ids would also sit outside the reserved [920000,950000)
#       band -- the open spec question `_ref.open_questions` id 7, not Task 2's to settle.
#       Stated as an impossibility this was falsifiable in one grep, and a reader who falsifies it
#       assumes the whole rejection is soft.
#
# WHAT IS AUTHORED INSTEAD: the shipped, real-client-verified Vanilla RECONSTRUCTION, re-minted at
# TBC's own values. This is `_ref.script_bindings[931366/931367/931368].action` verbatim -- "a fresh
# TBC Windfury Totem passive needs its OWN scriptBindings entry AND its OWN spell_proc row; neither
# is inherited" -- not an invention. The passive is a permanent RAID DUMMY area aura plus a
# `spell_proc` row; `spell_era_windfury_totem` (EraTalentTotemScripts.cpp) reads the bonus AP out of
# **DBC slot 2** via `GetSpellInfo()->Effects[EFFECT_1].CalcValue(totemOwner)` and casts stock
# Windfury Attack 25504 / 33750 once with it. The script names no Vanilla-specific id, so it works
# verbatim on these clones and needs NO C++ change.
#   PROC CHANCE 20% IS NOW MEASURED, not a placeholder. The era-less `_ref` calls it
#   "UNRESOLVED-BY-EXTRACT (SpellItemEnchantment.dbc absent)" -- absent from the 1.12 extract, but
#   PRESENT in this project at `azerothcore-wotlk/ip-dbc/SpellItemEnchantment.dbc`, where all five
#   Windfury Totem rows carry `EffectPointsMin/Max = 20`. `Player::CastItemCombatSpell` uses that
#   column directly as the percent chance (`chance = pEnchant->amount[s]`). So 20 is TBC's real
#   number and the Vanilla placeholder is retroactively confirmed correct.
# PASSIVES **947335-947337** (r1-r3), FROM SCRATCH (no live carrier worth templating -- live 8515 is
#   the haste rework and would drag its aura-138 shape in).
#   `attributes: 320` PASSIVE(0x40)+DO_NOT_LOG(0x100) is MANDATORY (SpellAuras.cpp:804 grants
#   infinite duration only to a passive with no DurationEntry; DurationIndex 0 vs TBC's 21 is the
#   N4-filtered pair). `school: 8` is TBC's AND live's SchoolMask -- the shipped Vanilla clones carry
#   **0**, the from-scratch default, which is the defect batch 4a documented on Grace of Air.
#   `effect: 65` + `radius: 10` per Amendment B.8 (TBC's literal is 35 / index 9); slot 2 carries the
#   raw AP the script reads.
#   THE FAMILY IDENTITY IS **MINTED, NOT INHERITED** -- and it is the one field here with no TBC
#   value to be faithful to. wago has NO `SpellClassOptions` row for 8515 / 10609 / 10612 / 25581 /
#   25582 at all (SpellClassSet 0, mask 0): TBC's own Improved Weapon Totems 29192/29193 were bare
#   `SPELL_AURA_DUMMY` carriers the 2.4.3 server read in code, so TBC never needed a mask here.
#   Authoring TBC's literal 0/0 would leave the pulse unbindable and silently kill BOTH talents that
#   target it. So these carry **`family: 11` + `maskB: 2097152`** = live 8515's own word-B bit21, the
#   same identity the shipped Vanilla clones minted. Verified UNIQUE within family 11: a sweep of all
#   50 011 live records finds word-B bit21 on exactly one family-11 spell, 8515 itself (the other 27
#   holders are families 3/4/6/7/8/9/10/15 and cannot collide -- `SpellInfo::IsAffected` compares
#   SpellFamilyName first).
# SUMMONS **947330-947332** (r1-r3), FRESH creatures **920560-920562** (fresh because the passives
#   are). `template: 8512` for every rank -- the only DBC-present rank, the same "clone the one
#   present rank for every rank's machinery" pattern the Vanilla block and Mana Tide r2/r3 use. It
#   supplies Attributes 65536, CastingTimeIndex 1, RangeIndex 1, SpellIconID 1397 and the shared
#   totem bit `SpellClassMask_1` **536870912** (= `_ref` `summon.classMask0`, inherited, not
#   authored). Overridden: `powerCost:` 95/140/200 (wago SpellPower; the Vanilla clones carry 1.12's
#   115/175/250), `manaCostPct: 0` (live 8512 carries 11% of base mana on top), `durationIndex: 4`
#   (TBC 120 s; the template's 5 is live's 300 s -- Amendment B.3), `school: 8` and the level pair.
#   `school: 8` IS `_ref.open_questions` id 12's obligation landing: 8512 is named in that sweep's
#   21-spell list (TBC Nature 8 vs live Physical 1), and a fresh summon would otherwise inherit the
#   live 1. Ranks 4/5 (25585/25587, also school 8) are Task 3's and carry the same obligation.
#   `maxLevel` is NOT authored (noise filter N7 -- `EffectRealPointsPerLevel` is 0 on both sides).
#   ICON 1397 is CORRECT here and is the one place it is: `_ref.open_questions` id 13 measured 1397
#   as Windfury Totem's own art (its live users are 8512/8515/27621 and 10 more), which is exactly
#   why the Vanilla Windwall clones borrowing it were wrong.
# NO `SpellInfoCorrections` LOSS IN THIS FAMILY (`_ref.open_questions` id 11's per-batch check):
#   grepped `SpellInfoCorrections.cpp` for every id this block templates or casts -- 8512, 8515,
#   25504, 33750 -- and NONE appears in any `ApplySpellFix({...})` set, so no by-id fix is silently
#   dropped by cloning. (The only hit for "8515" in that file is `68515`, an Anub'arak achievement.)
# `_ref.open_questions` id 9 (a payload cast with no periodic driver) -- **BATCH 4b IS CLEAR, and
#   that closes the question.** The Index-0 spell of every creature here is the permanent
#   `Effect 65` area aura 947335-947337, which is the correct shape by construction; the STOCK
#   creature 6112 likewise casts 8515 at Index 0 (a permanent area aura in live, an aura-23 driver in
#   TBC), and 7483/7484/15496/15497 have no `creature_template_spell` row at all. Windfury Totem was
#   the last unswept family.
# GAP 8 (`_ref/tbc/shaman-spells.yaml` accepted_gaps id 8) **CLOSES HERE** -- see the node 20231
#   block above. The bonus AP now lives in DBC slot 2 of these pulses; `SpellEffectInfo::CalcValue`
#   -> `Unit::ApplyEffectModifiers` (Unit.cpp:11589) applies `SPELLMOD_ALL_EFFECTS` from the totem
#   owner's spellmods, so the node's +15/30% scales the ATTACK POWER the tooltip promises instead of
#   live 8515's haste. The node's emitted mask does NOT move: `affects: [Windfury Totem Buff]`
#   already resolves to word-B bit21, and these clones carry exactly that bit -- which is also what
#   keeps node 20248 Totemic Mastery's `affectsMask.b: 2097152` binding them.
# ONE DELIBERATE DIVERGENCE, STATED RATHER THAN HIDDEN -- **the reconstruction procs off BOTH hands
#   where TBC's enchant reaches only the MAIN hand.** `Spell::EffectEnchantHeldItem` enchants
