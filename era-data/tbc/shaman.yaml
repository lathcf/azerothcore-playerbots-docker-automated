# 946532-946536 "Nature's Guardian" — node 20257's five granted passives.
#   Hand clones rather than generator auto-passives because the talent needs TWO effect slots the
#   auto-passive emitters cannot produce: EFFECT_0 must be an aura-42 PROC_TRIGGER_SPELL carrying the
#   HEAL PERCENT as its amount (a `mechanic: proc` passive emits basePoints 0), and DBC slot 2 must
#   carry the HEALTH-PERCENT THRESHOLD that `spell_sha_nature_guardian::CheckProc` reads as
#   `Effects[EFFECT_1].CalcValue()` (spell_shaman.cpp:1167 — EFFECT_1 is the 0-based CORE enum, i.e.
#   DBC slot 2, the collision this _ref's effect_slot_numbering convention exists to prevent).
#   TBC vs LIVE (_ref.survival_map 30881/30883-30886):
#     e1 amount: TBC EFFECTIVE **10 at every rank**  vs LIVE 3/6/9/12/15
#     ProcChance: TBC **10/20/30/40/50**             vs LIVE 100
#     (WotLK moved the rank scaling out of the chance and into the heal.)
#   **KEEPING THE LIVE CARRIER IS MANDATORY.** TBC's 30881 has no DBC slot 2 populated, and wago
#   cannot even prove it is empty (DB2 stores no Effect==0 rows —
#   _ref.method.corrections_to_the_plan_script.wago_cannot_answer_an_empty_slot). A literal TBC clone
#   would yield threshold 0 and the talent would NEVER FIRE. So slot 2 is authored as live's own
#   `Effect 0` carrier at raw 29 / DieSides 1 = EFFECTIVE 30 (= the tooltip's "below 30% health",
#   identical in both eras). This is the Mangle "keep the live carrier, author the TBC values"
#   lesson, and Amendment A.5 states it for this exact spell.
#   PROC ROW: stock -30881 is SpellTypeMask 1 with **Cooldown 30000**; the cached TBC tooltip for
#   30881 says "5 second cooldown", and `spell_proc.Cooldown` is outside _ref's swept column list, so
#   5000 is authored from the tooltip (the framework's stated source for era numbers the DBC sweep
#   does not reach) and live's 30000 is recorded here. `flags: 664232` is live 30881's own
#   ProcTypeMask, written explicitly because the generator validates typeMask against the ROW's flags
#   and rejects it at 0; it decodes as every TAKEN damage event (bits 3/5/7/9/13/17/19). TBC's own
#   ProcTypeMask is `-2146819416` = 664232 | **bit31**, and bit31 is DROPPED: the fork's ProcFlags
#   enum tops out at PROC_FLAG_DEATH = bit24 (SpellMgr.h), so bit31 has no meaning on this build.
#   SpellPhaseMask is deliberately absent — every one of those flags is a TAKEN flag and none is in
#   REQ_SPELL_PHASE_PROC_FLAG_MASK, so a phase mask would be an unusable field (the generator hard-
#   errors on one); the stock row has 0 too.
#   NO `client:` BLOCK — hidden passives (Attributes 464 inherited = IS_ABILITY | PASSIVE |
#   DO_NOT_DISPLAY | DO_NOT_LOG) that the player never sees. `_grant_is_client_visible` therefore
#   omits the addon `grant` map for node 20257, so its talent-panel tooltip stays the authored prose
#   rather than a broken SetHyperlink.
#   SCRIPT BIND: required, per rank — see `scriptBindings:`.
