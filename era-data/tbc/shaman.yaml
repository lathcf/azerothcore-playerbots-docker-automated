# DRIVER: **MINTED 947001** -- the periodic re-caster the Vanilla substrate never modelled. Clone of
#   stock 6474 "Earthbind Totem Passive" (Attributes 320 PASSIVE, aura 23 PERIODIC_TRIGGER_SPELL,
#   period 3000 ms), which wago 2.5.4 and the live Spell.dbc agree on field-for-field except the
#   N4-filtered DurationIndex pair (TBC 21 infinite / live 0 no-duration; both permanent for a
#   passive). Attributes and period are INHERITED from the template -- a from-scratch passive would
#   need `attributes: 320` + DurationIndex 0 by hand to survive SpellAuras.cpp:804, and the clone
#   gets both for free.
#   It triggers **stock 3600**, not the Vanilla clone 931010: wago TBC 3600 == live 3600 on every
#   compared field, so Amendment B.2's first branch fires -- grant the stock spell, clone nothing.
#   (931010 exists only because the Vanilla phase needed an era-owned id for a creature it also
#   owned; TBC needs no such thing, and pointing at 931010 would couple TBC to a Vanilla clone for
#   no gain.) The 10 yd radius and -50% magnitude therefore come from stock 3600 itself.
#   NOT script-bound, deliberately: `spell_sha_earthbind_totem` (bound to 6474) is inert for a TBC
#   shaman -- both handlers require a WotLK talent.
- id: 947001
  name: Earthbind Totem Passive
  template: 6474
  attributesEx5: 512  # SPELL_ATTR5_EXTRA_INITIAL_PERIOD. `ApplySpellFix({8145, 6474})`
                      # (SpellInfoCorrections.cpp:394) ORs this onto the TEMPLATE by id, and a clone
                      # never receives it. Without it this driver's FIRST tick waits a full 3000 ms,
                      # so the snare starts ~3 s after the totem lands -- partly undoing the very
                      # defect the driver was minted to fix (a 45 s totem snaring for only 5 s).
                      # See _ref.open_questions id 11. NB the shipped VANILLA Tremor clone 931090 has
                      # the identical gap and is deliberately NOT fixed here (shipped-substrate rule).
  effects:
  - { effect: 6, aura: 23, basePoints: -1, targetA: 1, trigger: 3600 }   # PERIODIC_TRIGGER_SPELL/3s (period inherited) -> stock 3600 Earthbind slow field
  client:
    name: Earthbind Totem Passive
    icon: 686
    auraDescription: "Periodically reduces the movement speed of nearby enemies by 50%."
