      are the VANILLA node 18808 auto-passives - and subtracts 1000 ms per rank from the 4000 ms base.
      Plan 3b must extend that reader to ALSO recognise this node's TBC auto-passives **937664**
      (rank 1) and **937665** (rank 2) when it builds the TBC Fire Nova Totem, or the talent stays
      half-inert for every TBC shaman.
