      at all (`SPELLMOD_DURATION`, op 1, does - as `duration`), so shipping e1 would also need a
      generator change.
    plan3b_followup: >-
      The Vanilla phase solved this same half in C++, NOT in data: `npc_era_fire_nova_totem`
      ::ResolveDetonateDelay (modules/mod-era-talents/src/EraTalentTotemScripts.cpp) reads the totem
