#   NB `_ref.proc_rows[8178]` (an all-zero `spell_proc` row) needs no action: nothing is minted for
#   this role, so nothing can fail to inherit it.
# CREATURE: **REUSED, entry 920240** — already Index 0 = 931290, Index 1 = 931291 (verified in
#   acore_world). A reused entry is REFERENCED by the summon's EffectMiscValue, never redeclared.
