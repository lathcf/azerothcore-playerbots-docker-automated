# ===================================================================================================
# PLAN 3b TASK 2, BATCH 1 — the five EARTH totem families (Earthbind, Stoneskin, Strength of Earth,
# Stoneclaw, Tremor). Ids from `era-data/_ref/tbc/shaman-totems-tbc.yaml` `id_allocation:`; each
# family's actual per-role base is recorded back into that file's `tbc_clone_base:`.
#
# A totem is THREE coupled pieces: the SUMMON (a `helpers:` clone — carries the mana cost and the
# creature entry in EffectMiscValue), the CREATURE (a `totems:` row — the NPC and which pulse it
# casts), and the PULSE (a `helpers:` clone — carries the magnitude and radius). The magnitude NEVER
# goes on the summon.
#
# REUSE RULE (spec Amendment B.2, applied per ROLE in both directions):
#   * wago TBC == the SHIPPED VANILLA CLONE  -> reuse the 931xxx clone AND its creature entry, mint
#     nothing (the plan's Key facts: "reused families keep the Vanilla clones' 920100-920290").
#   * wago TBC == LIVE 3.3.5a                -> grant the stock spell, clone nothing.
#   * neither                                -> mint a fresh 947xxx clone.
# Measured three-way (wago 2.5.4 vs the live Spell.dbc vs acore_world.spell_dbc) for every role in
# this batch; the per-role outcome is stated on each entry below.
#
# SCOPE AND RADIUS ARE NOT DIVERGENCES (spec Amendment B.8 / B.8.1). TBC buff pulses keep
# `effect: 65` APPLY_AREA_AURA_RAID at `radius: 10` (30 yd), matching the shipped Vanilla clones,
# deliberately — narrowing to TBC's literal party/20 yd would show a visible DOWNGRADE at an era
# ADVANCE. Consequence: a role whose ENTIRE `clone_vs_tbc_divergences` list is `e:35->65` and/or
# `rad:9->10` is REUSABLE, which is why Strength of Earth's four pulses below are reused and not
# minted. Every OTHER retuned field (mana, duration, magnitudes, school) is still authored to TBC.
#
# SUMMON DURATION IS INVERTED IN THE SPEC BODY (Amendment B.3): TBC `DurationIndex 4` = 120 s and
# live `5` = 300 s, not the other way round. The Vanilla clones carry 5, so an un-overridden TBC
# clone would hand a TBC shaman five-minute totems. `durationIndex: 4` is authored on every summon
# whose TBC index is 4 (Earthbind 22 / Stoneclaw 8 are the two exceptions, and both are already the
# template's own value -- verified equal in wago and live, so they are inherited, not authored).
#
# TOOLTIP RADIUS PROSE: these descriptions say "30 yards" because radius index 10 IS 30 yd (wago
# SpellRadius 10 = 30) and Amendment B.8 keeps index 10 for TBC. The VANILLA clones used to carry
# index 10 with "20 yards" prose -- a text-vs-data mismatch in merged content that the 2026-09-06
# fix round (I-14) closed by moving every Vanilla friendly pulse to index 9 (the real 1.12 value per
# `_ref/shaman-totems.yaml`). So the two eras now differ on PURPOSE: Vanilla 20 yd, TBC 30 yd.
# ---------------------------------------------------------------------------------------------------
# --- Earthbind (family index 0, block 947000-947009) ------------------------------------------------
# PULSE: **REUSED, id 931010** -- the one fully identical pulse in the roster. Measured three ways:
#   wago 3600 == live 3600 on EVERY compared field (effects/attributes/duration/school/mask), and the
#   shipped clone 931010 reproduces it (aura 33 MOD_DECREASE_SPEED, EFFECTIVE -50, radius index 13 =
#   10 yd, DurationIndex 28). Nothing to mint.
# CREATURE: **REUSED, entry 920100** -- it already casts 931010 at Index 0 (verified in
#   creature_template_spell), so the TBC summon simply points at it. No fresh creature row.
# THE 6474-vs-3600 QUESTION (`_ref.script_bindings[6474]`), RESOLVED: it does not arise for this
#   batch, because no fresh Earthbind creature is wired. How it was determined: dumping 6474 from
#   wago 2.5.4 AND the live Spell.dbc shows it is "Earthbind Totem Passive" in BOTH eras -- a
#   PASSIVE (Attributes 320) aura 23 PERIODIC_TRIGGER_SPELL, period 3000 ms, EffectTriggerSpell 3600
#   -- identical on every field but DurationIndex (TBC 21 = infinite vs live 0 = no duration entry,
#   the N4-filtered pair). `creature_template_spell (2630, 0, 6474)` confirms the stock creature
#   casts the DRIVER, not the slow field, in 3.3.5a; wago's 6474 shows TBC did the same. So 6474 is
#   NOT a WotLK addition -- only the AuraScript bound to it is (`spell_sha_earthbind_totem` adds
#   Earthen Power 59566 + Storm/Earth/Fire, both WotLK talents).
#   THE DRIVER IS NOW MINTED (947001) -- REVISED 2026-09-01 after the batch 1 spec review.
#   The shipped Vanilla substrate models NO driver role: creature 920100 casts the 3600-clone
#   DIRECTLY. `Totem::InitSummon` casts m_spells[0] exactly ONCE and `TotemAI::UpdateAI` never
#   re-casts, and 3600's DurationIndex 28 = 5000 ms -- so a 45 s Earthbind snared only whoever stood
#   inside it at the drop, for 5 s, against a tooltip promising 45 s. Batch 1 first deferred this as
#   a shipped-Vanilla defect TBC merely inherits. That reasoning was about CONSISTENCY, not
#   correctness, and it shipped a family that does not work: the deferral is reversed.
#   The fix costs 1 spell + 1 creature, both already inside Earthbind's own reserved block, and is
#   MEASURED rather than invented -- wago 2.5.4 and the live DBC agree on 6474's shape, so TBC's own
#   driver is what is being reproduced. No script binding is needed: `spell_sha_earthbind_totem` has
#   BOTH handlers gated on WotLK talents (Earthen Power's family-2289 dummy; Storm, Earth and Fire),
#   read at spell_shaman.cpp:638-677, so a TBC-era clone loses nothing by not inheriting it.
#   The VANILLA side keeps the defect and is still logged in `_ref.open_questions` id 5 for separate
#   triage -- fixing merged, real-client-verified content is not this phase's business.
# SUMMON: **MINTED 947000.** TBC vs live diverges on SchoolMask ALONE (TBC 8 Nature vs live 1
#   Physical) -- discriminating and authorable, so the all-or-nothing rule forces a clone; TBC vs the
#   Vanilla clone diverges on that plus the cost model (TBC 0 flat + 5% of base vs the clone's flat
#   40 + 0%). DurationIndex 22 (45 s) and RecoveryTime 15000 are wago's values AND template 2484's
#   own, verified equal, so they are inherited rather than authored (the `_ref` evidence prose lists
#   them as if they diverged; its `clone_vs_tbc_divergences` list -- the authoritative one -- does
#   not, and the measurement agrees with the list).
