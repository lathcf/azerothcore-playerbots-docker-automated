    # _ref: DIVERGED + id_repurposing (16086/16544 are "Improved Fire Nova" in 3.3.5a -- a different
    # talent; never grant them). TBC's three effects, from the survival map:
    #   e1 aura 107 flat -1000/-2000, misc 19 SPELLMOD_ACTIVATION_TIME  } the Fire Nova Totem
    #   e2 aura 107 flat -1000/-2000, misc  1 SPELLMOD_DURATION         } activation-delay half
    #   e3 aura 108 pct  -25/-50,     misc  2 SPELLMOD_THREAT              the Magma Totem half
