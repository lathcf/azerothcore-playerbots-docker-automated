# case". The five talent ROWS 12298/12724/12725/12726/12727 are LIVE_MATCH on every field family
# (aura51 MOD_BLOCK_PERCENT +1/2/3/4/5, ProcChance 20/40/60/80/100, ProcTypeMask 0x2a8 = 680), but
# each row's e2 HARDCODES `trigger 23602`, and 23602 DIVERGES: TBC `ENERGIZE val10 misc1` = **1
# rage**, live `val50` = **5 rage** (both raw values live-dumped 2026-09-03: live 23602 e1 bp 49 /
# dieSides 1 = effective 50). wowsims/tbc `applyShieldSpecialization` corroborates TBC's
# `warrior.AddRage(sim, 1, ...)`. Stock 23602 may not be edited (era safety), and the trigger id is
# baked into the stock talent's own effect — so the node cannot grant stock.
#
# SHAPE: per-rank helper clones carrying BOTH halves, exactly the shipped, real-client-verified
# VANILLA 932823-827 build. A single talent node cannot carry a stat effect AND a data proc (a
# `multi` node is stat/spellmod-only; a `proc` node's carrier passive is aura-42-only), so the
# faithful build is a helper clone per rank with its own `proc:` row. The _ref's one-line sketch
# ("the per-rank passive that triggers it is a generated node row, not a helper") accounts only for
# the rage half and would have silently dropped the +block% half; the Vanilla precedent is what the
# talent actually needs. NOT a reuse of 932823-827 (_ref reuse_ledger: FRESH — those trigger 12964
# and carry DurationIndex 0 vs TBC 21) — these are fresh clones of the TBC-identical STOCK rows.
# Templating stock inherits Attributes 464 (PASSIVE 0x40 + hidden 0x80 -> no spellbook entry, so no
# `client:` block is needed and the talent panel keeps the authored node prose), SpellIconID 1463,
# family 0 (family-less: no warrior spellmod reaches it and it escapes the family-4
# SpellInfoCorrections category-132 sweep), and each rank's own ProcChance.
# ONLY the trigger changes: 23602 -> the fresh 1-rage payload 947566.
# proc: flags 680 = the stock/TBC ProcTypeMask (PROC_FLAG_TAKEN_{MELEE_AUTO 0x8, SPELL_MELEE 0x20,
# RANGED_AUTO 0x80, SPELL_RANGED 0x200}) = all taken melee+ranged hits; hitMask 64 = PROC_HIT_BLOCK
# = the tooltip's "when a block occurs". The BLOCK GATE IS REAL AND MUST BE AUTHORED: the live
# `spell_proc` row for -12298 carries **HitMask 112** (DODGE 0x10 | PARRY 0x20 | BLOCK 0x40), i.e.
# WotLK's dodge/parry/block rage, while every TBC rank tooltip says "when a block occurs" — so 64
# is the era value and 112 is the WotLK one (both raw values, queried 2026-09-03).
# typeMask 7 = PROC_SPELL_TYPE_MASK_ALL, matching what the core auto-generates for an aura-42
# carrier: the generator's default 1 (DAMAGE) would drop a FULL block of a melee-CLASS spell, which
# Unit.cpp tags NO_DMG_HEAL (4). Same reasoning as the Vanilla helpers.
- id: 947561
  name: Shield Specialization
  template: 12298         # stock Shield Spec R1 — inherit PASSIVE+hidden attrs 464, icon 1463, family 0, ProcChance 20
  effects:
  - { effect: 6, aura: 51, basePoints: 1, dieSides: 0, targetA: 1 }                     # +1% block chance
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 947566 }    # proc -> the TBC 1-rage energize
  proc:
    flags: 680            # 0x2a8 all taken melee+ranged hits (TBC == live ProcTypeMask)
    typeMask: 7           # PROC_SPELL_TYPE_MASK_ALL — a FULL block of a melee-class spell is NO_DMG_HEAL
    hitMask: 64           # PROC_HIT_BLOCK — "when a block occurs" (live row is 112 = dodge|parry|block)
    chance: 20
    # NB no `phaseMask:` — SpellPhaseMask 0 is INTENTIONAL here, not an omission. Every flag in 0x2a8
    # is a TAKEN event (a swing landing ON the warrior, which for a plain auto-attack carries no
    # SpellInfo at all), and the core's phase gate is scoped to DONE spell flags only
    # (`REQ_SPELL_PHASE_PROC_FLAG_MASK = SPELL_PROC_FLAG_MASK & DONE_HIT_PROC_FLAG_MASK`,
    # SpellMgr.h:184, read at SpellMgr.cpp:917). Authoring a phase would therefore make LoadSpellProcs
    # log the field as unused (SpellMgr.cpp:2116) — the generator hard-errors on it first.
- id: 947562
  name: Shield Specialization
  template: 12724         # stock R2 (ProcChance 40)
  effects:
  - { effect: 6, aura: 51, basePoints: 2, dieSides: 0, targetA: 1 }
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 947566 }
  proc: { flags: 680, typeMask: 7, hitMask: 64, chance: 40 }
- id: 947563
  name: Shield Specialization
  template: 12725         # stock R3 (ProcChance 60)
  effects:
  - { effect: 6, aura: 51, basePoints: 3, dieSides: 0, targetA: 1 }
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 947566 }
  proc: { flags: 680, typeMask: 7, hitMask: 64, chance: 60 }
- id: 947564
  name: Shield Specialization
  template: 12726         # stock R4 (ProcChance 80)
  effects:
  - { effect: 6, aura: 51, basePoints: 4, dieSides: 0, targetA: 1 }
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 947566 }
  proc: { flags: 680, typeMask: 7, hitMask: 64, chance: 80 }
- id: 947565
  name: Shield Specialization
  template: 12727         # stock R5 (ProcChance 100)
  effects:
  - { effect: 6, aura: 51, basePoints: 5, dieSides: 0, targetA: 1 }
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 947566 }
  proc: { flags: 680, typeMask: 7, hitMask: 64, chance: 100 }
