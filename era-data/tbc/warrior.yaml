  baseline_leaks:
    method: 'For every spell the tree GRANTS (or would grant), query trainer_spell for the spell and its rank chain, then
      apply the framework''s trainer-gating INTENT test: a row is a hole only if a TBC warrior could obtain the talent-gated
      spell WITHOUT the talent.'
    granted_actives_not_on_any_trainer:
      ids:
      - 12294
      - 23881
      - 23922
      - 20243
      - 12809
      - 12328
      - 12975
      - 12292
      - 12323
      - 29801
      finding: Rank 1 of every talent-granted active in the tree is absent from `trainer_spell` entirely (verified by a single
        query over the whole 308-id set). There is no rank-1 leak anywhere in the warrior tree.
    trained_rank_chains_reachable_at_TBC_levels:
    - chain: Mortal Strike
      rows: 21551@48 (req 12294), 21552@54, 21553@60, 25248@66, 30330@70
      disposition: none
      why: Node 20319 GRANTS stock 12294, so this chain is exactly the TBC rank ladder and SHOULD be reachable. Every rank
        is LIVE_MATCH. Leaving it alone is the era-correct outcome, not an oversight. (47485@75 / 47486@80 are above the cap.)
    - chain: Shield Slam
      rows: 23923@48 (req 23922), 23924@54, 23925@60, 25258@66, 30356@70
      disposition: gate
      why: 'Node 20362 grants a CLONE, so stock r1 23922 is never held and the ReqAbility1 chain is self-gating on its own.
        BUT the existing `kBaselineSpellGates` row force-grants stock 23922 at L40 to non-Vanilla eras (`grantHigherEra=true`)
        — which, once TBC owns trees, would hand a TBC warrior stock Shield Slam r1 for free AND unlock the whole stock trained
        chain. **This is the one real leak in the tree, and it is created by our own substrate rather than by Blizzard data.**
        Fix = the three-way split the plan''s Task 5 Step 1 already specifies: TBC takes the STRIP arm keyed on node 20362.'
    - chain: Devastate
      rows: 30016@60 (req 20243), 30022@70 (req 30016)
      disposition: none
      why: Node 20365 grants a clone; stock 30016's ReqAbility1 is stock 20243, which a TBC warrior never holds. Self-gating.
        **Do not add a DELETE** — see capstone_chains.devastate.trainer_sql.
    - chain: Bloodthirst
      rows: none
      disposition: none
      why: stock Bloodthirst has no trainer rows on this server at all.
    - chain: Rampage
      rows: none
      disposition: none
      why: stock Rampage has no trainer rows and no rank chain (WotLK's is a 1-rank passive).
    baseline_spells_the_tree_modifies:
      finding: All 25 are ordinary trainer-taught baseline abilities available to every warrior in both eras (Charge@4, Rend@4,
        Thunder Clap@6, Hamstring@8, Bloodrage@10, Shield Bash@12, Overpower@12, Demoralizing Shout@14, Revenge@14, Shield
        Block@16, Disarm@18, Cleave@20, Retaliation@20, Intimidating Shout@22, Execute@24, Shield Wall@28, Slam@30, Intercept@30,
        Berserker Rage@32, Whirlwind@36, Recklessness@50, Battle Shout@69-rank-8, Taunt/Sunder Armor/Heroic Strike at low
        levels). None is talent-gated in either era, so none is a leak.
      but: Several of them DIVERGE from TBC in ways an era character cannot be shielded from — see accepted_gaps.baseline_ability_divergences.
        That is a fidelity note, not a leak.
    reconcile_disposition_table_rows_needed:
    - 'Shield Slam: split EraTalents.cpp:404 three ways (Vanilla node 18552 / TBC node 20362 / WotLK auto-grant).'
    - 'Bloodthirst: three-way the kWarriorTrainedRanks strip and the stock-23881 strip (Vanilla clones 932829-831, TBC clone
      ranks, both strip stock).'
    - 'Last Stand: three-way the stock-12975 strip (both managed eras strip it; each keeps its own clone).'
    - 'Rampage / Devastate: new TBC-only trainer-taught clone chains ⇒ new `.eratalents doctor` range predicates (plan Task
      5 Step 3).'
  spec_bucket_contradictions:
    note: Findings that contradict the spec's §3 PROVISIONAL buckets. Per the plan's Task-3 exit gate these become spec **Amendment
      A**, and where the plan's later prose disagrees with them, Amendment A wins.
    rows:
    - spec_says: §3a lists Second Wind, Focused Rage, Precision, Weapon Mastery, Improved Whirlwind and Improved Berserker
        Stance as 'new-in-2.x candidates (author from scratch)'.
      finding: Only two of the six are meaningfully new work. **Second Wind must be GRANT-STOCK, not authored** — the core
        script switches on a hardcoded id list and a clone is silently inert. **Precision, Weapon Mastery and Focused Rage
        are LIVE_MATCH** ordinary authored passives (Focused Rage needs an explicit affectsMask, nothing more). Only **Improved
        Whirlwind** (TBC cooldown vs live damage) and **Improved Berserker Stance** (TBC attack-power% vs live Strength%)
        are real re-authors, and neither is "from scratch" — both are one-effect passives.
    - spec_says: §3b lists 'Shield Slam/Bloodthirst rank chains (TBC adds trained ranks in 61-70)' as retune candidates.
      finding: 'Correct but incomplete: **BOTH must clone, not retune**, and Bloodthirst''s decisive divergence is the 6 s
        vs 4 s CATEGORY cooldown, which the plan''s own Step-3 script does not compare. Also the TBC Bloodthirst ladder is
        SIX ranks (40/48/54/60/66/70), not the four the Vanilla dataset shipped, and Shield Slam''s is six (40/48/54/60/66/70).'
    - spec_says: §3b lists Flurry and Tactical Mastery as retune candidates whose 'Vanilla ref diagnoses seed this bucket'.
      finding: '**Both are LIVE_MATCH in TBC and need no clone at all.** The Vanilla ref''s Flurry buff/proc split and Tactical
        Mastery notes are 1.12.1-vs-3.3.5a findings that do NOT carry to TBC: TBC Flurry is +5/10/15/20/25% (identical to
        3.3.5a) where Vanilla was +10..30%, and TBC Tactical Mastery has the extra Defensive-Stance threat effects that Vanilla
        lacked. Reading the prior-era ref was still the right call (workflow lesson 12) — it just refuted the hypothesis instead
        of confirming it, which is the outcome the lesson is silent about.'
    - spec_says: '§3a ''Endless Rage (Arms capstone, 29623): survival vs 3.3.5a unknown until swept — do not assume either
        way.'''
      finding: LIVE_MATCH. `aura 213 MOD_RAGE_FROM_DAMAGE_DEALT +25`, identical on both sides. Plain authored passive.
    - spec_says: §4a frames the stance risk as 'stance-modifying talents may act on those hidden spells rather than the talent's
        own row'.
      finding: 'The talents do NOT act on the stance passives — Improved Berserker Stance and Improved Defensive Stance both
        carry ShapeshiftMask 0 and modify nothing stance-side. The real finding is the opposite shape: **the stance passives
        7376 and 7381 diverge on their own**, with no talent involved, and cannot be era-corrected from the talent side at
        all. Spec §4a''s mechanism is wrong; its instinct (chase the hidden stance spells) is what found the actual defect.'
    - spec_says: §4b predicts a spell_script_names census with surprises 'like the shaman census (17 rows, 8 unpredicted)'.
      finding: '19 rows, 3 unpredicted — but the census''s biggest lesson is a MISS, not a hit: **Devastate has no spell_script_names
        row at all**, because the core implements it inside Spell::EffectWeaponDamage keyed on a family flag. A census-only
        search concludes "Devastate is unscripted" and ships a clone that applies no Sunder Armor.'
    - spec_says: '§2 ''DUMMY markers: next free misc is 19; allocate only if a core-side or script-side discriminator is actually
        needed (none is currently foreseen)''.'
      finding: 'Still true — no NEW marker is needed. But node 20337 (Improved Berserker Rage) REUSES the existing **misc
        15** marker: the module script is gated on band-range + misc 15, not on era, so the TBC node mints the same marker
        at 5/10 rage and needs no C++ and no new misc value. Worth recording so nobody allocates misc 19 for it.'
    - spec_says: '§7 ''Accepted gaps: none yet.'''
      finding: Four are proposed — see `accepted_gaps:`. Three of them are baseline-spell divergences that no talent-side
        mechanism can reach; one is a Rampage fidelity delta.
  accepted_gaps:
    note: 'Proposed, not yet accepted — the plan''s Task-3 exit gate escalates these to the orchestrator. Each carries the evidence
      that would close it (workflow lesson 13: never "not knowable").'
    gaps:
    - id: 1
      title: Defensive / Berserker Stance passives carry WotLK values for every character
      detail: '7376 Defensive Stance Passive: TBC -10% damage done / +30% threat; live -5% / +45%. 7381 Berserker Stance Passive:
        TBC +10% damage taken; live +5%. Both are cast by CORE CODE with hardcoded ids (HandleAuraModShapeshift, SpellAuraEffects.cpp:
        1377-1384). Eras are per-character and spells are global, so the era-safety rule forbids editing them, and no talent-side
        data mechanism reaches them.'
      impact: A TBC-era warrior deals 5 pp more damage and holds 15 pp less relative threat in Defensive Stance, and takes 5
        pp less extra damage in Berserker Stance, than TBC did.
      what_would_close_it: 'A module-side compensating aura applied to era-managed characters on stance change (a `PlayerScript`/`UnitScript`
        hook on shapeshift, granting band-gated correction auras: -5% damage done / -15% threat in Defensive, +5% damage taken
        in Berserker), gated on `EraTalentBots::EraFor(p) == ERA_TBC` so Vanilla and WotLK characters are untouched. That is
        new module behaviour outside the talent pipeline and is a design decision for the user, not an authoring choice — hence
        escalated rather than silently absorbed.'
    - id: 2
      title: Battle Stance grants +10% armour penetration that TBC did not have
      detail: Live 2457 carries a second effect `aura 280 MOD_ARMOR_PENETRATION_PCT 10` absent from wago 2.5.4. Same class of
        problem as gap 1 and the same reason it cannot be fixed from the talent side.
      what_would_close_it: the same module-side stance hook.
    - id: 3
      title: Sunder Armor is WotLK's for both eras, so TBC Devastate stacks the WotLK debuff
      detail: TBC Sunder Armor 7386 applies `aura 22 MOD_RESISTANCE -90 misc1` directly over 30 s; live 7386 is `SPELL_EFFECT_TRIGGER_SPELL
        -> 58567` (LIVE_ONLY). Sunder Armor is a BASELINE ability every warrior of every era trains, so it cannot be era-forked,
        and the core's Devastate branch casts 58567 unconditionally.
      impact: cosmetic-to-small — the Devastate clone's "causes the Sunder Armor effect" resolves to the WotLK Sunder, and the
        era Improved Sunder Armor spellmod modifies the WotLK one.
      what_would_close_it: an era Sunder Armor clone chain (a large piece of work with its own baseline gate), or acceptance.
        Recommend acceptance.
    - id: 4
      title: Rampage's crit window is not consumed on use
      detail: see capstone_chains.rampage.known_fidelity_deltas.
      what_would_close_it: a module SpellScript that removes the ready aura in AfterCast (a few lines in EraTalentProcScripts.cpp,
        same shape as era_improved_berserker_rage's AfterCast).
    - id: 5
      status: '**CLOSED at Task 7 (Fury authoring), 2026-09-03.** The generator gained the one-line `("dispelType", "DispelType")`
        entry in `_HELPER_SCALARS` (TDD guard `test_helper_dispel_type_column`, verified byte-neutral by regenerating five shipped
        datasets and diffing against their committed SQL — all five byte-identical), and helper 947548 now authors `dispelType:
        0`. The era Death Wish is no longer removable by an Enrage dispel, which is what wago 2.5.4''s record says. The same
        key immediately paid for itself a second time on the Enrage buff clones 947556-947560, whose live templates carry the
        same WotLK DispelType 9.'
      title: The Death Wish clone keeps live 12292's `DispelType 9` (DISPEL_ENRAGE)
      detail: 'BOTH RAW VALUES — wago 2.5.4 12292: DispelType 0, Mechanic 0. Live 12292: DispelType 9 (DISPEL_ENRAGE), Mechanic
        31 (MECHANIC_ENRAGED). WotLK made Death Wish an Enrage effect; TBC''s is neither. Helper 947548 authors `mechanic: 0`
        (the `mechanic` key exists), but the generator''s `_HELPER_SCALARS` has NO `dispelType` key, so a templated clone inherits
        DispelType 9.'
      impact: 'An era TBC warrior''s Death Wish can still be removed by an Enrage DISPEL (e.g. a hunter''s Tranquilizing Shot),
        which TBC''s own record does not allow. It is NOT removable by the mechanic-keyed paths (`RemoveAurasWithMechanic(MECHANIC_ENRAGED)`),
        because `mechanic: 0` is authored — so this is strictly closer to TBC than granting stock would be, not a half-state
        that is worse than either.'
      what_would_close_it: 'One line in `tools/gen_era_talents.py::_HELPER_SCALARS` — `("dispelType", "DispelType")` — plus
        `dispelType: 0` on helper 947548 and a TDD guard test. Byte-neutral for every shipped helper (unlisted keys default
        to the template''s value), exactly the shape spec Amendment A.10 item 1 approved for `casterAuraSpell`. Deliberately
        NOT done inside Task 6: a generator change is Task-1/Task-7 scope and this is a single dispel-category field on one
        buff.'
    - id: 6
      title: Blood Frenzy's debuffs are the STOCK 30069/30070, which lost TBC's `Mechanic 15` (BLEED)
      detail: 'BOTH RAW VALUES — wago 2.5.4 30069/30070: spell-level `Mechanic 15` (MECHANIC_BLEED), AttributesEx2 0x0. Live
        30069/30070: `Mechanic 0`, AttributesEx2 0x4 (IGNORE_LINE_OF_SIGHT). Everything else (aura 87 MOD_DAMAGE_PERCENT_TAKEN
        +2/+4 misc 1, permanent, tgt 6) is identical, which is why node 20318 triggers the stock ids instead of minting two
        more clones.'
      impact: 'Cosmetic-to-nil on this core: the debuff is a passive damage-taken modifier, so its MECHANIC only matters for
        mechanic-keyed immunity/dispel/diminishing-returns lookups, and nothing in the warrior tree or the TBC content keys
        on MECHANIC_BLEED for a non-periodic aura. The +damage- taken magnitude, duration and target are era-exact.'
      what_would_close_it: two fresh band clones carrying the `mechanic` helper key at 15 (two more helper ids from 947553+),
        with node 20318's `trigger:` re-pointed at them.
    - id: 7
      title: TBC Mace Specialization's PER-RANK proc chance is not in any table of record
      detail: wago 2.5.4 SpellAuraOptions gives `ProcChance 100` on ALL FIVE ranks (12284/12701/12702/12703/ 12704) — the per-rank
        chance lived server-side in 2.4.3, exactly as it did in 1.12.1. The cached Wowhead TBC tooltips read "a chance ... More
        effective than Mace Specialization (Rank N)" with no number. `acore_world.spell_proc` has NO row for the chain (verified
        query at Task 6), because the live 3.3.5a talent was reworked into a flat armour-penetration passive.
      shipped_value: 1 / 2 / 3 / 4 / 6 % — the ladder the SHIPPED, real-client-verified Vanilla dataset uses (era-data/vanilla/warrior.yaml
        node 18514, from the Daribon 1.12 skeleton), on the ground that 2.0 changed this talent only by ADDING the 7-rage component
        to the existing stun.
      what_would_settle_it: 'a 2.4.3-era combat log or a 2.4.3 private-server `spell_proc`/DBC dump giving the five chances.
        NOTE that wowsims/tbc does NOT settle it: `sim/warrior/talents.go` models the talent as a flat `NewPPMManager(1.5, maceSpecMask)`
        that does not scale with rank and implements only the rage half (sims do not model stuns on bosses), so it is a rank-agnostic
        simplification, not a table.'
    - id: 8
      title: TBC Unbridled Wrath's PER-RANK proc chance is not in any table of record either
      detail: 'Structurally identical to gap 7, found on a different talent. BOTH SIDES'' RAW VALUES: wago 2.5.4 SpellAuraOptions
        gives `ProcChance 100` on ALL FIVE ranks (12322/12999/13000/13001/ 13002), i.e. the real rate lived server-side in 2.4.3
        exactly as it did in 1.12.1; the cached Wowhead TBC tooltips read "a chance ... Effect occurs more often than Unbridled
        Wrath (Rank N)" with no number. The LIVE 3.3.5a server''s own `spell_proc` rows for the chain are `ProcsPerMinute 3
        / 6 / 9 / 12 / 15, Chance 0` (queried 2026-09-03) — a weapon-speed-scaled rate, which is patch 3.0.2''s conversion of
        this talent and therefore post-TBC by definition. The talent''s DBC rows themselves are LIVE_MATCH, so the sweep could
        not see this at all.'
      shipped_value: '**8 / 16 / 24 / 32 / 40 %** flat — the ladder the SHIPPED, real-client-verified Vanilla dataset uses (era-data/vanilla/warrior.yaml
        node 18522), on the ground that it is the last flat-percentage table of record and 2.0 made no documented change to
        this talent. Authored as a flat `chance:` list rather than a `ppm:` rate, so a TBC warrior gets a per-hit percentage
        like TBC''s rather than WotLK''s weapon-speed model.'
      what_would_settle_it: a 2.4.3-era combat log, or a 2.4.3 private-server `spell_proc`/DBC dump giving the five chances.
        wowsims/tbc does not settle it for the same reason it does not settle gap 7 — the Classic-TBC sim models the talent
        with a PPM manager, which is the 3.0.2 shape, not 2.4.3's.
      what_would_close_it: 'replacing `chance: [8,16,24,32,40]` on node 20326 with `ppm:` + `chance: 0` if evidence turns up
        that 2.4.3 was already PPM-rated. One line either way; the generator supports both.'
  open_questions:
    note: Each names the evidence that settles it. None is "not knowable".
    poleaxe_specialization_e2:
      question: survival_map[12700-12785] is LIVE_MATCH_UNVERIFIED_SLOT — live carries an `e2 aura 163 MOD_CRIT_DAMAGE_BONUS
        +1..5` for which wago 2.5.4 has NO SpellEffect row, so TBC's value for that slot is not in DB2. node_buckets said "Author
        e1 from wago; decide e2 explicitly".
      decision: '**Author e1 ONLY** (a single-effect `mechanic: stat` node, aura 52 MOD_WEAPON_CRIT_PERCENT +1..5% gated to
        `equipSubclass: 67`). The crit-DAMAGE half is a WotLK addition.'
      evidence: The cached Wowhead TBC tooltip for 12700 (era-data/_ref/tbc/tooltips/12700.json) reads "Increases your chance
        to get a critical strike with Axes and Polearms by 1%." and nothing else — no crit-damage line — on every rank. A DB2
        row's ABSENCE is not evidence of a zero (noise_filters_applied), but the rendered TBC tooltip IS evidence of what the
        talent did, and it names one effect. Shipping the live e2 would make the in-client tooltip a lie in the other direction
        (lesson 17d).
      what_would_reopen_it: a 2.4.3 client Spell.dbc dump showing a non-zero Effect_2 on 12700.
    sword_specialization_icd:
      question: node_buckets[20314] notes "Live also carries a 6 s spell_proc cooldown on -12281 — author the TBC chance and
        decide the cooldown explicitly." Ship an internal cooldown on the era proc row?
      decision: '**No ICD.** The generated spell_proc row for node 20314 carries `Cooldown 0`.'
      evidence: 'THREE raw values. (1) `acore_world.spell_proc` for -12281: `Cooldown 6000` — the WotLK 3.0.8 anti-chain nerf,
        which post-dates TBC. (2) wago 2.5.4 has no cooldown field for a proc of this shape at all; the TBC record carries only
        `ProcChance 1/2/3/4/5` (which IS shipped, and which wowsims/tbc corroborates verbatim: `procChance := 0.01 * float64(warrior.Talents.SwordSpecialization)`).
        (3) wowsims/tbc DOES carry `icd := core.Cooldown{Duration: time.Millisecond * 500}` — but that is a SIM recursion guard:
        wowsims issues its extra swing inline from inside the proc handler. AzerothCore cannot recurse that way — `Unit::AddExtraAttacks`
        only QUEUES into `extraAttacksTargets` (Unit.cpp:2930) and the queue is drained once per `Unit::Update` (Unit.cpp:563-579)
        via `AttackerStateUpdate(victim, BASE_ATTACK, /*extra=*/true)`, whose `extra` flag clears `_lastExtraAttackSpell` and
        stops the extra swing re-arming the queue. So no ICD is needed for safety and none is authored for fidelity. NB the
        payload stays STOCK 16459 — the core hardcodes `SPELL_SWORD_SPECIALIZATION = 16459` in the drain path (Unit.h:298),
        so a clone would lose the melee-range exemption at Unit.cpp:571.'
      matches_precedent: the shipped, real-client-verified Vanilla node 18515 also authors no cooldown.
    sweeping_strikes_duration:
      status: '**DECIDED at Task 7 (Fury authoring), 2026-09-03: TBC''s data verbatim — DurationIndex 1 (10 000 ms) + ProcCharges
        10**, i.e. the `recommendation:` below, taken. The tiebreaker that settled it is one the entry did not have: the CACHED
        WOWHEAD TBC TOOLTIP for 12328 (era-data/_ref/tbc/tooltips/12328.json) renders the buff line as "10 second(s remaining)"
        alongside "Your next 10 melee attacks", so the rendered 2.4.3 client agrees with wago on BOTH fields and wowsims'' `NeverExpires`
        is alone in disagreeing. The 10 s window on a 30 s cooldown remains a visible nerf versus the live spell and is a named
        real-client checklist item; the revert is one `durationIndex:` line on helper 947549. SEPARATELY AND NOT PART OF THIS
        QUESTION: the clone must author `attributes: 327696` because `SpellInfoCorrections.cpp:1161` ORs SPELL_ATTR0_NOT_SHAPESHIFTED
        onto STOCK 12328 by id at load ("Sweeping Strikes stance change") and a clone never receives an id-pinned fix. era_audit
        .check_spellfix_inheritance caught it; it is the only spellfix in the Fury id set, and it is load-bearing on a Battle|Berserker-gated
        buff that a Fury warrior stance-dances through.'
      question: Should the Sweeping Strikes clone carry TBC's DurationIndex 1 (10 000 ms) or live's 9 (30 000 ms)?
      both_raw_values: 'wago 2.5.4 SpellMisc for 12328: DurationIndex 1 -> SpellDuration.Duration 10000. Live Spell.dbc 12328:
        DurationIndex 9 -> 30000. ProcCharges: TBC 10, live 5. The CHARGE count is unambiguous (TBC 10, and the Wowhead TBC
        tooltip says "Your next 10 melee attacks").'
      conflict: 'wowsims/tbc sim/warrior/sweeping_strikes.go registers the aura with `Duration: core.NeverExpires, MaxStacks:
        10` — i.e. the sim models TBC Sweeping Strikes as charge-limited with NO timer, which agrees with neither DBC value.'
      recommendation: Author TBC's data verbatim (10 charges, DurationIndex 1 = 10 s) per the fidelity bar's precedence rule
        (wago is the number of record; wowsims is the tiebreaker only for what the tables cannot express, and here they do express
        it). Flagged because a 10-second window on a 30-second cooldown is a visible nerf versus the live spell and the user
        may prefer live's 30 s.
      what_would_settle_it: a 2.4.3-era combat log or a private-server DBC dump showing the aura's real lifetime; failing that,
        an explicit user decision.
    one_handed_spec_attr5:
      question: Should the One-Handed Weapon Specialization passive (node 20360) reproduce TBC's ABSENT SPELL_ATTR5_AURA_AFFECTS_NOT_JUST_REQ_EQUIPPED_ITEM
        bit, or live's SET bit?
      both_raw_values: wago SpellMisc 16538-16542 Attributes_5 = 0x0; live AttributesEx5 = 0x10000.
      what_the_bit_does: Unit.cpp:8468 — without it, a MOD_DAMAGE_PERCENT_DONE aura whose own EquippedItemClass != -1 is excluded
        from modifying spells with EquippedItemClass == -1; and Unit.cpp:8481/:10265 — without it, the aura applies only when
        the player holds an item fitting the aura's requirement.
      conflict: wowsims/tbc applies the talent as a blanket `PseudoStats.PhysicalDamageDealtMultiplier *= 1+0.02*rank` whenever
        the main hand is not two-handed — behaviourally what the bit-SET path produces.
      default_if_unresolved: Generated auto-passives do not carry AttributesEx5, so authoring the node normally reproduces TBC's
        record for free. That is the recommendation; the note exists so the choice is deliberate.
      what_would_settle_it: an in-client measurement on the dev box (Mortal Strike tooltip damage with 5/5 One-Handed Weapon
        Specialization and a 1H equipped, with and without the bit authored).
    devastate_sunder_identity_bit:
      question: Should the Devastate clone carry TBC's own-mask word 0 bit 14 (0x4000, Sunder Armor's bit)?
      trade_off: Carrying it reproduces TBC's encoding exactly and makes every Sunder-Armor spellmod also hit Devastate. Not
        carrying it (word 1 bit 6 only, which the core branch requires anyway) keeps the two spells independent and satisfies
        the Improved Sunder Armor tooltip by binding both bits on node 20353's spellmod instead.
      recommendation: word 1 bit 6 only; bind node 20353 to both. Recorded because TBC's data says otherwise and a later reviewer
        will notice.
    generator_casterAuraSpell_key:
      question: Add `("casterAuraSpell", "CasterAuraSpell")` to `_HELPER_SCALARS`?
      why: It is what makes the Rampage crit gate pure data instead of new C++.
      risk: nil — unlisted keys default to 0 / the template's value, so the addition is byte-neutral for every shipped helper,
        exactly like `procChance`/`procTypeMask`/`stackAmount` were.
      owner: orchestrator decision; the work belongs in Task 1 (generator) or Task 7 (Rampage).
