    id_set_construction: "Seed = all 199 distinct rank spells across the 66 skeleton nodes, plus the three stance auras 2457\
      \ / 71 / 2458 (spec §4a). Closure = TRANSITIVE over EffectTriggerSpell on BOTH sides (wago and the live DBC), re-run\
      \ after every extension until it added nothing. Extensions made during the task, each of which the closure alone would\
      \ have missed:\n  * the granted-active TRAINED RANK chains (Mortal Strike, Bloodthirst incl. its per-rank heal\n   \
      \ buffs, Shield Slam, Devastate, Rampage) — trained ranks are same-name siblings, not trigger\n    targets, so no closure\
      \ reaches them;\n  * the 25 baseline spells the tree's spellmods target (Heroic Strike, Rend, Charge, Thunder Clap,\n\
      \    Overpower, Whirlwind, Cleave, Execute, Slam, Berserker Rage, Hamstring, Intercept, Bloodrage,\n    Sunder Armor,\
      \ Disarm, Taunt, Shield Wall, Shield Bash, Shield Block, Revenge, Demoralizing\n    Shout, Battle Shout, Intimidating\
      \ Shout, Recklessness, Retaliation) — informational, since a\n    stock base spell can never be era-corrected, but three\
      \ of them turn out to matter (see\n    `baseline_leaks:` and `accepted_gaps:`);\n  * **the three core-hardcast STANCE\
      \ PASSIVES 21156 / 7376 / 7381** — `HandleAuraModShapeshift`\n    (SpellAuraEffects.cpp:1377-1384) casts one per stance\
      \ and NO talent row or DB2 trigger\n    references them. Two of the three DIVERGE. This is the warrior analog of the\
      \ druid form\n    auras (workflow lesson 2) and the single most important id-set extension of the task;\n  * Second\
      \ Wind's heal payloads 29841 / 29842 — reached only through the core script's hardcoded\n    switch (spell_warrior.cpp:1032-1040),\
      \ not through any data trigger;\n  * the Deep Wounds intermediate chain 12162 / 12850 / 12868 and the Sword-Spec extra-attack\n\
      \    payload 16459, for the same reason.\nThe sweep is closed: re-running the transitive walk over the final 308-id\
      \ set adds nothing."
