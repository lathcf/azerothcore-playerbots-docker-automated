  attribute_divergences:
    method: All eight attribute words compared verbatim on every id. Each differing BIT is decoded against azerothcore-wotlk/src/server/shared/SharedDefines.h
      and adjudicated below — a diff is a FLAG to hand-adjudicate, never an automatic clone trigger. 40 distinct (word, bit,
      direction) findings across the id set; the recurring ones are grouped.
    wotlk_engine_bits_not_era_content:
      verdict: NOT era divergences. Do NOT author TBC's zero — these bits describe 3.3.5a engine features that did not exist
        in 2.4.3, and clearing them on a clone would change how THIS core treats the spell.
      findings:
      - word: 6
        bit: SPELL_ATTR6_TAPS_IMMEDIATELY (0x800000)
        direction: TBC0->LIVE1
        count: 12
        ids:
        - 72
        - 100
        - 355
        - 676
        - 772
        - 1160
        - 1715
        - 5246
        - 7386
        - 7922
        - 12323
        - 20252
      - word: 6
        bit: SPELL_ATTR6_ALLOW_WHILE_RIDING_VEHICLE (0x1000)
        direction: TBC0->LIVE1
        count: 3
        ids:
        - 71
        - 2457
        - 2458
        note: vehicles are a WotLK feature
      - word: 6
        bit: SPELL_ATTR6_VEHICLE_IMMUNITY_CATEGORY (0x4000000)
        direction: TBC0->LIVE1
        count: 1
        ids:
        - 2048
      - word: 7
        bit: SPELL_ATTR7_DO_NOT_COUNT_FOR_PVP_SCOREBOARD (0x10000000)
        direction: TBC0->LIVE1
        count: 2
        ids:
        - 2048
        - 29801
      - word: 2
        bit: SPELL_ATTR2_INCLUDE_IN_ADVANCED_COMBAT_LOG (0x100)
        direction: TBC1->LIVE0
        count: 4
        ids:
        - 71
        - 2048
        - 2457
        - 2458
        note: AzerothCore annotates this bit 'not set in 3.3.5a' — inert on this core either way
    wotlk_qol_bits_low_risk:
      verdict: Real behaviour, but WotLK quality-of-life applied to spells our era clones do not own (triggered debuffs).
        Recorded so nobody re-discovers them; no authoring action.
      findings:
      - word: 2
        bit: SPELL_ATTR2_IGNORE_LINE_OF_SIGHT (0x4)
        direction: TBC0->LIVE1
        count: 7
        ids:
        - 12723
        - 12798
        - 18498
        - 23694
        - 29703
        - 30069
        - 30070
      - word: 3
        bit: SPELL_ATTR3_DO_NOT_DISPLAY_RANGE (0x40000000)
        direction: TBC0->LIVE1
        count: 2
        ids:
        - 12723
        - 18498
    actionable:
    - id:
      - 16538
      - 16539
      - 16540
      - 16541
      - 16542
      word: 5
      bit: SPELL_ATTR5_AURA_AFFECTS_NOT_JUST_REQ_EQUIPPED_ITEM (0x10000)
      direction: TBC0->LIVE1
      meaning: Unit.cpp:8468-8482 and :10265 — without this bit, a MOD_DAMAGE_PERCENT_DONE aura whose own `EquippedItemClass
        != -1` is EXCLUDED from modifying spells whose `EquippedItemClass == -1` (and, in the second branch, is only applied
        when the player actually has an item fitting the aura's requirement). WotLK set the bit on One-Handed Weapon Specialization;
        TBC did not.
      disposition: Generated auto-passives do NOT carry the bit, so authoring the node normally reproduces the TBC record
        for free. Flagged in open_questions.one_handed_spec_attr5 because wowsims/tbc models the talent as a BLANKET PhysicalDamageDealtMultiplier,
        which is what the bit-SET behaviour looks like — the two sources of record disagree and the disagreement is recorded
        with both raw values rather than silently resolved.
    - id:
      - 12834
      - 12849
      - 12867
      word: 3
      bit: SPELL_ATTR3_NO_PROC_EQUIP_REQUIREMENT (0x2)
      direction: TBC0->LIVE1
      meaning: SpellAuras.cpp:2227 — with the bit, a passive proc skips the "equipment fits the aura's requirement" gate.
        Live Deep Wounds has it; TBC does not.
      disposition: 'Moot for the shipped design: the era Deep Wounds passive is a generated DUMMY marker with `EquippedItemClass
        -1`, so the gate at :2225 (`EquippedItemClass != -1`) never runs.'
    - id:
      - 12867
      - 12311
      - 12958
      - 1719
      word: 3
      bit: SPELL_ATTR3_CAN_PROC_FROM_PROCS (0x4000000)
      direction: TBC0->LIVE1
      disposition: Live-only. Each of these ids is either an authored-passive number source (12311/12958/12867) or a stock
        baseline spell we do not own (1719). No action; recorded so a future clone author does not inherit it by accident
        from a template.
    - id:
      - 29801
      word: 0
      bits:
      - SPELL_ATTR0_PASSIVE (0x40) TBC0->LIVE1
      - SPELL_ATTR0_NOT_SHAPESHIFTED TBC1->LIVE0
      - SPELL_ATTR0_DO_NOT_SHEATH TBC1->LIVE0
      disposition: 'Corroborates capstone_chains.rampage: WotLK''s Rampage is a PASSIVE talent, TBC''s is an activated ability.
        The attribute words alone prove the two spells are unrelated mechanics.'
    tbc_only_procflag_bit31:
      finding: ProcTypeMask bit 31 (0x80000000) is set in TBC and clear live on 5246 Intimidating Shout (TBC 0x800A2268 vs
        live 0x000A2268) and 29838 Second Wind (TBC 0x800AAA68 vs live 0x000AAA68) — identical low 31 bits, one extra top
        bit. AzerothCore's highest defined ProcFlag is bit 24 (PROC_FLAG_DEATH, SpellMgr.h:146), so bit 31 has no meaning
        on this core.
      verdict: TBC-side encoding bit, NOT a divergence. Both ids stay grant-stock.
  effect_class_mask_diffs:
    why_not_in_the_verdict: 'The shaman phase excluded per-effect class masks as cross-build encoding noise (2.4.3 used two
      32-bit words, DB2 four, with different assignments). That holds for MOST of the 67 differences here — the dominant pattern
      is WotLK duplicating word A into words B and C (e.g. Improved Slam TBC (0x200000,0,0) -> live (0x200000,0x200000,0)),
      which changes nothing because SpellInfo:: IsAffected ANDs across the words that are actually populated on the target.'
    why_it_is_recorded_anyway: It is NOT pure noise for warrior. Four entries carry real content, and one of them (Blood Frenzy)
      was invisible to every other family in the sweep. A future class phase should run this pass too.
    load_bearing:
    - ids:
      - 29836
      - 29859
      name: Blood Frenzy
      diff: TBC (0x20, 0x10, 0) -> LIVE (0x20, 0, 0)
      meaning: word 0 bit 5 = Rend's identity; word 1 bit 4 = Deep Wounds' identity (live 12721's OWN mask is word 1 = 0x10
        on both sides, so the words align here and the difference is real). TBC Blood Frenzy is triggered by Rend AND Deep
        Wounds; the live spell is triggered by Rend only.
      action: authored Blood Frenzy must bind both — see node_buckets.authored_plus_helper[20308].
    - ids:
      - 12308
      - 12810
      - 12811
      name: Improved Sunder Armor
      diff: TBC (0x4000, 0x40, 0) -> LIVE (0x4000, 0, 0)
      meaning: word 0 bit 14 = Sunder Armor; word 1 bit 6 = Devastate's LIVE identity bit. The TBC tooltip says "Sunder Armor
        and Devastate" and the mask agrees.
      action: bind the authored spellmod to Sunder Armor AND the era Devastate clone.
    - ids:
      - 29787
      - 29790
      - 29792
      name: Focused Rage
      diff: TBC (0x6e6e4eee, 0x664, 0) -> LIVE (0x6e6e4eee, 0, 0)
      meaning: TBC's word 1 enumerates Bloodthirst (0x400), Shield Slam (0x200), Devastate (0x40), Piercing Howl (0x20) and
        Whirlwind (0x4); live drops the whole word.
      action: author the TBC mask explicitly (`affectsMask`), including the era clone ids that replace Bloodthirst / Shield
        Slam / Devastate for a TBC warrior.
    - ids:
      - 29721
      - 29776
      name: Improved Whirlwind
      diff: TBC (0, 0x4, 0) -> LIVE (0, 0, 0)
      meaning: word 1 bit 2 = Whirlwind's identity (live 1680's own mask is word 1 = 0x4). Live Improved Whirlwind carries
        NO mask at all because WotLK made it a flat damage talent.
      action: bind the authored cooldown spellmod to Whirlwind explicitly.
    everything_else: '63 further differences, all of the "word A duplicated into B/C" or "TBC overflow word 1 with a different
      bit assignment" kind. Full dump preserved at /tmp/claude-1000/tbc-warrior/ effmask-diffs.txt; regenerate with the supplementary
