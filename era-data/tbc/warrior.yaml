      why_correction_2026_09_02: 'This entry PREVIOUSLY read "Live 12292 dropped e2 and e3 entirely and moved the fear immunity
        to the spell-level Mechanic 31 + DispelType 9. Granting stock gives a TBC warrior a Death Wish with no +5% damage taken
        (a straight buff over the era version)." **Both halves were wrong** and are retracted here (workflow lesson 15 — a wrong
