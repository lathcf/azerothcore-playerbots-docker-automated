# _ref capstone_chains.devastate — "the largest single divergence in the tree after Rampage", and the
# phase's most dangerous node because the mechanism that makes it work is NOT in spell_script_names.
# BOTH SIDES' RAW VALUES (wago 2.5.4 vs live DBC dump 2026-09-03):
#   damage        TBC `e1 WEAPON_PERCENT_DAMAGE 50` + `e2 NORMALIZED_WEAPON_DMG 15/25/35` (per Sunder
#                 application). LIVE `e2 WEAPON_PERCENT_DAMAGE 120` + `e3 NORMALIZED_WEAPON_DMG
#                 58/96/134`.
#   weapon gate   TBC EquippedItemClass **2** / subclass **0xa091** = 41105 (one-handed axe|mace|
#                 sword|fist|dagger — the cached Wowhead TBC tooltip prints "Requires One-Handed
#                 Melee Weapon"). LIVE class **4** / subclass **0x40** = a SHIELD. Granting stock
#                 would silently impose WotLK's shield requirement on a TBC warrior.
#   identity      TBC own-mask word 0 = 0x4000 (Sunder Armor's bit, shared) PLUS word 1 bit 6; live
#                 word 0 = 0 with the identity in word 1 bit 6 only.
#
# THREE AUTHORING CONSTRAINTS, all from the core rather than from any data table. The core implements
# Devastate INSIDE `Spell::EffectWeaponDamage` (SpellEffects.cpp:3418-3434), keyed on a family flag —
# there is NO `spell_script_names` row, so a census-only search concludes "Devastate is unscripted"
# and ships a clone that applies no Sunder at all:
#   (1) `family: 4` + `SpellClassMask_2 = 0x40` are MANDATORY — the branch tests
#       `SpellFamilyFlags[1] & 0x40`. Inherited from the template (live 20243 already carries both),
#       so they are not re-authored, but they are the reason the template is 20243 and not something
#       else.
#   (2) The per-Sunder bonus MUST sit in **DBC effect slot 3**: the branch reads
#       `CalculateSpellDamage(2, unitTarget)` = EFFECT_2 in the 0-based core enum = slot 3. TBC stores
#       it in slot 2. Copying TBC's slot layout literally would put the value where the core never
#       looks, and Devastate would deal a flat 15 with no per-Sunder scaling at all. Authored here as
#       e1 = WEAPON_PERCENT_DAMAGE 50 (TBC's own slot for that half), e2 = EMPTY, e3 =
#       NORMALIZED_WEAPON_DMG. `EffectWeaponDmg` runs only for the LAST weapon-damage effect and then
#       aggregates every weapon effect in one pass (SpellEffects.cpp:3382-3395), so the empty middle
#       slot costs nothing and the total is `15 + (stacks-1)*15` = 15 per Sunder application, exactly
#       as the tooltip says.
#   (3) TBC's word-0 0x4000 (Sunder Armor's own identity bit) is DELIBERATELY NOT authored — spec
#       Amendment A.10.4 / _ref open_questions.devastate_sunder_identity_bit. Carrying it would make
#       EVERY Sunder-Armor-targeting spellmod also hit Devastate. The tooltip requirement ("reduces
#       the cost of your Sunder Armor and Devastate abilities") is satisfied instead by node 20353
#       binding BOTH bits explicitly, which is controlled masking rather than blanket identity. The
#       template gives SpellClassMask_1 = 0, so nothing is authored here; recorded because TBC's own
#       data says otherwise and a later reviewer will notice.
# ACCEPTED GAP (_ref accepted_gaps id 3): the core branch casts **58567**, WotLK's Sunder Armor debuff.
# TBC's own Sunder Armor 7386 applies `aura 22 MOD_RESISTANCE -90` directly and 58567 does not exist
# in TBC — but Sunder Armor is a BASELINE ability every warrior of every era trains, so it cannot be
# era-forked. The era Devastate therefore stacks and reads the WotLK Sunder. Cosmetic-to-small, and
# the tooltip ("causing the Sunder Armor effect") stays true.
# NO spellFixAck: SpellInfoCorrections.cpp contains no by-id fix for 20243/30016/30022 (grep-verified).
