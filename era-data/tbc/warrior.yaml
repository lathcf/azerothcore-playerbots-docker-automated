        have shipped TBC''s 20/40/60% through the VANILLA 1000 ms / 12-tick carrier, i.e. exactly the cadence divergence the
        fresh helper exists to fix, AND through a family-LESS bleed that Blood Frenzy cannot bind. Task 6 therefore made a small,
        ownership-gated C++ change: the script picks 947551 when the PROCCING PASSIVE is one of the TBC node''s own auto-passives
        (938464/938465/938466 = custom_passive_id(20308, 1..3)) and 932800 otherwise. Ownership of the proccing aura, never
        an "is a bot" test and never a live era lookup.'
      blood_frenzy_interaction: 'LOAD-BEARING and new in TBC (Vanilla warrior had no Blood Frenzy). TBC Blood Frenzy 29836''s
        aura-109 EffectSpellClassMask is `(0x20, 0x10, 0)` = Rend''s word-0 bit 5 PLUS Deep Wounds'' word-1 bit 4; live 29836''s
        is `(0x20, 0, 0)` — WotLK dropped the Deep Wounds bit. So the TBC era bleed helper must be reachable by the authored
        Blood Frenzy mask. Two routes: give the helper `family: 4` + `maskB: 0x10` (stock 12721''s own identity, so the same
        mask value works) and bind Blood Frenzy with an explicit `affectsMask: {a: 0x20, b: 0x10}`; or bind Blood Frenzy by
        explicit `affects:` on Rend + the helper. NOTE the Vanilla bleed 932800 was deliberately made FAMILY-LESS "so no warrior
        spellmod touches it" — the TBC helper must NOT copy that choice, or Blood Frenzy silently misses half its trigger set.'
