  method:
    conventions:
      effect_slot_numbering: 'THIS FILE NUMBERS EFFECT SLOTS 1-BASED: e1/e2/e3 are DBC columns Effect_1/Effect_2/Effect_3,
        i.e. array indices 0/1/2. The AzerothCore SOURCE uses the 0-based enum, where EFFECT_0 is DBC slot 1. Wherever a core-source
        token appears (script_census, and the Devastate/Concussion Blow entries whose core handlers read a specific index)
        it is written `EFFECT_n (0-based core enum; = this map''s e<n+1>)`. Never translate one to the other by name.'
      magnitudes_are_effective: EVERY magnitude in this file is the EFFECTIVE value — `basePoints + 1` when `EffectDieSides
        == 1` and `basePoints` when DieSides is 0 (SpellEffectInfo::CalcBaseValue). Both sides of every comparison are normalised
        the same way before diffing, so a clone or live row that moved the +1 into DieSides does not read as a divergence.
        Raw base-points figures, where quoted, say "raw".
      rage_is_manacost: 'Warrior rage costs ride the `ManaCost` column (wago SpellPower.ManaCost), stored x10: TBC Bloodthirst
        `powerCost=300` is 30 rage. Rage GRANTED by an ENERGIZE effect is likewise x10: TBC Shield Specialization''s trigger
        23602 has `val10` = 1 rage. Every `powerCost=` in a `tbc:` line below carries the decoded rage figure in parentheses.'
      verdict_vocabulary: LIVE_MATCH = every compared field agrees. DIVERGED = at least one compared field differs. WAGO_ONLY
        = present in TBC, ABSENT from the live 3.3.5a store (Spell.dbc + the acore_world.spell_dbc overlay) — must be authored,
        never granted. LIVE_ONLY = present live, absent from TBC — must not be reachable by a TBC warrior. LIVE_MATCH_UNVERIFIED_SLOT
        = everything comparable agrees BUT at least one live slot has no wago counterpart row at all; it is a distinct token
        precisely so a consumer matching `LIVE_MATCH` exactly does not silently accept it. Any entry carrying `unverified_slots:`
        must be read before it is trusted.
      tbc_line_is_authoritative: Every survival_map entry carries a `tbc:` line = the COMPLETE wago 2.5.4 record an author
        needs to reproduce the spell (per-effect tuple incl. effect class masks and implicit targets, plus duration/proc/power/cooldown/category/mechanic/preventionType/casterAuraState/shapeshift/equip/
        spellLevel/family/ownMask and every non-zero attribute word). Tasks 6-8 author FROM THIS LINE; they do not need to
        re-fetch wago. Where a field is absent from the line, it is zero in TBC.
    live_dbc:
      source: /azerothcore/env/dist/data/dbc/Spell.dbc inside the running ac-worldserver
      md5: 49c9c5f53e8974c27d67635384725f46
      live_verified: '`docker exec ac-worldserver md5sum` and the repo''s `azerothcore-wotlk/ip-dbc/Spell.dbc` return the
        IDENTICAL md5 (49c9c5f53e8974c27d67635384725f46, 53466210 bytes) — no client/server generation mismatch, so the sweep''s
        live side is the store the worldserver actually runs. NOTE the plan''s Step-2 `docker cp` fails on this image ("read-only
        file system"); the working extraction is `docker exec ac-worldserver cat <path> > out`.'
    db_overlay: 'The DBC on disk is not the whole live store: acore_world.spell_dbc (6983 rows) REPLACES records at load.
      Exactly ONE id in this map is covered — 18350 "Dummy Trigger" (SPELL_EFFECT_DUMMY, no aura), which is absent from BOTH
      the 3.3.5a DBC and wago 2.5.4 but present in the DB, i.e. the SERVER has it. It matters here because TBC Rampage 29801
      e1 triggers it (see capstone_chains.rampage).'
    tbc_source: 'wago 2.5.4.44833 — SpellEffect, SpellMisc, SpellAuraOptions, SpellPower, SpellClassOptions, SpellCategories,
      SpellCooldowns, SpellAuraRestrictions, SpellShapeshift, SpellLevels, SpellEquippedItems, SpellInterrupts, SpellTargetRestrictions,
      SpellName, Spell, SpellDuration, SpellRange, SpellCastTimes. Tooltips cached under era-data/_ref/tbc/tooltips/<id>.json
      (58 warrior ids fetched this task). Behavior tiebreaker: github.com/wowsims/tbc sim/warrior/{talents,rampage, sweeping_strikes}.go.'
    families_compared:
      A_effects: 'per slot: Effect, EffectAura, EFFECTIVE base points, EffectMiscValue_0, EffectMiscValue_1(B), EffectTriggerSpell,
        EffectAuraPeriod, EffectRadiusIndex_0, EffectMechanic, EffectChainTargets, EffectRealPointsPerLevel, ImplicitTarget_0(A),
        ImplicitTarget_1(B).'
      B_proc_options: ProcChance, ProcCharges, ProcTypeMask, CumulativeAura (wago SpellAuraOptions).
      C_misc: DurationIndex, CastingTimeIndex, RangeIndex, SchoolMask, Speed, and ALL EIGHT attribute words (wago SpellMisc.Attributes_0..7
        vs live Attributes/AttributesEx..Ex7).
      D_categories: Category, DefenseType, DispelType, Mechanic, PreventionType, StartRecoveryCategory.
      E_power: ManaCost, ManaCostPct (wago SpellPower OrderIndex 0).
      F_class_options: SpellClassSet and the spell's OWN identity mask WORD 0 only.
      G_cooldowns: RecoveryTime, CategoryRecoveryTime, StartRecoveryTime (wago SpellCooldowns).
      H_aura_restrictions: CasterAuraState, TargetAuraState, ExcludeCasterAuraState, ExcludeTargetAuraState, CasterAuraSpell,
        TargetAuraSpell, ExcludeCasterAuraSpell, ExcludeTargetAuraSpell. **NOT IN THE PLAN'S SCRIPT.** It is what found TBC
