# --- Last Stand TBC clone 947547 (node 20349 grants it). -------------------------------------------
# _ref node_buckets.clone[20349] + capstone_chains.last_stand. The +30%-max-HP-for-20s MECHANIC is
# identical TBC->WotLK, but it is SCRIPT-BOUND: stock 12975's Effect_1 DUMMY (raw 29 / dieSides 1 ->
# GetEffectValue() 30) drives core spell_warr_last_stand, which casts the triggered buff 12976
# (aura 34 MOD_INCREASE_HEALTH, basePoints 0) with 30%-of-max-HP computed BY THE SCRIPT. So the +30%
# lives in the SCRIPT, not the DBC.
# WHY A CLONE: the COOLDOWN diverges, and in a DIFFERENT COLUMN. TBC `RecoveryTime 480000` (8 min —
# the cached Wowhead TBC tooltip for 12975 prints "8 min cooldown"); live carries `Category 1251 /
# CategoryRecoveryTime 180000` (3 min) with RecoveryTime 0. A category cooldown cannot be overridden
# by RecoveryTime alone, so the clone NEUTRALIZES the inherited category (`category: 0` +
# `categoryCooldown: 0`) and puts TBC's 8 minutes in RecoveryTime — the Vanilla Aimed Shot 932952-957
# / Last Stand 932840 precedent. Nothing in src/server reads category 1251 (grep-verified 2026-09-03),
# so neutralizing it is inert. Category 0 also keeps the row clear of the family-4
# SpellInfoCorrections category-132 sweep (era_audit.check_sweep_collisions).
# NOT REUSABLE from Vanilla: 932840 is RecoveryTime **600000** (10 min, Vanilla's cooldown) against
# TBC's 480000 — one field, and it is the whole point of the clone (_ref reuse_ledger 932840: FRESH).
# e1 DUMMY EFFECTIVE 30: wago 2.5.4's 12975 e1 is `SPELL_EFFECT_DUMMY` with EFFECTIVE **0** — TBC did
# not store the percentage in the spell record at all (the client description hardcodes the words
# "30% of your maximum health"; "$12976d" is only the duration reference) and the SERVER supplied it.
# BOTH RAW VALUES are in _ref node_buckets.clone[20349].data_gap_resolved so no later reader concludes
# TBC Last Stand granted 0%. Author 30, identical to live's DUMMY value and to the Vanilla clone.
# SCRIPT: the module's `era_last_stand` is ID-AGNOSTIC (it reads its own EFFECT_0 DUMMY via
# GetEffectValue() and casts stock 12976 with the computed base points, hardcoding no clone id), so
# the TBC clone reuses it verbatim through the top-level scriptBindings — NO C++ change.
# The CORE script spell_warr_last_stand is deliberately NOT rebound (_ref script_census row 12975:
# "REPLACED, not rebound") — a naive rebind would work too, but the 8-minute cooldown would still
# have to live on the clone, so there is no benefit and the module script is already proven.
# NO spellFixAck: SpellInfoCorrections.cpp contains no by-id fix for 12975 (grep-verified 2026-09-03).
- id: 947547
  name: Last Stand
  template: 12975          # inherit the DUMMY vehicle / instant / free / RangeIndex 1 / family 4 + mask 0x80000 / icon 177 / PreventionType 2
  category: 0              # neutralize stock Category 1251 (its CategoryRecoveryTime would pin the clone at 3 min)
  categoryCooldown: 0
  cooldown: 480000         # TBC 8 min, in RecoveryTime (Vanilla clone 932840 is 600000 = 10 min)
  spellLevel: 1            # TBC SpellLevel 1 (live 20)
  baseLevel: 0             # TBC BaseLevel 0 (live 20)
  effects:
  - { effect: 3, aura: 0, basePoints: 30, dieSides: 0, targetA: 1 }   # DUMMY; era_last_stand reads 30 and casts 12976
  client:
    name: Last Stand
    icon: 177              # stock Last Stand SpellIconID (12975, live DBC dump 2026-09-03)
    skillLine: 256         # Warrior skill line — else the granted active lands in the client's General tab
    description: "When activated, this ability temporarily grants you 30% of your maximum health for 20 sec.  After the effect expires, the health is lost."
# --- Concussion Blow TBC clone 947550 (node 20357 grants it). --------------------------------------
# _ref node_buckets.clone[20357]. TBC Concussion Blow is STUN-ONLY: the cached Wowhead TBC tooltip
# for 12809 reads "Stuns the opponent for 5 sec." and nothing else, and wago 2.5.4 has no e2/e3 row.
# Live 12809 adds `e2 SCHOOL_DAMAGE` + `e3 DUMMY 38` (a % of attack power applied by the core script
# spell_warr_concussion_blow) and retunes the cooldown to 30 s. Divergences authored here:
#   * cooldown       TBC RecoveryTime **45000**; live 30000.
#   * mechanic       TBC records the stun as the SPELL-level `Mechanic 12`; live records
#                    `EffectMechanic_1 12` with spell Mechanic 0.
#   * effects        TBC has e1 only; the template's e2/e3 are 0-filled by the generator (a templated
#                    clone writes all three slots, so live's %AP damage cannot leak through).
# NO `scriptBindings:` ENTRY, deliberately (_ref node_buckets.clone[20357].script_rebind_forbidden):
# `spell_warr_concussion_blow` reads EFFECT_2 (0-based; = DBC slot 3) as a % of attack power and calls
# SetHitDamage. This clone has no slot-3 DUMMY, and TBC's ability deals no damage — so the correct
# action is to bind nothing. A fresh id carries no binding by default; recorded because "rebind every
# script the census found" would be wrong here.
# NOT REUSABLE from Vanilla: 932822 records the stun as `EffectMechanic_1 12 / Mechanic 0`, i.e. the
# live encoding rather than TBC's (_ref reuse_ledger 932822: FRESH, "second-closest call") — and
# reuse would make a TBC prot warrior's Concussion Blow share an id with a Vanilla one.
# TWO INHERITED FIELDS THE GENERATOR HAS NO KEY FOR, both recorded rather than hidden:
#   * `EffectMechanic_1` stays 12 (the template's). TBC's own record has it 0 and the stun on the
#     spell level. The clone therefore records MECHANIC_STUN in BOTH places; both mark the ability a
#     stun for immunity and diminishing-returns purposes and neither double-applies, so the delta is
#     cosmetic. BOTH RAW VALUES: wago 2.5.4 12809 Mechanic 12 / EffectMechanic 0; live 12809
#     Mechanic 0 / EffectMechanic_1 12.
#   * `StartRecoveryTime` stays the template's 1500 ms. wago 2.5.4 12809 stores 0 (TBC kept the GCD in
#     StartRecoveryCategory 133, which both sides carry), so inheriting 1.5 s reproduces the ability
#     TBC actually played and a literal 0 would have shipped a GCD-free stun. Recorded because the
#     sweep prints it as a divergence (_ref survival_map 12809 detail).
# NO spellFixAck: SpellInfoCorrections.cpp contains no by-id fix for 12809 (grep-verified 2026-09-03).
- id: 947550
  name: Concussion Blow
  template: 12809          # inherit 15 rage / instant / DurationIndex 28 (5 s) / RangeIndex 2 / family 4 + mask 0x4000000 / equip class 2 sub 0x2a5f3 / icon 25 / attrs / PreventionType 2
  cooldown: 45000          # TBC 45 s (live 30 000)
  mechanic: 12             # MECHANIC_STUN at the SPELL level — TBC's own encoding (live puts it on the effect)
  effects:
  - { effect: 6, aura: 12, basePoints: 0, dieSides: 0, targetA: 6 }   # MOD_STUN 5 s; live's e2 damage + e3 %AP DUMMY are 0-filled
  client:
    name: Concussion Blow
    icon: 25               # stock Concussion Blow SpellIconID (12809, live DBC dump 2026-09-03)
    skillLine: 256         # Warrior skill line — else the granted active lands in the General tab
    description: "Stuns the opponent for 5 sec."
    auraDescription: "Stunned."
# --- Improved Shield Bash silence payload 947567 (node 20358 proc-triggers it). --------------------
# _ref node_buckets.authored_plus_helper[20358] + id_repurposing. The talent rows 12311/12958 are
# DIVERGED **and** REPURPOSED (live = "Gag Order", a different talent shape), and so is the payload:
# 18498 is TBC's "Shield Bash - Silenced" and live's "Silenced - Gag Order". Three field divergences,
# BOTH RAW VALUES each (wago 2.5.4 vs the live DBC dump 2026-09-03):
#   * PreventionType   TBC **1** (SPELL_PREVENTION_TYPE_SILENCE — the silence is itself blocked by a
#                      school lockout); live **0**. Authored via the `preventionType:` key.
#   * AttributesEx2    TBC 0x0; live 0x4 SPELL_ATTR2_IGNORE_LINE_OF_SIGHT (a WotLK QoL bit).
#   * AttributesEx3    TBC 0x0; live 0x40000000 SPELL_ATTR3_DO_NOT_DISPLAY_RANGE (likewise).
# Both attribute bits are authored to TBC's zero rather than ridden from the template (lesson 17c —
# the Bloodthirst flat-heal `attributesEx2: 0` precedent).
# ONE TBC FIELD IS DELIBERATELY NOT COPIED: wago gives 18498 `ShapeshiftMask 0x8000000` and live gives
# 0. Bit 27 is not a warrior stance (Battle/Defensive/Berserker are 0x10000/0x20000/0x40000, verified
# in _ref stance_implied), so on THIS core a clone carrying it would fail `Spell::CheckShapeshift` in
# every form a warrior can actually be in — the Mangle-DUMMY lesson (a TBC encoding that is dead or
# harmful here must not be reproduced literally). The generator has no helper `stances:` emission
# anyway, so templating 18498 inherits live's 0, which is the intended value.
# `DispelType 1` (Magic) and `Mechanic 9` (MECHANIC_SILENCE) are IDENTICAL on both sides and are
# inherited.
# ONE INERT FIELD IS DELIBERATELY NOT INHERITED: `family: 0`. BOTH RAW VALUES — wago 2.5.4 AND the
# live DBC give 18498 `SpellClassSet 8` (SPELLFAMILY_ROGUE), a Blizzard oddity on a warrior payload
# that both eras share. It is provably inert here and provably inert if changed:
#   * NOTHING can bind it. 18498 carries SpellClassMask_1/2/3 = 0 on both sides, and
#     SpellInfo::IsAffected returns false for any masked spellmod (`familyFlags && !(familyFlags &
#     0)`), so no class's spellmod reaches this spell under family 8 OR family 0.
#   * DIMINISHING RETURNS ARE UNCHANGED. GetDiminishingReturnsGroupForSpell's SPELLFAMILY_ROGUE arm
#     only matches Gouge/Blind/Cheap Shot family flags or SpellIconID 163 (this clone is icon 280),
#     and its SPELLFAMILY_GENERIC arm only matches two hardcoded ids and a visual/icon pair — so both
#     families fall through to the shared mechanic logic, which returns DIMINISHING_SILENCE off
#     `MECHANIC_SILENCE` either way (SpellMgr.cpp:107-260, read 2026-09-03).
# Authored 0 so the whole warrior band stays inside the {0, 4} family invariant this phase's
# verification sweep asserts, rather than shipping a lone rogue-family row in a warrior dataset.
# Visible debuff -> client row, or the 3.3.5a client renders no debuff icon (the Mace Stun precedent).
# NO spellFixAck: SpellInfoCorrections.cpp contains no by-id fix for 18498 (grep-verified 2026-09-03).
- id: 947567
  name: Shield Bash - Silenced          # TBC 18498's own name; live renamed it "Silenced - Gag Order"
  template: 18498          # inherit aura27 MOD_SILENCE vehicle / DurationIndex 27 (3 s) / Mechanic 9 / DispelType 1 / icon 280 / visual 12638
  family: 0                # NOT 18498's SpellClassSet 8 (rogue) — inert either way, see the block comment
  preventionType: 1        # TBC 1 (SPELL_PREVENTION_TYPE_SILENCE); live 0
  attributesEx2: 0         # TBC 0x0; live 0x4 SPELL_ATTR2_IGNORE_LINE_OF_SIGHT
  attributesEx3: 0         # TBC 0x0; live 0x40000000 SPELL_ATTR3_DO_NOT_DISPLAY_RANGE
  effects:
  - { effect: 6, aura: 27, basePoints: 1, dieSides: 0, targetA: 6 }   # MOD_SILENCE, 3 s, on the target
  client:
    name: Shield Bash - Silenced
    icon: 280              # stock 18498 SpellIconID (live DBC dump 2026-09-03)
    auraDescription: "Silenced."
