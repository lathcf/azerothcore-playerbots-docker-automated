        on this core despite both tooltips saying ''while in Berserker Stance''. Author the measured 0, or author a stance mask
        the era is arguably entitled to?"'
      retracted_evidence: '"wago SpellShapeshift has no row for 29759-29763; live ShapeshiftMask = 0." Both clauses are wrong:
        this file''s own `tbc:` lines for 29759-29763 all read `shapeshiftMask=0x40000`, and the live DBC dump gives 29759 and
        29763 **ShapeshiftMask = 262144** (= 0x40000). The wowsims/tbc "TODO: This should only be applied while berserker stance
        is active" comment is real, but it describes a gap in the SIM, not in either game''s data.'
      decision: '`stances: 262144` is authored on node 20342 — the measured value, identical on both sides.'
      still_open_for_node_20361: 'Improved Defensive Stance is a SEPARATE question and is NOT settled by this: it is Task 8''s
