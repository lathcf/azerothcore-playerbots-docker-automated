# =================================================================================================
# Module/core scripts bound to band ids this dataset owns. (A node-level `proc-scripted` mechanic
# emits its own spell_script_names row — node 20308 Deep Wounds — so this list covers only spells
# the generator does not otherwise bind.)
#   * era_bloodthirst_vanilla is ID-AGNOSTIC despite its name: it reads the CLONE'S OWN Effect_0
#     base value as the attack-power percentage (`GetEffectValue()`, EraTalentProcScripts.cpp:1233)
#     and runs the standard SpellDamageBonusDone/Taken pipeline, hardcoding no id at all. The six
#     TBC clones therefore reuse it verbatim with NO C++ change — the shape _ref script_census
#     prescribed ("Use era_bloodthirst_vanilla + flat-heal helpers, the shipped Vanilla shape").
#     Both eras' clones carry 45 in that slot, so one script serves ten ids across two eras.
#     Contrast the Deep Wounds script, which DID need a Task-6 C++ change because it hardcoded its
#     carrier id — the difference is "reads its own row" vs "names another spell".
#   * spell_warr_sweeping_strikes is a CORE AuraScript, likewise id-agnostic: it hardcodes only the
#     two extra-attack payloads 12723/26654 (both LIVE_MATCH) and hooks `EFFECT_0,
#     SPELL_AURA_DUMMY`, which is exactly what the clone's authored e1 carries.
#   * NOT listed, on purpose: era_improved_berserker_rage. It is already bound to STOCK Berserker
#     Rage 18499 by the Vanilla warrior dataset and is gated on a band-ranged misc-15 DUMMY marker
#     rather than on an era, so the TBC node 20337 minting the same marker is all that is needed
#     (_ref script_census row 18499: "REUSE AS-IS ... needs no new C++ and no new binding").
#   * era_last_stand is ID-AGNOSTIC too: it reads the CASTING CLONE'S OWN EFFECT_0 DUMMY value via
#     GetEffectValue() (30), computes CountPctFromMaxHealth and casts the STOCK triggered buff 12976
#     with it — hardcoding no clone id. The TBC clone 947547 therefore reuses it verbatim with NO C++
#     change, exactly as the six TBC Bloodthirst clones reuse era_bloodthirst_vanilla. The CORE
#     script spell_warr_last_stand is NOT rebound (_ref script_census row 12975: "REPLACED, not
#     rebound" — a rebind would work but buys nothing, since the 8-minute cooldown has to live on
#     the clone either way).
#   * NOT listed, on purpose: spell_warr_concussion_blow. _ref node_buckets.clone[20357]
#     .script_rebind_forbidden — it reads EFFECT_2 (0-based; = DBC slot 3) as a % of attack power and
#     calls SetHitDamage, which is WotLK's added damage half. TBC Concussion Blow is stun-ONLY, so
#     the correct action is to bind nothing.
# --- Blood Frenzy debuff clones 947568/947569 (node 20318 triggers them) — final review R7, G-13. --
# CLOSES era-data/_ref/tbc/warrior-spells.yaml accepted_gaps id 6, whose own what_would_close_it reads
# "two fresh band clones carrying the `mechanic` helper key at 15, with node 20318's `trigger:`
# re-pointed at them" — which is exactly this.
# BOTH RAW VALUES (wago 2.5.4 vs the live DBC dump 2026-09-06): TBC 30069/30070 carry spell-level
# `Mechanic 15` (MECHANIC_BLEED); live 30069/30070 carry `Mechanic 0`. Everything else the node needs
# is identical on both sides (Effect_1 aura 87 MOD_DAMAGE_PERCENT_TAKEN +2% / +4%, misc 1 = physical,
# DurationIndex 21 = permanent, target 6, family 0), which is why the node triggered the STOCK ids up
# to now — a difference too small to justify two clones until the phase's final pass.
# The mechanic is not cosmetic on this core: `SpellInfo::GetAllEffectsMechanicMask()` feeds
# mechanic IMMUNITY (`Unit::IsImmunedToSpellEffect`) and the diminishing-returns group lookup, so a
# bleed-immune target should shrug the debuff off in TBC and does not with `Mechanic 0`.
# `template:` each stock rank so every other column (attrs, icon 2005, duration, the aura tuple) is
# inherited byte-for-byte and ONLY the mechanic moves.
# CLIENT ROWS ARE REQUIRED, and are not optional the way a hidden payload's are: stock 30069/30070
# carry Attributes 256 (DO_NOT_LOG) but NOT 0x80 DO_NOT_DISPLAY, i.e. Blood Frenzy is a debuff the
# player SEES on the target — and the 3.3.5a client resolves a debuff's name and icon out of its OWN
# Spell.dbc, which knows nothing about a server-side clone. Without a `client:` block the era debuff
# would render with no icon at all (the Blackout / Vanilla Mace Spec precedent, and the reason helper
# 947552 carries one). The stock text is "Increases physical damage taken by $s1%."; the era rows
# spell the value out rather than relying on the client-side `$s1` substitution.
# They are deliberately absent from era-data/band-allowlist.yaml, which is a different question: that
# file asserts "a character may legitimately KNOW this", which is false for a triggered debuff that
# never enters character_spell (the 947540 Rampage-window precedent).
# ONE FIELD DELIBERATELY LEFT INHERITED: `AttributesEx2` 0x4 (IGNORE_LINE_OF_SIGHT), which live added
# and TBC does not carry. It is inert for this payload — the debuff is applied by the caster's own
# aura-109 ADD_TARGET_TRIGGER on a Rend/Deep Wounds hit that has already resolved against the target,
# so line of sight is satisfied by construction — and item G-13 scoped this change to the mechanic.
# spell_group: 947568/947569 join group 1108 ("physical damage taken" exclusivity — stock 30069 +
# rogue Savage Combat 58684) in the hand SQL 2026_09_06_05. A clone does NOT inherit its template's
# spell_group membership, and 947569 needs its OWN row because `GetSpellSpellGroupMapBounds` resolves
# through `GetFirstSpellInChain` (which covers stock 30070 via 30069) and these clones are in no
# `spell_ranks` chain. Without those two rows the swap would silently let an era warrior's Blood
# Frenzy stack with Savage Combat.
- id: 947568
  name: Blood Frenzy
  template: 30069         # stock Blood Frenzy r1 debuff — inherit aura 87 +2% physical taken, misc 1, permanent, icon 2005
  mechanic: 15            # MECHANIC_BLEED — TBC's spell-level mechanic, which live dropped
  effects:
  - { effect: 6, aura: 87, basePoints: 1, dieSides: 1, misc: 1, targetA: 6 }   # +2% physical damage taken (byte-identical to stock 30069)
  client:
    name: Blood Frenzy
    icon: 2005             # stock Blood Frenzy SpellIconID (30069, live DBC dump 2026-09-06)
    auraDescription: "Increases physical damage taken by 2%."

- id: 947569
  name: Blood Frenzy
  template: 30070         # stock Blood Frenzy r2 debuff
  mechanic: 15
  effects:
  - { effect: 6, aura: 87, basePoints: 3, dieSides: 1, misc: 1, targetA: 6 }   # +4% physical damage taken (byte-identical to stock 30070)
  client:
    name: Blood Frenzy
    icon: 2005
    auraDescription: "Increases physical damage taken by 4%."

