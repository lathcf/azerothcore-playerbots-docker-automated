# --- RAMPAGE reconstruction 947533-947540 (node 20343 grants r1; r2/r3 trainer-taught at 60/70). --
# The phase's flagged reconstruction. WotLK's 29801 is a PASSIVE that grants the party +5% weapon
# crit — a completely different mechanic, with no cost, no duration, no proc, no buff chain, and
# 30029-30033 absent from the live store entirely (_ref capstone_chains.rampage). So every piece is
# authored. TBC's own shape (wago 2.5.4):
#   29801/30030/30033  activated, 20 rage (ManaCost 200), instant, GCD category 133, DurationIndex 9
#                      (30 s), CasterAuraState 11 ("scored a critical hit recently"),
#                      e1 aura42 PROC_TRIGGER_SPELL (ProcChance 100 / ProcTypeMask 0x14) -> 18350,
#                      e2 SPELL_EFFECT_TRIGGER_SPELL -> the rank's AP buff, own mask word0 0x100000.
#   30029/30031/30032  aura99 MOD_ATTACK_POWER +30/+40/+50, CumulativeAura 5, 30 s, attr3 0x30000.
# TWO PIECES OF TBC'S ENCODING ARE DELIBERATELY NOT COPIED, both because they are DEAD on this core
# (the Mangle-DUMMY lesson — a TBC encoding that does nothing here must not be reproduced literally):
#   * `CasterAuraState 11` — AzerothCore's AuraStateType has no 11 (SharedDefines.h:1291 comments it
#     as UNKNOWN11) and NOTHING in src/server/game ever calls ModifyAuraState with it, so a clone
#     carrying it would be permanently uncastable. Replaced by a real 5 s aura + the new
#     `casterAuraSpell:` generator key (Spell::CheckCast, Spell.cpp:5779, fails the cast with
#     SPELL_FAILED_CASTER_AURASTATE unless the caster holds it).
#   * the `18350` indirection — "Dummy Trigger" is a bare SPELL_EFFECT_DUMMY on this server
#     (present only in acore_world.spell_dbc, absent from both the 3.3.5a DBC and wago), i.e. in real
#     TBC the SERVER incremented the stack off that dummy. Here e1's proc points STRAIGHT at the
#     rank's own buff: re-casting a `CumulativeAura 5` aura on a unit that already has it increments
#     the stack and refreshes the duration (Unit::_TryStackingOrRefreshingExistingAura ->
#     Aura::ModStackAmount), and AuraEffect::CalculateAmount ends with
#     `amount *= GetBase()->GetStackAmount()` (SpellAuraEffects.cpp:580) so the AP really scales
#     30 -> 150. That reproduces TBC's "each melee hit adds a stack, up to 5" in pure data.
# ROUTE = escalation-ladder rung 1 (data) + ONE generator key + ONE reconcile arm. No module script,
# no core patch. The reconcile arm exists only because era_talent_rank's PRIMARY KEY is
# (talentId, rank): a node grants exactly ONE spell, so the crit-WATCHER passive 947539 is handed
# out (and stripped) by EraTalents.cpp's CLASS_WARRIOR arm (6), the druid kEraDruidTbcPaired shape.
# ACCEPTED GAP (_ref accepted_gaps id 4): TBC cleared the crit window on use; a CasterAuraSpell gate
# leaves the 5 s ready aura running, so a second Rampage inside the same window is castable. Closing
# it needs a module SpellScript removing the aura in AfterCast — flagged, not hidden.
- id: 947533
  name: Rampage
  template: 12292          # Death Wish: the closest stock analog — instant self-buff, RangeIndex 1,
                           # DurationIndex 9 (30 s), GCD StartRecoveryCategory 133 / 1500 ms, family 4
                           # and SpellClassMask_1 0x100000, which is EXACTLY TBC Rampage's own mask
                           # word 0. (StartRecoveryCategory/StartRecoveryTime have no generator key,
                           # so a from-scratch helper would silently ship Rampage with NO global
                           # cooldown — the template is what carries them.)
  attributes: 327696       # 0x50010 — TBC 29801 attr0. Drops Death Wish's 0x8000000 AND, critically,
                           # never inherits live 29801's SPELL_ATTR0_PASSIVE (WotLK's Rampage is a
                           # passive; a passive spell cannot be cast at all).
  attributesEx: 268435456  # 0x10000000 — TBC 29801 attr1 (Death Wish's own 0x18000 is not TBC Rampage's)
  attributesEx3: 67108864  # 0x4000000 SPELL_ATTR3_CAN_PROC_FROM_PROCS — TBC 29801 attr3, so the
                           # stacking proc also fires off triggered melee casts (Whirlwind off-hand)
  dispelType: 0            # TBC 0; the 12292 template carries live's 9 (DISPEL_ENRAGE)
  mechanic: 0              # TBC 0; the template carries live 12292's 31 (MECHANIC_ENRAGED)
  cooldown: 0              # TBC Rampage has NO cooldown; the template carries Death Wish's 180 000 ms
  powerCost: 200           # 20 rage
  spellVisual: 0           # TBC's visual is not in any table of record and live 29801 (a passive)
