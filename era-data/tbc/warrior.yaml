# --- Sweeping Strikes TBC clone 947549 (node 20335 grants it). ------------------------------------
# _ref node_buckets.clone[20335] + open_questions.sweeping_strikes_duration. Live 12328 diverges on
# exactly two fields, BOTH of which the cached Wowhead TBC tooltip corroborates: ProcCharges TBC
# **10** vs live 5 ("Your next 10 melee attacks strike an additional nearby opponent") and
# DurationIndex TBC **1** = 10 000 ms vs live 9 = 30 000 ("10 seconds remaining" in the buff line).
# The open question is CLOSED on the fidelity bar's precedence rule: wago is the number of record
# and here it agrees with the rendered TBC tooltip on both fields; wowsims/tbc's `NeverExpires,
# MaxStacks: 10` is a sim simplification that matches neither store. A 10-second window on a
# 30-second cooldown IS a visible nerf versus the live spell — flagged for the real-client pass.
# Everything else is inherited and already TBC-exact: 30 rage (ManaCost 300), instant, RecoveryTime
# 30 000, ShapeshiftMask 0x50000 (Battle|Berserker — the only real stance gate in the tree, and
# IDENTICAL on both sides), family 4 + SpellClassMask_2 0x100000, icon 515, Attributes 0x40010.
# SCRIPT REBIND: the core AuraScript spell_warr_sweeping_strikes is bound to the POSITIVE stock id,
# so the clone gets it via the top-level scriptBindings (see that block). The script hooks
# `EFFECT_0, SPELL_AURA_DUMMY`, which is what TBC 12328's own e1 (aura 4, value 0) is.
# PROC ROW: stock 12328 has a spell_proc row (SpellFamilyName 4, SpellTypeMask 1, SpellPhaseMask 2,
# AttributesMask 2, ProcFlags 0 = "use the DBC events"); a clone inherits NO spell_proc row, so it
# is reproduced here with TBC's own ProcTypeMask 0x14 written explicitly into ProcFlags.
# `attrMask: 2` (PROC_ATTR_TRIGGERED_CAN_PROC) is load-bearing — it is what lets triggered melee
# casts (Whirlwind's off-hand strike) consume a charge, exactly as the stock row allows.
- id: 947549
  name: Sweeping Strikes
  template: 12328          # inherit 30 rage / instant / 30 s cd / ShapeshiftMask 0x50000 / family+mask / icon 515 / visual 211
  attributes: 327696       # 0x50010 = the template's own 0x40010 PLUS 0x10000
                           # SPELL_ATTR0_NOT_SHAPESHIFTED. The bit is NOT in either era's DBC row:
                           # `SpellInfoCorrections.cpp:1161` ORs it onto STOCK 12328 by id at load
                           # ("Sweeping Strikes stance change"), and a clone has a different id, so
                           # it never receives it (era_audit.check_spellfix_inheritance caught this
                           # and it is the only spellfix in the Fury id set). It is load-bearing on
                           # a spell whose ShapeshiftMask is Battle|Berserker: without it a warrior
                           # stance-dancing mid-fight — which Fury warriors do constantly — loses
                           # the buff on the swap. Authoring the POST-FIX value is the framework's
                           # first option; no spellFixAck is needed.
  durationIndex: 1         # 10 000 ms (TBC); live idx 9 = 30 000 ms
  procCharges: 10          # TBC 10 charges; live 5
  spellLevel: 1            # TBC SpellLevels (live 30/30)
  baseLevel: 0
  effects:
  - { effect: 6, aura: 4, basePoints: 0, dieSides: 0, targetA: 1 }   # SPELL_AURA_DUMMY — the core script's EFFECT_0 hook
  proc:
    flags: 20              # 0x14 = TBC 12328's own ProcTypeMask (the stock row leaves ProcFlags 0 and inherits it)
    family: 4              # stock row's SpellFamilyName (masks 0 = any warrior-family melee ability)
    typeMask: 1            # PROC_SPELL_TYPE_DAMAGE, as the stock row
    phaseMask: 2           # PROC_SPELL_PHASE_HIT, as the stock row
    attrMask: 2            # PROC_ATTR_TRIGGERED_CAN_PROC — triggered melee casts may consume a charge
  client:
    name: Sweeping Strikes
    icon: 515              # stock Sweeping Strikes SpellIconID (12328, live DBC dump 2026-09-03)
    skillLine: 256         # Warrior skill line — else the granted active lands in the General tab
    description: "Your next 10 melee attacks strike an additional nearby opponent."
    auraDescription: "Your next 10 melee attacks strike an additional nearby opponent."
