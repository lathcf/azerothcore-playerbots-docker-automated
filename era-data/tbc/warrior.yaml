# --- Bloodthirst TBC clone chain 947512-947529 (node 20340 grants r1; r2-r6 trainer-taught). ------
# _ref capstone_chains.bloodthirst: stock 23881 DIVERGES on FOUR independent families, so every rank
# is a clone trio (damage clone + 5-charge heal buff + flat heal), the shipped Vanilla shape
# (932828-839) extended from four ranks to TBC's SIX (40/48/54/60/66/70). BOTH RAW VALUES on each:
#   * damage        TBC e1 SCHOOL_DAMAGE effective **45**% of AP; live 50.
#   * cost          TBC ManaCost **300** = 30 rage; live 200 = 20 rage.
#   * cooldown      TBC CategoryRecoveryTime **6000** ms; live 4000. **This family alone moved ranks
#                   2-6 from LIVE_MATCH to DIVERGED** — an effects-only sweep would have granted
#                   stock and shipped a 4-second Bloodthirst.
#   * weapon gate   TBC has NO SpellEquippedItems row at all; live requires class 2 / 0x2a5f3.
#   * heal model    TBC buff 23885 (8 s, **5** charges, procFlags 0x14) triggers 23880 =
#                   `SPELL_EFFECT_HEAL` **FLAT** 10/13/17/20/25/30; the live core script
#                   spell_warr_bloodthirst_heal recomputes it as CountPctFromMaxHealth. Live 23885
#                   also carries only 3 charges.
# All five are confirmed by the cached Wowhead TBC tooltip for 23881/30335 (era-data/_ref/tbc/
# tooltips/): "30 Rage / Melee Range / Instant / 6 sec cooldown ... (Attack Power * 45 / 100) ...
# the next 5 successful melee attacks will restore 10 [30] health ... lasts 8 sec".
#
# NOT REUSABLE from Vanilla (_ref reuse_ledger 932828-831 / 932832-835 / 932836-839, all FRESH):
# the Vanilla damage clones carry Category 0 vs TBC's 971, the families are four ranks vs six, and
# reuse is all-or-nothing per helper. The flat-heal NUMBERS are identical for the four ranks both
# eras have (10/13/17/20) — "identical numbers" is not "reusable id".
#
# CATEGORY IS NEUTRALIZED, not copied: `category: 0` + `categoryCooldown: 0` + `cooldown: 6000`
# puts the era cooldown in RecoveryTime instead of TBC's own Category 971 / CategoryRecoveryTime
# 6000. Two reasons, both from the shipped Vanilla precedent: stock 23881's category cooldown is
# what a template clone would otherwise inherit at the WRONG 4000 ms, and Category 0 keeps the row
# clear of the family-4 SpellInfoCorrections sweep (which keys on Category 132 — era_audit's
# check_sweep_collisions enforces this). The Aimed Shot 932952-957 precedent.
# NO spellFixAck is needed: SpellInfoCorrections.cpp carries no by-id fix for 23881/23885/23880
# (grep-verified 2026-09-03), which is what era_audit.check_spellfix_inheritance tests.
#
# The DAMAGE clones keep the template's `family: 4` + `SpellClassMask_2 = 1024` (Bloodthirst's own
# identity bit, live-dumped) — LOAD-BEARING: Impale (node 20310, affectsMask b=0x744) and Focused
# Rage (node 20363, TBC word 1 = 0x664) both enumerate 0x400, so the era clone must carry it or
# those two talents silently miss the Fury finisher.
# `equipClass: -1` + `equipSubclass: 0` is authored on every damage rank: TBC 23881 has no
# SpellEquippedItems row (no weapon requirement) while the template's is class 2 / 173555, and
# `Spell::CheckItems` only consults the subclass when EquippedItemClass >= 0.
# AP scaling is NOT a DBC value — era_bloodthirst_vanilla (bound via the top-level scriptBindings)
# reads Effect_0's base value (45) as the percentage. See that block for why no C++ changed.
- id: 947512
  name: Bloodthirst
  template: 23881          # inherit instant / RangeIndex 2 / family 4 + mask 0x400 / school 1 / icon 38 / GCD 133-1500 / attrs
  powerCost: 300           # 30 rage (live r1 ManaCost 200 = 20 rage)
  category: 0              # neutralize stock Category 971 (also escapes the family-4 category-132 sweep)
  categoryCooldown: 0
  cooldown: 6000           # TBC 6 s, moved into RecoveryTime (stock's lives in CategoryRecoveryTime 4000)
  equipClass: -1           # TBC has no SpellEquippedItems row; live requires a melee weapon
  equipSubclass: 0
  spellLevel: 40           # TBC SpellLevels for this rank
  baseLevel: 40
  effects:
  - { effect: 2,  basePoints: 45, dieSides: 0, targetA: 6 }                  # SCHOOL_DAMAGE; the script reads 45 as the AP %
  - { effect: 64, basePoints: 0,  dieSides: 0, targetA: 1, trigger: 947518 } # TRIGGER_SPELL -> heal buff r1 on the caster
