# --- Rampage crit WATCHER 947539 + the "Rampage Ready" window 947540. -----------------------------
# The pair that reproduces TBC's "can only be used after scoring a critical hit" without the dead
# CasterAuraState 11. wowsims/tbc (sim/warrior/rampage.go) sets `rampageValidUntil = CurrentTime + 5s`
# on any crit and refuses the cast outside it — hence a **5 second** window.
# 947539 is a hidden PASSIVE (attributes 262608 = PASSIVE|hidden, the shipped marker idiom of
# 932930 / 932950) whose aura-42 proc fires on melee crits only (`hitMask: 2` = PROC_HIT_CRITICAL —
# NEVER leave this to the default 0, which is NORMAL|CRIT) and applies 947540 to the warrior.
# It is NOT named "Rampage": the bot AI resolves spells BY NAME, so a second learned spell called
# "Rampage" would be a name collision with the ability itself.
# It is LEARNED (not cast), because a learned passive self-applies on learn and survives logout
# without a re-cast — the same mechanism every other module marker uses. EraTalents.cpp's
# CLASS_WARRIOR arm (6) grants it with node 20343 and arm (5) already strips the whole
# 947533-947540 range when the node is unspent or the character leaves TBC.
- id: 947539
  name: Rampage Watch
  attributes: 262608       # PASSIVE + hidden -> self-applies on learn, never shown in the spellbook
  effects:
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, targetA: 1, trigger: 947540 }  # PROC_TRIGGER_SPELL -> the ready window
  proc:
    flags: 20              # 0x14 DONE_MELEE_AUTO_ATTACK | DONE_SPELL_MELEE_DMG_CLASS
    hitMask: 2             # PROC_HIT_CRITICAL — "after scoring a critical hit"
    chance: 100
# 947540 is the window itself: a 5 s aura the player SEES (client row + auraDescription), so
# "Rampage is available now" is legible instead of a silent server state. Its only effect is an
# inert SPELL_AURA_DUMMY at **misc 0** — deliberately outside the DUMMY-marker registry, every
# entry of which reads a NON-ZERO misc (registry #3/5/14/15/16/18, all band-gated `GetMiscValue()
# != marker` scans), so this aura can never be mistaken for a marker by any era script.
# attributesEx3 0x30000 (suppress caster/target procs) keeps its re-application — which happens on
# every single melee crit — out of every other proc chain.
- id: 947540
