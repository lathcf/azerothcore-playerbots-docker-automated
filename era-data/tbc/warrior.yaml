        found Berserker Rage 18499 carrying `ShapeshiftMask 0x40000` in TBC and 0 live.
      J_levels: BaseLevel, MaxLevel, SpellLevel.
      K_equipped_item: EquippedItemClass, EquippedItemSubclass, EquippedItemInvTypes. It is what found TBC Devastate requiring
        a ONE-HANDED WEAPON (class 2 / subclass 0xa091) where live requires a SHIELD (class 4 / subclass 0x40).
      L_interrupts: InterruptFlags, AuraInterruptFlags, ChannelInterruptFlags.
      M_targets: Targets, TargetCreatureType, MaxTargets.
      N_identity: Name_lang vs the live DBC Name_Lang_enUS — the ID-REPURPOSING detector. WotLK reused FIVE TBC warrior talent
        ids for DIFFERENT talents; see `id_repurposing:`. Nothing else in the sweep would have caught 29723 (TBC Improved
        Disciplines / live Sudden Death) as a hazard.
      O_effect_class_masks: Per-effect EffectSpellClassMask words 0/1/2. Compared as a SUPPLEMENTARY pass whose result is
        recorded in `effect_class_mask_diffs:` and deliberately does NOT feed the verdict — see that section for why, and
        for the FOUR entries in it that are load-bearing rather than encoding drift.
    corrections_to_the_plan_script:
      live_column_names: The plan's Step-3 snippet reads `cols["SpellClassMaskA"]` and `cols["EffectRadiusIndex_N"]`. `tools/spell_dbc_columns.txt`
        actually spells the spell's own identity words `SpellClassMask_1/_2/_3` (1-based) — there is no `SpellClassMaskA`.
        The mapping used here is wago `SpellClassMask_0` (word 0) -> live `SpellClassMask_1`. `EffectRadiusIndex_N` is correct.
      base_points_convention: 'The shaman ref''s correction carries over unchanged and was re-verified on this id set: wago
        2.5.4 stores EffectBasePoints in the SAME raw (value-1) convention as the 3.3.5a DBC, so the comparison must normalise
        BOTH sides to the effective value. Anchor re-measured here: TBC Bloodthirst 23881 raw basePoints 44 / DieSides 1 =
        effective 45, matching the Wowhead TBC tooltip "(Attack Power * 45 / 100)".'
      float_columns: Spell.dbc stores Speed, EffectRealPointsPerLevel_N, EffectMultipleValue_N, EffectPointsPerCombo_N and
        EffectChainAmplitude_N as FLOATS. Unpacking the whole record as int32 (which the plan's snippet does) makes every
        non-zero float read as a garbage integer — e.g. Battle Shout 2048 reported "EffectRealPointsPerLevel TBC1 -> LIVE1065353216"
