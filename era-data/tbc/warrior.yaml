  stance_implied:
    finding_summary: 'Spec §4a called this the phase''s dominant risk and it is: `HandleAuraModShapeshift` (SpellAuraEffects.cpp:1377-1384)
      hard-casts ONE serverside passive per warrior stance — Battle Stance -> 21156, Defensive Stance -> 7376, Berserker Stance
      -> 7381 — and NO talent row, NO Talent CSV entry and NO DB2 EffectTriggerSpell references any of the three. They entered
      the sweep only because the core source was read. TWO OF THE THREE DIVERGE.'
    spells:
      2457:
        name: Battle Stance (the shapeshift aura itself)
        verdict: DIVERGED
        detail: attribute words only (Attr0 bit 23, Attr2 bit 8, Attr6 bit 12) — no mechanical difference.
      71:
        name: Defensive Stance (the shapeshift aura itself)
        verdict: DIVERGED
        detail: attribute words only (Attr2 bit 8, Attr6 bit 12).
      2458:
        name: Berserker Stance (the shapeshift aura itself)
        verdict: DIVERGED
        detail: attribute words only (Attr2 bit 8, Attr6 bit 12).
      21156:
        name: Battle Stance Passive
        verdict: LIVE_MATCH
        note: LIVE 2457 additionally carries e2 `aura 280 MOD_ARMOR_PENETRATION_PCT 10` that TBC does not — WotLK's Battle Stance
          +10% armour penetration. That is on the STANCE AURA, not the passive.
      7376:
        name: Defensive Stance Passive
        verdict: DIVERGED
        detail: 'e2 aura 79 MOD_DAMAGE_PERCENT_DONE misc 127: TBC **-10%**, live **-5%**. e3 aura 10 MOD_THREAT misc 127: TBC
          **+30%**, live **+45%**.'
        impact: A TBC-era protection warrior on this server deals 5% more damage and generates 15 percentage points more threat
          in Defensive Stance than TBC did.
      7381:
        name: Berserker Stance Passive
        verdict: DIVERGED
        detail: 'e2 aura 87 MOD_DAMAGE_PERCENT_TAKEN misc 127: TBC **+10%** damage taken, live **+5%**.'
        impact: A TBC-era warrior in Berserker Stance takes 5 percentage points less extra damage than TBC did.
    disposition: ACCEPTED GAP as things stand (see accepted_gaps.gaps id 1 and id 2) — these are GLOBAL stock spells cast by
      core code with hardcoded ids, and eras are per-character, so the era-safety rule forbids editing them. Closing the gap
      needs a module-side compensating aura applied on stance change to era-managed characters only; that is a design decision,
      not a Task-6/7/8 authoring choice, and is escalated rather than silently absorbed.
    talents_that_act_on_stances:
    - id: 20342
      name: Improved Berserker Stance
      finding_RETRACTED_2026_09_03: '**BOTH HALVES OF THIS ENTRY WERE WRONG AND ARE RETRACTED** (workflow lesson 15 / the framework''s
        "verify mechanics against runtime code" rule). It previously read: "Neither TBC 29759-29763 nor live carries a ShapeshiftMask,
        so the aura is unconditional in DATA on both sides despite both tooltips saying ''while in Berserker Stance''. The e2
        `ADD_FLAT misc 23 SPELLMOD_EFFECT3` -2..-10 (the threat-reduction half) is identical on both sides and is INERT on this
        core either way, because Berserker Stance 2458 has no effect 3 to modify. The real divergence is e1 only." The DECISION
        it fed (author e1 as aura 166 MOD_ATTACK_POWER_PCT) is unchanged and correct; everything else it said is not.'
      finding: '(1) THE STANCE GATE IS REAL, ON BOTH SIDES. Measured at Task 7 with tools/ dump_spell_effects.py against the
        running server''s Spell.dbc (md5 49c9c5f53e8974c27d67635384725f46): live 29759 and 29763 both carry **ShapeshiftMask
        = 262144** (0x40000 = Berserker Stance). This file''s OWN `tbc:` lines for all five ranks likewise read `shapeshiftMask=0x40000`,
        and the sweep''s I_shapeshift family reported NO difference on these ids — which is only consistent with both sides
        carrying it. (Contrast Berserker Rage 18499, where the same family DID print `ShapeshiftMask TBC0x40000->LIVE0x0`.)
        The era node therefore authors `stances: 262144`; authoring it unconditional would have made the era talent stronger
        than TBC *and* than the live WotLK talent on this very server. (2) THE THREAT HALF IS LIVE, NOT INERT — and the reason
        the old entry gave was a wrong-spell error. The e2 mask does not name the stance AURA: measured, stock 2458''s own identity
        is word A 0x800000 with word B = **0**, while the effect mask is word B **0x800**. A full sweep of the live Spell.dbc
