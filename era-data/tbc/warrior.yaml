      status: '**RESOLVED AND THE PREMISE RETRACTED at Task 7 (Fury authoring), 2026-09-03.** The question as posed does not
        exist: its premise ("Both TBC and live Improved Berserker Stance carry ShapeshiftMask 0") is FALSE on both sides. See
