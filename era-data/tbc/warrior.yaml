# --- Death Wish TBC clone 947548 (node 20312 grants it) — live 12292 DIVERGED. -------------------
# TBC Death Wish: +20% physical damage, IMMUNE TO FEAR, +5% damage taken, 30 s, 3 min cd, 10 rage.
# Live 12292 keeps e1 (+20% physical, aura79 misc1) and e3 (+5% damage taken, aura87 misc127)
# VERBATIM and drops ONLY e2 (aura77 MECHANIC_IMMUNITY misc5) — measured at Task 6 with
# tools/dump_spell_effects.py; see _ref node_buckets.clone[20312].why_correction_2026_09_02, which
# retracts the ref's original "live dropped e2 AND e3" reading and prints both raw values. So the
# thing a grant of stock would COST a TBC warrior is the fear immunity its own tooltip promises.
# Clone 12292 to inherit instant cast / RecoveryTime 180000 / ManaCost 100 (=10 rage) /
# DurationIndex 9 (30 s) / family 4 / SpellClassMask_1 0x100000 / Attributes 0x8040010 /
# AttributesEx 0x18000 / icon 169 — every one of which wago 2.5.4 and the live DBC AGREE on — and
# author the three TBC effects plus the two remaining scalar divergences:
#   * `mechanic: 0` — TBC 12292 has Mechanic 0; live added Mechanic 31 MECHANIC_ENRAGED (WotLK made
#     Death Wish an Enrage effect). Authoring 0 keeps the mechanic-keyed removal paths off it.
#   * `spellLevel: 1` / `baseLevel: 0` — TBC's own levels; live is 30/30.
# DISPEL CATEGORY (was _ref accepted_gaps id 5, CLOSED at Task 7): live 12292 carries `DispelType 9`
# (DISPEL_ENRAGE) where wago 2.5.4's is 0 — WotLK made Death Wish an Enrage effect and TBC's is
# neither Enrage-mechanic nor Enrage-dispellable. Task 6 could not express that (the generator had
# no `dispelType` key) and recorded it as a gap; Task 7 added the key (one line in
# `_HELPER_SCALARS`, TDD guard `test_helper_dispel_type_column`, byte-neutral for every shipped
# helper) and authors 0 here, so the clone is no longer strippable by a Tranquilizing Shot.
# Active castable -> client row with the cached TBC tooltip text + skillLine 256 (else a granted
# active lands in the client's General tab). No spellFixAck needed: SpellInfoCorrections.cpp
# contains no by-id fix for 12292 (grep-verified), and the family-4 sweep predicate keys on
# Category 132 while this clone inherits Category 0.
- id: 947548
  name: Death Wish
  template: 12292          # clone stock Death Wish (inherit cast/cd/cost/DurationIndex 9/family/mask/attrs/icon)
  mechanic: 0              # TBC Mechanic 0 (live 31 = MECHANIC_ENRAGED, a WotLK addition)
  dispelType: 0            # TBC DispelType 0 (live 9 = DISPEL_ENRAGE — see the block comment above)
  spellLevel: 1            # TBC SpellLevel 1 (live 30)
  baseLevel: 0             # TBC BaseLevel 0 (live 30)
  effects:
  - { effect: 6, aura: 79, misc: 1,   basePoints: 20,  dieSides: 0, targetA: 1 }  # +20% physical damage done
  - { effect: 6, aura: 77, misc: 5,   basePoints: 100, dieSides: 0, targetA: 1 }  # MECHANIC_IMMUNITY, MECHANIC_FEAR (5)
  - { effect: 6, aura: 87, misc: 127, basePoints: 5,   dieSides: 0, targetA: 1 }  # +5% ALL damage taken (all schools)
  client:
    name: Death Wish
    icon: 169             # stock Death Wish SpellIconID (12292, live DBC dump 2026-09-02)
    skillLine: 256        # Warrior skill line — else the granted active lands in the General tab
    description: "When activated, increases your physical damage by 20% and makes you immune to Fear effects, but increases all damage taken by 5%.  Lasts 30 sec."
    auraDescription: "Physical damage increased by 20%.  Immune to Fear.  All damage taken increased by 5%."
# --- Deep Wounds TBC bleed carrier 947551 (node 20308; era_deep_wounds casts it). ----------------
# TBC Deep Wounds = 20/40/60% of average melee weapon damage as a bleed over 12 sec, applied on a
# crit. The carrier 12721 diverges: TBC `period 3000 ms` over DurationIndex 29 (12 000 ms) = 4
# ticks; live is `period 1000 ms` over DurationIndex 32 (6 000 ms) = 6 ticks, and WotLK's % is of
# the TRIGGERING spell's damage. era_deep_wounds divides the rank total by GetMaxTicks(), so the
# per-tick value is right for any cadence — but the CADENCE itself is era content, so TBC needs its
# own carrier and CANNOT reuse the Vanilla clone 932800 (12 ticks; _ref reuse_ledger 932800: FRESH).
#
# FROM SCRATCH rather than `template: 12721`, for a reason that is functional and not cosmetic:
# live 12721 carries AttributesEx4 0x100 SPELL_ATTR4_IGNORE_DAMAGE_TAKEN_MODIFIERS and
# AttributesEx6 0x20000000 SPELL_ATTR6_IGNORE_CASTER_DAMAGE_MODIFIERS (both TBC-clear — see the
# survival_map entry for 12721), which exist because WotLK's bleed is a % of already-modified
# damage. A template clone would inherit both, and the generator has NO attributesEx4/attributesEx6
# key to clear them — and those two bits are exactly what would make the bleed IGNORE Blood
# Frenzy's own +2/4% physical damage taken (node 20318), i.e. silently break the tooltip of a
# different talent. Everything else is authored explicitly from TBC 12721's record.
#
# family 4 + maskB 16 is LOAD-BEARING and is the OPPOSITE of the Vanilla helper's deliberate
# family-LESS choice: TBC Blood Frenzy's aura-109 mask is (0x20, 0x10, 0) = Rend PLUS Deep Wounds'
# word-1 bit 4, and SpellInfo::IsAffected returns false outright when the tested spell's
# SpellClassSet differs, so a family-0 bleed would drop half of Blood Frenzy's trigger set.
# Nothing over-binds: the only other warrior masks touching word B are Impale 0x744 and Focused
# Rage 0x664, neither of which contains 0x10.
# Per-tick base point is set at cast time by era_deep_wounds (CastCustomSpell), so basePoints is 0.
- id: 947551
  name: Deep Wound          # TBC 12721's own name is singular ("Deep Wound"); live renamed it
  attributes: 16            # 0x10 SPELL_ATTR0_IS_ABILITY (TBC 12721 attr0)
  attributesEx2: 4          # 0x4 SPELL_ATTR2_IGNORE_LINE_OF_SIGHT (TBC 12721 attr2)
  durationIndex: 29         # 12 000 ms (TBC 12721; live idx 32 = 6 000)
  mechanic: 15              # MECHANIC_BLEED, spell-level, on BOTH sides
  family: 4                 # SPELLFAMILY_WARRIOR — required for Blood Frenzy's mask to match
  maskB: 16                 # SpellClassMask_2 bit 4 = Deep Wounds' own identity (stock 12721's)
  school: 1                 # physical
  castTimeIndex: 1          # instant
  rangeIndex: 13            # unlimited (TBC/live 12721)
  procChance: 101           # the DBC "not a proc" default, matching stock 12721
  spellLevel: 1             # TBC 12721 spellLevel
  spellVisual: 121          # stock 12721 SpellVisualID_1 — the physical-bleed impact kit
  effects:
  - { effect: 6, aura: 3, basePoints: 0, dieSides: 0, targetA: 6, amplitude: 3000 }  # PERIODIC_DAMAGE, 3 s ticks
  client:
    name: Deep Wound
    icon: 243               # stock Deep Wounds SpellIconID (12721, live DBC dump 2026-09-02)
    auraDescription: "Bleeding for physical damage every 3 sec."
# --- Mace Specialization TBC payload 947552 (node 20313 proc-triggers it). -----------------------
# TBC 5530 "Mace Stun Effect" = a 3 sec stun (e1 aura12 MOD_STUN, spell-level Mechanic 12,
# DurationIndex 27 = 3000 ms) PLUS the TBC-added `e2 SPELL_EFFECT_ENERGIZE val70 misc1` = 7 rage on
# the caster (rage is stored x10). The Wowhead TBC tooltip for 12284 confirms both halves: "chance
# to stun your target for 3 sec and generate 7 rage".
# FROM SCRATCH, not `template: 5530`: the live 5530 is a REPURPOSED id — a bare 100-value ENERGIZE
# named "Mace Specialization" (_ref id_repurposing) — so cloning it would seed the row from an
# unrelated spell's record. The Vanilla clone 932801 is NOT reusable either: it is stun-ONLY (the
# 7 rage is a TBC addition) and carries AttributesEx 0x0 against TBC's 0x40088
# (_ref reuse_ledger 932801: FRESH).
# Visible debuff -> client row, or the 3.3.5a client renders no debuff icon (the Blackout /
# Vanilla-Mace-Spec precedent).
- id: 947552
  name: Mace Stun Effect
  attributes: 0             # TBC 5530 attr0 = 0
  attributesEx: 262280      # TBC 5530 attr1 = 0x40088: NO_REDIRECTION(0x8) | NO_REFLECTION(0x80)
                            # | PREVENTS_ANIM(0x40000). Live 5530 carries only 0x88 — the third bit
                            # is TBC's, and the live row belongs to a repurposed spell anyway.
  durationIndex: 27         # 3 000 ms (== Hammer of Justice 853's index)
  mechanic: 12              # MECHANIC_STUN, spell-level (TBC's own encoding)
  school: 1                 # physical
  effects:
  - { effect: 6,  aura: 12, basePoints: 0,  dieSides: 0, targetA: 6 }            # MOD_STUN on the enemy, 3 s
  - { effect: 30, aura: 0,  basePoints: 70, dieSides: 0, misc: 1, targetA: 1 }   # ENERGIZE 7 rage (x10), POWER_RAGE, self
  client:
    name: Mace Stun Effect
    icon: 367               # stock 5530 SpellIconID (live DBC dump 2026-09-02)
    auraDescription: "Stunned."
