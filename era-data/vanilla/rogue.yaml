# --- Mace Specialization stun (node 18428 trigger) — Vanilla 3 sec stun. ------------------------
# Vanilla Mace Specialization procced a 3s stun. WotLK reworked the talent into a flat Armor
# Penetration passive (stock 12284 chain: aura 280 MOD_ARMOR_PENETRATION_PCT, dumped) with NO
# stun/trigger component at all, and `lookup spell Mace Stun` returns nothing (_ref.triggers) — so
# the 3s stun has ZERO stock support in 3.3.5a and MUST be authored (the _ref's explicit Task-4/7
# call). Mirrors the hunter Improved Concussive Shot stun 932971 / priest Blackout 932970 shape:
# aura 12 MOD_STUN, Mechanic 12 MECHANIC_STUN, DurationIndex 27 = 3000 ms (== Hammer of Justice
# 853, dump 2026-08-17), targetA 6 (enemy), physical school. A custom stun needs a client row or
# the 3.3.5a client renders no debuff icon (the Blackout precedent) — hence the client block.
- id: 932988
  name: Mace Specialization
  aura: 12                 # SPELL_AURA_MOD_STUN
  mechanic: 12             # MECHANIC_STUN (SharedDefines.h — NOT 7 = root)
  durationIndex: 27        # 3 sec (SpellDuration.dbc idx 27 = 3000; == Hammer of Justice 853)
  targetA: 6               # TARGET_UNIT_TARGET_ENEMY
  basePoints: -1           # stun carries no amount (Blackout/Concussive precedent)
  school: 1                # physical
  client:
    name: Mace Specialization
    icon: 302              # Hammer of Justice 853 SpellIconID (3s-stun analog, dump 2026-08-17)
    auraDescription: "Stunned."
# --- Hemorrhage 3-rank Vanilla trainer chain (node 18449 grants R1; R2/R3 trainer-taught). --------
# Stock 16511 is WotLK-tuned: 110% weapon (Effect_1=121 NORMALIZED_WEAPON_DMG 100% + Effect_2=31
# WEAPON_PERCENT_DAMAGE 110), NO combo point, +13/+13/+13 (r1/2/3 basePoints 12/20/28) flat physical
# debuff at ProcCharges=10 (dump 2026-08-17). Vanilla 1.12 Hemorrhage is 100% weapon, +1 combo point,
# +3/+5/+7 flat physical debuff at 30 charges / 15 sec (classic.wowhead 16511 = +3/1 CP; ranks 2/3 =
# 17347/17348 = +5/+7 trainer-taught L46/L58). The retail "dagger bonus" (132%/191%) is a HARDCODED
# script this fork lacks (no 16511 binding in spell_rogue.cpp), and there is NO dagger effect in the
# DBC — so a plain 100% strike needs only effect 121 with no % effect (Sinister Strike's exact
# vehicle). Each rank: CLONE 16511 (inherits melee-strike visual / 5yd range / weapon-req / energy 35
# / SpellClassSet 8 + mask bit 25 so Lethality & co. still apply / attributes / DurationIndex 8=15s),
# override all 3 effect slots + ProcCharges 30. Ranks differ ONLY in the debuff flat (+3/+5/+7).
