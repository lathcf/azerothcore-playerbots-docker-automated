    # that WotLK flat armor-pen % on the (wrong) premise that 3.3.5a has no level-scaled armor
    # primitive. It does, and it is the SAME encoding TBC's own row uses: **aura 123
    # SPELL_AURA_MOD_TARGET_RESISTANCE** with `EffectMiscValue` = **1** (SPELL_SCHOOL_MASK_NORMAL,
    # i.e. ARMOR — a school mask, not a stat index), `EffectBasePoints` 0 and the magnitude carried
    # on the FLOAT column `EffectRealPointsPerLevel`. `Unit::CalcArmorReducedDamage` sums the
    # ATTACKER's aura-123 total for SPELL_SCHOOL_MASK_NORMAL and adds it to the victim's armor, so a
    # NEGATIVE per-level amount is literally "ignore N armor per level". This is the identical shape
    # the TBC sibling node 20455 ships (-2.67/-5.34/-8.00), just at Vanilla's 1.12.1 magnitudes.
