    # spellmodPrecedents.Improved Eviscerate (misc 0 SPELLMOD_DAMAGE, maskA [131072]) at the
    # Vanilla values. BOUND-mod on stock Eviscerate (2098, bit 17).
    # `affectsMask:` (FIX ROUND 2026-09-06, F-2) — SHIPPED MASK = word-A **131072** (bit 17,
    # Eviscerate) ALONE. Eviscerate's FULL family identity is 8519680 = bit 17 | **bit 23
    # (8388608)**, and bit 23 is the SHARED "combo strike" bit every rogue finisher/combo-point
    # spender carries. `SpellInfo::IsAffected` ORs across the mask words and returns true on ANY
    # overlapping bit, so resolving the mask from `affects:` identity leaked this +5/10/15% onto
    # every combo strike (Sinister Strike, Rupture, Kidney Shot, Slice and Dice, ...). The stock
    # WotLK chain 14162-14164 authors exactly 131072 for the same reason. `affects:` is KEPT — it
    # drives the addon's spellMods name-map and the not-in-_ref lint; only the DBC mask changes.
    mechanic: spellmod
    affects: ["Eviscerate"]     # 2098, family 8 bit 131072 (_ref, dumped)
    affectsMask: {a: 131072}    # UNIQUE bit 17 only — bit 23 is the shared combo-strike bit (F-2)
    op: damage                  # SPELLMOD_DAMAGE (0)
    kind: pct
    vals: [5, 10, 15]
