  name: Hemorrhage
  template: 16511          # clone stock Hemorrhage rank 1
  procCharges: 30          # Vanilla 30 charges (stock = 10) — via the new procCharges scalar
  durationIndex: 8         # 15 sec (also inherited from 16511; explicit for clarity)
  effects:
  - { effect: 121, basePoints: 0, dieSides: 0, targetA: 6 }              # NORMALIZED_WEAPON_DMG = plain 100% weapon (no effect-31 %, no dagger scaling)
  - { effect: 80, basePoints: 0, dieSides: 1, targetA: 6 }               # ADD_COMBO_POINTS +1 (Sinister/Ghostly Strike encoding: base 0, die 1)
  - { effect: 6, aura: 14, misc: 1, basePoints: 2, dieSides: 1, targetA: 6 }  # APPLY_AURA MOD_DAMAGE_TAKEN +3 physical (misc 1)
  client:
    name: Hemorrhage
