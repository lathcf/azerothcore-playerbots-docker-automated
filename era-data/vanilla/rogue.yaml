    - Increases the damage done by your Eviscerate ability by 10%.
    - Increases the damage done by your Eviscerate ability by 15%.
    # AUTHORED (spellmod) — verdict 2026-08-17. Stock WotLK 14162-14164 DIVERGED (dump: aura 108
    # ADD_PCT_MODIFIER, misc 0 SPELLMOD_DAMAGE, mask 131072 = Eviscerate, basePoints 6/13/19 ->
