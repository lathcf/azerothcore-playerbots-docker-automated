# --- Preparation Vanilla clone (node 18447 grants R1) — resets Blind too. -------------------------
# Stock Preparation 14185's cooldown reset is a HARDCODED C++ SpellScript (spell_rog_preparation,
# spell_rogue.cpp:455) that resets Cold Blood/Shadowstep/Vanish/Evasion/Sprint but NOT Blind — WotLK
# dropped Blind from the set. Vanilla's Preparation reset Vanish/Evasion/Sprint/Cold Blood/BLIND.
# Editing stock 14185 (or its core script) is GLOBAL — it would change Preparation for WotLK-stage
# chars too (eras are per-character, spells/scripts are global). So: CLONE 14185 -> band helper 932983
# (template inherits instant cast / 8-min RecoveryTime / SpellClassSet 8 / attributes; the single
# authored Effect_1 = 3 SPELL_EFFECT_DUMMY targetA 1 = the caster-self DUMMY the script hooks) and
# bind the module SpellScript era_rog_preparation to it (scriptBindings below). That script replays
# the stock reset mask OR'd with Blind's bit 0x01000000 (flags[0]), so the clone resets all FIVE
# Vanilla abilities. client row -> Subtlety tab (skillLine 39, like the Hemorrhage clones) + the
# stock Preparation icon 207 (dump 2026-08-17).
- id: 932983
  name: Preparation
  template: 14185          # clone stock Preparation (inherit instant/family/attributes)
  cooldown: 600000        # Vanilla 10-min cooldown (stock 14185 RecoveryTime 480000 = WotLK 8 min; Category 0 so cd lives purely in RecoveryTime — no category neutralization needed, the Adrenaline Rush 932770 precedent)
  effects:
  - { effect: 3, basePoints: 0, dieSides: 0, targetA: 1 }   # SPELL_EFFECT_DUMMY on the caster (the script's hook)
  client:
    name: Preparation
    icon: 207             # stock Preparation SpellIconID (dump 2026-08-17)
    skillLine: 39         # Subtlety tab (SkillLineAbility ClassMask 8; matches the Hemorrhage clones)
    description: "When activated, this ability immediately finishes the cooldown on your Vanish, Evasion, Sprint, Cold Blood, and Blind abilities."
# --- Adrenaline Rush Vanilla clone (node 18434 grants it) — WotLK 13750 cd DIVERGED. ---------------
# Vanilla Adrenaline Rush (Wowhead Classic 13750, verified 2026-08-18): Instant, 5 min cooldown,
# +100% Energy regeneration for 15 sec. WotLK 13750 (DBC dump 2026-08-18) is IDENTICAL except the
# cooldown was shortened to 3 min (RecoveryTime 180000). The +100% energy aura is a self-contained
# data spell — Effect_1 aura 110 MOD_POWER_REGEN_PERCENT, misc 3 = POWER_ENERGY, +100%, DurationIndex
# 8 = 15s; NOT script-bound (grep spell_rogue.cpp: 13750 absent). So a pure data clone is faithful,
# unlike Preparation 14185 (script-bound). Overriding stock 13750 is era-unsafe (Spell.dbc is global),
# so clone it -> band helper 932770 and override ONLY the cooldown. The cd lives purely in RecoveryTime
# (Category 0 / CategoryRecoveryTime 0 in stock 13750 — no category neutralization needed, unlike the
# Arcane Power 932760 / Last Stand 932840 category clones); set cooldown: 300000 = Vanilla 5 min.
# Active castable -> client row w/ Vanilla text + SkillLine 38 (Combat; SkillLineAbility 13750 -> 38,
# dump 2026-08-18) so it tabs into the Combat page. Stock 13750 ships UNTOUCHED for WotLK-stage rogues
# (they keep the 3-min cd); a reconcile strip removes stale 13750 off Vanilla rogues (EraTalents.cpp
# CLASS_ROGUE block). Same grant-change pattern as the mage Arcane Power 932760 / rogue Preparation.
- id: 932770
  name: Adrenaline Rush
  template: 13750         # clone stock Adrenaline Rush (inherit Effect_1 aura 110 +100% energy, instant, free, family 8, DurationIndex 8=15s, icon)
  cooldown: 300000        # Vanilla 5-min cooldown (stock RecoveryTime 180000 = 3 min); Category/CategoryRecoveryTime already 0
  effects:               # byte-identical to stock 13750 Effect_1 (dump 2026-08-18): +100% energy regen
  - { effect: 6, aura: 110, basePoints: 99, dieSides: 1, misc: 3, targetA: 1 }   # MOD_POWER_REGEN_PERCENT +100% (base 99 + d1 -> 100), POWER_ENERGY (misc 3), self
  client:
    name: Adrenaline Rush
    icon: 235            # stock Adrenaline Rush SpellIconID (13750 dump 2026-08-18)
    skillLine: 38        # Combat tab (SkillLineAbility 13750 -> SkillLine 38; dump 2026-08-18) — else the granted active lands in the General tab
    description: "Increases your Energy regeneration rate by 100% for 15 sec."
    auraDescription: "Energy regeneration increased by 100%."
# --- Riposte Vanilla clone 932989 (node 18423 grants it) — the SHIPPED-DEFECT FIX, 2026-09-03. ----
# FIX ROUND. Node 18423 shipped GRANTING stock 14251 behind the comment "Stock Riposte is unchanged
# Vanilla->WotLK (150% weapon damage, 6s disarm...)". That claim is FALSE and was caught by the TBC
# Combat-tab sweep (era-data/_ref/tbc/rogue-spells.yaml node_findings[20428], which recorded it as a
# cross-era report). Live 14251 raw dump (azerothcore-wotlk/ip-dbc/Spell.dbc, 2026-09-03) is WotLK
# 3.0.2's retune and has NO disarm at all:
#   Effect_1 = 31 WEAPON_PERCENT_DAMAGE, bp 149 / die 1  -> 150% weapon damage   (SAME in Vanilla)
#   Effect_2 = 6 APPLY_AURA, aura 138 MOD_MELEE_HASTE, bp -21 / die 1 -> -20% melee attack speed,
#              EffectMechanic_2 = 8 MECHANIC_SLOW_ATTACK, DurationIndex 9 = 30000 ms (30 sec)
#   Effect_3 = 80 ADD_COMBO_POINTS, bp 0 / die 1 -> +1 combo point               (ABSENT in Vanilla)
# So a Vanilla-era rogue was getting WotLK's 30-second attack-speed slow plus a free combo point,
# behind a panel tooltip promising a 6-second disarm.
# VANILLA 1.12.1 Riposte = 150% weapon damage + DISARM 6 sec, no combo point. Evidence: the Daribon
# 1.12.1 import that seeded this dataset — era-data/_skeletons/vanilla-rogue.skeleton.yaml node
# 18423 tooltip, verbatim "10 Energy 5 yd range Instant 6 sec cooldown A strike that becomes active
# after parrying an opponent's attack. This attack deals 150% weapon damage and disarms the target
# for 6 sec." — which is also the node's own shipped `tooltip:` text. Every header number in that
# line (10 energy, 5 yd, instant, 6 sec cooldown) matches stock 14251 exactly (ManaCost 10 /
# PowerType 3 / RangeIndex 2 / CastingTimeIndex 1 / RecoveryTime 6000, same dump), so the ONLY
# divergences are Effect_2, its EffectMechanic, the DurationIndex, and the presence of Effect_3.
# Editing stock 14251 is era-unsafe (Spell.dbc is global; eras are per-character), so this is a
# CLONE — the same shape and the same values as the TBC clone 947777 shipped at Task 7 (TBC did not
# change Riposte either; 2.5.4 == 1.12.1 here), just in the Vanilla helper band.
# INHERITED and deliberately not authored (all from the template): Attributes 327696 / AttributesEx
# 131584 / AttributesEx4 512, **CasterAuraState 1** (AURA_STATE_DEFENSE = "becomes active after
# parrying" — the whole gate), ManaCost 10 + PowerType 3 (energy), RecoveryTime 6000, RangeIndex 2,
# CastingTimeIndex 1, DefenseType 2, PreventionType 2, the 133/1000 ms GCD category, SpellClassSet 8
# + SpellClassMask_2 256 (the "Riposte" identity bit), and SpellIconID 278.
# THE IDENTITY BIT IS INHERITED BUT BEHAVIOURALLY INERT FOR VANILLA — do not repeat the TBC clone's
# load-bearing framing here, it is a different tree. Measured 2026-09-03: `SELECT ... FROM spell_dbc
# WHERE SpellClassSet=8 AND (EffectSpellClassMask{A,B,C}_2 & 256)` on the live world DB returns ONLY
# the five TBC Find Weakness helpers 947768-947772 — no Vanilla-band rogue spell binds word-2 bit 8
# at all. Vanilla Lethality (node 18409) authors its mask from `affects:` NAMES ("Sinister Strike",
# "Gouge", "Backstab", "Ghostly Strike", "Hemorrhage"), which is Riposte-free and correct for 1.12.1
# (Vanilla Lethality never listed Riposte; the word-2 bit 8 in LIVE 14128's mask is WotLK's
# addition), and Aggression's mask is word-1 only. So the bit is kept because it is the faithful
# inheritance and keeps the clone identifiable as Riposte to any future family-mask consumer — NOT
# because some era spellmod needs it.
# `durationIndex: 32` = 6000 ms, read straight out of the live client table (SpellDuration.dbc pulled
# from ac-worldserver 2026-09-03: id 32 -> 6000, id 9 -> 30000). Same index the TBC clone uses.
# EFFECT SLOTS — a templated helper writes every slot it lists and 0-fills the rest, which is exactly
# what Vanilla needs: e1 kept byte-identical to stock, e2 replaced with the disarm, e3 DROPPED (no
# combo point). `mechanic: 3` is the PER-EFFECT EffectMechanic key and is load-bearing: it feeds
# Unit::IsImmunedToSpellEffect (per effect index) and SpellMgr::GetDiminishingReturnsGroupForSpell
# (-> DIMINISHING_DISARM), and a clone that omitted it would INHERIT live's 8 MECHANIC_SLOW_ATTACK,
# so a disarm-immune boss would be tested for slow-attack immunity and the disarm would land in the
# wrong DR group. The spell-level `mechanic:` scalar is the WRONG tool here (it applies to the whole
# spell, so a disarm-immune target would also become immune to the 150%-weapon-damage half).
# NO `scriptBindings:` — `spell_script_names` has no row for 14251 (live table queried 2026-09-03),
# so no core script is lost by cloning. No `spellFixAck:` — SpellInfoCorrections.cpp carries no entry
# for 14251 (grepped 2026-09-03), so there are no by-id fixes for the clone to miss (lesson 14).
# `client.description` AND `client.auraDescription` are both MANDATORY (lesson 17d): the panel
# hyperlinks the granted spell and renders its client-DBC text, and without the aura text the 6-sec
# debuff tooltip would read live's "Melee attack speed slowed by $s2%."
# Stock 14251 ships UNTOUCHED for WotLK-stage rogues; EraTalents.cpp's CLASS_ROGUE arm strips a stale
# stock 14251 off a Vanilla rogue that learned Riposte before this fix (lesson 17f grant-change
# strip, alongside the Preparation 14185 / Adrenaline Rush 13750 strips).
- id: 932989
  name: Riposte
  template: 14251           # stock Riposte — inherit the parry gate, energy, range, cooldown, identity bit
  durationIndex: 32         # 6000 ms (Vanilla 6-sec disarm); live 14251 carries 9 = 30000 ms
  effects:
  - { effect: 31, basePoints: 149, dieSides: 1, targetA: 6 }                        # 150% weapon damage (byte-identical to stock)
  - { effect: 6, aura: 67, basePoints: 0, dieSides: 0, mechanic: 3, targetA: 6 }    # MOD_DISARM, EffectMechanic 3 = MECHANIC_DISARM
  client:
    name: Riposte
    icon: 278               # stock Riposte SpellIconID (14251, live DBC dump 2026-09-03)
    skillLine: 38           # Combat tab (SkillLineAbility row 7816: 14251 -> SkillLine 38, dump
                            # 2026-09-03) — without it the granted active lands in the General tab
    description: "A strike that becomes active after parrying an opponent's attack.  This attack deals $s1% weapon damage and disarms the target for $d."
    auraDescription: "Disarmed."
# --- Premeditation Vanilla clone 932984 (node 18451 grants it) — WotLK 14183 window DIVERGED. ------
# FIX ROUND 2026-09-06 (G-39; accepted gap CLOSED, owner-approved). The node shipped GRANTING stock
# 14183 and recording a NAMED MINOR DEVIATION: live's combo-retention window is DurationIndex 18 =
# 20 000 ms against Vanilla's 10 000 ms. "Strictly more lenient" was the reason to accept it; the
# clone is cheap, so the deviation is retired instead.
# CLONE, not authored: `template: 14183` inherits everything that is identical across the two eras
# and is the part a from-scratch helper would get wrong — Attributes/AttributesEx (incl. the
# **ShapeshiftMask 536870912 "Requires Stealth" gate**), RangeIndex, the GCD category, SpellClassSet
# 8 + **SpellClassMask_2 32 (word-1 bit 5, the Premeditation identity bit)** and SpellIconID 98.
# The identity bit is load-bearing HERE TOO, and for the same reason as on the TBC clone 947787:
# the Vanilla Preparation clone 932983's bound script `era_rog_preparation` resets by a FAMILY-FLAG
# WALK, so any Premeditation the rogue owns must keep that bit to stay reachable by a mask test.
# `durationIndex: 1` = 10 000 ms — the ONE override, and the whole point of the clone. (Index 1 is
# the same row TBC 947787 uses; SpellDuration.dbc idx 1 -> 10000.)
# `cooldown: 120000` = Vanilla's 2-min RecoveryTime — the SECOND override, and a real divergence the
# 2026-08-17 verdict missed when it recorded the retain window as the only one. Stock 14183 carries
# RecoveryTime **20 000** (20 s), which is WotLK 3.0.2's shortening; 1.12.1 Premeditation is on a
# 2-minute cooldown, and the TBC sibling 947787 authors the same `cooldown: 120000` off the TBC
# record — the ability was untouched between the two eras, so the figure cross-checks. Without this
# a Vanilla rogue would open with Premeditation six times as often as the era allows, which is a
# far larger deviation than the 10 s window this clone was minted to fix. Category /
# CategoryRecoveryTime are already 0 on stock 14183, so the cooldown lives purely in RecoveryTime
# and no category neutralisation is needed (the Adrenaline Rush 932770 / Preparation 932983
# precedent).
# Effect slots are re-authored byte-identically to stock (lint requires `effects:` on a templated
# helper, and a templated helper 0-fills every slot it omits): e1 eff80 ADD_COMBO_POINTS raw bp 1 /
# dieSides 1 = 2 points on the TARGET (targetA 6), e2 aura 148 RETAIN_COMBO_POINTS on SELF.
# No `scriptBindings:` — `spell_script_names` has NO row for 14183 (the TBC slice re-queried the
# live table 2026-09-03 and it returned only -31228/-13983/14185 out of this tab's ids), so cloning
# loses no core script. No `spellFixAck:` — SpellInfoCorrections carries no entry for 14183.
# `client.description` is stock 14183's OWN text verbatim, substitutions included: `$s1` and `$d`
# resolve against THIS row, so it renders "2 combo points" and "10 sec" by itself — hardcoding the
# numbers would only make it go stale. `client.auraDescription` is authored even though stock
# 14183's is EMPTY (lesson 17d): the clone applies a VISIBLE 10 s aura (no PASSIVE/DO_NOT_DISPLAY
# bit) and an empty AuraDescription leaves that buff tooltip blank.
# `skillLine: 39` = Subtlety (stock SkillLineAbility row 8077: 14183 -> SkillLine 39) — without it
# the granted active lands in the General tab (the Riposte 932989 lesson).
# Stock 14183 ships UNTOUCHED for WotLK-stage rogues; EraTalents.cpp's CLASS_ROGUE arm strips a
# stale stock 14183 off a Vanilla rogue that learned Premeditation before this fix (lesson 17f
# grant-change strip, alongside the Preparation 14185 / Adrenaline Rush 13750 / Riposte 14251
# strips).
- id: 932984
  name: Premeditation
  template: 14183           # stock Premeditation — inherit the stealth gate, range, identity bit, icon
  durationIndex: 1          # 10 000 ms combo-point retain window (live 18 = 20 000 ms)
  cooldown: 120000          # Vanilla 2-min RecoveryTime (live 20000 = 20 s, WotLK 3.0.2's shortening)
  effects:
  - { effect: 80, basePoints: 1, dieSides: 1, targetA: 6 }              # ADD_COMBO_POINTS -> 2, on the target
  - { effect: 6, aura: 148, basePoints: 1, dieSides: 1, targetA: 1 }    # RETAIN_COMBO_POINTS, self
  client:
    name: Premeditation
    icon: 98                # stock Premeditation SpellIconID (14183, live DBC dump 2026-09-03)
    skillLine: 39           # Subtlety (SkillLineAbility row 8077)
    description: "When used, adds $s1 combo points to your target.  You must add to or use those combo points within $d or the combo points are lost."
    auraDescription: "Your combo points will not be lost."
scriptBindings:
# Preparation clone -> era_rog_preparation (resets the Vanilla 5 incl. Blind; see helper 932983).
- { spell: 932983, script: era_rog_preparation }
# Vanilla Sap breaks stealth + Improved Sap (node 18444). era_rog_sap_stealth (SpellScript,
# EraTalentProcScripts.cpp) binds to EVERY stock Sap rank; on a Vanilla-era rogue's Sap it rolls the
# Improved Sap misc-14 marker chance (30/60/90) to STAY stealthed, else breaks stealth. Era-gated
# (EraFromIP == ERA_VANILLA) so WotLK/TBC Sap is untouched; inert without the era. All four ranks are
# bound explicitly (Sap 2070/6770/11297/51724, family 8 bit 128 — _ref) so coverage never depends on
# DBC rank-chaining.
- { spell: 2070,  script: era_rog_sap_stealth }   # Sap rank 1
- { spell: 6770,  script: era_rog_sap_stealth }   # Sap rank 2
- { spell: 11297, script: era_rog_sap_stealth }   # Sap rank 3
- { spell: 51724, script: era_rog_sap_stealth }   # Sap rank 4 (WotLK rank; era-gated so still inert off-Vanilla)
