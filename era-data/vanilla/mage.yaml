  # **FAMILY IDENTITY = family 3 + WORD 2 (`maskC`) BIT 6 (64)** — the reserved pseudo-bit
  # Permafrost 18039 binds so it can extend/deepen this chill alongside Frostbolt's and Cone of
  # Cold's. It moved here in the R1 fix pass (2026-09-06): the helpers previously claimed WORD 0
  # bit 28 (268435456), which is **Mage Armor's** identity (6117/22782/22783/27125/43023/43024,
  # censused from ip-dbc/Spell.dbc) — NEVER recycle that bit. No word-0 bit is free in family 3, but
  # word 2 bits 6-30 are: the only stock family-3 word-2 bits in use are 0 (Winter's Chill 12579),
  # 1, 2, 3 (the big shared category bit), 4, 5 and 31, and NO stock family-3 spellmod's word-2 mask
  # sets bit 6 either — both censused before the move. The TBC twins 948961-948963 carry the same
  # bit.
