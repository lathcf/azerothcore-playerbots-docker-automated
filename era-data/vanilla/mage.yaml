  # --- Combustion 932325 (node 18032 grants it) ---------------------------------------------------
  # ADDED 2026-09-05 (TBC Phase 9 re-audit, vanilla_fix_rows[18032]; USER DECISION — ships this
  # generation). The node GRANTED stock 11129, which live retuned twice over: `RecoveryTime 120000`
  # (2 min) where wago 2.5.4 has 180000 (3 min), and `e1` turned into `aura 108 ADD_PCT_MODIFIER
  # misc 15 SPELLMOD_CRIT_DAMAGE_BONUS +50%` where the era record is a BARE `aura 4` DUMMY at 0.
  # The shipped node's own tooltip already described the era version (3 crits, no crit-damage half),
  # so the grant was contradicting its own text. Same recipe as the TBC twin 948887.
  # `e2` KEEPS `SPELL_EFFECT_TRIGGER_SPELL -> 28682` — the stacking crit buff is the same spell in
  # both eras, is already in the client DBC, and keeps its own `spell_mage_combustion_proc` binding.
  # `dispelType: 0` reproduces `SpellInfoCorrections.cpp:1055` (`{11129} Dispel = DISPEL_NONE`), a
  # by-id fix a clone never inherits (workflow lesson 14).
  # SCRIPT REBIND IS MANDATORY: `spell_mage_combustion` is bound to the POSITIVE id 11129, so it is
  # absent on a clone — and its `DoCheckProc` IS the mechanic (add a 28682 stack and REFUSE the
  # charge on a non-crit; let the charge drop on a crit). See `scriptBindings:` below.
  # OWN `spell_proc` row copying the stock POSITIVE-id row 11129 verbatim (a clone inherits none):
  # school 4, family 3, mask (146800663, 200776, 0), ProcFlags 0 -> the DBC ProcTypeMask 65536,
  # SpellTypeMask 1, SpellPhaseMask 2, HitMask 0, Chance 0 (core seeds 100 from the DBC), Charges 0
  # -> the DBC's ProcCharges 3 (`SpellMgr.cpp:2081-2082`).
  # RECORDED RESIDUALS (neither is an era magnitude): the census mask is LIVE's fire set (its word1
  # bit 6 is Blast Wave, which the Vanilla clones keep); and `spell_mage_combustion_proc`, bound to
  # the global 28682, removes the STOCK 11129 when the crit stack is cancelled, so that one cleanup
  # path no longer reaches an era mage's Combustion.
  # `attributesEx3: 0` IS AUTHORED (workflow lesson 17c). Live 11129 carries `0x4000000`
  # SPELL_ATTR3_CAN_PROC_FROM_PROCS where wago 2.5.4 carries **0** — a WotLK addition that lets
  # TRIGGERED casts drive the aura's proc, so inheriting it would let Ignite ticks and Blizzard's
  # 42208 build and burn Combustion's three charges. Live's AttributesEx3 is exactly that one bit,
  # so authoring 0 clears it and nothing else. Same authored value as the TBC twin 948887.
  - id: 932325
    name: Combustion
    template: 11129
    cooldown: 180000     # 3 min (live 120000)
    attributesEx3: 0     # wago 11129 = 0; live's 0x4000000 CAN_PROC_FROM_PROCS is a WotLK addition
    dispelType: 0        # SpellInfoCorrections.cpp:1055 sets DISPEL_NONE on 11129 by id
    procCharges: 3       # 3 fire crits; authored explicitly because the charge window IS the spell
    spellFixAck: >-
      SpellInfoCorrections.cpp:1055 sets `Dispel = DISPEL_NONE` on stock 11129 BY ID, and a clone
      never receives a by-id fix. The POST-FIX VALUE IS AUTHORED on this helper (`dispelType: 0`
      above) — `Dispel` simply has no entry in era_audit's `_SPELLFIX_KEYABLE` table, so the check
      cannot see that the key is already set and falls through to the acknowledge-only branch.
      Nothing is waived.
    effects:
    - { effect: 6, aura: 4, basePoints: 0, targetA: 1, maskA: 12582935, maskB: 0, maskC: 0 }
    - { effect: 64, trigger: 28682, targetA: 1 }
    proc:
      flags: 65536       # = the clone's inherited DBC ProcTypeMask (the stock row's ProcFlags is 0)
      school: 4
      typeMask: 1
      phaseMask: 2
      hitMask: 0
      attrMask: 0
      chance: 0          # stock row; the core seeds from the DBC ProcChance (100)
      affectsMask: { a: 146800663, b: 200776, c: 0 }   # census row 11129 verbatim
    client:
      name: Combustion
      icon: 33           # stock 11129 SpellIconID
      skillLine: 8       # Fire tab
      # Era tooltip wording — "3 critical strikes", not live's "3 non-periodic critical
      # strikes". Behaviour is unchanged: the proc row's ProcTypeMask 65536 is
      # DONE_SPELL_MAGIC_DMG_CLASS_NEG, which periodic damage never raises, so no DoT tick
      # can spend a charge and the qualifier the WotLK text adds is already implied.
      description: "When activated, this spell causes each of your Fire damage spell hits to increase your critical strike chance with Fire damage spells by $28682s1%.  This effect lasts until you have caused 3 critical strikes with Fire spells."
  # --- Winter's Chill debuff 932764 (node 18048 triggers it) --------------------------------------
  # ADDED 2026-09-05 (TBC Phase 9 re-audit, vanilla_fix_rows[18048]). The node triggered STOCK 12579
  # while its tooltip promised "+2% ... a Frost spell will critically hit ... Stacks up to 5 times".
  # Live 12579 is `aura 179 MOD_ATTACKER_SPELL_CRIT_CHANCE misc **126** val **1**` — +1% crit taken,
  # ALL schools — where wago 2.5.4 12579 is `misc 16` (frost) `val 2`. So the shipped node advertised
  # the era debuff and delivered the WotLK one, at half the magnitude and the wrong scope. Everything
  # else (`durIdx 8` = 15 s, `CumulativeAura 5`, school 16, `targetA 6`, family 3,
  # `attributes 0x800000`) is identical in both stores. Stock 12579 ships untouched.
  # PER-ERA IDENTITY: the TBC node 20862 uses its OWN clone 948960 in the TBC slice — never share.
  #
  # **`singleAuraStack: true` IS LOAD-BEARING AND IS NOT INHERITED.** `SpellMgr.cpp:3752` applies
  # `SPELL_ATTR0_CU_SINGLE_AURA_STACK` to **12579 BY ID** (workflow lesson 14): without it every
  # caster owns a separate aura and `Aura::CanStackWith` REPLACES a rival mage's stack instead of
  # incrementing one shared 5-stack debuff. The generator emits the `spell_custom_attr` row for it.
  #
  # NO `spell_proc` row on the debuff: it is a plain aura-179 debuff that never procs, and stock
  # 12579 has none either. The `-11180` contract belongs to the TALENT, which node 18048 carries.
  # (The ref's own `vanilla_fix_rows[18048].fix` said "give it its own `spell_proc` row" — the same
  # slip Amendment C.3 corrected for Fire Vulnerability; corrected in the ref in this commit.)
  # INHERITED BY DECISION (the C.3 precedent): live 12579's `AttributesEx2 0x4` (IGNORE_LINE_OF_SIGHT)
  # and `AttributesEx3 0x40020000` (incl. SUPPRESS_TARGET_PROCS) are proc-loop / LoS engine guards on
  # a PROC-APPLIED debuff, not era magnitudes; clearing them would let the debuff's own application
  # drive further procs. Same for the inherited `SpellClassMask_3 = 1` — no mask in either era's mage
  # tree binds family word 2.
  # The client text is AUTHORED, not inherited: live 12579's Description hardcodes the foreign id
  # `$12579s1` (workflow lesson 7), which on a clone would render STOCK's 1% forever.
  - id: 932764
    name: Winter's Chill
    template: 12579
    school: 16           # frost (identical in both stores; authored for the record)
    durationIndex: 8     # 15 s (identical in both stores)
    stackAmount: 5       # CumulativeAura (identical in both stores)
    attributes: 8388608  # 0x800000 — the era's own Attributes word (identical to live)
    singleAuraStack: true  # SpellMgr.cpp:3752 gives stock 12579 this BY ID; a clone does not inherit it
    effects:
    - { effect: 6, aura: 179, basePoints: 2, misc: 16, targetA: 6 }   # MOD_ATTACKER_SPELL_CRIT_CHANCE, frost, +2%
    client:
      name: Winter's Chill
      icon: 187          # stock 12579 SpellIconID
      description: "Increases the chance a Frost spell will critically hit the target by 2% for 15 sec.  Stacks up to 5 times."
      auraDescription: "Frost spells have a 2% additional chance to critically hit.  Stacks up to 5 times."
