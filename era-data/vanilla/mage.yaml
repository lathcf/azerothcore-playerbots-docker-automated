  # 12484/12485/12486 is only 25/40/50%. MOD_DECREASE_SPEED (aura 33) on the enemy (target 6),
  # frost school, Mechanic 11 (snare) so Frostbite/Winter's Chill/Permafrost treat it as a chill,
  # DurationIndex 65 (1.5s, refreshes each Blizzard tick — same as retail).
