    misc: 4        # SPELL_SCHOOL_MASK_FIRE
    durationIndex: 9
    client: { name: "Fire Ward Reflect", icon: 16 }    # stock Fire Ward 543 SpellIconID
  - id: 932991
    name: "Frost Ward Reflect"
