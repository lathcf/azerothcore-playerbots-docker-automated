  # --- Arcane Power Vanilla clone 932760 (node 18016 grants it) — WotLK 12042 MAGNITUDE + cd DIVERGED. -
  # Vanilla Arcane Power (warcraft.wiki.gg / Wowhead Classic 12042, verified 2026-08-18): Instant,
  # 3 min cooldown, spells deal +30% damage while costing +30% mana, 15 sec. WotLK 12042 (DBC dump
  # 2026-08-18) was retuned DOWN to +20%/+20% and its cooldown shortened to 2 min (RecoveryTime 120000).
  # 12042 is a self-contained data spell — NOT script-bound (grep spell_mage.cpp 2026-08-18: 12042 absent;
  # the only references are a durotar buff-detection list + a SpellInfoCorrections category comment) — so
  # a pure data clone is faithful, unlike Cold Snap 11958 / Combustion 11129 (both script-bound —
  # both have SINCE been cloned anyway, 932325 in the Phase 9 re-audit and 932335 in the 2026-09-06
  # final review, each with a script rebind of its own). Its three effects are all aura 108 ADD_PCT_MODIFIER, each with its OWN
  # per-effect class mask selecting a different slice of the mage's spells: Effect_1 misc 0 SPELLMOD_DAMAGE
  # (direct damage, mask A), Effect_2 misc 14 SPELLMOD_COST (mana cost, mask B), Effect_3 misc 22
  # SPELLMOD_DOT (periodic damage, mask C) — the WotLK engine split "+X% damage" into direct+DoT because a
  # single op-0 mod does not scale DoT ticks. Vanilla's "+30% damage" must likewise cover DoTs, so all
  # THREE effects go to +30%. Overriding stock 12042 is era-unsafe (Spell.dbc is global), so clone it:
  # helper_overrides does NOT touch EffectSpellClassMask*, so the three masks A/B/C (and SpellClassSet 3,
  # DurationIndex 8 = 15s, attrs, icon) pass through the cloned template row; the effects list keeps 12042's
  # exact ordering so mask A->damage, B->cost, C->dot stay aligned. Override ONLY the three magnitudes to
  # +30% (base 29 + d1 -> 30, the Last Stand base-29 precedent) and the cooldown: neutralize the inherited
  # Category 1151 (category:0 + categoryCooldown:0, the Last Stand 932840 / Aimed Shot 932952 precedent) so
  # the Vanilla 3-min cd lives purely in RecoveryTime. Active castable -> client row w/ Vanilla text +
  # SkillLine 237 (Arcane; SkillLineAbility 12042 -> 237, dump 2026-08-18) so it tabs into the Arcane page.
  # Stock 12042 ships UNTOUCHED for WotLK-stage mages; a reconcile strip removes stale 12042 off Vanilla
  # mages (EraTalents.cpp CLASS_MAGE block).
  - id: 932760
    name: Arcane Power
    template: 12042       # clone stock Arcane Power (inherit the 3 aura-108 effects' class masks A/B/C, family 3, DurationIndex 8=15s, attrs, icon)
    category: 0          # neutralize inherited Category 1151 (else the category cd path still gates)
    categoryCooldown: 0  # neutralize inherited CategoryRecoveryTime 15000 — cd lives purely in RecoveryTime
    cooldown: 180000     # Vanilla 3-min cooldown (stock RecoveryTime 120000 = 2 min)
    effects:             # +30%/+30%/+30% (base 29 + d1 -> 30); each slot's class mask + misc match 12042's effect order
    - { effect: 6, aura: 108, basePoints: 29, dieSides: 1, misc: 0,  targetA: 1 }   # +30% direct spell damage (SPELLMOD_DAMAGE, mask A)
    - { effect: 6, aura: 108, basePoints: 29, dieSides: 1, misc: 14, targetA: 1 }   # +30% mana cost (SPELLMOD_COST, mask B)
    - { effect: 6, aura: 108, basePoints: 29, dieSides: 1, misc: 22, targetA: 1 }   # +30% periodic/DoT damage (SPELLMOD_DOT, mask C)
    client:
      name: Arcane Power
      icon: 62           # stock Arcane Power SpellIconID (12042 dump 2026-08-18)
      skillLine: 237     # Arcane skill line (SkillLineAbility 12042 -> 237; dump 2026-08-18) — else the granted active lands in the General tab
      description: "When activated, your spells deal 30% more damage while costing 30% more mana to cast. This effect lasts 15 sec."
      auraDescription: "Spell damage increased by 30%. Mana cost increased by 30%."
  # --- Presence of Mind Vanilla clone 932761 (node 18013 grants it) — WotLK 12043 cd DIVERGED. ------
  # Vanilla Presence of Mind (12043, 1.12.1 client Spell.dbc): Instant, 3-min cooldown, your next Mage
  # spell with a cast time < 10s becomes an instant cast. WotLK 12043 (DBC dump 2026-08-24) shortened
  # the cooldown to 2 min (RecoveryTime 120000). Like Arcane Power 12042, PoM is a self-contained data
  # spell — NOT script-bound (grep spell_mage.cpp 2026-08-24: 12043 absent) — so a pure data clone is
  # faithful (unlike the script-bound Cold Snap 11958 / Combustion 11129, which needed a script
  # rebind alongside their clones 932335 / 932325). The MECHANIC
  # is unchanged Vanilla->WotLK; only the cooldown differs, so the clone overrides ONLY the cooldown and
  # INHERITS 12043's single instant-cast SPELLMOD effect (Effect_1 aura 108, op SPELLMOD_CASTING_TIME
  # -100%) + ProcCharges 1 via the template (no effects: list). Neutralize the inherited Category 1151
  # (category:0 + categoryCooldown:0, the Arcane Power 932760 precedent) so the Vanilla 3-min cd lives
  # purely in RecoveryTime. Client row w/ Vanilla text + SkillLine 237 (Arcane; matches Arcane Power) so
  # the granted active tabs into the Arcane page. Stock 12043 ships UNTOUCHED for WotLK-stage mages; a
  # reconcile strip removes stale 12043 off Vanilla mages (EraTalents.cpp CLASS_MAGE block). This closes
  # the twin case the 2026-08-18 Arcane Power grant-accuracy pass missed (final-review F-2).
  - id: 932761
    name: Presence of Mind
    template: 12043      # clone stock PoM (inherit the instant-cast SPELLMOD effect, ProcCharges 1, family 3, attrs, icon)
    spellFixAck: >-
      SpellInfoCorrections.cpp:4664 ORs SPELL_ATTR6_NO_CATEGORY_COOLDOWN_MODS (0x80000000) onto 12043
      by id, so Presence of Mind does not share category-1151 cooldown modifiers with Arcane Power
      12042. There is no generator key for AttributesEx6 -- and it is MOOT for this clone anyway: it
      authors `category: 0` / `categoryCooldown: 0`, so no category cooldown remains for a modifier to
      touch. Shipped, merged, real-client-verified Vanilla substrate: deliberately NOT fixed here.
    category: 0          # neutralize inherited Category 1151 (else the category cd path still gates)
    categoryCooldown: 0  # cd lives purely in RecoveryTime
    cooldown: 180000     # Vanilla 3-min cooldown (stock RecoveryTime 120000 = 2 min)
    effects:             # byte-identical to stock 12043 Effect_1 (dump 2026-08-24) — mechanic unchanged; the EffectSpellClassMaskA (1631584309/4096/0) + ProcCharges 1 + DurationIndex 21 all INHERIT from the template
    - { effect: 6, aura: 108, basePoints: -101, dieSides: 1, misc: 10, targetA: 1 }   # ADD_PCT_MODIFIER -100% cast time (SPELLMOD_CASTING_TIME, misc 10) on the next mage spell, self
    client:
      name: Presence of Mind
      icon: 139          # stock PoM SpellIconID (12043 dump 2026-08-24)
      skillLine: 237     # Arcane skill line (matches Arcane Power 932760) — else the granted active lands in the General tab
      description: "When activated, your next Mage spell with a casting time less than 10 sec becomes an instant cast spell."
      auraDescription: "Your next Mage spell with a casting time less than 10 sec becomes an instant cast spell."
  # --- Magic Absorption clones 932326-932330 (node 18005 grants one per rank) ---------------------
  # ADDED 2026-09-05 (TBC Phase 9 re-audit, vanilla_fix_rows[18005]). The node shipped the always-on
  # resistance half only, with a comment saying the "restore X% of your total mana on a fully
  # resisted spell" rider was "NOT yet wired". The TBC pass proved the rider IS expressible in data
  # + a script rebind, because it is the SAME talent: the core script
  # `spell_mage_magic_absorption` (spell_mage.cpp, bound -29441) is entirely amount-driven —
  # `CalculatePct(GetMaxPower(POWER_MANA), aurEff->GetAmount())` off EFFECT_0, then a hardcoded cast
  # of 29442 — so a clone carrying the DUMMY amount and a rebind reproduces it at every rank.
  #
  # WHY A CLONE CHAIN AND NOT A `multi` NODE: the first pass proposed keeping `mechanic: multi` and
  # hanging a `proc:` block off it. That is not expressible — `gen_era_talents.py:1650-1660` emits a
  # `spell_proc` row only for `mechanic: proc`/`proc-scripted`, so a `multi` node never gets one.
  # Helpers DO support a `proc:` block (`:1593-1602`), which is why the clone chain is the fix.
  # The node therefore becomes a pure GRANT node: the resistance half moves onto each clone's e2, so
  # it is preserved exactly once (keeping the old `mechanic: stat` alongside `grants:` would either
  # double the resistance or emit dead SQL — `emit_data_sql` writes era_talent_rank from `grants:`
  # when both are present, leaving the mechanic's passive unreachable).
  #
  # Template is stock 29441 for all five ranks (29444 is byte-identical apart from its amounts;
  # 29445/29446 are absent from the live store and 29447 is "Torment the Weak" live).
  #   * e1 `aura 4` SPELL_AURA_DUMMY, basePoints 1..5 = the mana % the core script reads.
  #   * e2 `aura 22` MOD_RESISTANCE, misc **126** (all schools but Physical — the Vanilla tooltip
  #     says "all resistances"; TBC's own 124 excludes Holy and is used only by the TBC clones),
  #     basePoints 2..10, and `perLevel: 0` — MANDATORY, because live 29441/29444 carry
  #     EffectRealPointsPerLevel 0.5/1.0 on that slot and `helper_overrides` writes that column only
  #     when the key is present, so omitting it would INHERIT the live scaling.
  #   * `spellLevel: 0` — `SpellInfoCorrections.cpp:1061` sets SpellLevel 0 on 29441/29444 BY ID and
  #     a clone never receives a by-id fix (workflow lesson 14).
  #   * helper-level `proc:` copying live `-29441` verbatim: family 0, no masks, SpellTypeMask 7,
  #     SpellPhaseMask 0, HitMask 8 = PROC_HIT_FULL_RESIST, Cooldown 1000, Chance 0. `flags: 131072`
  #     translates the stock row's ProcFlags 0, which means "use the spell's own DBC ProcTypeMask" —
  #     131072 = TAKEN_SPELL_MAGIC_DMG_CLASS_NEG, inherited from the template.
  #   * `client:` per rank — node 18005 is now a GRANT node, so the talent-panel tooltip is the
  #     granted spell's own client-DBC Description (framework "Talent-panel tooltip for
  #     spell-granting nodes"); without it the panel would go blank.
  - id: 932326
    name: Magic Absorption
    template: 29441
    spellLevel: 0
    spellFixAck: >-
      SpellInfoCorrections.cpp:1061 sets `SpellLevel = 0` on stock 29441/29444 BY ID, and a clone
      never receives a by-id fix. The POST-FIX VALUE IS AUTHORED on this helper (`spellLevel: 0`
      above) — `SpellLevel` simply has no entry in era_audit's `_SPELLFIX_KEYABLE` table, so the
      check cannot see that the key is already set and falls through to the acknowledge-only branch.
      Nothing is waived: the clone ships SpellLevel 0 exactly as the corrected stock row does.
    effects:
    - { effect: 6, aura: 4,  basePoints: 1, targetA: 1 }            # mana % the core script reads
    - { effect: 6, aura: 22, basePoints: 2, misc: 126, targetA: 1, perLevel: 0 }
    proc: { flags: 131072, typeMask: 7, phaseMask: 0, hitMask: 8, chance: 0, cooldown: 1000 }
    client:
      name: Magic Absorption
      icon: 459        # stock 29441 SpellIconID
      description: "Increases all resistances by 2 and causes all spells you resist to restore 1% of your total mana."
