      name: Cold Snap
      icon: 133          # stock Cold Snap SpellIconID (11958 dump 2026-09-06)
      skillLine: 6       # Frost tab — else the granted active lands in the client's General tab
      description: "When activated, this spell finishes the cooldown on all of your Frost spells."
# Attach the module AuraScript to EVERY rank of Fire Ward (-543) and Frost Ward (-6143) — a
# negative id binds the whole spell chain. The script grants the matching reflect helper while the
# ward is up when the mage has the Improved Fire Ward / Frost Warding DUMMY marker.
#
# The Magic Absorption clones 932326-932330 (node 18005) re-bind the CORE script
# `spell_mage_magic_absorption`, which is bound by negative id to -29441 and is therefore dead on a
# band clone (workflow lesson 6). BOUND PER RANK WITH POSITIVE IDS, NOT ONE NEGATIVE CHAIN ROOT:
# `ObjectMgr::LoadSpellScriptNames` resolves a negative id through `GetFirstSpellInChain` /
# `GetNextRankSpell`, i.e. through `spell_ranks`, and the generator emits no `spell_ranks` rows
# (every era rank chain in this repo gets them from a hand SQL migration). A `-932326` binding on a
# chain-less clone set would bind ONLY rank 1, silently, and ranks 2-5 would lose the mana rider.
scriptBindings:
  - { spell: -543,  script: era_ward_reflect }
  - { spell: -6143, script: era_ward_reflect }
  - { spell: 932326, script: spell_mage_magic_absorption }
  - { spell: 932327, script: spell_mage_magic_absorption }
  - { spell: 932328, script: spell_mage_magic_absorption }
  - { spell: 932329, script: spell_mage_magic_absorption }
  - { spell: 932330, script: spell_mage_magic_absorption }
# The Combustion clone 932325 (node 18032) re-binds the CORE script `spell_mage_combustion`, which
# is bound to the **POSITIVE** id 11129 and so is simply absent on a band clone (workflow lesson 6).
# That script is the whole mechanic — its `DoCheckProc` casts a stack of 28682 and REFUSES the charge
# on a NON-crit fire hit, letting the charge drop only on a crit — so without the rebind the clone
# would burn all three charges on ordinary hits and never build the crit buff.
  - { spell: 932325, script: spell_mage_combustion }
# The Cold Snap clone 932335 (node 18041) binds the MODULE SpellScript `era_mag_cold_snap` rather
# than re-binding core `spell_mage_cold_snap`: the core script's reset loop excludes only 11958, so
# on the clone it would reset Cold Snap's own cooldown. See the 932335 helper block above.
  - { spell: 932335, script: era_mag_cold_snap }
