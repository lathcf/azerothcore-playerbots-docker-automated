  # --- Improved Counterspell silence 932762 (node 18011 triggers it) ------------------------------
  # ADDED 2026-09-05 (TBC Phase 9 re-audit, vanilla_fix_rows[18011]). The node's tooltip promises a
  # **4 sec** silence and it triggered stock 18469, which on this core is `DurationIndex 39` =
  # **2000 ms** (WotLK halved it; wago 2.5.4 18469 is `durIdx 35` = 4000 ms, and the cached TBC
  # tooltip for 11255 also says 4 sec — 4 s is the pre-Wrath value in BOTH earlier eras). A per-era
  # duration cannot be expressed on the global stock id, so the payload is cloned and the node's
  # `proc.trigger` re-pointed at it.
  # Everything but the duration inherits: aura 27 SILENCE, Mechanic 9, DispelType 1, SchoolMask 64,
  # ImplicitTargetA 6, RangeIndex 13. A visible enemy debuff needs its own `client:` row or the icon
  # never renders (the Blackout 932970 precedent); no `skillLine:` — it is a triggered payload.
  # PER-ERA IDENTITY: the TBC node 20810 uses its OWN clone 948770 in the TBC slice. Do NOT share
  # one helper between eras.
  - id: 932762
    name: Silenced - Improved Counterspell
    template: 18469
    durationIndex: 35    # 4000 ms (stock 18469 is index 39 = 2000 ms)
    effects:             # byte-identical to stock 18469's Effect_1; the generator requires an
                         # authored effects list on any `template:` helper (template effects would
                         # otherwise pass through wholesale). Mechanic 9 / DispelType 1 /
                         # SchoolMask 64 / RangeIndex 13 still inherit.
    - { effect: 6, aura: 27, basePoints: 1, targetA: 6 }   # SPELL_AURA_MOD_SILENCE on the target
    client:
      name: Silenced - Improved Counterspell
      icon: 17           # stock 18469 SpellIconID
      description: "Silenced."
      auraDescription: "Silenced."
  # --- Fire Vulnerability 932763 (node 18026 Improved Scorch triggers it) -------------------------
  # ADDED 2026-09-05 (TBC Phase 9 re-audit, vanilla_fix_rows[18026]). The node triggered STOCK 22959
  # while its tooltip promised "+3% Fire damage ... 30 sec ... Stacks up to 5 times". Live 22959 is
  # named "Improved Scorch" and is `aura 179 MOD_ATTACKER_SPELL_CRIT_CHANCE misc 126 val 5,
  # CumulativeAura 1` — i.e. +5% crit taken, ALL schools, ONE stack. wago 2.5.4 22959 is named
  # "Fire Vulnerability" and is `aura 87 MOD_DAMAGE_PERCENT_TAKEN misc 4 (fire) val 3, durIdx 9
  # (30 s), CumulativeAura 5` — exactly what the Vanilla tooltip says. So the shipped node was
  # delivering a WotLK crit debuff while advertising the era one; the payload is cloned per era and
  # `proc.trigger` re-pointed. Stock 22959 ships untouched for WotLK-stage mages.
  # PER-ERA IDENTITY: the TBC node 20832 uses its OWN clone 948860 in the TBC slice — never share.
  # NO `spell_proc` row on the debuff: it is a plain aura-87 debuff that never procs, and stock 22959
  # has none either (verified on the dev box, 2026-09-05). The `-11095` contract belongs to the
  # TALENT, which node 18026 carries.
  # INHERITED BY DECISION (orchestrator, fix round): live 22959's `AttributesEx2 0x84` /
  # `AttributesEx3 0x30000` (LoS + proc-suppression engine guards) and its `SpellClassMask_2 = 8192`
  # identity bit. Unlike Combustion's CAN_PROC_FROM_PROCS (authored to 0 below), clearing these would
  # let a PROC-APPLIED debuff's own application drive further procs and pull initial aggro — an
  # engine-guard loss, not an era gain. They stay.
  - id: 932763
    name: Fire Vulnerability
    template: 22959
    school: 4            # SPELL_SCHOOL_MASK_FIRE (identical in both stores; authored for the record)
    durationIndex: 9     # 30 s (identical in both stores)
    stackAmount: 5       # CumulativeAura — live 22959 is 1
    effects:
    - { effect: 6, aura: 87, basePoints: 3, misc: 4, targetA: 6 }   # MOD_DAMAGE_PERCENT_TAKEN, fire, +3%
    client:
      name: Fire Vulnerability
      icon: 816          # stock 22959 SpellIconID
      description: "Fire damage taken increased by 3%."
      auraDescription: "Fire damage taken increased by 3%."
  # --- Pyroblast r1-r8, 932310-932317 (node 18024 grants r1; r2-r8 trainer-taught at Task 5) ------
  # ADDED 2026-09-05 (TBC Phase 9 re-audit, vanilla_fix_rows[18024]; USER DECISION 2026-09-05 —
  # ships this generation). The node GRANTED stock 11366, whose live `CastingTimeIndex 6` = 5000 ms.
  # wago 2.5.4 11366 is `CastingTimeIndex 171` = **6000 ms** on every rank and the cached Wowhead TBC
  # tooltip reads "6 sec cast": WotLK 3.0 shortened Pyroblast, so **Vanilla 1.12 and TBC 2.4.3 share
  # the 6 s cast** and the Vanilla node had the same defect the TBC node 20830 is being fixed for.
  # SHAPE = the TBC twin's: clone the chain, copy the LIVE stock values verbatim, change ONLY the
  # era-diverged field. Index **171 is 6000 ms in BOTH stores**, so the index is authored verbatim.
  # The Vanilla cap is level 60, so the chain stops at r8 (18809) — 27132/33938/42890/42891 are not
  # cloned and stay reachable for higher-era mages. `category: 0` is the pre-Wrath value (live's 290
  # carries CategoryRecoveryTime 0, so it groups nothing either way).
  # Client text is live's description string verbatim: it is pure `$s1`/`$o2`/`$d` substitution off
