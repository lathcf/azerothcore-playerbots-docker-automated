# Fixed-id HELPER spells the module C++ casts by id (not talent-rank passives). era_ward_reflect
# casts one of these on the mage while Fire/Frost Ward is up, with the reflect % (from the talent's
# DUMMY marker) as the base point. SPELL_AURA_REFLECT_SPELLS_SCHOOL (aura 75), school-masked, with
# the wards' own DurationIndex 9 (30s). Ids sit near the top of the reserved band, clear of the
# node-derived ids (max 920392).
