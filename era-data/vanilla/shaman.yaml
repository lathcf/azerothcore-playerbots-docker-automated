# --- Plan 2 Phase B Task B2: Earth pulse-aura totems (Strength of Earth / Stoneskin / Earthbind) --
# DISPOSITION (dumped 2026-08-23 vs era-data/_ref/shaman-totems.yaml StrengthOfEarth/Stoneskin/
# Earthbind): all three are CLONES (retune), not no-ops — every one diverges from stock 3.3.5a in a
# player-visible way:
#   - StrengthOfEarth: Vanilla is STRENGTH-ONLY (buff 8076-family gained a 2nd MOD_STAT/Agi effect
#     in the WotLK 3.0.2 Grace-of-Air merge — Effect_2 misc=1 STAT_AGILITY, dumped and confirmed).
#     The clone authors ONLY Effect_1 (misc=0 STAT_STRENGTH); Effect_2/3 are 0-filled by the
#     templated-helper 0-fill rule (omitting them from `effects:` on a templated helper zeroes them,
#     it does NOT inherit the template's own Effect_2). Mana also differs every rank (stock
#     25/65/125/225 vs Vanilla 30/80/155/275 — dumped from 8075/8160/8161/10442).
#   - Stoneskin: stock 3.3.5a's pulse 8072-family is EffectAura_1=22 SPELL_AURA_MOD_RESISTANCE
#     (misc=1 => SPELL_SCHOOL_MASK_NORMAL, i.e. a flat ARMOR buff — WotLK retooled Stoneskin from a
#     melee-damage-reduction totem into an armor totem; dumped basePoints +94/+199/+309/+419/+529/
#     +639, all POSITIVE, NOT the negative flat reduction a prior note expected). The 1.12 mechanic
#     is a DIFFERENT aura entirely: EffectAura=125 SPELL_AURA_MOD_MELEE_DAMAGE_TAKEN, a flat per-hit
#     reduction, magnitude NEGATIVE (Unit.cpp `TakenFlatBenefit += GetTotalAuraModifier(...)` in
#     Unit::MeleeDamageBonus — a negative modifier subtracts from damage taken, confirmed by reading
#     the handler, not guessed). The clone authors aura 125 with basePoints = -(reduction) fresh per
#     rank (3/6/10/14/20/27 -> -3/-6/-10/-14/-20/-27); it does NOT reuse stock's own aura/basePoints —
#     only the SpellClassMask identity is inherited via `template:`.
#   - Earthbind: pulse 3600 (slow) is UNCHANGED value-for-value between eras (dumped: aura 33
#     MOD_DECREASE_SPEED, basePoints -51 (+1 convention = -50%), radiusIndex 13, durationIndex 28 —
#     matches the `_ref` exactly) — but the SUMMON still needs a clone because Vanilla mana (40)
#     differs from stock's cost MODEL: stock 2484 charges 0 flat ManaCost but ManaCostPct=5 (5% of
#     base mana) — a %-of-mana cost, not a flat one. `manaCostPct: 0` is authored on the summon to
#     neutralize the inherited stock percentage (SpellInfo::CalculatePowerCost ADDS
#     ManaCostPercentage on top of ManaCost — leaving it un-zeroed would silently double-charge: 40
#     flat + 5% max mana). Stoneskin's summon has the SAME trap in a worse form (dumped
#     ManaCostPct=13 on ALL 6 stock summon ranks, ManaCost=0) — `manaCostPct: 0` is authored on
#     every Stoneskin summon rank too. SoE's summon templates already carry ManaCostPct=0 (dumped),
#     so no neutralization is needed there.
# Per-totem SummonProperties/target constants (dumped per rank, constant within each totem — and,
# unusually, IDENTICAL across all three: miscB=81, targetA=41 — unlike the resistance totems, which
# used per-element swapped values 63/44, 82/42, 83/43):
#   StrengthOfEarth summon (8075/8160/8161/10442): EffectMiscValueB_1=81, ImplicitTargetA_1=41, icon 691
#   Stoneskin summon (8071/8154/8155/10406/10407/10408): EffectMiscValueB_1=81, ImplicitTargetA_1=41, icon 690
#   Earthbind summon (2484): EffectMiscValueB_1=81, ImplicitTargetA_1=41, icon 686
# skillLine (SkillLineAbility.dbc dump): StrengthOfEarth/Stoneskin summons are BOTH skill 373
# (Enhancement, like the resistance totems); Earthbind's summon 2484 is skill 375 (Elemental) —
# DIFFERENT from the other two, confirmed by dumping SkillLineAbility rows for 2484/8071/8075.
# Pulse EffectRadiusIndex_1: SoE/Stoneskin buffs both DUMP radiusIndex 10 — but index 10 is 30 yd,
# the WotLK widening, not the 20 yd the flavor text claims (`_ref/shaman-totems.yaml` records
# radiusIndex 9 for every 1.12 party pulse). The 2026-09-06 fix round I-14 therefore AUTHORS
# `radius: 9` on every friendly pulse clone in this file instead of inheriting 10; the "20 yards"
