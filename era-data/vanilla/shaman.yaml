# fresh custom ids only (the same id-collision class already documented on the FireNovaSpell _ref
# entry). The delayed self-destruct AI is Task 8 (npc_era_fire_nova_totem, CreatureScript) — not
# authored here; this block is DATA ONLY (summons, blast, creature+script wiring).
# Summons (931353-357) template Searing Totem r1 (3599) for the fire-slot SUMMON machinery only
# (dumped: Effect_1=28 SUMMON, EffectMiscValueB_1=63, ImplicitTargetA_1=44, ManaCostPct=0 — the SAME
# fire-slot pair Magma/Flametongue/Frost Resistance summons in this file all share; Magma Totem 8190
