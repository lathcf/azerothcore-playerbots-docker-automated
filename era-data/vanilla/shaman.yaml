# smaller radius — "10 yards" is the well-established WotLK tooltip figure) and is UNCHANGED, as are
# Searing/Magma/Fire Nova/Grounding.
# Earthbind's pulse effect is authored as Effect=6 SPELL_EFFECT_APPLY_AURA (a plain hostile-area
# aura, NOT 65 APPLY_AREA_AURA_PARTY like the two party buffs) with ImplicitTargetA=22 (matches
