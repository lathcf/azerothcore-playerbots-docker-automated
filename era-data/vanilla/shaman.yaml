    # AUTHORED (spellmod op:notLoseCastingTime) — Vanilla Eye of the Storm's benefit = avoid losing casting
    # time from damage; 3 ranks. DOCUMENTED MECHANICAL DIVERGENCE (accepted, per the task directive + the
    # WotLK stock encoding): the imported 1.12 tooltip describes a PROC (on being the victim of a melee/ranged
    # CRIT, 33/66/100% chance -> a 6s "Focused Casting" buff = 100% pushback immunity). WotLK's OWN version of
    # this exact talent (29062/29064/29065, dump 2026-08-23) re-encodes it as a plain SPELLMOD aura 108 misc 9
    # SPELLMOD_NOT_LOSE_CASTING_TIME (a permanent per-cast % chance to not lose casting time), scoped to
    # LB+CL. We ship the stock-proven SPELLMOD form at the Vanilla 33/66/100% values, scoped to the Elemental
    # damage set (LB|CL|shocks; only the cast-time LB/CL actually benefit — shocks are instant, so the mod is
    # inert-but-harmless on them, and the scope matches "your Elemental spells"). The divergence (Vanilla's
    # conditional proc-on-crit -> a permanent per-cast chance) is a minor, arguably-beneficial simplification:
    # a faithful reconstruction would need a headless-untestable "victim of a crit" proc + a Focused Casting
    # buff whose only clean data expression is itself a notLoseCastingTime spellmod at 100%. op 9 = the same
    # op as Healing Focus (18837). kind pct, verified via 29062's misc 9 encoding.
    mechanic: spellmod
    op: notLoseCastingTime
    kind: pct
