# stripped at the next reconcile (found in the user's real-client pass). Completing the
# three-marker pattern instead: this Vanilla clone at 1.12's values, the stock row re-gated behind
# 932417 (WotLK-only), each era exactly one row. 1.12 values measured DIRECTLY from the era-wow
# vanilla-extract Spell.dbc (build 5875, row 6495): school NATURE (1.12 School column = 3), mana
# **80 FLAT** (live 6495 is ManaCostPct 2 — ~16 mana at L34, the quiet era gap the old "CONFIRMED
# UNCHANGED" verdict missed), 100-hp totem (bp99+d1), aura-4 DUMMY e2, DurationIndex 5 (300 s),
# stock creature 3968 (entry-keyed camera mechanic — NEVER an era creature entry). Same
# SpellInfoCorrections radius-0 reproduction and the same spell_sha_sentry_totem bind as 947260;
# patch 0024 clears this clone's buff on early unsummon alongside 947260's. NO preventionType:
# Sentry is 0 on BOTH sides (accepted_gaps id 14's one exclusion).
