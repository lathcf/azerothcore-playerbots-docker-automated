# --- Plan 2 (final content task): Poison Cleansing / Disease Cleansing Totems (FROM-SCRATCH split;
# water, 1 rank each) ---------------------------------------------------------------------------
# DISPOSITION (era-data/_ref/shaman-totems.yaml PoisonCleansing/DiseaseCleansing/CleansingTotem):
# WotLK 3.1.0 MERGED Vanilla's two single-dispel-type water totems into one "Cleansing Totem" 8170
# (poison AND disease). Both 1.12 predecessors (8166 Poison / 8170 Disease — NOTE the id collision:
# 1.12's OWN 8170 was Disease Cleansing Totem, reused by WotLK for the merged totem) are gone from
# 3.3.5a by name, so both are FROM-SCRATCH: reconstruct the mechanism off the merged totem, split
# back into two single-type totems, each hidden from binding no talent references cleansing totems.
#   MECHANISM (dumped 2026-08-23, merged Cleansing Totem 8170): summon 8170 (Effect_1=28 SUMMON,
#   EffectMiscValue_1=5924 -> creature 5924, EffectMiscValueB_1=82/ImplicitTargetA_1=42 = WATER slot
#   (same constant as every other water totem in this file), DurationIndex=5 (300 s — the same index
#   Healing Stream/Mana Spring/Frost-Fire Resistance's summons inherited before the 2026-09-06 fix
#   round I-31 authored `durationIndex: 4` = the real 2 min), ManaCostPct=8/ManaCost=0 (the
#   FAMILIAR %-mana trap — clone with a flat `powerCost`+`manaCostPct:0` like Earthbind/Grounding/
#   Tremor above). creature_template_spell for 5924 (dumped from base SQL) has exactly ONE row:
#   index0 = 8172 "Cleansing Totem Passive" (Effect_1=6 APPLY_AURA aura=23 PERIODIC_TRIGGER_SPELL,
#   EffectAuraPeriod_1=3000ms, ImplicitTargetA_1=1 self, EffectTriggerSpell_1=8171) -> 8171
#   "Cleansing Totem Pulse" (Effect_1=3 SPELL_EFFECT_DUMMY, ImplicitTargetA_1=33 SRC_AREA_PARTY,
#   EffectRadiusIndex_1=10) is C++-scripted (spell_shaman.cpp spell_sha_cleansing_totem_pulse, bound
#   via spell_script_names (8171,'spell_sha_cleansing_totem_pulse')): its OnEffectHitTarget re-casts
#   the FIXED spell 52025 "Cleansing Totem Effect" on each hit unit via CastCustomSpell (preserving
#   GetOriginalCaster). 52025 itself carries TWO SPELL_EFFECT_DISPEL(38) effects — Effect_1
#   misc=4 (DISPEL_POISON), Effect_2 misc=3 (DISPEL_DISEASE), both ImplicitTargetA_1/2=21
#   (TARGET_UNIT_TARGET_ALLY, i.e. whichever unit the DUMMY hop passed in) — confirmed against
#   SharedDefines.h `enum DispelType` (DISPEL_DISEASE=3, DISPEL_POISON=4) and `enum SpellEffects`
#   (SPELL_EFFECT_DISPEL=38, SPELL_EFFECT_DUMMY=3, SPELL_EFFECT_DISPEL_MECHANIC=108).
#   COLLAPSED TO DATA-ONLY (zero C++): the DUMMY hop exists upstream purely so ONE fixed spell
#   (52025) can serve BOTH factions from a single creature; splitting into a SINGLE dispel type per
#   totem removes that need entirely. `Spell::EffectDispel` (SpellEffects.cpp) reads `unitTarget`
#   generically and is invoked once per hit-target regardless of target-selector shape, so a
#   PERIODIC_TRIGGER_SPELL -> single SPELL_EFFECT_DISPEL(38) hop works exactly like Tremor Totem's
#   own PERIODIC_TRIGGER_SPELL -> SPELL_EFFECT_DISPEL_MECHANIC(108) hop above (dumped 8146:
#   ImplicitTargetA_1=22 TARGET_SRC_CASTER + ImplicitTargetB_1=33 TARGET_UNIT_SRC_AREA_PARTY +
