  name: Sentry Totem
  template: 6495
  spellFixAck: >-
    SpellInfoCorrections.cpp:958 sets Effects[EFFECT_0].RadiusEntry = 0 on 6495. REPRODUCED IN
    DATA exactly as the TBC sibling 947260 does: effect 1 authors `radius: 0` (targetA 43 uses
    CalcRadius as the totem DROP DISTANCE; the template's stock index 12 is 100 yd).
