# ===================================================================================================
# DEFECT FIXED 2026-09-06 (fix round F-4). Vanilla EARTHBIND used to snare for ~5 s out of a 45 s
# totem. Found 2026-09-01 by the TBC Phase 3 totem work; the one-shot-pulse sweep established that
# this defect class had exactly TWO members, Vanilla Earthbind and Vanilla Magma (F-5 below), and
# both are fixed in the same round.
# WHAT WAS WRONG: era creature 920100 cast this slow FIELD (931010) at Index 0 DIRECTLY, while stock
# creature 2630 casts driver 6474 (aura 23 @3000 ms) which RE-TRIGGERS the field for the totem's
# whole life. 931010's own DurationIndex 28 is 5000 ms, so the snare died ~40 s early.
# WHY IT BROKE: `Totem::InitSummon` (Totem.cpp:88-105) casts `m_spells[0]` EXACTLY ONCE, and
# `TotemAI::UpdateAI` (TotemAI.cpp:63-66) returns immediately for a non-TOTEM_ACTIVE totem. A pulse
# that is neither an area aura nor self-periodic therefore fires once and never again.
# THE FIX (mirrors TBC's shipped 947001): creature 920100's Index-0 spell is now the MINTED DRIVER
# **931011** below — a clone of stock 6474 (aura 23 PERIODIC_TRIGGER_SPELL @3000 ms) that triggers
# this payload every 3 s. 931010 itself is unchanged and is now a triggered payload, never a pulse.
# ===================================================================================================
- id: 931010
  name: Earthbind
  template: 3600
  effects:
  - { effect: 6, aura: 33, basePoints: -50, dieSides: 0, misc: 0, targetA: 22, radius: 13 }   # MOD_DECREASE_SPEED, hostile area aura (not APPLY_AREA_AURA_PARTY); ImplicitTargetB (stock=15) inherited un-authored — the generator has no targetB key
  client:
    name: Earthbind
    icon: 686
    auraDescription: "Movement speed reduced by 50%."
# DRIVER **931011** (F-4, 2026-09-06) — creature 920100's Index-0 spell, modelled field-for-field on
#   TBC's shipped 947001. Clone of stock 6474 "Earthbind Totem Passive": Attributes 320 (PASSIVE +
#   DO_NOT_LOG) and DurationIndex 0 come from the template, which is what `SpellAuras.cpp:804` needs
#   for a permanent totem aura — a from-scratch passive would have to author both by hand. Only the
#   trigger target is re-pointed: TBC triggers stock 3600 (wago == live, so B.2 grants stock), this
#   one triggers the era-owned clone **931010** because the Vanilla substrate owns its own field id.
#   The 3000 ms period is INHERITED from the template (the generator writes EffectAuraPeriod only
#   when `amplitude:` is authored) — same as 947001, which measures 3000 in the live table.
#   NOT script-bound, deliberately: `spell_sha_earthbind_totem` (bound to 6474) is inert for a
#   Vanilla shaman — both of its handlers require a WotLK talent.
- id: 931011
  name: Earthbind Totem Passive
  template: 6474
  attributesEx5: 512  # SPELL_ATTR5_EXTRA_INITIAL_PERIOD. `ApplySpellFix({8145, 6474})`
                      # (SpellInfoCorrections.cpp:394) ORs this onto the TEMPLATE by id, and a clone
                      # never receives it. Without it this driver's FIRST tick waits a full 3000 ms,
                      # so the snare would start ~3 s after the totem lands — partly undoing the very
                      # defect the driver was minted to fix. Same authored value, same reason, as the
                      # TBC sibling 947001. See _ref/tbc/shaman-totems-tbc.yaml open_questions id 11.
  effects:
  - { effect: 6, aura: 23, basePoints: -1, targetA: 1, trigger: 931010 }   # PERIODIC_TRIGGER_SPELL/3s (period inherited from 6474) -> the era Earthbind slow field
  client:
    name: Earthbind Totem Passive
    icon: 686
    auraDescription: "Periodically reduces the movement speed of nearby enemies by 50%."
