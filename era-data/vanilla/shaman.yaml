#     SAME index Earthbind's summon 2484 carries, whose authored description already confirms
#     index 22 = 45 sec) — inherited via `template:`, no override needed.
#   - health/element/skillLine confirmed by direct dump: EffectBasePoints_1=4/DieSides=1 (5-hp totem,
#     same convention as every totem here), EffectMiscValueB_1=83 + ImplicitTargetA_1=43 (AIR slot),
#     SkillLineAbility 8177->skillLine 373 (Enhancement).
