# 15s. aura 283 MOD_HEALING_RECEIVED (verified vs fork SpellAuraDefines.h:346 + Unit.cpp:9817: a
# caster-specific, IsAffectedOnSpell-scoped healing MULTIPLIER). TEMPLATE off stock 29206 (WotLK Healing
# Way) SOLELY to INHERIT its Effect_1 EffectSpellClassMaskA_1 = 64 (dump 2026-08-23) -> the buff is scoped
# to Healing Wave (this helper INHERITS the mask rather than authoring maskA/B/C — inheriting a suitable
# template is the clean route when one exists; the single-word 64 could equally be authored `maskA: 64`).
# Override attributes:0 (29206 is PASSIVE/Attributes 448 -> would hide the buff icon), aura 283 (from the
# stock ADD_PCT_MODIFIER 108), targetA 21, durationIndex 8 (15s), and CumulativeAura 3 via `stackAmount`
