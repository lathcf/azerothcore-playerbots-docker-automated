#   stock 8172 itself, so the real 3s tick amplitude/self-target/aura-23 shape ship byte-identical)
#   whose `trigger:` points to a MINTED "Effect" helper (templated off stock 8146 — Tremor's OWN
#   dispel-mechanic spell — purely to inherit its ImplicitTargetB_1=33/EffectRadiusIndex_1=10/
#   RangeIndex_1=1 area-party machinery for free, since the generator's `effects:` schema has NO
#   targetB key and 8146's fields already fall through UNTOUCHED when omitted). Only Effect_1/
