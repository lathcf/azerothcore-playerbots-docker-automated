    tooltip:
    - Gives you a 10% chance to enter a Clearcasting state after casting any Fire, Frost, or Nature damage spell. The Clearcasting
      state reduces the mana cost of your next damage spell by 100%.
    # AUTHORED (proc -> Clearcasting clone 932415) — CLONE verdict (_ref survival.elemental_focus). Vanilla
    # Elemental Focus = 10% chance AFTER CASTING any Fire/Frost/Nature damage spell -> Clearcasting (-100%
    # cost on the NEXT 1 damage spell). WotLK 16164 diverged to 100%-on-CRIT -> 16246 Clearcasting -40%/2
    # charges (dump 2026-08-23), so the proc is rebuilt at the Vanilla shape. This is the shaman Omen-of-
    # Clarity analog. Proc built via the generator's `proc:` block (a plain chance-on-cast proc goes through
    # data — no hand SQL needed, unlike the druid Omen PPM case):
    #   - flags 65536 = PROC_FLAG_DONE_SPELL_MAGIC_DMG_CLASS_NEG (dealing a negative magic-damage spell =
    #     "after casting a damage spell"; verified vs fork SpellMgr.h:134).
    #   - school 28 = Fire(4)|Frost(16)|Nature(8) scopes it to the three elemental schools (the SchoolMask
    #     route, more faithful than a per-spell family mask — catches every fire/frost/nature damage cast).
    #   - typeMask 1 (PROC_SPELL_TYPE_DAMAGE) is CORRECT here (this IS a damage-spell proc; the typeMask-2
    #     heal trap does NOT apply — a damage event carries typeMask 1, so the generator default of 1 matches).
    #   - hitMask 0 = any hit (Vanilla is on-cast, NOT crit-only — unlike the WotLK on-crit rework).
    #   - chance 10; triggers 932415 Clearcasting (-100% cost, 1 charge). Proc-firing defers to Task 10.
    mechanic: proc
    proc:
      flags: 65536               # PROC_FLAG_DONE_SPELL_MAGIC_DMG_CLASS_NEG (dealt a negative magic-damage spell)
      school: 28                 # Fire|Frost|Nature schools
      typeMask: 1                # PROC_SPELL_TYPE_DAMAGE (damage-spell proc — 1 is correct, NOT the heal-2 case)
      hitMask: 0                 # any hit (on-cast, not crit-only)
      chance: [10]
      trigger: [932415]          # Clearcasting -100% cost / 1 charge (helpers:)
