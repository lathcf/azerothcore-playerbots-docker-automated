# --- Elemental Mastery Vanilla clone (node 18814 grants r1). --------------------------------------
# CLONE verdict (_ref survival.elemental_mastery). Vanilla EM: instant, 3-min cd -> next Fire/Frost/Nature
# damage spell 100% CRIT + 100% cost reduction (NO instant-cast/haste = the WotLK addition dropped). ONE
# self-buff carrying BOTH effects (collapsed 2026-08-23; was two helpers 932413 crit + 932414 cost, giving
# two visible buffs — Vanilla EM is ONE buff). Now possible because helper effects gained per-effect
# maskA/maskB/maskC (Part A): both effects are authored on this one spell, each scoped to the SAME
# fire/frost/nature damage set (maskA -1877999613 = family-11 word-A bits {0,1,20,28,31} = Lightning Bolt |
# Chain Lightning | Earth Shock | Flame Shock | Frost Shock; maskB/maskC 0). Setting both effects to the
# identical mask makes a single matching damage cast consume both charges — the COST mod registers the
# charge drop and the FLAT crit adds +100.
# ROOT-CAUSE FIX (live bug): Effect_1 crit is now a FLAT modifier (aura 107 ADD_FLAT_MODIFIER, basePoints
# 99 + dieSides 1 = +100), NOT the old PCT modifier (aura 108). Player::ApplySpellMod deliberately SKIPS a
# PCT crit mod (misc 7 SPELLMOD_CRITICAL_CHANCE) unless the same aura already applied another mod to the
# spell (the "Surge of Light" exception) — so the PCT crit never applied and its charge was never consumed
# (it just counted down). Encoded byte-for-byte like the stock FLAT-crit precedents Divine Favor 20216 and
# Cold Blood 14177 (aura 107, misc 7, basePoints 99, dieSides 1).
# Category NEUTRALIZED to 0 + RecoveryTime 180000 = clean Vanilla 3-min cd (16166 carries the cd as the
# shared Category 1202 — the Nature's Swiftness 932412 / Aimed Shot precedent). ProcCharges 1 = the buff is
# consumed by the next matching spell. 16166 is instant (CastingTimeIndex 1, inherited).
- id: 932413
  name: Elemental Mastery
  template: 16166        # inherit instant + icon 117 + family 11 (per-effect masks are authored, not inherited)
  spellFixAck: >-
    SpellInfoCorrections.cpp:4196 rewrites `Effects[EFFECT_0].SpellClassMask` of 16166 to
    flag96(0x00000003, 0x00001000). MOOT: this clone authors maskA/maskB/maskC explicitly on BOTH
    effects, so nothing of the template's effect-1 mask survives to be corrected. Logged in era-
    data/_ref/tbc/shaman-totems-tbc.yaml open_questions id 11.
  category: 0            # neutralize the shared Category 1202 (else it inherits its category cd)
  categoryCooldown: 0
  cooldown: 180000       # Vanilla 3-min cd (RecoveryTime)
  procCharges: 1         # the buff is consumed by the next Fire/Frost/Nature damage spell (one shared charge)
  manaCostPct: 0         # instant activated ability, no cost (16166 is already 0; explicit for safety)
  effects:              # BOTH effects scoped to the SAME fire/frost/nature damage set via per-effect masks
                        # (maskA/maskB/maskC = family words 0/1/2). Authoring all three on Effect_2 fully
                        # replaces 16166's stray inherited Effect_2 flag96 (word0 12288 / word1 4096 / word2 0)
                        # with the damage set / 0 / 0, so the cost mod binds ONLY to the 5 damage spells.
  - { effect: 6, aura: 107, misc: 7,  basePoints: 99,   dieSides: 1, targetA: 1, maskA: -1877999613, maskB: 0, maskC: 0 }   # FLAT SPELLMOD_CRITICAL_CHANCE +100 = guaranteed crit (Divine Favor 20216 / Cold Blood 14177 encoding)
  - { effect: 6, aura: 108, misc: 14, basePoints: -100, dieSides: 0, targetA: 1, maskA: -1877999613, maskB: 0, maskC: 0 }   # PCT SPELLMOD_COST -100% = free next damage spell (old 932414 encoding)
  client:
    name: Elemental Mastery
    icon: 117            # stock Elemental Mastery SpellIconID (16166 dump 2026-08-23)
    skillLine: 375       # Elemental — else the granted active lands in the client General tab
