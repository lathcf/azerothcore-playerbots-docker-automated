# --- Holy Shock heal clones (hidden; SPELL_EFFECT_HEAL Holy to an ally). SAME per-rank numbers. -------
#     powerCost = the rank's Holy Shock mana (320/410/480) so ILLUMINATION works: core
#     spell_pal_illumination refunds mana = base cost * talent% on a crit heal, and for a Holy Shock
#     heal it reads the HEAL spell's own ManaCost (our clone carries NO SpellFamilyFlags[1] bit16 marker,
#     so the refund takes the `else` branch = healSpell->ManaCost, NOT GetSpellWithRank(20473)). The
#     clone is ALWAYS cast TRIGGERED by era_pal_holy_shock (CastSpell ..., true = TRIGGERED_FULL_MASK,
#     which IGNOREs power cost), so this ManaCost is NEVER charged — Holy Shock still costs mana exactly
#     once via the dummy 932646.
#     PROC MATCHING CORRECTED (audit fix 2026-08-30): the original design here assumed "no spell_proc
#     row for 20210 -> no family filter -> any crit heal procs Illumination". FALSE on this core: acore
#     ships a `-20210` spell_proc row (family 10, mask0 HL|FoL 0xC0000000, mask1 stock-HS-heal 0x10000,
#     HitMask crit), so a family-LESS clone could never proc it and Illumination x Holy Shock was dead.
#     Fix: the executors now carry family 10 + word-A bit21 (0x200000, the stock Holy Shock identity
#     bit) and the module OVERRIDES the -20210 row to widen mask0 with that bit
#     (2026_08_30_20_era_holy_shock_illumination_proc.sql). bit21 deliberately, NOT the heal-side
#     bit16: bit16 flips spell_pal_illumination onto the GetSpellWithRank(20473) branch and the refund
#     would read STOCK WotLK costs (225/275/325...) instead of this powerCost. Divine Favor's forced
#     crit (20216, mask word-A 0x200000 | word-B 0x10000) also matches via bit21 — its Holy Shock
#     clause was equally dead on family-less executors.
# spellVisual 135 = stock Holy Shock HEAL impact (25914). client:{} (no skillLine) = client-known so the
# heal impact + floating heal number render.
