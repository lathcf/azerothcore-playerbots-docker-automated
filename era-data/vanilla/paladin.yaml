# DUMMY whose amount is the rank's JoR id, so core spell_pal_judgement unleashes it on Judgement with
# zero core patch (same mechanism as Seal of Command 932606 and Seal of the Crusader 932634-639). The
# seal clones carry NO family/maskC override — they hold no boostable damage themselves (only the
# proc trigger + judgement DUMMY), so Improved Seal of Righteousness (18604) has nothing to bind on
# the seal spell itself.
