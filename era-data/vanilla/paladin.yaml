# 25912/25914 (rank 1 ~314-340). The clones reproduce the Vanilla dual branch at Vanilla magnitudes:
# each rank's DUMMY (932646-648, cloned off 20473 so it inherits Effect_0 DUMMY + target-ANY(25) +
# 20yd range + instant cast + icon 156) is bound to the era_pal_holy_shock SpellScript, which casts the
# rank's Vanilla-valued damage (932649-651, on an enemy) or heal (932652-654, on an ally). The
# damage/heal clones are plain SCHOOL_DAMAGE(2)/HEAL(10) Holy spells with NO EffectBonusMultiplier, so
# the core-default instant-cast coefficient (~0.43) stands — the authentic Vanilla Holy Shock behavior.
# Values are the 1.12.1 client Spell.dbc (20473/20929/20930, mana 320/410/480, damage=heal 204-220 /
