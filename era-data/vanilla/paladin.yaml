#         Judgement buttons this reconstruction strips in Vanilla anyway).
#     `client.icon` 205 is stock 20271's OWN SpellIconID (dump_spell_effects.py; IDENTICAL in the
#     1.12.1 record's string-table field too) — NOT a guess.
#
#     `era_pal_judgement` (scriptBindings below) replicates core spell_pal_judgement's own EFFECT_2-
#     DUMMY seal-scan (spell_paladin.cpp:962-975) verbatim, ADDS RemoveAura(seal) (Vanilla's
#     consume-on-judge — WotLK's Judgement does NOT consume the seal), and OMITS every WotLK extra the
#     stock script also does: no SPELL_PALADIN_JUDGEMENT_DAMAGE base hit, no Tier-5 Improved Judgement
#     energize, no Judgements of the Just extra-attack/SoC-cleave — none of those talents/sets exist
#     for a Vanilla paladin. The scan is fully data-driven (any SPELL_SPECIFIC_SEAL aura with a DUMMY
#     on EFFECT_2), so this ONE button unleashes ALL of our custom seals (SoR/SoJ/SoL/SoW, this
#     reconstruction) AND the already-shipped Seal of Command (932606) and Seal of the Crusader
#     (932634-639) with zero extra wiring. Learn level (4, Vanilla) and the strip of the 3 stock
#     Judgement buttons are Task 9 (reconcile), not authored here. -----------------------------------
