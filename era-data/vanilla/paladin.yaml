# --- Seal Training marker (932749, seal rework v2, 2026-08-20) --------------------------------------
# Real-client test showed Task 9's grant-by-level model was WRONG: it auto-granted every seal/
# Judgement/LoH rank and left the stock WotLK seals/judgement-buttons/LoH still trainable, so a
# Vanilla paladin ended up with BOTH the custom clones and the stock spells cluttering the trainer.
# This marker is the fix: a hidden PERMANENT passive granted to EVERY Vanilla-era paladin by
# ReconcileBaselineSpells. Its ONLY role is a trainer ReqAbility1 anchor — every seal/Judgement/LoH
# rank-1 custom trainer row (2026_08_20_40_era_talent_paladin_seal_trainers.sql) requires it, so
# ONLY a Vanilla paladin can ever see/train those rows (a WotLK paladin never has 932749). Checked
# purely by PRESENCE (trainer_spell.ReqAbility1 = core's own HasSpell test; the C++ reconcile itself
# only ever tests HasSpell/learnSpell/removeSpell(932749)) — no script anywhere reads its DUMMY aura
# or misc value, so it claims NO DUMMY-marker registry slot (registry next-free is 17, per hunter's
# later misc-16 claim — see the Improved Scorpid Sting note). Mirrors the
# warlock "Era: Vanilla Cast Times" marker (932930) shape exactly: template-less, PASSIVE_ATTR
# (262608) -> hidden + self-applying on learn, an inert SPELL_AURA_DUMMY on self. No client: block
# -> invisible, never appears in the spellbook.
- id: 932749
  name: "Seal Training"
  attributes: 262608       # PASSIVE + hidden (same mask as 932930/932950) -> self-applies on learn, no spellbook entry
  effects:
  - effect: 6              # APPLY_AURA
    aura: 4                # SPELL_AURA_DUMMY — inert; only ever checked by presence (HasSpell/ReqAbility1)
    basePoints: 0
    misc: 0                 # no DUMMY-marker registry claim — nothing reads this value
    targetA: 1               # TARGET_UNIT_CASTER (self-buff, permanent while learned)
  # client block ADDED 2026-08-30 (was "no client: block -> invisible"): a trainer ReqAbility spell
  # MUST be client-resolvable — Blizzard_TrainerUI.lua:319 formats the requirement NAME
  # unconditionally on selection, and a client-unknown id -> format(nil) Lua error -> EMPTY trainer
  # window (found via the TBC marker 946078; this Vanilla marker had the identical latent bug,
  # masked only when Lua error display is off). PASSIVE_ATTR still keeps it out of the spellbook
  # (the hunter 932304/932305 precedent).
  client:
    name: "Seal Training"
    icon: 1

