#     ONE, not WotLK's three: 20271/53407/53408, all stripped for a Vanilla paladin in Task 9). CLONE
#     off stock 20271 (template) to inherit family 10 + word-A bit23 (SpellClassMask_1 8388608,
#     confirmed via dump_spell_effects.py against azerothcore-wotlk/ip-dbc/Spell.dbc — IDENTICAL bit
#     the stock Improved Judgement/Lasting Judgement/Benediction spellmods already key off, so Task 8's
#     rebinds land on this clone for free) + RangeIndex/CastingTimeIndex/visual (left at the template's
#     own inherited value — nothing here calls for a range override). Effect_1 (EFFECT_0) is
#     SPELL_EFFECT_SCRIPT_EFFECT (raw enum 77 — confirmed via SharedDefines.h; NOT effect id 3, which is
#     SPELL_EFFECT_DUMMY, and confirmed identically as stock 20271's own Effect_1 both in the 3.3.5a
#     ip-dbc dump AND the 1.12.1 client Spell.dbc, field 56) on the enemy target (targetA 6, matching
#     stock's own ImplicitTargetA_1); basePoints/dieSides are 0 and unused — the hook script reads no
#     value off its own effect (stock's script doesn't either; it hardcodes a separate
#     SPELL_PALADIN_JUDGEMENT_DAMAGE id we deliberately omit, see below).
#
#     CONFIRMED Vanilla (1.12.1 client Spell.dbc) values, cross-checked field-by-field against the
#     ALREADY-EMPIRICALLY-VERIFIED F_MANA(28)/F_BASEPTS(71) offsets in era-wow/tools/spell_dbc_112.py
#     plus 8 independently-known-cooldown reference spells (Frost Nova 25s, Blink 15s, Counterspell,
#     Evasion/Divine Shield/Divine Protection/Vanish 5 min, Holy Shield 10s) to identify the two
#     un-mapped fields this task needed:
#       * mana cost = 5% of base mana (`manaCostPct: 5`, field 12 of the 1.12.1 record) — IDENTICAL to
#         stock WotLK 20271's own ManaCostPct (5, confirmed via dump_spell_effects.py), so this is
#         already the template's inherited value; authored here anyway for self-documentation.
#       * base cooldown = 15 sec, CATEGORY-based in BOTH clients (1.12.1 field 15 = 15000; WotLK's own
#         20271 has Category 1210 / CategoryRecoveryTime 10000 — WotLK measurably SHORTENED it from
#         Vanilla's 15s to 10s, matching the well-known "2/2 Improved Judgement = 5s Judgement" fact,
#         which is a WotLK/TBC-era rotation fact, NOT vanilla's). `category`/`categoryCooldown` are
