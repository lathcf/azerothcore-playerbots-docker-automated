    57774 / 20425 / 32220 / 53407 / 53408 / 53725; the post-fix value for this clone would be the
    template's live DBC AttributesEx3 196608 (0x30000) & ~0x00020000 = 65536. The clone emits the
    uncorrected 196608, so the bit stays SET. Consequence: the Judgement cast itself causes no
    initial threat and does not engage an unengaged target (SpellInfo::CausesInitialThreat,
    ThreatManager.cpp:399, Spell.cpp:2940 / 5579), and it suppresses the victim's damage-taken
    procs. Narrow in practice -- 932746's only effect is SPELL_EFFECT_SCRIPT_EFFECT, and the seal
    payload `era_pal_judgement` casts carries its own threat, so the pull still lands. Shipped,
    merged, real-client-verified Vanilla substrate: deliberately NOT fixed here.
