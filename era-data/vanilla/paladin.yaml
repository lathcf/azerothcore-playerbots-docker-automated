# a NEW free family-10 word-C bit10 (`maskC: 1024` — SotC's Improved-scaling bind already claimed
# bit9=512; every word-A bit is saturated across the 740 stock paladin spells, so no stock spell
# carries bit10 and no over-bind) so a future Improved Seal of Righteousness rebind (SPELLMOD op
# effect1) can reach both the on-hit base and the JoR flat damage in one affectsMask. The on-hit
# spell is a HIDDEN triggered payload (no client row); its authored
# Effect_0 base is the RAW per-rank value from the table, multiplied by mainhand weapon speed by a
