# --- Seal of Justice (932724, Task 3 of the 2026-08-20 seal reconstruction). Vanilla SoJ is a
#     SINGLE rank (L22, free-cast) whose on-hit stun AND judgement flee-prevention debuff are BOTH
#     UNCHANGED from Vanilla through 3.3.5a (no divergence to reconstruct) — verified against the
#     live WotLK Spell.dbc (azerothcore-wotlk/ip-dbc/Spell.dbc) rather than assumed:
#       * stock 20164 (WotLK Seal of Justice) itself carries Effect_1 = PROC_TRIGGER_SPELL(42) ->
#         20170, ManaCost 0, SpellLevel 22 — i.e. this clone's shape is a verbatim recreation of the
#         stock seal, just wrapped for the custom SPELL_SPECIFIC_SEAL/DUMMY-unleash plumbing.
#       * 20170 (the stun) EXISTS in the 3.3.5a store: EffectAura_1 = 12 (MOD_STUN), Mechanic = 12
#         (MECHANIC_STUN), DurationIndex 39 = 2000ms = 2s — matches Vanilla's ~2s stun, so REUSED
#         as-is (no clone).
#       * 20184 (Judgement of Justice) EXISTS in the 3.3.5a store: EffectAura_1 = 92
#         (PREVENTS_FLEEING), DurationIndex 18 = 20000ms = 20s (NOT 10s — correct the earlier
#         placeholder text; Classic/Vanilla's own tooltip is "preventing them from fleeing for 20
#         sec") — reused as-is (no clone).
#     Seal shape matches 932606/932700 (CLONE of stock 20375 to inherit family 10 + flagsA bit25 =>
#     SPELL_SPECIFIC_SEAL): Effect_1 = PROC_TRIGGER_SPELL -> stock 20170 (every swing; the ~stun
#     chance lives in spell_proc, not the trigger effect); EFFECT_2 (Effect_3 column) = DUMMY whose
#     amount = stock 20184, so core spell_pal_judgement (and this project's forthcoming custom
#     Judgement, 932746/Task 7) unleashes it with zero core patch. No family/maskB/maskC override —
#     there is no "Improved Seal of Justice" talent, so nothing needs to bind to this seal or its
#     (stock, unowned) payloads. PROC RATE (final review G-34, 2026-09-06): the seal now carries
#     `ppm: 5` instead of the old placeholder flat 25%. The generator DOES have a PPM key
#     (`spell_proc.ProcsPerMinute`) — the earlier "no PPM column" premise was stale — and a
#     weapon-speed-scaled rate is the right shape for a per-swing seal proc. 5 PPM is the owner's
#     anchor (no 1.12 source exists for the true rate); AC's own WotLK row for 20164 is also
#     ProcsPerMinute=5, which is a corroboration rather than a derivation. ------------------------
- id: 932724
  name: Seal of Justice
  template: 20375
  powerCost: 0             # no flat component — SoJ is a %-of-base-mana cost
  # FINAL REVIEW I-11 (2026-09-06): SoJ is NOT free-cast. There is no 1.12 DBC in this repo to read,
  # so the magnitude is anchored on wowhead Classic Era (1.15) = 13% of base mana; WotLK's own 20164
  # is 14%, i.e. the two bracket each other and 13 is the era-earlier of the pair. Stated provenance,
  # not a measurement — retune if a 1.12 client source ever lands here.
  manaCostPct: 13
  durationIndex: 9          # 30s
  effects:
  - { effect: 6, aura: 42, basePoints: 0, dieSides: 0, trigger: 20170, targetA: 1 }   # PROC_TRIGGER_SPELL -> stock SoJ stun
  - {}  # Effect_2 empty
  - { effect: 6, aura: 4, basePoints: 20184, dieSides: 0, targetA: 1 }                # EFFECT_2 (Effect_3 column) DUMMY -> stock Judgement of Justice
  proc:
    flags: 20               # DONE_MELEE_AUTO_ATTACK|DONE_SPELL_MELEE_DMG_CLASS
    hitMask: 0
    ppm: 5                  # 5 PPM (owner anchor, final review G-34) — replaces the placeholder flat 25%
  client:
    name: Seal of Justice
    icon: 307                # stock 20164 SpellIconID (confirmed via dump_spell_effects.py; NOT the guessed 297)
    description: "Fills the Paladin with the spirit of justice for 30 sec, giving melee attacks a chance to stun the target for 2 sec. Only one Seal can be active at a time. Unleashing this Seal's energy judges an enemy, preventing them from fleeing for 20 sec."
    auraDescription: "Melee attacks have a chance to stun the target for 2 sec. Lasts 30 sec."
    skillLine: 184

# --- Seal of Light (932725-932747, Tasks 4+5b of the 2026-08-20 seal reconstruction). Vanilla SoL is
#     a 4-rank seal (L30/40/50/60) whose on-hit effect is a FLAT self-heal (not the WotLK %-max-HP
#     on-hit) and whose Judgement (Judgement of Light) heals the ATTACKER a FLAT amount per hit landed
#     on the debuffed target — WotLK's stock 20185/20267 pair instead heals
#     CountPctFromMaxHealth(GetAmount()) (a % of the ATTACKER's max HP; see
#     spell_pal_judgement_of_light_heal, azerothcore-wotlk/src/server/scripts/Spells/spell_paladin.cpp:1329).
#     AUTHORITATIVE 1.12.1 values: seal mana 95/120/155/180, on-hit flat self-heal 38/52/75/93,
#     Judgement of Light flat heal/hit 24/33/48/60 (wowhead Classic cross-checked).
#
#     Seal shape (932725-728) matches 932700/932724/932606 (CLONE of stock 20375 to inherit family 10
#     + flagsA bit25 => SPELL_SPECIFIC_SEAL): Effect_1 = PROC_TRIGGER_SPELL -> the rank's on-hit flat
#     heal (rate = `ppm: 10`, final review I-12 — the Vanilla heal is a flat per-hit number, so unlike
#     SoR's on-hit damage there is NO weapon-speed scaling in the PAYLOAD; the PPM rate itself is
#     weapon-speed-normalized by the core, which is the point of using it over a flat chance). EFFECT_2 (Effect_3 column) = DUMMY whose amount is
#     the rank's Judgement of Light payload id, so core spell_pal_judgement unleashes it with zero core
#     patch (same mechanism as 932700/932724). No family/maskB/maskC override — there is no "Improved
#     Seal of Light" talent, so nothing needs to bind to this seal or its on-hit payload.
#
#     On-hit heal (932729-732) is a HIDDEN triggered payload (no client row, like SoR's on-hit spell
#     932708-715): SPELL_EFFECT_HEAL on the caster (self, targetA 1), flat basePoints per rank — no
#     weapon-speed or AP/SP scaling (Vanilla SoL's on-hit heal is a flat tick per the 1.12.1 client).
#
#     Judgement of Light payload (932733-736) is a CLONE of stock 20185 (NOT a from-scratch helper),
#     so — since no `family`/`mask` key is authored here — it INHERITS word-A bit19 unchanged
#     (SpellClassSet 10 / SpellClassMask_1 524288, confirmed via dump_spell_effects.py) — the exact bit
#     Lasting Judgement's spellmod (node 18613, `affects: [Judgement of Light, Judgement of Wisdom]`)
#     binds on, extending the debuff duration by 10/20/30s. `durationIndex` is overridden to 1 (10s) —
#     Vanilla JoL lasts 10s, not stock 20185's own inherited 20s (its DurationIndex is 18); Lasting
#     Judgement then extends the OVERRIDDEN 10s base. Effect_0 is a DUMMY (targetA 6 = the judged
#     enemy, matching JoR's 932716-723 SCHOOL_DAMAGE targetA) whose amount is the flat heal/hit
#     (24/33/48/60), read by the `era_pal_judgement_of_light` AuraScript below instead of core's
#     %-max-HP script. client.auraDescription is MANDATORY on this clone — the generator hard-errors
#     if a template clone would otherwise leak stock 20185's WotLK tooltip text.
#     `proc.flags` = 139944 is 20185's OWN DBC ProcTypeMask (confirmed via dump_spell_effects.py):
#     TAKEN_MELEE_AUTO_ATTACK(8) | TAKEN_SPELL_MELEE_DMG_CLASS(32) | TAKEN_RANGED_AUTO_ATTACK(128) |
#     TAKEN_SPELL_RANGED_DMG_CLASS(512) | TAKEN_SPELL_NONE_DMG_CLASS_NEG(8192) |
#     TAKEN_SPELL_MAGIC_DMG_CLASS_NEG(131072) — i.e. "this debuff-holder was struck" (a TAKEN mask on
#     the victim's own aura), so ProcEventInfo::GetActor() in the script resolves to the ATTACKER, not
#     the debuff holder. `chance: 100` (every qualifying hit heals) is a DELIBERATE divergence from
#     stock's own spell_proc row (SpellId 20185: ProcFlags=0 [inherits the DBC value above unmodified],
#     SpellTypeMask=1, ProcsPerMinute=15, Chance=0). The reason is PURELY era fidelity, not a
#     generator limit: a `ppm:` key DOES exist (`spell_proc.ProcsPerMinute` — the SoL seals right
#     above ship `ppm: 10`), so WotLK's 15-PPM throttle is expressible and is deliberately NOT
#     reproduced. Vanilla's own 1.12.1 tooltip ("causing attacks against them to heal the attacker
#     for X") carries no chance/PPM qualifier, unlike WotLK's throttled retune, so an unconditional
#     per-hit heal is the faithful Vanilla behavior. (Earlier revisions of this banner justified the
#     same decision with a "the generator has no ppm key" premise that was false from the day the key
#     landed and is flatly contradicted by this file now — the DECISION stands, the reason did not.)
#     `typeMask` is left at the generator default (1 = damage-type spells
#     only), which already matches stock 20185's own SpellTypeMask=1 verbatim.
#
#     932747 is the shared flat-heal CARRIER cast by `era_pal_judgement_of_light` via CastCustomSpell
#     (the amount is supplied at cast time from the DUMMY's amount, not baked per-rank) — a single
#     hidden SPELL_EFFECT_HEAL helper reused by all 4 ranks (mirrors the stock 20267 carrier's role).
# ---------------------------------------------------------------------------------------------------
