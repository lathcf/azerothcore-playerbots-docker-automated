# === Vanilla Scorpid Sting (baseline version-swap) + Improved Scorpid Sting (node 18328). ==========
# Stock 3043 (the only Scorpid Sting rank a WotLK hunter trains) is the WotLK REWORK: a flat -hit-chance
# debuff (aura 54 MOD_HIT_CHANCE). Vanilla Scorpid Sting reduced the target's STRENGTH and AGILITY (aura
# 29 MOD_STAT) across 4 ranks — the higher ranks (14275-14277) were DELETED from the 3.3.5a DBC, leaving
# only the reworked 3043. So the era version reconstructs the 4-rank Str/Agi chain as custom clones and
# version-swaps it in for Vanilla hunters (stock 3043 stays for WotLK). VALUES are the AUTHORITATIVE
# 1.12.1 client Spell.dbc (era-wow/tools/vanilla-extract/Spell.dbc, ids 3043/14275/14276/14277):
# Str=Agi -21/-30/-46/-69, mana 70/90/125/165, levels 22/32/42/52, 20s (durIdx 18).
#
# Each clone templates 3043 (inherit family 9 + the Scorpid-Sting family flag = sting mutual-exclusion,
# rangeIndex 114, instant cast, visual) and overrides the 3 effects: E1 MOD_STAT Str, E2 MOD_STAT Agi,
# E3 MOD_STAT Stamina (misc 2, base 0 — the Improved-only stamina, set by era_hunter_scorpid_sting).
# TRAINING: custom chain on the hunter trainer (Id 7) gated on marker 932304 ("Vanilla Hunter"); stock
# 3043 re-gated on 932305 ("WotLK Hunter") — 2026_08_24_12 migration. ReconcileBaselineSpells grants the
# era-matching marker + strips the wrong-era Scorpid Sting from the spellbook.
- id: 932300               # Scorpid Sting Rank 1 (L22, -21 Str/Agi)
