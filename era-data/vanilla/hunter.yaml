# --- Aimed Shot (node 18321) — Vanilla 3s-cast / 6s-cooldown trainer chain R1-R6. ---------------
# Stock 19434 (dump 2026-08-17) is the WotLK REWORK: instant (CastingTimeIndex 18), a -50% healing
# debuff (Effect_2 aura 118), and a 10s cooldown FORCED by the SpellInfoCorrections Aimed-Shot sweep
# (SpellInfoCorrections.cpp:5311 — any family-9 row whose spell-level SpellClassMask_1 has bit
# 0x20000 gets RecoveryTime=10000 + SPELL_ATTR6_NO_CATEGORY_COOLDOWN_MODS). Classic Aimed Shot
# (wowhead classic, all 6 ranks): 3 sec cast, 6 sec cooldown, +ranged-damage bonus, NO healing
# debuff; mana 75/115/160/210/260/310 and levels 20/28/36/44/52/60 match the stock rows exactly
# (dump SpellLevel), only the cast/cooldown/debuff and the bonus damage diverge.
#   SWEEP SIDESTEP (the KEY divergence for this node): the sweep predicate is
#   `SpellClassSet == 9 && (SpellClassMask_1 & 0x00020000)` — BOTH conjuncts — so dropping the WORD-0
#   bit alone escapes it. RE-IDENTIFIED 2026-09-05 (TBC Phase 7 back-port): each clone now carries
#   `family: 9` + `mask: 0` + `maskC: 2097152` (word2 bit 21) instead of the old family:0/mask:0.
#   Word2 bit 21 is FREE in both the live Spell.dbc and the acore_world.spell_dbc overlay (census in
#   era-data/_ref/tbc/hunter-spells.yaml `aimed_shot_identity.evidence`), so no stock hunter spellmod
#   can already reach it, the sweep still never matches, and the 6s RecoveryTime still survives.
#   WHAT THE BACK-PORT BUYS: with a real family the clone is nameable by an `affects:` list, so
#   Vanilla Efficiency (node 18318) now DOES reduce its mana cost — closing Vanilla record gap 4.
#   Two further consequences, both checked and both wanted:
#     * SpellInfo::IsRangedWeaponSpell() (SpellInfo.cpp:1311) used to pass these clones on the
#       EquippedItemSubClassMask arm; it now passes on the family test directly. No behaviour change.
#     * `spell_hun_readiness` walks the caster's cooldown map clearing every SPELLFAMILY_HUNTER
#       spell, so a Vanilla hunter's Readiness now resets these clones — which is CORRECT and is a
#       latent Vanilla defect the back-port fixes.
#   SpellMgr.cpp:3499 (FORCE_SEND_CATEGORY_COOLDOWNS) keys on the same word-0 bit and likewise still
#   never matches; the cooldown lives in RecoveryTime, which the client is sent regardless.
#   CATEGORY: stock Aimed Shot's 10s cooldown is a Category-85 CategoryRecoveryTime (10000), NOT
#   RecoveryTime — an inherited Category 85 would pin the clone at 10s even after the sweep is
#   sidestepped, so each clone sets category:0 + categoryCooldown:0 (new generator scalars) and
#   puts the whole 6s cooldown in RecoveryTime.
#   Effect_1 = 121 SPELL_EFFECT_NORMALIZED_WEAPON_DMG (ranged weapon damage + flat bonus, the shot
#   mechanic inherited from 19434); the WotLK healing debuff (Effect_2 aura 118) is dropped because
#   templated clones 0-fill absent effect slots. Bonus value X -> basePoints X-1, dieSides 1.
#   castTimeIndex 14 = 3000 ms (SpellCastTimes.dbc, parsed 2026-08-17); template's index 18 = instant.
- id: 932952
  name: Aimed Shot
  template: 19434          # CLONE stock Aimed Shot — inherits ranged shot mechanic/ammo/range/visual
  spellFixAck: >-
    No BY-ID `ApplySpellFix` exists for 19434 or any of its ranks (whole-file grep of
    SpellInfoCorrections.cpp, fork HEAD). The only correction that touches Aimed Shot is the
    FAMILY+FLAG sweep at SpellInfoCorrections.cpp:5311-5318, and this clone escapes it DELIBERATELY:
    the arm requires `SpellClassSet == SPELLFAMILY_HUNTER && (SpellFamilyFlags[0] & 0x00020000)`,
    and the clone carries word2 bit 21 instead of word0 bit 17. Inheriting that sweep would force
    RecoveryTime to 10 s and set SPELL_ATTR6_NO_CATEGORY_COOLDOWN_MODS — i.e. WotLK's retune over
    Vanilla's 6 s cooldown, which is the whole reason this clone exists.
  family: 9               # SPELLFAMILY_HUNTER — re-identified 2026-09-05 (was 0); see the block above
  mask: 0                 # word0 stays 0: 0x20000 is the SWEPT bit and must never be set here
  maskC: 2097152          # word2 bit 21 — the era Aimed Shot identity (free in both stores)
