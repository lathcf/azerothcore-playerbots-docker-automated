  - { effect: 6, aura: 29, basePoints: -21, misc: 0, targetA: 6 }   # MOD_STAT Strength
  - { effect: 6, aura: 29, basePoints: -21, misc: 1, targetA: 6 }   # MOD_STAT Agility
  - { effect: 6, aura: 29, basePoints: 0,   misc: 2, targetA: 6 }   # MOD_STAT Stamina (Improved-only; era_hunter_scorpid_sting sets it)
