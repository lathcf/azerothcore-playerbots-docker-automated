# --- Bestial Wrath (node 18316) — Vanilla 18s / 12% base mana clone. ----------------------------
# Stock WotLK 19574 (dump 2026-08-17): aura 61 MOD_SCALE +50 / aura 79 MOD_DAMAGE_PERCENT_DONE +50
# misc 127 / aura 77 MECHANIC_IMMUNITY misc 12 (stun), all targetA 5 (pet); RangeIndex 6 (100 yd),
# instant, RecoveryTime 120000, ManaCostPct 10, DurationIndex 1 = 10s. Classic 19574
# (wowhead/classic/spell=19574): SAME effects but 18 sec and 12% of base mana — only duration+cost
# diverge, so a template clone overriding exactly those two fields is the faithful era version.
# durationIndex 85 = 18000 ms (SpellDuration.dbc, parsed 2026-08-17: (85, 18000, 0, 18000)).
# manaCostPct rides the new _HELPER_SCALARS entry (gen_era_talents.py, this task).
- id: 932967
  name: Bestial Wrath
  template: 19574          # CLONE stock Bestial Wrath — inherits visual/range/CD/attrs
  spellFixAck: >-
    NOT an ack — BOTH lost corrections are REPRODUCED IN DATA below. (a)
    SpellInfoCorrections.cpp:4071 ORs SPELL_ATTR4_AURA_EXPIRES_OFFLINE (0x4) into 19574; template
    DBC AttributesEx4 is 0 (dump 2026-09-06), so the post-fix value is 4 -> `attributesEx4: 4`.
    (b) :5199-5206 ORs SPELL_ATTR2_NO_SCHOOL_IMMUNITIES (0x04000000) into 42292 / 59752 / 19574 /
    34471; template DBC AttributesEx2 is 0, so the post-fix value is 67108864 -> `attributesEx2:
    67108864`. Generator keys exist for both (`attributesEx2` / `attributesEx4` are in
    gen_era_talents.py's _HELPER_SCALARS); the earlier note claiming otherwise was wrong.
  durationIndex: 85        # 18 sec (Vanilla; stock index 1 = 10 sec)
  manaCostPct: 12          # 12% of base mana (Vanilla; stock 10%)
  attributesEx2: 67108864  # SPELL_ATTR2_NO_SCHOOL_IMMUNITIES — post-fix value (template 0 | bit)
  attributesEx4: 4         # SPELL_ATTR4_AURA_EXPIRES_OFFLINE — post-fix value (template 0 | bit)
  effects:                 # 19574's own three effects, re-authored verbatim (lint requires
                           # explicit effects on template clones; dump 2026-08-17, stock
                           # convention basePoints X + dieSides 1 -> value X+1)
  - { effect: 6, aura: 61, basePoints: 49, dieSides: 1, targetA: 5 }             # MOD_SCALE +50 (pet)
  - { effect: 6, aura: 79, basePoints: 49, dieSides: 1, misc: 127, targetA: 5 }  # MOD_DAMAGE_PERCENT_DONE +50 all schools
  - { effect: 6, aura: 77, basePoints: -1, dieSides: 1, misc: 12, targetA: 5 }   # MECHANIC_IMMUNITY (stun)
  client:
    name: Bestial Wrath
    icon: 1680             # stock 19574 SpellIconID (dump 2026-08-17)
    description: "Send your pet into a rage causing 50% additional damage for 18 sec. While enraged, the beast does not feel pity or remorse or fear and it cannot be stopped unless killed."
    auraDescription: "Enraged: damage increased by 50%. Cannot be stopped unless killed."
    skillLine: 50          # Beast Mastery tab (stock 19574's SkillLine)
