# --- Wyvern Sting (node 18346) — Vanilla 12s sleep + 300-over-12s wake DoT. ---------------------
# Stock WotLK 19386 (dump 2026-08-17): aura 12 MOD_STUN / Mechanic 10 (sleep), DurationIndex 9 =
# 30s, ManaCost 115, RangeIndex 114 (8-35 yd), instant, CategoryRecoveryTime 60000 (Category 1111),
# DefenseType 3, DispelType 4 (poison). Classic 19386 (wowhead classic): 115 mana, 8-35 yd,
# instant, 2 MIN cooldown, 12 sec sleep, "Cannot be used in combat". Divergences -> overrides:
# 12s duration (idx 29), 120s RecoveryTime, + SPELL_ATTR0_NOT_IN_COMBAT_ONLY_PEACEFUL
# (0x10000000, SharedDefines.h:398 "Cannot be used in combat") OR'd onto the template's
# Attributes 1114114 -> 269549570. NB the template's 60s CategoryRecoveryTime is inherited and
# kept: it only cross-gates category-1111 members (the stock WotLK Wyvern ranks a Vanilla hunter
# never has); the spell's own cooldown is the overridden 120s RecoveryTime.
# The wake-DoT fires via the era_wyvern_sting module script (scriptBindings above) casting 932966.
- id: 932965
  name: Wyvern Sting
  template: 19386          # CLONE stock Wyvern Sting — inherits range/cost/visual/mechanic
  durationIndex: 29        # 12 sec sleep (SpellDuration.dbc idx 29 = 12000; stock idx 9 = 30000)
  cooldown: 120000         # 2 min (Vanilla; stock rides a 60s category cooldown only)
  attributes: 269549570    # template 1114114 | 0x10000000 NOT_IN_COMBAT_ONLY_PEACEFUL (Vanilla)
  effects:
  - { effect: 6, aura: 12, basePoints: -1, dieSides: 1, targetA: 6 }   # MOD_STUN (sleep), stock encoding
  client:
    name: Wyvern Sting
    icon: 1721             # stock 19386 SpellIconID (dump 2026-08-17)
    description: "A stinging shot that puts the target to sleep for 12 sec. Any damage will cancel the effect. When the target wakes up, the Sting causes 300 Nature damage over 12 sec. Only usable out of combat. Only one Sting per Hunter can be active on the target at a time."
    auraDescription: "Asleep. Any damage will cancel the effect. When the target wakes up, the Sting causes 300 Nature damage over 12 sec."
    skillLine: 51          # Survival tab (SkillLineAbility row 10930: 19386 -> 51)
# Wyvern Sting wake-DoT: stock WotLK 24131 (dump 2026-08-17) = aura 3 PERIODIC_DAMAGE 100 per
# EffectAuraPeriod 2000, DurationIndex 32 = 6s (300 total over 6s), targetA 25, DispelType poison.
# Classic 24131 (wowhead classic + warcraft.wiki.gg): "50 Nature damage every 2 seconds" over
# 12 sec = 300 total (3.1.0 is where the 12s DoT became 6s). Clone: 12s duration + 50/tick — the
# 2s tick period is INHERITED from the template (helpers have no amplitude key), 6 ticks x 50.
- id: 932966
  name: Wyvern Sting
  template: 24131          # CLONE stock rank-1 DoT — inherits period/school/dispel/visual
  spellFixAck: >-
    SpellInfoCorrections.cpp:4240 rewrites `Effects[EFFECT_0].TargetA` of 24131 / 24134 / 24135 from
    the DBC's TARGET_UNIT_TARGET_ANY (25) to TARGET_UNIT_TARGET_ENEMY (6) -- a target rewrite with no
    generator key other than authoring `targetA:`, which this clone now DOES (`targetA: 6` below), so
    the correction is fully reproduced and nothing is lost. FIXED 2026-09-06 (TBC hunter Phase 7,
    spec Amendment A.14 defect 1): this helper previously authored the stock UNCORRECTED 25, so it
    was the one Wyvern DoT in either era whose implicit target check was ANY rather than ENEMY.
  durationIndex: 29        # 12 sec (Vanilla; stock idx 32 = 6000)
  effects:
  - { effect: 6, aura: 3, basePoints: 49, dieSides: 1, targetA: 6 }    # PERIODIC_DAMAGE 50/2s;
    # targetA 6 = TARGET_UNIT_TARGET_ENEMY, the post-fix value of ApplySpellFix({24131,24134,24135}).
  client:
    name: Wyvern Sting
    icon: 1721             # same icon as the sleep (stock 24131 also carries 1721)
    auraDescription: "50 Nature damage every 2 sec."
# --- Entrapment root (node 18334 trigger) — Vanilla 5 sec root. ---------------------------------
# Stock WotLK roots diverge per rank: 19185/64803/64804 = DurationIndex 39/27/35 = 2s/3s/4s
# (dump 2026-08-17). Classic 19185 (wowhead classic): 5 sec root, mechanic Rooted. Clone the
# rank-1 root shell (aura 26 MOD_ROOT, Mechanic 7, family 0 — deliberately NOT family 9, so no
# hunter spellmod can stretch it, matching classic) with the 5s index. Visible debuff -> client:.
- id: 932972
  name: Entrapment
  template: 19185          # CLONE stock Entrapment root — inherits root aura/mechanic/visual
  spellFixAck: >-
    NOT an ack — the correction is REPRODUCED IN DATA below. SpellInfoCorrections.cpp:691 makes
    three changes to 19185 / 64803 / 64804 that a clone never inherits (they are applied BY ID to
    the stock SpellInfo): `Effects[EFFECT_0].TargetA = TARGET_DEST_TARGET_ENEMY` (53), `TargetB =
    TARGET_UNIT_DEST_AREA_ENEMY` (16), and `AttributesEx5 |= SPELL_ATTR5_ALWAYS_AOE_LINE_OF_SIGHT`
    (0x04000000; the template's live DBC AttributesEx5 is 0, so the post-fix value is 67108864).
    All three are authored here. The raw DBC shape a bare clone would inherit is TargetA 22 =
    TARGET_SRC_CASTER / TargetB 15 = TARGET_UNIT_SRC_AREA_ENEMY at EffectRadiusIndex 13 — i.e. a
    10 yd AoE root centred on the HUNTER, which the correction exists to turn into an area centred
    on the TRAPPED VICTIM. Shipping the pre-fix shape would root every enemy standing next to the
    hunter and (with no ALWAYS_AOE_LINE_OF_SIGHT) enforce LoS on that selection.
  durationIndex: 28        # 5 sec (SpellDuration.dbc idx 28 = 5000; stock idx 39 = 2000)
  attributesEx5: 67108864  # SPELL_ATTR5_ALWAYS_AOE_LINE_OF_SIGHT — post-fix value (template 0 | bit)
  effects:
  - { effect: 6, aura: 26, basePoints: 0, dieSides: 0, targetA: 53, targetB: 16, radius: 13 }
    # ^ MOD_ROOT with the POST-FIX target pair: TARGET_DEST_TARGET_ENEMY / TARGET_UNIT_DEST_AREA_ENEMY
    #   at EffectRadiusIndex 13 — the area is centred on the trapped victim, not on the hunter.
  client:
    name: Entrapment
    icon: 20               # stock 19185 SpellIconID (dump 2026-08-17)
    auraDescription: "Entrapped. Unable to move."
