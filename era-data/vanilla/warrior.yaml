# === BOTH MANAGED ERAS — stance-correction passives 932845-932847 ====================================
# FINAL REVIEW R7, items G-11/G-30 (2026-09-06). WotLK RETUNED all three warrior stances; 1.12.1 and
# 2.4.3 agree with each other on every number, so ONE set of correction passives serves BOTH managed
# eras (the Lay on Hands 932668-670 / Blessing of Sanctuary 932617 dual-era-reuse precedent — the ids
# live in the Vanilla slice and are referenced, not re-minted, by TBC).
#
# THE SHAPE IS DATA-ONLY, NOT A SHAPESHIFT HOOK. The stance passives themselves (7376 / 7381 / 21156)
# are cast BY THE CORE from `AuraEffect::HandleShapeshiftBoosts` off hardcoded ids, so they cannot be
# swapped for a clone the way a talent grant can. Instead each of these three is an ordinary hidden
# LEARNED passive carrying `stances:` (ShapeshiftMask) so the core applies it only inside that stance —
# the same mechanism the shipped Defiance ranks 924352-356 use (`stances: 131072`), which the
# real-client Warrior close verified on 2026-08-24. `Player::_addSpell` casts it at learn time when the
# character is already in the stance (`IsNeedCastPassiveSpellAtLearn`), `HandleShapeshiftBoosts` casts
# it on every later stance ENTRY (its m_spells loop takes any spell with SPELL_ATTR0_DO_NOT_DISPLAY and
# a matching `Stances` bit), and `Aura::IsRemovedOnShapeLost` drops it on stance EXIT. `attributes:
# 262608` is the generator's own stat-passive value = 0x401D0 (0x10 IS_ABILITY | **0x40
# SPELL_ATTR0_PASSIVE** | 0x80 DO_NOT_DISPLAY | 0x100 DO_NOT_LOG | 0x40000 DO_NOT_SHEATH) —
# deliberately WITHOUT 0x10000 NOT_SHAPESHIFTED, which stock 7376/7381/21156 carry and which would
# defeat `IsRemovedOnShapeLost`. The 0x40 PASSIVE bit is LOAD-BEARING, not decoration: the
# stance-entry re-cast loop in `AuraEffect::HandleShapeshiftBoosts` (SpellAuraEffects.cpp:1452)
# skips any m_spells entry that carries neither PASSIVE nor DO_NOT_DISPLAY, and `Player::_addSpell`
# uses the same pair to decide whether to self-cast at learn time. Hidden => no `client:` block and
# no client DBC row (the 947539 Rampage-watcher precedent for a learned, never-displayed passive).
#
# THE VALUES COMBINE WITH THE STOCK PASSIVE, THEY DO NOT REPLACE IT. Both percentage families the core
# reads here are MULTIPLICATIVE across auras — `SPELL_AURA_MOD_DAMAGE_PERCENT_DONE`/`_TAKEN` accumulate
# through repeated `AddPct` in Melee/SpellDamageBonusDone/Taken, and `SPELL_AURA_MOD_THREAT` through
# `GetTotalAuraMultiplierByMiscMask` (ThreatManager.cpp:746/822) — so each correction is authored as
# the multiplier that carries the stock value to the era value, and lands within rounding of it. The
# ONE additive family is `SPELL_AURA_MOD_ARMOR_PENETRATION_PCT` (280), summed by
# `Unit::CalcArmorReducedDamage`'s `GetTotalAuraModifier`, so its correction cancels EXACTLY.
# STOCK VALUES, all from the live DBC dump 2026-09-06 (basePoints are stored value-1 with dieSides 1):
#   7376  Defensive Stance passive : aura 87 -10% dmg TAKEN misc 127 | aura 79 -5% dmg DONE misc 127 | aura 10 +45% THREAT misc 127
#   7381  Berserker Stance passive : aura 52 +3% weapon CRIT        | aura 87 +5% dmg TAKEN misc 127 | aura 10 -20% THREAT misc 127
#   21156 Battle Stance passive    : aura 10 -20% THREAT misc 127   (Effect_2/3 empty)
#   2457  Battle Stance itself     : aura 36 SHAPESHIFT misc 17     | aura 280 +10% ARMOR PENETRATION misc 0   <- the WotLK-only armor-pen half
#   71 / 2458 (Defensive/Berserker Stance) carry ONLY the aura-36 shapeshift effect — no extra modifiers.
# ERA TARGETS (identical in 1.12.1 and 2.4.3):
#   Defensive : -10% damage done, -10% damage taken, +30% threat
#   Berserker : +3% crit,        +10% damage taken,  no threat modifier
#   Battle    : no modifiers at all
# RESIDUAL ROUNDING (stated so it is not "fixed" later): the multiplicative families cannot land on an
# exact integer target with integer aura amounts, so Defensive settles at -9.75% damage done
# (0.95 x 0.95) against -10%, Defensive threat at +30.5% (1.45 x 0.90) against +30%, and Berserker
# damage taken at +10.25% (1.05 x 1.05) against +10%. All three are <= 0.5 pp — the same class of
# residual the TBC Heart of the Wild investigation measured (CLAUDE.md patch 0023) and far below what a
# player can observe. The two THREAT-cancelling corrections (Berserker, Battle) and the Battle armor-pen
# correction are EXACT (0.80 x 1.25 = 1.00; +10 + -10 = 0).
- id: 932845
  name: Defensive Stance (Era)
  attributes: 262608       # hidden stance passive — see the block header (NO 0x10000 NOT_SHAPESHIFTED)
  stances: 131072          # FORM_DEFENSIVESTANCE (1 << 17)
  effects:
  # damage DONE: stock 7376 gives -5%; era wants -10%. 0.95 x 0.95 = 0.9025 => -9.75% (residual +0.25 pp).
  - { effect: 6, aura: 79, basePoints: -5,  dieSides: 0, misc: 127, targetA: 1 }
  # THREAT: stock 7376 gives +45%; era wants +30%. 1.45 x 0.90 = 1.305 => +30.5% (residual +0.5 pp).
  - { effect: 6, aura: 10, basePoints: -10, dieSides: 0, misc: 127, targetA: 1 }
  # damage TAKEN needs NO correction: stock 7376's -10% is already the era value.
- id: 932846
  name: Berserker Stance (Era)
  attributes: 262608
  stances: 262144          # FORM_BERSERKERSTANCE (1 << 18)
  effects:
  # damage TAKEN: stock 7381 gives +5%; era wants +10%. 1.05 x 1.05 = 1.1025 => +10.25% (residual +0.25 pp).
  - { effect: 6, aura: 87, basePoints: 5,  dieSides: 0, misc: 127, targetA: 1 }
  # THREAT: stock 7381 gives -20%; era has NO threat modifier. 0.80 x 1.25 = 1.00 => exact cancel.
  - { effect: 6, aura: 10, basePoints: 25, dieSides: 0, misc: 127, targetA: 1 }
  # weapon CRIT needs NO correction: stock 7381's +3% (aura 52) is already the era value.
- id: 932847
  name: Battle Stance (Era)
  attributes: 262608
  stances: 65536           # FORM_BATTLESTANCE (1 << 16)
  effects:
  # THREAT: stock 21156 gives -20%; era has NO threat modifier. 0.80 x 1.25 = 1.00 => exact cancel.
  - { effect: 6, aura: 10,  basePoints: 25,  dieSides: 0, misc: 127, targetA: 1 }
  # ARMOR PENETRATION: stock 2457 (the stance spell itself) carries a WotLK-only +10% (aura 280, misc 0);
  # era has none. Aura 280 is SUMMED (Unit::CalcArmorReducedDamage -> GetTotalAuraModifier), and that
  # sum's own filter accepts an EquippedItemClass -1 aura with misc 0 and no class mask — which both
  # 2457's effect and this one are — so +10 + -10 = 0 exactly, for spell and auto-attack alike.
  - { effect: 6, aura: 280, basePoints: -10, dieSides: 0, misc: 0,   targetA: 1 }
