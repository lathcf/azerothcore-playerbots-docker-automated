helpers:
# --- Deep Wounds bleed (node 18509 proc-scripted -> era_deep_wounds casts this). ------------------
# Vanilla Deep Wounds = "20/40/60% of your average melee weapon damage as a bleed over 12 sec". The
# WotLK stock Deep Wounds bleed (12721) was RETUNED (dump 2026-08-18: aura 3 PERIODIC_DAMAGE, period
# 1000 ms, DurationIndex 32 = 6000 ms, and in WotLK the % is of the TRIGGERING spell's damage, not of
# weapon damage) — so it can't be granted; the era_deep_wounds AuraScript computes the Vanilla amount
# and applies THIS helper as the carrier. Clone 12721 to inherit its 1000 ms tick period + physical
# bleed visual (helpers have NO amplitude key — the period MUST come from a template), then re-stretch
# to 12 s (durationIndex 29, the same 12s index the hunter Wyvern DoT 932966 uses; stock idx 32 = 6s)
# -> 12000/1000 = 12 ticks (era_deep_wounds divides the total by GetMaxTicks()). family: 0 makes it
# family-less so no warrior spellmod can stretch it AND it escapes the family-4 SpellInfoCorrections
# sweep (the hunter Entrapment-clone precedent). Per-tick base point is set at cast time by the script.
- id: 932800
  name: Deep Wounds
  template: 12721          # clone stock Deep Wounds bleed (inherit 1000ms period + physical bleed visual)
  durationIndex: 29        # 12 sec (Vanilla; stock 12721 idx 32 = 6000). 12000/1000 = 12 ticks.
  family: 0               # family-less: no warrior spellmod reaches it; escapes the family-4 sweep
  school: 1              # physical
  effects:
  - { effect: 6, aura: 3, basePoints: 0, dieSides: 0, targetA: 6 }   # PERIODIC_DAMAGE; per-tick value set at cast by era_deep_wounds
  client:
    name: Deep Wounds
    icon: 243             # stock Deep Wounds SpellIconID (12721 dump 2026-08-18)
    auraDescription: "Bleeding for physical damage every 1 sec."
