    # CLONE-grant — verdict 2026-08-18, REVISED by final review R7 (2026-09-06, item I-7).
    # ORIGINAL VERDICT (superseded): grant stock 23922 because 20 rage / 6 s cd / dispel-1-magic all
    # match Vanilla and the block-value scaling is not a clonable DBC value.
    # WHAT THAT MISSED: the block-value scaling is NOT script-driven — `Spell::EffectSchoolDMG`
    # (SpellEffects.cpp:351) adds it in the CORE effect handler, gated on `SpellFamilyFlags[1] & 0x200
    # && GetCategory() == 1209`, both of which a clone can carry. What genuinely diverges is the
    # DAMAGE: stock 23922-23925 ship the WotLK ranges 294-308 / 346-362 / 396-416 / 447-469 against
    # Vanilla's 225-235 / 264-276 / 303-317 / 342-358 — the numbers this node's own tooltip states.
    # So the node now grants the era clone chain (helpers 932841-932844; r2-r4 trainer-taught at
    # L48/54/60 behind r1, hand SQL 2026_09_06_05), exactly as TBC node 20362 grants 947541-947546.
    # The stock ranks are stripped from a Vanilla warrior UNCONDITIONALLY (they are wrong at every
    # rank, so the strip cannot be node-gated) by EraTalents.cpp CLASS_WARRIOR arm (4); the
    # kBaselineSpellGates row keyed on this node keeps force-granting stock r1 to WotLK-stage
    # warriors, whose trainer row for it is globally deleted.
    grants: {1: [932841]}
