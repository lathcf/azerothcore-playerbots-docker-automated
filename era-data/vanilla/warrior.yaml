    # CLONE + GRANT — verdict 2026-08-18. WotLK Concussion Blow 12809 DIVERGED from Vanilla: stock is a
    # 30 sec cooldown (RecoveryTime 30000) + Effect_2 SCHOOL_DAMAGE (AP-scaled by script), whereas
    # Vanilla (wowhead classic, verified 2026-08-18) is a 45 sec cooldown, 15 rage, 5 sec stun, NO
    # damage. Granting 12809 would ship a stronger-than-Vanilla ability with the wrong tooltip; the stun
    # is pure DBC (not script-bound like Last Stand's HP / Shield Slam's block-value), so it clones
    # cleanly without C++. Grant per-era clone 932822 (45s cd, stun-only; see helpers:) — stock 12809
    # ships untouched for WotLK-stage chars. The Death Wish clone precedent (node 18531).
    grants: {1: [932822]}
