# --- Shield Specialization 932823-827 (node 18536 grants one per rank) — Vanilla block% + rage-on-block.
# Vanilla Shield Specialization (warcraft.wiki.gg Classic, verified 2026-08-18): 5 ranks, +1/2/3/4/5%
# block chance AND a 20/40/60/80/100% chance to generate 1 rage WHEN A BLOCK OCCURS. Both halves live
# in ONE granted passive per rank (a single talent node can't carry a stat effect AND a data proc — a
# `multi` node is stat/spellmod-only and a `proc` node's carrier is aura-42-only — so the faithful
# build is a per-rank helper clone that carries both effects + its own spell_proc row; framework:
# "A helper may also carry a proc: block, which emits a spell_proc row").
# Clone the MATCHING per-rank stock Shield Spec spell (932823<-12298 ... 932827<-12727): the clone
# inherits Attributes 464 (PASSIVE 0x40 + hidden-clientside 0x80 -> no spellbook entry, so NO client:
# block is needed, exactly like the shipping block% auto-passive) + SpellIconID 1463 + SpellClassSet 0
# (family-less: no warrior spellmod reaches it AND it escapes the family-4 SpellInfoCorrections sweep).
# Effect_1 = aura 51 MOD_BLOCK_PERCENT, basePoints eff-1 + dieSides 1 -> +1..5% (BYTE-IDENTICAL to the
# stat node it replaces AND to stock). Effect_2 = aura 42 PROC_TRIGGER_SPELL -> 12964 (the stock +1-rage
# energize; Effect_1 30 ENERGIZE +1 rage, already client-DBC-present, family 0 — the SAME payload
# Unbridled Wrath 18522 reuses). Vanilla is 1 rage; stock Shield Spec triggers 23602 = +5 rage (a WotLK
# divergence), so we deliberately swap the trigger to 12964.
# proc: flags 680 = the stock Shield Spec ProcTypeMask (PROC_FLAG_TAKEN_{MELEE_AUTO 0x8, SPELL_MELEE
# 0x20, RANGED_AUTO 0x80, SPELL_RANGED 0x200}) = all taken melee+ranged hits. hitMask 64 = PROC_HIT_BLOCK
# (SpellMgr.h:263) = fires ONLY on a block: the block gate is REAL, not the WotLK behavior — stock Shield
# Spec has NO spell_proc row so it uses the DBC default HitMask (NORMAL|CRIT) and rages on ANY taken hit;
# our HitMask 64 restores Vanilla's block-only rage. Verified block-gated against the fork proc engine:
# Unit.cpp:148 sets PROC_HIT_BLOCK whenever blocked_amount>0 (partial AND full block), and
# SpellMgr::CanSpellTriggerProcOnEvent (SpellMgr.cpp:929-940) rejects the proc unless
# eventInfo.GetHitMask() & procEntry.HitMask — so only a hit that blocked satisfies it. HitMask is
# honored because flags 680 sits in TAKEN_HIT_PROC_FLAG_MASK (SpellMgr.h:178, LoadSpellProcs:2121).
# typeMask 7 = PROC_SPELL_TYPE_MASK_ALL — the value the core auto-generates for an aura-42 carrier
# (SpellMgr.cpp:1951 default; 42 is not in the damage-only override list). The generator's default
# typeMask 1 (DAMAGE) would drop a FULL block of a melee-CLASS spell: SpellMgr.cpp:911 only checks
# SpellTypeMask for spell events (TAKEN_SPELL_* are in SPELL_PROC_FLAG_MASK), and Unit.cpp:6820-6827
