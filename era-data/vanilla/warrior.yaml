    prereqPoints: 20
    tooltip:
    - Gives your Shield Bash ability a 50% chance to silence the target for 3 sec.
    - Gives your Shield Bash ability a 100% chance to silence the target for 3 sec.
    # AUTHORED (proc -> stock 3s silence 18498) — verdict 2026-08-18. Vanilla Improved Shield Bash =
    # 50/100% chance the Shield Bash silences for 3 sec, 2 ranks (skeleton). The 3s silence payload
    # already exists as a STOCK client-DBC spell: 18498 "Silenced - Gag Order" (aura 27 MOD_SILENCE,
    # Mechanic 9 MECHANIC_SILENCE, DurationIndex 27 = 3000ms, dump 2026-08-18) — reused directly as the
    # trigger (no clone, no client block; it's the WotLK warrior Gag-Order silence, so it renders a real
    # debuff). Shield Bash 72 is a melee-class ability that deals NO damage (Effect_1 68 INTERRUPT_CAST,
    # no SCHOOL_DAMAGE), so its hit event carries NO_DMG_HEAL — mirror the Arms Improved Hamstring proc:
    # flags 16 (DONE_SPELL_MELEE_DMG_CLASS) + typeMask 5 (DAMAGE|NO_DMG_HEAL) or the proc could never
    # fire. Scope to Shield Bash via `affects` (family 4 bit 2048).
    mechanic: proc
    proc:
      flags: 16                  # DONE_SPELL_MELEE_DMG_CLASS (Shield Bash is a melee-class ability)
      typeMask: 5                # DAMAGE(1) | NO_DMG_HEAL(4): Shield Bash deals no damage (interrupt
                                 # only), so its hit event is NO_DMG_HEAL — without bit 4 the proc never
                                 # fires (the Improved Hamstring / Improved Wing Clip bug class)
      chance: [50, 100]
      affects: ["Shield Bash"]   # 72, family 4 bit 2048 (_ref) — scope the proc to Shield Bash
      trigger: 18498             # stock "Silenced - Gag Order" 3s silence (already in client DBC)
