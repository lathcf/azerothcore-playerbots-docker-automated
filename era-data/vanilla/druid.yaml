# ---- Feral Combat helper clones (Druid band 932500-932599) --------------------------------------
# 932500-502: Predatory Strikes % of level (node 18725). Clone of stock 16972/16974/16975 keeping
#   SpellIconID 1563 (inherited from the template) — the core's feral-AP formula (StatSystem.cpp)
#   detects the DUMMY aura BY ICON 1563 at effect index 0 and reads its amount as the "% of level"
#   multiplier. Only effect-0 authored (DUMMY 50/100/150); the templated clone 0-fills effects 2/3,
#   dropping the WotLK weapon-AP% (effect 1) and the aura-109 Ravage proc (effect 2). Hidden passive
#   (no client block); core gates use via IsInFeralForm(), so no stances needed.
# 932503: Leader of the Pack +3% party crit (node 18731). Clone of the passive spellbook entry 17007
#   (inherits its passive Attributes 464 + icon 312); stances -> ShapeshiftMask 145 so the core's
#   shapeshift passive-loop applies it only in Cat/Bear/Dire Bear form; effect 35 APPLY_AREA_AURA_
#   PARTY aura 52 MOD_WEAPON_CRIT_PERCENT +3% (radius index 12 = 100yd, as stock 24932). No heal/mana.
# ---- Balance helper clones (Druid band 932500-932599) -------------------------------------------
# 932504: Nature's Grace flat -0.5s next-spell buff (node 18712, RECONSTRUCTION). Clone of stock
#   16886 (WotLK's %-cast-SPEED haste buff) reshaped to Vanilla: Effect_1 aura 107 ADD_FLAT_MODIFIER
#   misc 10 (SPELLMOD_CASTING_TIME) basePoints -500 = flat -0.5s, ProcCharges 1 (consumed by the next
#   spell), DurationIndex 21 (-1 = persists until consumed, matching "your next spell", like Nature's
#   Swiftness 17116). Per-effect mask AUTHORED ALL-ONES (maskA/B/C = 0xFFFFFFFF) so the SPELLMOD binds
#   EVERY druid spell — 1.12 Nature's Grace was unrestricted ("your next spell"). All-ones is safe
#   because the family gate comes FIRST: SpellInfo::IsAffected (SpellInfo.cpp:1331) returns false on a
#   family mismatch before it ever looks at the flags, and this clone's family is 7 (inherited from
#   16886), so a non-druid spell can never bind no matter how wide the mask is.
#   The templated clone would otherwise INHERIT 16886's WotLK EffectSpellClassMask, whose EFFECT-1
#   words are (16777831, 58720288, 512) — the nature-caster set. (The often-quoted "B=1" is
#   EffectSpellClassMaskB_1, i.e. EFFECT 2's word A, not part of effect 1's mask at all.)
#   PRACTICAL DELTA of the widening is small and deliberately so: Moonfire, Rebirth and Hibernate were
#   already inside the WotLK mask, so what all-ones actually adds is Gift of the Wild (and
#   "Empowerment"). It does NOT make instants consume the charge: Player::ApplySpellMod
#   (Player.cpp:10020-10023) skips a SPELLMOD_CASTING_TIME mod outright when the base cast time is
#   already 0, and that skip happens BEFORE the charge is registered — so on this core an instant can
#   never eat a Nature's Grace charge, whatever the mask says.
#   Triggered by node 18712's proc; visible buff -> client name/icon/auraDescription,
#   NO skillLine (not learnable). The 1-charge consume is unchanged.
# 932505: Nature's Grasp 35%-base clone (node 18701). Clone of stock 16689 overriding ONLY procChance
#   35 + procCharges 1 (Vanilla) vs stock 100%/3; inherits Effect_2 aura42 PROC_TRIGGER -> 19975
#   (Entangling Roots), ProcTypeMask 40 (on-taken-hit), the 45s duration + 1-min category cd, AND the
#   Nature's Grasp identity mask (A 1048576 + C 4096) so Improved Nature's Grasp (18702) binds it.
#   Castable self-buff granted by 18701 -> client name/icon/description/auraDescription + skillLine 574.
helpers:
