      disposition: grant   # CONFIRMED 2026-08-20 (Task 7): GRANT 17003-17006/24894. +Int (icon 240) is exact. The per-form stat is NOT the DUMMY effect (that's inert) — the core shapeshift handler (SpellAuraEffects.cpp:1509) detects the icon-240 Int aura + form and casts 24899(bear stam)/24900(cat AP). It applies at the WotLK rate (Int%/2, AP not Str for cat) — a documented Task-10 baseline gap; Int% is fully Vanilla-faithful.
