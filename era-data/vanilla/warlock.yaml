# --- Conflagrate (node 18250, Destruction) — Vanilla castable chain; CLONES of stock 17962. -------
# Node 18250 originally BOUND-granted stock 17962, which on this 3.3.5a core is the WotLK 3.0 rework:
# INSTANT cast, damage computed as a % of the target's Immolate (Effect_1 SCHOOL_DAMAGE basePoints 0 +
# the core's %-of-Immolate math), a PERIODIC Fire DoT (Effect_2 aura 3), and — absent Glyph of
# Conflagrate 56235 — a consume of the target's Immolate. Vanilla Conflagrate is a FLAT-damage nuke
# with NO DoT, across 4 ranks. Spells are global and eras per-character, so we can't edit 17962 — the
# node grants clone rank 1 (932780) and the warlock trainer teaches ranks 2-4 (932781-783).
#
# VERIFIED 1.12 spec (classicdb.ch per-rank — the authoritative 1.12 reference; consume + no-DoT +
# instant cross-checked on warcraft.wiki.gg / Wowhead Classic + WoWWiki patch history). INSTANT cast
# (patch 1.7.0 changed Conflagrate from a 1.5s cast to instant and raised damage/mana; 1.12 = instant),
# flat Fire damage (no %-of-Immolate, no spellpower on the flat hit), CONSUMES the caster's Immolate,
# requires the target to carry the caster's Immolate/Shadowflame, 30 yd, 10 sec cooldown:
#   R1 932780  L40  165 mana  240-307   (stock rank id 17962; talent-granted by node 18250)
#   R2 932781  L48  200 mana  316-397   (stock rank id 18930; trainer-taught)
#   R3 932782  L54  230 mana  383-480   (stock rank id 18931; trainer-taught)
#   R4 932783  L60  255 mana  447-558   (stock rank id 18932; trainer-taught)
# The stock Vanilla rank ids (18930-932) are ABSENT from the 3.3.5a DBC (WotLK collapsed Conflagrate to
# the single 17962), so — like Siphon Life's absent higher ranks — each rank is a custom clone. Ranks
# 2-4 are trainer-taught behind a ReqAbility1 chain off 932780 (era-safe: only a Vanilla warlock with
# the talent has 932780), with a spell_ranks chain 932780->781->782->783 and a kWarlockTrainedRanks
# strip mirror in EraTalents.cpp — all in 2026_08_14_15_era_talent_warlock_conflagrate_trainer.sql +
# the CLASS_WARLOCK block. Cost curve (MoneyCost) is a reasonable interpolation to the learn levels.
#
# CONSUME + REQUIREMENT ARE PURE DBC — NO SpellScript. Template 17962 carries TargetAuraState 14
# (AURA_STATE_CONFLAGRATE): the core's generic SPELLFAMILY_WARLOCK SCHOOL_DAMAGE handler
# (SpellEffects.cpp:387) enters the Conflagrate branch for ANY warlock damage spell in that state, which
# (a) gates the cast on the target being in the state (Immolate/Shadowflame sets it), (b) adds a
# %-of-Immolate bonus computed from Effect_2/Effect_3's base values, and (c) removes THIS caster's
# Immolate (line 427). ZEROING Effect_2 + Effect_3 (a templated `effects:` list 0-fills unauthored
# slots) makes the %-bonus 0 (so the flat Effect_1 damage stands and no DoT is applied) while the
# consume + requirement remain — exactly Vanilla. The branch sets apply_direct_bonus=false, so the flat
# damage takes no spellpower — authentic Vanilla. Each client row clones 17962 the same way, inheriting
# TargetAuraState 14 (client shows the Immolate requirement).
# Inherited from template 17962 (not re-authored) on every rank: Category 672 + CategoryRecoveryTime
# 10000 (10s cd), RangeIndex 4 (30 yd), SchoolMask 4 (Fire), SpellClassSet 5 + SpellFamilyFlags_2
# 8388608 (Conflagrate identity — so Destruction fire-damage spellmods that `affects: [Conflagrate]`
# still boost it), icon 12. `client.rank` emits the "Rank N" spellbook label; the spell_ranks chain
# collapses same-name ranks to the highest known.
- id: 932780
  name: Conflagrate
  template: 17962          # CLONE stock Conflagrate (inherit TargetAuraState 14 = consume+requirement, 10s category cd, range 4, Fire, family 5 + flagB 8388608, icon 12)
  castTimeIndex: 1        # instant (1.12; stock 17962 index 1 = instant too — pre-1.7.0 was 1.5s)
