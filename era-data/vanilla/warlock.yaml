    prereqPoints: 0
    # 2026-09-06 final review (I-18) — RE-AUTHORED from `stat` aura 55 to a `resistMiss` SPELLMOD.
    # The shipped shape was `aura: 55` (MOD_SPELL_HIT_CHANCE) + `school: 32`, and the school was a
    # NO-OP FILTER: `StatSystem.cpp` sums SPELL_AURA_MOD_SPELL_HIT_CHANCE BARE, with no school or
    # family test, so the talent silently granted +2..10% hit with EVERY school of spell — Immolate,
    # Searing Pain and Soul Fire included — instead of the Affliction set. See the framework table's
    # `op: resistMiss` row. The correct encoding is SPELLMOD_RESIST_MISS_CHANCE (misc 16), which
    # `Unit::MagicSpellHitResult` adds to the caster's hit chance ONLY for a spell the mod's
    # EffectSpellClassMask matches; it is also the era-authentic encoding (wago's own 18174-18178 are
    # `aura 107 op 16`, and the TBC twin node 20700 already ships this exact shape).
    # MASK (X1 lesson — every bit censused against family 5 in `ip-dbc/Spell.dbc` this round, not
    # assumed). `affects:` names the ten hostile Affliction spells the Vanilla `_ref.spells` table
    # carries; `affectsMask:` restates their OR — word0 0x48C41A (bit1 Corruption, bit3 Drain Life,
    # bit4 Drain Mana, bit10 Curse of Agony, bit14 Drain Soul, bit15 Curse of Weakness, bit19 Death
    # Coil, bit22 Curse of Exhaustion) and word1 0x600 (bit9 Curse of the Elements, bit10 Fear) — and
    # ADDS the three Affliction bits `_ref.spells` has no entry for but a Vanilla warlock does cast:
    # word1 bit0 0x1 Siphon Life (the era clones 932902/932919-921 inherit that bit from template
    # 35195), bit1 0x2 Curse of Doom, bit3 0x8 Howl of Terror. Final mask = (0x48C41A, 0x60B, 0).
    # CENSUS RESULT, family 5, whole DBC: every bit above is Affliction-only. The only extra records
    # any of them carries are records no warlock can LEARN — bit1 "Atrocity" 47206 (not learnable: no
    # trainer row and no talent grant; it is a mob DoT), bit10 "Test Curse
    # of Agony", bit22 "Curse of Past Burdens", word1 bit9 "Curse of Burning Shadows"/"Curse of the
    # Sepulcher", word1 bit0 "Tug Soul" — so no spellmod of ours can reach them. NOTHING Destruction
    # or Demonology intersects: Shadow Bolt 0x1, Immolate 0x4, Rain of Fire 0x20, Hellfire 0x40,
    # Shadowburn 0x80, Searing Pain 0x100, Enslave Demon 0x800, Soul Fire w1 0x80, Conflagrate
    # w1 0x800000 and Banish w1 0x8000000 are all OUTSIDE the mask — which is exactly the leak the old
    # all-school aura had.
    # DELIBERATELY EXCLUDED: word0 bit31 (Curse of Tongues). It is a SHARED category bit that also
    # names Dark Pact, Curse of Idiocy and Shadow Embrace — the over-bind the framework's
    # `affectsMask` row warns about. TBC's wago mask does carry it; this one does not.
    mechanic: spellmod
    affects:
    - Corruption
    - Curse of Agony
    - Curse of Weakness
    - Curse of the Elements
    - Curse of Exhaustion
    - Drain Life
    - Drain Mana
    - Drain Soul
    - Death Coil
    - Fear
    affectsMask: { a: 4768794, b: 1547, c: 0 }   # 0x48C41A / 0x60B / 0 — see census above
