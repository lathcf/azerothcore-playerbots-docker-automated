# encoding the priest's Shadow Vulnerability helper (932960) uses. One custom debuff per rank (the data
# proc casts a FIXED-magnitude trigger; per-rank magnitude => per-rank trigger id, cf. mage Improved
# Blizzard 932980-2). DURATION: the rows below ship `durationIndex: 29` = 12000 ms, Vanilla's own ISB
# debuff duration. (Corrected 2026-09-06, M-58: this line used to read "DurationIndex 9 = 12s (copied
# from the stock ISB debuff 17800)" and was wrong twice — index 9 is 30 s, not 12 s, and 9 happens to
# be 17800's OWN index, which is deliberately NOT copied: the stock WotLK debuff lasts 30 s.)
