# ("Shadow Vulnerability"): **ProcCharges 4, ProcTypeMask 139936**, every other field identical to the
# rows shipped here — which is also the independent corroboration the 1.12 "until 4 non-periodic
# damage sources are applied" wording gets. 139936 = 0x20 TAKEN_SPELL_MELEE_DMG_CLASS | 0x80
# TAKEN_RANGED_AUTO_ATTACK | 0x200 TAKEN_SPELL_RANGED_DMG_CLASS | 0x2000 TAKEN_SPELL_NONE_DMG_CLASS_NEG
