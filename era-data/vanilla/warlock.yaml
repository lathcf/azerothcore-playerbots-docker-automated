# --- Soul Link (node 18233, Demonology) — authentic Vanilla 30% damage redirect to the demon. ---
# Stock Soul Link (19028 activatable + 25228 split buff) is INERT on this core: there is no Soul Link
# handler in src/server (grep of 25228/19028/SoulLink is empty) and no spell_linked_spell row, so
# casting 19028 only drops a DUMMY on the pet and never applies the 25228 split. The retail routing
# (25228 uses SPELL_EFFECT_APPLY_AREA_AURA_OWNER=143 to place the SPLIT_DAMAGE_PCT aura on the pet's
# owner with the PET as caster) relies on that missing special-case, so a data-only clone can't
# reproduce it. And the split MUST be cast by the PET: Unit.cpp's SPLIT_DAMAGE_PCT loop routes the
# redirected damage to the aura's CASTER and skips when caster==victim (Unit.cpp:2613) — a warlock
# self-cast split would redirect nothing. Hence Path B (module AuraScript era_soul_link):
#   932900 = the visible warlock self-buff the node grants; on apply, era_soul_link makes the ACTIVE
#            demon cast 932901 on the warlock (pet = caster), and removes it on buff-remove.
#   932901 = the hidden 30% SPLIT_DAMAGE_PCT carrier the pet casts on the owner (no client: -> never
#            seen; Unit.cpp reads it server-side regardless of client visibility).
helpers:
- id: 932900               # Soul Link — visible warlock self-buff (granted by node 18233); scripted.
  name: Soul Link
  template: 19028          # CLONE stock Soul Link activatable -> inherit its cast visual + instant cast.
  powerCost: 270           # Vanilla Soul Link mana cost
  manaCostPct: 0           # template 19028 carries ManaCostPct 16; CalculatePowerCost ADDS pct to flat (Task 5 fix, 2026-09-05)
  rangeIndex: 1            # self (0 yd) — it is a self-buff; the demon link is resolved in script
  durationIndex: 21        # permanent (-1) — active until cancelled or the demon is gone (19028's own
                           # DurationIndex is 0, which would not persist as a buff)
  cooldown: 0
  effects:
  - effect: 6              # APPLY_AURA
    aura: 4               # DUMMY — the anchor era_soul_link hooks (OnEffectApply/Remove EFFECT_0)
    basePoints: 30        # the split % (30, Vanilla) -> passed to 932901 via CastCustomSpell
    targetA: 1            # TARGET_UNIT_CASTER (self-buff)
  client:
    name: Soul Link
    icon: 173             # stock Soul Link SpellIconID (Spell_Shadow_GatherShadows)
    description: "While active and your demon is alive, 30% of all damage taken by you is taken by your demon instead. Lasts as long as the demon is active."
    auraDescription: "30% of all damage you take is redirected to your demon."
    skillLine: 354         # Demonology tab (stock Soul Link 19028 lives here) — categorizes the spell
- id: 932901               # Soul Link split carrier — HIDDEN (no client:), pet SELF-CAST area aura.
  name: Soul Link
  # REWORKED 2026-08-16 (final pass): originally a plain APPLY_AURA the pet cast AT the owner
  # (targetA 21) — that pet->owner direct cast silently never landed the aura (live doctor: 932900
  # up, pet out, both script paths run, no 932901 on the warlock). Now the pet self-casts this and
  # SPELL_EFFECT_APPLY_AREA_AURA_OWNER (143) radiates the SPLIT_DAMAGE_PCT to the owner — the same
  # proven mechanism as the Master Demonologist helpers (119/143 family; SpellAuras.cpp applies the
  # aura to the owner with the PET as caster, which is exactly what Unit.cpp's split routing needs:
  # the warlock's split damage goes to the aura's CASTER, skipping caster==victim). Bonus lifecycle:
  # the aura dies with the pet, so a dead/dismissed demon can never leave a stale carrier.
  effects:
  - effect: 143            # SPELL_EFFECT_APPLY_AREA_AURA_OWNER — radiates pet -> owner (caster = pet)
    aura: 81               # SPELL_AURA_SPLIT_DAMAGE_PCT
    basePoints: 30         # 30% (authentic Vanilla; overridden per-cast by 932900's DUMMY amount)
    misc: 127              # all schools (physical + all magic), matching stock 25228
    targetA: 1             # TARGET_UNIT_CASTER — the pet self-casts (the proven MD_Apply pattern)
    radius: 12             # EffectRadiusIndex 12 = 100 yd (same as the MD area helpers)
  durationIndex: 21        # permanent (-1); dies with the pet, stripped by era_soul_link OnRemove
