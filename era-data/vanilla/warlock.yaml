# (the TARGET sees the debuff icon) => client: block + patch-V MPQ row (Task 12; warlock is in
# merge-into-patch DATASETS).
# CHARGE CAP — the old "TRACKED FIDELITY GAP" is **CLOSED 2026-09-05 (TBC Phase 8 back-port)**:
# `procCharges: 4` + the consume `proc:` block below. The gap was recorded when the generator had no
# `procCharges` key; it has one now (_HELPER_SCALARS -> DBC ProcCharges), and a charge with no proc
# row is never spent, so BOTH halves are required. The contract the block encodes is "consume one
# charge per NON-PERIODIC damage source taken", which is why the ProcFlags are the TAKEN_* set with
# no PROC_FLAG_TAKEN_PERIODIC bit.
# WHERE THE VALUE COMES FROM. Live 17800 (the stock 3.3.5 ISB debuff id) carries **no** `spell_proc`
# row at all and DBC ProcCharges 0 — verified 2026-09-05 by querying acore_world (`SELECT * FROM
