# ANY qualifying source spends a charge (the tooltip's "sources", not "your sources").
# NB `phaseMask` is deliberately absent: REQ_SPELL_PHASE_PROC_FLAG_MASK is `SPELL_PROC_FLAG_MASK &
# DONE_HIT_PROC_FLAG_MASK`, so a TAKEN-only row may not carry one (the generator zeroes its own
