# --- Era: Pre-Wrath Cast Times ("Pre-Wrath Warlock") — hidden PASSIVE presence marker. ------------
# SINGLE ROLE as of 2026-09-05: this marker arms CORE PATCH 0019 (SpellInfo::CalcCastTime), which
# checks HasAura(932930) on the caster and — only for a Corruption rank — restores the pre-Wrath 2 s
# base cast time BEFORE ModSpellCastTime, so the Improved Corruption cast-time SPELLMOD (Vanilla node
# 18202 / TBC node 20701) has something to reduce.
# GRANTED TO **BOTH** PRE-WRATH ERAS. `ReconcileBaselineSpells` must hand it to a Vanilla warlock AND
# to a TBC warlock (stripped from WotLK and non-warlocks) — widening that grant condition from
# `era == ERA_VANILLA` to `era != ERA_WOTLK` is Task 5's C++ change and is NOT in EraTalents.cpp yet;
# this row and its client name ship ahead of it. The reason is that TBC Corruption is ALSO a 2 s cast at
# every rank (172/6222/6223/7648/11671/11672/25311 are all CastingTimeIndex 5 in wago 2.5.4; WotLK 3.0
# is what made it instant). That is why the client name is "Pre-Wrath Warlock" and not "Vanilla
# Warlock". The server-side `name:` is deliberately left at "Era: Vanilla Cast Times" — it is what
# `.eratalents doctor` and the existing reconcile comments already print, and only the CLIENT string
# is player-visible.
# THE TRAINER-GATE JOB MOVED OFF THIS ID (TBC Phase 8, 2026-09-05). 932930 used to double as the
# trainer_spell ReqAbility1 gate for the custom Vanilla Create Firestone/Spellstone chains
# (932922-932928). Once a TBC warlock carries 932930 too, that gate would leak the VANILLA stones
# onto the TBC trainer, so the gate moves to the new Vanilla-ONLY marker 932994 below. Both halves of
# that move — the `UPDATE trainer_spell SET ReqAbility1=932994 ...` and the reconcile arm that grants
# 932994 — are Task 5's (hand SQL 2026_09_07_02 + the CLASS_WARLOCK block). The `client:` block stays regardless — see the trainer-UI crash note.
# Inert marker: a SPELL_AURA_DUMMY carrying misc 5 (DUMMY-marker registry #5). No template
# (template-less like 932901), so the row is a clean synthetic passive.
#
# The `client:` block (name + icon, no text) is REQUIRED for any marker that is — or may become — a
# trainer ReqAbility: a reqAbility spell with NO client Spell.dbc row makes the Blizzard trainer UI
# (ClassTrainer_SetSelection -> format) get a nil requirement name and crash ("bad argument #2 to
# 'format'"). NO `skillLine:` on purpose — passive+hidden keeps it out of the spellbook, and no
# skillLine keeps it out of any tab (no SkillLineAbility row). Same fix + reasoning as the shaman
# totem markers 932416/932417 (era-data/vanilla/shaman.yaml). The requirement line shows greyed/met
# for the era that carries it — an accepted cosmetic of the reqAbility gate.
- id: 932930
  name: "Era: Vanilla Cast Times"
  attributes: 262608       # PASSIVE + hidden (same mask as the VE proc-passive 932950) -> self-applies on learn
  effects:
  - effect: 6             # APPLY_AURA
    aura: 4              # SPELL_AURA_DUMMY — inert; the core patch only tests HasAura(932930)
    basePoints: 0
    misc: 5              # DUMMY-marker registry #5 (Corruption era cast-time)
    targetA: 1           # TARGET_UNIT_CASTER (self-buff, permanent while learned)
  client:
    name: "Pre-Wrath Warlock"  # was "Vanilla Warlock" — a TBC warlock carries this marker too (no skillLine -> not in spellbook)
    icon: 1
